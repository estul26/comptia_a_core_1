name: Apply final scope labels
on:
  push:
    branches: [fix/final-scope-labels]
    paths: [.github/workflows/patch-final-scope.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/patch_final_scope.py
      - name: Verify source unchanged
        run: git diff --exit-code -- source/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CONTENT_AUDIT_220_1201.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: complete final scope labeling"
          git push origin HEAD:fix/final-scope-labels
