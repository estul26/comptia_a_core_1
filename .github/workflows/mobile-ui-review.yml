name: Mobile UI review screenshots
on:
  push:
    branches: [audit/ui-ux-mobile-review]
    paths: [.github/workflows/mobile-ui-review.yml]
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
      - name: Capture interaction states
        run: |
          python3 -m http.server 8080 >/tmp/server.log 2>&1 &
          cat > review.mjs <<'JS'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:8080/',{waitUntil:'networkidle'});
          const metric=async(label)=>{
            const x=await page.evaluate(()=>({
              innerWidth:innerWidth,clientWidth:document.documentElement.clientWidth,scrollWidth:document.documentElement.scrollWidth,
              bodyScrollWidth:document.body.scrollWidth,
              top:(()=>{const e=document.querySelector('.top');const r=e?.getBoundingClientRect();return e?{position:getComputedStyle(e).position,top:Math.round(r.top),bottom:Math.round(r.bottom),height:Math.round(r.height)}:null})(),
              reader:(()=>{const e=document.querySelector('.reader');const r=e?.getBoundingClientRect();return e?{top:Math.round(r.top),height:Math.round(r.height)}:null})(),
              panes:[...document.querySelectorAll('.pane')].map(e=>{const r=e.getBoundingClientRect();return {h:Math.round(r.height),scrollHeight:e.scrollHeight,clientHeight:e.clientHeight,overflow:getComputedStyle(e).overflowY}}),
              bottom:(()=>{const e=document.querySelector('.bottom');const r=e?.getBoundingClientRect();return e?{top:Math.round(r.top),bottom:Math.round(r.bottom),position:getComputedStyle(e).position}:null})()
            }));
            console.log('METRIC',label,JSON.stringify(x));
          };
          await metric('top');
          const summary=page.locator('details.more-menu > summary');
          console.log('MORE_SUMMARY_COUNT',await summary.count());
          await summary.click();
          await page.waitForTimeout(100);
          await page.screenshot({path:'ui-review/more-open.png'});
          const menuItems=await page.locator('.more-popover button,.more-popover select,.more-popover input').evaluateAll(els=>els.map(e=>{const r=e.getBoundingClientRect();return {text:(e.innerText||e.value||e.title||'').trim(),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),right:Math.round(r.right)}}));
          console.log('MENU_ITEMS',JSON.stringify(menuItems,null,2));
          await page.keyboard.press('Escape');
          // Select objective 1.1
          const sel=page.locator('select[aria-label="Jump to objective"]');
          const opts=await sel.locator('option').allTextContents();
          const idx=opts.findIndex(x=>x.includes('1.1'));
          if(idx>=0){const v=await sel.locator('option').nth(idx).getAttribute('value');await sel.selectOption(v);await page.waitForTimeout(150);}
          await page.evaluate(()=>window.scrollTo(0,1100));
          await page.waitForTimeout(100);
          await metric('scroll1100');
          await page.screenshot({path:'ui-review/scrolled.png'});
          // Cards mode
          await page.evaluate(()=>window.scrollTo(0,0));
          const cards=page.getByRole('button',{name:/Cards/i});
          await cards.click(); await page.waitForTimeout(150);
          await page.screenshot({path:'ui-review/cards.png'});
          await metric('cards');
          // English only
          const lang=page.locator('select[aria-label="Language layout"]');
          const langOpts=await lang.locator('option').allTextContents();
          console.log('LANG_OPTIONS',JSON.stringify(langOpts));
          if(langOpts.length>1){const v=await lang.locator('option').nth(1).getAttribute('value');await lang.selectOption(v);await page.waitForTimeout(100);}
          await page.screenshot({path:'ui-review/english-only.png'});
          await browser.close();
          JS
          mkdir -p ui-review
          node review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-review-2
          path: ui-review/
