name: Inspect Objective 3.6 power supply content

on:
  push:
    branches:
      - fix/objective-3-6-power-supply
    paths:
      - .github/workflows/inspect-objective-3-6.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact Objective 3.6 anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.find('"id": "3.6"')
          end = text.find('"id": "3.7"', start)
          en_marker = text.find('"english": "', start, end)
          ug_marker = text.find('", "uyghur": "', en_marker, end)
          en_start = en_marker + len('"english": "')
          ug_start = ug_marker + len('", "uyghur": "')
          english = text[en_start:ug_marker]
          uyghur = text[ug_start:end]

          print('=== ENGLISH START ===')
          print(english[:4200])
          print('=== ENGLISH OVERSIZE ===')
          p = english.find('Conversely, choosing a PSU with excessive wattage')
          print(english[p-500:p+1800])
          print('=== ENGLISH UPS START ===')
          q = english.find('Lastly, in situations where there are sudden and unexpected power interruptions')
          print(english[q:q+1800])

          print('=== UYGHUR INPUT ===')
          p = uyghur.find('### Input Voltage')
          print(uyghur[p:p+1800])
          print('=== UYGHUR OVERSIZE ===')
          q = uyghur.find('### Wattage بەك يۇقىرى بولسا')
          print(uyghur[q:q+2200])
          print('=== UYGHUR UPS START ===')
          r = uyghur.find('## UPS — Uninterruptible Power Supply')
          print(uyghur[r:r+1200])
          PY
