name: Inspect Objective 3.4 RAID content

on:
  push:
    branches:
      - fix/objective-3-4-raid-minimums
    paths:
      - .github/workflows/inspect-objective-3-4.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print exact RAID 6/10 snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.find('"id": "3.4"')
          end = text.find('"id": "3.5"', start)
          en_marker = text.find('"english": "', start, end)
          ug_marker = text.find('", "uyghur": "', en_marker, end)
          en_start = en_marker + len('"english": "')
          ug_start = ug_marker + len('", "uyghur": "')
          english = text[en_start:ug_marker]
          uyghur = text[ug_start:end]

          for label, body in [('ENGLISH', english), ('UYGHUR', uyghur)]:
              print(f'=== {label} RAID 5-10 ===')
              p = body.find('RAID 5')
              q = body.find('Removable', p)
              if q < 0:
                  q = min(len(body), p + 7000)
              print(body[p:q])
          PY
