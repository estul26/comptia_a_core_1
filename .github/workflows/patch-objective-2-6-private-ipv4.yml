name: Apply Objective 2.6 private IPv4 fix

on:
  push:
    branches:
      - fix/objective-2-6-private-ipv4
    paths:
      - .github/workflows/patch-objective-2-6-private-ipv4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded Objective 2.6 patch
        run: python3 .tmp/patch_obj26.py
      - name: Verify source transcript unchanged
        run: git diff --exit-code -- source/
      - name: Commit Objective 2.6 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_2_6_REVIEW.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: add Objective 2.6 private IPv4 ranges"
          git push origin HEAD:fix/objective-2-6-private-ipv4
