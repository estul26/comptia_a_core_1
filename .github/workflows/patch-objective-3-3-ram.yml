name: Apply Objective 3.3 RAM terminology fix

on:
  push:
    branches:
      - fix/objective-3-3-ram-terminology
    paths:
      - .github/workflows/patch-objective-3-3-ram.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Correct bounded extra Objective 3.3 theta artifact
        run: python3 .tmp/prefix_obj33_theta.py
      - name: Apply bounded Objective 3.3 patch
        run: python3 .tmp/patch_obj33.py
      - name: Verify source transcript unchanged
        run: git diff --exit-code -- source/
      - name: Commit Objective 3.3 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_3_3_REVIEW.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: clarify Objective 3.3 RAM terminology"
          git push origin HEAD:fix/objective-3-3-ram-terminology
