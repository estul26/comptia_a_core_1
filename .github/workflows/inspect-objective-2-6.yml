name: Inspect Objective 2.6 private IPv4 content

on:
  push:
    branches:
      - fix/objective-2-6-private-ipv4
    paths:
      - .github/workflows/inspect-objective-2-6.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded Objective 2.6 private IPv4 snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.find('"id": "2.6"')
          end = text.find('"id": "2.7"', start)
          if start < 0 or end < 0:
              raise SystemExit('Objective 2.6 bounds not found')
          en_marker = text.find('"english": "', start, end)
          ug_marker = text.find('\", \"uyghur\": \"', en_marker, end)
          if en_marker < 0 or ug_marker < 0:
              raise SystemExit('Language bounds not found')
          en_start = en_marker + len('"english": "')
          ug_start = ug_marker + len('\", \"uyghur\": \"')
          english = text[en_start:ug_marker]
          uyghur = text[ug_start:end]

          print('=== ENGLISH PRIVATE IPV4 WINDOW ===')
          candidates = [english.find('private IPv4'), english.find('private IP'), english.find('Private IPv4'), english.find('Private IP')]
          candidates = [x for x in candidates if x >= 0]
          if not candidates:
              raise SystemExit('English private IPv4 anchor not found')
          p = min(candidates)
          print(english[max(0,p-1200):p+4000])

          print('=== UYGHUR PRIVATE IPV4 WINDOW ===')
          candidates = [uyghur.find('private IPv4'), uyghur.find('Private IPv4'), uyghur.find('private IP'), uyghur.find('Public IPv4')]
          candidates = [x for x in candidates if x >= 0]
          if not candidates:
              raise SystemExit('Uyghur private IPv4 anchor not found')
          q = min(candidates)
          print(uyghur[max(0,q-1400):q+5000])
          PY
