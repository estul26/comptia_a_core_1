name: Apply Objective 1.2 track point fix

on:
  push:
    branches:
      - fix/objective-1-2-track-point
    paths:
      - .github/workflows/patch-objective-1-2-trackpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded Objective 1.2 patch
        run: python3 .tmp/patch_obj12_trackpoint.py
      - name: Verify source transcript unchanged
        run: git diff --exit-code -- source/
      - name: Commit Objective 1.2 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_1_2_REVIEW.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: add Objective 1.2 track point coverage"
          git push origin HEAD:fix/objective-1-2-track-point
