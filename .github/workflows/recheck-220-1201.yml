name: Recheck remaining 220-1201 audit items

on:
  push:
    branches:
      - audit/recheck-220-1201
    paths:
      - .github/workflows/recheck-220-1201.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect remaining candidate items
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          def obj(a,b):
              s=text.find(f'"id": "{a}"'); e=text.find(f'"id": "{b}"',s)
              return text[s:e]

          for oid,nxt,terms in [
              ('2.1','2.2',['SNMP','161','162']),
              ('3.2','3.3',['serial transmission','USB 1','blue','100BASE-TX']),
              ('3.4','3.5',['xD','MiniSD','removable']),
          ]:
              body=obj(oid,nxt)
              print(f'=== OBJECTIVE {oid} ===')
              positions=[body.lower().find(t.lower()) for t in terms if body.lower().find(t.lower())>=0]
              for p in sorted(set(positions)):
                  print(body[max(0,p-1000):p+2600])
                  print('---')
          PY
