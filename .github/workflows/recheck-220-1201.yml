name: Final remaining-scope audit

on:
  push:
    branches:
      - audit/recheck-220-1201
    paths:
      - .github/workflows/recheck-220-1201.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print compact remaining-scope findings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          def o(a,b):
              s=t.find(f'"id": "{a}"'); e=t.find(f'"id": "{b}"',s); return t[s:e]
          for oid,nxt,term in [('2.1','2.2','SNMP'),('3.2','3.3','USB 1.0'),('3.4','3.5','### MiniSD'),('3.4','3.5','### xD Card')]:
              b=o(oid,nxt); p=b.find(term)
              print(f'[{oid} {term}]')
              print(b[max(0,p-350):p+1300] if p>=0 else 'NOT FOUND')
              print('---')
          PY
