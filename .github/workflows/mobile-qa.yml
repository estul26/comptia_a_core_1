name: Mobile QA

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "package.json"
      - "playwright.config.cjs"
      - "tests/**"
      - ".github/workflows/mobile-qa.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "package.json"
      - "playwright.config.cjs"
      - "tests/**"
      - ".github/workflows/mobile-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mobile regression tests
        run: npm run test:mobile

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-screenshots-${{ github.run_id }}
          path: artifacts/mobile-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-failures-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
