name: Inspect Objective 3.7 printer setup content

on:
  push:
    branches:
      - fix/objective-3-7-printer-setup
    paths:
      - .github/workflows/inspect-objective-3-7.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded Objective 3.7 setup snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.find('"id": "3.7"')
          end = text.find('"id": "3.8"', start)
          if start < 0 or end < 0:
              raise SystemExit('Objective 3.7 bounds not found')
          en_marker = text.find('"english": "', start, end)
          ug_marker = text.find('", "uyghur": "', en_marker, end)
          if en_marker < 0 or ug_marker < 0:
              raise SystemExit('Language bounds not found')
          en_start = en_marker + len('"english": "')
          ug_start = ug_marker + len('", "uyghur": "')
          english = text[en_start:ug_marker]
          uyghur = text[ug_start:end]

          print('=== ENGLISH START / UNBOX / LOCATION ===')
          anchors = ['unbox', 'Unbox', 'location', 'setup', 'set-up', '3D printer']
          pos = [english.find(a) for a in anchors if english.find(a) >= 0]
          p = min(pos) if pos else 0
          print(english[max(0,p-1500):p+8000])

          print('=== UYGHUR START / UNBOX / LOCATION ===')
          anchors = ['unbox', 'Unbox', 'location', 'setup', 'set-up', '3D printer', 'Printer']
          pos = [uyghur.find(a) for a in anchors if uyghur.find(a) >= 0]
          q = min(pos) if pos else 0
          print(uyghur[max(0,q-1800):q+9500])
          PY
