name: Inspect Objective 2.2 Wi-Fi terminology

on:
  push:
    branches:
      - fix/objective-2-2-wifi-term
    paths:
      - .github/workflows/inspect-objective-2-2-wifi.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded Objective 2.2 Wi-Fi snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.find('"id": "2.2"')
          end = text.find('"id": "2.3"', start)
          if start < 0 or end < 0:
              raise SystemExit('Objective 2.2 bounds not found')
          en_marker = text.find('"english": "', start, end)
          ug_marker = text.find('\", \"uyghur\": \"', en_marker, end)
          if en_marker < 0 or ug_marker < 0:
              raise SystemExit('Language bounds not found')
          en_start = en_marker + len('"english": "')
          ug_start = ug_marker + len('\", \"uyghur\": \"')
          english = text[en_start:ug_marker]
          uyghur = text[ug_start:end]

          print('=== ENGLISH WI-FI WINDOW ===')
          candidates = [english.find('wireless fidelity'), english.find('Wireless Fidelity'), english.find('Wi-Fi')]
          candidates = [x for x in candidates if x >= 0]
          if not candidates:
              raise SystemExit('English Wi-Fi anchor not found')
          p = min(candidates)
          print(english[max(0,p-1800):p+5000])

          print('=== UYGHUR WI-FI WINDOW ===')
          candidates = [uyghur.find('wireless fidelity'), uyghur.find('Wireless Fidelity'), uyghur.find('Wi-Fi')]
          candidates = [x for x in candidates if x >= 0]
          if not candidates:
              raise SystemExit('Uyghur Wi-Fi anchor not found')
          q = min(candidates)
          print(uyghur[max(0,q-2200):q+6500])
          PY
