name: Apply Objective 2.2 Wi-Fi terminology fix

on:
  push:
    branches:
      - fix/objective-2-2-wifi-term
    paths:
      - .github/workflows/patch-objective-2-2-wifi.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded Objective 2.2 patch
        run: python3 .tmp/patch_obj22_wifi.py
      - name: Verify source transcript unchanged
        run: git diff --exit-code -- source/
      - name: Commit Objective 2.2 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_2_2_REVIEW.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: correct Objective 2.2 Wi-Fi terminology"
          git push origin HEAD:fix/objective-2-2-wifi-term
