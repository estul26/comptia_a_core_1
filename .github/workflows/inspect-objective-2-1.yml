name: Inspect Objective 2.1 embedded content

on:
  push:
    branches:
      - fix/objective-2-1-ports
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded Objective 2.1 excerpts
        shell: python
        run: |
          from pathlib import Path

          text = Path("index.html").read_text(encoding="utf-8")
          for needle in ["NetBIOS", "IMAP"]:
              positions = []
              start = 0
              while True:
                  i = text.find(needle, start)
                  if i < 0:
                      break
                  positions.append(i)
                  start = i + len(needle)

              print(f"\n=== {needle}: {len(positions)} occurrences ===")
              for n, i in enumerate(positions, 1):
                  print(f"\n--- occurrence {n} @ {i} ---")
                  lo = max(0, i - 350)
                  hi = min(len(text), i + 1600)
                  print(text[lo:hi])
