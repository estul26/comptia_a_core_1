name: Inspect Objective 4.1 VM requirements

on:
  push:
    branches:
      - fix/objective-4-1-vm-requirements
    paths:
      - .github/workflows/inspect-objective-4-1.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print bounded Objective 4.1 requirement snippets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.find('"id": "4.1"')
          end = text.find('"id": "4.2"', start)
          if start < 0 or end < 0:
              raise SystemExit('Objective 4.1 bounds not found')
          en_marker = text.find('"english": "', start, end)
          ug_marker = text.find('", "uyghur": "', en_marker, end)
          if en_marker < 0 or ug_marker < 0:
              raise SystemExit('Language bounds not found')
          en_start = en_marker + len('"english": "')
          ug_start = ug_marker + len('", "uyghur": "')
          english = text[en_start:ug_marker]
          uyghur = text[ug_start:end]

          for label, body in [('ENGLISH', english), ('UYGHUR', uyghur)]:
              print(f'=== {label} CLIENT VM / REQUIREMENTS ===')
              anchors = ['allocate', 'resources', 'security', 'networking', 'storage']
              ps = [body.lower().find(a) for a in anchors if body.lower().find(a) >= 0]
              p = min(ps) if ps else 0
              print(body[max(0,p-2200):p+11000])
          PY
