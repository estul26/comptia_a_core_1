name: Apply final v4 terminology alignment
on:
  push:
    branches: [audit/final-27-objective-verification]
    paths: [.github/workflows/apply-final-alignment.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .tmp/final_alignment.py
      - name: Verify source unchanged
        run: git diff --exit-code -- source/
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_1_3_REVIEW.md OBJECTIVE_3_8_REVIEW.md OBJECTIVE_4_1_REVIEW.md OBJECTIVE_5_1_REVIEW.md TRANSCRIPT_CORRECTIONS.md FINAL_VERIFICATION_220_1201.md
          git commit -m "fix: align final v4 objective terminology"
          git push origin HEAD:audit/final-27-objective-verification
