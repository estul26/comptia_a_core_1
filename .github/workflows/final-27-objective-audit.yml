name: Inspect final audit marker gaps
on:
  push:
    branches: [audit/final-27-objective-verification]
    paths: [.github/workflows/final-27-objective-audit.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          order=['1.1','1.2','1.3','2.1','2.2','2.3','2.4','2.5','2.6','2.7','2.8','3.1','3.2','3.3','3.4','3.5','3.6','3.7','3.8','4.1','4.2','5.1','5.2','5.3','5.4','5.5','5.6']
          def b(x):
              i=order.index(x);s=t.find(f'"id": "{x}"');e=t.find(f'"id": "{order[i+1]}"',s) if i+1<len(order) else len(t);return t[s:e]
          cases=[
            ('1.2',['Micro','Mini']),
            ('1.3',['triangulation','location']),
            ('3.2',['Micro-USB','Mini-USB']),
            ('3.5',['Micro ATX','multi-socket','boot order']),
            ('3.6',['3.3 V','5 V','12 V']),
            ('3.8',['pickup roller','feed roller','feeder']),
            ('4.1',['legacy','cross-platform','application virtualization']),
            ('5.1',['Black screen','Blank screen']),
          ]
          for oid,terms in cases:
              x=b(oid); print('===',oid,'===')
              for term in terms:
                  p=x.lower().find(term.lower())
                  print('TERM',term,'POS',p)
                  if p>=0: print(x[max(0,p-500):p+1800])
          PY
