name: Apply Objective 4.1 VM requirements fix

on:
  push:
    branches:
      - fix/objective-4-1-vm-requirements
    paths:
      - .github/workflows/patch-objective-4-1-requirements.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded Objective 4.1 patch
        run: python3 .tmp/patch_obj41_requirements.py
      - name: Verify source transcript unchanged
        run: git diff --exit-code -- source/
      - name: Commit Objective 4.1 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_4_1_REVIEW.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: add Objective 4.1 VM requirements"
          git push origin HEAD:fix/objective-4-1-vm-requirements
