name: Apply Objective 2.8 cable tester fix

on:
  push:
    branches:
      - fix/objective-2-8-cable-tester
    paths:
      - .github/workflows/patch-objective-2-8-tester.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply bounded Objective 2.8 patch
        run: python3 .tmp/patch_obj28_tester.py
      - name: Verify source transcript unchanged
        run: git diff --exit-code -- source/
      - name: Commit Objective 2.8 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html OBJECTIVE_2_8_REVIEW.md TRANSCRIPT_CORRECTIONS.md
          git commit -m "fix: correct Objective 2.8 cable tester guidance"
          git push origin HEAD:fix/objective-2-8-cable-tester
