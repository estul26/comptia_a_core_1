vice\n\nبولۇپ، charging، battery، port، display/touch، wireless connection، performance ۋە application مەسىلىلىرىگە ئۇچرىشى مۇمكىن.\n\nبۇ reviewed lesson ھەر مەسىلىنى:\n\n1. **Symptom**\n2. **Possible source cause**\n3. **Source check/action**\n4. **Exam memory**\n\nشەكلىدە تەشكىللەيدۇ.\n\n---\n\n# 1. Improper Charging\n\n## Symptom\n\nMobile device:\n- charge بولمايدۇ\n- ناھايىتى ئاستا charge بولىدۇ\n- charging connection تۇراقسىز\n\n## Possible Cause 1 — Bad Charging Cable\n\nDamaged/faulty cable:\n- charger دىن device قا electrical power flow نى توسۇشى مۇمكىن\n\n## Possible Cause 2 — Poor Port Connection\n\nCharging cable بىلەن device port ئارىسىدىكى connection:\n- loose\n- ياكى unstable\n\nبولۇشى مۇمكىن.\n\nPort ئىچىدىكى:\n- dust\n- debris\n\nمۇ connection غا توسالغۇ بولۇشى مۇمكىن.\n\n## Possible Cause 3 — Mismatched Power Rating\n\nTranscript charger بىلەن device ئارىسىدىكى power rating mismatch نى possible cause سۈپىتىدە بېرىدۇ.\n\nSource says:\n- insufficient charger power → slow charging ياكى failure to charge\n- higher-than-required power rating → battery غا ۋاقىت ئۆتۈشى بىلەن damage risk پەيدا قىلىشى مۇمكىن\n\n**Source-framing caution:** reviewed Uyghur بۇنى transcript نىڭ own teaching claim ى سۈپىتىدە ساقلايدۇ؛ modern charging negotiation/protocol behavior نى سىرتتىن قوشمايدۇ ياكى بۇ claim نى universal rule دەپ كېڭەيتمەيدۇ.\n\n**Exam memory: Charging problem → Cable → Port/connection/debris → Power rating**\n\n---\n\n# 2. Poor Battery Health\n\n## Source-Stated Causes\n\n### Long-Term Usage / Charge Cycles\nBattery:\n- repeatedly charge/discharge بولغانسېرى\n- ۋاقىت ئۆتۈشى بىلەن degrade بولۇشى مۇمكىن\n\n### Battery Aging\nBattery age ئۆسكەنسېرى:\n- charge hold قىلىش capacity سى تۆۋەنلەيدۇ\n- battery life/performance تۆۋەنلەيدۇ\n\n### Improper Charging\nSource:\n- improper charging battery decline نى تېزلىتىشى مۇمكىن\n\nدەپ چۈشەندۈرىدۇ.\n\n## Warning Clues\n\n- device hot to the touch\n- charge نى ساقلىيالمايدۇ\n\nبۇلار source بويىچە poor battery health نىڭ serious clues ى.\n\n**Exam memory: Poor battery health → Aging / charge cycles / charging problems**\n\n---\n\n# 3. Swollen Battery — Critical Safety Issue\n\n**Swollen battery**\n- device casing دا bulge پەيدا قىلىشى مۇمكىن\n- device overheating بىلەن بىللە كۆرۈلۈشى مۇمكىن\n\nSource explanation:\n- internal chemical reaction\n- gas buildup\n- battery expansion\n\n## Physical Clues\n\nBattery expansion device نى deformation قىلىشى مۇمكىن.\n\nSource examples:\n- trackpad/button نى نورمال click قىلالماسلىق\n- keyboard key نى بېسىش قىيىنلىشىش\n- device flat surface ئۈستىدە level تۇرماسلىق\n- wall outlet قا plugged in بولغاندا overheating كۆرۈلۈشى\n\n## Source Safety Action\n\nSwollen battery suspected بولسا:\n\n1. **Device نى ئىشلىتىشنى توختىتىڭ**\n2. **Professional assistance ئىزدەڭ**\n3. **Battery replacement نى promptly address قىلىڭ**\n\nSource warns ignored swollen battery may lead to:\n- leakage\n- fire\n- explosion\n\n**Exam memory: Swollen battery = Stop using device + Professional battery replacement**\n\n---\n\n# 4. Physically Damaged Charging / I/O Port\n\n## Symptom\n\nDevice:\n- charge connection establish قىلالمايدۇ\n- accessories/peripherals نى port ئارقىلىق ئىشلىتەلمەيدۇ\n\n## Source-Stated Causes\n\nPort damage:\n- mishandling\n- accidental impact\n- moisture exposure\n\nبىلەن مۇناسىۋەتلىك بولۇشى مۇمكىن.\n\n## First Source Check\n\n> **Known-good / replacement cable بىلەن test قىلىڭ.**\n\nمەقسەت:\n- cable faulty مۇ؟\n- port faulty مۇ؟\n\nئايرىش.\n\n**Exam memory: Suspected bad port → Test another cable first**\n\n---\n\n# 5. Mobile Device Overheating\n\nBattery problem overheating نىڭ بىر source cause ى بولالايدۇ.\n\nمەنبە يەنە تۆۋەندىكى causes نى قاپلايدۇ:\n\n## Prolonged Usage\nDevice نى ئۇزاق ئىشلىتىش:\n- processor workload نى كۆپەيتىشى\n- heat generation نى ئاشۇرۇشى\n\nمۇمكىن.\n\n## Background Applications\n\nToo many/resource-heavy background apps:\n- processor/system resources نى كۆپ ئىشلىتىدۇ\n- heat نى ئاشۇرۇشى مۇمكىن\n\n## Wi-Fi Hotspot\n\nSource:\n- device نى ئۇزاق ۋاقىت Wi-Fi hotspot قىلىپ ئىشلىتىش\n- workload نى ئاشۇرۇپ overheating غا تۆھپە قوشۇشى مۇمكىن\n\n## GPS / Other Connections\n\nSource:\n- GPS غا ئوخشاش connection/service لارنى unnecessary ئۇزاق ئىشلىتىش\n- hardware strain نى ئاشۇرۇشى مۇمكىن\n\nدەپ چۈشەندۈرىدۇ.\n\n**Exam memory: Mobile overheating → Battery health / prolonged use / background apps / hotspot / GPS**\n\n---\n\n# 6. Liquid Damage\n\n## Source Symptoms\n\nLiquid damage بولسا:\n- screen ئاستىدا water/moisture كۆرۈنۈشى\n- graphic/display distortion\n\nبولۇشى مۇمكىن.\n\nVisible sign بولمىسىمۇ:\n- liquid exposure suspected بولسا caution كېرەك\n\n## Source Action Flow\n\nTranscript تۆۋەندىكى sequence نى بېرىدۇ:\n\n1. **Device نى promptly power off قىلىڭ**\n2. Visible liquid/moisture نى remove قىلىڭ\n3. Internal component exposure suspected بولسا source thorough drying ئۈچۈن device disassembly نى تىلغا ئالىدۇ\n4. Dry بولغاندىن كېيىن circuit boards ۋە contacts نى clean قىلىشنى source تەۋسىيە قىلىدۇ\n\n**Source-safety/scope note:** بۇ reviewed lesson transcript نىڭ repair workflow ىنى study content سۈپىتىدە ساقلايدۇ. It does not add rice, heat-gun, chemical, charging, or model-specific disassembly instructions that are absent from the source.\n\n**Exam memory: Suspected liquid damage → Power off first**\n\n---\n\n# 7. Broken / Cracked Screen\n\n## Symptom\n\nScreen:\n- cracked\n- shattered\n\nبولسا:\n- visibility تۆۋەنلەيدۇ\n- usability تۆۋەنلەيدۇ\n- physical safety risk بولۇشى مۇمكىن\n\n## Source Action\n\n- screen replacement نى consider قىلىش\n\n## Important Source Check After Screen Work\n\nScreen رايونىدا ياكى ئۇنىڭ ئەتراپىدا:\n- webcam\n- microphone\n- wireless antennas\n\nغا ئوخشاش components بار بولۇشى مۇمكىن.\n\nScreen replacement/repair دىن كېيىن:\n- بۇ functions operational مۇ؟\n\nتەكشۈرۈش كېرەك.\n\n**Exam memory: Broken screen → Replace screen + Verify nearby webcam/mic/antenna functions**\n\n---\n\n# 8. Digitizer / Touchscreen Problems\n\n## Digitizer دېگەن نېمە؟\n\n**Digitizer**\n- touch input نى detect\n- interpret\n\nقىلىدىغان component.\n\n## Symptom\n\nDisplay image normal بولۇشى مۇمكىن، ئەمما:\n- touch register بولمايدۇ\n- touch inaccurate\n- taps/icons response يوق\n- virtual keyboard نى ئىشلىتىش قىيىن\n\n## Source First Checks\n\n- tablet/PC settings نى adjust/check قىلىڭ\n- touchscreen functionality enabled مۇ؟\n- properly configured مۇ؟\n\n## If Still Unresponsive\n\nSettings correct بولسىمۇ touch ئىشلىمىسە:\n- more serious underlying hardware issue\n- component repair/replacement\n\nكېرەك بولۇشى مۇمكىن.\n\n**Exam memory: Image works but touch fails → Digitizer/settings clue**\n\n---\n\n# 9. Stylus Not Working\n\nStylus problem digitizer problem غا ئوخشاپ كېتىشى مۇمكىن، چۈنكى device stylus input نى recognize قىلمايدۇ.\n\nمەنبە closer troubleshooting دا stylus نىڭ ئۆزىنىمۇ تەكشۈرۈشنى تەكىتلەيدۇ.\n\n## Possible Cause 1 — Stylus Has No Power\n\nSome stylus:\n- internal battery\n- rechargeable power source\n\nئىشلىتىدۇ.\n\nBattery depleted بولسا:\n- stylus device بىلەن communication قىلالماسلىقى مۇمكىن\n\nSource action:\n- battery replace\n- ياكى recharge\n\n## Possible Cause 2 — Connectivity / Configuration\n\nSome stylus:\n- Bluetooth\n- specific driver\n- specific setting\n\nتەلەپ قىلىشى مۇمكىن.\n\nCheck:\n- paired مۇ؟\n- configured مۇ؟\n- required setting/driver enabled مۇ؟\n\n## Possible Cause 3 — Physical Damage\n\nCheck:\n- stylus tip damage\n- internal damage\n\nSource isolation method:\n- stylus نى compatible device بىلەن test قىلىش\n\nمەقسەت:\n- stylus نىڭ ئۆزى repair/replacement كېرەكمۇ؟\n\nئايرىش.\n\n**Exam memory: Stylus fails → Power → Pairing/config → Physical damage**\n\n---\n\n# 10. Cursor Drift / Touch Calibration\n\n## Symptoms\n\n### Cursor Drift\nCursor:\n- ئۆزى drift قىلىدۇ\n- erratic move قىلىدۇ\n- precise selection قىيىنلىشىدۇ\n\n### Touch Calibration Problem\nTouch:\n- intended target نى توغرا تاللىيالمايدۇ\n- input inaccurate/inconsistent\n\n## Source Cause\n\n- digitizer misaligned\n- digitizer inaccurate\n\n## Source Action\n\n> **Recalibrate the touchscreen digitizer**\n\nCalibration:\n- alignment نى correct قىلىش\n- touch responsiveness/accuracy نى restore قىلىش\n\nغا ياردەم بېرىدۇ.\n\n**Exam memory: Cursor drift / inaccurate touch → Recalibrate digitizer**\n\n---\n\n# 11. Wi-Fi / Bluetooth — No Connectivity\n\n## Symptom\n\n- Wi-Fi connection يوق\n- Bluetooth connection يوق\n\n## Source First Checks\n\n### 1. Adapter Enabled?\n- wireless adapter enabled مۇ؟\n\n### 2. Desired Network / Peripheral Correct?\n- device correct network ياكى peripheral غا connect قىلىش ئۈچۈن configured مۇ؟\n\n### 3. Antenna Connection\n- antenna properly connected مۇ؟\n\n### 4. Peripheral Battery\nWireless:\n- mouse\n- keyboard\n- headset\n\nغا ئوخشاش peripheral device لار sufficiently charged مۇ؟\n\nLow battery:\n- connectivity function نى توسۇشى مۇمكىن\n\n**Exam memory: No wireless connection → Adapter → Configuration → Antenna → Peripheral battery**\n\n---\n\n# 12. Wi-Fi / Bluetooth — Poor or Intermittent Connectivity\n\n## Source Checks\n\n### Range\n- device/peripheral reasonable range ئىچىدىمۇ؟\n\n### Pairing / Configuration\n- devices properly paired مۇ؟\n- settings correct مۇ؟\n\n### Interference\nPotential interference:\n- electronic devices\n- physical obstacles\n\nwireless signal نى disrupt قىلىشى مۇمكىن.\n\n**Exam memory: Weak/intermittent wireless → Range + Pairing + Interference**\n\n---\n\n# 13. Malware / Rogue Applications\n\nMalware:\n- mobile-device functionality\n- security\n- privacy\n\nغا خەۋپ پەيدا قىلىشى مۇمكىن.\n\n## Source Symptoms\n\n### Unexpected Behavior\n- sluggishness\n- unresponsiveness\n\n### Excessive Resource Use\nMalicious software:\n- system resource نى excessive consume قىلىشى مۇمكىن\n\n### Unauthorized Data Usage\n- unexpected mobile-data usage\n- unexpected charges\n- data allowance depletion\n\n### Sensitive Function Access\nSome malware:\n- camera\n- microphone\n- location services\n\nغا user consent بولمىغان ھالدا access قىلىشى مۇمكىن، دەپ source چۈشەندۈرىدۇ.\n\n## Source Troubleshooting Point\n\nUnusual mobile-device behavior كۆرۈلسە:\n- malware\n- rogue application\n\nنى possible cause سۈپىتىدە consider قىلىڭ.\n\n**Source-boundary note:** transcript بۇ objective دا malware-removal utility ياكى reset/remediation procedure بەرمەيدۇ؛ reviewed lesson ئۇلارنى سىرتتىن قوشمايدۇ.\n\n**Exam memory: Unexpected behavior + data/privacy activity → Consider malware/rogue app**\n\n---\n\n# 14. Degraded / Sluggish Mobile Performance\n\n## Symptoms\n\n- slow app launch\n- delayed response\n- overall unresponsiveness\n\n## Possible Cause 1 — Too Many Background Apps\n\nBackground apps:\n- memory\n- processing resource\n\nنى ئىشلىتىدۇ.\n\n## Possible Cause 2 — Insufficient Available Storage\n\nMobile OS:\n- temporary files\n- application data\n\nباشقۇرۇش ئۈچۈن free space غا ئېھتىياجلىق، دەپ source چۈشەندۈرىدۇ.\n\nLow free storage:\n- performance issue پەيدا قىلىشى مۇمكىن.\n\n## Source Actions\n\n- unnecessary applications نى close قىلىڭ\n- storage space نى free up قىلىڭ\n\n**Exam memory: Slow mobile device → Background apps + Low free storage**\n\n---\n\n# 15. Unable to Install New Applications\n\n## Possible Cause 1 — Insufficient Storage\n\nDevice دا enough free space بولمىسا:\n- OS new app download/install نى block قىلىشى مۇمكىن\n\nSource storage consumers:\n- existing applications\n- photos\n- videos\n- cached data\n\n## Possible Cause 2 — Installation Restrictions\n\nRestrictions:\n- device settings\n- parental controls\n- MDM — Mobile Device Management policies\n\nدىن كېلىشى مۇمكىن.\n\nCorporate environment دا:\n- organizational data/device protection\n- allowed application control\n\nئۈچۈن بۇ restriction لار ئىشلىتىلىشى مۇمكىن.\n\n## Source Actions\n\n1. Device storage نى review قىلىڭ\n2. Unnecessary files نى remove قىلىڭ\n3. Unused applications نى uninstall قىلىڭ\n4. Installation permission allowed مۇ؟\n5. Administrative/MDM policy restriction بارمۇ؟\n\nتەكشۈرۈڭ.\n\n**Exam memory: App won't install → Free storage + Check permissions/restrictions**\n\n---\n\n# Objective 5.4 — Symptom → Cause / Action Table\n\n| Symptom | Source-based clue/action |\n|---|---|\n| **Won’t/slowly charge** | Cable / port / debris / source-described power rating |\n| **Battery drains / gets hot** | Aging / cycles / poor battery health |\n| **Bulging device / swollen battery** | **Stop use + professional battery replacement** |\n| **Port not working** | Test known-good/replacement cable |\n| **Overheating** | Battery / long use / background apps / hotspot / GPS |\n| **Liquid damage suspected** | **Power off first** |\n| **Broken screen** | Replace; verify webcam/mic/antennas |\n| **Image works, touch fails** | Digitizer/settings |\n| **Stylus fails** | Battery/power / pairing/config / damage |\n| **Cursor drift** | Recalibrate digitizer |\n| **No Wi-Fi/Bluetooth** | Adapter / config / antenna / peripheral battery |\n| **Intermittent wireless** | Range / pairing / interference |\n| **Unexpected behavior/data use** | Malware / rogue app |\n| **Sluggish mobile device** | Background apps / low storage |\n| **Cannot install apps** | Low storage / settings / parental controls / MDM |\n\n---\n\n# Objective 5.4 — Final Exam Rules\n\n1. **Check before replace.**\n2. **Charging issue → cable, connection/port, debris, source-described power rating.**\n3. **Swollen battery → stop using the device and seek professional replacement.**\n4. **Suspected bad port → test another cable first.**\n5. **Overheating → battery health + workload/background apps + hotspot/GPS.**\n6. **Liquid suspected → power off first.**\n7. **Broken screen repair → verify nearby webcam/mic/antenna functions.**\n8. **Normal image + failed touch → digitizer/settings.**\n9. **Stylus → power, pairing/config, physical condition.**\n10. **Cursor drift → touchscreen/digitizer calibration.**\n11. **No wireless → adapter/config/antenna/peripheral battery.**\n12. **Poor wireless → range/pairing/interference.**\n13. **Strange behavior/data/privacy activity → consider malware.**\n14. **Sluggishness → background apps + storage.**\n15. **Cannot install app → free space + permissions/restrictions/MDM.**\n"}, {"id": "5.5", "number": "5.5", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam Objective 5.5, Given a Scenario, Troubleshoot Network Issues. This video segment will cover troubleshooting issues related to networking. For each of the common symptoms listed in Exam Objective 5.5, I will provide some basic information and possible root causes.\n\nAdditionally, as a pro test taking tip, you should always perform verifications, inspections or checks before performing any repairs or component replacements. Troubleshooting networking issues is crucial to maintain a reliable internet connection and ensure seamless communication between devices. One common symptom users may encounter is limited connectivity, which can manifest as the internet connection being down or displaying a message stating no internet access.\n\nWhen faced with limited connectivity, several potential issues could be causing the problem. One common troubleshooting step that can be used to isolate the root cause is to check whether the device has obtained an APIPA address. APIPA addresses are self-assigned IP addresses that devices generate when they fail to obtain an IP address from a DHCP server.\n\nIf the device has an APIPA address, it indicates a problem with the DHCP server or the device's network configuration. Another troubleshooting step involves testing connectivity by trying to communicate with a remote device or IP address. After ruling out software-based causes, you can move on to physical causes.\n\nThese include items like faulty network cables and connections. Slow network speeds is another potential networking issue. When addressing slow network speeds, several factors must be considered to pinpoint the root cause and implement effective solutions.\n\nFirst off, interface configurations, particularly speed and duplex settings, can significantly affect network performance. Incorrectly configured speed and duplex settings may lead to data packet loss or transmission errors, resulting in slow network speeds. Users should ensure that network interface cards and switches are configured to match the network's requirements for optimal performance.\n\nDamaged cables or poor connections can also contribute to slow network speeds. Inspecting cables for signs of wear and tear and securely connecting them to network devices can help mitigate this issue. Network congestion occurs when the volume of data traffic exceeds the network's capacity, leading to packet loss and slower transmission speeds.\n\nIdentifying and addressing congestion points, such as overloaded switches or routers, can help alleviate slow network speeds. Malware infections on network devices can degrade network performance by consuming bandwidth or launching denial of service attacks. Regularly updating antivirus software and conducting network security audits can help detect and remove malware, ensuring optimal network performance.\n\nRegardless of the underlying issue, it will often speed up the troubleshooting process if you determine the scope of the slow network issue. This involves assessing whether the issue exists on a single device, a specific grouping of devices, or the entire network. Next, we have port flapping.\n\nPort flapping refers to a network issue where a port on a network device, such as a switch or router, rapidly alternates between the up and down states. This continuous fluctuation between up and down states, which is essentially the interface turning on and off, disrupts network connectivity. Port flapping typically occurs due to problems with the physical connection, such as a faulty cable or connector, or issues with the network interface card.\n\nExternal interference, such as electromagnetic interference, or EMI, poses a significant threat to the stability and reliability of wired networks. EMI can originate from various sources, including fluorescent lights, power cables, generators, and nearby signals emitted by other electronic devices. When cables are exposed to EMI, it can disrupt the transmission of data signals, leading to packet loss and overall network performance degradation.\n\nTo mitigate the impact of EMI on wired networks, it is essential to implement proper shielding and grounding techniques for network cables. Shielded cables help deflect electromagnetic fields, preventing them from interfering with the data signals. Additionally, ensuring that network cables are routed away from power cables and other potential sources of interference can further minimize the risk of EMI-induced disruptions.\n\nIn wireless network environments, EMI can present unique challenges, particularly in settings where multiple access points are deployed to facilitate wireless connectivity for users. Interference from external sources, such as microwave ovens, cordless telephones, and neighboring Wi-Fi signals can significantly disrupt wireless communication. This interference can lead to intermittent connectivity issues, slow data transfer rates, and overall poor network performance.\n\nTo address EMI-related problems in wireless networks, several strategies can be employed. One approach is to carefully select Wi-Fi channels that are less susceptible to interference from neighboring networks and other electronic devices. Additionally, investing in Wi-Fi equipment that incorporates advanced interference mitigation technologies can help minimize the impact of EMI on network performance.\n\nThese technologies may include signal filtering mechanisms or adaptive channel selection algorithms, which work together to optimize signal quality and reliability in the presence of external interference. Intermittent wireless connectivity, a prevalent issue in wireless networks, can stem from various factors. Alongside the electromagnetic interference we previously discussed, physical obstructions like walls, furniture, or other obstacles can weaken wireless signals, leading to signal loss or degradation.\n\nAdditionally, the distance between a client device and an access point can exacerbate signal attenuation. Moreover, faulty hardware, such as network interface cards or access points, can compound intermittent wireless connectivity problems. If hardware components are malfunctioning or outdated, they may struggle to establish a stable connection or maintain consistent signal strength.\n\nLatency, in simple terms, refers to the time it takes for data to travel from one point to another in a network and is often measured in milliseconds. This can also be thought of as the delay between sending a message and receiving a response. Several factors can contribute to latency issues.\n\nFirstly, the physical distance between devices has a direct impact on latency. Understandably, the farther apart two devices are, the longer it takes for data to travel between them. Additionally, network congestion, resulting from excessive traffic, can lead to delays or even loss of data packets, thereby increasing latency.\n\nThen there is external influences like EMI. Just about anything you can think of that would slow down network speeds would increase latency, as these two properties are inverses of each other. Therefore, addressing latency issues often involves optimizing network configurations or upgrading hardware, as these actions increase overall network speeds.\n\nJitter, in simple terms, refers to the variation in delay or the latency of data in a network. Both latency and jitter are metrics that can be used to measure network performance. But unlike latency, which measures the overall time it takes for data to travel from one point to another, jitter focuses on the inconsistency or fluctuations in the arrival time of data packets.\n\nStated another way, latency represents the average delay between sending a packet and receiving a response, while jitter indicates how much this delay varies over time. Next, we have poor voice over IP quality. This issue is rather self-explanatory and can significantly impact communication clarity and effectiveness.\n\nVoice over IP operates by transmitting voice data over the internet in real time, making it more sensitive to latency and jitter compared to other types of network traffic. Both latency and jitter can cause audio disruptions, such as audio breaking up or voice distortion, making it difficult to understand the other party during a voice over IP call. Since voice over IP relies on real-time transmission, even slight delays or fluctuations in packet arrival times can result in noticeable audio quality degradation.\n\nHigh latency can lead to delays in audio transmission, causing conversations to feel disjointed or out of sync. Similarly, excessive jitter can cause packets to arrive out of order or with inconsistent timing, resulting in audio distortion or dropouts. Addressing poor voice over IP quality involves optimizing network configurations to minimize latency and jitter.\n\nThis may include prioritizing voice over IP traffic over other data types. Additionally, upgrading network hardware and software such as routers and switches can help improve the reliability and stability of voice over IP connections. Authentication failures can also prevent users from successfully connecting to a network.\n\nThis issue occurs when a device attempts to connect to a wireless or secured network but is unable to verify the required credentials. In many cases, authentication failures are caused by entering an incorrect network password or security key. However, they may also occur when there is a mismatch between the security settings configured on the device and those used by the network, such as WPA2 or WPA3 authentication methods.\n\nVerifying the correct password, confirming that the proper wireless security protocol is selected, and reconnecting to the network can often resolve authentication issues. Lastly, users may experience intermittent internet connectivity. This issue occurs when a device remains connected to the network, but internet access repeatedly stops and resumes.\n\nUsers may notice that websites fail to load, applications lose connectivity, or online services temporarily stop responding even though the device still shows a network connection. Intermittent internet connectivity can be caused by an unstable connection from the internet service provider, network congestion, or router performance issues. Restarting networking equipment, checking router configuration, or contacting the internet service provider may help restore a stable connection.", "uyghur": "Exam Objective 5.5\nبىر ئەھۋال بېرىلگەندە، تور مەسىلىلىرىنى كاشىلا تۈگىتىڭ.\n\n# Objective 5.5 — Troubleshooting Mindset\n\nمەنبە يەنە بىر قېتىم مۇھىم CompTIA troubleshooting rule نى تەكىتلەيدۇ:\n\n> **Repair ياكى component replacement قىلىشتىن بۇرۇن، verify / inspect / check قىلىڭ.**\n\nNetwork troubleshooting دا:\n- symptom نى توغرا تونۇش\n- scope نى ئېنىقلاش\n- software/configuration cause نى physical cause دىن ئايرىش\n- connection، cable، interface ۋە network equipment نى systematic تەكشۈرۈش\n\nمۇھىم.\n\nObjective 5.5 دىكى reviewed flow:\n\n1. Symptom\n2. Possible source causes\n3. Source checks/actions\n4. Exam memory\n\n---\n\n# 1. Limited Connectivity / No Internet Access\n\n## Symptom\n\nUser:\n- Internet connection down\n- ياكى **No Internet Access**\n\nدېگەن message كۆرۈشى مۇمكىن.\n\n## Source Check 1 — APIPA Address\n\n**APIPA — Automatic Private IP Addressing**\n\nمەنبە APIPA نى:\n- DHCP server دىن IP address ئالالمىغاندا\n- device ئۆزىگە self-assigned IP address بېرىدىغان mechanism\n\nدەپ چۈشەندۈرىدۇ.\n\nئەگەر device APIPA address ئالغان بولسا:\n- DHCP server issue\n- ياكى device network configuration issue\n\nبارلىقىغا clue بولۇشى مۇمكىن.\n\n**Exam memory: APIPA → DHCP/configuration problem clue**\n\n## Source Check 2 — Test Remote Connectivity\n\n- remote device\n- ياكى remote IP address\n\nبىلەن communicate قىلىپ connection نى test قىلىڭ.\n\nمەقسەت:\n- problem local مۇ؟\n- remote/network path تىمۇ؟\n\nئايرىشقا ياردەم بېرىش.\n\n## Source Check 3 — Physical Causes\n\nSoftware/configuration cause لارنى rule out قىلغاندىن كېيىن:\n- faulty cable\n- poor connection\n\nغا ئوخشاش physical issue لارنى تەكشۈرۈڭ.\n\n**Exam memory: Limited connectivity → APIPA → Test remote connectivity → Check cables/connections**\n\n---\n\n# 2. Slow Network Speeds\n\n## Possible Cause 1 — Speed / Duplex Misconfiguration\n\nNetwork interface:\n- speed\n- duplex\n\nsettings توغرا بولمىسا:\n- packet loss\n- transmission errors\n- slow network speed\n\nپەيدا بولۇشى مۇمكىن.\n\nSource action:\n- NIC\n- switch\n\nsettings network requirement غا ماس كېلەمدۇ تەكشۈرۈڭ.\n\n**Exam memory: Slow wired network → Check speed/duplex**\n\n## Possible Cause 2 — Damaged Cables / Poor Connections\n\nDamaged cable:\n- wear\n- tear\n- poor termination/connection\n\nnetwork performance نى تۆۋەنلىتىشى مۇمكىن.\n\nSource action:\n- cable damage نى inspect قىلىڭ\n- connection secure مۇ؟\n\nتەكشۈرۈڭ.\n\n## Possible Cause 3 — Network Congestion\n\n**Network congestion**\n- data traffic network capacity دىن ئېشىپ كەتكەندە\n\nپەيدا بولىدۇ.\n\nSource effects:\n- packet loss\n- slower transmission\n\nPossible congestion point:\n- overloaded switch\n- overloaded router\n\nSource action:\n- congestion point نى identify/address قىلىش\n\n## Possible Cause 4 — Malware\n\nNetwork device دا malware:\n- bandwidth نى consume قىلىشى\n- denial-of-service activity نى قوزغىتىشى\n\nمۇمكىن، دەپ source چۈشەندۈرىدۇ.\n\nSource recommendations:\n- antivirus software نى regularly update قىلىش\n- network security audit ئېلىپ بېرىش\n\n**Source-scope note:** reviewed lesson source نىڭ high-level malware/network-security wording ىنى ساقلايدۇ؛ specific antivirus product، scan command، IDS/IPS tuning ياكى incident-response procedure قوشمايدۇ.\n\n## Determine the Scope\n\nSlow-network troubleshooting نى تېزلىتىدىغان مۇھىم source step:\n\n> **Problem scope نى ئېنىقلاڭ.**\n\nCheck:\n- one device only?\n- specific group of devices?\n- entire network?\n\n**Exam memory: Slow network → Scope first, then configuration/cable/congestion/malware**\n\n---\n\n# 3. Port Flapping\n\n**Port flapping**\n- switch ياكى router port/interface\n- rapidly **up ↔ down**\n- قايتا-قايتا on/off ھالەتكە ئۆتۈشى\n\nبىلەن مۇناسىۋەتلىك network issue.\n\nEffect:\n- unstable connectivity\n- repeated interruption\n\n## Source-Stated Causes\n\n### Physical Connection\n- faulty cable\n- faulty connector\n\n### NIC Issue\n- network interface card problem\n\n**Exam memory: Port flapping = Interface repeatedly up/down → Cable/connector/NIC**\n\n---\n\n# 4. EMI — Electromagnetic Interference on Wired Networks\n\n**EMI — Electromagnetic Interference**\n- wired network signal stability غا دەخلى قىلىدىغان electromagnetic noise\n\nSource examples:\n- fluorescent lights\n- power cables\n- generators\n- nearby electronic-device signals\n\n## Effects\n\nCable EMI غا exposed بولسا:\n- data signal disruption\n- packet loss\n- performance degradation\n\nپەيدا بولۇشى مۇمكىن.\n\n## Source Mitigation\n\n### Shielding\n- shielded cable electromagnetic field effect نى ئازايتىشقا ياردەم بېرىدۇ\n\n### Grounding\n- proper grounding technique\n\n### Cable Routing\n- network cable نى power cable ۋە interference source دىن يىراق route قىلىش\n\n**Exam memory: Wired EMI → Shielding + Grounding + Distance from power/interference sources**\n\n---\n\n# 5. Wireless Interference / EMI\n\nWireless network دا external interference source examples:\n\n- microwave oven\n- cordless telephone\n- neighboring Wi-Fi signals\n\nSource effects:\n- intermittent connectivity\n- slow data transfer\n- poor network performance\n\n## Source Mitigation\n\n### Wi-Fi Channel Selection\n- neighboring network/interference ئاز بولغان channel نى تاللاش\n\n### Interference-Mitigation Features\nSource advanced equipment example:\n- signal filtering\n- adaptive channel selection\n\n**Source-framing caution:** transcript بۇ feature لارنى interference impact نى ئازايتالايدىغان technology examples سۈپىتىدە بېرىدۇ. Reviewed Uyghur ئۇلارنى guaranteed universal fix دەپ كۆرسەتمەيدۇ.\n\n**Exam memory: Wireless interference → Channel + Environment + Equipment mitigation**\n\n---\n\n# 6. Intermittent Wireless Connectivity\n\n## Symptom\n\nWireless connection:\n- بىر ۋاقىت بار\n- بىر ۋاقىت ئۈزۈلىدۇ\n- signal strength inconsistent\n\n## Possible Cause 1 — EMI / Interference\n\nPrevious section دىكى:\n- electronics\n- neighboring Wi-Fi\n- other interference\n\n## Possible Cause 2 — Physical Obstructions\n\nSource examples:\n- walls\n- furniture\n- other obstacles\n\nSignal:\n- weaken\n- attenuate\n- degrade\n\nبولۇشى مۇمكىن.\n\n## Possible Cause 3 — Distance\n\nClient device access point دىن بەك يىراق بولسا:\n- signal attenuation كۆپىيىدۇ\n\n## Possible Cause 4 — Faulty / Outdated Hardware\n\nSource examples:\n- NIC\n- access point\n\nMalfunctioning/outdated hardware:\n- stable connection قۇرالماسلىقى\n- consistent signal strength ساقلىيالماسلىقى\n\nمۇمكىن.\n\n**Exam memory: Intermittent Wi-Fi → Interference + Obstacles + Distance + Hardware**\n\n---\n\n# 7. Latency\n\n**Latency**\n- data بىر network point دىن يەنە بىر point قا بېرىپ يېتىشكە كەتكەن ۋاقىت\n- ئادەتتە **milliseconds (ms)** بىلەن ئۆلچىنىدۇ\n\nSimple analogy:\n- message ئەۋەتكەن بىلەن response ئالغان ئارىسىدىكى delay\n\n## Source-Stated Causes\n\n### Physical Distance\n- device لار ئارىسىدىكى distance ئۇزۇن بولسا\n- travel time كۆپىيىدۇ\n\n### Network Congestion\n- excessive traffic\n- packet delay\n- packet loss\n\nlatency نى ئاشۇرۇشى مۇمكىن.\n\n### EMI / Other Slowdowns\nSource:\n- EMI\n- network speed نى تۆۋەنلىتىدىغان باشقا factors\n\nlatency غا تەسىر قىلىشى مۇمكىن.\n\n## Source Remedy Direction\n\n- network configuration optimization\n- hardware upgrade\n\noverall network performance نى ياخشىلاشقا ياردەم بېرىشى مۇمكىن.\n\n### Source-Model Caution\n\nTranscript network speed ۋە latency نى «inverse» relationship قا ئوخشاش ئاددىي teaching wording بىلەن باغلايدۇ.\n\nReviewed Uyghur exam point:\n- slow/congested/problematic network often experiences higher delay\n- latency = delay metric\n\nدەپ ساقلايدۇ.\n\nبۇنى mathematically universal inverse law دەپ كېڭەيتمەيدۇ.\n\n**Exam memory: Latency = How long packets take**\n\n---\n\n# 8. Jitter\n\n**Jitter**\n- network packet delay/latency نىڭ **variation**\n- packet arrival timing نىڭ consistency سىنىڭ ئۆزگىرىشى\n\n## Latency vs Jitter\n\n### Latency\n- overall / average delay\n\n### Jitter\n- that delay نىڭ ۋاقىت بويىچە قانچىلىك ئۆزگىرىدىغانلىقى\n\nSource wording:\n- latency = average delay between sending a packet and response\n- jitter = delay variation over time\n\n**Exam memory:**\n> **Latency = Delay**\n>\n> **Jitter = Variation in delay**\n\n---\n\n# 9. Poor VoIP Quality\n\n**VoIP — Voice over IP**\n- voice data نى Internet/network ئارقىلىق real time دا يەتكۈزۈش\n\nReal-time traffic بولغاچقا:\n- latency\n- jitter\n\nغا تېخىمۇ sensitive.\n\n## Source Symptoms\n\n- audio breaking up\n- voice distortion\n- audio delay\n- out-of-sync conversation\n- audio dropouts\n\n## Latency Effect\n\nHigh latency:\n- voice transmission delay\n- conversation disjointed/out of sync\n\n## Jitter Effect\n\nHigh jitter:\n- packet arrival timing inconsistent\n- packets out of order\n- distortion/dropouts\n\n## Source Actions\n\n- network configuration نى optimize قىلىش\n- latency/jitter نى minimize قىلىش\n- VoIP traffic نى باشقا data traffic دىن priority قىلىش\n- routers/switches قا ئوخشاش network hardware/software نى upgrade قىلىش\n\n**Exam memory: Poor VoIP = Latency + Jitter; source may prioritize voice traffic**\n\n---\n\n# 10. Authentication Failure\n\n## Symptom\n\nDevice:\n- wireless/secured network قا connect بولۇشقا تىرىشىدۇ\n- required credential نى verify قىلالمايدۇ\n\n## Possible Cause 1 — Wrong Password / Security Key\n\n- incorrect network password\n- incorrect security key\n\n## Possible Cause 2 — Security-Method Mismatch\n\nDevice بىلەن network:\n- different security setting\n\nئىشلىتىۋاتقان بولۇشى مۇمكىن.\n\nSource examples:\n- WPA2\n- WPA3\n\n## Source Actions\n\n1. Correct password نى verify قىلىڭ\n2. Proper wireless security protocol selected مۇ؟\n3. Network قا reconnect قىلىڭ\n\n**Exam memory: Authentication failure → Password/key + WPA2/WPA3 setting match**\n\n---\n\n# 11. Intermittent Internet Connectivity\n\n## Symptom\n\nDevice:\n- local network connection بار\n- ئەمما Internet access قايتا-قايتا توختاپ/ئەسلىگە كېلىدۇ\n\nUser may see:\n- website load بولماسلىق\n- application connectivity loss\n- online service temporary stop\n- network icon/connection يەنىلا بار\n\n## Source-Stated Causes\n\n### Unstable ISP Connection\n- Internet service provider side instability\n\n### Network Congestion\n- traffic overload\n\n### Router Performance Issue\n- router instability/performance\n\n## Source Actions\n\n- networking equipment نى restart قىلىش\n- router configuration نى check قىلىش\n- ISP بىلەن contact قىلىش\n\n**Exam memory: Network connected but Internet drops → ISP / Congestion / Router**\n\n---\n\n# Objective 5.5 — Symptom → Cause / Action Table\n\n| Symptom | Source-based clue/action |\n|---|---|\n| **Limited/no Internet** | APIPA/DHCP/config → remote test → cable/connection |\n| **Slow network** | Scope → speed/duplex → cable → congestion → malware |\n| **Port flapping** | Faulty cable/connector/NIC |\n| **Wired EMI** | Shielding/grounding/routing |\n| **Wireless interference** | Channels / interference sources / mitigation features |\n| **Intermittent Wi-Fi** | EMI / obstacles / distance / NIC/AP hardware |\n| **High latency** | Distance / congestion / EMI/network slowdown |\n| **High jitter** | Variable packet delay |\n| **Poor VoIP** | Latency + jitter |\n| **Authentication failure** | Password/key / WPA2-WPA3 setting mismatch |\n| **Internet repeatedly drops** | ISP / congestion / router performance |\n\n---\n\n# Objective 5.5 — Final Exam Rules\n\n1. **Check before replace.**\n2. **APIPA → suspect DHCP or network configuration.**\n3. **Limited connectivity → test remote communication before moving to physical cabling.**\n4. **Slow network → determine scope first.**\n5. **Speed/duplex mismatch → packet loss/errors/slow speed.**\n6. **Port flapping → interface repeatedly up/down; check cable/connector/NIC.**\n7. **Wired EMI → shielding/grounding/routing away from interference.**\n8. **Intermittent Wi-Fi → interference + obstacles + distance + hardware.**\n9. **Latency = delay.**\n10. **Jitter = variation in delay.**\n11. **Poor VoIP → latency/jitter are key clues.**\n12. **Authentication failure → password/security key + WPA2/WPA3 match.**\n13. **Network connected but Internet drops → ISP/congestion/router.**\n"}, {"id": "5.6", "number": "5.6", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam Objective 5.6 Given a Scenario – Troubleshoot Printer Issues This video segment will cover troubleshooting issues related to printers. For each of the issues listed in Exam Objective 5.6, I will provide some basic information and possible root causes. Additionally, as a pro test-taking tip, you should always perform verifications, inspections, or checks before performing any repairs or component replacements.\n\nTroubleshooting and resolving printer issues can often be a frustrating yet essential task to maintain smooth operations and high-quality print outputs. When encountering specific symptoms, it's crucial to identify potential causes and apply appropriate solutions. For instance, imagine you have encountered some unintended vertical lines that are ruining your printed pages.\n\nWhat do you do? For this printer issue, and with most printer issues, there are many potential causes. As for a general first step, you should consider which type of printer you are working with.\n\nWhether you are working with an inkjet printer, laser printer, thermal, or impact printer can make a world of difference. Now back to this issue of lines down the printed page. In a laser printer, this could be caused by an accumulation of debris on the photosensitive drum.\n\nSimilarly, scratches on the imaging drum can produce similar results as the drum rotates during printing. Issues with the fuser roller in a laser printer, whether due to wear or damage, can also manifest as lines on printed pages during the fixing process. Another potential cause is a dirty feed roller, which can result in inconsistent paper feeding, leading to lines down the printed page.\n\nAdditionally, scratches on a scanner glass can cause streaks or lines to appear on scanned or copied documents, which may subsequently be printed with the lines visible. Another possible issue would be garbled print. This issue presents as random or incorrect characters throughout the page, or it might look similar to a bunch of alien symbols.\n\nRegardless of the type of incoherent output you get, the causes for garbled print can stem from various issues within the printer system. Incompatible firmware due to an update is one common cause, where recent firmware updates can result in compatibility problems. In such cases, consider rolling back the firmware update, contacting manufacturer support, checking for firmware patches, or reinstalling the firmware update.\n\nAnother cause is corrupted or incompatible print drivers installed on the computer. If the driver is corrupt or incompatible with the printer model, it can lead to garbled print. Updating or reinstalling the printer driver to ensure compatibility may resolve the issue.\n\nAdditionally, communication errors between the computer and the printer caused by loose cables, network issues, or interference can also cause garbled print. Ensuring a stable and secure connection can help alleviate this problem. Faded prints can be frustrating, especially when you're expecting crisp and vibrant output.\n\nSeveral factors could contribute to this issue, resulting in prints that appear faint or washed out. One common cause is low ink or toner levels in the printer cartridges. When levels are low, prints may lack intensity.\n\nChecking the ink or toner levels and replacing cartridges as needed can help restore print quality. Additionally, incorrect print settings, such as print density and resolution, can lead to faded prints. Adjusting these settings to higher levels can also improve print quality.\n\nWhen encountering double images, also known as echo images, on printed documents, it's important to address the underlying causes. The first step involves checking the imaging drum, responsible for transferring toner onto the paper during printing. Inspect the drum for visible signs of damage, wear, or contamination, and clean it using a lint-free cloth and isopropyl alcohol, or as directed by the manufacturer.\n\nAdditionally, it's essential to inspect the printer's cleaning mechanism, which removes excess toner or debris from internal components, including the drum. When speckling appears on printed pages, it can significantly reduce the overall print quality. This issue often stems from problems with the toner cartridge or insufficient printer maintenance.\n\nFirstly, examine the toner cartridge for any signs of leakage or damage. If leakage is present, it can lead to speckling on the pages. Additionally, accumulated dust, debris, or excess toner inside the printer can also cause speckling.\n\nIf this is evident upon visual inspection, thoroughly clean the internal components of the printer, including the drum, fuser unit, and paper path, using a toner-approved vacuum and/or a lint-free cloth. The next issue may not be in the exam objectives, but it is important and specific to laser printers. When toner fails to fuse properly to the paper during printing, it can lead to smudging or smearing and poor print quality.\n\nSeveral factors could contribute to this issue. Firstly, a faulty fuser unit responsible for heating and pressing the toner onto the paper may be to blame. Secondly, using an incorrect paper type or weight can affect toner adhesion.\n\nAdjusting printer settings or fuser temperature may help in such cases. Additionally, worn or damaged fuser rollers can hinder proper toner fusion. Incorrect page orientation issues can lead to printouts that do not align properly with the intended layout, resulting in wasted paper or misaligned content.\n\nA common scenario involves selecting the wrong orientation in the settings menu. This might cause not just unexpected but unusual outcomes. To address this problem, start by verifying the print settings before printing.\n\nEnsure that the correct page orientation, portrait, or landscape is selected in the printer settings or within the document software. Tray not recognized is another issue that can prevent a printer from operating as expected. This occurs when the printer is unable to detect one of its paper trays, even though the tray is properly installed and loaded with paper.\n\nWhen this happens, the printer may display an error message, refuse to print, or continuously prompt the user to insert paper even though the tray is already filled. Several factors can cause this problem, including a tray that is not fully seated in the printer misconfigured tray settings or sensors that fail to detect the tray properly. In some cases, the printer may also expect a specific paper type or size from a particular tray, which can create a mismatch if the tray configuration does not align with the print job settings.\n\nTo resolve this issue, users should first remove and reseat the tray to ensure it is properly installed. Next, verify the tray configuration in the printer settings, and confirm that the correct paper type and size are assigned to the tray. If the issue persists, inspecting the tray sensors or updating printer drivers may help restore proper tray detection.\n\nWhen encountering problems with paper not feeding properly into the printer, it's essential to consider various factors. Firstly, ensure that the paper is correctly aligned within the paper tray, as improper alignment can lead to feeding difficulties. Additionally, verify that the paper loaded in the tray matches the size and weight specifications supported by the printer, as using the wrong paper size or weight can hinder feeding.\n\nChecking the condition of the paper stack is also crucial, as any damage such as creases or moisture can lead to feeding problems. Lastly, inspect the feed roller for signs of wear or damage, as a worn feed roller may not grit the paper properly, resulting in feeding issues. Regarding multi-page misfeeds, a common cause is a worn or damaged separation pad.\n\nThis component ensures that only one sheet of paper is fed into the printer at a time. Paper jams are a frequent nuisance in printers, disrupting workflow and causing frustration. When confronted with a paper jam, it's crucial to handle it promptly and safely to prevent printer damage and ensure continued operation.\n\nThe initial step for clearing a paper jam is to remove the device from service and disconnect the printer from the power source. This minimizes the risk of accidents due to electrical shock, moving parts or burns from a hot fuser unit. Once safety concerns have been addressed, carefully examine the printer's paper path to identify and remove any obstructions that may be causing the jam.\n\nBe thorough in clearing out any loose paper or debris that could impede the paper's movement. If paper jams occur frequently, inspect the pickup roller for wear or contamination, as these issues can contribute to jams. Cleaning or replacing the pickup roller may help prevent future jams.\n\nFinally, if an error message persists even after clearing the jam, investigate the paper path for a blocked paper jam sensor. Next up, we have issues related to printer finishing units. These are optional components available in some printers that provide additional features beyond basic printing capabilities.\n\nThese units are designed to enhance the appearance and functionality of printed documents by offering options such as stapling, hole punching, binding and folding. However, issues can arise with these finishing units, particularly concerning hole punching and stapling. When users attempt to hole punch or staple a stack of sheets that exceeds the maximum capacity supported by the finishing unit, it can lead to jams and malfunctions.\n\nTo resolve this issue, users should first verify the maximum sheet capacity supported by the finishing unit and reduce the number of pages in the print job if necessary. If a jam has already occurred, carefully clearing the jam and restarting the printer can often restore normal operation. When a printer emits a grinding noise, it often indicates a mechanical issue within the device.\n\nIf such a noise is heard, inspect the printer's internal components by opening the printer's covers and visually examining gears, rollers and belts for signs of damage, wear or misalignment. Regular maintenance also has a role in preventing grinding noises. This involves cleaning the printer's interior and lubricating moving parts according to the manufacturer's guidelines.\n\nWhen a print queue is backed up, it means that multiple print jobs are waiting in line but are not currently printing. This situation can arise for several reasons. For example, the printer may be out of paper, ink or toner, preventing it from completing the current job.\n\nAdditionally, if the printer is offline or experiencing connectivity problems, new print jobs may continue to accumulate in the queue. Errors within a specific print job can also interrupt processing and cause other jobs to remain pending. To address this issue in Windows, open Settings, navigate to Printers and select the printer to view its print queue.\n\nFrom there, try restarting the current job. If the job continues to fail, delete it from the queue and attempt to print again. If the job cannot be removed and the print queue is completely frozen, stopping and restarting the print spooler service may be necessary to clear the queue.\n\nLastly, connectivity issues can prevent print jobs from reaching the printer altogether. This problem commonly occurs with network printers when the device cannot communicate with the printer or print server. Causes may include incorrect network settings, disconnected cables, wireless signal problems or the printer being powered off or offline.\n\nTroubleshooting connectivity issues involves verifying that the printer is powered on and properly connected to the network. Users should also confirm that the correct printer is selected, check the network connection and verify that the printer's IP address or network configuration has not changed. Restarting the printer, computer or network equipment can often restore communication and allow print jobs to be processed successfully.\n\nCongratulations on completing our CompTIA A+ Core 1 Complete Training Course. The commitment and drive you have demonstrated to arrive at this milestone is truly commendable. Whether you started with no prior IT knowledge or you had some previous experience to draw upon, you've journeyed a great distance.\n\nNow you stand at the threshold of your next big step towards obtaining your CompTIA A+ certification. But before you go ahead and book your test, we have a new challenge lined up for you. We've assembled an exclusive practice exam on our channel, packed with 200+ questions meticulously designed to test your knowledge and simulate the format and difficulty of the actual exam.\n\nIt's essential to remember that repetition is the key to mastery. The more you practice, the more confident you'll feel. Also, as you navigate through our practice exam, be sure to make notes of areas you're unsure about and feel free to revisit any part of our training course as needed.\n\nSo are you prepared for a practice exam? Great! Then click on the link to my left to get started.\n\nThis CompTIA A+ Core 1 Practice Exam will challenge you, gauge your readiness, and move you one step closer to your certification goal. We wish you all the best, and here's to you passing that exam.", "uyghur": "Exam Objective 5.6\nبىر ئەھۋال بېرىلگەندە، پرىنتېر مەسىلىلىرىنى كاشىلا تۈگىتىڭ.\n\n# Objective 5.6 — Troubleshooting Mindset\n\nمەنبە بۇ ئاخىرقى troubleshooting objective دا يەنە بىر قېتىم مۇھىم CompTIA rule نى تەكىتلەيدۇ:\n\n> **Repair ياكى component replacement قىلىشتىن بۇرۇن، verify / inspect / check قىلىڭ.**\n\nPrinter troubleshooting دا ئەڭ مۇھىم بىرىنچى سوئال:\n\n> **قايسى خىل printer بىلەن ئىشلەۋاتىسىز؟**\n\nSource printer types:\n- Inkjet\n- Laser\n- Thermal\n- Impact\n\nPrinter technology ئوخشىمىغاچقا:\n- symptom نىڭ cause ىمۇ\n- maintenance/repair area سىمۇ\n\nپەرقلىنىشى مۇمكىن.\n\nObjective 5.6 دىكى reviewed flow:\n\n1. Symptom\n2. Printer type / affected area\n3. Possible source causes\n4. Source check/action\n5. Exam memory\n\n---\n\n# 1. Vertical Lines / Streaks on Printed Pages\n\n## Symptom\n\nPrinted page دا:\n- unintended vertical lines\n- streaks\n\nكۆرۈنىدۇ.\n\nمەنبە بىر printer symptom نىڭ كۆپ possible cause ى بولۇشى مۇمكىنلىكىنى تەكىتلەيدۇ.\n\n## Laser Cause 1 — Debris on Photosensitive Drum\n\nLaser printer دا:\n- photosensitive/imaging drum ئۈستىدىكى debris\n\npage دا repeating line/streak پەيدا قىلىشى مۇمكىن.\n\n## Laser Cause 2 — Scratched Imaging Drum\n\nDrum rotates during printing.\n\nScratch:\n- ھەر rotation دا similar line pattern نى قايتا ھاسىل قىلىشى مۇمكىن.\n\n## Laser Cause 3 — Fuser Roller Wear / Damage\n\nFuser roller:\n- worn\n- damaged\n\nبولسا fixing/fusing process جەريانىدا line پەيدا بولۇشى مۇمكىن.\n\n## Cause 4 — Dirty Feed Roller\n\nDirty feed roller:\n- inconsistent paper feeding\n\nپەيدا قىلىپ، source بويىچە printed page دا lines غا تۆھپە قوشۇشى مۇمكىن.\n\n## Cause 5 — Scratched Scanner Glass\n\nMFD/copier/scanner context دا:\n- scanner glass scratched بولسا\n- scanned/copied document دا streak/line پەيدا بولىدۇ\n- كېيىن print قىلىنغان copy دا شۇ line كۆرۈنۈشى مۇمكىن\n\n**Exam memory: Lines/streaks → Drum / Fuser / Feed roller / Scanner glass**\n\n---\n\n# 2. Garbled Print\n\n## Symptom\n\nPrinted page دا:\n- random characters\n- incorrect characters\n- unreadable/alien-symbol-like output\n\nكۆرۈنىدۇ.\n\n## Possible Cause 1 — Firmware Compatibility Problem\n\nRecent firmware update:\n- compatibility problem پەيدا قىلىشى مۇمكىن\n\nSource actions:\n- firmware rollback نى consider قىلىش\n- manufacturer support بىلەن contact قىلىش\n- firmware patch بارمۇ تەكشۈرۈش\n- firmware update نى reinstall قىلىش\n\n## Possible Cause 2 — Corrupted / Incompatible Printer Driver\n\nComputer دىكى printer driver:\n- corrupted\n- printer model بىلەن incompatible\n\nبولسا garbled print پەيدا قىلىشى مۇمكىن.\n\nSource action:\n- driver نى update\n- ياكى reinstall\n\nقىلىپ compatibility نى restore قىلىش.\n\n## Possible Cause 3 — Communication Error\n\nComputer ↔ printer communication:\n- loose cable\n- network issue\n- interference\n\nسەۋەبىدىن بۇزۇلۇشى مۇمكىن.\n\nSource action:\n- stable\n- secure\n\nconnection بارلىقىنى verify قىلىڭ.\n\n**Exam memory: Garbled print → Firmware / Driver / Communication**\n\n---\n\n# 3. Faded Prints\n\n## Symptom\n\nOutput:\n- faint\n- washed out\n- expected دەك crisp/vibrant ئەمەس\n\n## Possible Cause 1 — Low Ink / Toner\n\nCartridge level:\n- low\n\nبولسا print intensity تۆۋەنلەيدۇ.\n\nSource action:\n- ink/toner level نى check قىلىڭ\n- cartridge نى لازىم بولسا replace قىلىڭ\n\n## Possible Cause 2 — Print Settings\n\nIncorrect:\n- print density\n- resolution\n\nsettings faded output غا تۆھپە قوشۇشى مۇمكىن.\n\nSource action:\n- settings نى higher level غا adjust قىلىش\n\nprint quality نى ياخشىلاشقا ياردەم بېرىشى مۇمكىن.\n\n**Exam memory: Faded print → Ink/Toner level + Density/Resolution settings**\n\n---\n\n# 4. Double Images / Echo Images\n\n## Symptom\n\nPrinted document دا:\n- duplicate image\n- faint repeated image\n- **echo image**\n\nكۆرۈنىدۇ.\n\n## Source First Check — Imaging Drum\n\nTranscript بۇ symptom دا:\n- imaging drum نى ئالدى بىلەن check قىلىشنى تەۋسىيە قىلىدۇ\n\nInspect for:\n- visible damage\n- wear\n- contamination\n\n**Source-accuracy note:** transcript drum نىڭ toner نى paper غا transfer قىلىش رولىنى ئاددىيلاشتۇرۇپ تەسۋىرلەيدۇ. Reviewed Uyghur source-supported troubleshooting action — **inspect the imaging drum** — نى ساقلايدۇ؛ laser transfer mechanism نى سىرتقى بىلىم بىلەن قايتا يېزىپ كەتمەيدۇ.\n\n## Source Cleaning Guidance\n\nSource:\n- lint-free cloth\n- isopropyl alcohol\n- ياكى manufacturer direction\n\nبويىچە drum cleaning نى تىلغا ئالىدۇ.\n\n**Source-safety caution:** بۇ model-independent universal cleaning procedure دەپ قارالمايدۇ؛ manufacturer guidance نى ئالدىنقى ئورۇنغا قويۇڭ.\n\n## Check Cleaning Mechanism\n\nPrinter cleaning mechanism:\n- excess toner\n- debris\n\nنى internal component/drum دىن remove قىلىشقا ياردەم بېرىدۇ.\n\nSource action:\n- cleaning mechanism نى inspect قىلىڭ.\n\n**Exam memory: Echo/double image → Imaging drum + Cleaning mechanism**\n\n---\n\n# 5. Speckling\n\n## Symptom\n\nPrinted page دا:\n- small toner/ink-like spots\n- speckles\n\nكۆپ كۆرۈنىدۇ.\n\n## Possible Cause 1 — Toner Cartridge Leakage / Damage\n\nInspect toner cartridge:\n- leak بارمۇ؟\n- physical damage بارمۇ؟\n\nLeakage:\n- page speckling غا cause بولۇشى مۇمكىن.\n\n## Possible Cause 2 — Dust / Debris / Excess Toner\n\nPrinter interior دا:\n- dust\n- debris\n- excess toner\n\nيىغىلىپ قالسا speckling پەيدا بولۇشى مۇمكىن.\n\n## Source Cleaning Areas\n\nSource:\n- drum\n- fuser unit\n- paper path\n\nنى clean قىلىشنى تىلغا ئالىدۇ.\n\nSource tools/material:\n- toner-approved vacuum\n- and/or lint-free cloth\n\n**Exam memory: Speckling → Toner cartridge leak/damage + Internal toner/debris**\n\n---\n\n# 6. Toner Does Not Fuse Properly — Source Supplemental Laser Topic\n\nمەنبە بۇ issue نى ئېنىق:\n\n> **“may not be in the exam objectives, but it is important and specific to laser printers”**\n\nدەپ ئايرىم ئەسكەرتىدۇ.\n\nشۇڭا reviewed lesson بۇنى **source supplemental topic** سۈپىتىدەلا ساقلايدۇ، Objective 5.6 نىڭ guaranteed exam requirement ى دەپ ئوتتۇرىغا قويمايدۇ.\n\n## Symptom\n\nToner paper غا توغرا fuse بولمىسا:\n- smudging\n- smearing\n- poor print quality\n\nپەيدا بولىدۇ.\n\n## Possible Cause 1 — Faulty Fuser Unit\n\nFuser:\n- heat\n- pressure\n\nئارقىلىق toner نى paper غا bond قىلىدۇ.\n\nFaulty fuser:\n- toner fusion problem پەيدا قىلىشى مۇمكىن.\n\n## Possible Cause 2 — Incorrect Paper Type / Weight\n\nWrong:\n- paper type\n- paper weight\n\ntoner adhesion غا تەسىر قىلىشى مۇمكىن.\n\nSource says:\n- printer settings\n- fuser temperature\n\nadjustment بەزى ئەھۋالدا ياردەم بېرىشى مۇمكىن.\n\n## Possible Cause 3 — Worn / Damaged Fuser Rollers\n\nRoller wear/damage:\n- proper toner fusion نى توسۇشى مۇمكىن.\n\n**Exam/source memory: Smudging laser toner → Fuser + Paper type/weight + Fuser rollers**\n\n---\n\n# 7. Incorrect Page Orientation\n\n## Symptom\n\nPrinted page:\n- intended layout بىلەن ماس كەلمەيدۇ\n- content wrong direction دا\n- paper waste ياكى misalignment پەيدا بولىدۇ\n\n## Common Source Cause\n\nWrong orientation selected:\n- printer settings\n- document software\n\n## Source Action\n\nPrint قىلىشتىن بۇرۇن:\n- orientation setting نى verify قىلىڭ\n\nCorrect option:\n- **Portrait**\n- ياكى **Landscape**\n\n**Exam memory: Wrong page direction → Check Portrait/Landscape setting**\n\n---\n\n# 8. Tray Not Recognized\n\n## Symptom\n\nPrinter:\n- installed/loaded tray نى detect قىلالمايدۇ\n- error message كۆرسىتىشى\n- print نى refuse قىلىشى\n- paper بار بولسىمۇ “insert paper” دەپ prompt قىلىشى مۇمكىن\n\n## Possible Cause 1 — Tray Not Fully Seated\n\nTray:\n- printer ئىچىگە تولۇق ئورۇنلاشمىغان بولۇشى مۇمكىن.\n\n## Possible Cause 2 — Misconfigured Tray Settings\n\nTray configuration:\n- wrong\n- print job بىلەن mismatch\n\nبولۇشى مۇمكىن.\n\n## Possible Cause 3 — Tray Sensor Problem\n\nSensor:\n- tray نى توغرا detect قىلالماسلىقى مۇمكىن.\n\n## Possible Cause 4 — Paper Type / Size Mismatch\n\nPrinter:\n- specific tray دىن specific paper type/size نى كۈتۈۋاتقان بولۇشى مۇمكىن.\n\nTray configuration:\n- print job setting بىلەن ماس كەلمىسە detection/printing issue پەيدا بولۇشى مۇمكىن.\n\n## Source Troubleshooting Order\n\n1. Tray نى remove قىلىڭ\n2. Tray نى **reseat** قىلىپ fully installed مۇ تەكشۈرۈڭ\n3. Printer tray configuration نى verify قىلىڭ\n4. Correct paper type/size assigned مۇ؟\n5. Issue داۋاملاشسا tray sensor نى inspect قىلىڭ\n6. Printer driver update ياردەم بېرىشى مۇمكىن\n\n**Exam memory: Tray not recognized → Reseat → Config → Paper size/type → Sensor/driver**\n\n---\n\n# 9. Paper Not Feeding Properly\n\n## Possible Cause 1 — Paper Alignment\n\nPaper tray ئىچىدە paper:\n- correctly aligned بولمىسا\n\nfeeding difficulty پەيدا بولۇشى مۇمكىن.\n\n## Possible Cause 2 — Wrong Paper Size / Weight\n\nLoaded paper:\n- printer supported size/weight specification غا ماس كەلمىسە\n\nfeeding problem پەيدا بولۇشى مۇمكىن.\n\n## Possible Cause 3 — Damaged / Moist Paper\n\nPaper stack:\n- creased\n- damaged\n- moist\n\nبولسا feed problem پەيدا قىلىشى مۇمكىن.\n\n## Possible Cause 4 — Worn / Damaged Feed Roller\n\nFeed roller:\n- worn\n- damaged\n\nبولسا paper نى properly **grip** قىلالماسلىقى مۇمكىن.\n\n**Transcript correction:** source `may not grit the paper properly` دەپ transcript قىلىنغان. Context بويىچە reviewed Uyghur canonical **grip the paper properly** مەنىسىنى ئىشلىتىدۇ.\n\n**Exam memory: Paper won’t feed → Alignment + Size/Weight + Paper condition + Feed roller**\n\n---\n\n# 10. Multi-Page Misfeeds\n\n## Symptom\n\nPrinter:\n- بىر قېتىمدا بىر sheet ئەمەس\n- multiple sheets نى بىللە تارتىدۇ\n\n## Common Source Cause — Separation Pad\n\n**Separation pad**\n- بىر ۋاقىتتا پەقەت بىر sheet نى feed قىلىشقا ياردەم بېرىدۇ.\n\nWorn/damaged separation pad:\n- multi-page misfeed پەيدا قىلىشى مۇمكىن.\n\n**Exam memory: Multiple sheets at once → Separation pad**\n\n---\n\n# 11. Paper Jams\n\nPaper jam:\n- workflow نى ئۈزىدۇ\n- printer غا damage risk پەيدا قىلىشى مۇمكىن.\n\n## Source Safety First\n\nPaper jam نى clear قىلىشتىن بۇرۇن:\n\n1. **Printer نى service دىن چىقىرىڭ**\n2. **Power source دىن disconnect قىلىڭ**\n\nمەقسەت:\n- electrical shock\n- moving parts\n- hot fuser burn\n\nrisk نى ئازايتىش.\n\n## Source Jam-Clearing Flow\n\n### 1. Inspect Paper Path\n- obstruction نى locate قىلىڭ\n- jammed paper/debris نى remove قىلىڭ\n\n### 2. Remove Loose Pieces\n- loose paper\n- debris\n\npaper movement نى توسۇۋاتامدۇ تەكشۈرۈڭ.\n\n### 3. Frequent Jams → Pickup Roller\n\nPickup roller:\n- wear\n- contamination\n\nبارمۇ inspect قىلىڭ.\n\nSource says:\n- clean\n- ياكى replace\n\nقىلىش future jams نى ئازايتىشقا ياردەم بېرىشى مۇمكىن.\n\n### 4. Error Persists → Jam Sensor\n\nPaper physically clear بولسىمۇ error message قالسا:\n- paper path ئىچىدىكى jam sensor blocked بولۇشى مۇمكىن.\n\n**Exam memory: Paper jam → Power disconnect → Clear path → Pickup roller → Jam sensor**\n\n---\n\n# 12. Finishing Unit Problems\n\n**Finishing unit**\n- بعض printer لاردا optional component\n- basic printing دىن كېيىن additional finishing function تەمىنلەيدۇ.\n\nSource examples:\n- stapling\n- hole punching\n- binding\n- folding\n\n## Common Problem — Capacity Exceeded\n\nToo many sheets:\n- staple\n- hole punch\n\nقىلىشقا تىرىشىلسا:\n- jam\n- malfunction\n\nپەيدا بولۇشى مۇمكىن.\n\n## Source Action\n\n1. Finishing unit maximum sheet capacity نى verify قىلىڭ\n2. Print job page count نى لازىم بولسا reduce قىلىڭ\n3. Jam بولغان بولسا carefully clear قىلىڭ\n4. Printer نى restart قىلىش normal operation نى restore قىلىشى مۇمكىن\n\n**Exam memory: Finisher jam → Check maximum sheet capacity**\n\n---\n\n# 13. Grinding Noise\n\n## Symptom\n\nPrinter دىن:\n- grinding noise\n\nئاڭلىنىدۇ.\n\n## Source Meaning\n\nGrinding noise:\n- mechanical issue clue\n\nبولۇشى مۇمكىن.\n\n## Source Inspection Areas\n\nPrinter cover نى ئېچىپ visual inspect:\n- gears\n- rollers\n- belts\n\nCheck for:\n- damage\n- wear\n- misalignment\n\n## Preventive Maintenance — Source\n\n- printer interior cleaning\n- moving parts lubrication\n\n**manufacturer guidelines** بويىچە قىلىنىدۇ.\n\n**Exam memory: Grinding printer → Inspect gears / rollers / belts**\n\n---\n\n# 14. Backed-Up / Frozen Print Queue\n\n## Symptom\n\nMultiple print jobs:\n- queue دا waiting\n- ئەمما print بولمايدۇ\n\n## Source-Stated Causes\n\n### Printer Out of Consumables\n- paper يوق\n- ink يوق\n- toner يوق\n\nCurrent job تاماملانمىسا:\n- later jobs queue دا يىغىلىدۇ.\n\n### Printer Offline / Connectivity Problem\n- printer offline\n- communication issue\n\nبولسا jobs accumulate قىلىدۇ.\n\n### Error in One Print Job\nSpecific job:\n- processing نى interrupt قىلىپ\n- other jobs نى pending قالدۇرۇشى مۇمكىن.\n\n## Windows Source Workflow\n\nTranscript Windows دا تۆۋەندىكى sequence نى بېرىدۇ:\n\n1. **Settings** نى ئېچىڭ\n2. **Printers** قا بېرىڭ\n3. Printer نى تاللاپ **print queue** نى كۆرۈڭ\n4. Current job نى restart قىلىپ بېقىڭ\n5. Job داۋاملىق fail بولسا queue دىن delete قىلىڭ\n6. قايتا print قىلىپ بېقىڭ\n\n## Completely Frozen Queue — Print Spooler\n\nئەگەر:\n- job remove بولمايدۇ\n- queue completely frozen\n\nبولسا source:\n- **print spooler service** نى stop\n- ئاندىن restart\n\nقىلىش كېرەك بولۇشى مۇمكىن، دەپ چۈشەندۈرىدۇ.\n\n**Source-scope note:** reviewed lesson source دىكى Windows-level workflow نى ساقلايدۇ، ئەمما command-line spooler commands ياكى registry/service-recovery procedures قوشمايدۇ.\n\n**Exam memory: Queue backed up → Consumables/offline/job error → Queue → Spooler if frozen**\n\n---\n\n# 15. Printer Connectivity Issues\n\n## Symptom\n\nPrint job:\n- printer غا يېتىپ بارمايدۇ\n- network printer/print server بىلەن communication بولمايدۇ\n\n## Source-Stated Causes\n\n- incorrect network settings\n- disconnected cable\n- wireless signal problem\n- printer powered off\n- printer offline\n\n## Source Troubleshooting Flow\n\n### 1. Power\n- printer powered on مۇ؟\n\n### 2. Network Connection\n- network قا properly connected مۇ؟\n\n### 3. Correct Printer Selected\n- user/computer correct printer نى تاللىغانمۇ؟\n\n### 4. Network Configuration\n- printer IP address\n- network configuration\n\nئۆزگىرىپ كەتمىگەنمۇ؟\n\n### 5. Restart\nSource says:\n- printer\n- computer\n- network equipment\n\nrestart قىلىش communication نى restore قىلىشى مۇمكىن.\n\n**Exam memory: Print job cannot reach printer → Power → Connection → Correct printer → IP/config → Restart**\n\n---\n\n# Objective 5.6 — Symptom → Cause / Action Table\n\n| Symptom | Source-based clue/action |\n|---|---|\n| **Vertical lines/streaks** | Drum / fuser / feed roller / scanner glass |\n| **Garbled characters** | Firmware / driver / communication |\n| **Faded print** | Low ink/toner / density-resolution settings |\n| **Double/echo image** | Imaging drum / cleaning mechanism |\n| **Speckling** | Toner cartridge leak/damage / internal debris |\n| **Toner smudges** | Supplemental source topic: fuser / paper type-weight / fuser roller |\n| **Wrong orientation** | Portrait/Landscape setting |\n| **Tray not recognized** | Reseat / tray config / paper type-size / sensor / driver |\n| **Paper won’t feed** | Alignment / paper spec-condition / feed roller |\n| **Multiple sheets feed** | Separation pad |\n| **Paper jam** | Disconnect power → paper path → pickup roller → jam sensor |\n| **Finisher jam** | Maximum sheet capacity |\n| **Grinding noise** | Gears / rollers / belts |\n| **Print queue backed up** | Consumables / offline / job error / spooler |\n| **Printer unreachable** | Power / cable-wireless / selection / IP-config / restart |\n\n---\n\n# Objective 5.6 — Final Exam Rules\n\n1. **Check before replace.**\n2. **Printer type matters first.**\n3. **Lines/streaks → drum/fuser/feed roller/scanner glass.**\n4. **Garbled print → firmware/driver/communication.**\n5. **Faded print → ink/toner + print settings.**\n6. **Echo image → imaging drum/cleaning mechanism.**\n7. **Speckling → toner cartridge + internal debris.**\n8. **Toner not fusing is source-labeled supplemental; check fuser/paper/rollers.**\n9. **Wrong page direction → Portrait/Landscape.**\n10. **Tray not recognized → reseat + configuration + sensor.**\n11. **Paper feed → alignment/spec/condition/feed roller.**\n12. **Multi-feed → separation pad.**\n13. **Paper jam → disconnect power before clearing the paper path.**\n14. **Finisher jam → check sheet-capacity limit.**\n15. **Grinding → gears/rollers/belts.**\n16. **Frozen print queue → job/queue; spooler may need restart.**\n17. **Printer connectivity → power/network/selected printer/IP configuration.**\n"}];

function storedArray(key){
  try{const v=JSON.parse(localStorage.getItem(key)||"[]");return Array.isArray(v)?v:[]}
  catch{return []}
}
function storedNumber(key,fallback,min,max){
  const raw=localStorage.getItem(key);if(raw===null||raw==="")return fallback;
  const n=Number(raw);
  return Number.isFinite(n)?Math.min(max,Math.max(min,n)):fallback;
}

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rich(text,q="",rtl=false){
  // v6.5 local Markdown renderer. The lesson data is trusted/local, but every
  // text fragment is escaped before markup is emitted. This deliberately
  // supports only the structures used by the course notes.
  const lines=String(text||"").replace(/\r\n?/g,"\n").split("\n");
  let matches=0;
  const qre=q?new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"):null;

  function markAndEscape(raw){
    let x=esc(raw);
    if(qre)x=x.replace(qre,m=>{matches++;return "<mark>"+m+"</mark>"});
    return x;
  }

  function isPureLtr(raw){
    const hasLatin=/[A-Za-z]/.test(raw);
    const hasArabic=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/.test(raw);
    return hasLatin&&!hasArabic;
  }

  function stripMd(raw){
    return String(raw||"").replace(/\*\*|`/g,"").trim();
  }

  function isTechDominantHeading(raw){
    if(!rtl)return false;
    const x=stripMd(raw);
    if(!/^[A-Za-z0-9]/.test(x)||!/[A-Za-z]/.test(x))return false;
    const arabic=(x.match(/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF]/g)||[]).length;
    const latin=(x.match(/[A-Za-z]/g)||[]).length;
    // Short connectors such as "ۋە" between technical identifiers should
    // not reverse the identifier sequence (T568A ۋە T568B Pinout).
    return arabic>0&&arabic<=4&&latin>=6;
  }

  function isEditorNote(raw){
    return /^\s*(?:\*\*)?(?:Transcript correction|Source-scope note):/i.test(String(raw||""));
  }

  function blockAttrs(raw,kind="text"){
    if(!rtl)return "";
    const x=stripMd(raw);
    if(isPureLtr(x))return ' dir="ltr" class="md-ltr-block"';
    if(kind==="heading"&&isTechDominantHeading(x))return ' dir="ltr" class="md-tech-ltr"';
    if(isEditorNote(raw))return ' dir="auto" class="md-editor-note"';
    return "";
  }

  function plain(raw,forceLtr=false){
    if(!rtl || forceLtr)return markAndEscape(raw);
    // Entire English-only fragments get one isolation wrapper. This is
    // important for curly apostrophes and arrows (for example "won’t" or
    // "Power → Network → IP"), which can otherwise visually reorder in RTL.
    if(isPureLtr(raw))return '<bdi dir="ltr" class="ltr-run">'+markAndEscape(raw)+'</bdi>';

    // v6.4: isolate a complete Latin parenthetical INCLUDING both brackets.
    // Keeping "(" and ")" inside the same LTR isolate prevents the Unicode
    // bidi algorithm from turning e.g. (Copper Network Cables) into ...)).
    const arabic='\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF';
    const parenRe=new RegExp('(\\((?=[^()\\n]*[A-Za-z])[^()\\n'+arabic+']*\\))','g');
    const pieces=raw.split(parenRe);
    return pieces.map(piece=>{
      if(!piece)return "";
      if(/^\([^()\n]*[A-Za-z][^()\n]*\)$/.test(piece) && !new RegExp('['+arabic+']').test(piece)){
        return '<bdi dir="ltr" class="ltr-run ltr-parenthetical">'+markAndEscape(piece)+'</bdi>';
      }
      // In genuinely mixed Uyghur/English text, isolate technical LTR runs.
      // Parentheses are intentionally excluded here; complete parentheticals
      // are handled above so punctuation cannot escape the isolate.
      const re=/([A-Za-z][A-Za-z0-9+_.:/#'’–-]*(?:[ \t]+[A-Za-z0-9][A-Za-z0-9+_.:/#'’–-]*)*|\b\d+(?:[.:/-]\d+)*\b)/g;
      return piece.split(re).map(part=>{
        if(!part)return "";
        const isLtr=/^[A-Za-z]/.test(part)||/^\d+(?:[.:/-]\d+)*$/.test(part);
        const x=markAndEscape(part);
        return isLtr?'<bdi dir="ltr" class="ltr-run">'+x+'</bdi>':x;
      }).join("");
    }).join("");
  }

  function inline(raw){
    raw=String(raw||"");
    let out="",i=0;
    while(i<raw.length){
      const bold=raw.indexOf("**",i);
      const code=raw.indexOf("`",i);
      let next=-1,kind="";
      if(bold!==-1 && (code===-1||bold<code)){next=bold;kind="bold"}
      else if(code!==-1){next=code;kind="code"}
      if(next===-1){out+=plain(raw.slice(i));break}
      if(next>i)out+=plain(raw.slice(i,next));
      if(kind==="bold"){
        const close=raw.indexOf("**",next+2);
        if(close===-1){out+=plain(raw.slice(next));break}
        out+="<strong>"+inline(raw.slice(next+2,close))+"</strong>";
        i=close+2;
      }else{
        const close=raw.indexOf("`",next+1);
        if(close===-1){out+=plain(raw.slice(next));break}
        out+='<code dir="ltr">'+plain(raw.slice(next+1,close),true)+"</code>";
        i=close+1;
      }
    }
    return out;
  }

  function indentWidth(ws){return ws.replace(/\t/g,"    ").length}
  function listInfo(line){
    const m=line.match(/^(\s*)([-+*]|\d+[.)])\s+(.*)$/);
    if(!m)return null;
    return {indent:indentWidth(m[1]),ordered:/^\d/.test(m[2]),num:parseInt(m[2],10)||1,content:m[3]};
  }
  function isHr(line){return /^\s*(?:(?:-{3,})|(?:_{3,})|(?:\*\s*\*\s*\*\s*))\s*$/.test(line)}
  function isHeading(line){return /^\s*#{1,6}\s+/.test(line)}
  function isQuote(line){return /^\s*>\s?/.test(line)}
  function splitRow(line){
    let x=line.trim();
    if(x.startsWith("|"))x=x.slice(1);
    if(x.endsWith("|"))x=x.slice(0,-1);
    return x.split("|").map(c=>c.trim());
  }
  function isTableDivider(line){
    const cells=splitRow(line);
    return cells.length>1 && cells.every(c=>/^:?-{3,}:?$/.test(c.replace(/\s+/g,"")));
  }
  function tableStart(i,arr){
    return i+1<arr.length && arr[i].includes("|") && isTableDivider(arr[i+1]);
  }
  function blockStart(i,arr){
    if(i>=arr.length)return true;
    const line=arr[i];
    if(!line.trim())return true;
    return isHeading(line)||isHr(line)||isQuote(line)||!!listInfo(line)||tableStart(i,arr);
  }

  function parseList(arr,start,baseIndent){
    const first=listInfo(arr[start]);
    if(!first)return {html:"",next:start};
    const ordered=first.ordered;
    const tag=ordered?"ol":"ul";
    const startAttr=ordered && first.num!==1?' start="'+first.num+'"':"";
    const items=[];
    let i=start;
    while(i<arr.length){
      const m=listInfo(arr[i]);
      if(!m||m.indent<baseIndent)break;
      if(m.indent>baseIndent){
        if(!items.length)break;
        const nested=parseList(arr,i,m.indent);
        items[items.length-1].nested+=nested.html;
        i=nested.next;
        continue;
      }
      if(m.ordered!==ordered)break;
      const item={raw:m.content,body:inline(m.content),nested:""};
      i++;
      // Allow a more-indented continuation line under the current list item.
      while(i<arr.length && arr[i].trim() && !listInfo(arr[i]) && !isHeading(arr[i]) && !isHr(arr[i]) && !isQuote(arr[i]) && !tableStart(i,arr)){
        const ws=(arr[i].match(/^\s*/)||[""])[0];
        if(indentWidth(ws)<=baseIndent)break;
        item.body+='<span class="list-cont">'+inline(arr[i].trim())+'</span>';
        i++;
      }
      items.push(item);
    }
    const pureLtrList=rtl&&items.length>0&&items.every(it=>isPureLtr(stripMd(it.raw)));
    const listAttrs=pureLtrList?' dir="ltr" class="md-ltr-list"':"";
    const html='<'+tag+startAttr+listAttrs+'>'+items.map(it=>'<li>'+it.body+it.nested+'</li>').join("")+'</'+tag+'>';
    return {html,next:i};
  }

  function parseBlocks(arr){
    let out="",i=0;
    while(i<arr.length){
      const line=arr[i];
      if(!line.trim()){i++;continue}

      if(isHr(line)){
        out+='<hr class="md-rule" aria-hidden="true">';i++;continue;
      }

      const hm=line.match(/^\s*(#{1,6})\s+(.+)$/);
      if(hm){
        const level=Math.min(6,Math.max(3,hm[1].length+2));
        const headingRaw=hm[2].trim();
        const attrs=blockAttrs(headingRaw,"heading");
        const extraClass=attrs.includes('class=')?"":' class="md-heading md-level-'+hm[1].length+'"';
        if(extraClass){
          out+='<h'+level+extraClass+'>'+inline(headingRaw)+'</h'+level+'>';
        }else{
          const cls=(attrs.match(/class="([^"]+)"/)||[])[1]||"";
          const dir=(attrs.match(/dir="([^"]+)"/)||[])[1]||"";
          out+='<h'+level+' class="md-heading md-level-'+hm[1].length+' '+cls+'"'+(dir?' dir="'+dir+'"':"")+'>'+inline(headingRaw)+'</h'+level+'>';
        }
        i++;continue;
      }

      if(tableStart(i,arr)){
        const heads=splitRow(arr[i]);
        const aligns=splitRow(arr[i+1]).map(c=>c.startsWith(":")&&c.endsWith(":")?"center":c.endsWith(":")?"right":c.startsWith(":")?"left":"");
        i+=2;
        const rows=[];
        while(i<arr.length && arr[i].trim() && arr[i].includes("|") && !isHr(arr[i])){
          rows.push(splitRow(arr[i]));i++;
        }
        const cellAttrs=(c,k)=>{
          let attrs=aligns[k]?' style="text-align:'+aligns[k]+'"':'';
          if(rtl&&isPureLtr(c))attrs+=' dir="ltr" class="md-ltr-cell"';
          return attrs;
        };
        const th=heads.map((c,k)=>'<th'+cellAttrs(c,k)+'>'+inline(c)+'</th>').join("");
        const body=rows.map(row=>'<tr>'+heads.map((_,k)=>{const c=row[k]||"";return '<td'+cellAttrs(c,k)+'>'+inline(c)+'</td>'}).join("")+'</tr>').join("");
        out+='<div class="md-table-wrap" role="region" aria-label="Scrollable comparison table" tabindex="0"><table class="md-table"><thead><tr>'+th+'</tr></thead><tbody>'+body+'</tbody></table></div>';
        continue;
      }

      if(isQuote(line)){
        const quoted=[];
        while(i<arr.length && (isQuote(arr[i])||!arr[i].trim())){
          if(!arr[i].trim())quoted.push("");
          else quoted.push(arr[i].replace(/^\s*>\s?/,""));
          i++;
        }
        out+='<blockquote class="md-quote">'+parseBlocks(quoted)+'</blockquote>';
        continue;
      }

      const li=listInfo(line);
      if(li){
        const list=parseList(arr,i,li.indent);out+=list.html;i=list.next;continue;
      }

      const para=[];
      while(i<arr.length && arr[i].trim() && !blockStart(i,arr)){
        para.push(arr[i].trim());i++;
      }
      // Safety fallback: consume at least one line if an unusual construct was
      // not matched above.
      if(!para.length){para.push(arr[i].trim());i++}
      const paraRaw=para.join(" ");
      const attrs=blockAttrs(paraRaw,"paragraph");
      out+='<p'+attrs+'>'+inline(paraRaw)+'</p>';
    }
    return out;
  }

  return [parseBlocks(lines),matches];
}

"TCP","UDP","IP","IPv4","IPv6","DNS","DHCP","HTTP","HTTPS","SSH","RDP","FTP","SFTP","SMB",
"Wi-Fi","Bluetooth","NFC","VPN","VLAN","WLAN","WWAN","NIC","RJ45","USB","USB-C","Thunderbolt",
"HDMI","RAM","SODIMM","HDD","SSD","NVMe","SATA","RAID","CPU","GPU","PSU","BIOS","UEFI","POST",
"TPM","MDM","BYOD","COPE","CYOD","IaaS","PaaS","SaaS","VM","NAT","PoE","AP","LAN","WAN",
