ۈنىلەر ئارىسىدىكى تور session ىنى قۇرۇش ۋە داۋاملاشتۇرۇشقا ئىشلىتىلىدۇ.\n\nمەنبە NetBIOS نىڭ كىچىك LAN مۇھىتىدا پايدىلىق بولسىمۇ، زامانىۋى چوڭ Internet networking نىڭ مۇرەككەپلىكى ئۈچۈن لايىھەلەنمىگەنلىكىنى تەكىتلەيدۇ.\n\n### IMAP — Internet Message Access Protocol\n\nIMAP — email نى بىر نەچچە ئۈسكۈنىدە ماسقەدەملەنگەن شەكىلدە باشقۇرۇشقا ئىشلىتىلىدىغان پروتوكول.\n\nIMAP ئىشلىتىلگەندە email client mail server بىلەن ئالاقىنى ساقلايدۇ. خەتلەرنى server دىن چۈشۈرۈپ ئۆچۈرۈشنىڭ ئورنىغا، خەتلەر server دا ساقلىنىپ، بىر ياكى بىر نەچچە client بىلەن ماسقەدەملەيدۇ.\n\nبۇنىڭ ئاساسلىق ئەۋزەللىكى — workstation، laptop ۋە smartphone غا ئوخشاش بىر نەچچە ئۈسكۈنىدىن email غا كىرگەندە ھالەتنىڭ ماس بولۇپ تۇرۇشى.\n\nبىر ئۈسكۈنىدە خەتنى:\n- ئوقۇش\n- جاۋاب بېرىش\n- ئۆچۈرۈش\nقاتارلىق ئۆزگىرىشلەر باشقا ئۈسكۈنىلەردىمۇ ئەكس ئېتىدۇ.\n\n**مەنبەدىكى مۇھىم چەك:** بۇ transcript پارچىسى IMAP نىڭ default port نومۇرىنى كۆرسەتمەيدۇ. شۇڭا بۇ تەرجىمە سىرتقى مەنبەدىن پورت نومۇرى قوشمايدۇ.\n\n### SNMP — Simple Network Management Protocol\n\nمەنبە SNMP نىڭ بۇ objective دا بىۋاسىتە سىنالمايدىغانلىقىنى، ئەمما networking دا بىلىشكە تېگىشلىك مۇھىم پروتوكول ئىكەنلىكىنى ئېيتىدۇ.\n\nSNMP:\n- router\n- switch\n- server\n- printer\nقاتارلىق تور ئۈسكۈنىلىرىدىن ئۇچۇر توپلاش، ئۇلارنى نازارەت قىلىش ۋە باشقۇرۇشقا ئىشلىتىلىدۇ.\n\nچوڭ تور مۇھىتىدا ساغلاملىق ۋە ئىقتىدارنى داۋاملىق نازارەت قىلىش كېرەك بولغاچقا، SNMP پايدىلىق.\n\n- **Ports 161 ۋە 162**\n\nمەنبە بۇ ئىككى پورتنى manager بىلەن managed device / agent ئارىسىدىكى SNMP باشقۇرۇش ئالاقىسى بىلەن باغلايدۇ. بۇ تەرجىمە مەنبەدە بايان قىلىنمىغان قوشۇمچە SNMP پورت روللىرىنى سىرتتىن قوشمايدۇ.\n\n### LDAP — Lightweight Directory Access Protocol\n\nLDAP — توردىكى ئۇچۇرلارنى باشقۇرۇش ۋە زىيارەت قىلىشقا ئىشلىتىلىدىغان پروتوكول.\n\nمەنبە ئۇنى «تورنىڭ تېلېفون دەپتىرى» گە ئوخشىتىدۇ، چۈنكى ئۇ:\n- ئىشلەتكۈچىلەر\n- مۇلازىمەتلەر\n- باشقا تور مەنبەلىرى\nتوغرىسىدىكى ئۇچۇرنى تەشكىللەش ۋە تېپىشقا ياردەم بېرىدۇ.\n\n- **Default port: 389**\n\nبولۇپمۇ ئىشلەتكۈچى ۋە تور مۇلازىمىتى كۆپ بولغان چوڭ تەشكىلاتلاردا، administrator لارغا ئۇچۇرنى تېز تېپىش ۋە باشقۇرۇشقا ياردەم بېرىدۇ.\n\n### HTTPS — Hypertext Transfer Protocol Secure\n\nHTTPS — HTTP غا بىخەتەرلىك قەۋىتى قوشۇلغان شەكىل.\n\nئۇ World Wide Web ئارقىلىق بىخەتەر ئالاقە قىلىشقا ئىشلىتىلىدۇ ۋە يوللىنىۋاتقان سانلىق مەلۇماتنى شىفىرلايدۇ.\n\nبۇ:\n- login credential\n- شەخسىي ئۇچۇر\n- پۇل تۆلەش ئۇچۇرى\nقاتارلىق سەزگۈر سانلىق مەلۇماتنى قوغداشقا ياردەم بېرىدۇ.\n\n- **Default port: 443**\n\nHTTPS ئىشلىتىلگەن website قا كىرگەندە browser بىلەن web server ئارىسىدىكى ئالاقە شىفىرلىنىدۇ. مەنبە بۇنىڭ يولدا تىڭشاپ تۇتۇۋېلىش خەۋپىنى ئازايتىپ، browsing ۋە شەخسىي سانلىق مەلۇماتنىڭ مەخپىيەتلىكىنى قوغداشقا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### SMB — Server Message Block\n\nSMB — بىر تور ئىچىدىكى ئۈسكۈنىلەر ئارىسىدا ئورتاق زىيارەت تەمىنلەيدىغان تور ئالاقە پروتوكولى.\n\nمەنبە تۆۋەندىكىلەرنى ھەمبەھىرلەشنى مىسال قىلىدۇ:\n- ھۆججەت\n- printer\n- serial port\n\nSMB بولۇپمۇ Windows مۇھىتىدا كۆپ ئۇچرايدۇ ۋە Local Area Network دا ھۆججەت/پرىنتېر ھەمبەھىرلەشنى قوللايدۇ.\n\n- **Port: 445** — مەنبە بۇنى زامانىۋى تور تەڭشەكلىرىدە SMB نىڭ كۆپ ئىشلىتىدىغان پورتى دەپ كۆرسىتىدۇ.\n\nSMB ئارقىلىق بىر توردىكى كومپيۇتېرلار:\n- ئورتاق ھۆججەتنى ئوقۇيالايدۇ ۋە يازالايدۇ\n- server مۇلازىمىتىنى تەلەپ قىلالايدۇ\n- تور مەنبەلىرىگە كىرىشتە كىملىك دەلىللەش ۋە ھوقۇق بېرىشنى قوللىيالايدۇ\n\n### RDP — Remote Desktop Protocol\n\nRDP — تور ئارقىلىق يىراقتىكى كومپيۇتېر ياكى مۇلازىمېتىرغا كىرىشقا ئىشلىتىلىدىغان پروتوكول.\n\nSSH ۋە Telnet غا ئوخشاش remote access تەمىنلەيدۇ، ئەمما مەنبەدە RDP نىڭ مۇھىم پەرقى ئۇنىڭ **GUI (Graphical User Interface)** تەمىنلىشى دەپ چۈشەندۈرۈلگەن.\n\nئىشلەتكۈچى يىراقتىكى كومپيۇتېرنىڭ desktop مۇھىتىنى كۆرۈپ ۋە باشقۇرۇپ، خۇددى شۇ كومپيۇتېرنىڭ ئالدىدا ئولتۇرغاندەك ئىشلىتەلەيدۇ.\n\nRDP:\n- يىراقتىن باشقۇرۇش\n- يىراقتىن ئىشلەش\n- IT ياردىمى\nئۈچۈن كۆپ ئىشلىتىلىدۇ.\n\n- **Default port: 3389**\n\n### مەنبەدىكى پورتلارنى تېز ئەستە ساقلاش\n\n| Protocol | Source-stated port(s) | Source-stated purpose |\n|---|---:|---|\n| FTP | 20, 21 | ھۆججەت يۆتكەش |\n| SSH | 22 | بىخەتەر CLI remote access |\n| Telnet | 23 | شىفىرلانمىغان CLI remote access |\n| SMTP | 25 | email يوللاش |\n| DNS | 53 | domain name → IP address |\n| DHCP | 67, 68 | IP/تور تەڭشەكلىرىنى ئاپتوماتىك تەقسىملەش |\n| HTTP | 80 | شىفىرلانمىغان web traffic |\n| POP3 | 110 | email retrieval |\n| NetBIOS | 137, 139 | name/session services (source details) |\n| IMAP | — | source بۇ بۆلەكتە port بەرمەيدۇ |\n| SNMP | 161, 162 | تور ئۈسكۈنىلىرىنى نازارەت/باشقۇرۇش |\n| LDAP | 389 | directory ئۇچۇرىغا زىيارەت/باشقۇرۇش |\n| HTTPS | 443 | شىفىرلانغان web communication |\n| SMB | 445 | ھۆججەت/پرىنتېر قاتارلىق مەنبەلەرنى ھەمبەھىرلەش |\n| RDP | 3389 | GUI remote desktop |\n\nExam Objective 2.1\nTCP ۋە UDP بىلەن مۇناسىۋەتلىك پورتلار، پروتوكوللار ۋە ئۇلارنىڭ ئىشلىتىلىش مەقسىتىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## TCP بىلەن UDP نى سېلىشتۇرۇش (TCP versus UDP)\n\nئالدىنقى بۆلەكتە FTP، HTTP، DNS ۋە SMTP غا ئوخشاش **application protocol** لار كۆرۈلدى. مەنبە application protocol لارنى توردىكى ئەپلەرنىڭ سانلىق مەلۇماتنى قانداق ئالماشتۇرىدىغانلىقىنى بەلگىلەيدىغان پروتوكوللار دەپ چۈشەندۈرىدۇ.\n\nبۇ application protocol لارنىڭ سانلىق مەلۇماتىنى تور ئارقىلىق يەتكۈزۈشتە **transport protocol** بولغان TCP ۋە UDP ئىشلىتىلىدۇ.\n\nمەنبە transport protocol لارنىڭ application data نى كىچىك packet لارغا بۆلۈپ، تور ئارقىلىق يەتكۈزۈپ، نىشان تەرەپتە قايتا بىر تەرەپ قىلىنىشىغا لازىملىق يەتكۈزۈش قۇرۇلمىسىنى تەمىنلەيدىغانلىقىنى چۈشەندۈرىدۇ.\n\nTCP بىلەن UDP نىڭ ئورتاق رولى سانلىق مەلۇماتنى يەتكۈزۈش بولسىمۇ، ئۇلارنىڭ ئۇسۇلى زور دەرىجىدە پەرقلىنىدۇ.\n\n### TCP — Transmission Control Protocol\n\nTCP — **connection-oriented**، يەنى سانلىق مەلۇمات يوللاشتىن بۇرۇن قارشى تەرەپ بىلەن ئۇلىنىش قۇرىدىغان transport protocol.\n\nمەنبە TCP ئۇلىنىش قۇرۇشنى **three-way handshake** دەپ ئاتايدۇ ۋە ئۇنى تېلېفون قىلىشقا ئوخشىتىدۇ: سۆزلەشتىن بۇرۇن قارشى تەرەپنىڭ لىنىيەدە ئىكەنلىكىنى جەزملەشتۈرۈش.\n\nئۇلىنىش قۇرۇلغاندىن كېيىن TCP:\n- packet لارنىڭ ھەممىسى يېتىپ كەلدىمۇ\n- توغرا تەرتىپتە كەلدىمۇ\nدېگەننى تەكشۈرىدۇ.\n\nئەگەر بىر نەرسە كەم بولسا، مەنبە TCP نىڭ قايتا يوللاشنى (resend) تەلەپ قىلىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nشۇڭا مەنبە TCP نىڭ ئالاھىدىلىكىنى:\n- ئۇلىنىش قۇرۇش\n- packet نى تەكشۈرۈش\n- تەرتىپنى ساقلاش\n- كەم packet نى قايتا يوللىتىش\n- ئىشەنچلىك يەتكۈزۈش\nدەپ چۈشەندۈرىدۇ.\n\nمەنبە TCP نى سانلىق مەلۇماتنىڭ تولۇقلىقى ۋە ئىشەنچلىك يەتكۈزۈلۈشى مۇھىم بولغان application protocol لارغا ماس دەپ بايان قىلىدۇ.\n\n### UDP — User Datagram Protocol\n\nUDP — **connectionless**، يەنى سانلىق مەلۇمات يوللاشتىن بۇرۇن ئالدىن ئۇلىنىش قۇرمايدىغان transport protocol.\n\nمەنبە UDP نى postcard ئەۋەتىشكە ئوخشىتىدۇ:\n- تېز\n- ئاددىي\n- ئەمما چوقۇم يېتىپ بارىدىغانلىقىغا كاپالەت يوق\n\nUDP ئالدىن connection قۇرماي packet يوللايدىغان بولغاچقا، مەنبە ئۇنى TCP غا قارىغاندا تېزرەك، ئەمما ئىشەنچلىكلىكى تۆۋەنرەك دەپ چۈشەندۈرىدۇ.\n\nمەنبە UDP نىڭ speed ئىشەنچلىكلىكتىن مۇھىم بولغان ئەھۋاللارغا ماس كېلىدىغانلىقىنى، مىسال سۈپىتىدە:\n- live video streaming\n- online gaming\nنى كۆرسىتىدۇ.\n\nبۇ خىل ئەھۋالدا ھەر بىر packet نى چوقۇم قوبۇل قىلىشتىن كۆرە سانلىق مەلۇماتنىڭ تېز يېتىپ كېلىشى تېخىمۇ مۇھىم بولۇشى مۇمكىن.\n\n### TCP vs UDP — ئەستە ساقلاش\n\n| TCP | UDP |\n|---|---|\n| Connection-oriented | Connectionless |\n| ئالدىن ئۇلىنىش قۇرىدۇ | ئالدىن ئۇلىنىش قۇرمايدۇ |\n| Three-way handshake | Handshake يوق دەپ چۈشەندۈرۈلگەن |\n| Packet يېتىپ كېلىشى/تەرتىپىنى تەكشۈرىدۇ | يەتكۈزۈش كاپالىتى يوق |\n| كەم packet ئۈچۈن resend تەلەپ قىلىدۇ | مەنبە resend كاپالىتىنى بايان قىلمايدۇ |\n| ئىشەنچلىكلىككە ئەھمىيەت بېرىدۇ | سۈرئەتكە ئەھمىيەت بېرىدۇ |\n| تولۇق يەتكۈزۈش مۇھىم ئىشلارغا ماس | live streaming / online gaming غا ئوخشاش speed مۇھىم ئىشلارغا ماس |\n\n**ئىمتىھان ئۈچۈن مەنبەدىكى ئەڭ ئاددىي پەرق:**\n- **TCP = ئالدى بىلەن connection، ئاندىن ئىشەنچلىك يەتكۈزۈش**\n- **UDP = connection قۇرماي تېز يوللاش، delivery كاپالىتى يوق**\n"}, {"id": "2.2", "number": "2.2", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.2, explain wireless networking technologies. Wireless frequencies. Imagine wireless signals as invisible waves carrying data through the air.\n\nThese signal waves have different frequencies, which determine how they behave and what tasks they excel at. A signal frequency is a measurement of how fast a signal wave moves up and down. Think of a bouncing ball and you counting how many times it bounces up and down in one second.\n\nSignal frequency is similar. It measures how many times a signal wave goes up and down in one second. If it moves up and down quickly, it has a high frequency.\n\nBut if it moves up and down slowly, it has a low frequency. Signal frequencies are usually measured in hertz, which represents the number of cycles per second. The electromagnetic spectrum chart behind me shows the entire range of electromagnetic frequencies.\n\nThis is just to give you an idea of the vast nature of wireless signal frequencies. But for the CompTIA A+ exam, we are going to focus on the three primary frequency bands used in modern wireless networking. These frequency bands are 2.4 gigahertz, five gigahertz and six gigahertz.\n\nThe first frequency band we will discuss is the 2.4 gigahertz band. It's like a slow but steady marathon runner. The 2.4 gigahertz band offers better range, meaning it can travel further.\n\nThis characteristic makes it ideal for providing wifi coverage in larger spaces. The 2.4 gigahertz band can also penetrate solid objects like walls more effectively. However, since it's quite popular, the 2.4 gigahertz band can get crowded, leading to potential interference from other nearby devices competing for the same frequency.\n\nNow let's meet our speedy sprinter, the five gigahertz band. It may not travel as far as the 2.4 gigahertz band, but it offers faster and more reliable connections over shorter distances. Due to its higher frequency, the five gigahertz band can handle more data, making it ideal for higher bandwidth tasks like HD video streaming, online gaining, and file transfers.\n\nAdditionally, since the five gigahertz band is less crowded, it experiences less interference from neighboring wireless signals, though it is more affected by walls and other physical obstacles. Finally, we have the newest runner in the race, the six gigahertz band. This frequency band offers even more available bandwidth and significantly less congestion because fewer devices currently operate in this range.\n\nThe trade-off is that like five gigahertz. It has a shorter range and an even more limited ability to pass through physical obstacles. For your CompTIA exam, it's important to recognize the trade-offs between these different frequency bands and that the six gigahertz band is designed specifically to support high-performance wireless networking in environments that require speed, capacity, and minimal signal competition.\n\nExam objective 2.2, explain wireless networking technologies. Wireless channels. In this video segment, we are going to take the wireless frequency bands we just discussed and break them down further into wireless channels.\n\nImagine tuning into a radio station where each station broadcasts on a specific frequency so that signals do not collide. In wireless networking, a wireless channel works the same way. A channel is a smaller slice of a frequency band that devices use to transmit and receive data, helping reduce interference and keep communication organized.\n\nIn wireless networking, we primarily work with the 2.4 gigahertz, five gigahertz, and six gigahertz frequency bands. Each of these bands is divided into multiple channels, and the way those channels are selected can directly impact performance. Channel selection involves considering the channel's width, its frequency placement, and the band it operates within, all of which influence speed, range, and potential interference.\n\nStarting with some information about the 2.4 gigahertz band, this range is divided into multiple channels that are closely spaced together. Because these channels are wider than the separation between them, many of the channels overlap. This overlap can cause interference when multiple wireless networks operate nearby.\n\nFor this reason, channels one, six, and 11 are commonly used since they are spaced far enough apart to avoid overlapping with each other. Selecting non-overlapping channels in the 2.4 gigahertz band helps improve reliability, especially in crowded environments. Moving to the five gigahertz band, channels are more widely spaced and do not overlap in the same way.\n\nThis band offers a greater number of available channels and supports wider channel widths. A single wireless channel in this band typically starts at 20 megahertz, which provides stable performance and good compatibility. Through channel bonding, a technique that combines multiple adjacent wireless channels into a single wider channel, multiple 20 megahertz channels can be combined to form wider channels of 40, 80, or even 160 megahertz, allowing more data to be transmitted at once.\n\nWider channels increase throughput and are ideal for high bandwidth activities like video streaming and large file transfers, but they also consume more spectrum and can reduce effective range while becoming more sensitive to physical obstacles and signal interference. The six gigahertz band builds on these same concepts, offering even more available channels and wider channel options. Because this band is newer and less congested, it experiences minimal interference from competing wireless signals.\n\nHowever, like the five gigahertz band, it has a shorter range and limited ability to pass through walls. For the exam, it is important to recognize that six gigahertz is designed to support high capacity wireless environments where performance and clean channel availability are the priority. Finally, wireless channels are subject to regional regulations, which determine which channels and channel widths are allowed in different parts of the world.\n\nThese regulations exist to prevent interference with other wireless services and to protect critical communications. For example, in the 2.4 gigahertz band, the United States typically allows channels one through 11, while parts of Europe and other regions allow additional channels beyond that range. As a result, available channels and power levels can vary depending on location, making regulatory awareness an important part of wireless channel selection.\n\nExam objective 2.2, explain wireless networking technologies. Wi-Fi. When discussing wireless networks, the technology that most commonly comes to mind is Wi-Fi.\n\nWi-Fi, short for wireless fidelity, is a technology that allows computing devices to connect to and communicate with other computing devices wirelessly. It enables the transmission of data over short distances using radio waves and is most commonly used in homes, small offices, and public spaces like cafes, airports, and campuses. Earlier in this course, we covered Wi-Fi connectivity, where we focused on how a device connects to a wireless network from the user's perspective.\n\nIn this video segment, we are taking a step back to better understand what Wi-Fi actually is, how it functions at a higher level, and why it behaves the way it does. This foundational understanding will make troubleshooting and exam scenarios much easier to reason through. Wi-Fi communication begins when a device connects to a wireless access point, which acts as the bridge between the wireless device and a larger network.\n\nThat connection takes place over specific radio frequency bands, most commonly the 2.4 gigahertz, five gigahertz, and now six gigahertz bands. Each of these bands has different characteristics related to range, speed, and interference, which is why Wi-Fi performance can vary depending on environment and usage. Now that we have a working definition of Wi-Fi, we can move toward understanding how it is standardized.\n\nSince Wi-Fi was first introduced in 1997, it has evolved through multiple standards developed by the IEEE, or the Institute of Electrical and Electronics Engineers. The IEEE is a professional organization known for developing technical standards across many industries, including networking and telecommunications. Within the large collection of standards developed by the IEEE, the 802 family of standards focuses on local area networking, also known as LAN communications.\n\nFrom there, a specific subset of those standards applies to wireless networking. That subset is known as 802.11. The 802.11 standards define how Wi-Fi works, how devices communicate wirelessly, and how wireless local area networks, or WLANs, operate.\n\nWith that foundation in place, the next video segment will focus on the individual 802.11 standards you need to recognize for the CompTIA A+ Core 1 certification exam, and how they differ in terms of performance, frequency use, and capabilities. Exam objective 2.2, explain wireless networking technologies. 802.11 standards.\n\nThe first Wi-Fi standard appeared in 1997 with the introduction of the IEEE 802.11 standard. This original version laid the groundwork for wireless networking by allowing devices to communicate without physical cables. While it was limited in speed and capability, it marked the beginning of Wi-Fi as we know it today, and set the stage for decades of innovation.\n\nAs wireless networking grew in popularity, demand quickly increased for faster and more reliable connections. This led to the evolution of multiple 802.11 standards, each improving on the last. Understanding how these standards progressed helps explain why modern Wi-Fi behaves the way it does.\n\nIn 1999, 802.11a was introduced. This standard operates in the five gigahertz frequency band and was among the first to support higher data rates, reaching up to 54 megabits per second. While it offered improved performance, it's shorter range and higher cost at the time limited widespread adoption.\n\nLater that same year, 802.11b was released. This standard operates in the 2.4 gigahertz frequency band, which provides better range and improved wall penetration, but is more susceptible to interference. Its maximum throughput reached 11 megabits per second, and its lower cost helped Wi-Fi gain mainstream popularity.\n\nIn 2003, 802.11g arrived. It also uses the 2.4 gigahertz band, but increased throughput to 54 megabits per second, matching the speeds of 802.11a while maintaining the longer range benefits of the 2.4 gigahertz frequency band. This made it a widely adopted standard for many years.\n\nThe next major advancement came with 802.11n, introduced in 2009. This standard operates in both the 2.4 gigahertz and five gigahertz frequency bands, and marked a major shift in wireless performance. One of its most important contributions was the introduction of multiple input multiple output, often called MIMO.\n\nWith support for multiple data streams, 802.11n offers a theoretical maximum throughput of up to 600 megabits per second. MIMO, which was introduced with 802.11n, works by using multiple antennas to transmit and receive data at the same time, allowing several data streams to flow simultaneously instead of one at a time. This parallel transmission improves overall efficiency and performance, especially in environments with multiple connected devices.\n\nBy supporting up to four MIMO streams, wireless communication becomes faster and more reliable compared to earlier single stream standards. In 2013, 802.11ac, also known as Wi-Fi 5, was released. This standard operates exclusively in the five gigahertz band and further increase performance through wider channels and enhanced MIMO capabilities.\n\nIt introduced multi-user MIMO, which allows an access point to communicate with multiple devices at the same time instead of serving them one at a time. Theoretical throughput under ideal conditions can reach up to 6.9 gigabits per second. Multi-user MIMO builds on the original MIMO concept by shifting the focus from a single device to multiple devices at once.\n\nWith traditional MIMO, an access point could use multiple antennas to communicate more efficiently with one device at a time. Multi-user MIMO expands this capability by allowing the access point to transmit data to several devices simultaneously. This reduces waiting time, improves overall network efficiency, and is especially beneficial in environments where many devices are connected and competing for bandwidth.\n\nNext is 802.11ax, commonly known as Wi-Fi 6, which was released in 2019. Wi-Fi 6 operates in both the 2.4 gigahertz and 5 gigahertz bands and focuses on improving efficiency, capacity, and performance in crowded environments. While its theoretical speeds can reach up to 9.6 gigabits per second, its primary benefit is better handling of multiple connected devices rather than simply increased throughput.\n\nFinally, building on Wi-Fi 6, we come to Wi-Fi 6E. This standard expands support into the 6 gigahertz band. By operating in this newer frequency range, Wi-Fi 6E provides additional bandwidth and significantly reduced congestion, making it well-suited for high-performance wireless environments.\n\nThe progression of the 802.11 standards reflects how Wi-Fi has evolved to meet growing demands for speed, efficiency, and capacity. From early wireless connections to modern high-density networks, these standards continue to shape how devices communicate wirelessly today. Exam Objective 2.2, Explain Wireless Networking Technologies.\n\nBluetooth. As mentioned earlier in this course, Bluetooth is a wireless technology that allows devices to exchange data over short distances. It enables connections between devices such as smartphones, computers, headphones, speakers, keyboards, and even car audio systems without the need for physical cables.\n\nBluetooth is designed for convenience, making it ideal for everyday tasks like listening to audio through wireless headphones or connecting peripheral devices quickly and easily. In a previous video segment on Bluetooth connectivity, we focused on how devices are paired from a user's perspective. In this video segment, we are stepping back to better understand how Bluetooth operates as a wireless networking technology and why it behaves differently from technologies like Wi-Fi.\n\nThis higher level view helps explain Bluetooth strengths, limitations, and common use cases you may see in exam scenarios. Bluetooth operates using radio waves in the 2.4 gigahertz frequency band, which is the same general range used by many Wi-Fi networks. However, Bluetooth is optimized for short range, low power communication, rather than high speed data transfer.\n\nSince its introduction in 1999, Bluetooth has steadily evolved to become more reliable, efficient, and versatile. Early versions of Bluetooth faced challenges with interference and device compatibility, but improvements were made over time. Bluetooth 1.2 introduced better interference avoidance, helping devices coexist more smoothly with other wireless technologies.\n\nBluetooth 2.0 increased data transfer speeds up to three megabits per second, and Bluetooth 2.1 simplified the pairing process, making connections easier for users. Bluetooth 3.0 introduced the ability to negotiate a Wi-Fi connection when transferring large amounts of data, allowing speeds of up to 24 megabits per second for those specific use cases. A major turning point came with Bluetooth 4.0, which introduced Bluetooth Low Energy, often called BLE.\n\nBLE was designed for devices that require very low power consumption, such as fitness trackers, smart sensors, and other IoT devices. Bluetooth 5.0 focused on improving speed, reliability, and range while maintaining low power usage. Under ideal conditions, Bluetooth 5.0 can support communication over distances up to 100 meters for certain devices.\n\nThese improvements made Bluetooth more effective in environments with multiple connected devices and expanded its usefulness beyond simple point-to-point connections. Bluetooth 6.0 continues this evolution by further refining efficiency, responsiveness, and device awareness. While it maintains Bluetooth's short range, low power design, Bluetooth 6.0 enhances how devices interact and coordinate with one another, supporting more advanced use cases in areas like smart devices, wearables, and proximity-based applications.\n\nFor the exam, it's important to recognize Bluetooth as an ongoing progression rather than focusing on specific performance numbers.\n\nExam objective 2.2. Explain wireless networking technologies. NFC.\n\nNear Field Communication, or NFC, is a wireless networking interface standard that was released in 2003. It is an innovative technology that uses radio frequencies to allow two devices to share data when they are in close proximity to each other, typically over a short distance of a few centimeters. This technology operates at a frequency of 13.56 megahertz and offers data transfer speeds up to 424 kilobits per second.\n\nWhile these speeds might seem slow compared to other wireless technologies like Wi-Fi or Bluetooth, they are perfectly suited for the types of data NFC is designed to handle, such as exchanging digital access keys or processing mobile payments. One application of NFC is in building security systems. In these systems, an NFC-enabled device like a smartphone or a security badge is tapped against a reader to gain entry.\n\nThis method is increasingly popular in modern offices and hotels due to its enhanced security and convenience. NFC's short-range capabilities makes it a more secure option compared to traditional magnetic stripe cards as it is harder to intercept or duplicate the signal. NFC has also become a cornerstone in the world of mobile payments, transforming how we conduct transactions in our daily lives.\n\nServices such as Apple Pay, Google Wallet, and Samsung Pay utilize NFC to facilitate contactless payments, providing a seamless and efficient user experience. This technology enables users to complete purchases with a simple tap of their NSC-enabled phone or smartwatch against the payment terminal. Moreover, the role of NSC in mobile payments is bolstered by its underlying technology.\n\nIt provides a one-to-one connection with bi-directional communication, meaning that two devices can send and receive data to and from each other. This two-way communication capability is essential in transactions, allowing for not just the transfer of payment information, but also the confirmation of transaction details and receipts. Additionally, NSC incorporates built-in security protocols, which are critical in safeguarding sensitive information like credit card numbers and personal identification data.\n\nThese protocols often include encryption and secure channels, ensuring that the data transmitted during a transaction is protected against potential threats. Exam objective 2.2, explain wireless networking technologies. RFID.\n\nRFID is an acronym for radio frequency identification and is a wireless networking device interface technology used to communicate and interact with RFID-enabled peripherals. This interface allows for wireless identification, tracking, and data exchange between the peripheral devices and a source computing device. This standard is best suited for enhancing automation and efficiency in various industries and applications.\n\nWhen using RFID, an RFID reader scans a tag. The tag then responds back with information that has been programmed into it. RFID systems can be either passive or active in nature.\n\nPassive RFID systems consist of an RFID tag and reader, where the tag relies on the reader's energy in the form of electrical inductance to power and transmit its stored information. Active RFID systems, on the other hand, use battery-powered tags that actively send signals to the reader, allowing for longer ranges and continuous tracking. Passive RFID is cost-effective and suitable for short-range applications, while active RFID offers greater range and real-time tracking capabilities, making it ideal for scenarios like asset management.\n\nRFID technology is widely utilized for inventory control and tracking due to its ability to provide accurate and efficient identification and monitoring of assets. By tagging items with RFID tags and deploying RFID readers, businesses can automate inventory management, streamline supply chain operations, and gain real-time visibility into stock levels, location tracking, and movement history. RFID technology is also commonly employed for physical access control systems.\n\nBy utilizing RFID cards or key fobs embedded with RFID tags, individuals can easily gain authorized access to secured areas by presenting their credentials to RFID readers. Using RFID in this manner assists in ensuring only authorized personnel can enter restricted areas.", "uyghur": "Exam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## سىمسىز چاستوتىلار (Wireless Frequencies)\n\nسىمسىز سىگنالنى ھاۋا ئارقىلىق سانلىق مەلۇمات ئېلىپ ماڭىدىغان، كۆزگە كۆرۈنمەيدىغان دولقۇن دەپ تەسەۋۋۇر قىلىشقا بولىدۇ. بۇ دولقۇنلارنىڭ چاستوتىسى (frequency) ئوخشىمايدۇ؛ چاستوتا ئۇلارنىڭ قانداق ھەرىكەت قىلىشىغا ۋە قايسى خىل ئىشقا تېخىمۇ ماس كېلىشىگە تەسىر كۆرسىتىدۇ.\n\n**سىگنال چاستوتىسى** — بىر دولقۇننىڭ بىر سېكۇنت ئىچىدە قانچە قېتىم بىر تولۇق ئايلىنىش (cycle) قىلىدىغانلىقىنى ئۆلچەيدىغان مىقدار.\n\nمەنبە بۇنى بىر توپنىڭ يۇقىرى-تۆۋەن قاڭقىشىغا ئوخشىتىدۇ:\n- تېز قاڭقىسا — چاستوتىسى يۇقىرى\n- ئاستا قاڭقىسا — چاستوتىسى تۆۋەن\n\nچاستوتا ئادەتتە **Hertz (Hz)** بىلەن ئۆلچىنىدۇ؛ Hertz بىر سېكۇنتتىكى cycle سانىنى كۆرسىتىدۇ.\n\nCompTIA A+ ئۈچۈن مەنبە زامانىۋى سىمسىز توردا ئىشلىتىلىدىغان ئۈچ ئاساسىي چاستوتا بەلبېغىغا مەركەزلىشىدۇ:\n- **2.4 GHz**\n- **5 GHz**\n- **6 GHz**\n\n### 2.4 GHz بەلبېغى\n\nمەنبە 2.4 GHz نى «ئاستا، ئەمما چىداملىق ئۇزۇن مۇساپە يۈگۈرگۈچى» گە ئوخشىتىدۇ.\n\nئاساسلىق ئالاھىدىلىكلىرى:\n- قاپلاش ئارىلىقى ئۇزۇنراق\n- چوڭراق رايونغا Wi‑Fi قاپلاشقا ماس\n- تامغا ئوخشاش قاتتىق توسالغۇلاردىن ئۆتۈش ئىقتىدارى تېخىمۇ ياخشى\n- ناھايىتى كۆپ ئىشلىتىلىدىغان بولغاچقا، بەلباغ قىستاڭ بولۇپ قېلىشى مۇمكىن\n- يېقىن ئەتراپتىكى باشقا ئۈسكۈنىلەر بىلەن بىر چاستوتا دائىرىسىنى تالىشىپ، سىگنال ئارىلىشىشى (interference) پەيدا بولۇشى مۇمكىن\n\n### 5 GHz بەلبېغى\n\nمەنبە 5 GHz نى «تېز يۈگۈرگۈچى» گە ئوخشىتىدۇ.\n\n2.4 GHz بىلەن سېلىشتۇرغاندا:\n- قاپلاش ئارىلىقى قىسقىراق\n- قىسقا ئارىلىقتا تېزرەك ۋە ئىشەنچلىكرەك ئۇلىنىش تەمىنلىشى مۇمكىن\n- تېخىمۇ كۆپ سانلىق مەلۇماتنى بىر تەرەپ قىلىشقا ماس\n- HD سىن تارقىتىش، online gaming ۋە ھۆججەت يۆتكەشكە ئوخشاش يۇقىرى bandwidth تەلەپ قىلىدىغان ئىشلارغا ماس\n- ئادەتتە 2.4 GHz غا قارىغاندا قىستاڭچىلىق ئازراق بولغاچقا، قوشنا سىمسىز سىگناللاردىن كېلىدىغان interference ئازراق بولۇشى مۇمكىن\n- تام ۋە باشقا جىسمانىي توسالغۇلاردىن تېخىمۇ كۆپ تەسىرلىنىدۇ\n\n### 6 GHz بەلبېغى\n\nمەنبە 6 GHz نى بۇ «مۇسابىقىدىكى ئەڭ يېڭى يۈگۈرگۈچى» دەپ تونۇشتۇرىدۇ.\n\nئاساسلىق ئالاھىدىلىكلىرى:\n- تېخىمۇ كۆپ ئىشلىتىشكە بولىدىغان bandwidth\n- مەنبە بويىچە، بۇ دائىرىدە ئىشلەيدىغان ئۈسكۈنە سانى ئازراق بولغاچقا قىستاڭچىلىق كۆرۈنەرلىك تۆۋەن\n- 5 GHz غا ئوخشاش قاپلاش ئارىلىقى قىسقىراق\n- جىسمانىي توسالغۇلاردىن ئۆتۈش ئىقتىدارى تېخىمۇ چەكلىك\n\n**ئىمتىھاندا ئەستە تۇتۇڭ:** مەنبە 6 GHz نى سۈرئەت، سىغىم ۋە سىگنال رىقابىتى ئاز بولۇش مۇھىم بولغان يۇقىرى ئىقتىدارلىق سىمسىز تور مۇھىتىغا ماس دەپ چۈشەندۈرىدۇ.\n\n### 2.4 GHz vs 5 GHz vs 6 GHz — مەنبە بويىچە قىسقا سېلىشتۇرۇش\n\n| بەلباغ | قاپلاش ئارىلىقى | توسالغۇدىن ئۆتۈش | سۈرئەت / سىغىم | قىستاڭچىلىق / interference |\n|---|---|---|---|---|\n| 2.4 GHz | ئۇزۇنراق | ياخشىراق | تۆۋەنرەك | كۆپرەك |\n| 5 GHz | قىسقىراق | تۆۋەنرەك | يۇقىرىراق | ئازراق |\n| 6 GHz | قىسقا | تېخىمۇ چەكلىك | يۇقىرى ئىقتىدار / كۆپ bandwidth | مەنبە بويىچە ئەڭ ئاز |\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## سىمسىز قاناللار (Wireless Channels)\n\nسىمسىز frequency band نى بىر رادىيو دائىرىسىگە ئوخشىتىشقا بولىدۇ. رادىيو ئىستانسىلىرى ئوخشىمىغان چاستوتىلاردا تارقىتىدىغانغا ئوخشاش، سىمسىز توردا **channel** بىر frequency band نىڭ كىچىكرەك بۆلىكى بولۇپ، ئۈسكۈنىلەر شۇ بۆلەك ئارقىلىق سانلىق مەلۇمات يوللايدۇ ۋە قوبۇل قىلىدۇ.\n\nقاناللارنىڭ مەقسىتى:\n- ئالاقىنى تەرتىپلىك ساقلاش\n- سىگناللارنىڭ بىر-بىرىگە سوقۇلۇشىنى ئازايتىش\n- interference نى ئازايتىش\n\n2.4 GHz، 5 GHz ۋە 6 GHz بەلباغلىرىنىڭ ھەر بىرى بىر نەچچە قانالغا بۆلۈنىدۇ.\n\nChannel تاللىغاندا مەنبە تۆۋەندىكى ئامىللارنىڭ سۈرئەت، قاپلاش ۋە interference غا تەسىر قىلىدىغانلىقىنى چۈشەندۈرىدۇ:\n- **channel width** — قانال كەڭلىكى\n- قانالنىڭ چاستوتا دائىرىسىدىكى ئورنى\n- قايسى frequency band دا ئىشلەۋاتقانلىقى\n\n### 2.4 GHz قاناللىرى\n\n2.4 GHz بەلبېغىدا قاناللار بىر-بىرىگە ناھايىتى يېقىن ئورۇنلاشقان.\n\nمەنبە بويىچە، قانال كەڭلىكى قاناللار ئارىسىدىكى ئايرىلىشتىن كەڭ بولغاچقا، نۇرغۇن قانال بىر-بىرى بىلەن **overlap** قىلىدۇ.\n\nبىر رايوندا بىر نەچچە Wi‑Fi تورى overlap بولغان قاناللارنى ئىشلىتىۋاتسا، interference كۈچىيىشى مۇمكىن.\n\nشۇڭا مەنبە 2.4 GHz دا تۆۋەندىكى قاناللارنىڭ كۆپ ئىشلىتىلىدىغانلىقىنى كۆرسىتىدۇ:\n- **Channel 1**\n- **Channel 6**\n- **Channel 11**\n\nبۇ ئۈچ قانال بىر-بىرىدىن يېتەرلىك يىراق بولۇپ، ئۆزئارا overlap قىلماسلىق ئۈچۈن تاللىنىدۇ.\n\nقىستاڭچىلىق بار مۇھىتتا non-overlapping channel تاللاش تورنىڭ ئىشەنچلىكلىكىنى ياخشىلاشقا ياردەم بېرىدۇ.\n\n### 5 GHz قاناللىرى\n\n5 GHz دا قاناللار بىر-بىرىدىن كەڭرەك ئايرىلغان بولۇپ، 2.4 GHz دىكىدەك overlap مەسىلىسى ئاز.\n\nبۇ بەلباغ:\n- تېخىمۇ كۆپ قانال\n- تېخىمۇ كەڭ channel width\nنى قوللايدۇ.\n\nمەنبە بىر 5 GHz قانىلىنىڭ ئادەتتە **20 MHz** دىن باشلىنىدىغانلىقىنى، بۇنىڭ مۇقىم ئىقتىدار ۋە ياخشى compatibility تەمىنلەيدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Channel Bonding — قاناللارنى بىرلەشتۈرۈش\n\n**Channel bonding** — بىر-بىرىگە يانداش بىر نەچچە سىمسىز قانالنى بىر كەڭ قانال قىلىپ بىرلەشتۈرۈش تېخنىكىسى.\n\nمەنبە بويىچە:\n- 20 MHz\n- 40 MHz\n- 80 MHz\n- 160 MHz\n\nكەڭلىكتىكى قاناللارنى ئىشلىتىشكە بولىدۇ.\n\nكەڭ قانال:\n- بىر ۋاقىتتا تېخىمۇ كۆپ سانلىق مەلۇمات يەتكۈزەلەيدۇ\n- throughput نى ئاشۇرالايدۇ\n- video streaming ۋە چوڭ ھۆججەت يۆتكەشكە ماس\n\nئەمما trade-off بار:\n- تېخىمۇ كۆپ spectrum ئىشلىتىدۇ\n- ئەمەلىي قاپلاش ئارىلىقىنى ئازايتىشى مۇمكىن\n- جىسمانىي توسالغۇ ۋە سىگنال interference غا تېخىمۇ سەزگۈر بولۇشى مۇمكىن\n\n### 6 GHz قاناللىرى\n\n6 GHz مۇشۇ ئاساسىي channel ئۇقۇملىرىنى داۋاملاشتۇرىدۇ، ئەمما مەنبە بويىچە:\n- تېخىمۇ كۆپ قانال بار\n- كەڭرەك قانال تاللانمىلىرى بار\n- يېڭىراق ۋە قىستاڭچىلىق ئاز بولغاچقا competing wireless signal دىن كېلىدىغان interference ناھايىتى ئاز\n\nئەمما 5 GHz غا ئوخشاش:\n- قاپلاش ئارىلىقى قىسقىراق\n- تامدىن ئۆتۈش ئىقتىدارى چەكلىك\n\nمەنبە 6 GHz نى يۇقىرى سىغىم، يۇقىرى ئىقتىدار ۋە «پاكىز» قانال تاللانمىسى مۇھىم بولغان مۇھىتقا ماس دەپ چۈشەندۈرىدۇ.\n\n### رايونلۇق قائىدىلەر (Regional Regulations)\n\nWireless channel نىڭ ھەممىسى دۇنيانىڭ ھەر قايسى جايىدا ئوخشاش ئىشلىتىشكە رۇخسەت قىلىنمايدۇ.\n\nرايونلۇق قائىدىلەر:\n- قايسى channel لارغا رۇخسەت قىلىنىدىغانلىقى\n- قايسى channel width لارغا رۇخسەت قىلىنىدىغانلىقى\n- power level نىڭ قانچىلىك بولىدىغانلىقى\nغا تەسىر قىلىدۇ.\n\nبۇ قائىدىلەر باشقا سىمسىز مۇلازىمەتلەر بىلەن interference نىڭ ئالدىنى ئېلىش ۋە مۇھىم ئالاقە سىستېمىلىرىنى قوغداش ئۈچۈن بار.\n\nمەنبەدىكى مىسال:\n- ئامېرىكىدا 2.4 GHz ئۈچۈن ئادەتتە **channel 1–11**\n- ياۋروپانىڭ بەزى جايلىرى ۋە باشقا رايونلاردا بۇ دائىرىدىن سىرتقى قوشۇمچە channel لارمۇ ئىشلىتىلىشى مۇمكىن\n\nشۇڭا channel تاللىغاندا ئۈسكۈنىنىڭ قەيەردە ئىشلىتىلىۋاتقانلىقىمۇ مۇھىم.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## Wi‑Fi\n\nWi‑Fi — ھېسابلاش ئۈسكۈنىلىرىنىڭ جىسمانىي سىمسىز، رادىيو دولقۇنى ئارقىلىق بىر-بىرى ۋە تور بىلەن ئالاقە قىلىشىغا يول قويىدىغان تېخنىكا.\n\nمەنبە Wi‑Fi نى **“wireless fidelity”** نىڭ قىسقارتىلمىسى دەپ چۈشەندۈرىدۇ. بۇ deep-review تەرجىمىسى مەنبەنىڭ شۇ ئىپادىسىنى ئۆزگەرتмәй، مەنبەگە تەۋە دەپ ئېنىق كۆرسىتىدۇ.\n\nWi‑Fi كۆپىنچە:\n- ئۆي\n- كىچىك ئىشخانا\n- قەھۋەخانا\n- ئايرودروم\n- campus\nقاتارلىق جايلاردا قىسقا ئارىلىقتا سانلىق مەلۇمات يەتكۈزۈشكە ئىشلىتىلىدۇ.\n\nWi‑Fi ئالاقىسى ئۈسكۈنىنىڭ **wireless access point (AP)** قا ئۇلىنىشىدىن باشلىنىدۇ.\n\nAccess point:\n- سىمسىز ئۈسكۈنە بىلەن\n- تېخىمۇ چوڭ تور\nئارىسىدىكى كۆۋرۈك رولىنى ئوينايدۇ.\n\nبۇ ئۇلىنىش مەنبەدە كۆپىنچە تۆۋەندىكى radio frequency band لار ئارقىلىق بولىدۇ:\n- 2.4 GHz\n- 5 GHz\n- 6 GHz\n\nبۇ ئۈچ بەلباغنىڭ قاپلاش، سۈرئەت ۋە interference ئالاھىدىلىكلىرى ئوخشىمىغاچقا، Wi‑Fi ئىقتىدارى مۇھىت ۋە ئىشلىتىشكە قاراپ پەرقلىنىدۇ.\n\n### IEEE ۋە 802.11\n\nمەنبە Wi‑Fi نىڭ 1997-يىلدىن باشلاپ IEEE تەرىپىدىن تۈزۈلگەن بىر نەچچە ئۆلچەم ئارقىلىق تەرەققىي قىلغانلىقىنى چۈشەندۈرىدۇ.\n\n**IEEE — Institute of Electrical and Electronics Engineers** تور ۋە تېلېكوممۇنىكاتسىيەنىمۇ ئۆز ئىچىگە ئالغان نۇرغۇن ساھە ئۈچۈن تېخنىكىلىق ئۆلچەم تۈزۈدىغان كەسپىي تەشكىلات.\n\nIEEE نىڭ:\n- **802** ئائىلىسى Local Area Networking، يەنى LAN ئالاقىسىغا مۇناسىۋەتلىك\n- **802.11** تارماق ئۆلچىمى سىمسىز تورغا مۇناسىۋەتلىك\n\nمەنبە بويىچە 802.11:\n- Wi‑Fi نىڭ قانداق ئىشلەيدىغانلىقى\n- ئۈسكۈنىلەرنىڭ سىمسىز قانداق ئالاقە قىلىدىغانلىقى\n- WLAN (Wireless Local Area Network) نىڭ قانداق ئىشلەيدىغانلىقى\nنى بەلگىلەيدۇ.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## IEEE 802.11 ئۆلچەملىرى (802.11 Standards)\n\n### ئەسلى IEEE 802.11 — 1997\n\nمەنبە بويىچە تۇنجى Wi‑Fi ئۆلچىمى 1997-يىلى IEEE 802.11 بىلەن باشلانغان.\n\nبۇ نەشر:\n- ئۈسكۈنىلەرنىڭ جىسمانىي سىمسىز ئالاقە قىلىشىغا يول ئاچقان\n- سۈرئەت ۋە ئىقتىدار جەھەتتە چەكلىك بولغان\n- كېيىنكى Wi‑Fi تەرەققىياتىنىڭ ئاساسىنى سالغان\n\n### 802.11a — 1999\n\n- **Frequency band: 5 GHz**\n- **مەنبەدىكى ئەڭ يۇقىرى data rate: 54 Mbps**\n- دەسلەپكى تېز Wi‑Fi ئۆلچەملىرىنىڭ بىرى\n\nمەنبە بويىچە ئىقتىدارى ياخشى بولسىمۇ:\n- قاپلاش ئارىلىقى قىسقىراق\n- شۇ ۋاقىتتىكى تەننەرخى يۇقىرىراق\nبولغاچقا كەڭ تارقىلىشى چەكلىك بولغان.\n\n### 802.11b — 1999\n\n- **Frequency band: 2.4 GHz**\n- **Maximum throughput: 11 Mbps**\n\n2.4 GHz ئىشلىتىدىغان بولغاچقا مەنبە:\n- قاپلاش ئارىلىقى ياخشىراق\n- تامدىن ئۆتۈش ئىقتىدارى ياخشىراق\n- interference غا تېخىمۇ سەزگۈر\nدەپ چۈشەندۈرىدۇ.\n\nباھاسى تۆۋەنرەك بولۇشى Wi‑Fi نىڭ كەڭ ئاممىغا تارقىلىشىغا ياردەم بەرگەن.\n\n### 802.11g — 2003\n\n- **Frequency band: 2.4 GHz**\n- **Maximum throughput: 54 Mbps**\n\nمەنبە 802.11g نىڭ:\n- 802.11a غا ئوخشاش 54 Mbps سۈرئەت\n- 2.4 GHz نىڭ ئۇزۇنراق قاپلاش ئەۋزەللىكى\nنى بىرلەشتۈرگەنلىكىنى چۈشەندۈرىدۇ.\n\nشۇڭا ئۇ ئۇزۇن يىللار كەڭ ئىشلىتىلگەن ئۆلچەم بولغان.\n\n### 802.11n — 2009\n\n- **Frequency bands: 2.4 GHz ۋە 5 GHz**\n- **مەنبەدىكى نەزەرىي ئەڭ يۇقىرى throughput: 600 Mbps**\n- **MIMO** نى مۇھىم يېڭىلىق سۈپىتىدە تونۇشتۇرىدۇ\n\n**MIMO — Multiple Input Multiple Output**\n\nمەنبە MIMO نى بىر نەچچە antenna ئارقىلىق سانلىق مەلۇماتنى بىر ۋاقىتتا يوللاش ۋە قوبۇل قىلىش، يەنى بىر data stream نىڭ ئورنىغا بىر نەچچە stream نى پاراللېل ئىشلىتىش ئۇسۇلى دەپ چۈشەندۈرىدۇ.\n\nبۇ:\n- ئۈنۈمدارلىقنى ياخشىلايدۇ\n- ئىقتىدارنى ئاشۇرىدۇ\n- كۆپ ئۈسكۈنە ئۇلانغان مۇھىتتا پايدىلىق\n\nمەنبە 802.11n نىڭ **4 گىچە MIMO stream** نى قوللىشى مۇمكىنلىكىنى بايان قىلىدۇ.\n\n### 802.11ac / Wi‑Fi 5 — 2013\n\n- **Frequency band: پەقەت 5 GHz**\n- **مەنبەدىكى نەزەرىي ئەڭ يۇقىرى throughput: 6.9 Gbps**\n- كەڭ channel ۋە ياخشىلانغان MIMO ئىقتىدارلىرى\n\nبۇ ئۆلچەم **MU‑MIMO (Multi-User MIMO)** نى تونۇشتۇرىدۇ.\n\nئادەتتىكى MIMO دا access point بىر ۋاقىتتا بىر ئۈسكۈنىگە بىر نەچچە antenna ئارقىلىق تېخىمۇ ئۈنۈملۈك ئالاقە قىلالايدۇ.\n\nMU‑MIMO بۇ ئىقتىدارنى كېڭەيتىپ، access point نىڭ بىر ۋاقىتتا بىر نەچچە ئۈسكۈنىگە سانلىق مەلۇمات يوللىشىغا يول قويىدۇ.\n\nمەنبە بويىچە بۇ:\n- كۈتۈش ۋاقتىنى ئازايتىدۇ\n- ئومۇمىي تور ئۈنۈمدارلىقىنى ياخشىلايدۇ\n- نۇرغۇن ئۈسكۈنە bandwidth ئۈچۈن رىقابەتلىشىدىغان مۇھىتتا پايدىلىق\n\n### 802.11ax / Wi‑Fi 6 — 2019\n\n- **Frequency bands: 2.4 GHz ۋە 5 GHz**\n- **مەنبەدىكى نەزەرىي ئەڭ يۇقىرى سۈرئەت: 9.6 Gbps**\n\nمەنبە Wi‑Fi 6 نىڭ ئەڭ مۇھىم نۇقتىسىنى پەقەت سۈرئەت دەپ قارىمايدۇ؛ ئۇنىڭ ئاساسلىق ئەۋزەللىكى:\n- efficiency\n- capacity\n- قىستاڭ مۇھىتتا كۆپ ئۈسكۈنىنى ياخشى بىر تەرەپ قىلىش\nدەپ چۈشەندۈرىدۇ.\n\n### Wi‑Fi 6E\n\nWi‑Fi 6E — Wi‑Fi 6 نىڭ قوللاش دائىرىسىنى **6 GHz** بەلبېغىغا كېڭەيتىدۇ.\n\nمەنبە بويىچە 6 GHz ئىشلىتىش:\n- قوشۇمچە bandwidth\n- كۆرۈنەرلىك تۆۋەن congestion\nتەمىنلەپ، يۇقىرى ئىقتىدارلىق سىمسىز مۇھىتقا ماس كېلىدۇ.\n\n### 802.11 ئۆلچەملىرى — مەنبە بويىچە تېز ئەستە ساقلاش\n\n| Standard | Year | Band | Source-stated key point |\n|---|---:|---|---|\n| 802.11 | 1997 | مەنبە بۇ پارچىدا band كۆرسەتمەيدۇ | تۇنجى ئاساس |\n| 802.11a | 1999 | 5 GHz | 54 Mbps |\n| 802.11b | 1999 | 2.4 GHz | 11 Mbps، ئۇزۇنراق range |\n| 802.11g | 2003 | 2.4 GHz | 54 Mbps |\n| 802.11n | 2009 | 2.4 / 5 GHz | 600 Mbps، MIMO |\n| 802.11ac / Wi‑Fi 5 | 2013 | 5 GHz | 6.9 Gbps، MU‑MIMO |\n| 802.11ax / Wi‑Fi 6 | 2019 | 2.4 / 5 GHz | 9.6 Gbps، efficiency/capacity |\n| Wi‑Fi 6E | — | 6 GHz | قوشۇمچە bandwidth، congestion ئاز |\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## Bluetooth\n\nBluetooth — قىسقا ئارىلىقتا ئۈسكۈنىلەرنىڭ سانلىق مەلۇمات ئالماشتۇرۇشىغا يول قويىدىغان سىمسىز تېخنىكا.\n\nئۇ:\n- smartphone\n- computer\n- headphone\n- speaker\n- keyboard\n- car audio system\nقاتارلىق ئۈسكۈنىلەرنى سىمسىز ئۇلاشقا ئىشلىتىلىدۇ.\n\nمەنبە Bluetooth نىڭ **2.4 GHz** چاستوتا بەلبېغىدىكى رادىيو دولقۇنىنى ئىشلىتىدىغانلىقىنى چۈشەندۈرىدۇ. بۇ Wi‑Fi نىڭمۇ كۆپ ئىشلىتىدىغان ئومۇمىي دائىرىلىرىنىڭ بىرى.\n\nئەمما Bluetooth نىڭ لايىھە نىشانى Wi‑Fi بىلەن ئوخشاش ئەمەس:\n- **قىسقا ئارىلىق**\n- **تۆۋەن توك سەرپىياتى**\nغا ئەھمىيەت بېرىدۇ؛ يۇقىرى سۈرئەتلىك سانلىق مەلۇمات يەتكۈزۈش ئاساسلىق نىشان ئەمەس.\n\n### Bluetooth نەشرلىرى — مەنبە بويىچە\n\n**Bluetooth 1.2**\n- interference دىن ساقلىنىشنى ياخشىلىغان\n- باشقا سىمسىز تېخنىكىلار بىلەن بىللە ئىشلىشىنى ئاسانلاشتۇرغان\n\n**Bluetooth 2.0**\n- مەنبە بويىچە data transfer speed نى **3 Mbps گىچە** ئاشۇرغان\n\n**Bluetooth 2.1**\n- pairing جەريانىنى ئاددىيلاشتۇرغان\n\n**Bluetooth 3.0**\n- كۆپ سانلىق مەلۇمات يۆتكەشتە Wi‑Fi connection بىلەن كېلىشىش ئىقتىدارىنى تونۇشتۇرغان\n- مەنبە بويىچە شۇ مەخسۇس ئەھۋاللاردا **24 Mbps گىچە** سۈرئەتنى قوللىغان\n\n**Bluetooth 4.0**\n- **BLE — Bluetooth Low Energy** نى تونۇشتۇرغان\n- fitness tracker، smart sensor ۋە باشقا IoT device غا ئوخشاش ناھايىتى تۆۋەن توك سەرپىياتى تەلەپ قىلىدىغان ئۈسكۈنىلەرگە ماس\n\n**Bluetooth 5.0**\n- سۈرئەت، ئىشەنچلىكلىك ۋە range نى ياخشىلاشقا مەركەزلەشكەن\n- تۆۋەن power usage نى ساقلىغان\n- مەنبە بويىچە، ئەڭ ياخشى شارائىتتا بەزى ئۈسكۈنىلەردە **100 مېتىرغىچە** ئالاقە قوللىشى مۇمكىن\n\n**Bluetooth 6.0**\n- مەنبە بۇ نەشرنى efficiency، responsiveness ۋە device awareness نى يەنىمۇ ياخشىلايدىغان داۋاملىق تەرەققىيات دەپ چۈشەندۈرىدۇ\n- قىسقا ئارىلىق ۋە تۆۋەن توك لايىھىسىنى ساقلىغان ھالدا smart device، wearable ۋە proximity-based application غا ئوخشاش تېخىمۇ ئىلغار ئىشلىتىشلەرنى قوللاشقا ياردەم بېرىدۇ\n\n**ئىمتىھاندا مەنبەنىڭ تەكىتلىشى:** Bluetooth نى پەقەت يەككە performance سانلىرى ئارقىلىق ئەستە ساقلاشتىن كۆرە، ۋاقىتنىڭ ئۆتۈشى بىلەن ئىشەنچلىكلىك، ئۈنۈمدارلىق ۋە ئىقتىدارى ياخشىلانغان سىمسىز تېخنىكا سۈپىتىدە چۈشىنىش مۇھىم.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## NFC — Near Field Communication\n\nNFC — ئىككى ئۈسكۈنىنىڭ بىر-بىرىگە ناھايىتى يېقىن تۇرغاندا رادىيو چاستوتىسى ئارقىلىق سانلىق مەلۇمات ئالماشتۇرۇشىغا يول قويىدىغان سىمسىز interface ئۆلچىمى.\n\nمەنبە بويىچە:\n- **2003-يىلى ئېلان قىلىنغان**\n- ئادەتتىكى ئىش ئارىلىقى بىر نەچچە سانتىمېتىر\n- **Frequency: 13.56 MHz**\n- **Data rate: 424 Kbps گىچە**\n\nبۇ سۈرئەت Wi‑Fi ياكى Bluetooth قا سېلىشتۇرغاندا تۆۋەن كۆرۈنسىمۇ، NFC لايىھەلەنگەن قىسقا ۋە كىچىك سانلىق مەلۇمات ئالماشتۇرۇش ئىشلىرىغا ماس.\n\nمەنبە مىسال قىلىدۇ:\n- digital access key ئالماشتۇرۇش\n- mobile payment\n- building access\n\n### بىنا كىرىش كونتروللۇقى\n\nNFC بار smartphone ياكى security badge نى reader غا يېقىنلاشتۇرۇش ئارقىلىق كىرىش ھوقۇقىنى دەلىللەشكە بولىدۇ.\n\nمەنبە NFC نىڭ قىسقا ئارىلىق ئىقتىدارى سىگنالنى يىراقتىن تۇتۇۋېلىش ياكى كۆچۈرۈشنى قىيىنلاشتۇرۇپ، ئەنئەنىۋى magnetic stripe card غا سېلىشتۇرغاندا بىخەتەرلىك ئەۋزەللىكى بېرەلەيدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### كۆچمە پۇل تۆلەش\n\nمەنبە تۆۋەندىكى مۇلازىمەتلەرنى NFC ئارقىلىق contactless payment نىڭ مىسالى قىلىدۇ:\n- Apple Pay\n- Google Wallet\n- Samsung Pay\n\nئىشلەتكۈچى NFC بار تېلېفون ياكى smartwatch نى payment terminal غا يېقىنلاشتۇرۇپ سېتىۋېلىشنى تاماملىيالايدۇ.\n\n### ئىككى يۆنىلىشلىك ئالاقە\n\nمەنبە NFC نىڭ:\n- one-to-one connection\n- bi-directional communication\nنى قوللايدىغانلىقىنى چۈشەندۈرىدۇ.\n\nيەنى ئىككى ئۈسكۈنە بىر-بىرىگە سانلىق مەلۇمات يوللىيالايدۇ ۋە قوبۇل قىلالايدۇ.\n\nپۇل تۆلەشتە بۇ:\n- payment information نى يوللاش\n- transaction detail نى جەزملەشتۈرۈش\n- receipt ئۇچۇرىنى قايتۇرۇش\nقاتارلىق ئىككى تەرەپلىك ئالاقىگە ياردەم بېرىدۇ.\n\nمەنبە يەنە NFC دا سەزگۈر ئۇچۇرلارنى قوغداشقا ياردەم بېرىدىغان بىخەتەرلىك پروتوكوللىرى، شىفىرلاش ۋە بىخەتەر channel لارنىڭ بولۇشى مۇمكىنلىكىنى بايان قىلىدۇ.\n\n**Transcript correction:** بۇ مەنبە پارچىسى دەسلەپ `NFC` دەپ توغرا باشلايدۇ، كېيىن بىر نەچچە قېتىم `NSC` دەپ خاتا transcript قىلىنغان. Reviewed Uyghur نىڭ ھەممىسىدە توغرا canonical term بولغان **NFC** ئىشلىتىلدى؛ ئەسلى English source ئۆزگەرتىلمىدى.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## RFID — Radio Frequency Identification\n\nRFID — **Radio Frequency Identification** نىڭ قىسقارتىلمىسى.\n\nمەنبە RFID نى RFID ئىقتىدارى بار peripheral بىلەن سىمسىز ئالاقە قىلىدىغان device-interface تېخنىكىسى دەپ چۈشەندۈرىدۇ.\n\nRFID ئارقىلىق:\n- سىمسىز تونۇش (identification)\n- ئىز قوغلاش (tracking)\n- سانلىق مەلۇمات ئالماشتۇرۇش\nمۇمكىن.\n\nRFID سىستېمىسىدا ئادەتتە:\n1. **RFID reader** tag نى scan قىلىدۇ.\n2. **RFID tag** ئۆزىگە پروگراممىلانغان ئۇچۇر بىلەن جاۋاب قايتۇرىدۇ.\n\n### Passive RFID\n\nPassive RFID سىستېمىسىدا:\n- tag نىڭ ئۆزىدە باتارېيە بولمايدۇ\n- مەنبە بويىچە reader دىن كەلگەن ئېنېرگىيە / electrical induction ئارقىلىق tag قوزغىلىپ، ساقلانغان ئۇچۇرنى يوللايدۇ\n\nئالاھىدىلىكلىرى:\n- باھاسى ئەرزانراق\n- قىسقا ئارىلىقتىكى ئىشلارغا ماس\n\n### Active RFID\n\nActive RFID tag:\n- ئۆزىنىڭ باتارېيەسىگە ئىگە\n- reader غا ئاكتىپ سىگنال يوللايدۇ\n\nبۇ:\n- ئۇزۇنراق range\n- داۋاملىق tracking\nئىقتىدارىغا ياردەم بېرىدۇ.\n\nمەنبە active RFID نى asset management غا ئوخشاش ئەھۋاللارغا ماس دەپ كۆرسىتىدۇ.\n\n### Inventory ۋە Asset Tracking\n\nRFID:\n- inventory control\n- asset tracking\nدا كەڭ ئىشلىتىلىدۇ.\n\nنەرسىلەرگە RFID tag چاپلاپ، مۇۋاپىق جايلارغا RFID reader ئورنىتىش ئارقىلىق كارخانا:\n- inventory management نى ئاپتوماتلاشتۇرالايدۇ\n- supply chain جەريانىنى ئاددىيلاشتۇرالايدۇ\n- stock level نى كۆرەلەيدۇ\n- نەرسىنىڭ ئورنىنى ئىزلىيەلەيدۇ\n- ھەرىكەت تارىخىنى نازارەت قىلالايدۇ\n\n### جىسمانىي كىرىش كونتروللۇقى (Physical Access Control)\n\nRFID security card ياكى RFID tag بار key fob نى reader غا كۆرسىتىش ئارقىلىق قوغدالغان رايونغا كىرىش ھوقۇقىنى دەلىللەشكە بولىدۇ.\n\nمەنبە بۇ ئىشلىتىشنىڭ پەقەت رۇخسەت بېرىلگەن خادىملارنىڭ چەكلەنگەن رايونغا كىرىشىگە ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Passive vs Active RFID — مەنبە بويىچە\n\n| Passive RFID | Active RFID |\n|---|---|\n| ئۆزىنىڭ باتارېيەسى يوق | باتارېيە بار |\n| reader ئېنېرگىيەسىگە تايىنىدۇ | ئۆزى سىگنال يوللايدۇ |\n| قىسقا range | ئۇزۇنراق range |\n| ئەرزانراق | تېخىمۇ ئىلغار tracking |\n| قىسقا ئارىلىق ئىشلىرىغا ماس | asset management / continuous tracking غا ماس |\n"}, {"id": "2.3", "number": "2.3", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.3, summarize services provided by networked hosts. Server roles. This might be a bit of a review for some of you, but I'm going to start this video with a quick definition of what a server is.\n\nIn a logical sense, a server is a computing device that provides a service to other computing devices, known as clients. A single server can perform one role or many roles within a network, and that is exactly what we are focusing on in this video segment. First, let's talk about DNS servers or domain name system servers.\n\nThink of DNS as the internet's phone book. When you type a website name like www.certificationsynergy.com into your browser, you are using a fully qualified domain name, often abbreviated as FQDN. DNS servers translate that human-friendly name into an IP address, which is the numerical address computers use to locate resources on a network.\n\nWithout DNS, users would have to remember IP addresses instead of simple names, which would make everyday internet use extremely impractical. Next, we have DHCP servers, which stands for Dynamic Host Configuration Protocol. DHCP servers automatically assign IP addresses to devices when they connect to a network.\n\nIn addition to an IP address, a DHCP server typically provides other essential network settings, such as the subnet mask, default gateway, and DNS server information. This automatic configuration process allows devices to connect and communicate without requiring manual network setup. File servers provide a centralized location where users can store, access, and share files across the network.\n\nThis makes collaboration easier and helps organizations manage data more efficiently by keeping files in a single, controlled location. Print servers manage printing resources on a network. They receive print jobs from users and forward them to the appropriate printer.\n\nThis centralizes printer management and prevents each device from needing a direct connection to every printer. Mail servers are responsible for sending, receiving, and storing email messages. When you send an email, it is processed by a mail server before being delivered to the recipient.\n\nMail servers also store messages so users can access their email from multiple devices. Syslog servers are used for logging and monitoring. They collect log files and system messages from network devices, servers, and applications.\n\nThese logs are critical for troubleshooting issues, monitoring performance, and identifying security events. Web servers host websites and deliver web content to users' browsers. When you visit a website, your browser sends a request to a web server, which responds by sending back the website's data so it can be displayed on your screen.\n\nNext, we have servers that handle authentication, authorization, and accounting, commonly referred to as AAA servers. These servers verify who a user is, determines what they are allowed to access, and keeps records of their activity. AAA servers play a critical role in network security by ensuring only approved users and devices can access network resources.\n\nTwo common implementations of AAA services are RADIUS and TACACS+, which are often used to control access to networks and network devices. Now let's look at database servers, which are a new addition to the exam objectives. Database servers store, organize, and manage large amounts of structured data.\n\nApplications rely on database servers to quickly retrieve, update, and store information such as user accounts, transaction records, or inventory data. While users rarely interact with database servers directly, many web applications and services depend on them behind the scenes. Lastly, we have network time protocol servers, often abbreviated as NTP.\n\nNTP servers ensure that devices on a network have accurate and synchronized time. This is critical for logging, security events, authentication processes, and troubleshooting, since mismatched timestamps can make it difficult to track activity or correlate events accurately. Exam objective 2.3, summarize services provided by network hosts.\n\nInternet appliances. Internet appliances are specialized devices focused on specific internet related functions. Their dedicated nature contrasts with general purpose computers, offering more efficiency in handling particular tasks.\n\nOne critical type of internet appliance is the spam gateway. This tool plays a vital role in filtering out unsolicited emails or spam, which not only clutters your inbox, but also poses significant security threats. To maintain their effectiveness, spam gateways use a range of techniques such as blacklisting, whitelisting, and content analysis.\n\nBy regularly updating the rules and keyword filters on these internet appliances, you ensure the spam gateway can adapt to the ever evolving nature of spam emails, which frequently change their content and tactics. This adaptability is key in safeguarding users from malicious emails. By continuously updating the keywords and rules for filtering, spam gateways provide a dynamic and robust defense against the influx of spam, making them an indispensable tool in email security management.\n\nAnother pivotal appliance is the unified threat management or UTM device. UTM devices offer a multifaceted security solution by combining several protective measures into a single platform. These measures include firewall protection, antivirus programs, anti-spam tools, intrusion detection, intrusion prevention, VPNs, content filtering, and more.\n\nUTMs are especially beneficial for small and medium-sized businesses, providing a cost-effective, streamlined approach to comprehensive network security, an all-in-one security device, if you will. Now we will turn our attention to load balancers. These devices distribute network or application traffic across several servers, preventing any single server from becoming overloaded.\n\nThis distribution ensures smoother, more reliable network service access by ensuring each server is utilized efficiently. Lastly, we have proxy servers. A standard internet connection provides direct access between a local network and resources across the internet.\n\nSo where does a proxy server fit in? A proxy server interrupts the standard connection in order to establish a monitored connection. That is why we can refer to it as a middleman.\n\nThe proxy server can then intercept network traffic, allowing only approved traffic to pass through. Conversely, the proxy server will deny network traffic that violates any security rules. Additionally, if you find something is being blocked that shouldn't be, no problem.\n\nJust configure a traffic exemption. Exam objective 2.3, summarize services provided by network hosts. Legacy and embedded systems.\n\nLet's begin this video segment by defining what a legacy system is. In the realm of IT, a legacy system refers to outdated computer systems, software, or technology that is still in use, despite newer versions being available. These systems are often critical to an organization's daily operations, making upgrading or replacing them a complex, risky, or costly endeavor.\n\nThey may lack support, updates, or compatibility with newer technologies, which can pose challenges in terms of security and efficiency. However, their continued use is usually due to the system's pivotal role in specific business processes or the high cost and effort required for an upgrade. Now let's shift our focus to embedded systems.\n\nAn embedded system is a specialized computing system that performs dedicated functions. Unlike a general purpose computer, an embedded system performs specific tasks and is designed with a very specific set of requirements. These systems are ubiquitous in everyday life, found in devices like microwaves, traffic lights, and thermostats.\n\nThey are known for being highly reliable, efficient, and optimized for their particular application, often running for years without the need for intervention. Finally, to keep in step with the CompTIA A, plus core one exam objectives, let's discuss how these concepts apply to SCADA systems. SCADA, or Supervisory Control and Data Acquisition systems, are designed to monitor and control industrial environments.\n\nThese systems often rely on a combination of legacy and embedded systems. Legacy systems are common in SCADA environments due to the longevity and stability required in critical infrastructures like power plants or water treatment facilities. Embedded systems, on the other hand, are used within SCADA for specific control tasks, like regulating the pressure in pipelines or maintaining temperatures in industrial processes.\n\nTheir reliability and efficiency make embedded systems ideal for these critical control functions. Exam objective 2.3, Summarize services provided by networked hosts. IoT devices.\n\nIn previous video segments, we discussed common networked devices, such as servers, workstations, smartphones, and tablets. But what about all the other devices that have processing power and network connectivity built into them? These devices fall into a broad category known as Internet of Things, often abbreviated as IoT.\n\nFrom the viewpoint of information technology, IoT specifically refers to physical devices, objects, and sensors that are connected to a network and are capable of collecting, exchanging, and transmitting data. These devices are typically built with sensors, an embedded operating system, and network connectivity that allows them to communicate with other devices, services, or users. Back in our Tech+ course, IoT was introduced as a foundational concept.\n\nHere, we are focusing on how IoT devices function as networked hosts within modern environments. IoT devices are designed to interact with both people and other systems. This interaction allows for data collection, automation, remote monitoring, and remote control.\n\nFrom a networking perspective, each IoT device is another endpoint on the network, often communicating with cloud services or centralized controllers to perform its function. In home environments, IoT devices commonly include smart appliances, home automation systems, doorbells, thermostats, security cameras, and streaming media devices. These devices connect to the network to provide convenience, automation, and remote access, often through mobile applications or web interfaces.\n\nIoT devices are also widely used in vehicles, where connected systems provide features such as navigation, diagnostics, maintenance alerts, and remote access capabilities. In healthcare, IoT-enabled medical devices allow for continuous monitoring and data sharing, supporting improved patient care and faster response times. Other common examples include fitness equipment and wearable devices like smartwatches and fitness trackers.\n\nFor the exam, it's important to recognize IoT devices as network-connected endpoints that extend networking beyond traditional computers. While they offer convenience and powerful capabilities, they also introduce additional considerations related to connectivity, management, and security. IoT devices are everywhere, and understanding their role as networked hosts is a key part of modern networking environments.", "uyghur": "Exam Objective 2.3\nتورغا ئۇلانغان host لار تەمىنلەيدىغان مۇلازىمەتلەرنى خۇلاسىلەڭ.\n\n## مۇلازىمېتىر روللىرى (Server Roles)\n\nلوگىكىلىق جەھەتتىن ئېيتقاندا، **server** — باشقا ھېسابلاش ئۈسكۈنىلىرىگە مۇلازىمەت تەمىنلەيدىغان ھېسابلاش ئۈسكۈنىسى. بۇ مۇلازىمەتنى ئىشلىتىدىغان ئۈسكۈنىلەر ئادەتتە **client** دەپ ئاتىلىدۇ.\n\nبىر server توردا:\n- پەقەت بىرلا رولنى\n- ياكى بىر نەچچە رولنى\nبىرلا ۋاقىتتا ئورۇندىيالايدۇ.\n\nبۇ objective دا مەنبە نۇرغۇن كۆپ ئۇچرايدىغان server روللىرىنى تونۇشتۇرىدۇ.\n\n### DNS Server — Domain Name System Server\n\nDNS server نى ئىنتېرنېتنىڭ «تېلېفون دەپتىرى» گە ئوخشىتىشقا بولىدۇ.\n\nمەسىلەن، browser غا:\n\n`www.certificationsynergy.com`\n\nغا ئوخشاش بىر website نامىنى كىرگۈزگەندە، بۇ **FQDN — Fully Qualified Domain Name** نىڭ بىر مىسالى.\n\nDNS server:\n- ئادەم ئاسان ئوقۇيالايدىغان domain name نى\n- كومپيۇتېر تور مەنبەسىنى تېپىشقا ئىشلىتىدىغان IP address قا\nتەرجىمە قىلىدۇ.\n\nDNS بولمىسا، ئادەم website نامىنىڭ ئورنىغا IP address لارنى ئەستە ساقلىشىغا توغرا كېلىدىغان بولغاچقا، كۈندىلىك ئىنتېرنېت ئىشلىتىش بەك قولايسىز بولاتتى.\n\n### DHCP Server — Dynamic Host Configuration Protocol Server\n\nDHCP server ئۈسكۈنە تورغا ئۇلانغاندا ئۇنىڭغا IP address نى ئاپتوماتىك تەقسىملەيدۇ.\n\nمەنبە بويىچە DHCP server ئادەتتە IP address بىلەن بىرگە يەنە:\n- subnet mask\n- default gateway\n- DNS server ئۇچۇرى\nقاتارلىق زۆرۈر تور تەڭشەكلىرىنىمۇ تەمىنلەيدۇ.\n\nبۇ ئاپتوماتىك تەڭشەش جەريانى ئۈسكۈنىنىڭ network setting لىرىنى قولدا بىرمۇ-بىر كىرگۈزمەيلا تورغا قوشۇلۇپ ئالاقە قىلىشىغا ياردەم بېرىدۇ.\n\n### File Server\n\nFile server — تور ئىچىدىكى ئىشلەتكۈچىلەرنىڭ ھۆججەتنى:\n- مەركەزلىك ساقلىشى\n- زىيارەت قىلىشى\n- ھەمبەھىرلىشى\nئۈچۈن بىر ئورتاق جاي تەمىنلەيدۇ.\n\nبۇ:\n- ھەمكارلىشىپ ئىشلەشنى ئاسانلاشتۇرىدۇ\n- سانلىق مەلۇماتنى بىر كونترول قىلىنغان جايدا ساقلاشقا ياردەم بېرىدۇ\n- تەشكىلاتنىڭ ھۆججەت باشقۇرۇشىنى ئۈنۈملۈكرەك قىلىدۇ\n\n### Print Server\n\nPrint server تور ئىچىدىكى پرىنتېر مەنبەلىرىنى باشقۇرىدۇ.\n\nئۇ:\n1. ئىشلەتكۈچىدىن print job نى قوبۇل قىلىدۇ.\n2. شۇ خىزمەتنى مۇۋاپىق printer غا يوللايدۇ.\n\nبۇ ئارقىلىق printer باشقۇرۇش مەركەزلىشىدۇ ۋە ھەر بىر كومپيۇتېرنىڭ ھەر بىر printer بىلەن بىۋاسىتە ئايرىم ئۇلىنىشىغا بولغان ئېھتىياج ئازىيىدۇ.\n\n### Mail Server\n\nMail server ئېلېكترونلۇق خەتلەرنى:\n- يوللاش\n- قوبۇل قىلىش\n- ساقلاش\nئۈچۈن مەسئۇل.\n\nئىشلەتكۈچى email يوللىغاندا، خەت ئالدى بىلەن mail server ئارقىلىق بىر تەرەپ قىلىنىپ، ئاندىن قوبۇل قىلغۇچىغا يەتكۈزۈلىدۇ.\n\nMail server يەنە خەتلەرنى ساقلايدۇ؛ شۇڭا ئىشلەتكۈچى بىر نەچچە ئۈسكۈنىدىن ئۆزىنىڭ email ىغا زىيارەت قىلالايدۇ.\n\n### Syslog Server\n\nSyslog server **log توپلاش ۋە نازارەت قىلىش** ئۈچۈن ئىشلىتىلىدۇ.\n\nئۇ:\n- network device\n- server\n- application\nلاردىن log file ۋە system message لارنى يىغىدۇ.\n\nبۇ log لار:\n- مەسىلە ھەل قىلىش (troubleshooting)\n- ئىقتىدارنى نازارەت قىلىش\n- بىخەتەرلىك ۋەقەسىنى بايقاش\nئۈچۈن ئىنتايىن مۇھىم.\n\n### Web Server\n\nWeb server website نى ساقلايدۇ ۋە web content نى ئىشلەتكۈچىنىڭ browser ىغا يەتكۈزىدۇ.\n\nWebsite قا كىرگەندە:\n1. Browser web server غا request يوللايدۇ.\n2. Web server website سانلىق مەلۇماتىنى قايتۇرىدۇ.\n3. Browser شۇ مەزمۇننى ئېكراندا كۆرسىتىدۇ.\n\n### AAA Server — Authentication, Authorization, Accounting\n\nAAA server تور بىخەتەرلىكىدە مۇھىم رول ئوينايدۇ.\n\n**AAA** ئۈچ بۆلەكتىن تەركىب تاپىدۇ:\n\n- **Authentication — كىملىك دەلىللەش:** «بۇ ئىشلەتكۈچى كىم؟»\n- **Authorization — ھوقۇق بېرىش:** «ئۇ نېمىگە زىيارەت قىلالايدۇ؟»\n- **Accounting — پائالىيەت خاتىرىسىنى ساقلاش:** «ئۇ نېمە ئىش قىلدى؟»\n\nمەنبە بويىچە AAA server:\n- ئىشلەتكۈچىنىڭ كىملىكىنى دەلىللەيدۇ\n- ئۇنىڭ قايسى مەنبەگە كىرىشكە ھوقۇقلۇق ئىكەنلىكىنى بەلگىلەيدۇ\n- پائالىيىتىنى خاتىرىلەيدۇ\n\nبۇ پەقەت رۇخسەت بېرىلگەن ئىشلەتكۈچى ۋە ئۈسكۈنىنىڭلا تور مەنبەلىرىگە كىرىشىگە ياردەم بېرىدۇ.\n\nمەنبە AAA مۇلازىمىتىنىڭ ئىككى كۆپ ئۇچرايدىغان implementation ىنى كۆرسىتىدۇ:\n- **RADIUS**\n- **TACACS+**\n\nئۇلار كۆپىنچە تور ۋە network device لارغا كىرىشنى كونترول قىلىشتا ئىشلىتىلىدۇ.\n\n### Database Server\n\nDatabase server زور مىقداردىكى **قۇرۇلمىلىق سانلىق مەلۇمات (structured data)** نى:\n- ساقلايدۇ\n- تەشكىللەيدۇ\n- باشقۇرىدۇ\n\nApplication لار database server دىن:\n- ئۇچۇرنى تېز تېپىش\n- يېڭىلاش\n- يېڭى ئۇچۇر ساقلاش\nئۈچۈن پايدىلىنىدۇ.\n\nمەنبە مىساللىرى:\n- user account\n- transaction record\n- inventory data\n\nئىشلەتكۈچى database server بىلەن بىۋاسىتە ئالاقە قىلماسلىقى مۇمكىن، ئەمما نۇرغۇن web application ۋە online service ئارقا كۆرۈنۈشتە database server غا تايىنىدۇ.\n\n### NTP Server — Network Time Protocol Server\n\nNTP server تور ئىچىدىكى ئۈسكۈنىلەرنىڭ ۋاقتىنى توغرا ۋە بىر-بىرىگە **ماسقەدەملەنگەن** ھالەتتە ساقلاشقا ياردەم بېرىدۇ.\n\nبۇ بولۇپمۇ:\n- logging\n- security event\n- authentication process\n- troubleshooting\nئۈچۈن مۇھىم.\n\nئەگەر ئۈسكۈنىلەرنىڭ timestamp لىرى ماس كەلمىسە:\n- بىر پائالىيەت قاچان بولغانلىقىنى ئېنىقلاش\n- بىر نەچچە ئۈسكۈنىدىكى ۋەقەلەرنى ئۆزئارا باغلاش (correlate)\nقىيىنلىشىدۇ.\n\n### Server Roles — تېز ئەستە ساقلاش\n\n| Server role | مەنبەدىكى ئاساسىي مۇلازىمەت |\n|---|---|\n| DNS server | Domain name → IP address |\n| DHCP server | IP ۋە تور تەڭشەكلىرىنى ئاپتوماتىك بېرىش |\n| File server | مەركەزلىك ھۆججەت ساقلاش / ھەمبەھىرلەش |\n| Print server | Print job نى باشقۇرۇپ printer غا يوللاش |\n| Mail server | Email يوللاش / قوبۇل قىلىش / ساقلاش |\n| Syslog server | Log ۋە system message يىغىش |\n| Web server | Website / web content تەمىنلەش |\n| AAA server | Authentication / Authorization / Accounting |\n| Database server | Structured data ساقلاش ۋە باشقۇرۇش |\n| NTP server | تور ۋاقتىنى ماسقەدەملەش |\n\nExam Objective 2.3\nتور host لىرى تەمىنلەيدىغان مۇلازىمەتلەرنى خۇلاسىلەڭ.\n\n## ئىنتېرنېت مەخسۇس ئۈسكۈنىلىرى (Internet Appliances)\n\n**Internet appliance** — مەلۇم بىر ئىنتېرنېت ياكى تور ئىقتىدارىغا مەخسۇس لايىھەلەنگەن ئۈسكۈنە.\n\nGeneral-purpose computer نۇرغۇن خىل خىزمەت قىلىش ئۈچۈن لايىھەلەنسە، internet appliance مەلۇم بىر خىزمەتنى ئۈنۈملۈك قىلىشقا مەركەزلىشىدۇ.\n\nمەنبە تۆت خىل مۇھىم internet appliance نى قاپلايدۇ:\n- spam gateway\n- UTM\n- load balancer\n- proxy server\n\n### Spam Gateway\n\nSpam gateway لازىمسىز email، يەنى spam نى سۈزۈپ چىقىرىشقا ئىشلىتىلىدۇ.\n\nSpam پەقەت inbox نى قالايمىقانلاشتۇرۇپلا قالماي، بىخەتەرلىك خەۋپى پەيدا قىلىدىغان زىيانلىق email لارنىمۇ ئۆز ئىچىگە ئېلىشى مۇمكىن.\n\nمەنبە spam gateway نىڭ تۆۋەندىكى ئۇسۇللارنى ئىشلىتىشى مۇمكىنلىكىنى بايان قىلىدۇ:\n- blacklisting\n- whitelisting\n- content analysis\n\nSpam email نىڭ مەزمۇنى ۋە ھۇجۇم ئۇسۇلى دائىم ئۆزگىرىپ تۇرىدىغان بولغاچقا، spam gateway دىكى:\n- rule\n- keyword filter\nلارنى قەرەللىك يېڭىلاپ تۇرۇش مۇھىم.\n\nبۇ سۈزگۈچنىڭ يېڭى spam شەكىللىرىگە ماسلىشىشىغا ۋە ئىشلەتكۈچىنى زىيانلىق email دىن قوغدىشىغا ياردەم بېرىدۇ.\n\n### UTM — Unified Threat Management\n\nUTM — بىر نەچچە بىخەتەرلىك ئىقتىدارىنى **بىرلا platform / ئۈسكۈنىگە بىرلەشتۈرگەن** تور بىخەتەرلىك چارىسى.\n\nمەنبە UTM نىڭ تۆۋەندىكى قوغداش ئىقتىدارلىرىنى بىرلەشتۈرۈشى مۇمكىنلىكىنى مىسال قىلىدۇ:\n- firewall\n- antivirus\n- anti-spam\n- intrusion detection\n- intrusion prevention\n- VPN\n- content filtering\n\nUTM بولۇپمۇ كىچىك ۋە ئوتتۇرا تىپتىكى كارخانىلارغا:\n- بىرلا جايدىن باشقۇرۇلىدىغان\n- نىسبەتەن ئۈنۈملۈك\n- «all-in-one» تور بىخەتەرلىك چارىسى\nتەمىنلىشى مۇمكىن.\n\n### Load Balancer\n\nLoad balancer تور ياكى application traffic نى بىر نەچچە server ئارىسىدا تارقىتىدۇ.\n\nمەقسىتى:\n- بىر server غا ھەممە يۈك چۈشۈپ كېتىشىنىڭ ئالدىنى ئېلىش\n- بارلىق server مەنبەلىرىنى تېخىمۇ ئۈنۈملۈك ئىشلىتىش\n- مۇلازىمەتنى تېخىمۇ راۋان ۋە ئىشەنچلىك قىلىش\n\nيەنى بىر server نورمىدىن ئارتۇق يۈكلەنمەسلىكى ئۈچۈن traffic بىر نەچچە server غا بۆلۈپ بېرىلىدۇ.\n\n### Proxy Server\n\nئادەتتىكى تور ئۇلىنىشىدا local network بىلەن Internet دىكى resource ئارىسىدا بىۋاسىتە ئالاقە بولۇشى مۇمكىن.\n\nProxy server بۇ بىۋاسىتە ئالاقىنىڭ ئارىسىغا كىرىپ، **ئوتتۇرا ۋاسىتىچى (middleman)** سۈپىتىدە ئىشلەيدۇ.\n\nمەنبە proxy server نىڭ network traffic نى تۇتۇپ:\n- تەستىقلانغان traffic نى ئۆتكۈزۈشى\n- security rule غا خىلاپ traffic نى رەت قىلىشى\nمۇمكىنلىكىنى چۈشەندۈرىدۇ.\n\nئەگەر رۇخسەت قىلىنىشى كېرەك بولغان traffic خاتا ھالدا توسۇلۇپ قالسا، مەنبە **traffic exemption** تەڭشەش ئارقىلىق شۇ traffic قا ئالاھىدە رۇخسەت بېرىشنى تىلغا ئالىدۇ.\n\n### Internet Appliances — ئەستە ساقلاش\n\n| Appliance | ئاساسىي رول |\n|---|---|\n| Spam gateway | Spam / زىيانلىق email نى سۈزۈش |\n| UTM | بىر ئۈسكۈنىدە كۆپ خىل security function |\n| Load balancer | Traffic نى بىر نەچچە server غا تارقىتىش |\n| Proxy server | Client بىلەن Internet ئارىسىدا traffic نى نازارەت/سۈزۈش |\n\nExam Objective 2.3\nتور host لىرى تەمىنلەيدىغان مۇلازىمەتلەرنى خۇلاسىلەڭ.\n\n## كونا سىستېما ۋە ئىچىگە سىڭدۈرۈلگەن سىستېما (Legacy and Embedded Systems)\n\n### Legacy System\n\n**Legacy system** — يېڭى نەشر ياكى يېڭى تېخنىكا بار بولسىمۇ، يەنىلا ئىشلىتىلىۋاتقان كونا:\n- computer system\n- software\n- technology\n\nLegacy system بەزىدە تەشكىلاتنىڭ كۈندىلىك خىزمىتى ئۈچۈن ئىنتايىن مۇھىم بولغاچقا، ئۇنى يېڭىلاش ياكى ئالماشتۇرۇش:\n- مۇرەككەپ\n- خەتەرلىك\n- قىممەت\nبولۇشى مۇمكىن.\n\nمەنبە legacy system دا تۆۋەندىكى مەسىلىلەر بولۇشى مۇمكىنلىكىنى بايان قىلىدۇ:\n- ئىشلەپچىقارغۇچى قوللىشىنىڭ يوقلۇقى\n- update نىڭ توختاپ قېلىشى\n- يېڭى تېخنىكا بىلەن compatibility مەسىلىسى\n- بىخەتەرلىك ۋە ئۈنۈمدارلىق قىيىنچىلىقى\n\nشۇنداق بولسىمۇ، ئۇنىڭ مەلۇم business process ئۈچۈن مۇھىم بولۇشى ياكى upgrade نىڭ باھاسى/خىزمەت مىقدارى بەك چوڭ بولۇشى سەۋەبىدىن ئىشلىتىش داۋاملىشىشى مۇمكىن.\n\n### Embedded System\n\n**Embedded system** — مەلۇم بىر ياكى چەكلىك خىزمەتنى ئورۇنداش ئۈچۈن لايىھەلەنگەن مەخسۇس ھېسابلاش سىستېمىسى.\n\nGeneral-purpose computer ھەر خىل پروگرامما ۋە خىزمەتنى ئىجرا قىلىشقا لايىھەلەنسە، embedded system:\n- مەلۇم بىر ۋەزىپىگە\n- ئالدىن بېكىتىلگەن تەلەپكە\nمەخسۇس ماسلاشتۇرۇلغان.\n\nمەنبە كۈندىلىك تۇرمۇشتىكى مىساللارنى كۆرسىتىدۇ:\n- microwave\n- traffic light\n- thermostat\n\nEmbedded system لار:\n- ئىشەنچلىك\n- ئۈنۈملۈك\n- مەلۇم application ئۈچۈن optimization قىلىنغان\nبولۇشى بىلەن تونۇلىدۇ.\n\nمەنبە بەزى embedded system لارنىڭ كۆپ يىل ئىنساننىڭ بىۋاسىتە ئارىلىشىشىغا ئېھتىياجلىق بولماي ئىشلىشى مۇمكىنلىكىنى بايان قىلىدۇ.\n\n### SCADA — Supervisory Control and Data Acquisition\n\nSCADA سىستېمىسى سانائەت مۇھىتىنى **نازارەت قىلىش ۋە كونترول قىلىش** ئۈچۈن لايىھەلەنگەن.\n\nمەنبە SCADA دا:\n- legacy system\n- embedded system\nنىڭ بىرلەشتۈرۈلۈپ ئىشلىتىلىشى كۆپ ئۇچرايدىغانلىقىنى چۈشەندۈرىدۇ.\n\n#### SCADA دىكى Legacy System\n\nPower plant ياكى water treatment facility غا ئوخشاش critical infrastructure دا:\n- ئۇزۇن مۇددەتلىك ئىشلىتىش\n- مۇقىملىق\nمۇھىم بولغاچقا، legacy system لار يەنىلا ئىشلىتىلىشى مۇمكىن.\n\n#### SCADA دىكى Embedded System\n\nEmbedded system مەخسۇس control task ئۈچۈن ئىشلىتىلىدۇ.\n\nمەنبە مىساللىرى:\n- pipeline دىكى بېسىمنى تەڭشەش\n- سانائەت جەريانىدىكى تېمپېراتۇرىنى ساقلاش\n\nEmbedded system نىڭ ئىشەنچلىك ۋە ئۈنۈملۈك بولۇشى ئۇنى بۇ خىل critical control function غا ماس قىلىدۇ.\n\n### Legacy vs Embedded — ئەڭ مۇھىم پەرق\n\n| Legacy System | Embedded System |\n|---|---|\n| كونا، ئەمما يەنىلا ئىشلىتىلىۋاتقان system / software / technology | مەلۇم خىزمەت ئۈچۈن لايىھەلەنگەن مەخسۇس computing system |\n| يېڭى تېخنىكا بار بولسىمۇ ساقلىنىپ قالغان | باشتىنلا dedicated function ئۈچۈن ياسالغان |\n| Support / update / compatibility مەسىلىسى بولۇشى مۇمكىن | Reliability / efficiency / task optimization مۇھىم |\n| ئالماشتۇرۇش قىممەت ياكى خەتەرلىك بولۇشى مۇمكىن | Microwave، thermostat، industrial controller غا ئوخشاش جايلاردا ئۇچرايدۇ |\n\nExam Objective 2.3\nتورغا ئۇلانغان host لار تەمىنلەيدىغان مۇلازىمەتلەرنى خۇلاسىلەڭ.\n\n## IoT ئۈسكۈنىلىرى (Internet of Things Devices)\n\n**IoT — Internet of Things** تورغا ئۇلانغان، ھېسابلاش ئىقتىدارى بار جىسمانىي ئۈسكۈنە، نەرسە ۋە sensor لارنىڭ كەڭ تۈرىنى كۆرسىتىدۇ.\n\nIT نۇقتىسىدىن مەنبە IoT ئۈسكۈنىسىنى:\n- تورغا ئۇلانغان\n- سانلىق مەلۇمات توپلىيالايدىغان\n- سانلىق مەلۇمات ئالماشتۇرالايدىغان\n- سانلىق مەلۇمات يوللىيالايدىغان\nجىسمانىي ئۈسكۈنە دەپ چۈشەندۈرىدۇ.\n\nIoT ئۈسكۈنىسىدە ئادەتتە:\n- sensor\n- embedded operating system\n- network connectivity\nبولىدۇ.\n\nبۇ ئارقىلىق ئۇ:\n- باشقا ئۈسكۈنە\n- service\n- user\nبىلەن ئالاقە قىلالايدۇ.\n\n### IoT = Network Endpoint\n\nبۇ objective نىڭ مۇھىم نۇقتىسى — IoT نى پەقەت «smart device» دەپلا ئەمەس، **تورغا ئۇلانغان endpoint** دەپ چۈشىنىش.\n\nتور نۇقتىسىدىن ھەر بىر IoT ئۈسكۈنىسى توردىكى يەنە بىر endpoint بولۇپ:\n- cloud service\n- centralized controller\nبىلەن ئالاقە قىلىپ ئۆزىنىڭ خىزمىتىنى ئورۇندىشى مۇمكىن.\n\nIoT ئىنسان ۋە باشقا سىستېمىلار بىلەن ئالاقە قىلىش ئارقىلىق:\n- data collection\n- automation\n- remote monitoring\n- remote control\nنى قوللايدۇ.\n\n### ئۆيدىكى IoT مىساللىرى\n\nمەنبە ئۆي مۇھىتىدا:\n- smart appliance\n- home automation system\n- smart doorbell\n- thermostat\n- security camera\n- streaming media device\nنى IoT مىسالى قىلىدۇ.\n\nبۇ ئۈسكۈنىلەر كۆپىنچە mobile application ياكى web interface ئارقىلىق:\n- قولايلىق\n- automation\n- remote access\nتەمىنلەيدۇ.\n\n### ماشىنىدىكى IoT\n\nConnected vehicle system ئارقىلىق:\n- navigation\n- diagnostics\n- maintenance alert\n- remote access\nقاتارلىق ئىقتىدارلار تەمىنلىنىشى مۇمكىن.\n\n### ساقلىق ساقلاشتىكى IoT\n\nIoT ئىقتىدارى بار medical device:\n- داۋاملىق monitoring\n- data sharing\nنى قوللاپ، مەنبە بويىچە patient care نى ياخشىلاش ۋە response time نى تېزلىتىشكە ياردەم بېرىشى مۇمكىن.\n\n### Wearable ۋە Fitness ئۈسكۈنىلىرى\n\nمەنبە يەنە:\n- fitness equipment\n- smartwatch\n- fitness tracker\nنى IoT مىسالى قىلىدۇ.\n\n### IoT نىڭ ئەھمىيىتى\n\nئىمتىھان ئۈچۈن IoT نى:\n> **ئەنئەنىۋى كومپيۇتېردىن ھالقىغان، تورغا ئۇلانغان endpoint**\n\nدەپ تونۇش مۇھىم.\n\nIoT ئۈسكۈنىسى كۈچلۈك ئىقتىدار ۋە قولايلىق تەمىنلىسىمۇ، مەنبە بويىچە ئۇ:\n- connectivity\n- management\n- security\nجەھەتتە قوشۇمچە ئويلىنىشقا تېگىشلىك مەسىلىلەرنىمۇ ئېلىپ كېلىدۇ.\n\n### Objective 2.3 — قىسقا ئەستە ساقلاش\n\n- **Server roles** = تور ئىچىدىكى مەركەزلىك مۇلازىمەتلەر\n- **Internet appliances** = مەلۇم تور/بىخەتەرلىك خىزمىتىگە مەخسۇس ئۈسكۈنىلەر\n- **Legacy system** = كونا، ئەمما يەنىلا مۇھىم بولغان سىستېما\n- **Embedded system** = dedicated function ئۈچۈن ياسالغان سىستېما\n- **SCADA** = سانائەت مۇھىتىنى نازارەت/كونترول قىلىش\n- **IoT** = تورغا ئۇلانغان جىسمانىي endpoint\n"}, {"id": "2.4", "number": "2.4", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.4, explain common network configuration concepts. DNS, the Domain Name System, or DNS, is a networking service that translates domain names into IP addresses that computers use to communicate with each other. Think of DNS as a phone book, allowing us to use easy-to-remember domain names, such as www.certificationsenergy.com, instead of complex IP addresses.\n\nThese user-friendly names are known as fully qualified domain names, or FQDNs. The DNS server takes this FQDN and translates it into its corresponding IP address, directing your device to the precise location of the resource you wish to access. This conversion from FQDN to IP address is essential for navigating the internet, as it spares us from having to memorize the numerical addresses for every website we want to access.\n\nNow, how exactly does DNS convert a fully qualified domain name into an IP address? Let's break it down, starting with what makes up an FQDN. An FQDN is a complete address used to access a specific device, across the internet, like a web server.\n\nIt's composed of several parts, including an optional subdomain or subdomains, a domain name, and a top-level domain. For an example, let's take the URL https://www.example.com/info/aboutus.html and slice out a portion of it. The FQDN will include the www as the subdomain, example as the domain, and .com as the top-level domain.\n\nWhen you use this FQDN in an attempt to search for a device, it sends a request to a DNS recursive server. This recursive server, also known as a DNS resolver, is specifically designed to handle DNS queries. The DNS recursive server then starts the process of finding the IP address that matches the FQDN you're searching for.\n\nNow, let's dive into this lookup process, step-by-step, to understand how it translates an FQDN, like www.example.com, into a numeric IP address that leads you to your desired resource. When you start your lookup, it sends a request to a DNS recursive server, which begins the process of looking up the IP address associated with the domain name you entered. The first stop is a root name server.\n\nA root name server provides a referral to the appropriate top-level domain server. For our scenario, the .com TLD server. The DNS recursive server then reaches out to the TLD server, which then directs the DNS recursive server to the domain name server responsible for the specific domain.\n\nThe domain name server will then return the IP address associated with the domain to the DNS recursive server. The DNS recursive server will complete the lookup process by providing the requested IP address back to your browser. Now that we know how the DNS lookup process works, in the next video segment, we will probe deeper into the topic of DNS records and learn about the many different types of information or records that we can request.\n\nExam objective 2.4, explain common network configuration concepts. DNS records. In this video segment, we will be taking a closer look at domain name servers or name servers for short.\n\nFor IT professionals, understanding the operation and significance of DNS servers is fundamental. These servers not only facilitate the basic function of connecting users to web servers, email servers, or other online resources, but also play a key role in network security and efficiency. Name servers can be configured to block access to malicious sites, redirect traffic for load balancing, and even implement custom domain name rules within private networks.\n\nSo how did these name servers work? Well, simply put, they house a database of DNS records. A DNS record is a database entry on a domain name server that links a domain name to various types of information.\n\nThese records are stored in the server's database and play a critical role in controlling the behavior of internet traffic. They contain instructions on how to route requests for a domain, including IP addresses, mail server configurations, and other essential data. One of the most common types of DNS records is the A record, also known as an address record.\n\nAn A record maps a fully qualified domain name directly to its corresponding IPv4 address, which is the standard protocol for the majority of internet traffic. For example, when you enter a website URL into your browser, the DNS lookup process takes the FQDN and sets out to find the A record to resolve the domain name to its IPv4 address, guiding your request to the correct web server. Up next, we have Quad A records.\n\nThese records perform a function very similar to A records, but are used to map a fully qualified domain name directly to its corresponding IPv6 address, which is the newer internet protocol designed to eventually replace IPv4. Quad A records ensure that domains can be resolved and connected over the IPv6 infrastructure, future-proofing the internet's expansion. Moving on, we have the MX record or mail exchange record.\n\nThese records are vital for email functionality, directing where emails that are sent to your domain should be delivered. Each MX record maps an email domain to a FQDN of a mail server, and is accompanied by a priority setting. This priority setting allows for a primary, secondary, and further backup mail servers to ensure email delivery even if one server goes down.\n\nTXT records are versatile DNS records that contain text-based application specified values. They're often used for verifying domain ownership. Additionally, TXT records are crucial for implementing various security measures, which brings us to our next point.\n\nIn the context of spam management, three significant TXT records come into play, DKIM, SPF, and DMARC. DKIM, or Domain Keys Identified Mail, verifies the sender's domain and ensures that the emails have not been tampered with in transit. SPF, or Sender Policy Framework, specifies which mail servers are authorized to send emails on behalf of your domain, preventing email spoofing.\n\nLastly, DMARC, which stands for Domain-Based Message Authentication, Reporting, and Conformance, builds upon DKIM and SPF, providing instructions on how to handle emails that fail DKIM and SPF checks, thus enhancing email security and integrity. Exam Objective 2.4, Explain Common Network Configuration Concepts. DHCP.\n\nDynamic Host Configuration Protocol, or DHCP, is a networking service that automates the configuration of devices on an IP network. Essentially, DHCP allows network devices, like computers and printers, to automatically obtain IP addresses and other necessary network configurations. This makes it much easier to manage large networks, where assigning IP addresses manually would be impractical.\n\nTo simplify things, imagine every device connected to a network is like a house in a vast neighborhood. Just like every house needs a unique address to receive mail, every device needs a unique identifier, known as an IP address, to send and receive data on a network. Here's where DHCP steps in.\n\nIt acts like the neighborhood's post office, dynamically assigning IP addresses to devices as they join the network, ensuring each one has a unique address and can communicate efficiently. Now let's talk about how DHCP does its job. The secret to DHCP is DORA.\n\nNo, not that DORA. Okay, much better. This DORA stands for Discover, Offer, Request, and Acknowledge, and is a four-step process.\n\nHere is a quick breakdown. The process begins with discovery. Imagine a new device, like a laptop or a smartphone, connecting to a network for the first time.\n\nThis device doesn't yet have an IP address, so it broadcasts a discovery message across the network. This message is a digital shout-out, saying, \"I'm new
