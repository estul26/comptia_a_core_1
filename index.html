her due to wear or damage, can also manifest as lines on printed pages during the fixing process. Another potential cause is a dirty feed roller, which can result in inconsistent paper feeding, leading to lines down the printed page.\n\nAdditionally, scratches on a scanner glass can cause streaks or lines to appear on scanned or copied documents, which may subsequently be printed with the lines visible. Another possible issue would be garbled print. This issue presents as random or incorrect characters throughout the page, or it might look similar to a bunch of alien symbols.\n\nRegardless of the type of incoherent output you get, the causes for garbled print can stem from various issues within the printer system. Incompatible firmware due to an update is one common cause, where recent firmware updates can result in compatibility problems. In such cases, consider rolling back the firmware update, contacting manufacturer support, checking for firmware patches, or reinstalling the firmware update.\n\nAnother cause is corrupted or incompatible print drivers installed on the computer. If the driver is corrupt or incompatible with the printer model, it can lead to garbled print. Updating or reinstalling the printer driver to ensure compatibility may resolve the issue.\n\nAdditionally, communication errors between the computer and the printer caused by loose cables, network issues, or interference can also cause garbled print. Ensuring a stable and secure connection can help alleviate this problem. Faded prints can be frustrating, especially when you're expecting crisp and vibrant output.\n\nSeveral factors could contribute to this issue, resulting in prints that appear faint or washed out. One common cause is low ink or toner levels in the printer cartridges. When levels are low, prints may lack intensity.\n\nChecking the ink or toner levels and replacing cartridges as needed can help restore print quality. Additionally, incorrect print settings, such as print density and resolution, can lead to faded prints. Adjusting these settings to higher levels can also improve print quality.\n\nWhen encountering double images, also known as echo images, on printed documents, it's important to address the underlying causes. The first step involves checking the imaging drum, responsible for transferring toner onto the paper during printing. Inspect the drum for visible signs of damage, wear, or contamination, and clean it using a lint-free cloth and isopropyl alcohol, or as directed by the manufacturer.\n\nAdditionally, it's essential to inspect the printer's cleaning mechanism, which removes excess toner or debris from internal components, including the drum. When speckling appears on printed pages, it can significantly reduce the overall print quality. This issue often stems from problems with the toner cartridge or insufficient printer maintenance.\n\nFirstly, examine the toner cartridge for any signs of leakage or damage. If leakage is present, it can lead to speckling on the pages. Additionally, accumulated dust, debris, or excess toner inside the printer can also cause speckling.\n\nIf this is evident upon visual inspection, thoroughly clean the internal components of the printer, including the drum, fuser unit, and paper path, using a toner-approved vacuum and/or a lint-free cloth. The next issue may not be in the exam objectives, but it is important and specific to laser printers. When toner fails to fuse properly to the paper during printing, it can lead to smudging or smearing and poor print quality.\n\nSeveral factors could contribute to this issue. Firstly, a faulty fuser unit responsible for heating and pressing the toner onto the paper may be to blame. Secondly, using an incorrect paper type or weight can affect toner adhesion.\n\nAdjusting printer settings or fuser temperature may help in such cases. Additionally, worn or damaged fuser rollers can hinder proper toner fusion. Incorrect page orientation issues can lead to printouts that do not align properly with the intended layout, resulting in wasted paper or misaligned content.\n\nA common scenario involves selecting the wrong orientation in the settings menu. This might cause not just unexpected but unusual outcomes. To address this problem, start by verifying the print settings before printing.\n\nEnsure that the correct page orientation, portrait, or landscape is selected in the printer settings or within the document software. Tray not recognized is another issue that can prevent a printer from operating as expected. This occurs when the printer is unable to detect one of its paper trays, even though the tray is properly installed and loaded with paper.\n\nWhen this happens, the printer may display an error message, refuse to print, or continuously prompt the user to insert paper even though the tray is already filled. Several factors can cause this problem, including a tray that is not fully seated in the printer misconfigured tray settings or sensors that fail to detect the tray properly. In some cases, the printer may also expect a specific paper type or size from a particular tray, which can create a mismatch if the tray configuration does not align with the print job settings.\n\nTo resolve this issue, users should first remove and reseat the tray to ensure it is properly installed. Next, verify the tray configuration in the printer settings, and confirm that the correct paper type and size are assigned to the tray. If the issue persists, inspecting the tray sensors or updating printer drivers may help restore proper tray detection.\n\nWhen encountering problems with paper not feeding properly into the printer, it's essential to consider various factors. Firstly, ensure that the paper is correctly aligned within the paper tray, as improper alignment can lead to feeding difficulties. Additionally, verify that the paper loaded in the tray matches the size and weight specifications supported by the printer, as using the wrong paper size or weight can hinder feeding.\n\nChecking the condition of the paper stack is also crucial, as any damage such as creases or moisture can lead to feeding problems. Lastly, inspect the feed roller for signs of wear or damage, as a worn feed roller may not grit the paper properly, resulting in feeding issues. Regarding multi-page misfeeds, a common cause is a worn or damaged separation pad.\n\nThis component ensures that only one sheet of paper is fed into the printer at a time. Paper jams are a frequent nuisance in printers, disrupting workflow and causing frustration. When confronted with a paper jam, it's crucial to handle it promptly and safely to prevent printer damage and ensure continued operation.\n\nThe initial step for clearing a paper jam is to remove the device from service and disconnect the printer from the power source. This minimizes the risk of accidents due to electrical shock, moving parts or burns from a hot fuser unit. Once safety concerns have been addressed, carefully examine the printer's paper path to identify and remove any obstructions that may be causing the jam.\n\nBe thorough in clearing out any loose paper or debris that could impede the paper's movement. If paper jams occur frequently, inspect the pickup roller for wear or contamination, as these issues can contribute to jams. Cleaning or replacing the pickup roller may help prevent future jams.\n\nFinally, if an error message persists even after clearing the jam, investigate the paper path for a blocked paper jam sensor. Next up, we have issues related to printer finishing units. These are optional components available in some printers that provide additional features beyond basic printing capabilities.\n\nThese units are designed to enhance the appearance and functionality of printed documents by offering options such as stapling, hole punching, binding and folding. However, issues can arise with these finishing units, particularly concerning hole punching and stapling. When users attempt to hole punch or staple a stack of sheets that exceeds the maximum capacity supported by the finishing unit, it can lead to jams and malfunctions.\n\nTo resolve this issue, users should first verify the maximum sheet capacity supported by the finishing unit and reduce the number of pages in the print job if necessary. If a jam has already occurred, carefully clearing the jam and restarting the printer can often restore normal operation. When a printer emits a grinding noise, it often indicates a mechanical issue within the device.\n\nIf such a noise is heard, inspect the printer's internal components by opening the printer's covers and visually examining gears, rollers and belts for signs of damage, wear or misalignment. Regular maintenance also has a role in preventing grinding noises. This involves cleaning the printer's interior and lubricating moving parts according to the manufacturer's guidelines.\n\nWhen a print queue is backed up, it means that multiple print jobs are waiting in line but are not currently printing. This situation can arise for several reasons. For example, the printer may be out of paper, ink or toner, preventing it from completing the current job.\n\nAdditionally, if the printer is offline or experiencing connectivity problems, new print jobs may continue to accumulate in the queue. Errors within a specific print job can also interrupt processing and cause other jobs to remain pending. To address this issue in Windows, open Settings, navigate to Printers and select the printer to view its print queue.\n\nFrom there, try restarting the current job. If the job continues to fail, delete it from the queue and attempt to print again. If the job cannot be removed and the print queue is completely frozen, stopping and restarting the print spooler service may be necessary to clear the queue.\n\nLastly, connectivity issues can prevent print jobs from reaching the printer altogether. This problem commonly occurs with network printers when the device cannot communicate with the printer or print server. Causes may include incorrect network settings, disconnected cables, wireless signal problems or the printer being powered off or offline.\n\nTroubleshooting connectivity issues involves verifying that the printer is powered on and properly connected to the network. Users should also confirm that the correct printer is selected, check the network connection and verify that the printer's IP address or network configuration has not changed. Restarting the printer, computer or network equipment can often restore communication and allow print jobs to be processed successfully.\n\nCongratulations on completing our CompTIA A+ Core 1 Complete Training Course. The commitment and drive you have demonstrated to arrive at this milestone is truly commendable. Whether you started with no prior IT knowledge or you had some previous experience to draw upon, you've journeyed a great distance.\n\nNow you stand at the threshold of your next big step towards obtaining your CompTIA A+ certification. But before you go ahead and book your test, we have a new challenge lined up for you. We've assembled an exclusive practice exam on our channel, packed with 200+ questions meticulously designed to test your knowledge and simulate the format and difficulty of the actual exam.\n\nIt's essential to remember that repetition is the key to mastery. The more you practice, the more confident you'll feel. Also, as you navigate through our practice exam, be sure to make notes of areas you're unsure about and feel free to revisit any part of our training course as needed.\n\nSo are you prepared for a practice exam? Great! Then click on the link to my left to get started.\n\nThis CompTIA A+ Core 1 Practice Exam will challenge you, gauge your readiness, and move you one step closer to your certification goal. We wish you all the best, and here's to you passing that exam.", "uyghur": "Exam Objective 5.6 — Printer Troubleshooting\n\nPrinter problem دا ئالدى بىلەن printer type نى ئېنىقلاڭ: **inkjet، laser، thermal، impact**. ئاندىن inspect/test قىلىپ replacement قا ئۆتۈڭ.\n\n## Lines / streaks down page\nLaser printer دا possible causes:\n- debris on photosensitive drum;\n- scratched imaging drum;\n- worn/damaged fuser roller;\n- dirty feed roller;\n- copier/scanner glass scratched/dirty بولسا copied output تا line كۆرۈنىدۇ.\n\n## Garbled print\nRandom/incorrect characters ياكى «alien symbols»:\n- incompatible/corrupted firmware;\n- bad firmware update;\n- corrupted/incompatible printer driver;\n- loose cable/network communication error/interference.\n\nActions:\n- driver reinstall/update;\n- firmware patch/reinstall/rollback if supported;\n- stable cable/network connection نى verify قىلىش.\n\n## Faded print\nPossible causes:\n- low ink/toner;\n- print density/resolution/quality setting تۆۋەن.\n\nCartridge level نى verify قىلىپ، settings نى توغرا تەڭشەڭ.\n\n## Double / Echo images\nLaser printer دا imaging drum contamination/wear/damage ياكى cleaning mechanism problem بولۇشى مۇمكىن. Manufacturer procedure بويىچە inspect/clean قىلىڭ.\n\n## Speckling\nPossible causes:\n- toner cartridge leaking/damaged;\n- excess toner/dust/debris;\n- dirty drum/fuser/paper path.\n\nToner-safe vacuum/lint-free materials بىلەن manufacturer procedure بويىچە تازىلاش.\n\n## Toner not fusing / smudging\nLaser-specific possible causes:\n- faulty fuser unit;\n- wrong paper type/weight;\n- fuser temperature/settings wrong;\n- worn/damaged fuser rollers.\n\n## Wrong page orientation\nOutput portrait/landscape خاتا بولسا printer/document settings دا **Portrait vs Landscape** نى verify قىلىڭ.\n\n## Tray not recognized\nSymptoms:\n- tray installed بولسىمۇ printer detect قىلمايدۇ;\n- “insert paper” prompt;\n- print refused.\n\nCauses:\n- tray fully seated ئەمەس;\n- tray configuration wrong;\n- tray sensor issue;\n- assigned paper size/type print job بىلەن mismatch.\n\nFix:\n1. Tray نى ئېلىپ قايتا تولۇق seat قىلىڭ.\n2. Printer settings دا paper type/size/source نى verify قىلىڭ.\n3. داۋام قىلسا sensor/driver نى تەكشۈرۈڭ.\n\n## Paper not feeding\nChecks:\n- paper tray دا alignment توغرىمۇ؟\n- size/weight printer spec قا ماسما؟\n- paper creased/moist/damagedمۇ؟\n- feed/pickup roller worn ياكى dirtyمۇ؟\n\n## Multi-page misfeed\nWorn/damaged **separation pad** بىرلا ۋاراقنى ئايرىپ feed قىلالماي، بىر نەچچە ۋاراقنى بىللە تارتىشى مۇمكىن.\n\n## Paper jam\nSafety first:\n1. Printer نى service دىن چىقىرىپ power source دىن disconnect قىلىڭ.\n2. Hot fuser/moving parts/electrical risk تىن ئېھتىيات قىلىڭ.\n3. Paper path نى تەكشۈرۈپ، jammed paper/debris نى ئېھتىيات بىلەن چىقىرىڭ.\n4. Frequent jam بولسا pickup roller wear/contamination نى تەكشۈرۈڭ.\n5. Jam cleared بولسىمۇ error قالسا paper-jam sensor blocked بولۇشى مۇمكىن.\n\n## Finishing unit problems\nFinisher stapling، hole punching، binding، folding قاتارلىق functions بېرىدۇ. Capacity دىن كۆپ sheets staple/punch قىلسا jam/malfunction بولۇشى مۇمكىن.\n\nMax sheet capacity نى verify قىلىپ pages نى ئازايتىڭ؛ jam بولسا manufacturer procedure بويىچە clear قىلىڭ.\n\n## Grinding noise\nMechanical issue possibility:\n- gears;\n- rollers;\n- belts;\n- misalignment/wear/damage.\n\nPrinter interior نى inspect قىلىپ، manufacturer-specified cleaning/lubrication procedure غا ئەمەل قىلىڭ.\n\n## Print queue backed up\nCauses:\n- printer out of paper/ink/toner;\n- printer offline;\n- connectivity issue;\n- corrupt/stuck print job.\n\nWindows دا printer queue نى ئېچىپ current job نى restart/delete قىلىڭ. Queue completely frozen بولسا **Print Spooler** service نى restart قىلىش لازىم بولۇشى مۇمكىن.\n\n## Printer connectivity issue\nChecks:\n- printer powered on/onlineمۇ؟\n- USB/Ethernet/Wi-Fi connection توغرىمۇ؟\n- correct printer selectedمۇ؟\n- printer IP/network configuration ئۆزگەرگەنمۇ؟\n- print server reachableمۇ؟\n\nPrinter، computer ۋە network equipment نى restart قىلىش communication نى ئەسلىگە كەلتۈرۈشى مۇمكىن.\n\n# Course Completion\n\nسىز **CompTIA A+ Core 1 Complete Training Course** نى تاماملىدىڭىز. Course سىزگە exam غا تەييارلىقنىڭ كېيىنكى قەدىمى سۈپىتىدە practice exam ئىشلەش، خاتا ياكى ئىشەنچىڭىز تۆۋەن بولغان تېمىلارنى خاتىرىلەپ، مۇناسىۋەتلىك دەرسلەرنى قايتا كۆرۈشنى تەۋسىيە قىلىدۇ. تەكرار مەشىق exam readiness ۋە ئىشەنچنى ئاشۇرۇشقا ياردەم بېرىدۇ.\n\n**ئاخىرقى study reminder:** Exam objectives نى checklist قىلىپ ئىشلىتىڭ؛ ھەر objective دىكى term، comparison، port/speed، symptom → cause → fix مۇناسىۋىتىنى تونۇشقا ئەھمىيەت بېرىڭ."}];

function esc(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rich(text,q="",rtl=false){
  const blocks=text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
  let out="", matches=0;
  const qre=q?new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi"):null;
  const formatRaw=s=>{
    // Split mixed Uyghur/English text. Isolating Latin/number runs prevents
    // strings such as TCP/UDP, Wi-Fi, 220-1201, IPv4, and IPs from reversing.
    const pieces = rtl
      ? s.split(/([A-Za-z][A-Za-z0-9+_.:/()#-]*(?:\s+[A-Za-z0-9][A-Za-z0-9+_.:/()#-]*)*|\b\d+(?:[.:/-]\d+)+\b)/g)
      : [s];
    return pieces.map(part=>{
      if(!part) return "";
      const isLtr = rtl && (/^[A-Za-z]/.test(part) || /^\d+(?:[.:/-]\d+)+$/.test(part));
      let x=esc(part);
      if(qre)x=x.replace(qre,m=>{matches++;return "<mark>"+m+"</mark>"});
      return isLtr ? '<bdi dir="ltr">'+x+'</bdi>' : x;
    }).join("");
  };
  const hi=s=>formatRaw(s);
  for(const b of blocks){
    const lines=b.split("\n").map(x=>x.trim()).filter(Boolean);
    if(lines.length && lines.every(x=>x.startsWith("- "))){
      out+="<ul>"+lines.map(x=>"<li>"+hi(x.slice(2))+"</li>").join("")+"</ul>";continue;
    }
    if(lines.length===1 && /^#{1,4}\s+/.test(lines[0])){
      out+="<h3>"+hi(lines[0].replace(/^#{1,4}\s+/,""))+"</h3>";continue;
    }
    // Mixed markdown list paragraph
    if(lines.some(x=>x.startsWith("- "))){
      let normal=[], lis=[];
      for(const line of lines){ if(line.startsWith("- ")) lis.push(line.slice(2)); else normal.push(line.replace(/^#{1,4}\s+/,"")); }
      if(normal.length) out+="<p>"+hi(normal.join(" "))+"</p>";
      if(lis.length) out+="<ul>"+lis.map(x=>"<li>"+hi(x)+"</li>").join("")+"</ul>";
      continue;
    }
    const txt=lines.join(" ").replace(/^#{1,4}\s+/,"");
    out+="<p>"+hi(txt)+"</p>";
  }
  return [out,matches];
}

function tokensForAlign(s){
  const latin=(s.match(/[A-Za-z][A-Za-z0-9+_.:/#-]*/g)||[]).map(x=>x.toLowerCase());
  const nums=(s.match(/\b\d+(?:[.:/-]\d+)*\b/g)||[]);
  return new Set([...latin,...nums]);
}
function jaccard(a,b){
  if(!a.size&&!b.size)return 0;
  let inter=0;for(const x of a)if(b.has(x))inter++;
  return inter/Math.max(1,a.size+b.size-inter);
}
function smartAlign(en,ug){
  // Sequence-preserving alignment. Technical terms/numbers preserved in the Uyghur
  // translation act as anchors; paragraph position and length are secondary signals.
  const pairs=[];
  if(!en.length||!ug.length)return pairs;
  let uj=0;
  for(let i=0;i<en.length;i++){
    const e=en[i], et=tokensForAlign(e);
    const expected=(i/Math.max(1,en.length-1))*Math.max(0,ug.length-1);
    let best=uj, bestScore=-1;
    const lo=Math.max(uj-1, Math.floor(expected)-3), hi=Math.min(ug.length-1, Math.ceil(expected)+4);
    for(let j=lo;j<=hi;j++){
      if(j<uj-1)continue;
      const ut=tokensForAlign(ug[j]);
      const term=jaccard(et,ut);
      const pos=1-Math.min(1,Math.abs(j-expected)/Math.max(2,ug.length*.15));
      const er=e.length, ur=ug[j].length;
      const len=Math.min(er,ur)/Math.max(1,Math.max(er,ur));
      const score=term*0.62+pos*0.28+len*0.10;
      if(score>bestScore){bestScore=score;best=j}
    }
    uj=Math.max(uj,best);
    pairs.push({e:e,u:ug[best]||"",score:bestScore});
  }
  return pairs;
}
function globalSearch(q){
  const box=$("globalResults");

  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=[];
  LESSONS.forEach((l,i)=>{
    const hay=(l.english+"\n"+l.uyghur).toLowerCase();
    if(terms.every(t=>hay.includes(t))){
      const idx=Math.max(0,hay.indexOf(terms[0]));
      const raw=(l.english+" "+l.uyghur).replace(/\s+/g," ");
      const snippet=raw.slice(Math.max(0,idx-55),idx+120);
      hits.push({i,l,snippet});
    }
  });
  box.innerHTML=hits.slice(0,18).map(h=>`<button class="search-hit" data-i="${h.i}">

}

function buildPairs(){

      <div class="pair-side ${state.recallSide==="en"?"recall-target":""}">
        <div class="pair-num">${i+1}</div><span class="align-badge">${confidence} match</span>

        <div>${rich(p.e,"",false)[0]}</div>

        <div class="pair-num">${i+1}</div><span class="align-badge">${confidence} match</span>
        <div class="reveal-hint">چېكىپ ئۇيغۇرچىنى كۆرۈڭ</div>
        <div>${rich(p.u,"",true)[0]}</div>

}

};
$("noteBtn").onclick=()=>$("noteBox").classList.toggle("open");
$("notes").oninput=e=>localStorage.setItem("a1-note-"+current().id,e.target.value);
$("prevBtn").onclick=()=>{if(state.index>0){state.index--;render()}};
$("nextBtn").onclick=()=>{if(state.index<LESSONS.length-1){state.index++;render()}};
$("lessonSearch").addEventListener("input",e=>{
  renderArticles();
  globalSearch(e.target.value.trim());
});
$("courseSearch").addEventListener("input",e=>buildNav(e.target.value.trim()));
$("hideEnBtn").onclick=()=>{
  state.pairMode=true;state.recallSide=state.recallSide==="en"?"":"en";
  localStorage.setItem("a1-pair-mode","1");localStorage.setItem("a1-recall-side",state.recallSide);
  buildPairs();applyStudyModes();
};
$("hideUgBtn").onclick=()=>{
  state.pairMode=true;state.recallSide=state.recallSide==="ug"?"":"ug";
  localStorage.setItem("a1-pair-mode","1");localStorage.setItem("a1-recall-side",state.recallSide);
  buildPairs();applyStudyModes();
};
$("revealBtn").onclick=()=>{
  state.recallSide="";localStorage.setItem("a1-recall-side","");buildPairs();
};
$("bookmarksOnlyBtn").onclick=()=>{
  state.bookmarksOnly=!state.bookmarksOnly;
  $("bookmarksOnlyBtn").classList.toggle("on",state.bookmarksOnly);
  $("bookmarksOnlyBtn").textContent=state.bookmarksOnly?"★ Showing bookmarks":"☆ Bookmarks only";
  document.body.classList.toggle("bookmarks-only",state.bookmarksOnly);
  buildNav($("courseSearch").value.trim());
};
document.addEventListener("click",e=>{
  if(!e.target.closest("#lessonSearch")&&!e.target.closest("#globalResults"))$("globalResults").classList.remove("open");
});
$("focusBtn").onclick=()=>document.body.classList.toggle("focus");
$("languageMode").onchange=e=>{
  document.body.classList.remove("language-en","language-ug");
  if(e.target.value==="en")document.body.classList.add("language-en");
  if(e.target.value==="ug")document.body.classList.add("language-ug");
};
const ugFonts={
  naskh:'"Noto Naskh Arabic","Geeza Pro","Noto Sans Arabic","Arial Unicode MS",serif',
  sans:'"Noto Sans Arabic","Geeza Pro","Arial Unicode MS",sans-serif',
  geeza:'"Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Arial Unicode MS",serif',
  ukij:'"UKIJ Tuz","Noto Naskh Arabic","Geeza Pro","Noto Sans Arabic",serif'
};
function applyUgFont(name){
  const key=ugFonts[name]?name:"naskh";
  document.documentElement.style.setProperty("--ug-font",ugFonts[key]);
  $("ugFont").value=key;
  localStorage.setItem("a1-ug-font",key);
}
$("ugFont").onchange=e=>applyUgFont(e.target.value);
$("fontUp").onclick=()=>{state.font=Math.min(30,state.font+1);document.documentElement.style.setProperty("--fs",state.font+"px");localStorage.setItem("a1-font",state.font)};
$("fontDown").onclick=()=>{state.font=Math.max(13,state.font-1);document.documentElement.style.setProperty("--fs",state.font+"px");localStorage.setItem("a1-font",state.font)};
$("themeBtn").onclick=()=>{
  document.body.classList.toggle("dark");localStorage.setItem("a1-theme",document.body.classList.contains("dark")?"dark":"light");
};
$("pairBtn").onclick=()=>{
  state.pairMode=!state.pairMode;localStorage.setItem("a1-pair-mode",state.pairMode?"1":"0");
  if(!state.pairMode){state.recallSide="";localStorage.setItem("a1-recall-side","");}
  applyStudyModes();if(state.pairMode)buildPairs();
};
$("focusLineBtn").onclick=()=>{
  state.focusLine=!state.focusLine;localStorage.setItem("a1-focus-line",state.focusLine?"1":"0");applyStudyModes();
};
$("exportNotesBtn").onclick=()=>{
  const chunks=[];
  LESSONS.forEach(l=>{
    const n=localStorage.getItem("a1-note-"+l.id);
    if(n&&n.trim())chunks.push(`Objective ${l.id} — ${l.domain_en}\n${n.trim()}`);
  });
  if(!chunks.length){toast("No saved notes yet");return}
  const blob=new Blob([chunks.join("\n\n"+"=".repeat(64)+"\n\n")],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="CompTIA_A_Core1_My_Notes.txt";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Notes exported");
};
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){e.preventDefault();$("lessonSearch").focus()}
  if(e.key==="/"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){e.preventDefault();$("lessonSearch").focus()}
  if(e.altKey&&e.key==="ArrowRight"&&state.index<LESSONS.length-1){state.index++;render()}
  if(e.altKey&&e.key==="ArrowLeft"&&state.index>0){state.index--;render()}
  if(e.key.toLowerCase()==="c"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("pairBtn").click()}
  if(e.key.toLowerCase()==="l"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("focusLineBtn").click()}
  if(e.key.toLowerCase()==="e"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("hideEnBtn").click()}
  if(e.key.toLowerCase()==="u"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("hideUgBtn").click()}
});
if(localStorage.getItem("a1-theme")==="dark")document.body.classList.add("dark");
document.documentElement.style.setProperty("--fs",state.font+"px");
applyUgFont(localStorage.getItem("a1-ug-font")||"naskh");
$("syncBtn").classList.toggle("on",state.sync);$("syncBtn").textContent=state.sync?"⇅ Sync":"⇅ Free";
render();
</script>
</body>
</html>
