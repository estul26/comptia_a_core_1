ver دىن IP address ئالالمىغاندا، ئۆزىگە ۋاقىتلىق IP address ئاپتوماتىك تەقسىم قىلىدىغان backup mechanism.\n\nئادەتتىكى ئەھۋالدا device:\n- DHCP server غا IP address تەلەپ قىلىدۇ\n\nئەگەر DHCP دىن جاۋاب كەلمىسە:\n- APIPA قوزغىلىدۇ\n- device ئۆزىگە temporary، self-generated IP address بېرىدۇ\n\nمەنبە بۇنى device نىڭ network interface ىنى ھېچ بولمىغاندا local communication ئۈچۈن operational ھالەتتە ساقلاشقا ياردەم بېرىدىغان «backup plan» غا ئوخشىتىدۇ.\n\n### APIPA Address Range\n\nمەنبە APIPA ئۈچۈن تۆۋەندىكى reserved range نى بېرىدۇ:\n\n**169.254.0.1 → 169.254.255.254**\n\nبۇ range APIPA ئارقىلىق self-assignment ئۈچۈن ساقلانغان.\n\n### APIPA نېمە ئۈچۈن كۆرۈلىدۇ؟\n\nTroubleshooting نۇقتىسىدىن، مەنبەدىكى ئەڭ مۇھىم سەۋەب:\n\n> **Device DHCP server غا يېتەلمىدى.**\n\nبۇنىڭ سەۋەبى:\n- DHCP server offline بولۇشى\n- network congestion\n- faulty cable\n- incorrect network setting\n- باشقا network infrastructure مەسىلىسى\n\nبولۇشى مۇمكىن.\n\nDevice قوزغالغاندا DHCP server دىن IP تەلەپ قىلىپ، جاۋاب ئالالمىسا، ئۆزىگە APIPA address بېرىشى مۇمكىن.\n\n### APIPA نىڭ چەكلىمىسى\n\nAPIPA address بار device:\n- شۇ local network segment ئىچىدىكى باشقا APIPA device لار بىلەن ئالاقە قىلالايدۇ\n\nئەمما مەنبە بويىچە:\n- external network قا چىقالمايدۇ\n- Internet قا چىقالمايدۇ\n\nسەۋەبى:\n- APIPA local communication ئۈچۈن لايىھەلەنگەن\n- router لار ئادەتتە APIPA دىن كەلگەن traffic نى باشقا network قا forward قىلمايدۇ\n\n**Troubleshooting memory:**\n\n> **169.254.x.x كۆرۈنسە → ئالدى بىلەن DHCP غا يېتەلمەيۋاتقانلىقىدىن گۇمان قىلىڭ.**\n\nبۇ memory line مەنبەنىڭ APIPA range ۋە DHCP failure teaching point ىنى خۇلاسىلەيدۇ.\n\nExam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي سىملىق ۋە سىمسىز SOHO تورلىرىنى تەڭشەڭ.\n\n## Subnet Mask\n\nDevice تورغا ئۇلانغاندا پەقەت IP address لا ئالمايدۇ. توغرا network communication ئۈچۈن بىر نەچچە تەڭشەك بىرلىكتە ئىشلەيدۇ.\n\nشۇلارنىڭ ئەڭ مۇھىملىرىنىڭ بىرى:\n- **subnet mask**\n\n**Subnet mask** IP address بىلەن بىرلىكتە ئىشلىپ، قايسى IP address لارنىڭ **ئوخشاش local network** نىڭ بىر قىسمى ئىكەنلىكىنى بەلگىلەشكە ياردەم بېرىدۇ.\n\nئاددىي قىلىپ ئېيتقاندا، subnet mask device قا:\n\n> «Destination مەن بىلەن ئوخشاش local network ئىچىدىمۇ، ياكى باشقا network تىمۇ؟»\n\nدېگەن سوئالغا جاۋاب تېپىشقا ياردەم بېرىدۇ.\n\n### Neighborhood Boundary مىسالى\n\nمەنبە subnet mask نى خەرىتىدىكى **مەھەللە چېگراسى** غا ئوخشىتىدۇ.\n\nئەگەر باشقا ئۆي شۇ چېگرا ئىچىدە بولسا:\n- ئۇ «local»\n- ئۇنىڭغا بىۋاسىتە بارغىلى بولىدۇ\n\nNetworking دا:\n- destination IP local network ئىچىدە بولسا\n- device ئۇنىڭ بىلەن بىۋاسىتە local network ئارقىلىق ئالاقە قىلىدۇ\n\nئەگەر destination شۇ چېگرىدىن سىرتتا بولسا:\n- ئۇ local ئەمەس\n- traffic نى network دىن چىقىرىدىغان يولغا يوللاش كېرەك\n\nNetworking دا بۇ چىقىش يولى:\n- **default gateway**\n\n### Subnet Mask → Default Gateway قارارى\n\nDevice:\n1. ئۆزىنىڭ IP address ى ۋە subnet mask نى ئىشلىتىدۇ.\n2. Destination IP نىڭ local ياكى non-local ئىكەنلىكىنى بەلگىلەيدۇ.\n3. Local بولسا، شۇ local network ئىچىدە ئالاقە قىلىدۇ.\n4. Local بولمىسا، traffic نى **default gateway** غا يوللايدۇ.\n\n**ئىمتىھاندا ئەستە تۇتۇڭ:**\n\n> **Subnet mask = Local ياكى remote ئىكەنلىكىنى بەلگىلەشكە ياردەم بېرىدۇ.**\n\nExam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي سىملىق ۋە سىمسىز SOHO تورلىرىنى تەڭشەڭ.\n\n## Default Gateway\n\n**Default gateway** — local network نى باشقا network لارغا، جۈملىدىن Internet قا ئۇلايدىغان router ياكى باشقا network device.\n\nئۇنى:\n\n> **local network دىن سىرتقا چىقىدىغان traffic نىڭ چىقىش نۇقتىسى**\n\nدەپ ئەستە ساقلاشقا بولىدۇ.\n\n### Device قاچان Gateway ئىشلىتىدۇ؟\n\nDevice بىر destination بىلەن ئالاقە قىلماقچى بولغاندا:\n1. Subnet mask ئارقىلىق destination نىڭ local ياكى non-local ئىكەنلىكىنى تەكشۈرىدۇ.\n2. Destination local بولسا، بىۋاسىتە local network دا ئالاقە قىلىدۇ.\n3. Destination local بولمىسا، traffic نى default gateway غا يوللايدۇ.\n\nDefault gateway ئاندىن traffic نى:\n- Internet\n- باشقا connected network\nقا يوللاشقا مەسئۇل بولىدۇ.\n\nDevice نىڭ پۈتۈن network path نى بىلىشى شەرت ئەمەس.\n\nئۇ پەقەت:\n- destination local ئەمەس\n- non-local traffic نى gateway بىر تەرەپ قىلىدۇ\n\nدېگەننى بىلىشى كېرەك.\n\n### قايتىدىغان Traffic\n\nمەنبە outgoing ۋە returning traffic نىمۇ چۈشەندۈرىدۇ.\n\nExternal resource دىن جاۋاب قايتقاندا:\n1. Traffic default gateway غا كېلىدۇ.\n2. Gateway قايسى internal device ئەسلى request قىلغانلىقىنى تونۇيدۇ.\n3. Data نى شۇ local device قا قايتا forward قىلىدۇ.\n\nبۇ local network دىكى بىر نەچچە device نىڭ external system لار بىلەن ئالاقە قىلىشىغا ياردەم بېرىدۇ.\n\n### SOHO مۇھىتىدىكى Default Gateway\n\nئۆي ۋە كىچىك ئىشخانا تورىدا default gateway ئادەتتە:\n- **router**\n\nبولىدۇ.\n\nمەنبە بويىچە device لار كۆپىنچە DHCP ئارقىلىق:\n- IP address\n- subnet mask\n- default gateway address\n\nنى ئاپتوماتىك ئالىدۇ.\n\nبۇ ئارقىلىق device:\n- local network دا\n- external network بىلەن\nقولدا network setting كىرگۈزمەيلا ئالاقە قىلالايدۇ.\n\n### Manual Configuration\n\nبەزى ئەھۋالدا default gateway نى قولدا بېكىتىشكە بولىدۇ.\n\nبۇنىڭ ئۈچۈن:\n- gateway نىڭ IP address ى\n- device نىڭ network setting ىغا\nبىۋاسىتە كىرگۈزۈلىدۇ.\n\nمەنبە بۇنىڭ كۈندىلىك home network دا ئاپتوماتىك DHCP configuration غا قارىغاندا ئاز ئۇچرايدىغانلىقىنى ئەسكەرتىدۇ.\n\n### Objective 2.6 — قىسقا ئەستە ساقلاش\n\n- **IP address** = Device قا لوگىكىلىق تەقسىم قىلىنغان network identifier\n- **IPv4** = 32 bit / 4 octet / dot-decimal\n- **IPv6** = 128 bit / 8 hextet / hexadecimal\n- **Static IP** = Manual + fixed\n- **Dynamic IP** = DHCP\n- **Private IPv4** = Local-network use\n- **Public IPv4** = Internet-facing / ISP-assigned\n- **APIPA** = DHCP ئىشلىمىگەندە self-assigned backup address\n- **APIPA range** = 169.254.0.1–169.254.255.254\n- **Subnet mask** = Destination local ياكى non-local ئىكەنلىكىنى بەلگىلەشكە ياردەم بېرىدۇ\n- **Default gateway** = Local network دىن سىرتقا چىقىدىغان traffic نى بىر تەرەپ قىلىدۇ\n"}, {"id": "2.7", "number": "2.7", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.7, compare and contrast internet connection types, network types, and their characteristics. Internet connection types. An internet service provider or ISP is a company or organization that provides individuals, businesses, and other entities with access to the internet.\n\nISPs are responsible for connecting customers to the internet through various technologies. Wired technologies include fiber optics, cable, and DSL. Wireless technologies include satellite and cellular.\n\nWith each option, there are typically a range of subscription plans that vary in terms of throughput speeds and pricing designed to meet the needs of different users. Another consideration is location. Not all connection types are available in all areas.\n\nNow that we know what an ISP is, let's discuss each of the available connection types one at a time. Fiber optic is a type of wired internet connection that utilizes fiber optic cables to transmit data. It is considered one of the fastest and most reliable forms of internet connectivity available today.\n\nFiber optic cables are made of thin strands of glass or plastic known as optical fibers. These fibers are designed to transmit data using pulses of light. Fiber optic internet connections can be relatively more expensive compared to some other types of internet connections and are commonly deployed by ISPs in urban areas.\n\nCable internet is a type of wired internet connection that utilizes the same coaxial copper cabling that is used for cable television transmission to deliver high-speed internet access to homes and businesses. It provides sufficient speeds for most homes and small businesses, but falls short of the speeds possible with fiber optic connections. As a plus, cable internet is usually cheaper than fiber optic connections and has a larger coverage area.\n\nAs a slight downside, the copper cable medium does result in a shared customer bandwidth. DSL, or digital subscriber line, is a type of wired internet connection that uses existing copper telephone lines, traditionally known as POTS, or plain old telephone service, to transmit data. It is a popular alternative to cable and fiber optic connections in areas where these options may not be available.\n\nTo establish a DSL connection, a DSL modem is required. The modem connects to the telephone line and translates the digital data from the user's devices into signals that can be transmitted over the copper telephone lines. DSL is relatively slow compared to fiber optic and cable connections, but DSL tends to be more cost-efficient.\n\nAnd since it uses the existing telephone network, coverage is pretty widespread. Satellite internet is a type of wireless internet connection that uses communication satellites and satellite antennas to provide internet access to users. It is a viable option for areas where traditional wired connections like fiber optic, cable, or DSL are not available or practical, usually due to a lack of existing infrastructure.\n\nWhile satellite may be your only option in a remote location, it is probably going to be expensive and slow. This connection type is expensive because a satellite internet service provider operates a network of communication satellites in geostationary orbit around the earth. And this connection type is slow because these satellites are positioned approximately 35,000 kilometers above the earth's surface.\n\nIt takes a fair amount of time for a radio signal to travel 35,000 kilometers to the satellite and then back down again, causing data latency. And if you have bad weather like a rainstorm interfering with your radio signals, just forget it. Cellular internet, also known as mobile internet, is a type of wireless internet access that utilizes cellular networks to provide connectivity to devices such as smartphones, tablets, and laptops.\n\nIt enables users to access the internet while on the go or traveling without relying on fixed wired connections. Each device will have an antenna that allows it to connect to a cellular network infrastructure. This infrastructure consists of a system of interconnected base stations or cell towers that are strategically placed to provide coverage over a specific geographic area.\n\nLastly, I would like to add one more wireless connection type to the mix. This one is wireless internet service providers, also known as a WISP. A WISP uses fixed wireless technology to provide internet access in areas that might not be served by wired connection options.\n\nWith this connection type, a small dish or antenna is installed at your location to connect to the provider's tower. WISPs can be a great option in rural or underserved areas. The setup is relatively simple and doesn't require extensive infrastructure.\n\nHowever, like satellite internet, it can be susceptible to weather conditions and might offer lower speeds compared to wired connections. Exam objective 2.7, compare and contrast internet connection types, network types, and their characteristics. Network types.\n\nNetworks of different sizes can be categorized in different ways based on their coverage and scale. In this video segment, we will cover the most common network types, starting with a PAN or personal area network. A PAN is the smallest of the network types we will cover.\n\nIt's designed for individual use within a range of a few meters. Imagine the wireless connectivity between your smartphone, your Bluetooth headset, and your smartwatch. That's a perfect example of a PAN.\n\nIt's primarily used for personal devices to connect and communicate over short distances, often using wireless technologies like Bluetooth. Next, we have local area networks or LANs. A LAN is a wired network that covers a small geographical area, typically within a building, small office, or home.\n\nThis type of network allows devices to share resources, such as files or printers, within a single contained environment. LANs are typically wired using ethernet cables to connect computers and other devices to a central router or switch, but they can also be wireless. Speaking of wireless, we also have WLAN networks.\n\nWLAN stands for Wireless Local Area Network. A WLAN is similar to a LAN, but the key difference is the use of wireless technology for connectivity. Instead of relying on physical cables, WLANs use wireless signals, such as Wi-Fi, to connect devices within a localized area.\n\nA WLAN may also be connected to a LAN. In this way, a WLAN can extend a LAN by providing a method for wireless devices to connect to and share resources with the wired LAN network. Now, let us expand our horizon to wide area networks, or WANs.\n\nWANs cover a much larger area than LANs, or WLANs. A WAN is a network that spans a large geographical area, typically connecting multiple LANs or remote locations. WANs are used to connect networks across cities, countries, or even continents.\n\nThey enable long-distance communications and data exchanges between geographically dispersed sites. The internet itself can be considered a massive WAN, connecting networks worldwide. Metropolitan area networks, or MANs, cover an area larger than a LAN, but smaller than a WAN, typically spanning a city or a metropolitan area.\n\nThey are used to connect multiple LANs within a geographical area, allowing organizations and buildings to share resources at high speeds. Lastly, we'll cover storage area networks, or SANs. A SAN is a dedicated high-speed network that interconnects and presents shared pools of storage devices to multiple servers.\n\nSANs are designed to handle large volumes of data and are typically used in server rooms or data centers. They allow for more efficient storage management and access in complex environments.", "uyghur": "Exam Objective 2.7\nئىنتېرنېت ئۇلىنىش تۈرلىرى، تور تۈرلىرى ۋە ئۇلارنىڭ ئالاھىدىلىكلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## ئىنتېرنېت ئۇلىنىش تۈرلىرى (Internet Connection Types)\n\n**ISP — Internet Service Provider** — شەخس، كارخانا ۋە باشقا تەشكىلاتلارغا ئىنتېرنېت زىيارىتى تەمىنلەيدىغان شىركەت ياكى تەشكىلات.\n\nISP لار خېرىدارلارنى ھەر خىل تېخنىكىلار ئارقىلىق Internet قا ئۇلايدۇ.\n\nمەنبە ئىنتېرنېت ئۇلىنىشلىرىنى ئاددىي قىلىپ ئىككى چوڭ تۈرگە ئايرىيدۇ:\n\n**سىملىق (Wired):**\n- Fiber optic\n- Cable\n- DSL\n\n**سىمسىز (Wireless):**\n- Satellite\n- Cellular\n- WISP / Fixed wireless\n\nھەر بىر ئۇلىنىش تۈرىدە ئادەتتە:\n- throughput speed\n- باھا\n- جۇغراپىيەلىك ئىشلىتىشچانلىق\nجەھەتتە پەرقلىق plan لار بولىدۇ.\n\n**مۇھىم:** بارلىق connection type ھەر بىر رايوندا بار بولۇشى ناتايىن. تاللاشقا location زور تەسىر قىلىدۇ.\n\n---\n\n### Fiber Optic Internet\n\n**Fiber optic** — fiber-optic cable ئارقىلىق data يەتكۈزىدىغان سىملىق Internet connection.\n\nFiber cable:\n- ئىنتايىن نېپىز glass ياكى plastic تالالاردىن ياسىلىدۇ\n- data نى **يورۇقلۇق pulse** لىرى ئارقىلىق يەتكۈزىدۇ\n\nمەنبە fiber optic نى:\n- ئەڭ تېز\n- ئەڭ ئىشەنچلىك\nInternet connection تۈرلىرىنىڭ بىرى دەپ چۈشەندۈرىدۇ.\n\nئەمما مەنبە بويىچە:\n- باشقا connection تۈرلىرىگە قارىغاندا قىممەترەك بولۇشى مۇمكىن\n- ISP لار ئۇنى كۆپىنچە شەھەر رايونلىرىدا ئورنىتىدۇ\n\n**ئەستە تۇتۇڭ:**\n\n> **Fiber = يورۇقلۇق + يۇقىرى سۈرئەت + يۇقىرى ئىشەنچلىكلىك**\n\n---\n\n### Cable Internet\n\n**Cable Internet** — cable television ئۈچۈن ئىشلىتىلىدىغان ئوخشاش **coaxial copper cable** infrastructure ئارقىلىق Internet access تەمىنلەيدىغان سىملىق ئۇلىنىش.\n\nمەنبە بويىچە cable Internet:\n- كۆپىنچە ئۆي ۋە كىچىك كارخانا ئۈچۈن يېتەرلىك سۈرئەت تەمىنلەيدۇ\n- Fiber غا يېتىدىغان ئەڭ يۇقىرى سۈرئەتكە يەتمەيدۇ\n- ئادەتتە fiber غا قارىغاندا ئەرزانراق\n- قاپلاش دائىرىسى كەڭرەك بولۇشى مۇمكىن\n\n### Shared Bandwidth\n\nمەنبە cable Internet نىڭ ئازراق كەمچىلىكى سۈپىتىدە:\n- copper cable medium دا خېرىدارلار **bandwidth نى ھەمبەھىرلەيدۇ**\n\nدەپ چۈشەندۈرىدۇ.\n\nيەنى شۇ ئۇلىنىش infrastructure ىنى بىر نەچچە خېرىدار ئىشلىتىدىغان بولغاچقا، مەنبە بۇنى shared customer bandwidth دەپ ئاتايدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Cable = coax + ياخشى سۈرئەت + fiber دىن ئادەتتە ئەرزان + shared bandwidth**\n\n---\n\n### DSL — Digital Subscriber Line\n\n**DSL (Digital Subscriber Line)** — بار بولغان copper telephone line ئارقىلىق Internet data يەتكۈزىدىغان سىملىق Internet connection.\n\nمەنبە telephone infrastructure نى:\n\n**POTS — Plain Old Telephone Service**\n\nدەپ ئاتايدۇ.\n\nDSL:\n- cable ياكى fiber يوق رايونلاردا alternative بولالايدۇ\n- Internet data نى existing telephone network ئارقىلىق يەتكۈزىدۇ\n\n### DSL Modem\n\nDSL connection ئۈچۈن:\n- **DSL modem** كېرەك\n\nModem:\n1. Telephone line غا ئۇلىنىدۇ.\n2. User device دىكى digital data نى copper telephone line دا يەتكۈزۈشكە بولىدىغان signal غا ئايلاندۇرىدۇ.\n3. قارشى يۆنىلىشتە كەلگەن signal نىمۇ device ئىشلىتەلەيدىغان digital data غا ئايلاندۇرىدۇ.\n\nمەنبە بويىچە DSL:\n- fiber ۋە cable غا قارىغاندا ئاستىراق\n- ئادەتتە تەننەرخ جەھەتتە تېجەشلىك\n- existing telephone network سەۋەبىدىن coverage ى كەڭ\n\n**ئەستە تۇتۇڭ:**\n\n> **DSL = telephone line + DSL modem + ئاستىراق، ئەمما كەڭ قاپلاش/تېجەشلىك**\n\n---\n\n### Satellite Internet\n\n**Satellite Internet** — communication satellite ۋە satellite antenna ئارقىلىق Internet access تەمىنلەيدىغان سىمسىز ئۇلىنىش.\n\nبۇ:\n- fiber\n- cable\n- DSL\n\nغا ئوخشاش wired infrastructure يوق ياكى ئەمەلىي جەھەتتىن ئورنىتىش قىيىن بولغان remote location لاردا مۇھىم تاللاش بولالايدۇ.\n\nمەنبە satellite Internet نىڭ:\n- يىراق رايوندا بەزىدە بىردىنبىر تاللاش بولۇشى مۇمكىنلىكىنى\n- قىممەت\n- ئاستا\nبولۇشى مۇمكىنلىكىنى بايان قىلىدۇ.\n\n### Latency\n\nمەنبە satellite latency نى geostationary satellite لارنىڭ يەر يۈزىدىن تەخمىنەن:\n\n**35,000 km**\n\nئېگىزلىكتە بولۇشى بىلەن چۈشەندۈرىدۇ.\n\nRadio signal:\n1. يەر يۈزىدىن satellite قا بارىدۇ\n2. ئاندىن قايتا يەرگە كېلىدۇ\n\nبۇ ئۇزۇن مۇساپە **latency — كېچىكىش** پەيدا قىلىدۇ.\n\n### Weather\n\nمەنبە يەنە:\n- rainstorm غا ئوخشاش ناچار ھاۋا\n- radio signal غا interference\nپەيدا قىلىپ connection غا تەسىر قىلىشى مۇمكىنلىكىنى چۈشەندۈرىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Satellite = remote area + high latency + weather-sensitive**\n\n---\n\n### Cellular Internet / Mobile Internet\n\n**Cellular Internet**، ياكى **mobile Internet** — cellular network ئارقىلىق Internet connectivity تەمىنلەيدىغان سىمسىز connection.\n\nمەنبە مىساللىرى:\n- smartphone\n- tablet\n- laptop\n\nبۇ user نىڭ:\n- يولدا\n- ساياھەتتە\n- fixed wired connection يوق ۋاقىتتا\nInternet قا چىقىشىغا يول قويىدۇ.\n\nھەر بىر device تا cellular infrastructure بىلەن ئالاقە قىلىدىغان antenna بولىدۇ.\n\nCellular infrastructure:\n- base station\n- cell tower\nلارنىڭ بىر-بىرىگە ئۇلانغان سىستېمىسىدىن تەركىب تاپىدۇ.\n\nبۇ station/tower لار مەلۇم geographic area غا coverage تەمىنلەش ئۈچۈن جايلاشتۇرۇلىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Cellular = mobility + cell towers + fixed cable غا تايانمايدۇ**\n\n---\n\n### WISP — Wireless Internet Service Provider\n\n**WISP — Wireless Internet Service Provider** fixed wireless technology ئارقىلىق Internet access تەمىنلەيدىغان service provider.\n\nمەنبە WISP نى:\n- wired connection option يوق\n- rural\n- underserved\n\nرايونلارغا ماس تاللاش دەپ چۈشەندۈرىدۇ.\n\n### WISP قانداق ئۇلىنىدۇ؟\n\nUser نىڭ ئورنىغا:\n- كىچىك dish ياكى antenna\n\nئورنىتىلىپ، service provider نىڭ tower ىغا سىمسىز ئۇلىنىدۇ.\n\nمەنبە بويىچە:\n- setup نىسبەتەن ئاددىي\n- كەڭ physical infrastructure تەلەپ قىلمايدۇ\n\nئەمما:\n- satellite قا ئوخشاش weather condition دىن تەسىرلىنىشى مۇمكىن\n- wired connection غا قارىغاندا سۈرئىتى تۆۋەنرەك بولۇشى مۇمكىن\n\n**ئەستە تۇتۇڭ:**\n\n> **WISP = fixed wireless + local/provider tower + rural/underserved use**\n\n---\n\n### Internet Connection Types — مەنبە بويىچە سېلىشتۇرۇش\n\n| Connection | Medium / Infrastructure | مەنبەدىكى ئاساسىي ئالاھىدىلىك |\n|---|---|---|\n| **Fiber optic** | Glass/plastic fiber + light | ئەڭ تېز/ئىشەنچلىك تۈرلەرنىڭ بىرى، قىممەترەك بولۇشى مۇمكىن |\n| **Cable** | Coaxial copper | كۆپ ئۆي/SOHO ئۈچۈن يېتەرلىك، fiber دىن ئاستىراق، shared bandwidth |\n| **DSL** | Copper telephone line / POTS | كەڭ قاپلاش، تېجەشلىك، fiber/cable دىن ئاستىراق |\n| **Satellite** | Satellite + antenna | Remote area، latency يۇقىرى، weather تەسىرى |\n| **Cellular** | Cell towers / mobile network | Mobility، يولدا Internet |\n| **WISP** | Fixed wireless + dish/antenna | Rural/underserved، ئاددىي infrastructure، weather تەسىرى بولۇشى مۇمكىن |\n\nExam Objective 2.7\nئىنتېرنېت ئۇلىنىش تۈرلىرى، تور تۈرلىرى ۋە ئۇلارنىڭ ئالاھىدىلىكلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## تور تۈرلىرى (Network Types)\n\nNetwork لار قاپلىغان:\n- جۇغراپىيەلىك دائىرە\n- كۆلەم\n\nبويىچە تۈرگە ئايرىلىشى مۇمكىن.\n\nمەنبە تۆۋەندىكى كۆپ ئۇچرايدىغان network type لارنى قاپلايدۇ:\n- PAN\n- LAN\n- WLAN\n- WAN\n- MAN\n- SAN\n\n---\n\n### PAN — Personal Area Network\n\n**PAN (Personal Area Network)** — بۇ objective دا قاپلىنىدىغان ئەڭ كىچىك network type.\n\nمەنبە بويىچە:\n- بىر ئادەمنىڭ شەخسىي ئۈسكۈنىلىرى ئۈچۈن\n- بىر نەچچە مېتىر دائىرىسىدە\nئىشلىتىلىدۇ.\n\nمىسال:\n- smartphone\n- Bluetooth headset\n- smartwatch\n\nئارىسىدىكى wireless connection.\n\nPAN:\n- قىسقا ئارىلىق\n- personal device\n- Bluetooth قا ئوخشاش wireless technology\n\nبىلەن باغلىنىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **PAN = Personal + بىر نەچچە مېتىر + شەخسىي ئۈسكۈنىلەر**\n\n---\n\n### LAN — Local Area Network\n\n**LAN (Local Area Network)** — كىچىك جۇغراپىيەلىك رايوننى قاپلايدىغان network.\n\nمەنبەدىكى مىساللار:\n- بىر بىنا\n- كىچىك ئىشخانا\n- ئۆي\n\nLAN ئىچىدىكى device لار:\n- file\n- printer\nقاتارلىق resource لارنى ھەمبەھىرلىيەلەيدۇ.\n\nمەنبە LAN نى دەسلەپ **wired network** دەپ تونۇشتۇرىدۇ ۋە Ethernet cable ئارقىلىق:\n- computer\n- باشقا device\n\nلارنى central router ياكى switch قا ئۇلاشنى مىسال قىلىدۇ.\n\nئەمما شۇ source پارچىسىنىڭ ئۆزى كېيىن:\n\n> **LAN لار wireless بولۇشىمۇ مۇمكىن**\n\nدەپ بايان قىلىدۇ.\n\nشۇڭا بۇ reviewed translation مەنبەدىكى ئىككى جۈملىنى يوشۇرۇپ بىرلەشتۈرمەيدۇ؛ ئەكسىچە:\n- LAN نىڭ ئاساسىي ئۇقۇمى = **local geographic scope**\n- مەنبەنىڭ wired Ethernet مىسالى = كۆپ ئۇچرايدىغان يول\n- wireless local connectivity بولسا كېيىنكى **WLAN** بۆلىكىدە ئايرىم چۈشەندۈرۈلىدۇ\n\nدەپ source framing نى ساقلايدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **LAN = كىچىك local area دىكى network**\n\n---\n\n### WLAN — Wireless Local Area Network\n\n**WLAN — Wireless Local Area Network**\n\nWLAN LAN غا ئوخشاش localized area نى قاپلايدۇ، ئەمما ئاساسىي پەرق:\n\n> **Physical cable نىڭ ئورنىغا wireless technology ئىشلىتىدۇ.**\n\nمەنبە مىسال قىلىدۇ:\n- Wi‑Fi\n\nWLAN:\n- local area ئىچىدىكى device لارنى wireless signal ئارقىلىق ئۇلايدۇ\n\nمەنبە يەنە WLAN نىڭ LAN بىلەن بىرلىكتە ئىشلىيەلەيدىغانلىقىنى چۈشەندۈرىدۇ.\n\nيەنى WLAN:\n- wireless device لارغا\n- wired LAN دىكى resource لارغا\n\nزىيارەت بېرىپ، LAN نىڭ ئۇلىنىش دائىرىسىنى wireless شەكىلدە كېڭەيتەلەيدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **WLAN = LAN نىڭ wireless connectivity شەكلى**\n\n---\n\n### WAN — Wide Area Network\n\n**WAN (Wide Area Network)** — LAN ياكى WLAN غا قارىغاندا ناھايىتى چوڭ جۇغراپىيەلىك رايوننى قاپلايدىغان network.\n\nWAN كۆپىنچە:\n- بىر نەچچە LAN\n- remote location\n\nنى ئۆزئارا ئۇلايدۇ.\n\nمەنبە WAN نىڭ:\n- شەھەرلەر\n- دۆلەتلەر\n- ھەتتا قىتئەلەر\n\nئارىسىدىكى network لارنى ئۇلاشقا ئىشلىتىلىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nبۇ:\n- long-distance communication\n- geographically dispersed site لار ئارىسىدا data exchange\n\nنى قوللايدۇ.\n\nمەنبە:\n\n> **Internet نىڭ ئۆزىنى غايەت زور WAN دەپ قاراشقا بولىدۇ**\n\nدەپ چۈشەندۈرىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **WAN = چوڭ جۇغراپىيە + بىر نەچچە LAN / remote site**\n\n---\n\n### MAN — Metropolitan Area Network\n\n**MAN (Metropolitan Area Network)** — قاپلاش دائىرىسى جەھەتتە:\n\n> **LAN دىن چوڭ، WAN دىن كىچىك**\n\nnetwork.\n\nمەنبە بويىچە MAN ئادەتتە:\n- بىر شەھەر\n- metropolitan area\n\nنى قاپلايدۇ.\n\nئۇ:\n- بىر جۇغراپىيەلىك رايوندىكى بىر نەچچە LAN نى ئۆزئارا ئۇلايدۇ\n- organization ۋە building لارنىڭ resource لارنى يۇقىرى سۈرئەتتە ھەمبەھىرلىشىگە ياردەم بېرىدۇ\n\n**ئەستە تۇتۇڭ:**\n\n> **MAN = City-scale network**\n\n---\n\n### SAN — Storage Area Network\n\n**SAN (Storage Area Network)** — بىر نەچچە server غا shared storage pool تەمىنلەيدىغان **مەخسۇس يۇقىرى سۈرئەتلىك network**.\n\nSAN:\n- storage device لارنى ئۆزئارا ئۇلايدۇ\n- شۇ storage pool نى بىر نەچچە server غا تەمىنلەيدۇ\n\nمەنبە SAN نىڭ:\n- زور مىقداردىكى data نى بىر تەرەپ قىلىشقا\n- storage management نى تېخىمۇ ئۈنۈملۈك قىلىشقا\n- مۇرەككەپ مۇھىتتا storage access نى ياخشىلاشقا\n\nلايىھەلەنگەنلىكىنى چۈشەندۈرىدۇ.\n\nكۆپ ئۇچرايدىغان مۇھىت:\n- server room\n- data center\n\n**مۇھىم:** SAN دىكى **S = Storage**. ئۇ جۇغراپىيەلىك دائىرە نامى ئەمەس؛ مەقسىتى storage نى network ئارقىلىق server لارغا تەمىنلەش.\n\n### Network Types — تېز سېلىشتۇرۇش\n\n| Type | مەنبەدىكى دائىرە / مەقسەت |\n|---|---|\n| **PAN** | بىر ئادەمنىڭ شەخسىي ئۈسكۈنىلىرى، بىر نەچچە مېتىر |\n| **LAN** | ئۆي/ئىشخانا/بىنا قاتارلىق كىچىك local area |\n| **WLAN** | Wireless local area network |\n| **MAN** | شەھەر / metropolitan area |\n| **WAN** | چوڭ جۇغراپىيە، كۆپ LAN ياكى remote site |\n| **SAN** | Server لار ئۈچۈن dedicated high-speed storage network |\n\n### Objective 2.7 — قىسقا ئەستە ساقلاش\n\n**Internet connections**\n- **Fiber** = Light / Fast / Reliable\n- **Cable** = Coax / Shared bandwidth\n- **DSL** = Telephone line / POTS\n- **Satellite** = Remote / High latency / Weather\n- **Cellular** = Mobile / Cell towers\n- **WISP** = Fixed wireless / Provider tower\n\n**Network types**\n- **PAN** = Personal\n- **LAN** = Local\n- **WLAN** = Wireless Local\n- **MAN** = Metropolitan / City\n- **WAN** = Wide / Long distance\n- **SAN** = Storage\n"}, {"id": "2.8", "number": "2.8", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.8, explain networking tools and their purposes. Networking tools are the essential instruments that IT professionals use to build, analyze, and maintain the vast and intricate world of computer networks. They range from simple handheld devices for wiring tasks to sophisticated software that monitors and optimizes network traffic, each serving a specific purpose in the lifecycle of a network's infrastructure.\n\nIn this video segment, we will cover some more common networking tools, starting with cable strippers. The cable stripper is a precision tool designed to remove the outer jacket of a cable to reveal the delicate wires inside. This tool is indispensable for anyone looking to install or repair cables.\n\nIts precise blades allow for the stripping of various cable thicknesses without nicking the internal wiring, ensuring that your data transmissions remain intact and reliable. Moving on, we have a crimper. This tool is the cornerstone of creating physical network connections.\n\nIt's used to affix RJ11, RJ45, and F-type connectors to corresponding cables, be it telephone, ethernet, or coaxial cables, respectively. The crimping tool must apply just the right amount of pressure to secure the connector without damaging the delicate wires inside. Whether you're crafting a custom length ethernet cable for a network setup, or attaching a connector to a coaxial cable for a television or internet connection, the crimping tool ensures a snug, stable connection that won't loosen over time.\n\nThe cable tester is an analytical tool, essential for verifying the integrity of network cables. It checks for proper wire pinouts, essential for communication between devices, evaluates signal quality by measuring resistance, signal attenuation, noise, and interference, and can even estimate the length of a cable. This tool is crucial not just for troubleshooting, but also for certifying that a cable meets the required performance standards before it becomes part of a critical network infrastructure.\n\nThe punchdown tool is another fundamental instrument for network technicians. It allows for the insertion and trimming of wires in one motion, making it perfect for organizing and connecting wires to patch panels and blocks, a common scenario in large network installations. A toner probe set, affectionately known as a fox and hound, is the go-to for tracing cables.\n\nWhen you have a mess of wires and need to find a specific one, the tone generator sends a signal down the wire, which is then detected by the probe. This is incredibly useful for locating specific cables within a bundle or identifying the termination point of a cable on a patch panel, which is often a challenge in complex network environments. A loopback plug is a simple but powerful diagnostic tool.\n\nIt is primarily used to test network ports and the functionality of the network interface card, or NIC, by redirecting the output signal back into the system as a return signal. This self-communication verifies that the port and NIC can send and receive data correctly, which is a fundamental check for network troubleshooting. A network tap, short for network test access point, is a dedicated hardware tool designed to facilitate the monitoring of network traffic.\n\nIt serves an essential role in settings where maintaining high security and conducting thorough traffic analysis are paramount. By integrating a network tap into a specific segment of a network, it can duplicate all the data traversing that segment and redirect the copies to a separate monitoring device for detailed examination. This capability enables in-depth observation and analysis of network activities while ensuring that the regular flow and function of the network remains unaffected.\n\nLastly, a Wi-Fi analyzer is a modern necessity in the arsenal of network tools. It is used to assess the quality of Wi-Fi signals. It can even help create a signal heat map to visualize signal strengths across different areas, as well as identify channels with less traffic for optimal performance and reduced latency.\n\nThis is particularly beneficial when optimizing a wireless network to ensure the best possible connectivity for users. In summary, each tool that was described is an essential component of a network technician's toolkit playing a pivotal role in the successful setup and maintenance of network infrastructures.", "uyghur": "Exam Objective 2.8\nتور قوراللىرى ۋە ئۇلارنىڭ ئىشلىتىلىش مەقسىتىنى چۈشەندۈرۈڭ.\n\n## تور قوراللىرى (Networking Tools)\n\nتور قوراللىرى IT خادىملىرىنىڭ تورنى:\n- قۇرۇش\n- تەكشۈرۈش\n- مەسىلە ھەل قىلىش\n- ئاسراش\n- ئىقتىدارىنى ياخشىلاش\n\nجەريانىدا ئىشلىتىدىغان مۇھىم قوراللاردۇر.\n\nمەنبە بۇ قوراللارنىڭ:\n- كابېلغا مۇناسىۋەتلىك ئاددىي قول قوراللىرىدىن\n- network traffic نى نازارەت قىلىدىغان ۋە wireless performance نى تەھلىل قىلىدىغان تېخىمۇ ئىلغار قوراللارغىچە\n\nكەڭ دائىرىدە بولىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nبۇ objective دا سەككىز كۆپ ئۇچرايدىغان networking tool قاپلىنىدۇ:\n\n1. Cable stripper\n2. Crimper\n3. Cable tester\n4. Punchdown tool\n5. Toner probe set\n6. Loopback plug\n7. Network tap\n8. Wi‑Fi analyzer\n\n---\n\n### Cable Stripper — كابېل سىرتقى قاپقىقىنى سويۇش قورالى\n\n**Cable stripper** — كابېلنىڭ سىرتقى jacket ىنى ئېلىۋېتىپ، ئىچىدىكى نازۇك سىملارنى ئاشكارىلاش ئۈچۈن ئىشلىتىلىدىغان ئېنىق قول قورالى.\n\nبۇ قورال:\n- network cable ئورنىتىش\n- cable رېمونت قىلىش\n\nجەريانىدا مۇھىم.\n\nمەنبە cable stripper نىڭ blade لىرى تۈرلۈك قېلىنلىقتىكى cable jacket نى:\n- ئىچكى سىملارنى كېسىۋەتمەي\n- ئۇلارنى زەخىملەندۈرمەي\n\nسويۇشقا لايىھەلەنگەنلىكىنى چۈشەندۈرىدۇ.\n\nئىچكى wiring زىيانغا ئۇچرىمىسا، data transmission نىڭ:\n- مۇقىم\n- ئىشەنچلىك\n\nبولۇشىغا ياردەم بېرىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Cable stripper = سىرتقى jacket نى ئېلىۋېتىش**\n\n---\n\n### Crimper — ئۇلىغۇچنى كابېلغا مۇقىملاش قورالى\n\n**Crimper** — connector نى مۇناسىپ cable غا بېسىپ مۇقىملاش ئۈچۈن ئىشلىتىلىدىغان قورال.\n\nمەنبە crimper نىڭ تۆۋەندىكى connector لار بىلەن ئىشلىتىلىدىغانلىقىنى كۆرسىتىدۇ:\n\n- **RJ11** → telephone cable\n- **RJ45** → Ethernet cable\n- **F-type connector** → coaxial cable\n\nCrimper:\n- connector نى cable غا پۇختا مۇقىملايدۇ\n- connection نىڭ ۋاقىت ئۆتكەندە بوشاپ كېتىشىنىڭ ئالدىنى ئېلىشقا ياردەم بېرىدۇ\n\nئەمما توغرا pressure ئىشلىتىش مۇھىم.\n\nمەنبە بويىچە:\n- pressure يېتەرلىك بولۇشى كېرەك\n- ئەمما ئىچكى نازۇك سىملارنى زىيانغا ئۇچراتقۇدەك كۈچلۈك بولماسلىقى كېرەك\n\nCrimper نىڭ ئىشلىتىش مىساللىرى:\n- custom-length Ethernet cable ياساش\n- coaxial cable غا connector ئورنىتىش\n\n**ئەستە تۇتۇڭ:**\n\n> **Crimper = connector نى cable غا مۇقىملاش**\n\n---\n\n### Cable Tester — كابېلنى تەكشۈرۈش قورالى\n\n**Cable tester** — network cable نىڭ توغرا ئىشلەۋاتقانلىقى ۋە integrity سىنى تەكشۈرۈشكە ئىشلىتىلىدىغان diagnostic / analytical tool.\n\nمەنبە cable tester نىڭ تۆۋەندىكى ئىشلارنى تەكشۈرەلەيدىغانلىقىنى بايان قىلىدۇ:\n\n- **wire pinout** نىڭ توغرىلىقى\n- resistance\n- signal attenuation\n- noise\n- interference\n- cable length نى تەخمىنەن باھالاش\n\n### Pinout نى تەكشۈرۈش\n\nCable ئىچىدىكى سىملار connector غا توغرا pin تەرتىپىدە ئۇلانمىسا، network communication توغرا ئىشلىمەسلىكى مۇمكىن.\n\nCable tester:\n- wire-to-pin connection نى تەكشۈرۈپ\n- cable نىڭ توغرا سىملىنىشىغا ياردەم بېرىدۇ\n\n### Signal Quality\n\nمەنبە cable tester نىڭ:\n- resistance\n- attenuation\n- noise\n- interference\n\nقاتارلىق ئامىللارنى ئۆلچەش ئارقىلىق signal quality نى باھالىيالايدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Troubleshooting ۋە Certification\n\nCable tester:\n- مەسىلە بار cable نى تېپىشتا\n- cable network infrastructure غا قوشۇلۇشتىن بۇرۇن performance standard غا ماس كېلىدىغانلىقىنى دەلىللەشتە\n\nمۇھىم.\n\n**ئەستە تۇتۇڭ:**\n\n> **Cable tester = pinout + cable integrity / signal quality تەكشۈرۈش**\n\n---\n\n### Punchdown Tool — سىمنى terminal غا ئورنىتىش قورالى\n\n**Punchdown tool** — سىمنى:\n- patch panel\n- termination block\n\nغا ئورنىتىش ۋە ئارتۇق قىسمىنى كېسىش ئۈچۈن ئىشلىتىلىدىغان تور كابېل قورالى.\n\nمەنبە punchdown tool نىڭ:\n- wire نى ئورنىتىش\n- wire نىڭ ئارتۇق قىسمىنى trim قىلىش\n\nئىشلىرىنى **بىر ھەرىكەتتە** قىلالايدىغانلىقىنى چۈشەندۈرىدۇ.\n\nبۇ قورال:\n- چوڭ network installation\n- patch panel wiring\n- wiring block\n\nلارنى تەرتىپلىك باشقۇرۇشتا كۆپ ئىشلىتىلىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Punchdown tool = wire نى patch panel / block قا punch + trim قىلىش**\n\n---\n\n### Toner Probe Set — كابېل ئىزلاش قورالى\n\n**Toner probe set** — نۇرغۇن cable ئارىسىدىن مەلۇم بىر cable نى تېپىش ۋە ئۇنىڭ قەيەردە ئاخىرلاشقانلىقىنى ئىزلاش ئۈچۈن ئىشلىتىلىدىغان قوراللار توپلىمى.\n\nمەنبە ئۇنى دوستانە نام بىلەن:\n\n> **“fox and hound”**\n\nدەپمۇ ئاتايدۇ.\n\nToner probe set ئادەتتە ئىككى قىسىمدىن تەركىب تاپىدۇ:\n\n1. **Tone generator**\n2. **Probe**\n\n### قانداق ئىشلەيدۇ؟\n\n**Tone generator**\n- cable غا signal يوللايدۇ\n\n**Probe**\n- شۇ signal نى بايقايدۇ\n\nبۇ ئارقىلىق technician:\n- cable bundle ئىچىدىكى مەلۇم cable نى تېپىدۇ\n- cable نىڭ patch panel دىكى termination point ىنى ئېنىقلايدۇ\n\nبۇ بولۇپمۇ نۇرغۇن cable بار مۇرەككەپ network environment دا ناھايىتى پايدىلىق.\n\n**ئەستە تۇتۇڭ:**\n\n> **Toner + Probe = مەلۇم cable نى ئىزلاپ تېپىش**\n\n---\n\n### Loopback Plug — پورت ۋە NIC نى ئۆزىگە قايتۇرۇپ سىناش قورالى\n\n**Loopback plug** — network port ۋە **NIC — Network Interface Card** نىڭ send/receive ئىقتىدارىنى تەكشۈرۈشكە ئىشلىتىلىدىغان ئاددىي، ئەمما كۈچلۈك diagnostic tool.\n\nئۇنىڭ ئاساسىي ئىدىيەسى:\n\n1. System output signal يوللايدۇ.\n2. Loopback plug شۇ signal نى سىرتقا داۋاملاشتۇرماي، system غا **return signal** قىلىپ قايتۇرىدۇ.\n3. System ئۆزى يوللىغان data نى قايتا قوبۇل قىلىدۇ.\n4. شۇ ئارقىلىق port/NIC نىڭ data يوللاش ۋە قوبۇل قىلىش ئىقتىدارى تەكشۈرۈلىدۇ.\n\nمەنبە بۇنى network troubleshooting دىكى ئاساسىي self-communication test دەپ چۈشەندۈرىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Loopback plug = Send → Return → Port/NIC test**\n\n---\n\n### Network Tap — Network Traffic نى كۆزىتىش قورالى\n\n**Network tap** — مەنبەدە **network test access point** نىڭ قىسقارتىلمىسى دەپ تونۇشتۇرۇلغان، network traffic نى نازارەت قىلىشقا ئىشلىتىلىدىغان مەخسۇس hardware tool.\n\nبۇ قورال:\n- network security مۇھىم بولغان\n- traffic analysis تەپسىلىي قىلىنىدىغان\n\nمۇھىتتا ئىشلىتىلىدۇ.\n\n### Network Tap قانداق ئىشلەيدۇ؟\n\nNetwork tap network نىڭ مەلۇم segment ىغا قوشۇلىدۇ.\n\nئاندىن:\n1. شۇ segment دىن ئۆتىدىغان data نى كۆرىدۇ.\n2. ئۆتۈۋاتقان data نىڭ **copy** سىنى ياسايدۇ.\n3. Copy نى ئايرىم monitoring device قا يوللايدۇ.\n4. Monitoring device traffic نى تەپسىلىي تەھلىل قىلىدۇ.\n\nمەنبەدىكى مۇھىم پەرق:\n\n> **Network tap ئەسلى network traffic نىڭ نورمال ئېقىشىغا تەسىر قىلماي، ئۇنىڭ كۆپەيتىلگەن نۇسخىسىنى analysis ئۈچۈن يوللايدۇ.**\n\nبۇ:\n- network activity نى چوڭقۇر كۆزىتىش\n- traffic analysis\n- security monitoring\n\nئۈچۈن پايدىلىق.\n\n**Source note:** `network test access point` دېگەن تولۇق يېزىلىش بۇ transcript نىڭ ئۆزىدە بېرىلگەن شەكىل. Reviewed translation ئۇنى source-attributed wording سۈپىتىدە ساقلايدۇ ۋە سىرتقى مەنبە بىلەن ئالماشتۇرمايدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **Network tap = Traffic copy → monitoring device**\n\n---\n\n### Wi‑Fi Analyzer — سىمسىز تور سىگنالىنى تەھلىل قىلىش قورالى\n\n**Wi‑Fi analyzer** — Wi‑Fi signal quality نى باھالاش ۋە wireless network نى optimization قىلىشقا ياردەم بېرىدىغان قورال.\n\nمەنبە Wi‑Fi analyzer نىڭ:\n\n- signal quality نى تەكشۈرۈش\n- signal strength نى كۆرۈش\n- **signal heat map** ياساش\n- traffic ئازراق channel نى تېپىش\n\nقاتارلىق ئىشلارغا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Signal Heat Map\n\nHeat map:\n- ئوخشىمىغان رايونلاردىكى Wi‑Fi signal strength نى كۆرۈنۈش شەكلىدە كۆرسىتىدۇ\n\nبۇ:\n- signal كۈچلۈك جاي\n- signal ئاجىز جاي\n\nلارنى تېپىشقا ياردەم بېرىدۇ.\n\n### Channel Selection\n\nWi‑Fi analyzer:\n- traffic ئازراق channel لارنى بايقاشقا\n\nياردەم بېرىشى مۇمكىن.\n\nمەنبە بويىچە بۇ:\n- performance نى ياخشىلاش\n- latency نى ئازايتىش\n- user connectivity نى ياخشىلاش\n\nئۈچۈن پايدىلىق.\n\n**ئەستە تۇتۇڭ:**\n\n> **Wi‑Fi analyzer = Signal strength + Heat map + Channel analysis**\n\n---\n\n## Objective 2.8 — قوراللارنى تېز پەرقلەندۈرۈش\n\n| Tool | مەنبەدىكى ئاساسىي مەقسەت |\n|---|---|\n| **Cable stripper** | Cable jacket نى ئېلىۋېتىش |\n| **Crimper** | RJ11 / RJ45 / F-type connector نى cable غا مۇقىملاش |\n| **Cable tester** | Pinout، integrity، signal quality ۋە cable length نى تەكشۈرۈش/باھالاش |\n| **Punchdown tool** | Wire نى patch panel/block قا ئورنىتىش ۋە trim قىلىش |\n| **Toner probe set** | Cable نى bundle ئارىسىدىن ئىزلاش / termination point نى تېپىش |\n| **Loopback plug** | Port/NIC send-receive ئىقتىدارىنى سىناش |\n| **Network tap** | Traffic نىڭ copy سىنى monitoring device قا يوللاش |\n| **Wi‑Fi analyzer** | Wi‑Fi signal / heat map / channel نى تەھلىل قىلىش |\n\n### ئىمتىھان ئۈچۈن ئەڭ ئاددىي memory map\n\n- **Stripper** → Jacket نى سوي\n- **Crimper** → Connector نى بېسىپ مۇقىملا\n- **Tester** → Cable نى سىنا\n- **Punchdown** → Wire نى panel/block قا ئورنىتىپ كېس\n- **Toner/Probe** → Cable نى ئىزلا\n- **Loopback** → Port/NIC نى ئۆزىگە قايتۇرۇپ سىنا\n- **Tap** → Traffic نى copy قىلىپ كۆزەت\n- **Wi‑Fi Analyzer** → Wireless signal/channel نى تەھلىل قىل\n"}, {"id": "3.1", "number": "3.1", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.1, compare and contrast display components and attributes. Display types. With domain three now underway, we begin by exploring display types.\n\nModern mobile devices, laptops, and desktop monitors commonly use flat panel display technologies because they are thin, energy efficient, and capable of producing high quality images. For the A+ exam, you need to understand how the major display technologies work, how they differ, and where each one is typically used. Let's begin with LCD, which stands for liquid crystal display.\n\nAn LCD display is a flat panel technology that uses a backlight shining through a layer of liquid crystals to create an image. Each tiny picture element on the screen contains what is known as an LCD cell. An LCD cell holds liquid crystal material that twists or aligns when electrical current is applied, controlling how much light passes through.\n\nThe liquid crystals do not create light on their own. Instead, they act like tiny shutters inside each LCD cell, regulating the light coming from the backlight behind the screen. By controlling how much light passes through each cell, the display forms the images you see.\n\nNow let's pause for a moment and make sure you fully understand this topic. A backlight is simply a light source position behind the screen. Without it, the display would be completely dark.\n\nIn many modern monitors, that backlight is made of LEDs or light emitting diodes. This is why you often hear the term LED monitor. In most cases, that is still an LCD display.\n\nThe LEDs are just the light source behind the liquid crystal panel. The image itself is still being formed by LCD cells controlling that light. Because LCD relies on a separate backlight layer, it cannot produce what we call true black.\n\nEven when an image appears black, the backlight is still on behind the panel. LCD displays are generally cost-effective, reliable, and perform well in bright environments, which is why they are still widely used in mobile devices, laptops, and desktop monitors. Within the LCD family, there are three main panel types you need to recognize, IPS, TN, and VA.\n\nIPS, which stands for in plane switching, is known for excellent color accuracy and wide viewing angles. Even if you are not sitting directly in front of the display, the image still looks consistent and vibrant. IPS panels are commonly used in environments where color precision matters, such as graphic design, photography, and content creation.\n\nThe trade-off is that IPS panels are typically more expensive. TN, or twisted pneumatic panels, prioritize speed. They usually offer very fast response times and can support high refresh rates, making them popular in gaming monitors where motion clarity is important.\n\nHowever, TN panels have weaker color accuracy and narrower viewing angles. If you move off to the side, the image quality can noticeably degrade. Then we have VA, which stands for vertical alignment.\n\nVA panels offer stronger contrast ratios and deeper blacks than IPS or TN because they block the backlight more effectively. They also provide better viewing angles than TN, though not quite as strong as IPS. VA panels are often used for media consumption because of their strong contrast performance.\n\nNow let's talk about a newer development in LCD technology, Mini-LED. Mini-LED is still technically an LCD display, but it uses a much more advanced backlighting system. Instead of relying on a small number of larger backlight zones, Mini-LED panels use thousands of very small LEDs behind the screen.\n\nThis allows for improved local dimming, meaning certain areas of the screen can dim or brighten independently. The result is better contrast, brighter highlights, and improved black levels compared to traditional LCD displays. However, because Mini-LED still relies on a backlight, it still cannot completely turn off individual pixels the way OLED can.\n\nThis brings us to OLED, which stands for Organic Light Emitting Diode. Unlike LCD and Mini-LED, OLED does not use a backlight at all. Instead, each individual pixel produces its own light.\n\nYou can think of it as millions of tiny colored lights that can turn on or off independently. If a pixel needs to display black, it simply turns off completely. This ability to shut off individual pixels allows OLED displays to produce true blacks and extremely high contrast ratios.\n\nOLED panels are known for vibrant colors, excellent contrast, wide viewing angles, and very thin designs. Because there is no backlight layer, OLED displays can also be flexible. This is why they are used in curved displays, foldable phones, and some wearable devices.\n\nHowever, OLED technology is generally more expensive and can be prone to burn in if static images are displayed for long periods of time. For the A+ exam, remember these key distinctions. Traditional LCD uses a backlight and liquid crystals to control light.\n\nIPS, TN, and VA are variations within LCD technology, each with different strengths. Mini-LED is an advanced form of LCD that improves backlighting and contrast. OLED allows each pixel to generate its own light, producing true blacks and superior contrast.\n\nUnderstanding these differences will help you compare display technologies and identify the best choice in exam scenarios. Exam objective 3.1, compare and contrast display components and attributes. Display components.\n\nA touchscreen is a display that allows users to interact directly with what appears on the screen using touch input. Instead of relying solely on a keyboard or mouse, users can tap, swipe, pinch, or drag their fingers across the display to control the device. This direct interaction has become standard in mobile devices and is increasingly common in laptops and all-in-one systems.\n\nBut here is an important distinction. The touchscreen you see and interact with is not a single component. It is actually made up of multiple layers working together behind the scenes.\n\nThis brings us to the digitizer. The digitizer is a transparent layer positioned above the display panel. Its job is to detect touch input.\n\nWhen a user touches the screen, the digitizer senses the exact location of that touch and converts the physical motion into digital signals that the system can understand. It is important to understand that the display panel and the digitizer serve two different functions. The display panel produces the image.\n\nThe digitizer detects the touch. If the image appears correctly, but the screen does not respond to touch, the digitizer may be the issue. If the screen responds to touch but shows no image, the display panel itself may be the problem.\n\nNow let's shift to a component you may encounter on older systems, the inverter. An inverter is a small circuit board found primarily in older laptops that use CCFL backlighting, which stands for cold cathode fluorescent lamp. Unlike modern LED backlit displays, CCFL backlights require high voltage AC power to operate.\n\nThe inverter's job is to convert the low voltage DC power supplied by the laptop's battery or power adapter into the high voltage AC power required by the CCFL backlight. Without a functioning inverter, the display may appear extremely dim or completely dark, even though the image is still being generated. A classic troubleshooting technique when a laptop screen appears black is to shine a flashlight at the display.\n\nIf you can faintly see the image, it indicates that the display panel is functioning, but the backlight is not. It is important to note that inverters are largely obsolete in modern systems because LED backlighting does not require high voltage AC power. LED displays use low voltage DC power directly and therefore do not require a separate inverter board.\n\nFor the A+ exam, you should be able to distinguish between the touchscreen, the digitizer, and the inverter, understand their roles, and recognize common failure symptoms associated with each. In the next segment, we will shift from physical components to display attributes such as resolution, pixel density, refresh rate, and color gamut, which describe how a display performs rather than how it is built. Exam objective 3.1, compare and contrast display components and attributes.\n\nDisplay attributes. As we move away from the physical components of a display, we now turn our attention to display attributes. These attributes describe how a screen performs and how images appear to the user.\n\nWhile there are many specifications that influence display performance, under exam objective 3.1, you need to understand resolution, pixel density, refresh rate, and color gamut, and how each one differs. Let's begin with resolution. To understand resolution, we first need to understand what a pixel is.\n\nA pixel, short for picture element, is the smallest individual dot of color that makes up an image on a screen. Every image you see is made up of thousands or even millions of these tiny colored dots working together to form text, images, and video. Once you understand that a screen is simply a grid made up of pixels, resolution becomes much easier to grasp.\n\nNow that we understand what a pixel is, we can define resolution more clearly. Screen resolution refers to the total number of pixels displayed on a screen, typically written as width by height. For example, 1920 by 1080 means the screen contains 1,920 pixels across and 1,080 pixels down.\n\nWhen you multiply those numbers together, you get the total number of pixels that make up the image. Some of the most common resolutions you should recognize include 1280 by 720, commonly called High Definition or HD, 1920 by 1080 known as Full HD, 2560 by 1440, often referred to as Quad HD, and 3840 by 2160, which is commonly known as Ultra HD or 4K. In general, a higher resolution means more total pixels on the screen, which allows for more detailed and sharper images.\n\nNow that we understand resolution, let's take the next logical step and talk about pixel density. While resolution tells us the total number of pixels on a screen, pixel density tells us how tightly those pixels are packed together. Pixel density is commonly measured in pixels per inch, often abbreviated as PPI.\n\nThis measurement describes how many pixels fit within a single inch of the display. Here is where the distinction becomes important. Two screens can have the same resolution, but if one screen is physically smaller, the pixels will be packed closer together.\n\nThat smaller screen will have a higher pixel density. On the other hand, if that same resolution is displayed on a much larger screen, the pixels are spread out more, resulting in lower pixel density. Higher pixel density generally produces sharper text, smoother edges, and clearer images because the individual pixels are harder to see with the human eye.\n\nLower pixel density can sometimes make images appear less refined, especially when viewed up close. So far, we've talked about how many pixels a screen has, which is resolution, and how tightly those pixels are packed together, which is pixel density. Both of those attributes affect how sharp and detailed an image appears.\n\nNow let's shift from image sharpness to something slightly different, how smoothly that image moves. This brings us to refresh rate. Refresh rate refers to how many times per second the display updates the image on the screen.\n\nIt is measured in hertz, abbreviated as hc. If a display has a refresh rate of 60 hertz, that means the screen refreshes the image 60 times every second. A 120 hertz display refreshes 120 times per second.\n\nHigher refresh rates create smoother motion. This becomes especially noticeable when watching action scenes in a movie or playing video games. Lower refresh rates can make motion appear less fluid, particularly during fast movement.\n\nIt is important to remember that refresh rate is completely separate from resolution and pixel density. Resolution and pixel density affect clarity and detail. Refresh rate affects motion smoothness.\n\nA display can be extremely sharp but still feel less smooth if the refresh rate is low. Lastly, we have color gamut. Color gamut refers to the range of colors a display is capable of producing.\n\nIn simple terms, it describes how many different shades and tones a screen can accurately show. A wider color gamut means the display can reproduce more colors resulting in images that appear richer, more vibrant, and more true to life. Not all displays are capable of producing the same range of colors.\n\nLower end displays may show colors that appear washed out or less accurate. Higher quality displays are able to produce deeper reds, brighter greens, and more subtle transitions between shades. This becomes especially important in areas such as photo editing, graphic design, video production, and media consumption.\n\nNow let's put this into a quick scenario. Imagine two monitors sitting side by side. Both have the same resolution and the same refresh rate.\n\nOn paper, they look identical. But when you display a colorful image on both screens, one appears dull while the other looks vivid and lifelike. The difference is color gamut.\n\nOne display is capable of producing a wider range of colors than the other.", "uyghur": "Exam Objective 3.1\nئېكران زاپچاسلىرى ۋە ئېكران ئالاھىدىلىكلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## ئېكران تۈرلىرى (Display Types)\n\nزامانىۋى كۆچمە ئۈسكۈنە، خاتىرە كومپيۇتېر ۋە desktop monitor لاردا كۆپىنچە **flat-panel display** ئىشلىتىلىدۇ، چۈنكى ئۇلار نېپىز، توك سەرپىياتى تۆۋەن ۋە يۇقىرى سۈپەتلىك رەسىم كۆرسىتەلەيدۇ.\n\nCompTIA A+ ئۈچۈن ئاساسىي display technology لارنىڭ قانداق ئىشلەيدىغانلىقى، ئۆزئارا قانداق پەرقلىنىدىغانلىقى ۋە قايسى خىل ئىشقا ماس كېلىدىغانلىقىنى چۈشىنىش مۇھىم.\n\n### LCD — Liquid Crystal Display\n\n**LCD** — backlight نى liquid crystal قەۋىتىدىن ئۆتكۈزۈپ رەسىم ھاسىل قىلىدىغان flat-panel display تېخنىكىسى.\n\nھەر بىر كىچىك picture element ئىچىدە **LCD cell** بار. Cell ئىچىدىكى liquid crystal غا electrical current بېرىلگەندە ئۇ بۇرۇلىدۇ ياكى رەتلىنىدۇ ۋە شۇ ئارقىلىق قانچىلىك يورۇقلۇق ئۆتىدىغانلىقىنى كونترول قىلىدۇ.\n\nLiquid crystal ئۆزى يورۇقلۇق چىقارمايدۇ. ئۇنى ھەر بىر cell ئىچىدىكى كىچىك shutter غا ئوخشىتىشقا بولىدۇ: backlight دىن كەلگەن يورۇقلۇقنىڭ قانچىلىك ئۆتىدىغانلىقىنى كونترول قىلىدۇ.\n\n### Backlight\n\n**Backlight** — ئېكراننىڭ ئارقىسىدىكى يورۇقلۇق مەنبەسى. ئۇ بولمىسا LCD ئېكران قاراڭغۇ كۆرۈنىدۇ.\n\nنۇرغۇن زامانىۋى LCD monitor لاردا backlight سۈپىتىدە:\n\n**LED — Light Emitting Diode**\n\nئىشلىتىلىدۇ.\n\nشۇڭا بازاردا **LED monitor** دېگەن نام كۆپ ئىشلىتىلىدۇ. مەنبەدىكى مۇھىم پەرق:\n\n> **كۆپ ئەھۋالدا “LED monitor” يەنىلا LCD display؛ LED پەقەت liquid-crystal panel نىڭ backlight مەنبەسى.**\n\nيەنى:\n- **LCD cells** → رەسىمنى شەكىللەندۈرىدۇ\n- **LED backlight** → يورۇقلۇق تەمىنلەيدۇ\n\n### LCD ۋە True Black\n\nTraditional LCD ئايرىم backlight قەۋىتىگە تايىنىدۇ. قارا رەڭ كۆرسىتىۋاتقاندىمۇ backlight پۈتۈنلەي ئۆچمەيدۇ. شۇڭا مەنبە بويىچە LCD، OLED قا ئوخشاش **true black** ھاسىل قىلالمايدۇ.\n\nLCD نىڭ ئەۋزەللىكلىرى:\n- تەننەرخى نىسبەتەن تۆۋەن\n- ئىشەنچلىك\n- يورۇق مۇھىتتا ياخشى ئىشلەيدۇ\n\n---\n\n## LCD Panel تۈرلىرى: IPS، TN، VA\n\n### IPS — In-Plane Switching\n\n**IPS** نىڭ كۈچلۈك تەرەپلىرى:\n- excellent color accuracy\n- wide viewing angles\n\nئېكرانغا دەل ئالدىدىن قارىمىغان تەقدىردىمۇ رەسىم ۋە رەڭ نىسبەتەن مۇقىم كۆرۈنىدۇ.\n\nمەنبە IPS نى:\n- graphic design\n- photography\n- content creation\n\nغا ئوخشاش color precision مۇھىم ئىشلارغا ماس دەپ چۈشەندۈرىدۇ.\n\nTrade-off:\n- ئادەتتە قىممەترەك\n\n**ئەستە تۇتۇڭ: IPS = Color accuracy + Wide viewing angle**\n\n### TN — Twisted Nematic\n\n**TN (Twisted Nematic)** panel سۈرئەتكە ئەھمىيەت بېرىدۇ.\n\n**Transcript correction:** ئەسلى transcript تا `twisted pneumatic` دەپ خاتا يېزىلغان. Reviewed Uyghur دا توغرا canonical term **Twisted Nematic** ئىشلىتىلدى؛ ئەسلى English transcript ئۆزگەرتىلمىدى.\n\nTN نىڭ كۈچلۈك تەرەپلىرى:\n- very fast response time\n- high refresh rate نى قوللاش\n\nشۇڭا مەنبە ئۇنى gaming monitor ۋە motion clarity مۇھىم ئەھۋاللارغا ماس دەپ چۈشەندۈرىدۇ.\n\nكەمچىلىكلىرى:\n- color accuracy IPS دىن ئاجىزراق\n- viewing angle تارراق\n- يان تەرەپتىن قارىغاندا image quality كۆرۈنەرلىك ناچارلىشىشى مۇمكىن\n\n**ئەستە تۇتۇڭ: TN = Speed / Fast response / High refresh**\n\n### VA — Vertical Alignment\n\n**VA** نىڭ كۈچلۈك تەرەپلىرى:\n- كۈچلۈك contrast ratio\n- IPS ۋە TN غا قارىغاندا چوڭقۇرراق black level\n\nمەنبە بۇنى VA نىڭ backlight نى تېخىمۇ ئۈنۈملۈك توسالايدىغانلىقى بىلەن چۈشەندۈرىدۇ.\n\nViewing angle:\n- TN دىن ياخشى\n- IPS دەك كەڭ ئەمەس\n\nمەنبە VA نى media consumption غا ماس دەپ كۆرسىتىدۇ.\n\n**ئەستە تۇتۇڭ: VA = Strong contrast + Deeper blacks**\n\n---\n\n## Mini-LED\n\n**Mini-LED** يەنىلا LCD display، ئەمما تېخىمۇ ئىلغار backlighting system ئىشلىتىدۇ.\n\nTraditional LCD غا قارىغاندا، ئاز ساندىكى چوڭ backlight zone نىڭ ئورنىغا ئېكران ئارقىسىدا **مىڭلىغان ناھايىتى كىچىك LED** ئىشلىتىدۇ.\n\nبۇ **local dimming** نى ياخشىلايدۇ، يەنى ئېكراننىڭ ئوخشىمىغان رايونلىرى ئايرىم قاراڭغۇلىشى ياكى يورۇشى مۇمكىن.\n\nنەتىجىدە:\n- contrast ياخشىلىنىدۇ\n- bright highlight كۈچىيىدۇ\n- black level traditional LCD دىن ياخشى بولىدۇ\n\nئەمما:\n\n> **Mini-LED يەنىلا backlight قا تايىنىدىغان LCD.**\n\nشۇڭا OLED غا ئوخشاش ھەر بىر pixel نى پۈتۈنلەي ئايرىم ئۆچۈرەلمەيدۇ.\n\n**ئەستە تۇتۇڭ: Mini-LED = LCD + Advanced backlight + Local dimming**\n\n---\n\n## OLED — Organic Light Emitting Diode\n\n**OLED**:\n- backlight ئىشلەتمەيدۇ\n- ھەر بىر pixel ئۆزى يورۇقلۇق چىقىرىدۇ\n\nھەر بىر pixel ئايرىم يانالايدۇ ياكى ئۆچەلەيدۇ.\n\nئەگەر pixel قارا رەڭ كۆرسىتىشى كېرەك بولسا، ئۇ پۈتۈنلەي ئۆچىدۇ. شۇڭا OLED:\n- true black\n- ناھايىتى يۇقىرى contrast ratio\n\nھاسىل قىلالايدۇ.\n\nOLED نىڭ مەنبەدە بېرىلگەن ئەۋزەللىكلىرى:\n- vibrant colors\n- excellent contrast\n- wide viewing angles\n- very thin design\n- flexible display قۇرالايدۇ\n\nمىساللار:\n- curved display\n- foldable phone\n- بەزى wearable device\n\nكەمچىلىكلىرى:\n- ئادەتتە قىممەت\n- static image ئۇزاق كۆرسىتىلسە **burn-in** خەۋپى بولۇشى مۇمكىن\n\n### Display Types — تېز سېلىشتۇرۇش\n\n| Type | مەنبەدىكى ئاساسىي پەرق |\n|---|---|\n| **LCD** | Liquid crystal + separate backlight |\n| **IPS** | Color accuracy + wide viewing angles |\n| **TN** | Fast response + high refresh |\n| **VA** | Strong contrast + deeper blacks |\n| **Mini-LED** | LCD + thousands of small LEDs + local dimming |\n| **OLED** | Each pixel emits its own light + true black |\n\n---\n\nExam Objective 3.1\nئېكران زاپچاسلىرى ۋە ئېكران ئالاھىدىلىكلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## ئېكران زاپچاسلىرى (Display Components)\n\n### Touchscreen\n\n**Touchscreen** ئىشلەتكۈچىنىڭ ئېكراندىكى مەزمۇن بىلەن بىۋاسىتە touch input ئارقىلىق ئالاقە قىلىشىغا يول قويىدۇ.\n\nئىشلەتكۈچى:\n- tap\n- swipe\n- pinch\n- drag\n\nقاتارلىق gesture لار ئارقىلىق device نى كونترول قىلالايدۇ.\n\nمەنبە touchscreen نىڭ mobile device لاردا standard، laptop ۋە all-in-one system لاردا بارغانسېرى كۆپ ئۇچرايدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Touchscreen بىرلا Component ئەمەس\n\nئىشلەتكۈچى كۆرۈۋاتقان touchscreen بىر نەچچە layer/component نىڭ بىرلىكتە ئىشلىشىدىن تەركىب تاپىدۇ.\n\nشۇلارنىڭ بىرى:\n- **digitizer**\n\n### Digitizer\n\n**Digitizer** — display panel نىڭ ئۈستىگە جايلاشقان transparent layer بولۇپ، touch input نى بايقايدۇ.\n\nئىشلەتكۈچى ئېكرانغا تەگكەندە digitizer:\n1. touch نىڭ ئېنىق ئورنىنى سەزگۈيدۇ\n2. physical motion نى system چۈشىنەلەيدىغان digital signal غا ئايلاندۇرىدۇ\n\n### Display Panel vs Digitizer\n\n- **Display panel** → رەسىم كۆرسىتىدۇ\n- **Digitizer** → touch نى بايقايدۇ\n\nTroubleshooting:\n- رەسىم نورمال، touch ئىشلىمەيدۇ → digitizer مەسىلىسى بولۇشى مۇمكىن\n- touch جاۋاب بېرىدۇ، ئەمما رەسىم يوق → display panel مەسىلىسى بولۇشى مۇمكىن\n\n**ئەستە تۇتۇڭ: Panel = Image / Digitizer = Touch**\n\n---\n\n### Inverter\n\n**Inverter** — ئاساسلىقى **CCFL backlight** ئىشلىتىدىغان كونا laptop لاردا ئۇچرايدىغان كىچىك circuit board.\n\n**CCFL — Cold Cathode Fluorescent Lamp**\n\nCCFL backlight يۇقىرى voltage AC power تەلەپ قىلىدۇ، ئەمما laptop battery ياكى power adapter تۆۋەن voltage DC power تەمىنلەيدۇ.\n\nInverter نىڭ رولى:\n\n> **Low-voltage DC → High-voltage AC**\n\nيەنى CCFL backlight ئىشلىيەلەيدىغان power format قا ئايلاندۇرىدۇ.\n\n### Inverter خراب بولسا\n\nInverter ئىشلىمىسە:\n- ئېكران ئىنتايىن dim كۆرۈنۈشى\n- پۈتۈنلەي قاراڭغۇ كۆرۈنۈشى\n\nمۇمكىن.\n\nئەمما display panel يەنىلا image ھاسىل قىلىۋاتقان بولۇشى مۇمكىن؛ پەقەت backlight ئىشلىمەيۋاتقان بولۇشى مۇمكىن.\n\n### Flashlight Test\n\nمەنبە classic troubleshooting technique سۈپىتىدە:\n1. Laptop screen قارا كۆرۈنسە\n2. Flashlight نى ئېكرانغا تۇتۇڭ\n3. ئەگەر image نى ناھايىتى سۇس كۆرگىلى بولسا:\n   - display panel image ھاسىل قىلىۋاتىدۇ\n   - backlight ئىشلىمەيۋاتىدۇ\n\nدەپ چۈشەندۈرىدۇ.\n\n### نېمە ئۈچۈن Inverter ھازىر كۆپ ئىشلىتىلمەيدۇ؟\n\nInverter زامانىۋى system لاردا كۆپىنچە obsolete، چۈنكى LED backlighting:\n- high-voltage AC تەلەپ قىلمايدۇ\n- low-voltage DC power نى بىۋاسىتە ئىشلىتەلەيدۇ\n\nشۇڭا separate inverter board لازىم بولمايدۇ.\n\n**Source wording note:** transcript بۇ يەردە `LED displays` دەپ قىسقارتىپ ئېيتىدۇ، ئەمما ئالدىنقى context ئېنىق ھالدا **LED backlighting** ھەققىدە. Reviewed Uyghur شۇ context نى ساقلاپ، LED-backlit display دەپ چۈشەندۈرىدۇ.\n\n### Display Components — تېز ئەستە ساقلاش\n\n| Component | رولى |\n|---|---|\n| **Touchscreen** | Direct touch interaction |\n| **Digitizer** | Touch location نى detect قىلىش |\n| **Display panel** | Image ھاسىل قىلىش |\n| **Inverter** | كونا CCFL system دا DC → high-voltage AC |\n\n---\n\nExam Objective 3.1\nئېكران زاپچاسلىرى ۋە ئېكران ئالاھىدىلىكلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## ئېكران ئالاھىدىلىكلىرى (Display Attributes)\n\nDisplay component ئېكراننىڭ قانداق ياسالغانلىقىغا مۇناسىۋەتلىك؛ display attribute بولسا ئېكراننىڭ قانداق ئىقتىدار كۆرسىتىدىغانلىقى ۋە image نىڭ قانداق كۆرۈنىدىغانلىقىنى تەسۋىرلەيدۇ.\n\nمەنبە تۆت مۇھىم display attribute نى قاپلايدۇ:\n1. Resolution\n2. Pixel density\n3. Refresh rate\n4. Color gamut\n\n### Pixel\n\n**Pixel** — **picture element** نىڭ قىسقارتىلغان شەكلى.\n\nPixel:\n- ئېكراندىكى رەسىمنى تەشكىل قىلىدىغان\n- ئەڭ كىچىك يەككە رەڭلىك نۇقتا\n\nھەر بىر image مىڭلىغان ياكى مىليونلىغان pixel نىڭ بىرلىكتە text، image ۋە video ھاسىل قىلىشىدىن تەركىب تاپىدۇ.\n\nئېكراننى **pixel لار تورى (grid)** دەپ تەسەۋۋۇر قىلساق، resolution نى چۈشىنىش ئاسان.\n\n---\n\n### Resolution\n\n**Screen resolution** — ئېكراندا كۆرسىتىلىدىغان pixel لارنىڭ ئومۇمىي سانىغا مۇناسىۋەتلىك بولۇپ، ئادەتتە:\n\n**width × height**\n\nشەكلىدە يېزىلىدۇ.\n\nمىسال:\n\n**1920 × 1080**\n- كەڭلىكىدە 1,920 pixel\n- ئېگىزلىكىدە 1,080 pixel\n\n### مەنبەدە قاپلانغان common resolution لار\n\n| Resolution | Name |\n|---|---|\n| **1280 × 720** | HD — High Definition |\n| **1920 × 1080** | Full HD |\n| **2560 × 1440** | Quad HD |\n| **3840 × 2160** | Ultra HD / 4K |\n\nمەنبە بويىچە ئادەتتە resolution يۇقىرى بولسا total pixel كۆپرەك بولۇپ، image تېخىمۇ detailed ۋە sharp كۆرۈنىدۇ.\n\n**ئەستە تۇتۇڭ: Resolution = Total pixels / width × height**\n\n---\n\n### Pixel Density\n\n**Pixel density** — pixel لارنىڭ ئېكران يۈزىگە قانچىلىك زىچ ئورۇنلاشقانلىقى.\n\nResolution total pixel سانىنى كۆرسىتىدۇ؛ pixel density شۇ pixel لارنىڭ قانچىلىك يېقىن ئورۇنلاشقانلىقىنى كۆرسىتىدۇ.\n\nئادەتتە:\n\n**PPI — Pixels Per Inch**\n\nبىلەن ئۆلچىنىدۇ.\n\n### Same Resolution, Different Density\n\nئىككى ئېكراندا resolution ئوخشاش بولۇشى مۇمكىن.\n\nئەگەر بىر ئېكران physically كىچىكرەك بولسا:\n- pixel لار تېخىمۇ زىچ\n- PPI يۇقىرى\n\nئوخشاش resolution تېخىمۇ چوڭ ئېكراندا بولسا:\n- pixel لار تېخىمۇ تارقىلىدۇ\n- PPI تۆۋەن\n\nمەنبە بويىچە high pixel density:\n- text نى تېخىمۇ sharp\n- edge لارنى smooth\n- image نى clear\n\nكۆرسىتىدۇ.\n\n**ئەستە تۇتۇڭ: Resolution = قانچە pixel؟ / Pixel density = قانچىلىك زىچ؟**\n\n---\n\n### Refresh Rate\n\n**Refresh rate** — ئېكراننىڭ بىر سېكۇنتتا image نى قانچە قېتىم يېڭىلايدىغانلىقى.\n\nRefresh rate:\n- **Hertz (Hz)** بىلەن ئۆلچىنىدۇ\n\n**Transcript correction:** source transcript تا Hertz نىڭ abbreviation ى `hc` دەپ خاتا transcript قىلىنغان. Reviewed Uyghur دا توغرا canonical abbreviation **Hz** ئىشلىتىلدى؛ ئەسلى English source ئۆزگەرتىلمىدى.\n\nمىسال:\n- **60 Hz** → بىر سېكۇنتتا 60 قېتىم refresh\n- **120 Hz** → بىر سېكۇنتتا 120 قېتىم refresh\n\nRefresh rate يۇقىرى بولسا motion تېخىمۇ smooth كۆرۈنىدۇ. مەنبە action scene ۋە video game نى مىسال قىلىدۇ.\n\nRefresh rate تۆۋەن بولسا تېز ھەرىكەت less fluid كۆرۈنۈشى مۇمكىن.\n\n### Refresh Rate ≠ Resolution ≠ Pixel Density\n\n- **Resolution** → detail / total pixels\n- **Pixel density** → pixels قانچىلىك زىچ\n- **Refresh rate** → motion قانچىلىك smooth\n\nDisplay ناھايىتى sharp بولۇشى مۇمكىن، ئەمما refresh rate تۆۋەن بولسا motion less smooth كۆرۈنىدۇ.\n\n**ئەستە تۇتۇڭ: Refresh rate = Motion smoothness**\n\n---\n\n### Color Gamut\n\n**Color gamut** — display ھاسىل قىلالايدىغان رەڭلەرنىڭ دائىرىسى.\n\nWider color gamut:\n- تېخىمۇ كۆپ رەڭنى كۆرسىتەلەيدۇ\n- image تېخىمۇ rich\n- vibrant\n- true-to-life\n\nكۆرۈنۈشى مۇمكىن.\n\nLower-end display دا color washed out ياكى less accurate كۆرۈنۈشى مۇمكىن.\n\nHigher-quality display:\n- deeper red\n- brighter green\n- shade لار ئارىسىدىكى نازۇك transition\n\nنى كۆرسىتەلەيدۇ.\n\nمەنبە color gamut مۇھىم بولغان ئىشلارنى:\n- photo editing\n- graphic design\n- video production\n- media consumption\n\nدەپ كۆرسىتىدۇ.\n\n### Same Resolution + Same Refresh, Different Color\n\nمەنبەدىكى scenario دا ئىككى monitor نىڭ:\n- resolution ئوخشاش\n- refresh rate ئوخشاش\n\nئەمما بىرى dull، بىرى vivid/lifelike كۆرۈنىدۇ.\n\nپەرق:\n- **color gamut**\n\nبىرى تېخىمۇ كەڭ رەڭ دائىرىسىنى ھاسىل قىلالايدۇ.\n\n---\n\n## Objective 3.1 — قىسقا خۇلاسە\n\n### Display Types\n- **LCD** = Liquid crystal + backlight\n- **LED monitor** = كۆپىنچە LED-backlit LCD\n- **IPS** = Color accuracy + wide viewing angle\n- **TN** = Fast response + high refresh rate\n- **VA** = Strong contrast + deeper black\n- **Mini-LED** = LCD + many small LEDs + local dimming\n- **OLED** = Each pixel creates its own light + true black\n\n### Display Components\n- **Touchscreen** = Direct touch interaction\n- **Digitizer** = Touch نى detect قىلىدۇ\n- **Display panel** = Image ھاسىل قىلىدۇ\n- **Inverter** = Older CCFL: DC → high-voltage AC\n\n### Display Attributes\n- **Resolution** = Total pixels / width × height\n- **Pixel density** = Pixels per inch (PPI)\n- **Refresh rate** = Updates per second (Hz)\n- **Color gamut** = Range of colors display can produce\n"}, {"id": "3.2", "number": "3.2", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.2, summarize basic cable types and their connectors, features, and purposes. Copper network cables. In this video segment, we'll explore the fundamental types of copper network cables and how they're utilized.\n\nNetwork cabling, along with associated interfaces, serves the crucial function of linking network devices to facilitate data sharing. These cables are integral to the infrastructure of most wired networks and are available in several forms. The copper cabling options include phone cables, coaxial cables, and ethernet or CAT cables.\n\nCopper phone cables, although originally designed for voice communication, have evolved to support various data communication applications. While they still play a crucial role in landline telephone connections, phone cables are also commonly used for dial-up and DSL internet connections. Both these technologies allow data to be transmitted over existing phone lines, enabling internet access for homes and businesses without the need for additional infrastructure.\n\nNext, we have coaxial cables. These copper cables are commonly used in broadband internet connections, particularly in cable internet services. These cables enable the delivery of high-speed internet access to homes and businesses, supporting activities such as web browsing, video streaming, online gaming, and file downloads.\n\nAs for ethernet or CAT cables, where CAT is short for category, they are indispensable in modern networking, facilitating crucial connections such as linking a modem to a SOHO router or connecting a SOHO router to a desktop PC. And given their widespread use in networking setups today, it only makes sense that we should explore this copper cable type in more depth. We'll begin our in-depth exploration of CAT cables by first examining their specifications.\n\nOver time, the evolution of CAT cables has been driven by an ever-increasing demand for network speed and reliability. This has led to many different CAT cable standards over time. While it's not necessary to memorize every CAT cable standard ever created, we do need to know a few specific ones for the CompTIA A+ Core 1 certification exam.\n\nHere are a few cable specifications you should memorize. CAT5 cables support 100 megabits per second of throughput for a distance of up to 100 meters. This conforms to the 100BaseTx standard.\n\nCAT5e cables support 1000 megabits per second of throughput for a distance of up to 100 meters. This conforms to the 1000BaseTx standard. CAT6 cables also support 1000 megabits per second of throughput for a distance of up to 100 meters and conforms to the 1000BaseTx standard just like a CAT5e cable, but they also support 10 gigabits per second of throughput at a shorter distance of 55 meters.\n\nThis conforms to the 10GBaseTx standard. Last, we have the CAT6a cable. The 80 stands for augmented.\n\nCAT6a supports 10 gigabits per second for the full 100 meter distance, improving upon CAT6. It also conforms to the 10GBaseTx standard. For many modern high speed networks, CAT6a is a common choice.\n\nNow let's briefly discuss CAT7 and CAT8. CAT7 cables were designed to support speeds up to 10 gigabits per second at 100 meters, similar to CAT6a, but with even more shielding. CAT7 uses shielded twisted pair construction and is designed to reduce electromagnetic interference even further.\n\nFinally, we have CAT8. CAT8 is designed for very high speed data centers. It supports up to 40 gigabits per second, but only at shorter distances, typically up to 30 meters.\n\nCAT8 is heavily shielded and intended for high performance environments, such as server rooms and data centers, not typical home or small office installations. For the 80 plus core one exam, your primary focus should be on CAT5, CAT5e, CAT6, and CAT6a, along with their speeds and distance limitations. Understanding CAT7 and CAT8 conceptually is helpful, especially knowing that CAT8 supports up to 40 gigabits per second at shorter distances.\n\nCAT cables are twisted pair cables. That means cables consist of pairs of insulated copper wires twisted together. This twisting of wires helps to mitigate electromagnetic interference, or EMI.\n\nOne key term to understand in this context is crosstalk. Crosstalk refers to the interference caused when the signals transmitted on one wire pair affect the signals on an adjacent wire pair. By twisting the wires together in pairs, crosstalk is minimized, ensuring that data can be transmitted more reliably.\n\nNext, we have two main types of twisted pair cables, unshielded twisted pair, or UTP, and shielded twisted pair, or STP. UTP cables do not have any additional EMI protection beyond the twisting of the wire pairs. STP cables, on the other hand, feature an extra layer of shielding, such as foil or braided metal, that is wrapped around the outside of the wire pairs, providing further protection against interference.\n\nThese STP cables are commonly used in environments where there are high levels of electromagnetic interference, such as industrial settings or areas with heavy machinery. Another construction consideration is a plenum rating. Plenum-rated cables are specifically designed for use in plenum spaces within buildings.\n\nA plenum space is an area used for air circulation in HVAC, or heating, ventilation, and air conditioning systems, typically found above suspended ceilings or below raised floors. These spaces serve as pathways for air to circulate throughout the building, helping to maintain proper airflow and temperature regulation. What sets plenum-rated cables apart is their construction and materials.\n\nThese cables are manufactured using fire-retardant materials that are capable of withstanding high temperatures without emitting toxic fumes or spreading flames rapidly. This is crucial in plenum spaces, as any fire hazard poses a significant risk to the entire building. Additionally, plenum-rated cables undergo stringent testing and certification processes to ensure they meet specific safety standards and building codes.\n\nThis includes testing for flame spread, smoke generation, and toxicity levels. Using plenum-rated cables in plenum spaces is not only a matter of compliance with building regulations, but also a crucial safety measure. In the event of a fire, these cables help to minimize the spread of flames and reduce the release of harmful gases, providing occupants with valuable time to evacuate safely.\n\nAnd to wrap up our study of CAT cables, let's discuss connector pinouts, specifically the T5-68A and T5-68B standards. Connector pinouts define the arrangement of wires within ethernet connectors, ensuring consistency and compatibility across network installations. T5-68A and T5-68B are two commonly used pinup standards for ethernet cables, dictating the order in which wires are terminated at the connector ends.\n\nT5-68A and T5-68B standards differ in their wire arrangement, primarily in the positioning of the green and orange wire pairs. T5-68A features a green pair on pins one and two and an orange pair on pins three and six. In contrast, T5-68B reverses this arrangement, placing the orange pair on pins one and two and the green pair on pins three and six.\n\nExam objective 3.2, summarize basic cable types and their connectors, features and purposes. Fiber optic network cables. In this video segment, we will discuss the fundamental aspects of fiber optic network cables.\n\nThese cables are at the forefront of modern networking and are revolutionizing the way data is transmitted across vast distances with unparalleled speed and reliability. Unlike traditional copper cables, which rely on electrical signals to transmit data, fiber optic network cables harness the power of light pulses to convey information. This innovative approach not only ensures faster transmission speeds, but also significantly enhances the efficiency of data transfer processes.\n\nBy leveraging light signals, fiber optic cables mitigate many of the limitations associated with copper-based counterparts, such as signal degradation and electromagnetic interference, thus offering a superior solution for modern networking needs. Now let's explore the two main types of fiber optic cables, single mode fiber and multimode fiber. For this, we will start by exploring single mode fiber, a type of fiber optic cable designed for transmitting a single mode of light through a very small tube known as a core.\n\nThis method of light transmission results in remarkably lower signal attenuation, allowing for longer distance transmissions with superior bandwidth capabilities. Single mode fiber stands out as the preferred choice for long haul telecommunications, where reliability and high performance data transmission over extensive distances are paramount. It serves as the backbone of intercontinental network infrastructure, seamlessly connecting locations worldwide and facilitating high speed data transmission applications with unparalleled efficiency and reliability.\n\nOn the other hand, multimode fiber, as the name suggests, accommodates multiple modes of light propagation simultaneously within its core. This characteristic makes it an ideal choice for short distance transmissions typically found within buildings or campus environments. With its larger core diameter, multimode fiber facilitates easier alignment of light signals, simplifying installation and making it more cost effective for shorter distances.\n\nIt finds widespread use in local area network setups, data centers and multimedia applications owing to its affordability and versatility in accommodating various networking needs. Exam objective 3.2, summarize basic cable types and their connectors, features and purposes. Peripheral cables.\n\nAs a starting point in the field of information technology, understanding peripheral cables is fundamental to your grasp of hardware components and their connectivity. So let's dive in. Peripheral cables serve as the vital links between various devices and your computer.\n\nThey enable the transmission of data, power and signals, facilitating seamless communication and functionality. These cables come in different types, each tailored to specific purposes and technologies. One of the most well-known peripheral cables is the USB.\n\nUSB, short for universal serial bus, is a standard interface used for connecting peripherals to computers and other devices. And this cable type has revolutionized connectivity since its inception in 1996. They facilitate data transfer, power supply and device connectivity.\n\nWith USB cables, you can transfer files, connect peripherals like keyboards and printers or charge your devices. USB cables have undergone significant evolution since their introduction with USB version 1.0. Initially, USB 1.0 provided modest data transfer speeds reaching up to 12 megabits per second, suitable for basic peripherals.\n\nHowever, with the demand for faster and more efficient connectivity, USB 2.0 emerged, representing a significant advancement. USB 2.0 brought about notable improvements in data transfer rates, offering speeds of up to 480 megabits per second, making it the preferred choice for connecting peripherals like keyboards, mice and printers to your computer. This upgrade allowed for smoother and more responsive interaction with these essential devices enhancing overall user experience.\n\nAs technology continued to advance, the need for even faster data transfer became apparent. Enter USB 3.0, a groundbreaking development in USB technology. USB 3.0 cables, easily distinguishable by their blue connectors, revolutionized data transfer with substantially increased speeds compared to their predecessors.\n\nThese cables are designed to handle high bandwidth applications, offering speeds of five gigabits per second or more, depending on the 3.0 version, making them ideal for connecting high speed devices such as external data drives and high definition webcams. With USB 3.0, users can transfer large files and multimedia content swiftly and efficiently without experiencing bottlenecks or slowdowns. This enhanced performance has transformed how we interact with peripheral devices, providing seamless access to vast amounts of data and multimedia content.\n\nTransitioning from USB cables, another type of peripheral cable is the serial cable. A serial cable is a type of connection used for serial transmission of data between devices. Although less common in contemporary computing environments, it maintains relevance for specific applications where its unique characteristics are advantageous.\n\nSerial cables are recognized for their method of serial data transmission, which involves sending data one bit at a time over a single wire or pair of wires, in contrast to parallel transmission used in interfaces like USB. While serial transmission generally results in lower data transfer speeds compared to USB, it offers advantages in certain scenarios such as long distance communication and simplicity of implementation. Now let's shift our focus to yet another remarkable peripheral cable technology, Thunderbolt.\n\nThunderbolt is a high speed peripheral standard that enables rapid data transfer and versatile connectivity. This cable standard was developed by Intel in collaboration with Apple. Thunderbolt enables blazing fast data transfer rates and supports a wide array of peripherals, including displays and storage devices.\n\nOne of the defining features of Thunderbolt is its ability to handle multiple types of data streams simultaneously, making it ideal for demanding applications that require high bandwidth. At its core, a Thunderbolt cable is a high performance connection solution designed to deliver unparalleled speed and flexibility. It combines data transfer, video output, network connectivity and power delivery into a single compact cable, streamlining connectivity for users.\n\nExam objective 3.2, summarize basic cable types and their connectors, features and purposes. Video cables. Video connectivity in information technology involves several different cable standards used to transmit visual and sometimes audio signals between devices such as computers, monitors, televisions and projectors.\n\nOver time, these standards have evolved from analog only video connections to high speed digital interfaces capable of carrying both audio and ultra high definition video. In this video segment, we will walk through the major video cable types you need to recognize for the A+ Core 1 exam, beginning with VGA. VGA stands for Video Graphics Array and was introduced in 1987.\n\nIt became widely adopted in early desktop computers and monitors. VGA uses a 15 pin connector, commonly colored blue and transmits video only. If audio is required, a separate cable must be used.\n\nVGA is an analog standard, meaning it transmits continuous electrical signals rather than discrete digital data. Because it is analog, VGA is mo
