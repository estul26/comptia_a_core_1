function toast(msg){
  const t=$("toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1300);
}
function splitParagraphs(text){
  return text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map(s=>s.replace(/^#{1,4}\s+/,""));
}
function visibleTerms(){
  const hay=current().english;
  return TECH_TERMS.filter(term=>{
    const safe=term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    return new RegExp(`(^|[^A-Za-z0-9])${safe}(?=$|[^A-Za-z0-9])`,"i").test(hay);
  }).slice(0,32);
}
function renderTerms(){
  const bar=$("termbar"),terms=visibleTerms();
  bar.innerHTML=terms.length?terms.map(t=>`<button class="termchip" data-term="${esc(t)}">${esc(t)}</button>`).join(""):"";
  bar.querySelectorAll(".termchip").forEach(b=>b.onclick=()=>{
    const term=b.dataset.term;
    $("lessonSearch").value=term;
    renderArticles();
    bar.querySelectorAll(".termchip").forEach(x=>x.classList.toggle("active",x===b));
  });
}
function addCopyButtons(root){
  root.querySelectorAll("p,h3,h4,h5,h6,li").forEach(el=>{
    const b=document.createElement("button");b.className="copybtn";b.type="button";b.textContent="Copy";
    b.title="Copy this section";b.setAttribute("aria-label","Copy this section");
    b.onclick=async e=>{
      e.stopPropagation();
      const clone=el.cloneNode(true);clone.querySelectorAll("button").forEach(x=>x.remove());
      try{await navigator.clipboard.writeText(clone.innerText.trim());toast("Copied");}
      catch{toast("Copy unavailable");}
    };
    el.prepend(b);
  });
}

function tokensForAlign(s){
  const latin=(s.match(/[A-Za-z][A-Za-z0-9+_.:/#-]*/g)||[]).map(x=>x.toLowerCase());
  const nums=(s.match(/\b\d+(?:[.:/-]\d+)*\b/g)||[]);
  return new Set([...latin,...nums]);
}
function jaccard(a,b){
  if(!a.size&&!b.size)return 0;
  let inter=0;for(const x of a)if(b.has(x))inter++;
  return inter/Math.max(1,a.size+b.size-inter);
}
function smartAlign(en,ug){
  // Sequence-preserving alignment. Technical terms/numbers preserved in the Uyghur
  // translation act as anchors; paragraph position and length are secondary signals.
  const pairs=[];
  if(!en.length||!ug.length)return pairs;
  let uj=0;
  for(let i=0;i<en.length;i++){
    const e=en[i], et=tokensForAlign(e);
    const expected=(i/Math.max(1,en.length-1))*Math.max(0,ug.length-1);
    let best=uj, bestScore=-1;
    const lo=Math.max(0, uj-1, Math.floor(expected)-3), hi=Math.min(ug.length-1, Math.ceil(expected)+4);
    for(let j=lo;j<=hi;j++){
      if(j<uj-1)continue;
      const ut=tokensForAlign(ug[j]);
      const term=jaccard(et,ut);
      const pos=1-Math.min(1,Math.abs(j-expected)/Math.max(2,ug.length*.15));
      const er=e.length, ur=ug[j].length;
      const len=Math.min(er,ur)/Math.max(1,Math.max(er,ur));
      const score=term*0.62+pos*0.28+len*0.10;
      if(score>bestScore){bestScore=score;best=j}
    }
    uj=Math.max(uj,best);
    pairs.push({e:e,u:ug[best]||"",score:bestScore});
  }
  return pairs;
}
function globalSearch(q){
  const box=$("globalResults");
  if(!q||q.length<2){box.classList.remove("open");box.innerHTML="";return}
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=[];
  LESSONS.forEach((l,i)=>{
    const hay=(l.english+"\n"+l.uyghur).toLowerCase();
    if(terms.every(t=>hay.includes(t))){
      const idx=Math.max(0,hay.indexOf(terms[0]));
      const raw=(l.english+" "+l.uyghur).replace(/\s+/g," ");
      const snippet=raw.slice(Math.max(0,idx-55),idx+120);
      hits.push({i,l,snippet});
    }
  });
  box.innerHTML=hits.slice(0,18).map(h=>`<button class="search-hit" data-i="${h.i}">
    <strong>${h.l.id==="intro"?"Introduction":"Objective "+h.l.id} · ${esc(h.l.domain_en)}</strong>
    <span>${esc(h.snippet)}</span>
  </button>`).join("") || '<div class="empty">No course-wide matches</div>';
  box.classList.add("open");
  box.querySelectorAll(".search-hit").forEach(b=>b.onclick=()=>{
    state.index=Number(b.dataset.i);render();$("lessonSearch").value=q;renderArticles();box.classList.remove("open");
  });
}

function buildPairs(){
  const en=splitParagraphs(current().english),ug=splitParagraphs(current().uyghur);
  const aligned=smartAlign(en,ug),box=$("pairView");
  if(!aligned.length){box.innerHTML='<div class="empty">No content</div>';return}
  let out="";
  aligned.forEach((p,i)=>{
    const confidence=p.score>=.55?"High":p.score>=.30?"Medium":"Approx";
    out+=`<section class="pair-card" tabindex="0">
      <div class="pair-side ${state.recallSide==="en"?"recall-target":""}">
        <div class="pair-num">${i+1}</div><span class="align-badge">${confidence} match</span>
        <div class="reveal-hint">Click to reveal English</div>
        <div>${rich(p.e,"",false)[0]}</div>
      </div>
      <div class="pair-side pair-ug ${state.recallSide==="ug"?"recall-target":""}" lang="ug" dir="rtl">
        <div class="pair-num">${i+1}</div><span class="align-badge">${confidence} match</span>
        <div class="reveal-hint">چېكىپ ئۇيغۇرچىنى كۆرۈڭ</div>
        <div>${rich(p.u,"",true)[0]}</div>
      </div>
    </section>`;
  });
  box.innerHTML=out;
  box.classList.toggle("recall-hidden",!!state.recallSide);
  box.querySelectorAll(".pair-card").forEach(card=>{
    card.onclick=e=>{
      box.querySelectorAll(".pair-card").forEach(x=>x.classList.remove("focused"));card.classList.add("focused");
      const target=e.target.closest(".recall-target");if(target)target.classList.toggle("revealed");
    };
  });
}
function applyStudyModes(){
  document.body.classList.toggle("pairs",state.pairMode);
  document.body.classList.toggle("read-focus",state.focusLine);
  $("pairBtn").classList.toggle("on",state.pairMode);
  $("pairBtn").textContent=state.pairMode?"▥ Columns":"▦ Cards";
  $("focusLineBtn").classList.toggle("on",state.focusLine);
}
function current(){return LESSONS[state.index]}
function saveSets(){
  localStorage.setItem("a1-completed",JSON.stringify([...state.completed]));
  localStorage.setItem("a1-bookmarks",JSON.stringify([...state.bookmarks]));
}
function progress(){
  const objectiveCount=LESSONS.length-1;
  const done=[...state.completed].filter(x=>x!=="intro").length;
  const pct=objectiveCount?Math.round(done/objectiveCount*100):0;
  $("progressText").textContent=`${done} / ${objectiveCount}`;
  $("progressPercent").textContent=pct+"%";
  $("progressBar").style.width=pct+"%";
}
function buildMobileLessonSelect(){
  const sel=$("mobileLessonSelect");
  if(!sel)return;
  if(!sel.options.length){
    sel.innerHTML=LESSONS.map((l,i)=>`<option value="${i}">${l.id==="intro"?"Introduction":"Objective "+l.id} — ${esc(l.domain_en)}</option>`).join("");
    sel.onchange=()=>{state.index=Number(sel.value);render();};
  }
  sel.value=String(state.index);
}
function buildNav(filter=""){
  const nav=$("nav");nav.innerHTML="";
  let lastDomain=null, visible=0;
  LESSONS.forEach((l,i)=>{
    const hay=(l.id+" "+l.domain_en+" "+l.domain_ug+" "+l.english+" "+l.uyghur).toLowerCase();
    if(filter && !hay.includes(filter.toLowerCase()))return;
    visible++;
    if(l.domain!==lastDomain){
      const d=document.createElement("div");d.className="domain-title";
      d.textContent=domainLabels[l.domain][0];nav.appendChild(d);lastDomain=l.domain;
    }
    const b=document.createElement("button");b.className="nav-item"+(i===state.index?" active":"")+(state.bookmarks.has(l.id)?" bookmarked":"");
    const done=state.completed.has(l.id)?"✓":"";
    b.innerHTML=`<span class="num">${esc(l.number)}</span><span class="label">${esc(l.domain_en)}</span><span class="done">${done}</span>`;
    b.onclick=()=>{state.index=i;render();};
    nav.appendChild(b);
  });
  if(!visible)nav.innerHTML='<div class="empty">No matching lesson</div>';
}
function readingRatioFor(id){
  const r=Number(localStorage.getItem("a1-scroll-ratio-"+id));
  if(Number.isFinite(r)&&r>0)return Math.min(1,Math.max(0,r));
  const px=Number(localStorage.getItem("a1-scroll-"+id));
  const max=$("enPane").scrollHeight-$("enPane").clientHeight;
  return Number.isFinite(px)&&px>0&&max>0?Math.min(1,px/max):0;
}
function setScrollImmediate(el,top){
  const prior=el.style.scrollBehavior;el.style.scrollBehavior="auto";el.scrollTop=Math.max(0,top);
  requestAnimationFrame(()=>{el.style.scrollBehavior=prior});
}
function saveReadingPosition(src){
  if(suppressScrollSave)return;
  const max=src.scrollHeight-src.clientHeight;if(max<=0)return;
  const ratio=Math.min(1,Math.max(0,src.scrollTop/max));
  localStorage.setItem("a1-scroll-ratio-"+current().id,String(ratio));
  if(src===$("enPane"))localStorage.setItem("a1-scroll-"+current().id,String(Math.round(src.scrollTop)));
}
function render(){
  const l=current();localStorage.setItem("a1-last",l.id);
  $("crumb").textContent=l.id==="intro"?"Course introduction":`${domainLabels[l.domain][0]} · Exam Objective ${l.id}`;
  $("objectiveBadge").textContent=l.id==="intro"?"INTRO":`OBJ ${l.id}`;
  $("domainChip").textContent=domainLabels[l.domain][0];
  $("lessonCounter").textContent=`${state.index+1} of ${LESSONS.length}`;
  $("lessonTitle").textContent=l.id==="intro"?"Course Introduction":`Objective ${l.id} · ${l.domain_en}`;
  $("lessonTitleUg").textContent=l.id==="intro"?l.domain_ug:l.domain_ug;
  $("completeBox").checked=state.completed.has(l.id);
  $("bookmarkBtn").textContent=(state.bookmarks.has(l.id)?"★":"☆")+" Bookmark";
  $("bookmarkBtn").classList.toggle("on",state.bookmarks.has(l.id));
  $("notes").value=localStorage.getItem("a1-note-"+l.id)||"";
  $("lessonSearch").value="";
  renderArticles();
  renderTerms();
  buildPairs();
  applyStudyModes();
  $("prevBtn").disabled=state.index===0;$("nextBtn").disabled=state.index===LESSONS.length-1;
  const savedRatio=readingRatioFor(l.id);
  $("resumePill").classList.toggle("show",savedRatio>.01);
  $("resumePill").onclick=()=>{
    const en=$("enPane"),ug=$("ugPane");
    setScrollImmediate(en,savedRatio*Math.max(0,en.scrollHeight-en.clientHeight));
    setScrollImmediate(ug,savedRatio*Math.max(0,ug.scrollHeight-ug.clientHeight));
  };
  suppressScrollSave=true;
  setScrollImmediate($("enPane"),0);setScrollImmediate($("ugPane"),0);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{suppressScrollSave=false}));
  buildMobileLessonSelect();
  buildNav($("courseSearch").value.trim());
  progress();
}
function renderArticles(){
  const q=$("lessonSearch").value.trim();
  const a=rich(current().english,q,false),b=rich(current().uyghur,q,true);
  $("enArticle").innerHTML=a[0];$("ugArticle").innerHTML=b[0];
  addCopyButtons($("enArticle"));addCopyButtons($("ugArticle"));
  $("matchStatus").textContent=q?`${a[1]+b[1]} matches`:"";
  if(q){
    const first=document.querySelector("mark");
    if(first) first.scrollIntoView({block:"center"});
  }
}
function syncScroll(src,dst){
  if(!state.sync||scrollLock)return;
  const a=src.scrollHeight-src.clientHeight,b=dst.scrollHeight-dst.clientHeight;if(a<=0||b<=0)return;
  scrollLock=true;dst.scrollTop=(src.scrollTop/a)*b;requestAnimationFrame(()=>scrollLock=false);
}
$("enPane").addEventListener("scroll",()=>{
  saveReadingPosition($("enPane"));
  syncScroll($("enPane"),$("ugPane"));
});
$("ugPane").addEventListener("scroll",()=>{
  saveReadingPosition($("ugPane"));
  syncScroll($("ugPane"),$("enPane"));
});
["enArticle","ugArticle"].forEach(id=>{
  $(id).addEventListener("mouseover",e=>{
    const t=e.target.closest("p,li,h3,h4,h5,h6,blockquote");
    if(!t)return;
    $(id).querySelectorAll(".focus-line").forEach(x=>x.classList.remove("focus-line"));
    t.classList.add("focus-line");
  });
});
$("syncBtn").onclick=()=>{
  state.sync=!state.sync;localStorage.setItem("a1-sync",state.sync?"1":"0");
  $("syncBtn").classList.toggle("on",state.sync);$("syncBtn").textContent=state.sync?"⇅ Sync":"⇅ Free";
};
$("completeBox").onchange=e=>{
  const id=current().id;e.target.checked?state.completed.add(id):state.completed.delete(id);saveSets();progress();buildNav($("courseSearch").value.trim());
};
$("bookmarkBtn").onclick=()=>{
  const id=current().id;state.bookmarks.has(id)?state.bookmarks.delete(id):state.bookmarks.add(id);saveSets();render();
};
$("noteBtn").onclick=()=>$("noteBox").classList.toggle("open");
$("notes").oninput=e=>localStorage.setItem("a1-note-"+current().id,e.target.value);
$("prevBtn").onclick=()=>{if(state.index>0){state.index--;render()}};
$("nextBtn").onclick=()=>{if(state.index<LESSONS.length-1){state.index++;render()}};
$("lessonSearch").addEventListener("input",e=>{
  renderArticles();
  globalSearch(e.target.value.trim());
});
$("courseSearch").addEventListener("input",e=>buildNav(e.target.value.trim()));
$("hideEnBtn").onclick=()=>{
  state.pairMode=true;state.recallSide=state.recallSide==="en"?"":"en";
  localStorage.setItem("a1-pair-mode","1");localStorage.setItem("a1-recall-side",state.recallSide);
  buildPairs();applyStudyModes();
};
$("hideUgBtn").onclick=()=>{
  state.pairMode=true;state.recallSide=state.recallSide==="ug"?"":"ug";
  localStorage.setItem("a1-pair-mode","1");localStorage.setItem("a1-recall-side",state.recallSide);
  buildPairs();applyStudyModes();
};
$("revealBtn").onclick=()=>{
  state.recallSide="";localStorage.setItem("a1-recall-side","");buildPairs();
};
$("bookmarksOnlyBtn").onclick=()=>{
  state.bookmarksOnly=!state.bookmarksOnly;
  $("bookmarksOnlyBtn").classList.toggle("on",state.bookmarksOnly);
  $("bookmarksOnlyBtn").textContent=state.bookmarksOnly?"★ Showing bookmarks":"☆ Bookmarks only";
  document.body.classList.toggle("bookmarks-only",state.bookmarksOnly);
  buildNav($("courseSearch").value.trim());
};
document.addEventListener("click",e=>{
  if(!e.target.closest("#lessonSearch")&&!e.target.closest("#globalResults"))$("globalResults").classList.remove("open");
});
$("focusBtn").onclick=()=>document.body.classList.toggle("focus");
function applyLanguageMode(mode){
  const safe=["both","en","ug"].includes(mode)?mode:"both";
  document.body.classList.remove("language-en","language-ug");
  if(safe==="en")document.body.classList.add("language-en");
  if(safe==="ug")document.body.classList.add("language-ug");
  $("languageMode").value=safe;localStorage.setItem("a1-language",safe);
}
$("languageMode").onchange=e=>applyLanguageMode(e.target.value);
const ugFonts={
  naskh:'"Noto Naskh Arabic","Geeza Pro","Noto Sans Arabic","Arial Unicode MS",serif',
  sans:'"Noto Sans Arabic","Geeza Pro","Arial Unicode MS",sans-serif',
  geeza:'"Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Arial Unicode MS",serif',
  ukij:'"UKIJ Tuz","Noto Naskh Arabic","Geeza Pro","Noto Sans Arabic",serif'
};
function applyUgFont(name){
  const key=ugFonts[name]?name:"naskh";
  document.documentElement.style.setProperty("--ug-font",ugFonts[key]);
  $("ugFont").value=key;
  localStorage.setItem("a1-ug-font",key);
}
$("ugFont").onchange=e=>applyUgFont(e.target.value);
$("fontUp").onclick=()=>{state.font=Math.min(30,state.font+1);document.documentElement.style.setProperty("--fs",state.font+"px");localStorage.setItem("a1-font",state.font)};
$("fontDown").onclick=()=>{state.font=Math.max(13,state.font-1);document.documentElement.style.setProperty("--fs",state.font+"px");localStorage.setItem("a1-font",state.font)};
$("themeBtn").onclick=()=>{
  document.body.classList.toggle("dark");localStorage.setItem("a1-theme",document.body.classList.contains("dark")?"dark":"light");
};
$("pairBtn").onclick=()=>{
  state.pairMode=!state.pairMode;localStorage.setItem("a1-pair-mode",state.pairMode?"1":"0");
  if(!state.pairMode){state.recallSide="";localStorage.setItem("a1-recall-side","");}
  applyStudyModes();if(state.pairMode)buildPairs();
};
$("focusLineBtn").onclick=()=>{
  state.focusLine=!state.focusLine;localStorage.setItem("a1-focus-line",state.focusLine?"1":"0");applyStudyModes();
};
$("exportNotesBtn").onclick=()=>{
  const chunks=[];
  LESSONS.forEach(l=>{
    const n=localStorage.getItem("a1-note-"+l.id);
    if(n&&n.trim())chunks.push(`Objective ${l.id} — ${l.domain_en}\n${n.trim()}`);
  });
  if(!chunks.length){toast("No saved notes yet");return}
  const blob=new Blob([chunks.join("\n\n"+"=".repeat(64)+"\n\n")],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="CompTIA_A_Core1_My_Notes.txt";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Notes exported");
};
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){e.preventDefault();$("lessonSearch").focus()}
  if(e.key==="/"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){e.preventDefault();$("lessonSearch").focus()}
  if(e.altKey&&e.key==="ArrowRight"&&state.index<LESSONS.length-1){state.index++;render()}
  if(e.altKey&&e.key==="ArrowLeft"&&state.index>0){state.index--;render()}
  if(e.key.toLowerCase()==="c"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("pairBtn").click()}
  if(e.key.toLowerCase()==="l"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("focusLineBtn").click()}
  if(e.key.toLowerCase()==="e"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("hideEnBtn").click()}
  if(e.key.toLowerCase()==="u"&&!["INPUT","TEXTAREA"].includes(document.activeElement.tagName)){$("hideUgBtn").click()}
});
if(localStorage.getItem("a1-theme")==="dark")document.body.classList.add("dark");
document.documentElement.style.setProperty("--fs",state.font+"px");
applyUgFont(localStorage.getItem("a1-ug-font")||"naskh");
applyLanguageMode(state.languageMode);

// ----- V5 Cloud / PWA features -----
function updateNetworkStatus(){
  const n=$("netStatus");
  if(!n)return;
  n.textContent=navigator.onLine?"Online":"Offline";
  n.style.color=navigator.onLine?"var(--good)":"var(--warn)";
}
window.addEventListener("online",()=>{updateNetworkStatus();toast("Back online")});
window.addEventListener("offline",()=>{updateNetworkStatus();toast("Offline mode")});
updateNetworkStatus();

function objectiveFromHash(){
  const m=location.hash.match(/objective=([^&]+)/);
  if(!m)return null;
  return decodeURIComponent(m[1]);
}
const hashObjective=objectiveFromHash();
if(hashObjective){
  const hi=LESSONS.findIndex(x=>x.id===hashObjective);
  if(hi>=0)state.index=hi;
}
window.addEventListener("hashchange",()=>{
  const id=objectiveFromHash();
  const i=LESSONS.findIndex(x=>x.id===id);
  if(i>=0 && i!==state.index){state.index=i;render();}
});

const originalRender=render;
render=function(){
  originalRender();
  const id=current().id;
  const desired="#objective="+encodeURIComponent(id);
  if(location.hash!==desired)history.replaceState(null,"",desired);
};

$("shareBtn").onclick=async()=>{
  const url=location.href;
  try{
    if(navigator.share){
      await navigator.share({title:document.title,text:"CompTIA A+ Core 1 — "+current().id,url});return;
    }
    await navigator.clipboard.writeText(url);toast("Objective link copied");
  }catch(e){
    if(e && e.name==="AbortError")return;
    try{await navigator.clipboard.writeText(url);toast("Objective link copied")}
    catch{toast("Share unavailable")}
  }
};

let deferredInstallPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();
  deferredInstallPrompt=e;
  $("installBtn").style.display="";
});
$("installBtn").onclick=async()=>{
  if(!deferredInstallPrompt)return;
  deferredInstallPrompt.prompt();
  try{await deferredInstallPrompt.userChoice}catch(e){}
  deferredInstallPrompt=null;
  $("installBtn").style.display="none";
};

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("/sw.js").catch(()=>{});
  });
}

$("syncBtn").classList.toggle("on",state.sync);$("syncBtn").textContent=state.sync?"⇅ Sync":"⇅ Free";
render();
</script>
</body>
</html>
