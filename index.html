<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>CompTIA A+ Core 1 — Bilingual Study Reader</title>
<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--panel2:#f8fafc;--text:#18212f;--muted:#667085;
  --line:#dfe4ea;--accent:#2563eb;--accent2:#eff6ff;--good:#15803d;--warn:#a16207;
  --shadow:0 8px 30px rgba(15,23,42,.07);--fs:18px;--sidebar:300px;
  --ug-font:"Noto Naskh Arabic","Geeza Pro","Noto Sans Arabic","Arial Unicode MS",serif;
  --ug-size:1.08em;
}
body.dark{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b232d;--text:#e6edf3;--muted:#9ba7b4;
  --line:#2d3742;--accent:#58a6ff;--accent2:#172a46;--good:#5bd17a;--warn:#e5bd5d;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:17px;margin:0 0 4px}.brand p{font-size:12px;color:var(--muted);margin:0}
.progress-wrap{padding:14px 18px;border-bottom:1px solid var(--line)}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.side-search{padding:12px 12px 8px}
.side-search input,.top input,.top select,.btn,.note textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:9px
}
.side-search input{width:100%;padding:9px 10px}
.nav{overflow:auto;padding:4px 8px 28px}
.domain-title{font-size:11px;font-weight:700;color:var(--muted);padding:14px 9px 6px;text-transform:uppercase;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:8px;color:var(--text)}
.nav-item:hover{background:var(--panel2)}.nav-item.active{background:var(--accent2);color:var(--accent);font-weight:700}
.nav-item .num{width:38px;font-variant-numeric:tabular-nums}.nav-item .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nav-item .done{margin-left:auto;font-size:12px;color:var(--good)}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .grow{flex:1;min-width:180px}.top input{width:100%;padding:8px 10px}
.top select{padding:8px 9px}.btn{padding:8px 10px;background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.lesson-head{padding:20px 24px 14px;background:var(--bg)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:5px}.lesson-head h2{font-size:23px;margin:0 0 8px}
.lesson-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.complete{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.content-wrap{min-height:0;flex:1;display:flex;flex-direction:column;padding:0 18px 18px}
.reader{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.pane{min-width:0;overflow:auto;padding:0 26px 60px;scroll-behavior:smooth}
.pane+.pane{border-left:1px solid var(--line)}
.pane-title{position:sticky;top:0;z-index:4;margin:0 -26px 18px;padding:13px 26px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pane-title strong{font-size:14px}.pane-title span{font-size:11px;color:var(--muted)}
.article{font-size:var(--fs);line-height:1.78;overflow-wrap:anywhere}
.article p{margin:0 0 1.15em}.article h3{font-size:1.05em;margin:1.5em 0 .7em;color:var(--accent)}
.article ul{margin:.4em 0 1.2em;padding-left:1.35em}.article li{margin:.32em 0}
#ugArticle{
  direction:rtl;
  text-align:right;
  font-family:var(--ug-font);
  font-size:var(--ug-size);
  line-height:2.15;
  letter-spacing:0;
  word-spacing:.035em;
  text-rendering:optimizeLegibility;
  font-kerning:normal;
  font-variant-ligatures:common-ligatures contextual;
  font-feature-settings:"rlig" 1,"calt" 1,"liga" 1,"kern" 1;
}
#ugArticle p,#ugArticle li,#ugArticle h3{
  direction:rtl;
  unicode-bidi:plaintext;
}
#ugArticle ul{padding-left:0;padding-right:1.35em}
#ugArticle bdi{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:.88em;
  letter-spacing:0;
  word-spacing:0;
}
mark{background:#ffe783;color:#111;border-radius:3px;padding:0 1px}
body.dark mark{background:#786900;color:#fff}
.bottom{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.note{display:none;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.note.open{display:block}.note label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.note textarea{width:100%;min-height:95px;padding:10px;resize:vertical}
.empty{padding:28px;color:var(--muted);text-align:center}
body.focus .sidebar{display:none}body.focus .app{grid-template-columns:1fr}
.language-en .reader{grid-template-columns:1fr}.language-en #ugPane{display:none}
.language-ug .reader{grid-template-columns:1fr}.language-ug #enPane{display:none}
@media(max-width:900px){
  :root{--sidebar:250px}.lesson-head{padding:15px 14px 10px}.content-wrap{padding:0 10px 10px}
  .pane{padding-left:18px;padding-right:18px}.pane-title{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
}
@media(max-width:720px){
  .app{display:block;height:auto;min-height:100vh}.sidebar{display:none}.main{overflow:visible}
  .top{position:sticky;top:0;z-index:20}.reader{grid-template-columns:1fr;overflow:visible}
  .pane{height:58vh}.pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .content-wrap{min-height:auto}.lesson-head h2{font-size:19px}.desktop-only{display:none}
}

/* v3 study enhancements */

/* v4 smart-study enhancements */
.global-results{
  display:none;position:absolute;top:52px;left:14px;right:14px;z-index:50;
  max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:6px
}
.global-results.open{display:block}
.search-hit{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px}
.search-hit:hover{background:var(--panel2)}
.search-hit strong{display:block;font-size:13px;margin-bottom:3px}
.search-hit span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recall-tools{display:flex;gap:6px;flex-wrap:wrap}
.recall-hidden .recall-target{filter:blur(6px);user-select:none;transition:filter .15s}
.recall-hidden .recall-target:hover,.recall-hidden .recall-target.revealed{filter:none;user-select:text}
.pair-side.recall-target{position:relative}
.reveal-hint{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;pointer-events:none
}
.recall-hidden .pair-side.recall-target .reveal-hint{display:flex}
.recall-hidden .pair-side.recall-target:hover .reveal-hint,
.recall-hidden .pair-side.recall-target.revealed .reveal-hint{display:none}
.align-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:2px 6px;margin-left:6px
}
.resume-pill{
  display:none;font-size:11px;color:var(--accent);background:var(--accent2);
  border:1px solid var(--accent);border-radius:999px;padding:4px 8px;cursor:pointer
}
.resume-pill.show{display:inline-flex}
.bookmarks-only .nav-item:not(.bookmarked){display:none}
.nav-item.bookmarked .label::before{content:"★ ";color:var(--warn)}
.top{position:relative}
@media(max-width:720px){
  .global-results{top:102px;left:8px;right:8px;max-height:55vh}
  .recall-tools{width:100%}.recall-tools .btn{flex:1}
}

.termbar{
  display:flex;gap:6px;overflow:auto;padding:0 0 10px;scrollbar-width:thin;
}
.termchip{
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:5px 9px;font-size:12px;white-space:nowrap;cursor:pointer;color:var(--muted)
}
.termchip:hover,.termchip.active{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.study-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reading-mode-note{font-size:11px;color:var(--muted)}
.pair-view{
  display:none;min-height:0;flex:1;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px
}
body.pairs .reader{display:none}
body.pairs .pair-view{display:block}
.pair-card{
  display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;margin-bottom:10px;background:var(--panel)
}
.pair-side{padding:16px 18px;font-size:var(--fs);line-height:1.75}
.pair-side+.pair-side{border-left:1px solid var(--line)}
.pair-ug{
  direction:rtl;text-align:right;font-family:var(--ug-font);font-size:calc(var(--fs) * 1.08);
  line-height:2.08;unicode-bidi:plaintext
}
.pair-num{
  display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  border-radius:999px;background:var(--panel2);color:var(--muted);font-size:11px;margin-bottom:8px
}
.pair-card.focused{outline:2px solid var(--accent);outline-offset:1px}
.copybtn{
  float:right;border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 0 2px 8px
}
.copybtn:hover{color:var(--accent)}
#ugArticle .copybtn{float:left;padding:2px 8px 2px 0}
.read-focus .article p,.read-focus .article li{opacity:.34;transition:opacity .12s}
.read-focus .article p:hover,.read-focus .article li:hover,
.read-focus .article .focus-line{opacity:1}
.mobile-lang-tabs{display:none}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--panel);padding:8px 12px;border-radius:999px;font-size:12px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);background:var(--panel2);padding:1px 5px;border-radius:5px}
@media(max-width:720px){
  .pair-card{grid-template-columns:1fr}.pair-side+.pair-side{border-left:0;border-top:1px solid var(--line)}
  .mobile-lang-tabs{display:flex;gap:6px;flex:1}
  .mobile-lang-tabs .btn{flex:1}
}

@media print{
  .sidebar,.top,.lesson-actions,.bottom,.note{display:none!important}.app{display:block;height:auto}.main{overflow:visible}.content-wrap{padding:0}
  .reader{display:grid;grid-template-columns:1fr 1fr;border:0;box-shadow:none}.pane{overflow:visible;padding:12px}.pane-title{position:static}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>CompTIA A+ Core 1</h1>

    <div class="side-search">

      <select id="languageMode" title="Language layout">

      </select>
      <button class="btn on" id="syncBtn">⇅ Sync</button>

      <button class="btn" id="themeBtn">☾</button>
      <button class="btn" id="pairBtn" title="Switch between columns and paired study cards">▦ Cards</button>
      <button class="btn" id="focusLineBtn" title="Dim other paragraphs while reading">◎ Focus line</button>
      <button class="btn" id="exportNotesBtn" title="Download all your saved notes">⇩ Notes</button>

          <button class="btn" id="revealBtn" title="Reveal all hidden answers">Reveal</button>
        </div>

        <span id="matchStatus" style="font-size:12px;color:var(--muted)"></span><span class="reading-mode-note desktop-only"><kbd>C</kbd> cards · <kbd>E</kbd> hide English · <kbd>U</kbd> hide ئۇيغۇرچە · <kbd>L</kbd> focus</span>

<script>
const LESSONS = [{"id": "intro", "number": "Intro", "domain": "0", "domain_en": "Course Introduction", "domain_ug": "كۇرس تونۇشتۇرۇشى", "english": "(upbeat music) - Greetings, IT enthusiasts. Certification Synergy has another IT training course ready and waiting for you. Whether you are continuing with us after moving on from our CompTIA Tech+ training, or you are discovering us for the first time, welcome to Certification Synergy.\n\nBy clicking on this video, you have opened the door to our CompTIA A+ Core 1 Complete Training Course. And guess what? It's going to cost you absolutely nothing.\n\nThat's right. This full length course is 100% free. No hidden fees, no additional content charges, just pure, concentrated knowledge tailored to teach you everything you need to know in order to pass the CompTIA.\n\nA+ Core 1 Certification Exam. With that said, we are excited that you have chosen us as your guide while you prepare for the CompTIA. A+ Core 1 Certification Exam, and we appreciate the opportunity to share our expertise with you.\n\nAnd just once more, in case you didn't believe me the first time, this complete training course is a free, self-paced learning resource here for everyone's benefit. So what makes Certification Synergy the best IT training in town? Easy.\n\nBesides our strategic and orderly presentation of exam topics, we make learning feel like a walk in the park. You can expect to learn from vivid, comprehensible video segments, all seasoned with a dash of humor to keep the experience lively. This course isn't just a learning pathway.\n\nIt's a guided experience. If you are still listening, it is now time to get down to business and discuss what this certification is all about. Now we will explore what makes an ideal candidate for the CompTIA, A+ Certification, and this training course.\n\nThis certification is for entry-level problem solvers and innovative thinkers. If you have a solid grasp of IT basics, presumably from the CompTIA, Tech+ Certification, and a zest for turning technological puzzles into triumphs, this is your call to action. The A+ journey welcomes those who are ready and willing to bridge the gap between users and the magic of tech.\n\nWhether you're dreaming of being the tech wizard everyone relies on, or you envision a future crafting cutting edge solutions, the CompTIA, A+ Certification is the logical next step following the foundational Tech+ Certification. So how do you become CompTIA, A+ Certified? It is important to know that this widely recognized credential requires you to successfully pass two separate exams, known as the Core 1 and the Core 2 exams.\n\nEach of these exams dives into distinct yet complimentary domains of IT knowledge. Core 1 focuses on the essentials of hardware and networking, while Core 2 dives deeper into operating systems, security, and operational procedures. Together, these exams validate the dual spectrum of practical and theoretical expertise that is essential for entry-level IT professionals.\n\nAchieving a passing score on both exams is a necessary component to obtaining the CompTIA, A+ Certification. As for this course, I will be covering every topic needed to pass the Core 1 part of this two-headed certification beast. Taking a step back, let's understand the overall path to IT foundational mastery.\n\nIf you are here, ideally you have earned your CompTIA, Tech+ Certification, or you have at least acquired comparable foundational IT skills, priming you for this A+ Core 1 course. As your guide and educator for this leg of the journey, I will help you build upon your already strong foundational knowledge, equipping you with the expertise needed to tackle and succeed in subsequent certifications, such as the CompTIA, Network+, and the CompTIA, Security+. This course is designed to be a stepping stone, helping you to grow while progressively expanding on your IT capabilities.\n\nNext, you need to know what IT concepts will be taught in this course. The CompTIA, A+, Core 1 Certification exam focuses on the essential IT skills and knowledge needed to complete tasks commonly performed by entry-level IT professionals. To pass, you will need to have the knowledge and skills required to understand mobile devices, basic networking, computing hardware, virtualization, and cloud computing.\n\nAdditionally, this exam will assess your knowledge of troubleshooting scenarios related to these topics. Moving on with our introduction, we come to the exam details. The current version of the CompTIA A+ Core 1 exam, officially known as 220-1201, was released on March of 2025.\n\nThis version reflects the most up-to-date expectations for entry-level IT professionals, so everything you'll be learning in this course is aligned with the skills the industry values today. When you sit for the exam, you will be presented with up to 90 multiple choice questions, along with a few performance-based questions lovingly referred to as PBQs. You will have a total of 90 minutes to complete the test, which means time management will be important.\n\nThe passing score is 675, and the exam is scored on a scale that goes all the way up to 900. Now, the scoring system for the CompTIA A+ Core 1 exam might seem a little confusing at first, especially since it's based on a scale that goes up to 900. So, to make things clearer, here is a helpful breakdown we use at Certification Synergy.\n\nIf your score falls below 500, it simply means you need a bit more time with the material, and that's okay. Everyone starts somewhere, and progress is part of the process. If you score between 500 and 674, you're getting really close.\n\nA few more focus study sessions, and you'll be ready to go. If you score between 675 and 749, congratulations. That means you've officially passed your CompTIA A+ Core 1 exam.\n\nIf you land in the 750 to 799 range, it shows that you've mastered most of the material and really know your stuff. And if you score 800 or higher, well, you didn't just pass. You crushed it.\n\nAnd finally, if you happen to earn a perfect 900, contact us immediately, we want to hire you. Just kidding, but in all seriousness, be proud. Even seasoned IT professionals rarely achieve a perfect score.\n\nNext, here is something every test taker should know, and trust me, it's a game changer. When it comes to preparing for your A+ Core 1 exam, the CompTIA exam objectives are your absolute best friend. This document is not just a general overview, it's a detailed guide that outlines everything you need to know before exam day.\n\nIt breaks down how many questions to expect, what types of questions you'll see, like multiple choice, and most importantly, the exact topics you're expected to understand. Think of it like your official study roadmap. It tells you what to focus on, how the content is organized, and where to spend your time.\n\nIt's almost like having a cheat sheet, but completely legal because it comes straight from CompTIA themselves. Many students skip over this resource, but those who take the time to review it carefully usually feel much more confident walking into the exam. So don't treat it like optional reading, treat it like your secret weapon for passing.\n\nAccording to the exam objectives I just mentioned, the A+ Core 1 exam is structured around five core domains, each representing a major area of knowledge that you'll need to understand. These domains aren't just random categories. They help shape the exam itself.\n\nEach one is assigned a specific percentage, which tells you how much of the exam is focused on that area. For example, mobile devices makes up 13% of the A+ Core 1 exam. Next, we have networking, which makes up 23%.\n\nThen there is hardware, which makes up 25%. Virtualization and cloud computing account for 11%. And finally, we have hardware and network troubleshooting, which is the largest domain at 28%.\n\nTogether, these five domains give you a complete picture of what to expect, and knowing how they're weighted can help you study smarter, not harder. Once you're familiar with the 5A+ Core 1 exam domains, the next step is to understand how each domain is organized. Every domain is broken down into exam objectives, and these objectives outline the specific knowledge and skills you're expected to master.\n\nThink of the domains as chapters and the objectives as the lessons inside each chapter. Let's look at domain one as an example. This domain is labeled mobile devices, and it kicks off with objective 1.1.\n\nGiven a scenario, monitor mobile device hardware and use appropriate replacement techniques. Within this objective, we have a series of key ideas or topics. Now, if any of these topics feel unfamiliar, don't worry.\n\nThat's exactly why this course exists. We will take our time walking through each topic in a way that's clear, approachable, and focused on your success. So why are we putting so much emphasis on the exam objectives before getting into the technical topics?\n\nBecause they truly matter. They're one of the most valuable tools you have when preparing for the CompTIA A+ Core 1 exam. While they're often overlooked, the exam objectives provide the clearest and most direct path to success.\n\nThey outline exactly what you need to know, so you're not wasting time guessing what might be on the test. You can use them to guide your study as you move through the course, and once you've finished, come back to them as a final checklist. A last minute review of the objectives can help you focus your thoughts and spot any weak areas before test day.\n\nTo help you get started, you can download the official exam objectives using the link we've provided in the video description below. Now, here's how to get the most out of this course. Watch each video segment at your own pace.\n\nPause when you need to. Rewind if something doesn't quite click the first time, and feel free to revisit any topic as many times as it takes to feel confident. This course is here for you whenever and however you need it.\n\nAnd while you're here, go ahead and hit that subscribe button. That way, you'll always know where to find us, and you'll stay up to date with all the free training content we're constantly adding. Countless learners, just like you have already used certification synergy to kickstart their IT careers.\n\nAnd now, it's your turn. You've taken the first step, so let's dive into the first lesson and get you certified.", "uyghur": "(شوخ مۇزىكا)\n\n- سالام، IT ھەۋەسكارلىرى!\nCertification Synergy سىلەر ئۈچۈن يەنە بىر IT تەربىيەلەش كۇرسىنى تەييارلاپ قويدى.\nمەيلى سىز CompTIA Tech+ تەربىيىسىنى تاماملاپ بىز بىلەن داۋاملىق ئۆگىنىۋاتقان بولۇڭ، ياكى بىزنى تۇنجى قېتىم بايقاۋاتقان بولۇڭ، Certification Synergy غا خۇش كەلدىڭىز.\n\nبۇ ۋىدېيونى چەككەن ۋاقتىڭىزدا، CompTIA A+ Core 1 تولۇق تەربىيەلەش كۇرسىنىڭ ئىشىكىنى ئاچتىڭىز. ئەڭ ياخشى يېرى نېمە دەمسىز؟ بۇ سىزگە پۈتۈنلەي ھەقسىز. توغرا ئاڭلىدىڭىز: بۇ تولۇق كۇرس 100% ھەقسىز. يوشۇرۇن ھەق يوق، قوشۇمچە مەزمۇن ھەققى يوق؛ پەقەت CompTIA A+ Core 1 گۇۋاھنامە ئىمتىھانىدىن ئۆتۈش ئۈچۈن بىلىشىڭىز كېرەك بولغان نەرسىلەرنى ئۆگىتىشكە ماسلاشتۇرۇلغان ساپ ۋە مەركەزلەشكەن بىلىم بار.\n\nCompTIA A+ Core 1 ئىمتىھانىغا تەييارلىنىش يولىڭىزدا بىزنى يېتەكچى قىلىپ تاللىغانلىقىڭىزدىن خۇشالمىز، ھەمدە تەجرىبىمىزنى سىلەر بىلەن ئورتاقلىشىش پۇرسىتىگە ئېرىشكەنلىكىمىزدىن مىننەتدارمىز.\n\nيەنە بىر قېتىم تەكىتلەپ قويايلى: بۇ تولۇق تەربىيەلەش كۇرسى ھەقسىز، ئۆز سۈرئىتىڭىز بىلەن ئۆگىنىدىغان، ھەممە ئادەم پايدىلىنالايدىغان ئۆگىنىش مەنبەسى.\n\nئۇنداقتا Certification Synergy نى ياخشى IT تەربىيەلەش مەنبەسى قىلىدىغان نەرسە نېمە؟ جاۋاب ئاسان. ئىمتىھان تېمىلىرىنى پىلانلىق ۋە تەرتىپلىك بايان قىلىشتىن باشقا، بىز ئۆگىنىشنى ئاسان ۋە قىزىقارلىق قىلىشقا تىرىشىمىز. سىز روشەن، چۈشىنىشلىك ۋىدېيو بۆلەكلىرىدىن ئۆگىنىسىز، ئارىلىقتا ئازراق يۇمۇر قوشۇلۇپ، ئۆگىنىش تەجرىبىسى جانلىق ساقلىنىدۇ.\n\nبۇ كۇرس پەقەت ئۆگىنىش يولىلا ئەمەس، بەلكى قەدەممۇ-قەدەم يېتەكلەنگەن بىر تەجرىبە. ئەمدى بۇ گۇۋاھنامىنىڭ زادى نېمە ئىكەنلىكىگە كىرىشەيلى.\n\n### CompTIA A+ كىمگە ماس كېلىدۇ؟\n\nCompTIA A+ گۇۋاھنامىسى ۋە بۇ تەربىيەلەش كۇرسى كىرىش دەرىجىسىدىكى مەسىلە ھەل قىلغۇچىلار ۋە يېڭىلىق ياراتقۇچى تەپەككۇر ئىگىلىرىگە ماس كېلىدۇ. ئەگەر سىزدە IT ئاساسلىرى توغرىسىدا مۇستەھكەم چۈشەنچە بولسا—مەسىلەن CompTIA Tech+ دەرىجىسىدىكى بىلىم—ۋە تېخنىكىلىق مەسىلىلەرنى ھەل قىلىشقا قىزىقىدىغان بولسىڭىز، بۇ سىز ئۈچۈن كېيىنكى قەدەم بولالايدۇ.\n\nA+ يولى ئىشلەتكۈچىلەر بىلەن تېخنىكا ئارىسىدىكى بوشلۇقنى تولدۇرۇشقا تەييار كىشىلەرنى قارشى ئالىدۇ. مەيلى باشقىلار ھەر دائىم تايىنىدىغان IT قوللاش مۇتەخەسسىسى بولۇشنى ئارزۇ قىلىڭ، ياكى كەلگۈسىدە ئىلغار تېخنىكىلىق ھەل قىلىش چارىلىرىنى يارىتىشنى خالاڭ، CompTIA A+ گۇۋاھنامىسى ئاساسىي Tech+ بىلىمىدىن كېيىنكى لوگىكىلىق قەدەم ھېسابلىنىدۇ.\n\n### CompTIA A+ گۇۋاھنامىسىنى قانداق ئالىسىز؟\n\nCompTIA A+ گۇۋاھنامىسىگە ئېرىشىش ئۈچۈن ئىككى ئايرىم ئىمتىھاندىن مۇۋەپپەقىيەتلىك ئۆتۈشىڭىز كېرەك: Core 1 ۋە Core 2. بۇ ئىككى ئىمتىھان IT بىلىمىنىڭ بىر-بىرىنى تولۇقلايدىغان، ئەمما ئوخشىمىغان ساھەلىرىنى سىنايدۇ.\n\nCore 1 ئاساسلىقى قاتتىق دېتال (hardware) ۋە تور (networking) ئاساسلىرىغا مەركەزلىشىدۇ. Core 2 بولسا مەشغۇلات سىستېمىلىرى (operating systems)، بىخەتەرلىك (security) ۋە مەشغۇلات تەرتىپلىرى (operational procedures) نى تېخىمۇ چوڭقۇر قاپلايدۇ. بۇ ئىككى ئىمتىھان بىرلىكتە كىرىش دەرىجىسىدىكى IT كەسپىي خادىملىرىغا كېرەك بولغان ئەمەلىي ۋە نەزەرىي بىلىمنى ئىسپاتلايدۇ.\n\nCompTIA A+ گۇۋاھنامىسىنى ئېلىش ئۈچۈن ھەر ئىككى ئىمتىھاندىن ئۆتۈش شەرت. بۇ كۇرستا Core 1 قىسمىدىن ئۆتۈش ئۈچۈن كېرەك بولغان بارلىق تېمىلار قاپلىنىدۇ.\n\n### IT ئاساسىي بىلىم يولى\n\nئەگەر بۇ يەرگە كەلگەن بولسىڭىز، ئەڭ ياخشىسى CompTIA Tech+ گۇۋاھنامىسىنى ئالغان ياكى شۇنىڭغا تەڭ دەرىجىدىكى IT ئاساسىي بىلىمىڭىز بار دەپ قارىلىدۇ. بۇ بىلىم سىزنى A+ Core 1 كۇرسىغا تەييارلايدۇ.\n\nبۇ باسقۇچتا بىز سىزنىڭ بار بولغان ئاساسىي بىلىمىڭىز ئۈستىگە قۇرۇپ، كېيىنكى CompTIA Network+ ۋە CompTIA Security+ قاتارلىق گۇۋاھنامىلەرگە تەييارلىق قىلىشقا ياردەم بېرىمىز. بۇ كۇرس IT ئىقتىدارىڭىزنى تەدرىجىي كېڭەيتىدىغان بىر پەلەمپەي سۈپىتىدە لايىھەلەنگەن.\n\n### Core 1 دە نېمىلەر ئۆگىنىلىدۇ؟\n\nCompTIA A+ Core 1 گۇۋاھنامە ئىمتىھانى كىرىش دەرىجىسىدىكى IT خادىملىرى كۈندىلىك خىزمەتتە قىلىدىغان ۋەزىپىلەرگە كېرەك بولغان ئاساسىي IT ماھارەت ۋە بىلىملەرگە مەركەزلىشىدۇ.\n\nئىمتىھاندىن ئۆتۈش ئۈچۈن تۆۋەندىكى تېمىلارنى چۈشىنىشىڭىز كېرەك:\n- كۆچمە ئۈسكۈنىلەر (mobile devices)\n- ئاساسىي تور بىلىمى (basic networking)\n- كومپيۇتېر قاتتىق دېتالى (computing hardware)\n- مەۋھۇملاشتۇرۇش (virtualization)\n- بۇلۇت ھېسابلاش (cloud computing)\n- يۇقىرىقى تېمىلارغا مۇناسىۋەتلىك مەسىلە ھەل قىلىش (troubleshooting)\n\n### ئىمتىھان تەپسىلاتى\n\nبۇ كۇرس بايان قىلغان CompTIA A+ Core 1 ئىمتىھانىنىڭ نەشرى 220-1201 بولۇپ، 2025-يىلى 3-ئايدا ئېلان قىلىنغان. بۇ نەشر كىرىش دەرىجىسىدىكى IT كەسپىي خادىملىرىدىن كۈتۈلىدىغان زامانىۋى ماھارەتلەرنى ئەكس ئەتتۈرىدۇ.\n\nئىمتىھاندا ئەڭ كۆپ بولغاندا 90 سوئال بولىدۇ. بۇلارنىڭ ئىچىدە كۆپ تاللاشلىق سوئاللار ۋە PBQ دەپ ئاتىلىدىغان Performance-Based Questions، يەنى ئەمەلىي ئىقتىدارغا ئاساسلانغان سوئاللار بار. ئىمتىھان ۋاقتى 90 مىنۇت، شۇڭا ۋاقىتنى ياخشى باشقۇرۇش مۇھىم.\n\nئۆتۈش نومۇرى 675، نومۇر دائىرىسى 900 گىچە.\n\nCertification Synergy نىڭ چۈشەندۈرۈشى بويىچە:\n- 500 دىن تۆۋەن: ماتېرىيالنى يەنە بىر ئاز كۆپرەك ئۆگىنىش كېرەك.\n- 500–674: ئۆتۈشكە بەك يېقىن؛ يەنە بىر نەچچە مەركەزلەشكەن ئۆگىنىش ۋاقتى كېرەك.\n- 675–749: تەبرىكلەيمىز، A+ Core 1 دىن رەسمىي ئۆتتىڭىز.\n- 750–799: ماتېرىيالنىڭ كۆپ قىسمىنى ناھايىتى ياخشى ئىگىلىگەنلىكىڭىزنى كۆرسىتىدۇ.\n- 800 ياكى ئۇنىڭدىن يۇقىرى: پەقەت ئۆتۈپلا قالماي، ئىنتايىن ياخشى نەتىجە قىلدىڭىز.\n- 900: مۇكەممەل نومۇر. (ۋىدېيودا يۇمۇر قىلىپ «بىزگە دەرھال ئالاقىلىشىڭ، سىزنى ئىشقا ئالماقچىمىز» دەيدۇ.) ئەمما راستىنى ئېيتقاندا، تەجرىبىلىك IT كەسپىي خادىملىرىمۇ 900 نومۇرنى ناھايىتى ئاز ئالىدۇ.\n\n### Exam Objectives — ئىمتىھان نىشانلىرى\n\nA+ Core 1 غا تەييارلىنىشتا CompTIA نىڭ رەسمىي Exam Objectives ھۆججىتى ئەڭ مۇھىم مەنبەلەرنىڭ بىرى. ئۇ پەقەت ئومۇمىي چۈشەندۈرۈش ئەمەس؛ ئىمتىھان كۈنىدىن بۇرۇن بىلىشىڭىز كېرەك بولغان نەرسىلەرنى تەپسىلىي كۆرسىتىدىغان يول خەرىتىسى.\n\nئۇنىڭدا:\n- قانچە سوئال بولۇشى مۇمكىنلىكى،\n- سوئال تۈرلىرى،\n- چۈشىنىشىڭىز تەلەپ قىلىنىدىغان ئېنىق تېمىلار،\n- مەزمۇننىڭ قانداق تەشكىللەنگەنلىكى\nكۆرسىتىلىدۇ.\n\nبۇنى رەسمىي ئۆگىنىش يول خەرىتىسى دەپ قاراشقا بولىدۇ. قايسى تېمىغا كۆپرەك ۋاقىت سەرپ قىلىش كېرەكلىكىنى بىلىشكە ياردەم بېرىدۇ. نۇرغۇن ئوقۇغۇچىلار بۇ ھۆججەتنى ئاتلاپ ئۆتىدۇ، ئەمما ئىنچىكە كۆرۈپ چىققانلار ئادەتتە ئىمتىھانغا تېخىمۇ ئىشەنچ بىلەن كىرىدۇ. شۇڭا ئۇنى ئىختىيارىي ئوقۇش ماتېرىيالى ئەمەس، بەلكى ئىمتىھاندىن ئۆتۈشتىكى مۇھىم قورال دەپ قاراڭ.\n\n### A+ Core 1 نىڭ بەش ئاساسلىق Domain ى\n\nرەسمىي Exam Objectives بويىچە A+ Core 1 بەش چوڭ ساھەگە (domain) بۆلۈنىدۇ:\n\n1. Mobile Devices — كۆچمە ئۈسكۈنىلەر: 13%\n2. Networking — تور: 23%\n3. Hardware — قاتتىق دېتال: 25%\n4. Virtualization and Cloud Computing — مەۋھۇملاشتۇرۇش ۋە بۇلۇت ھېسابلاش: 11%\n5. Hardware and Network Troubleshooting — قاتتىق دېتال ۋە تور مەسىلىلىرىنى ھەل قىلىش: 28%\n\nبۇ پىرسەنتلەر ھەر بىر ساھەنىڭ ئىمتىھاندا قانچىلىك ئېغىرلىققا ئىگە ئىكەنلىكىنى كۆرسىتىدۇ. بۇنى بىلىش «كۆپرەك» ئەمەس، «ئەقىللىقراق» ئۆگىنىشكە ياردەم بېرىدۇ.\n\nھەر بىر domain نىڭ ئىچىدە exam objective لار بار. Domain نى كىتابتىكى بىر باب دەپ قارىسىڭىز، objective لار شۇ باب ئىچىدىكى دەرسلەرگە ئوخشايدۇ.\n\nمەسىلەن، Domain 1 — Mobile Devices. ئۇ Objective 1.1 دىن باشلىنىدۇ:\n«بىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنە قاتتىق دېتالىنى كۆزىتىڭ ۋە مۇۋاپىق ئالماشتۇرۇش ئۇسۇلىنى ئىشلىتىڭ.»\n\nئەگەر بۇ تېمىلارنىڭ بەزىلىرى سىزگە ناتونۇش بولسا ئەنسىرىمەڭ. بۇ كۇرسنىڭ مەقسىتى شۇ تېمىلارنى ئېنىق، چۈشىنىشلىك ۋە ئىمتىھانغا ماس شەكىلدە قەدەممۇ-قەدەم ئۆگىتىش.\n\nنېمە ئۈچۈن تېخنىكىلىق تېمىلارغا كىرىشتىن بۇرۇن Exam Objectives قا بۇنچە ئەھمىيەت بېرىۋاتىمىز؟ چۈنكى ئۇلار سىزگە زادى نېمىلەرنى بىلىش كېرەكلىكىنى ئەڭ ئېنىق كۆرسىتىدۇ. شۇڭا «ئىمتىھاندا نېمە چىقىدۇ؟» دەپ پەرەز قىلىپ ۋاقىت ئىسراپ قىلمايسىز.\n\nكۇرس جەريانىدا ئۇلارنى ئۆگىنىش يېتەكچىسى قىلىپ ئىشلىتىڭ. كۇرسنى تاماملىغاندىن كېيىن بولسا، ئاخىرقى تەكشۈرۈش تىزىملىكى سۈپىتىدە قايتا كۆرۈڭ. ئىمتىھاندىن بۇرۇن Exam Objectives نى قايتا كۆرۈش ئاجىز تەرەپلىرىڭىزنى بايقاشقا ياردەم بېرىدۇ.\n\nرەسمىي Exam Objectives نى ۋىدېيو چۈشەندۈرۈشىدىكى ئۇلىنىش ئارقىلىق چۈشۈرگىلى بولىدۇ.\n\n### بۇ كۇرستىن ئەڭ ياخشى پايدىلىنىش\n\nھەر بىر ۋىدېيو بۆلىكىنى ئۆز سۈرئىتىڭىز بىلەن كۆرۈڭ. كېرەك بولسا توختىتىڭ، چۈشەنمىگەن يەرنى كەينىگە قايتۇرۇپ قايتا كۆرۈڭ، بىر تېمىغا ئىشەنچ ھاسىل قىلغۇچە قانچە قېتىم بولسا شۇنچە قېتىم قايتا كۆرۈشكە بولىدۇ. بۇ كۇرس سىزنىڭ ئېھتىياجىڭىزغا ماس ھالدا ئىشلىتىلىش ئۈچۈن تەييارلانغان.\n\nۋىدېيو قانىلىغا مۇشتەرى بولسىڭىز، Certification Synergy نىڭ يېڭى ھەقسىز تەربىيەلەش مەزمۇنلىرىنى تاپالايسىز. نۇرغۇن ئۆگەنگۈچىلەر بۇ مەنبەدىن پايدىلىنىپ IT كەسپىنى باشلىغان؛ ئەمدى نۆۋەت سىزدە.\n\nسىز بىرىنچى قەدەمنى باستىڭىز. ئەمدى تۇنجى دەرسكە كىرىپ، گۇۋاھنامە يولىنى باشلايلى."}, {"id": "1.1", "number": "1.1", "domain": "1", "domain_en": "Mobile Devices", "domain_ug": "كۆچمە ئۈسكۈنىلەر", "english": "Exam objective 1.1. Given a scenario, monitor mobile device hardware and use appropriate replacement techniques. Mobile device hardware.\n\nThe first topic up for the CompTIA A+ Core 1 certification exam is mobile device hardware and replacement techniques, which is why we are starting by defining the term mobile device. In IT, a mobile device is a portable, battery-powered computing gadget, such as a smartphone, tablet, or laptop, designed for ease of mobility. These devices are built to be used on the go and typically include wireless connectivity, along with features that support communication, web browsing, and application usage from just about anywhere.\n\nBecause mobile devices are portable and powerful, they are also constantly on the move, and that puts them at constant risk. They get dropped, overheat, spilled on, stuffed into backpacks, and charged with whatever cable happens to be closest. In this video segment, we are focusing specifically on mobile device hardware, how to monitor it for signs of failure, and how to determine when replacement is the appropriate solution.\n\nThis is not about guessing or swapping parts at random. It is about recognizing symptoms, understanding what those symptoms point to, and making smart, safe decisions exactly the way CompTIA expects you to do on the exam. While these portable devices allow us to perform many of the same tasks as a traditional desktop computer, their internal computing components are very different.\n\nUnlike the spacious interior of a desktop PC, mobile devices must fit everything into an extremely small and tightly packed space. Because of this, engineers design mobile device hardware with a strong focus on miniaturization, power efficiency, and heat management, all while still delivering usable performance. These design choices introduce unique challenges for IT professionals.\n\nComponents are often soldered directly to the motherboard, which limits upgrade options and makes individual part replacement more difficult. Limited airflow also increases the importance of proper heat management, and battery-powered operation requires careful handling to avoid safety risks. As a result, when hardware problems occur on mobile devices, the correct response is frequently replacement rather than repair.\n\nKeeping these constraints in mind will help you approach mobile device issues logically and choose the most appropriate solution, both on the exam and in real-world scenarios. With these design challenges in mind, the first component we need to talk about is also one of the most important, and potentially the most dangerous, the battery. Before you open a mobile device or begin any internal work, safety should always come first.\n\nAlways start by disconnecting the device from any external power source and make sure it is completely powered off. If the battery is removable, remove it before continuing. This single step helps prevent electrical shorts, protects internal components, and reduces the risk of personal injury.\n\nOn the exam, any scenario that involves opening a device should immediately trigger safe power handling in your thought process. Once safety is handled, we can move on to battery replacement. Not all mobile device batteries are designed the same way.\n\nSome are easy to remove, while others require careful disassembly because everything inside the device is tightly packed. This is where following manufacturer guidelines becomes critical. Common signs that a battery needs to be replaced include rapid battery drain, overheating while charging, unexpected shutdowns, or visible swelling.\n\nBattery swelling is especially serious because it can cause physical damage to the device and create a safety hazard. After replacement, proper battery disposal is just as important. Mobile device batteries should never be thrown into regular trash because of the chemicals they contain.\n\nInstead, they must be disposed of through approved recycling programs or according to local regulations. Another category of mobile device hardware covered in this exam objective is keyboards and individual keys or key caps. Because keyboards are used constantly, they are also one of the most common sources of user-reported problems.\n\nMany laptops use an integrated keyboard, meaning the keyboard is built directly into the device and is not designed to be removed or replaced as a separate component. This design helps keep devices thin and portable, but it also directly affects how keyboard issues are monitored and resolved. Monitoring keyboard problems begins by determining the scope of the issue.\n\nIn some cases, multiple keys may fail or the entire keyboard may become unresponsive. In other situations, the problem is limited to a single key. Keys that fail to register input, repeat characters, feel stuck, or behave differently than surrounding keys often point to a hardware-related issue.\n\nIn these cases, a visual inspection can sometimes reveal debris, residue, or corrosion that helps explain the behavior. When a problem is limited to a single key, the next step is to consider the least disruptive solution. After checking for debris or obstructions, replacing the key cap may restore normal operation without requiring deeper disassembly.\n\nThis approach is cost-effective and appropriate when the rest of the keyboard is functioning normally and it avoids unnecessary replacement of larger components. If keyboard issues extend beyond a single key or continue after basic fixes, the integrated nature of many keyboards becomes a deciding factor. Resolving broader keyboard problems may require replacing the entire keyboard assembly or, in some designs, the top case of the device.\n\nAnother important category of mobile device hardware is random access memory, commonly referred to as RAM. RAM plays a major role in overall system performance and how it is implemented varies depending on the type of mobile device. In laptops, RAM is typically installed using small outline dual in-line memory modules, often abbreviated as SODIM.\n\nAs the name suggests, SODIMs are more compact than the standard memory modules used in desktop computers which allows them to fit inside thinner laptop designs. They are also designed for lower power consumption, helping extend battery life. In many laptops, SODIM memory can be upgraded, making RAM one of the few components that can be replaced to improve performance.\n\nSmartphones and tablets handle RAM a bit differently. In these devices, RAM is commonly soldered directly to the motherboard rather than installed as a removable module. This design saves space and improves efficiency, but it also means the RAM is not user-upgradable.\n\nIncreasing memory capacity would require redesigning the motherboard itself, making RAM a fixed resource from the moment the device is manufactured. The next component we will cover is mobile device storage, which is where the operating system, applications, and user data are stored. In laptops, storage is typically provided by either a hard disk drive or a solid state drive, and understanding the differences between the two is important for both performance and replacement decisions.\n\nA hard disk drive, often referred to as an HDD, uses mechanical components to store and retrieve data. HDDs are generally more affordable and can offer larger storage capacities at a lower cost. However, because they contain moving parts, HDDs are slower, more fragile, and more susceptible to damage, especially in mobile devices that are frequently moved.\n\nA solid state drive, commonly referred to as an SSD, stores data using flash memory and has no moving parts. This design allows SSDs to provide much faster data access, improve durability and shock resistance, and lower power consumption compared to HDDs. In laptops, upgrading from an HDD to an SSD often results in a noticeable improvement in boot times, application loading, and overall responsiveness.\n\nThe final mobile device hardware component we will cover in this video segment is built-in cameras and microphones, which are commonly used for video calls, conferencing, and media capture, because these components are integrated directly into the device. Issues with cameras or microphones can be frustrating for users and sometimes difficult to isolate. Monitoring these components typically starts at the application level.\n\nA camera that is not detected, produces a black image, or works inconsistently across multiple applications may indicate a hardware issue. Physical damage to the camera lens or surrounding area can also impact functionality. Microphone problems often present as distorted audio, no input detected, or audio cutting in and out.\n\nIf these issues occur across multiple applications and settings, the likelihood of a hardware-related problem increases. Replacement considerations for cameras and microphones depend heavily on device design. In many laptops, tablets, and smartphones, these components are integrated into the display assembly or internal frame, making individual repair and replacement difficult.\n\nExam objective 1.1. Given a scenario, monitor mobile device hardware and use appropriate replacement techniques. Wireless cards.\n\nYou open a laptop, connect to Wi-Fi, pair a Bluetooth mouse, and maybe even tether to a mobile hotspot, all without plugging in a single cable. None of that works without one critical piece of hardware behind the scenes, the wireless network interface card. Wireless network interface cards, often called wireless NICs or wireless network adapters, are the hardware components that allow computers and other devices to connect to wireless networks when wired connections like ethernet cables and RJ45 connectors are not available.\n\nThese network interface cards are installed inside mobile devices and handle a wide range of wireless signals that keep users connected on the go. In laptops, how that wireless capability is delivered can vary. Some systems use onboard wireless NICs while others rely on a replaceable expansion card.\n\nOnboard wireless NICs are built directly into the motherboard and are not designed to be replaced individually. Wireless expansion cards, on the other hand, are separate components that can be installed, removed, and replaced if necessary. Many laptops use this expansion style design, allowing a single device to support multiple wireless card technologies.\n\nThose technologies typically include Bluetooth, Wi-Fi, and cellular connectivity. Bluetooth cards support short-range connections to peripherals like keyboards, mice, and speakers. Wireless local area network, or WLAN cards, allow devices to connect to nearby Wi-Fi networks while wireless wide area network, or WLAN cards, enables internet access over cellular networks.\n\nBecause all of this connectivity depends on a small internal card, wireless problems often show up in very noticeable ways. Symptoms may include weak signal strength, intermittent connectivity, or an inability to detect available networks. In some cases, the wireless card itself is not the issue.\n\nInstead, the problem lies with the antenna connections attached to it. Inside a laptop, antenna cables are carefully routed from the wireless card around internal components and up into the display assembly. From there, the antennas are typically positioned near the top of the screen, tucked behind the display trim bezel, where they can receive signals with minimal obstruction.\n\nThis routing is intentional and designed to reduce interference while maximizing signal strength. If these cables become loose, pinched, or routed incorrectly during a repair or installation, wireless performance can suffer even when the wireless card itself is functioning normally.\n\nExam objective 1.1. Given a scenario, monitor mobile device hardware and use appropriate replacement techniques. Physical privacy and security.\n\nThe security features of mobile devices, including laptops, often differ from those found on desktop systems. Because mobile devices are portable and frequently used outside of controlled environments, certain physical privacy and security features are more prominent. Two key examples covered in this objective are biometric authentication and near-field communication, often abbreviated as NFC.\n\nBiometric authentication uses physical characteristics, such as fingerprints or facial features, to verify a user's identity. Fingerprint readers are commonly found on laptops because they provide fast and convenient access without requiring complex passwords. These sensors can be used to unlock the device, authenticate purchases, or sign into secure services while ensuring that only authorized users can gain access.\n\nFrom a physical security standpoint, biometrics help protect devices that may be used in public or shared spaces. Near-field communication is another technology frequently associated with mobile device security. NFC allows devices to exchange data over very short distances, typically requiring close physical proximity.\n\nThis makes NFC useful for secure pairing, authentication, and data exchange with smartphones, tablets, badges, or payment systems. Because NFC operates at such short ranges, it helps reduce the risk of unauthorized access compared to longer-range wireless technologies.", "uyghur": "Exam Objective 1.1\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنە قاتتىق دېتالىنى كۆزىتىڭ ۋە مۇۋاپىق ئالماشتۇرۇش تېخنىكىسىنى ئىشلىتىڭ.\n\n## كۆچمە ئۈسكۈنە قاتتىق دېتالى (Mobile Device Hardware)\n\nCompTIA A+ Core 1 ئىمتىھانىدىكى بىرىنچى تېما كۆچمە ئۈسكۈنە قاتتىق دېتالى ۋە ئالماشتۇرۇش ئۇسۇللىرى. شۇڭا ئالدى بىلەن «mobile device» دېگەن ئاتالغۇنى ئېنىقلايمىز.\n\nIT ساھەسىدە كۆچمە ئۈسكۈنە—مەسىلەن ئەقلىي ئىقتىدارلىق تېلېفون، تاختا كومپيۇتېر (tablet) ياكى خاتىرە كومپيۇتېر (laptop)—ئېلىپ يۈرۈشكە قولايلىق، باتارېيە ئارقىلىق ئىشلەيدىغان ھېسابلاش ئۈسكۈنىسىدۇر. بۇ ئۈسكۈنىلەر يولدا ئىشلىتىشكە لايىھەلەنگەن بولۇپ، ئادەتتە سىمسىز ئۇلىنىش، ئالاقە، تور كۆرۈش ۋە ئەپ ئىشلىتىش ئىقتىدارلىرى بار.\n\nكۆچمە ئۈسكۈنىلەر ئېلىپ يۈرۈلىدىغان ۋە كۈچلۈك بولغاچقا، دائىم ھەرىكەتتە بولىدۇ؛ شۇڭا خەتەرگە كۆپرەك ئۇچرايدۇ. ئۇلار چۈشۈپ كېتىشى، قىزىپ كېتىشى، ئۈستىگە سۇ ياكى باشقا سۇيۇقلۇق تۆكۈلۈشى، سومكىغا قىستىلىشى، ياكى قولغا كەلگەن ھەرقانداق كابېل بىلەن زەرەتلىنىشى مۇمكىن.\n\nبۇ بۆلەكتە كۆچمە ئۈسكۈنە قاتتىق دېتالىغا، مەغلۇب بولۇش ئالامەتلىرىنى قانداق كۆزىتىشكە ۋە قاچان ئالماشتۇرۇشنىڭ مۇۋاپىق چارە ئىكەنلىكىنى قانداق بېكىتىشكە مەركەزلىشىمىز.\n\nبۇ زاپچاسلارنى خالىغانچە ئالماشتۇرۇپ سىناش ئەمەس. مەقسەت—ئالامەتلەرنى تونۇش، ئۇلارنىڭ قايسى مەسىلىگە ئىشارەت قىلىدىغانلىقىنى چۈشىنىش ۋە CompTIA ئىمتىھانىدا كۈتۈلىدىغان شەكىلدە ئەقىللىق، بىخەتەر قارار چىقىرىش.\n\nكۆچمە ئۈسكۈنىلەر ئۈستەل كومپيۇتېرى قىلغان نۇرغۇن ئىشلارنى قىلالىسىمۇ، ئۇلارنىڭ ئىچكى زاپچاسلىرى بەك پەرقلىق. ئۈستەل كومپيۇتېرىنىڭ ئىچى كەڭ، ئەمما كۆچمە ئۈسكۈنىدە ھەممە نەرسە ئىنتايىن كىچىك ۋە قىستاڭ بوشلۇققا سىغدۇرۇلۇشى كېرەك.\n\nشۇڭا ئىنژېنېرلار كۆچمە ئۈسكۈنە قاتتىق دېتالىنى لايىھەلەشتە ئۈچ نەرسىگە زور ئەھمىيەت بېرىدۇ:\n- كىچىكلىتىش (miniaturization)\n- توك ئۈنۈمى (power efficiency)\n- ئىسسىقلىق باشقۇرۇش (heat management)\n\nشۇنىڭ بىلەن بىر ۋاقىتتا، ئىشلىتىشكە يېتەرلىك ئۈنۈم (performance) نىمۇ ساقلاش كېرەك.\n\nبۇ لايىھەلەش تاللاشلىرى IT خادىملىرىغا ئۆزگىچە قىيىنچىلىق پەيدا قىلىدۇ. نۇرغۇن زاپچاسلار ئانا تاختىغا (motherboard) بىۋاسىتە لېھىملەنگەن (soldered) بولىدۇ. بۇ يېڭىلاش ئىمكانىيىتىنى چەكلەيدۇ ۋە يەككە زاپچاسنى ئالماشتۇرۇشنى قىيىنلاشتۇرىدۇ.\n\nھاۋا ئېقىمى چەكلىك بولغاچقا ئىسسىقلىقنى توغرا باشقۇرۇش تېخىمۇ مۇھىم. باتارېيە بىلەن ئىشلەيدىغان ئۈسكۈنىلەرنى بىخەتەرلىك خەۋپىدىن ساقلىنىپ بىر تەرەپ قىلىشمۇ زۆرۈر.\n\nشۇڭا كۆچمە ئۈسكۈنىدە قاتتىق دېتال مەسىلىسى كۆرۈلگەندە، توغرا جاۋاب كۆپىنچە «رېمونت قىلىش» ئەمەس، «ئالماشتۇرۇش» بولىدۇ. بۇ چەكلىمىلەرنى ئەستە تۇتۇش سىزگە ئىمتىھاندا ۋە ئەمەلىي خىزمەتتە مەسىلىگە لوگىكىلىق يېقىنلىشىشقا ياردەم بېرىدۇ.\n\n### باتارېيە (Battery)\n\nكۆچمە ئۈسكۈنىدىكى ئەڭ مۇھىم، شۇنداقلا خاتا بىر تەرەپ قىلىنسا ئەڭ خەتەرلىك زاپچاسلارنىڭ بىرى—باتارېيە.\n\nكۆچمە ئۈسكۈنىنى ئېچىش ياكى ئىچكى زاپچاسلىرى ئۈستىدە ئىشلەشتىن بۇرۇن بىخەتەرلىكنى بىرىنچى ئورۇنغا قويۇڭ:\n1. بارلىق سىرتقى توك مەنبەسىدىن ئۈزۈڭ.\n2. ئۈسكۈنىنىڭ پۈتۈنلەي ئۆچۈرۈلگەنلىكىنى جەزملەشتۈرۈڭ.\n3. ئەگەر باتارېيە ئېلىۋېتىشكە بولىدىغان بولسا، ئىچكى ئىشنى باشلاشتىن بۇرۇن ئۇنى ئېلىۋېتىڭ.\n\nبۇ بىرلا قەدەم ئېلېكتر قىسقا تۇتۇش (electrical short) خەۋپىنى ئازايتىدۇ، ئىچكى زاپچاسلارنى قوغدايدۇ ۋە ئادەم يارىلىنىش خەۋپىنى تۆۋەنلىتىدۇ.\n\nئىمتىھاندا «ئۈسكۈنىنى ئېچىش» تەلەپ قىلىنغان ھەر قانداق scenario نى كۆرگەن ۋاقتىڭىزدا، كاللىڭىزغا بىرىنچى بولۇپ بىخەتەر توك بىر تەرەپ قىلىش كېلىشى كېرەك.\n\nبىخەتەرلىك تەييارلىقىدىن كېيىن باتارېيە ئالماشتۇرۇشقا ئۆتكىلى بولىدۇ. بارلىق كۆچمە ئۈسكۈنە باتارېيەلىرى بىر خىل لايىھەلەنمىگەن. بەزىلىرىنى ئاسان چىقارغىلى بولىدۇ، بەزىلىرى بولسا ئۈسكۈنە ئىچى بەك قىستاڭ بولغاچقا ئېھتىياتچانلىق بىلەن چۇۋۇشنى تەلەپ قىلىدۇ. بۇ يەردە ئىشلەپچىقارغۇچىنىڭ كۆرسەتمىسىگە ئەگىشىش ئىنتايىن مۇھىم.\n\nباتارېيە ئالماشتۇرۇش كېرەكلىكىنى كۆرسىتىدىغان كۆپ ئۇچرايدىغان ئالامەتلەر:\n- باتارېيەنىڭ ناھايىتى تېز تۈگەپ كېتىشى\n- زەرەتلەۋاتقاندا بەك قىزىپ كېتىشى\n- ئۈسكۈنىنىڭ ئويلىمىغان يەردىن ئۆچۈپ قېلىشى\n- باتارېيەنىڭ كۆرۈنەرلىك ئىششىپ كېتىشى (swelling)\n\nباتارېيە ئىششىشى ئالاھىدە ئېغىر مەسىلە. ئۇ ئۈسكۈنىگە جىسمانىي زىيان يەتكۈزۈشى ۋە بىخەتەرلىك خەۋپى پەيدا قىلىشى مۇمكىن.\n\nباتارېيە ئالماشتۇرۇلغاندىن كېيىن، كونا باتارېيەنى توغرا بىر تەرەپ قىلىشمۇ شۇنچە مۇھىم. كۆچمە ئۈسكۈنە باتارېيەلىرىنى ئىچىدىكى خىمىيىلىك ماددىلار سەۋەبىدىن ئادەتتىكى ئەخلەتكە تاشلاشقا بولمايدۇ. تەستىقلانغان قايتا پىششىقلاش پروگراممىسى (recycling program) ياكى يەرلىك قائىدە بويىچە بىر تەرەپ قىلىش كېرەك.\n\n### كۇنۇپكا تاختىسى، يەككە كۇنۇپكا ۋە Keycap\n\nبۇ objective قاپلايدىغان يەنە بىر قاتتىق دېتال تۈرى—كۇنۇپكا تاختىسى (keyboard) ۋە يەككە كۇنۇپكا/keycap لار.\n\nكۇنۇپكا تاختىسى دائىم ئىشلىتىلگەچكە، ئىشلەتكۈچى دوكلات قىلىدىغان مەسىلىلەرنىڭ ئەڭ كۆپ مەنبەلىرىدىن بىرى.\n\nنۇرغۇن خاتىرە كومپيۇتېرلاردا integrated keyboard، يەنى ئۈسكۈنىگە بىۋاسىتە بىرلەشتۈرۈلگەن كۇنۇپكا تاختىسى بولىدۇ. ئۇ ئايرىم زاپچاس سۈپىتىدە ئاسان چىقىرىپ ياكى ئالماشتۇرۇپ قويۇش ئۈچۈن لايىھەلەنمىگەن. بۇ لايىھە خاتىرە كومپيۇتېرنى نېپىز ۋە ئېلىپ يۈرۈشكە قولايلىق قىلىدۇ، ئەمما كۇنۇپكا تاختىسى مەسىلىسىنى ھەل قىلىش ئۇسۇلىغا بىۋاسىتە تەسىر قىلىدۇ.\n\nمەسىلىنى تەكشۈرۈش ئالدى بىلەن دائىرىسىنى بېكىتىشتىن باشلىنىدۇ:\n- بىر نەچچە كۇنۇپكا ئىشلەمەمدۇ؟\n- پۈتۈن كۇنۇپكا تاختىسى جاۋاب بەرمەمدۇ؟\n- ياكى پەقەت بىرلا كۇنۇپكا مەسىلىلىك مۇ؟\n\nكۇنۇپكا باسقاندا ھەرپ چىقماسلىقى، بىر ھەرپنى قايتا-قايتا يېزىشى، قېتىپ قالغاندەك ھېس قىلىنىشى ياكى يېنىدىكى كۇنۇپكىلاردىن پەرقلىق ھەرىكەت قىلىشى قاتتىق دېتال مەسىلىسىگە ئىشارەت قىلىشى مۇمكىن.\n\nكۆز بىلەن تەكشۈرگەندە چاڭ-توزان، قالدۇق، سۇيۇقلۇق ئىزى ياكى چىرىش (corrosion) بايقىلىشى مۇمكىن.\n\nئەگەر مەسىلە پەقەت بىر كۇنۇپكىدا بولسا، ئەڭ ئاز چۇۋۇش تەلەپ قىلىدىغان چارىنى تاللاڭ. ئالدى بىلەن توسالغۇ ياكى كىر بار-يوقلۇقىنى تەكشۈرۈڭ. ئاندىن keycap نى ئالماشتۇرۇش ئارقىلىق نورمال خىزمەتنى ئەسلىگە كەلتۈرگىلى بولۇشى مۇمكىن. ئەگەر باشقا كۇنۇپكىلار نورمال ئىشلىسە، بۇ ئەرزان ۋە مۇۋاپىق چارە بولۇپ، چوڭ زاپچاسنى بىھۇدە ئالماشتۇرۇشتىن ساقلايدۇ.\n\nئەگەر مەسىلە بىر كۇنۇپكىدىن كەڭرەك بولسا ياكى ئاددىي چارىلەردىن كېيىنمۇ داۋاملاشسا، integrated keyboard لايىھىسى قارارغا تەسىر قىلىدۇ. بۇ خىل ئەھۋالدا پۈتۈن keyboard assembly نى، بەزى مودېللاردا بولسا ئۈسكۈنىنىڭ top case قىسمىنى ئالماشتۇرۇشقا توغرا كېلىشى مۇمكىن.\n\n### RAM — Random Access Memory\n\nكۆچمە ئۈسكۈنە قاتتىق دېتالىدىكى يەنە بىر مۇھىم تۈر—RAM (Random Access Memory، تاسادىپىي زىيارەت ئىچكى ساقلىغۇچ). RAM سىستېمىنىڭ ئومۇمىي ئىقتىدارىدا مۇھىم رول ئوينايدۇ، ئۇنىڭ قانداق ئورنىتىلىشى ئۈسكۈنە تۈرىگە قاراپ پەرقلىنىدۇ.\n\nخاتىرە كومپيۇتېرلاردا RAM ئادەتتە SODIMM (Small Outline Dual In-line Memory Module) شەكلىدە ئورنىتىلىدۇ. SODIMM ئۈستەل كومپيۇتېرىدا ئىشلىتىلىدىغان ئۆلچەملىك RAM مودۇلىدىن كىچىكرەك، شۇڭا نېپىز laptop لايىھىسىگە ماس كېلىدۇ. ئۇلار تۆۋەنرەك توك سەرپىياتىغا لايىھەلەنگەن بولۇپ، باتارېيە ۋاقتىنى ئۇزارتىشقا ياردەم بېرىدۇ.\n\nنۇرغۇن laptop لاردا SODIMM RAM نى يېڭىلاش ياكى ئالماشتۇرۇشقا بولىدۇ. شۇڭا RAM كۆچمە كومپيۇتېردا performance نى ياخشىلاش ئۈچۈن ئالماشتۇرغىلى بولىدىغان ئاز ساندىكى زاپچاسلارنىڭ بىرى.\n\nSmartphone ۋە tablet لاردا RAM باشقىچە بولىدۇ. بۇ ئۈسكۈنىلەردە RAM ئادەتتە removable module ئەمەس، بەلكى motherboard قا بىۋاسىتە لېھىملەنگەن. بۇ بوشلۇق تېجەيدۇ ۋە ئۈنۈمنى ياخشىلايدۇ، ئەمما RAM نى ئىشلەتكۈچى ئۆزى يېڭىلىيالمايدۇ. Memory capacity نى كۆپەيتىش motherboard نى قايتا لايىھەلەشنى تەلەپ قىلىدۇ؛ شۇڭا RAM ئۈسكۈنە ئىشلەپچىقىرىلغان ۋاقىتتىن باشلاپ مۇقىم بايلىق ھېسابلىنىدۇ.\n\n### كۆچمە ئۈسكۈنە ساقلىغۇچىسى (Storage)\n\nStorage مەشغۇلات سىستېمىسى، ئەپلەر ۋە ئىشلەتكۈچى سانلىق مەلۇماتلىرى ساقلىنىدىغان جاي.\n\nLaptop لاردا ئادەتتە ئىككى خىل ساقلىغۇچ ئۇچرايدۇ:\n- HDD (Hard Disk Drive)\n- SSD (Solid State Drive)\n\nHDD مېخانىكىلىق، ھەرىكەت قىلىدىغان زاپچاسلار ئارقىلىق سانلىق مەلۇمات ساقلايدۇ ۋە ئوقۇيدۇ. ئادەتتە باھاسى ئەرزانراق، تۆۋەن باھادا تېخىمۇ چوڭ سىغىم بېرەلەيدۇ. ئەمما ھەرىكەتچان زاپچاسلىرى بولغاچقا، SSD غا قارىغاندا ئاستا، نازۇك ۋە سوقۇلۇشتىن ئاسان زىيان كۆرىدۇ—بولۇپمۇ دائىم يۆتكەپ يۈرۈلىدىغان mobile device تا.\n\nSSD flash memory ئارقىلىق سانلىق مەلۇمات ساقلايدۇ، ئىچىدە ھەرىكەتچان مېخانىكىلىق زاپچاس يوق. شۇڭا ئۇ:\n- تېخىمۇ تېز سانلىق مەلۇمات زىيارىتى،\n- تېخىمۇ ياخشى چىدامچانلىق ۋە سوقۇلۇشقا قارشى تۇرۇش،\n- HDD غا قارىغاندا تۆۋەنرەك توك سەرپىياتى\nتەمىنلەيدۇ.\n\nLaptop نى HDD دىن SSD غا يېڭىلاش ئادەتتە boot ۋاقتى، application loading ۋە ئومۇمىي responsiveness نى روشەن ياخشىلايدۇ.\n\n### ئىچىگە ئورنىتىلغان كامېرا ۋە مىكروفون\n\nبۇ بۆلەكتە قاپلىنىدىغان ئاخىرقى mobile-device hardware—built-in camera ۋە microphone. ئۇلار video call، conference ۋە media capture ئۈچۈن كۆپ ئىشلىتىلىدۇ ھەمدە ئۈسكۈنىنىڭ ئىچىگە بىۋاسىتە بىرلەشتۈرۈلگەن بولىدۇ.\n\nكامېرا ياكى مىكروفون مەسىلىسى ئىشلەتكۈچىلەرنى بىزار قىلىشى ۋە مەنبەسىنى ئايرىپ تېپىشنى قىيىنلاشتۇرۇشى مۇمكىن.\n\nكامېرانى تەكشۈرۈش ئادەتتە application level دىن باشلىنىدۇ. تۆۋەندىكى ئالامەتلەر قاتتىق دېتال مەسىلىسىگە ئىشارەت قىلىشى مۇمكىن:\n- كامېرا بايقالمىسا\n- قارا رەسىم كۆرسەتسە\n- بىر نەچچە ئەپتە قالايمىقان ئىشلەسە\n- كامېرا lens ياكى ئەتراپىدا جىسمانىي زىيان بولسا\n\nمىكروفون مەسىلىلىرى كۆپىنچە:\n- ئاۋازنىڭ بۇزۇلۇپ چىقىشى\n- input بايقالمىشى\n- ئاۋازنىڭ ئۈزۈلۈپ-ئۈزۈلۈپ كېلىشى\nشەكلىدە كۆرۈلىدۇ.\n\nئەگەر بۇ مەسىلىلەر بىر نەچچە application ۋە setting دا ئوخشاش كۆرۈلسە، قاتتىق دېتال مەسىلىسى بولۇش ئېھتىماللىقى يۇقىرىلايدۇ.\n\nكامېرا ۋە مىكروفوننى ئالماشتۇرۇش ئۇسۇلى ئۈسكۈنە لايىھىسىگە زور دەرىجىدە باغلىق. نۇرغۇن laptop، tablet ۋە smartphone لاردا بۇ زاپچاسلار display assembly ياكى ئىچكى frame غا بىرلەشتۈرۈلگەن، شۇڭا يەككە رېمونت ياكى ئالماشتۇرۇش قىيىن بولىدۇ.\n\nExam Objective 1.1\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنە قاتتىق دېتالىنى كۆزىتىڭ ۋە مۇۋاپىق ئالماشتۇرۇش تېخنىكىسىنى ئىشلىتىڭ.\n\n## سىمسىز كارتا (Wireless Cards)\n\nسىز laptop نى ئاچىسىز، Wi-Fi غا ئۇلىنىسىز، Bluetooth mouse نى جۈپلەيسىز، بەزىدە mobile hotspot قا tether قىلىسىز—بۇلارنىڭ ھەممىسىنى بىر تال سىم ئۇلىماي قىلىسىز. بۇ ئىقتىدارلارنىڭ ئارقىسىدا مۇھىم بىر قاتتىق دېتال بار: wireless network interface card.\n\nWireless network interface card ئادەتتە wireless NIC ياكى wireless network adapter دەپمۇ ئاتىلىدۇ. ئۇ كومپيۇتېر ۋە باشقا ئۈسكۈنىلەرنىڭ Ethernet cable ياكى RJ45 ئۇلىغۇچ ئىشلىتەلمىگەن ۋاقىتتا سىمسىز تورغا ئۇلىنىشىنى تەمىنلەيدىغان قاتتىق دېتال زاپچىسى.\n\nبۇ network interface card لار mobile device نىڭ ئىچىگە ئورنىتىلىپ، ئىشلەتكۈچىنى يول ئۈستىدىمۇ ئۇلانغان ھالەتتە ساقلايدىغان ھەر خىل سىمسىز سىگناللارنى بىر تەرەپ قىلىدۇ.\n\nLaptop تا سىمسىز ئىقتىدارنىڭ قانداق تەمىنلىنىشى پەرقلىق بولۇشى مۇمكىن:\n- Onboard wireless NIC: motherboard قا بىۋاسىتە بىرلەشتۈرۈلگەن، ئادەتتە ئايرىم ئالماشتۇرۇشقا لايىھەلەنمىگەن.\n- Wireless expansion card: ئايرىم زاپچاس؛ ئورنىتىش، چىقىرىش ۋە كېرەك بولسا ئالماشتۇرۇشقا بولىدۇ.\n\nنۇرغۇن laptop لار expansion-card لايىھىسىنى ئىشلىتىدۇ. بىر ئۈسكۈنىدە بىر نەچچە سىمسىز تېخنىكا قوللىنىلىشى مۇمكىن، ئادەتتە:\n- Bluetooth\n- Wi-Fi / WLAN\n- Cellular connectivity\n\nBluetooth card يېقىن ئارىلىقتىكى keyboard، mouse ۋە speaker قاتارلىق peripheral لار بىلەن ئۇلىنىدۇ.\n\nWLAN (Wireless Local Area Network) card يېقىن Wi-Fi تورىغا ئۇلىنىشقا ئىشلىتىلىدۇ.\n\nCellular/WWAN card بولسا ھۈجەيرىلىك تور ئارقىلىق Internet زىيارىتىنى تەمىنلەيدۇ.\n\nبۇ بارلىق ئۇلىنىشلار كىچىك بىر ئىچكى card قا تايانغاچقا، wireless مەسىلىلىرى ئادەتتە ئاسان سېزىلىدۇ. ئالامەتلەر:\n- سىگنال ئاجىزلىقى\n- ئۇلىنىشنىڭ ئارىلىقتا ئۈزۈلۈشى\n- بار بولغان تورلارنى بايقىيالماسلىق\n\nبەزىدە مەسىلە wireless card نىڭ ئۆزىدە ئەمەس، بەلكى ئۇنىڭغا ئۇلانغان antenna cable دا بولىدۇ.\n\nLaptop نىڭ ئىچىدە antenna cable لار wireless card تىن باشلىنىپ، ئىچكى زاپچاسلار ئارىسىدىن ئېھتىياتچانلىق بىلەن ئۆتكۈزۈلۈپ، display assembly غا چىقىرىلىدۇ. Antenna ئادەتتە ئېكراننىڭ ئۈستى تەرىپىگە، display bezel نىڭ كەينىگە ئورۇنلاشتۇرۇلىدۇ. بۇ ئورۇن سىگنال توسالغۇسىنى ئازايتىپ، signal strength نى ياخشىلاش ئۈچۈن تاللانغان.\n\nئەگەر رېمونت ياكى ئورنىتىش جەريانىدا antenna cable بوشاپ قالسا، قىستىلىپ قالسا ياكى خاتا يولدىن ئۆتكۈزۈلسە، wireless card ئۆزى نورمال بولسىمۇ سىمسىز تور ئىقتىدارى ناچارلىشىدۇ.\n\nExam Objective 1.1\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنە قاتتىق دېتالىنى كۆزىتىڭ ۋە مۇۋاپىق ئالماشتۇرۇش تېخنىكىسىنى ئىشلىتىڭ.\n\n## جىسمانىي مەخپىيەتلىك ۋە بىخەتەرلىك (Physical Privacy and Security)\n\nLaptop قاتارلىق كۆچمە ئۈسكۈنىلەرنىڭ بىخەتەرلىك ئىقتىدارلىرى ئۈستەل كومپيۇتېرىدىكىدىن پەرقلىق بولۇشى مۇمكىن. كۆچمە ئۈسكۈنىلەرنى ئېلىپ يۈرگىلى بولىدىغان ۋە كونترول قىلىنغان مۇھىتتىن سىرتتا كۆپ ئىشلىتىدىغان بولغاچقا، جىسمانىي مەخپىيەتلىك ۋە بىخەتەرلىك ئىقتىدارلىرى تېخىمۇ مۇھىم بولىدۇ.\n\nبۇ objective دا ئىككى مۇھىم مىسال بار:\n- Biometric authentication — بىيومېترىك كىملىك دەلىللەش\n- NFC (Near-Field Communication) — يېقىن مەيدان ئالاقىسى\n\n### Biometric Authentication\n\nBiometric authentication بارماق ئىزى ياكى يۈز ئالاھىدىلىكىگە ئوخشاش ئادەمنىڭ جىسمانىي خۇسۇسىيەتلىرىنى ئىشلىتىپ كىملىكىنى دەلىللەيدۇ.\n\nFingerprint reader لار laptop لاردا كۆپ ئۇچرايدۇ، چۈنكى ئۇلار مۇرەككەپ password كىرگۈزمەيلا تېز ۋە قولايلىق كىرىش ئىمكانى بېرىدۇ. بۇ sensor لار ئارقىلىق:\n- ئۈسكۈنىنى ئېچىش،\n- سېتىۋېلىشنى دەلىللەش،\n- بىخەتەر مۇلازىمەتكە كىرىش\nمۇمكىن.\n\nبۇ ئارقىلىق پەقەت ھوقۇق بېرىلگەن ئىشلەتكۈچىنىڭ ئۈسكۈنىگە كىرىشىگە ياردەم بېرىلىدۇ. ئاممىۋى ياكى ئورتاق ئىشلىتىلىدىغان جايلاردا بۇ جىسمانىي بىخەتەرلىك ئۈچۈن ئالاھىدە پايدىلىق.\n\n### NFC — Near-Field Communication\n\nNFC ئۈسكۈنىلەرنىڭ ناھايىتى قىسقا ئارىلىقتا سانلىق مەلۇمات ئالماشتۇرۇشىغا يول قويىدۇ. ئادەتتە ئۈسكۈنىلەر بىر-بىرىگە ناھايىتى يېقىن بولۇشى كېرەك.\n\nNFC نىڭ ئىشلىتىلىشى:\n- بىخەتەر pairing\n- authentication\n- smartphone، tablet، badge ياكى payment system بىلەن سانلىق مەلۇمات ئالماشتۇرۇش\n\nNFC نىڭ دائىرىسى بەك قىسقا بولغاچقا، ئۇزۇن ئارىلىقتىكى سىمسىز تېخنىكىلارغا قارىغاندا رۇخسەتسىز زىيارەت خەۋپىنى تۆۋەنلىتىشكە ياردەم بېرىدۇ."}, {"id": "1.2", "number": "1.2", "domain": "1", "domain_en": "Mobile Devices", "domain_ug": "كۆچمە ئۈسكۈنىلەر", "english": "Exam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Mobile device accessories. In today's IT landscape, mobile device accessories are no longer just optional add-ons.\n\nThey are essential tools that extend the capabilities of the devices they accompany. Accessories enhance user interaction, improve efficiency, and allow devices to be customized for specific tasks and work styles. While there are many accessories available, in this video segment, we will focus only on those listed in the CompTIA A+ Core 1 exam objectives.\n\nFirst up, we have stylus devices, sometimes referred to as touchpens. The stylus device has changed how users interact with touchscreen devices by providing greater precision and control than a finger alone. These pen-shaped tools allow users to write, draw, annotate, and navigate with improved accuracy, effectively turning a touchscreen into a digital notepad or drawing surface.\n\nStylus devices generally fall into two categories, passive and active. Passive styluses do not require a battery and work simply by making contact with the touchscreen, similar to how a finger is used. They are simple, reliable, and inexpensive, making them well-suited for basic navigation and light drawing tasks.\n\nActive styluses, on the other hand, require a battery to support advanced features such as pressure sensitivity, palm rejection, and electronic erasing. These features are especially useful for digital artists and note-takers, but they also introduce battery management considerations, since the stylus must be charged or have its battery replaced to continue functioning properly. Moving on to audio accessories, headsets and speakers play an important role in improving both sound quality and communication.\n\nAlthough most mobile devices include built-in microphones and speakers, external headsets and speakers often deliver clearer audio, stronger bass, and better overall sound performance. Headsets in particular are valuable for video conferencing and remote work, as they typically include dedicated microphones and may offer noise canceling features that reduce background distractions. When using external audio accessories, it is important to ensure the correct input and output devices are selected in the system settings.\n\nChoosing the appropriate microphone and speaker allows the accessory to take priority over the built-in hardware. Failing to select the correct device can result in poor audio quality or the accessory appearing not to work at all, even though it is properly connected. Transitioning from audio to visual accessories, external webcams are commonly used to improve video quality on mobile devices.\n\nExternal webcams often provide higher resolution, better low light performance, and more accurate color reproduction than built-in cameras. This makes them a popular choice for professional meetings, streaming, and content creation. For best results, external webcams should be mounted securely on a stable surface to prevent shaking or uneven video.\n\nMany webcams allow angle and position adjustments, giving users better control over framing and lighting. It is also important to manage webcam access carefully. If multiple applications attempt to use the webcam at the same time, conflicts can occur, resulting in video errors or the camera failing to activate.\n\nLimiting access to a single application at a time helps prevent these issues. Finally, we have drawing pads and track pads, also known as touch pads. These input accessories provide an alternative to traditional mice.\n\nTrack pads support gesture-based input, making navigation faster and more intuitive, while drawing pads are essential tools for designers and artists who need accurate input for creative work. For these devices to function correctly, they must be properly enabled and calibrated. Poor calibration can result in pointer drift, inaccurate cursor movement, or unresponsive input.\n\nRegular calibration helps ensure the device accurately reflects finger or stylus movements. Additionally, connecting external peripherals or changing system settings can sometimes disable a track pad automatically. If cursor input suddenly stops working, checking the device settings to confirm the track pad is enabled is a critical troubleshooting step.\n\nExam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Mobile device connections. Mobile devices may be great as a standalone computing device but the true magic really happens when they reach out and connect with other devices and accessories.\n\nIn this video, we will discuss some common wired and wireless connection types used by various mobile devices. Let's begin with USB or universal serial bus connections. USB is a wired peripheral device interface standard that allows for data transfer and device charging and the ports come in several form factors.\n\nSome of the most common form factors for mobile devices include mini USB, micro USB, and USB-C. USB-C, known for its reversible design, is the latest and most versatile, allowing for faster data transfer and charging. As for the mini USB and micro USB, these are older but still prevalent.\n\nAnother common wired connection type is the lightning connector. Lightning is a wired peripheral device interface standard that is exclusive to Apple devices and allows for data transfer and device charging. It's a sleek, small connector that can be used for various tasks, like transferring files from an Apple phone to a workstation.\n\nSuch a task could be accomplished by simply plugging one end into your iPhone and the other into the USB port of your computer. Do so and you will be ready to transmit data. Switching away from wired connection types, we will now cover a few wireless connection options used by mobile devices.\n\nAnd first up for the wireless category, we have near field communication, or NSC. NSC is a wireless networking interface standard that uses radio frequencies to share data over a short distance of a few centimeters or inches. This short range wireless connectivity enables various convenient functions like authentication and mobile payments.\n\nFor example, by simply tapping your device to a reader, you can authenticate access or complete purchases quickly and securely. Now we have Bluetooth, a wireless networking interface and peripheral device interface standard that uses radio frequencies to share data over a short distance of a few meters or yards. This technology allows mobile devices to effortlessly connect with peripherals such as wireless headphones, portable speakers and keyboards.\n\nEliminating the need for cables, Bluetooth enables a clutter-free, hands-free experience. Additionally, it supports various functions like file sharing, audio streaming and voice commands, which serves to amplify the capabilities of connected devices, creating a cohesive and more productive personal tech environment. Finally, we come to mobile tethering and hotspot, which are closely related, but not identical.\n\nTethering refers to the ability of a mobile device to share its data connection with other devices. This sharing can be done using a wired connection or a wireless connection. Tethering is commonly used when another device needs internet access, but no traditional wired or wireless network is available.\n\nA mobile hotspot is a specific type of tethering that uses wifi. When hotspot mode is enabled, the mobile device acts as a wireless access point, allowing multiple devices to connect and access the internet at the same time. Hotspots are especially useful while traveling or working remotely, where public or private wifi networks may not be available.\n\nIn short, all hotspots are a form of tethering, but not all tethering uses hotspot functionality. Exam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Port replicator.\n\nA port replicator is a device that plugs into a laptop or other mobile device and provides additional ports for peripherals, but does not provide additional features. With that said, they typically plug directly into these mobile devices through a USB, USB-C, or Thunderbolt port to multiply the number of available connections. Essentially, it allows a laptop to interface with a variety of peripherals that would typically be connected to a desktop computer, providing an array of ports such as USB, HDMI, ethernet, and sometimes more specialized ports like serial or parallel ports, depending on model.\n\nThe convenience of a port replicator lies in its ability to consolidate connections. For individuals who alternate between multiple workspaces or those who are frequently on the move, the port replicator becomes a stationary hub to which all peripherals are connected. When the user arrives at their workspace, they can connect their laptop to the port replicator with a single cable, immediately integrating with all the connected devices.\n\nThis is not only a time saver, but also reduces the physical wear and tear on the laptop's ports from repeatedly plugging and unplugging peripherals. With the trend of making laptops thinner and lighter, many models sacrifice the number of available ports, which can limit functionality. Port replicators address this limitation by providing the extra ports that users need without the need for internal hardware upgrades or external attachments.\n\nAdditionally, they have become more advanced over time, with the latest models supporting USB 3.0, USB-C, and Thunderbolt connections for faster data transfer, providing outputs for high definition displays and offering power delivery to charge the laptop while it's connected. For professionals, students, or anyone who uses their laptop for various tasks and needs to connect multiple devices, a port replicator is a valuable investment. It transforms the laptop into a dynamic workstation that mimics the connectivity of a desktop computer, enhancing productivity, and making it easier to work efficiently in any location.\n\nThe streamlined setup enabled by a port replicator is a simple yet powerful solution for maximizing the potential of portable devices in today's mobile-first world. Exam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Docking station.\n\nA docking station is a device that plugs into a laptop or other mobile device and provides additional ports for peripherals and provides additional features. This is very similar to the port replicator with that one difference of providing additional features, not just additional ports. Docking stations elevate the functionality of mobile computing devices by incorporating these feature enhancements, which can range from additional storage and improved audio to advanced video graphics capabilities.\n\nThe key to a docking station's ability to offer these enhancements lies in its connection to the mobile device. Using high-speed interfaces like Thunderbolt or proprietary connectors, docking stations can transfer data, power, and video signals simultaneously through a single cable. This robust connection allows the docking station to not only increase the number of available ports, but also to augment the device's capabilities significantly.\n\nOne of the primary additional features of a docking station is the inclusion of its own power supply, which allows it to charge the connected laptop directly. This power can also support more power-hungry peripherals that a port replicator cannot handle due to its reliance on the laptop's power resources. Furthermore, docking stations can host additional hardware like dedicated graphics cards, which empower laptops to perform tasks that are graphically intensive, such as video rendering or gaming, far beyond the laptop's built-in capabilities.\n\nDocking stations also often come with added storage in the form of built-in hard drives or SSDs, providing not just extra space, but also the possibility of enhanced data processing speeds. Some even have their own network ports for faster internet connections, multiple video ports that support high-resolution external monitors, and advanced audio ports for high-fidelity sound systems. These additional features make docking stations particularly suitable for power users who need more than just extra USB ports or a simple video output extension.\n\nThey cater to those who need to transform their laptop into a fully-fledged desktop computing environment when at the office or home, but still require the flexibility to undock and go mobile at a moment's notice.", "uyghur": "Exam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە زاپچاسلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇڭ ۋە پەرقلىرىنى چۈشەندۈرۈڭ.\n\n## كۆچمە ئۈسكۈنە قوشۇمچە زاپچاسلىرى (Mobile Device Accessories)\n\nبۈگۈنكى IT مۇھىتىدا mobile-device accessory لار پەقەت ئىختىيارىي قوشۇمچە نەرسە ئەمەس. ئۇلار ئۈسكۈنىنىڭ ئىقتىدارىنى كېڭەيتىدىغان مۇھىم قوراللار. ئۇلار ئىشلەتكۈچىنىڭ ئۈسكۈنە بىلەن ئۆزئارا تەسىرىنى ياخشىلايدۇ، ئۈنۈمدارلىقنى ئاشۇرىدۇ ۋە ئۈسكۈنىنى كونكرېت خىزمەت ياكى ئىش ئۇسۇلىغا ماسلاشتۇرۇشقا ياردەم بېرىدۇ.\n\nبۇ بۆلەكتە پەقەت CompTIA A+ Core 1 Exam Objectives دا بار قوشۇمچە زاپچاسلارغا مەركەزلىشىمىز.\n\n### Stylus — Touch Pen\n\nStylus، بەزىدە touch pen دەپ ئاتىلىدۇ، touchscreen ئۈسكۈنىنى بارماققا قارىغاندا تېخىمۇ ئىنچىكە ۋە كونتروللۇق ئىشلىتىش ئىمكانى بېرىدۇ. قەلەم شەكىللىك بۇ قورال ئارقىلىق:\n- يېزىش،\n- سىزىش،\n- annotation قىلىش،\n- navigation قىلىش\nتېخىمۇ ئېنىق بولىدۇ. بۇ touchscreen نى رەقەملىك خاتىرە دەپتىرى ياكى رەسىم سىزىش يۈزىگە ئايلاندۇرالايدۇ.\n\nStylus ئادەتتە ئىككى تۈرگە بۆلۈنىدۇ:\n\n**Passive stylus:**\n- باتارېيە تەلەپ قىلمايدۇ.\n- بارماققا ئوخشاش touchscreen غا تېگىش ئارقىلىق ئىشلەيدۇ.\n- ئاددىي، ئىشەنچلىك ۋە ئەرزان.\n- ئاساسىي navigation ۋە يېنىك سىزىشقا ماس.\n\n**Active stylus:**\n- باتارېيە تەلەپ قىلىدۇ.\n- pressure sensitivity، palm rejection ۋە electronic erasing قاتارلىق ئىلغار ئىقتىدارلارنى قوللايدۇ.\n- digital artist ۋە note-taker لارغا ئالاھىدە پايدىلىق.\n- داۋاملىق ئىشلىشى ئۈچۈن زەرەتلەش ياكى باتارېيە ئالماشتۇرۇش كېرەك.\n\n### Headset ۋە Speaker\n\nئاۋاز قوشۇمچە زاپچاسلىرىدىن headset ۋە speaker ئاۋاز سۈپىتى ۋە ئالاقىنى ياخشىلاشتا مۇھىم رول ئوينايدۇ.\n\nنۇرغۇن mobile device تا built-in microphone ۋە speaker بولسىمۇ، سىرتقى headset ۋە speaker لار كۆپىنچە:\n- تېخىمۇ ئېنىق ئاۋاز،\n- كۈچلۈك bass،\n- ئومۇمىي ياخشىراق sound performance\nتەمىنلەيدۇ.\n\nHeadset بولۇپمۇ video conferencing ۋە remote work ئۈچۈن پايدىلىق. ئادەتتە ئايرىم microphone بار، بەزى مودېللاردا background noise نى ئازايتىدىغان noise-canceling ئىقتىدارىمۇ بولىدۇ.\n\nسىرتقى audio accessory ئىشلەتكەندە system settings ئىچىدە توغرا input ۋە output device تاللانغانلىقىنى جەزملەشتۈرۈڭ. توغرا microphone ۋە speaker نى تاللاش سىرتقى زاپچاسنى built-in hardware دىن ئالدىن ئىشلىتىشكە يول قويىدۇ.\n\nئەگەر خاتا device تاللانسا، زاپچاس توغرا ئۇلانغان بولسىمۇ ئاۋاز ناچار چىقىشى ياكى پۈتۈنلەي ئىشلىمەيدىغاندەك كۆرۈنۈشى مۇمكىن.\n\n### External Webcam\n\nسىرتقى webcam mobile device نىڭ video quality سىنى ياخشىلاش ئۈچۈن ئىشلىتىلىدۇ. Built-in camera غا قارىغاندا كۆپىنچە:\n- يۇقىرى resolution،\n- تۆۋەن يورۇقلۇقتا ياخشىراق performance،\n- تېخىمۇ توغرا color reproduction\nتەمىنلەيدۇ.\n\nشۇڭا professional meeting، streaming ۋە content creation ئۈچۈن كۆپ تاللىنىدۇ.\n\nئەڭ ياخشى نەتىجە ئۈچۈن webcam نى تەۋرىمەيدىغان مۇقىم يۈزىگە پۇختا ئورنىتىڭ. نۇرغۇن webcam دا angle ۋە position نى تەڭشەشكە بولىدۇ، بۇ framing ۋە lighting نى ياخشى كونترول قىلىشقا ياردەم بېرىدۇ.\n\nWebcam access نىمۇ توغرا باشقۇرۇش كېرەك. بىر ۋاقىتتا بىر نەچچە application webcam نى ئىشلىتىشكە ئۇرۇنسا conflict پەيدا بولۇپ، video error چىقىشى ياكى camera ئېچىلماسلىقى مۇمكىن. بىر ۋاقىتتا پەقەت بىر application غا webcam access بېرىش بۇ مەسىلىنى ئازايتىدۇ.\n\n### Drawing Pad ۋە Trackpad / Touchpad\n\nDrawing pad ۋە trackpad ئەنئەنىۋى mouse نىڭ ئورنىغا ئىشلىتىلىدىغان input accessory لار.\n\nTrackpad gesture-based input نى قوللايدۇ، navigation نى تېز ۋە تەبىئىي قىلىدۇ. Drawing pad بولسا ئېنىق input كېرەك بولغان designer ۋە artist لار ئۈچۈن مۇھىم قورال.\n\nبۇ ئۈسكۈنىلەرنىڭ توغرا ئىشلىشى ئۈچۈن ئۇلار enabled ۋە calibrated بولۇشى كېرەك. Calibration ناچار بولسا:\n- pointer ئۆزى يۆتكىلىپ كېتىشى (pointer drift)،\n- cursor ھەرىكىتى توغرا بولماسلىقى،\n- input جاۋاب بەرمەسلىكى\nمۇمكىن.\n\nقەرەللىك calibration بارماق ياكى stylus ھەرىكىتىنىڭ ئېكراندا توغرا ئەكس ئېتىشىگە ياردەم بېرىدۇ.\n\nسىرتقى peripheral ئۇلاش ياكى system setting نى ئۆزگەرتىش بەزىدە trackpad نى ئاپتوماتىك disable قىلىشى مۇمكىن. ئەگەر cursor input تۇيۇقسىز توختاپ قالسا، troubleshooting نىڭ مۇھىم بىر قەدىمى—device settings دىن trackpad نىڭ enabled ئىكەنلىكىنى تەكشۈرۈش.\n\nExam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە زاپچاسلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇڭ ۋە پەرقلىرىنى چۈشەندۈرۈڭ.\n\n## كۆچمە ئۈسكۈنە ئۇلىنىشلىرى (Mobile Device Connections)\n\nMobile device ئۆزى مۇستەقىل ھالدا كۈچلۈك بولسىمۇ، باشقا ئۈسكۈنە ۋە قوشۇمچە زاپچاسلارغا ئۇلانغاندا ئىقتىدارى تېخىمۇ كېڭىيىدۇ. بۇ بۆلەكتە mobile device لاردا كۆپ ئۇچرايدىغان wired ۋە wireless connection تۈرلىرىنى كۆرۈپ چىقىمىز.\n\n### USB — Universal Serial Bus\n\nUSB سىملىق peripheral-device interface ئۆلچىمى بولۇپ، data transfer ۋە device charging ئۈچۈن ئىشلىتىلىدۇ. ئۇنىڭ بىر نەچچە port/form factor تۈرى بار.\n\nMobile device لاردا كۆپ ئۇچرايدىغانلىرى:\n- Mini USB\n- Micro USB\n- USB-C\n\nUSB-C قايتۇرما (reversible) connector لايىھىسى بىلەن تونۇلغان، يېڭىراق ۋە كۆپ ئىقتىدارلىق تۈر. ئۇ تېخىمۇ تېز data transfer ۋە charging نى قوللايدۇ.\n\nMini USB ۋە Micro USB كونا تۈرلەر، ئەمما يەنىلا بەزى ئۈسكۈنىلەردە ئۇچرايدۇ.\n\n### Lightning Connector\n\nLightning Apple ئۈسكۈنىلىرىگە خاس سىملىق peripheral-device interface بولۇپ، data transfer ۋە charging ئۈچۈن ئىشلىتىلىدۇ.\n\nمەسىلەن، Apple تېلېفونىدىن workstation غا file يۆتكەش ئۈچۈن بىر ئۇچىنى iPhone غا، يەنە بىر ئۇچىنى كومپيۇتېرنىڭ USB port ىغا ئۇلاشقا بولىدۇ.\n\n### NFC — Near-Field Communication\n\nسىمسىز ئۇلىنىشلار ئىچىدە NFC قىسقا ئارىلىقتىكى radio frequency ئارقىلىق سانلىق مەلۇمات ئالماشتۇرىدىغان wireless interface ئۆلچىمى. ئارىلىق ئادەتتە بىر نەچچە سانتىمېتىر ياكى inch.\n\nئۇنىڭ ئىشلىتىلىشى:\n- authentication\n- mobile payment\n- قىسقا ئارىلىقتىكى data exchange\n\nمەسىلەن، ئۈسكۈنىنى reader غا يېقىنلاشتۇرۇش ئارقىلىق access نى دەلىللەش ياكى سېتىۋېلىشنى تېز ۋە بىخەتەر تاماملاشقا بولىدۇ.\n\n### Bluetooth\n\nBluetooth قىسقا ئارىلىقتا radio frequency ئارقىلىق data ئالماشتۇرىدىغان wireless networking ۋە peripheral-device interface standard. ئارىلىقى ئادەتتە بىر نەچچە مېتىر.\n\nBluetooth ئارقىلىق mobile device نى تۆۋەندىكى peripheral لارغا سىمسىز ئۇلاشقا بولىدۇ:\n- wireless headphone\n- portable speaker\n- keyboard\n\nسىم لازىم بولمىغاچقا، مۇھىتنى رەتلىك ۋە hands-free قىلىدۇ. شۇنداقلا file sharing، audio streaming ۋە voice command قاتارلىق ئىقتىدارلارنى قوللايدۇ.\n\n### Tethering ۋە Hotspot\n\nTethering بىلەن mobile hotspot بىر-بىرىگە يېقىن ئۇقۇم، ئەمما پۈتۈنلەي بىر نەرسە ئەمەس.\n\n**Tethering** — mobile device نىڭ ئۆزىدىكى data connection نى باشقا ئۈسكۈنىگە ھەمبەھىرلەش ئىقتىدارى. بۇ wired ياكى wireless ئۇلىنىش ئارقىلىق بولالايدۇ. ئادەتتە باشقا ئۈسكۈنىگە Internet كېرەك، ئەمما نورمال wired ياكى wireless network يوق ۋاقىتتا ئىشلىتىلىدۇ.\n\n**Mobile hotspot** — Wi-Fi ئىشلىتىدىغان tethering نىڭ بىر خىل شەكلى. Hotspot mode ئېچىلغاندا mobile device wireless access point سۈپىتىدە ئىشلەپ، بىر نەچچە ئۈسكۈنىنىڭ بىر ۋاقىتتا ئۇلىنىپ Internet كە چىقىشىغا يول قويىدۇ.\n\nHotspot ساياھەت ياكى remote work جەريانىدا public/private Wi-Fi بولمىغان ۋاقىتتا ئالاھىدە پايدىلىق.\n\nقىسقىسى: **ھەر بىر hotspot tethering نىڭ بىر شەكلى، ئەمما ھەر بىر tethering hotspot ئەمەس.**\n\nExam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە زاپچاسلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇڭ ۋە پەرقلىرىنى چۈشەندۈرۈڭ.\n\n## Port Replicator\n\nPort replicator laptop ياكى باشقا mobile device غا ئۇلىنىپ، peripheral لار ئۈچۈن قوشۇمچە port تەمىنلەيدىغان، ئەمما ئادەتتە قوشۇمچە ئىقتىدار قوشمايدىغان ئۈسكۈنە.\n\nئۇ كۆپىنچە USB، USB-C ياكى Thunderbolt ئارقىلىق mobile device غا بىۋاسىتە ئۇلىنىپ، بار بولغان connection سانىنى كۆپەيتىدۇ.\n\nPort replicator laptop نى ئادەتتە desktop computer غا ئۇلىنىدىغان نۇرغۇن peripheral بىلەن ئىشلىتىشكە يول قويىدۇ. مودېلغا قاراپ تۆۋەندىكى port لار بولۇشى مۇمكىن:\n- USB\n- HDMI\n- Ethernet\n- Serial\n- Parallel\n\nئۇنىڭ چوڭ ئەۋزەللىكى—بارلىق ئۇلىنىشلارنى بىر جايدا توپلاش.\n\nبىر نەچچە workspace ئارىسىدا يۆتكىلىدىغان ياكى دائىم يولدا بولىدىغان كىشى ئۈچۈن port replicator بىر مۇقىم hub بولالايدۇ. بارلىق peripheral لار شۇ hub قا ئۇلىنىدۇ؛ ئىشلەتكۈچى ئىش ئورنىغا كەلگەندە lap
