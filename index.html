p + surge protection;\n- بەزىلىرى surge protection only.\n\nBattery-backed outlet قا critical ئۈسكۈنىلەرنى ئۇلاڭ:\n- computer/server;\n- monitor;\n- router/modem/switch;\n- critical storage/networking.\n\nHigh-draw/nonessential ئۈسكۈنىلەرنى battery outlet قا ئۇلاشتىن ساقلىنىڭ:\n- printer، بولۇپمۇ **laser printer**;\n- scanner;\n- چوڭ speaker.\n\nبۇلار UPS battery نى تېز تۈگىتىدۇ.\n\n#"}, {"id": "3.7", "number": "3.7", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.7. Given a scenario, deploy and configure multifunction devices, printers, and settings. Printer and scanner.\n\nIn this video segment, we will cover printers and scanners together, as they are fairly similar. In fact, it is very often that printers and scanners come packaged together as a single unit known as a multifunction device, or MFD for short. Starting with printers, a printer is a peripheral device which makes a physical rendering of digital data, usually on paper, or creates a physical object from a three-dimensional digital model, in the case of a 3D printer.\n\nSome of the most common printer types are laser printers, inkjet printers, thermal printers, impact printers, and 3D printers. While a printer outputs digital data, a scanner does the exact opposite. A scanner is a peripheral device that optically scans images or objects and converts them into digital data.\n\nThe most common scanner types are flatbed scanners and sheet-fed ABS scanners. A flatbed scanner offers versatility and precision, allowing users to scan a wide range of documents, photos, and objects of varying sizes and shapes. Its flat glass surface accommodates delicate materials, books, or oddly shaped items.\n\nAs a downside, each page or item needs to be manually placed on the flatbed for scanning, making it a slow process for a large volume of documents. On the other hand, the automatic document feeder of an ADS scanner streamlines the scanning process by automatically feeding multiple pages through the scanner. This feature is particularly beneficial for high-volume scanning tasks, such as digitizing lengthy contracts, reports, or stacks of paperwork.\n\nADS scanners are designed for efficiency and convenience, allowing users to initiate the scanning process and attend to other tasks while the machine handles document feeding and scanning automatically. While ADS scanners excel in speed and efficiency for standard-sized documents, they may lack the versatility required for scanning delicate or oversized materials that a flatbed scanner can accommodate. Exam objective 3.7, given a scenario, deploy and configure multifunction devices, printers, and settings.\n\nPrinter settings and connectivity. When setting up a printer or a scanner, there are several important steps to consider. First and foremost, a connection type must be selected.\n\nFor a printer or scanner that is directly connected to a computer, also referred to as a local connection, you would most likely use a USB interface and probably a USB type B connector. Though less common, the wireless Bluetooth interface can also be used as an alternative for a local connection setup. If the printer or scanner is to be made available to an entire network of devices, a wired network connection would be made with an ethernet CAT cable that uses RJ45 connectors.\n\nAnd last up, the wireless alternative for a network connection would be Wi-Fi. Once the printer is connected, installing the appropriate drivers is essential for proper functionality. Drivers act as software intermediaries between the printer and the operating system, facilitating communication.\n\nUsers may choose between generic drivers, which offer basic functionality, but may not fully utilize the printer's capabilities and manufacturer-specific drivers tailored to the printer model. Moreover, understanding print driver languages is important for efficient printing operations. Each printer interprets commands using various languages, each tailored to specific printing needs.\n\nTwo prominent languages in this domain are printer control language, abbreviated PCL, and postscript. PCL, known for its widespread support, is commonly utilized for basic printing tasks across a range of printers. This language streamlines the printing process by efficiently translating data into printable formats, ensuring compatibility with various hardware configurations.\n\nPCL offers versatility and reliability, making it an ideal choice for everyday printing requirements in office environments and other settings where simplicity and compatibility are of great concern. On the other hand, postscript represents the pinnacle of printing languages, offering advanced features and unparalleled quality. Developed by Adobe Systems, postscript is renowned for its ability to faithfully render intricate graphics, intricate fonts, and complex page layouts with precision.\n\nThis language excels in demanding printing environments where exceptional print quality and fidelity are non-negotiable. With the printer connected and drivers installed, it is now time to move on to printer configuration settings. For now, I will just cover a few configuration options, starting with duplex printing.\n\nDuplex printing, also known as double-sided printing, is a feature that enables printers to automatically print on both sides of a sheet of paper. This capability not only saves paper, but also enhances efficiency and environmental sustainability in printing operations. In duplex printing, the printer is equipped with a mechanism that allows it to flip the paper over and print on the reverse side.\n\nThis process typically involves two steps, printing on one side of the paper and then flipping it over to print on the other side. The benefits of duplex printing are multifaceted. Primarily, it significantly reduces paper usage, which translates to cost savings and environmental conservation.\n\nBy utilizing both sides of the paper, duplex printing effectively halves the amount of paper required for printing tasks, making it an eco-friendly option for businesses and individuals striving to minimize their carbon footprint. In addition to duplex printing, orientation settings play a vital role in ensuring the correct layout of printed documents. Users can choose between portrait and landscape orientations depending on the content and format of the document.\n\nPortrait orientation is ideal for documents with predominantly vertical content, such as letters and reports, while landscape orientation is better suited for materials with horizontal emphasis, such as spreadsheets and presentations. Selecting the appropriate orientation ensures that printed documents are visually coherent and aligned with their intended purpose. Furthermore, trace settings allow users to specify the paper source for printing tasks, ensuring compatibility with different paper types and sizes.\n\nEnterprise printers typically feature multiple trays or paper feeders, each designated for specific paper sizes or types. By selecting the appropriate trace settings, users can seamlessly accommodate varying printing requirements from standard documents to specialized media, such as labels or envelopes. Lastly, the print quality setting on printers offers the user control over the level of detail and clarity in their printed materials.\n\nThese settings typically include options such as draft, normal, and best, or similar variations thereof. The draft setting prioritizes speed, making it suitable for internal documents or drafts, where print quality is less critical. Normal strikes a balance between quality and speed, making it suitable for everyday printing tasks like text documents or basic graphics.\n\nThen there is best, which offers the highest print quality, but may require more time to render. This setting is ideal for printing high resolution images or documents where exceptional clarity and detail are necessary. Users can choose the appropriate print quality setting based on their specific requirements, ensuring a balance between print quality and efficiency.\n\nExam objective 3.7. Given a scenario, deploy and configure multifunction devices, printers, and settings. Printer sharing and networking.\n\nLet's face it, in a world where space is limited and budgets are tight, it's just not practical for every device to have its own printer. Can you imagine a scenario where every computer, tablet, or smartphone in your office or home had its own dedicated printer? It would be like a printing apocalypse with paper jams and ink cartridges running amok at every turn.\n\nThankfully, that's where the magic of printer sharing and networking comes into play. By setting up a printer to be shared or networked, you can transform a single printer into a communal hub accessible to all. It's the ultimate solution for conserving resources, reducing clutter, and fostering a sense of unity among devices.\n\nBut how does it work? Well, there are a couple of ways we can go about this. First, I will discuss printer sharing, which is used for locally connected printers.\n\nThis option is like hosting an intimate gathering among close friends in your own living room. Just as you might gather around a karaoke machine to belt out your favorite tunes, devices in your local area network can gather around a shared printer to fulfill their printing needs. With a few simple configurations, you can designate one computer as the host.\n\nThen, connecting the printer to it through a local connection like USB or Bluetooth, you can share its printing capabilities with other devices that also reside on the local area network. Next, we have print servers. These dedicated devices take the sharing burden away from host devices, managing print jobs, and ensuring smooth operations for all connected devices.\n\nThink of them as the guardians of printing efficiency, ensuring that every print job gets its moment in the spotlight without causing chaos or confusion. Now, let's take the printing party to the next level by exploring printers that are directly connected to a network via ethernet or wifi. Imagine a scenario where your printer is no longer tethered to a single computer, but instead sits gracefully on your network, ready to spring into action at a moment's notice.\n\nWith ethernet or wifi connectivity, these printers become like digital beacons, broadcasting their printing prowess to all devices within range. Whether it's through a wired ethernet connection or the magic of wifi, these printers seamlessly integrate into your network, allowing multiple devices to access them directly. No host device needed.\n\nAll right, we've covered how printer sharing and networking allows for incoming print requests to reach the printer, but what happens in reverse? When it comes to sending scanned content out into the world, scanners offer a multitude of network scan services for connectivity and distribution. Take, for instance, the well-known email service, a staple of modern communication.\n\nWith just a few clicks, scanned documents can be attached to an email and dispatched to recipients near and far, ensuring swift delivery and seamless collaboration. But email is just the beginning. For organizations that rely on centralized file storage, the server message block networking protocol, or SMB, comes into play.\n\nBy scanning documents directly to a shared folder using the SMB protocol, users can ensure that important files are accessible to everyone who needs them, without the hassle of manual file transfers or email attachments. And then there's the cloud. With scanners equipped to upload documents directly to cloud storage services like Dropbox, Hoogle Drive, or Microsoft OneDrive, the possibilities are endless.\n\nScanned documents become instantly accessible from any device with an internet connection, empowering users to collaborate and share information with ease, regardless of their physical location.\n\nExam objective 3.7. Given a scenario, deploy and configure multifunction devices, printers, and settings. Printer security.\n\nPrinters, like other devices connected to a network, such as computers, servers, and routers, can be vulnerable to security breaches, if not properly managed. This vulnerability arises from the fact that modern printers are no longer standalone devices, but integral components of complex network infrastructures. As such, they are subject to many of the same security risks and threats as other network-connected devices.\n\nLuckily, we have a few countermeasures available to combat these threats. User authentication is one of those countermeasures. It serves as the frontline defense against unauthorized usage, and helps maintain the confidentiality and integrity of printed materials.\n\nImplementing user authentication requires users to verify their identity before they can access print resources. This verification process typically involves entering a username and password, similar to logging into a computer or online account. By requiring this authentication step, organizations can ensure that only individuals with valid credentials can utilize the printing functionalities.\n\nAnother important measure in printer security is badging. Badging systems integrate with printer security features to control who can access print resources. These systems commonly use employee ID badges that contain embedded NFC technology.\n\nAt its core, a badging system functions as a gatekeeper, allowing entry to printer functionalities, such as initiating or releasing a print job, only to those possessing valid credentials in the form of an employee badge or ID card. When a user approaches the printer to initiate or release a secure print job, they must tap or hold their badge near the NFC reader built into the printer. This action triggers a verification process wherein the system cross-references the presented credentials with a centralized database containing authorized user information.\n\nNext, we have audit logs. Audit logs function as a vigilant watchdog that meticulously monitors printer activity and provides invaluable insights into usage patterns and potential security incidents. These comprehensive logs meticulously document a wealth of critical information, including details such as who initiated a print job, the specific document printed, the timestamp of the printing activity, and the originating device.\n\nOne of the primary functions of audit logs is to provide administrators with a comprehensive trail of printer usage, allowing them to track and monitor printing activities across the organization. By documenting every print job, audit logs offer a transparent view into the utilization of printer resources, enabling administrators to identify trends, analyze usage patterns, and allocate resources efficiently. Then there is secured printing.\n\nThis measure is designed to prevent sensitive documents from being prematurely released into the printer's output tray. This functionality ensures that print jobs remain securely stored within the printer until the authorized user is physically present to authenticate. This can be tied in with badging or require a simple pen or password.\n\nThe primary objective of secured printing is to mitigate the risk of unauthorized access to sensitive documents. Instead of immediately printing documents upon submission, secured printing temporarily holds print jobs in a protected queue or virtual print fault within the printer's memory or storage. This prevents confidential documents from being left unattended in the output tray, where they could potentially be intercepted, viewed, or taken by unauthorized individuals.\n\nNow for one last threat countermeasure, you must keep the printer's firmware up to date. Printers are frequently overlooked when it comes to updates. Administrators may prioritize securing more prominent network devices, leaving printers vulnerable to exploitation.\n\nWithout regular firmware updates that likely contain patches for known vulnerabilities, printers will be susceptible to malicious attacks.", "uyghur": "Exam Objective 3.7 — Multifunction Devices, Printers and Settings\n\n## Printer and Scanner\n**Printer** digital data نى paper دىكى physical output قا، 3D printer بولسا digital 3D model نى physical object قا ئايلاندۇرىدۇ.\n\nكۆپ ئۇچرايدىغان printer types:\n- laser\n- inkjet\n- thermal\n- impact\n- 3D\n\n**Scanner** بولسا ئەكسىچە physical image/document نى optical scan قىلىپ digital data غا ئايلاندۇرىدۇ.\n\n### Flatbed scanner\nFlat glass ئۈستىگە document/photo/object نى قويۇپ scan قىلىدۇ. Delicate، book، odd-shaped item ئۈچۈن ياخشى، ئەمما كۆپ page دا ھەر بەتنى قولدا سېلىش لازىم بولغاچقا ئاستا.\n\n### ADF / sheet-fed scanner\nئەسلى transcript «ADS» دەپ ئاڭلانغان؛ بۇ يەردىكى تېرمىن **ADF (Automatic Document Feeder)**. Multiple pages نى ئاپتوماتىك feed قىلىپ high-volume scanning غا تېز، ئەمما delicate/oversized material ئۈچۈن flatbed دەك جانلىق ئەمەس.\n\n## Printer Connectivity and Settings\n\n### Connection types\n- Local wired → ئادەتتە **USB**, printer تەرەپتە USB Type-B كۆپ.\n- Local wireless → Bluetooth بولۇشى مۇمكىن.\n- Network wired → Ethernet CAT cable + RJ45.\n- Network wireless → Wi-Fi.\n\n### Drivers\nPrinter driver OS بىلەن printer ئارىسىدا communication قىلىدۇ.\n- Generic driver → basic features.\n- Manufacturer-specific driver → model نىڭ تولۇق capabilities نى ياخشىراق قوللايدۇ.\n\n### Printer languages\n- **PCL (Printer Control Language):** كەڭ compatibility، everyday/basic office printing.\n- **PostScript:** Adobe تەرىپىدىن تەرەققىي قىلدۇرۇلغان؛ complex graphics، fonts ۋە page layouts نى high fidelity بىلەن render قىلىشقا ماس.\n\n### Duplex\n**Duplex printing** = paper نىڭ ئىككى يۈزىگە ئاپتوماتىك print. Paper usage/cost نى ئازايتىدۇ.\n\n### Orientation\n- **Portrait:** تىك layout؛ letter/report.\n- **Landscape:** توغرا layout؛ spreadsheet/presentation قاتارلىق كەڭ content.\n\n### Paper tray/source\nئەسلى transcript «trace settings» دەپ ئاڭلانغان؛ مەزمۇن **tray/source settings**. Enterprise printer دا بىر نەچچە tray بولغاچقا paper size/type، label، envelope قاتارلىقلارغا ماس tray نى تاللايدۇ.\n\n### Print quality\n- **Draft:** تېز، quality تۆۋەنرەك.\n- **Normal:** speed + quality تەڭپۇڭ.\n- **Best:** high quality، render ۋاقتى كۆپرەك.\n\n## Printer Sharing and Networking\n\n### Host-based printer sharing\nPrinter USB/Bluetooth ئارقىلىق بىر host computer غا local ئۇلىنىپ، شۇ host LAN دىكى باشقا devices قا share قىلىدۇ. Host computer printer access نىڭ ئارىلىق نۇقتىسى بولىدۇ.\n\n### Print server\nDedicated print server print jobs نى قوبۇل قىلىپ، queue/management نى باشقۇرىدۇ؛ host PC غا بولغان يۈكنى ئازايتىدۇ.\n\n### Direct network printer\nPrinter Ethernet ياكى Wi-Fi ئارقىلىق network قا بىۋاسىتە ئۇلىنىدۇ. Multiple devices host PC سىز بىۋاسىتە printer غا print job ئەۋەتەلەيدۇ.\n\n### Network scanning\nMultifunction scanner scanned content نى:\n- Email؛\n- **SMB shared folder**؛\n- cloud storage (مەسىلەن Google Drive، OneDrive، Dropbox)\nغا بىۋاسىتە ئەۋەتەلەيدۇ.\n\n## Printer Security\n\nNetwork printer مۇ computer/server/router غا ئوخشاش security risk قا دۇچ كېلىدۇ.\n\n### User authentication\nUsername/password ئارقىلىق authorized user لا print resource نى ئىشلىتەلەيدۇ.\n\n### Badge/NFC authentication\nEmployee ID badge ئىچىدىكى NFC credential نى printer reader غا تەگكۈزۈپ print job نى initiate/release قىلىدۇ. System credential نى centralized database بىلەن verify قىلىدۇ.\n\n### Audit logs\nPrint activity نى خاتىرىلەيدۇ، مەسىلەن:\n- كىم print قىلدى؛\n- قايسى document;\n- timestamp;\n- originating device.\n\nAdministrator usage pattern ۋە security incident نى تەكشۈرەلەيدۇ.\n\n### Secure printing\nSensitive print job نى printer memory/secure queue دا ساقلاپ، user physically حاضر بولۇپ badge/PIN/password بىلەن authenticate قىلغاندىن كېيىنلا چىقىرىدۇ. بۇ confidential document نىڭ output tray دا unattended قېلىشىنىڭ ئالدىنى ئالىدۇ.\n\n### Firmware updates\nPrinter firmware نى ۋاقتىدا update قىلىپ security vulnerabilities ئۈچۈن patch لارنى قاچىلاش كېرەك.\n\n#"}, {"id": "3.8", "number": "3.8", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.8, given a scenario, perform appropriate printer maintenance. Inkjet printer. With this video segment, we will begin our study of exam objective 3.8, which requires you to perform appropriate printer maintenance.\n\nPrinters, like any other mechanical device, require routine maintenance to ensure reliable operation and consistent print quality. Over time, components wear down, consumables run out, and internal parts can become dirty or misaligned. Performing proper maintenance helps extend the life of the printer, prevents unexpected downtime, and ensures that documents are printed clearly and accurately.\n\nFor the exam, you should understand how printers operate and the common maintenance procedures associated with four major printer types, including inkjet printers, laser printers, thermal printers, and impact printers. Each of these printer technologies operates differently, which means their maintenance tasks and replacement components will also differ. We will begin with one of the most common printers found in homes and small offices, which is the inkjet printer.\n\nInkjet printers are widely used in both home and office environments to produce high quality prints. These printers rely on ink cartridges to transfer ink onto paper, enabling the creation of text and images. The ink cartridge serves as a crucial component in the printing process in an inkjet printer, acting as a reservoir for the ink needed for printing operations.\n\nEngineered with specially formulated ink, the cartridge ensures vibrant and precise colors in printed output. Following the ink cartridge, the next component to discuss is the printhead situated within the printer. The printhead disperses ink onto the paper in precise patterns to form characters and images.\n\nPrintheads can either be detached where the ink cartridges are housed separately or integrated where the printhead is built directly into the ink cartridge. Moving on, the pickup roller and feed rollers work together to facilitate the smooth movement of paper through the printer, ensuring accurate and efficient printing operations. The pickup roller grabs a single sheet of paper from the paper tray or input tray, using friction to guide it into the printer mechanism.\n\nSubsequently, the feed rollers assist in guiding the paper through the printer. Together, these components play a critical role in the paper handling process, helping to prevent misfeeds or paper jams. After discussing the pickup roller and feed rollers, the next component to explore is the carriage belt.\n\nThe carriage belt is an integral part of the inkjet printer's mechanism, responsible for the precise movement of the printhead assembly across the width of the paper. Connected to the printhead assembly, the carriage belt allows for controlled back and forth movement along the paper path during printing. Now that we've examined the major components of an inkjet printer, it's important to understand the calibration process that helps keep these components operating in harmony and with precision.\n\nDuring calibration, the printer aligns various components, such as the printhead and paper feed mechanisms, to ensure precise ink application and paper handling. This alignment assists in maintaining print quality. The calibration process typically involves printing a test page with alignment patterns or color gradients.\n\nThe printer then analyzes the test page and makes adjustments as needed to ensure accurate printing. Depending on the printer model, calibrations may be performed automatically or manually through the printer's settings menu. Regular calibration is essential for maintaining print quality and preventing issues.\n\nIt's recommended to calibrate the printer periodically, especially after replacing ink cartridges or performing maintenance tasks. With that said, some maintenance tasks that are specific to inkjet printers include cleaning the printheads, replacing ink cartridges, and clearing paper jams. Printheads can become clogged with dried ink or debris over time, leading to poor print quality or streaky prints.\n\nRegularly, cleaning the printheads is necessary to maintain clear and consistent ink application. Many inkjet printers offer built-in cleaning utilities accessible through the printer's settings menu. Alternatively, users can use print head cleaning kits for more thorough maintenance.\n\nAs ink levels deplete or cartridges become empty, it becomes necessary to replace them promptly to prevent interruptions in printing. Inkjet printers often feature ink level indicators to alert users when cartridges need replacement. Be sure to follow manufacturer guidelines for cartridge replacement, ensuring compatibility and proper installation to maintain print quality.\n\nPaper jams are common occurrences in inkjet printers and can disrupt printing operations if not addressed promptly. When a paper jam occurs, carefully remove the jammed paper from the printer following the manufacturer's instructions to avoid damaging internal components. Then clear any remaining paper fragments or debris from the paper path to prevent future jams.\n\nBy adhering to these maintenance tasks, users can ensure that their inkjet printers operate smoothly and reliably, producing high quality prints consistently.\n\nExam objective 3.8. Given a scenario, perform appropriate printer maintenance. Laser printer.\n\nLaser printers are a common printer type found in various environments, ranging from homes to offices and commercial settings. Laser printers are known for their speed, precision, and ability to handle high volume printing tasks, making them ideal for environments requiring efficient and reliable printing solutions. However, they are generally more complex than inkjet printers due to their internal mechanisms and the print imaging process they employ.\n\nTo begin, unlike inkjet printers that use liquid ink, laser printers use toner cartridges with fine powder. These cartridges are designed for accurate printing on paper and come in different types to match various printer models and printing needs. Moving on, we have the print imaging process.\n\nThis process serves as the foundation of laser printing and consists of several stages or phases. These phases include processing, charging, exposing, developing, transferring, fusing, and cleaning. This intricate process involves multiple components working together to produce high quality prints with exceptional clarity and detail.\n\nNow, I will explain this process step-by-step, so pay attention. First up, processing. The printing process begins with the digital data being loaded into the printer's onboard memory.\n\nThe data is converted into a format that the printer can interpret and use to create the desired output. It's worth noting that sufficient memory is necessary for this process, as the entire job must be loaded into the printer's memory before printing can begin. This ensures smooth and uninterrupted printing, as the printer has all the necessary data readily available to complete the job efficiently.\n\nThe next step is charging. In the charging phase, the photosensitive drum or imaging drum gets ready to capture the image you want to print. Picture this, the drum is like a blank canvas waiting to receive a painting.\n\nBut instead of using paint, it uses something called static electricity. You might have experienced static electricity before, like when you touch a metal object and feel a small shock. In the charging stage, the drum is uniformly charged with static electricity.\n\nThis prepares the drum almost like priming a canvas before painting on it. Now, why does the drum need to be charged? Well, the static electricity helps the drum attract and hold onto the image that will be printed.\n\nIt's like giving the drum a magnetic pull, so when the image is exposed onto it later, it sticks in all the right places. After charging, the next step is exposure. In the exposure phase, things get really interesting.\n\nImagine the drum inside the printer, waiting patiently with its static electricity, all charged up from the previous stage. Now, it's time for the real magic to happen. Picture this, a laser beam in the printer acts like a spotlight.\n\nThis spotlight shines onto the charged photosensitive drum, removing the static charge wherever it shines, creating a kind of secret invisible image of what you want to print on the surface of the photosensitive drum. Now, it is time for the developing phase. In this phase, the electrostatic image created during the exposing phase is transformed into a visible image on the drum.\n\nHere's how it works. Once the electrostatic image is formed on the drum, tiny particles of toner, which are positively charged, are attracted to the negatively charged areas of the drum where the image resides. It's like a magnetic attraction.\n\nWherever there's a negative charge on the drum, the positively charged toner particles stick to it, forming the image. In other words, the toner particles fill in the invisible outline created during the exposing phase, making the image visible on the drum's surface. Moving on, we get to the transfer phase.\n\nDuring this step, the developed toner image on the drum is transitioned onto the paper. As the paper moves past the drum, the toner particles leave the drum and are attracted to the positively charged surface of either the transfer belt or the transfer roller. This process is similar to a stab transferring ink onto paper, except in this case, it involves toner.\n\nNow, don't think that we're all finished just because we've transferred the toner powder to the paper. To complete the print imaging process, we will need to take an extra step called fixing or fusing to ensure the toner image is firmly bonded to the paper's surface. To achieve this, the paper heads into a part of the printer called the fuser assembly.\n\nInside, it meets a pair of heated rollers. These rollers apply heat and pressure to the paper, effectively melting the toner particles. As they melt, they fuse into the fibers of the paper, creating a permanent bond.\n\nOnce the paper exits the fuser assembly, the toner image is now firmly fixed onto the paper. This ensures that the printout is durable and won't smudge or smear it easily. That is also why the printouts exiting a laser printer are warm to the touch.\n\nIn the final step of the laser printing process, we reach the cleaning phase. After the toner image has been successfully transferred and fused onto the paper, it's important to ensure that any remaining toner on the photosensitive drum is removed. This helps maintain print quality and prevents contamination in future print jobs.\n\nDuring the cleaning phase, a cleaning blade or brush delicately removes any excess toner from the drum surface. This ensures that the drum is clean and ready for the next printing cycle. Wow, that is a lot going on for a single printed page.\n\nWith all those moving parts, heat, and pressure, the need for maintenance is inevitable. To keep your laser printer running smoothly and producing high quality prints, regular maintenance is essential. Here are some common maintenance tasks you should perform.\n\nReplacing the toner. When the toner cartridge runs low or empty, it's time to replace it with a new one. Keeping a spare toner cartridge on hand ensures that you can quickly swap it out when needed, minimizing downtime.\n\nApply a maintenance kit. Periodically, it's recommended to apply a maintenance kit to your laser printer. These kits typically include replacement parts such as fuser assemblies, transfer rollers, cleaning blades, and other wearable components.\n\nBy replacing these components as part of routine maintenance, you can prolong the life of your printer and maintain print quality. Additionally, some laser printers feature counters that keep track of the number of pages printed in order to signal when maintenance tasks are due. It's essential to reset these counters after completing maintenance tasks or replacing consumable parts to maintain accurate tracking and scheduling of maintenance activities.\n\nAnd then there is cleaning. Regularly cleaning the printer's exterior and interior components can help remove dust, toner residue, and other debris that can affect print quality and performance. Be sure to follow manufacturer guidelines and use lint-free cloths or swabs dampened with isopropyl alcohol for cleaning.\n\nBy performing these maintenance tasks regularly, you can keep your laser printer in optimal condition, minimize downtime, and ensure that it continues to produce high-quality prints. Now that we've examined the major components of a laser printer, including the print imaging process and laser printer maintenance, it's important to understand the calibration process that helps keep these components operating in harmony and with precision. During calibration, the printer's internal sensors and mechanisms are adjusted to compensate for any variations or inconsistencies in print output.\n\nThe calibration process typically involves printing a test page with alignment patterns or color gradients. The printer then analyzes the test page and makes adjustments as needed to ensure accurate printing. Depending on the printer model, calibrations may be performed automatically or manually through the printer's settings menu.\n\nRegular calibration is essential for maintaining print quality and preventing issues. It's recommended to calibrate the printer periodically, especially after replacing toner cartridges or performing maintenance tasks.\n\nExam objective 3.8. Given a scenario, perform appropriate printer maintenance. Thermal printer.\n\nThermal printers combine simplicity and efficiency when creating tangible copies of digital information. Have you ever been handed a receipt at the store? Chances are it was produced by a thermal printer.\n\nUnlike the traditional inkjet or laser printers you're familiar with, thermal printers have a unique trick up their sleeve. They use heat, not ink or toner, to bring images to life on specially coated paper. This cutting edge method isn't just a novelty, it boasts a host of benefits, including straightforward operation, fast printing speeds, and unparalleled durability.\n\nA typical thermal printer comprises several key components working in harmony. First, we have the feed assembly responsible for pulling the thermal paper through the printer. This component ensures a smooth and consistent printing process.\n\nNext, we have the true star of the show, the heating element. This component is the fiery core of the operation. It generates heat with pinpoint accuracy, activating specific areas of the thermal paper with a delicate touch.\n\nAnd what about the thermal paper itself? It's no ordinary paper. This paper is coated with a special chemical layer that tingles with excitement at the mere whisper of heat.\n\nAs the heating element activates, the heat sensitive paper reacts, bringing forth crisp characters and images. Now, with heat being the catalyst, let's take a closer look at heat sensitivity in thermal printing. The sensitivity of the paper to heat plays a pivotal role in achieving optimal print quality.\n\nPapers with varying levels of sensitivity react differently to the heat generated by the printer's heating element. Adjusting the temperature of the heating element is essential to strike the right balance. Manufacturers often provide guidelines for configuring the temperature to ensure a clear and crisp printout without compromising the integrity of the paper.\n\nHigher sensitivity papers require less heat to produce vivid images, but they may be more susceptible to fading over time. Moreover, proper storage conditions are paramount to maintain the sensitivity of thermal paper. Exposure to excessive heat or humidity can degrade the paper's performance over time.\n\nTherefore, it's important to store thermal paper in a cool, dry place away from direct sunlight to preserve its quality and ensure consistent printing results. Lastly, let's talk maintenance. Performing regular maintenance on a thermal printer helps in avoiding common issues and ensures consistent performance.\n\nThis includes the timely replacement of depleted paper rolls to prevent printing interruptions and ensure seamless operation. When the paper rolls run low, replacing them promptly is essential to maintain workflow efficiency and avoid any downtime in printing tasks. Next, it's important to clean the heating element.\n\nPeriodically cleaning the heating element is essential for removing any accumulated residue buildup. Over time, debris and residue from the printing process can accumulate on the heating element, potentially impairing print quality and even causing overheating issues. Regular cleaning ensures that the heating element operates at optimal efficiency, maintaining consistent print quality and preventing any potential overheating-related malfunctions.\n\nFurthermore, removing debris from the printer mechanism reduces the risk of jams and other mechanical malfunctions, thus prolonging the printer's lifespan. By adhering to these maintenance tasks, users can ensure that their thermal printers can continue to operate smoothly and reliably. Exam objective 3.8, given a scenario, perform appropriate printer maintenance.\n\nImpact printer. Impact printers are a class of printing devices that rely on mechanical force to transfer characters and images onto paper. This force is typically generated by a print head striking an ink ribbon against the paper, creating characters through a series of dots or lines.\n\nThis traditional printing method offers several advantages, including the ability to print on multi-part forms and card and paper, making impact printers ideal for business applications, such as invoice printing, service ticketing, and contract printing. While they may not match the speed or resolution of modern non-impact printers, impact printers continue to find their place in business environments. Impact printers operate through a series of key components working in tandem to produce printed output.\n\nAt the heart of the operation is the print head, a mechanism responsible for striking against an ink ribbon with precision. This impact creates characters or images on the paper by transferring ink from the ribbon onto the page. The ribbon, which is attached to the print head assembly, sits between the print head and the paper.\n\nIt acts as the intermediary, carrying the ink and ensuring uniformity in printing. As the print head moves across the paper, it applies pressure at specific points, resulting in the formation of characters or images. Guiding the paper through the printer is the tractor feed mechanism.\n\nThis component moves the paper in a controlled manner, ensuring smooth and accurate positioning beneath the print head. By coordinating the movement of the paper, the tractor feed mechanism ensures precise alignment and consistent printing across the page. Together, these components work seamlessly to produce clear and legible prints with every operation.\n\nImpact printers also have specific paper requirements. They use impact paper, also known as continuous form paper. This type of paper plays a crucial role in the operation of impact printers.\n\nUnlike standard sheets used in inkjet or laser printers, impact paper typically comes in continuous rolls or stacks of perforated sheets joined together. This unique format enables uninterrupted printing of lengthy documents like invoices or receipts without the hassle of frequent reloading. Moreover, impact paper may feature a multipart construction known as carbon copies.\n\nCarbon copies function by utilizing pressure from the print head to transfer ink from the ribbon onto the top layer of paper, while subsequent layers are coated with carbon that is released by the physical pressure. This facilitates the creation of duplicate or triplicate copies with each printout. This streamlines the print process, allowing for efficient and convenient production of multiple copies without additional printing steps.\n\nLastly, while impact printers are known for their robustness and reliability, they do require a bit of maintenance to ensure optimal performance. Regular maintenance tasks are essential to keep these printers running smoothly and to extend their lifespan. One such maintenance task involves replacing the printer's ribbon.\n\nOver time, the ribbon becomes worn out, leading to faded or illegible prints. By replacing the ribbon when necessary, users can ensure that print quality remains consistent. Additionally, the print head, which plays a central role in transferring ink onto the paper, may also require replacement.\n\nAs with any mechanical component, the print head can wear out over time, affecting print quality and consistency. Regularly, replacing the print head ensures that the printer continues to produce clear and legible prints. Furthermore, it's important to always have additional paper stock on hand.\n\nThough it is continuous feed paper, it won't last forever. By performing regular maintenance tasks, such as replacing the ribbon, print head, and paper, users can ensure that their impact printers continue to operate smoothly and reliably.", "uyghur": "Exam Objective 3.8 — Printer Maintenance\n\n## Inkjet Printer\nInkjet printer paper ئۈستىگە ink cartridge دىكى سىياھنى كىچىك droplets شەكلىدە چىقىرىپ text/image ھاسىل قىلىدۇ.\n\n### Main components\n- **Ink cartridge:** ink reservoir.\n- **Printhead:** ink نى precise pattern بىلەن paper غا پۈركۈيدۇ؛ cartridge دىن ئايرىم ياكى cartridge بىلەن integrated بولالايدۇ.\n- **Pickup roller:** tray دىن بىر ۋاراق paper نى تارتىپ كىرگۈزىدۇ.\n- **Feed rollers:** paper نى printer ئىچىدە توغرا يۆتكەيدۇ.\n- **Carriage belt:** printhead assembly نى paper كەڭلىكى بويىچە ئالدى-كەينى precise ھەرىكەتلەندۈرىدۇ.\n\n### Calibration\nPrinter printhead بىلەن paper feed alignment نى تەڭشەيدۇ. Test page، alignment pattern ياكى color gradient بېسىپ automatic ياكى manual calibration قىلىشى مۇمكىن. Cartridge ئالماشتۇرغاندىن كېيىن calibration پايدىلىق.\n\n### Inkjet maintenance\n- Printhead clog/dried ink بولسا cleaning utility ياكى cleaning kit بىلەن تازىلاش.\n- Ink تۈگەپ قالسا manufacturer-compatible cartridge نى توغرا ئالماشتۇرۇش.\n- Paper jam بولسا manufacturer instruction بويىچە paper نى ئېھتىيات بىلەن چىقىرىش، قالغان paper fragment/debris نى تازىلاش.\n\n## Laser Printer\n\nLaser printer speed، precision ۋە high-volume printing ئۈچۈن ياخشى. Inkjet تىن پەرقلىق، سۇيۇق ink ئەمەس **toner powder** ئىشلىتىدۇ.\n\n### Laser printing imaging process\nCompTIA ئۈچۈن بۇ تەرتىپنى بىلىش مۇھىم:\n\n1. **Processing** — Print job digital data printer memory غا يۈكلىنىپ، printer چۈشىنىدىغان شەكىلگە ئايلاندۇرۇلىدۇ. Job نىڭ تولۇق data سىنى بىر تەرەپ قىلىش ئۈچۈن يېتەرلىك printer RAM لازىم.\n2. **Charging** — Photosensitive/imaging drum بىر خىل static electrical charge بىلەن تەكشى charge قىلىنىدۇ.\n3. **Exposing** — Laser charged drum ئۈستىدە لازىملىق نۇقتىلارنىڭ charge ىنى ئۆزگەرتىپ، كۆرۈنمەيدىغان electrostatic image ھاسىل قىلىدۇ.\n4. **Developing** — Charged toner particles drum دىكى image pattern غا تارتىلىپ، كۆرۈنىدىغان toner image ھاسىل قىلىدۇ.\n5. **Transferring** — Toner image drum دىن paper/transfer belt ياكى roller ئارقىلىق paper غا يۆتكىلىدۇ.\n6. **Fusing** — Paper **fuser assembly** دىكى قىزىتىلغان rollers ئارىسىدىن ئۆتىدۇ؛ heat + pressure toner نى paper fiber غا ئېرىتىپ چاپلايدۇ. شۇڭا laser printer دىن چىققان paper ئىسسىق بولۇشى مۇمكىن.\n7. **Cleaning** — Cleaning blade/brush drum ئۈستىدىكى قالغان toner نى تازىلاپ، كېيىنكى print cycle غا تەييارلايدۇ.\n\n### Laser printer maintenance\n- Toner cartridge تۈگەپ قالسا ئالماشتۇرۇش.\n- **Maintenance kit**: fuser، transfer roller، cleaning blade ۋە باشقا wear parts بولۇشى مۇمكىن.\n- Printer page counter maintenance interval نى كۆرسىتىشى مۇمكىن؛ maintenance دىن كېيىن counter نى reset قىلىش.\n- Dust/toner residue نى manufacturer guideline بويىچە lint-free cloth/swab ۋە لازىم بولسا isopropyl alcohol بىلەن تازىلاش.\n- Toner ياكى maintenance دىن كېيىن calibration/test page قىلىش.\n\n## Thermal Printer\n\nThermal printer ink ياكى toner ئەمەس، **heat-sensitive thermal paper** + heating element ئىشلىتىدۇ. Store receipt كۆپىنچە مۇشۇ تۈر.\n\n### Main components\n- **Feed assembly:** thermal paper نى تارتىپ ئۆتكۈزىدۇ.\n- **Heating element:** لازىملىق نۇقتىلارنى precise قىزىتىدۇ.\n- **Thermal paper:** chemical coating heat قا reaction قىلىپ text/image ھاسىل قىلىدۇ.\n\nPaper sensitivity غا قاراپ heating temperature توغرا بولۇشى كېرەك. Heat بەك يۇقىرى ياكى humidity/sunlight دا ساقلاش thermal paper نىڭ quality سىنى تۆۋەنلىتىشى ياكى print نىڭ تېز ئۆچۈشىگە سەۋەب بولالايدۇ.\n\n### Thermal maintenance\n- Paper roll تۈگەشتىن بۇرۇن ئالماشتۇرۇش.\n- Heating element ئۈستىدىكى residue/debris نى دائىم تازىلاش.\n- Paper path/mechanism دىكى debris نى تازىلاپ jam نىڭ ئالدىنى ئېلىش.\n\n## Impact Printer\n\nImpact printer mechanical force ئارقىلىق **print head → ink ribbon → paper** غا سوقۇپ characters/images ھاسىل قىلىدۇ. Multi-part forms، invoices، service tickets، contracts قاتارلىق carbon-copy ئىشلىرىدا پايدىلىق.\n\n### Components\n- **Print head:** ribbon غا سوقۇپ image/text ھاسىل قىلىدۇ.\n- **Ink ribbon:** print head بىلەن paper ئارىسىدا ink يەتكۈزىدۇ.\n- **Tractor feed:** continuous paper نى تۆشۈكلىرىدىن تۇتۇپ توغرا ھەرىكەتلەندۈرىدۇ.\n- **Continuous-form / impact paper:** perforated ئۇلانغان ۋاراقلار؛ multi-part carbon copy بولالايدۇ.\n\n### Impact maintenance\n- Ribbon faded بولسا ئالماشتۇرۇش.\n- Worn print head نى ئالماشتۇرۇش.\n- Continuous-form paper stock نى تولۇقلاپ تۇرۇش.\n\n# Domain 4 — Virtualization and Cloud Computing\n\n#"}, {"id": "4.1", "number": "4.1", "domain": "4", "domain_en": "Virtualization & Cloud", "domain_ug": "مەۋھۇملاشتۇرۇش ۋە بۇلۇت", "english": "Exam objective 4.1, explain virtualization concepts. Desktop virtualization. Desktop virtualization fundamentally changes how we interact with computers by decoupling or separating the content displayed on your screen from the physical hardware used for processing and storage.\n\nPicture a scenario where your computer's operating system, all the applications you use, and your files, are not stored directly on your device. Instead, they reside on a server that's accessible over a network connection. This means that regardless of the device you're using or where you are, you can access your desktop environment with all your familiar applications and files intact.\n\nThis paradigm shift embodies the core of desktop virtualization, providing unmatched flexibility, accessibility, and convenience in our technological interactions. Virtual desktop infrastructure, or VDI, takes this concept further. For the purpose of this training course, I will be simplifying this concept down to three main parts, the client, the server, and the virtual machines that house our virtual desktops.\n\nThe client, which in this context may be referred to as a thin client, is your computer or device that you use to connect to the virtual machine. It could be a laptop, workstation, or even a tablet or a smartphone. The server is the central hub that stores and manages all the virtual machine setups.\n\nThis server can be local, referred to as on-premises, or located in the cloud. Then there are the virtual machines, which house our virtual desktops. These virtual machines reside on the server and are controlled by a special piece of software known as a Type 1 hypervisor.\n\nWith VDI, each user will have their own virtual machine, complete with an operating system, applications, and their personal files. Just imagine each virtual machine as a personalized workspace, tailor-made for each user. Together, these components form the backbone of VDI.\n\nNow let's walk through how a connection works. Imagine you're at home or in the office and need to do some work. You grab your laptop, which acts as the client device, and turn it on.\n\nNow it is time to connect to the server. To do this, you would open up a program, website, or domain-based connection on your laptop designed to connect you to your virtual desktop. Next, the program will prompt you to enter your username and password.\n\nOnce you do, it knows who you are and where to take you. The program then communicates with the server, saying, \"Hey, someone wants to use their virtual desktop. Can you help them out?\" The server looks up your details and locates the virtual machine that contains your virtual desktop.\n\nThe server says, \"Sure thing,\" and sets up a special connection just for you. From here, you will be able to interact with a graphical user interface, or GUI, while all the processing and storage takes place on the server. And that's how a connection works in VDI.\n\nIt's like having your personal computer stored remotely. That is available whenever you need it. So far, you know what VDI is and how it works.\n\nNow it is time to discuss some of its benefits. Firstly, VDI provides agility by allowing clients and virtual desktops to be easily initiated and terminated from the virtual desktop infrastructure. Additionally, it centralizes desktop management, leading to increased productivity.\n\nFurthermore, VDI enhances security by centralizing data and applications, granting companies remote control over users' operating systems and enabling strict access controls. With VDI, you get all these benefits and more, while also reducing operational costs and the need to manually configure each device, be it a workstation, laptop, tablet, or smartphone. Exam objective 4.1, explain virtualization concepts.\n\nClient-side virtualization. As previously discussed, desktop virtualization and the virtual desktop infrastructure involves hosting desktop environments on remote servers. In this model, the desktop environment, including the operating system, applications, and user data, resides centrally on a server and is accessed by a user's client device over a network connection.\n\nWhile this works great for many use cases, we do have another virtualization option. This option is called client-side virtualization, and it involves running virtual machines directly on the end user device. In this model, a Type 2 hypervisor, or virtualization software, is installed on the client device, not a remote server, allowing users to create and run multiple virtual machines concurrently.\n\nEach virtual machine operates as an isolated environment with its own operating system and applications, enabling users to run different operating systems or experiment with software configurations without affecting the host system. Next, I will take you a bit deeper into this topic and show you what client-side virtualization might look like. In the image here, I have a laptop, which will be referred to as the host device in this client-side virtualization setup.\n\nThis device has physical hardware, such as a CPU, memory, storage, and a network connection. This host device also has an operating system installed on it. So far, this setup is just like any other until I install a Type 2 hypervisor application.\n\nOnce I do that, I unlock the power of client-side virtualization. With a Type 2 hypervisor installed on the host OS, I can create and control virtual machines, complete with their own isolated operating systems, applications, and data files. Each virtual machine will also be allocated a configurable portion of the host machine's physical resources with which to use.\n\nWhile you can configure the virtual machine with as little or as much resources as you would like, just make sure to save enough resources for the host OS. Moving on, client-side virtualization provides a versatile solution for various use cases. Firstly, it can serve as a sandbox environment, allowing users to create isolated virtual machines for testing new software, experimental code, or conducting system experiments without impacting their primary operating environment.\n\nThis ensures that any potential issues or conflicts are contained within the virtual environment, minimizing risks to the host system. Additionally, client-side virtualization is invaluable for software development and testing, enabling developers to replicate different operating systems, hardware configurations, or network setups for comprehensive testing and validation of applications. Furthermore, it facilitates the virtualization of legacy software or operating systems, enabling organizations to continue using outdated applications without the need for dedicated legacy hardware.\n\nLastly, client-side virtualization supports cross-platform development and testing by allowing users to create virtual machines with different operating systems, ensuring seamless performance across diverse platforms. Overall, client-side virtualization enhances productivity, streamlines testing processes, and overcomes compatibility challenges in software development and deployment. Exam objective 4.1, explain virtualization concepts.\n\nHypervisors. Now, you might recall that we encountered the term hypervisor in our studies of desktop virtualization, and then again when I covered client-side virtualization. Well, that is because a hypervisor is the software that makes virtualization possible.\n\nA hypervisor is a software layer that allows multiple operating systems to run on a single physical hardware platform simultaneously. It accomplishes this by dividing up the computer's resources, like its processing power, memory, and storage, so that different programs or operating systems can run on it without getting in each other's way. Now that we have a solid definition for hypervisor in place, we will move on to learning about the two main types, which are the Type 1 hypervisor and the Type 2 hypervisor.\n\nType 1 hypervisors, also known as bare metal hypervisors, operate directly on the host hardware without requiring an underlying operating system. They have direct access to physical resources, offering high performance and efficiency, which makes them suitable for enterprise environments and beta centers where virtualizing servers is common practice. In contrast, Type 2 hypervisors, also known as hosted hypervisors, run as applications on top of conventional operating systems like Windows, Mac OS, or Linux.\n\nThey rely on the underlying operating system to manage hardware resources and provide services to virtual machines. Type 2 hypervisors are often used for client-side virtualization. The primary distinction between Type 1 and Type 2 hypervisors lies in their architecture and how they interact with hardware, with Type 1 offering superior performance and scalability for larger-scale virtualization deployments, while Type 2 is more suitable for smaller-scale or individual virtualization needs.\n\nAfter you install a hypervisor, you can open up its user interface and begin to create, start up, shut down, and terminate any number of virtual machines. You will also have the ability to control resource allocations to each instance, including the amount of memory or RAM, the number of CPU cores. You can even set up various types of networking capabilities.\n\nLastly, let's explore virtualization security. When it comes to securing virtualized environments, several measures can be taken. One strategy is to limit the ability to create virtual machines altogether.\n\nDisabling virtualization in the BIOS or UEFI settings is a security measure used to prevent unauthorized or unintended virtual machine creation and execution on a system. Next, we have a virtual trusted platform module, or VTPM. This technology is used in virtualized environments to provide security functions similar to a physical TPM.\n\nThe virtual trusted platform module enables the creation and management of a virtual TPM instance within virtual machines, allowing them to benefit from TPM functionality without requiring physical TPM hardware. This technology enhances security by enabling features such as secure boot and hardware-based encryption within the guest operating system. Even with all this security in place, the primary security concern facing a virtualized environment is an attack known as virtual machine escape.\n\nThis is a security vulnerability in virtualized environments where an attacker gains unauthorized access to the host system or hypervisor from within a guest virtual machine. This exploit allows the attacker to break out of the confines of the virtual machine and execute malicious code or access sensitive information on the host system. Virtual machine escape vulnerabilities pose a significant security risk as they can potentially compromise the integrity and security of the entire virtualized environment.\n\nExam objective 4.1, explain virtualization concepts. Containers. Now that we understand desktop virtualization, client-side virtualization, and hypervisors, there is one more important concept to discuss before wrapping up this objective, and that concept is containers.\n\nA container is a lightweight method of packaging and running an application along with everything it needs to operate. This includes the application itself, the libraries it depends on, configuration files, and other required supporting components. By packaging all of these pieces together, a container ensures that the application behaves the same way no matter where it runs.\n\nWhether the container is deployed on a developer's laptop, a company server, or a cloud environment, the application inside the container will operate consistently because all of its required components travel with it. To understand how containers work, it helps to compare them to the virtual machines we previously discussed. In a virtual machine environment, each virtual machine contains its own complete operating system, along with its applications and supporting files.\n\nThese virtual machines rely on a hypervisor to divide and manage the physical hardware resources, such as CPU, memory, and storage. The hypervisor keeps each virtual machine isolated from the others so that they do not interfere with one another. While this design provides strong separation between systems, it also means that each virtual machine requires additional system resources because every instance includes a full operating system.\n\nThis increases storage usage and memory requirements, and it can take longer for a virtual machine to start up. Containers take a different and more efficient approach. Instead of running a full operating system for every instance, containers share the host system's operating system kernel.\n\nThe kernel is the core part of the operating system that communicates directly with the hardware. Because containers share this kernel, they do not include their own full operating system. This means that containers are dependent on the operating system of the host system.\n\nIn other words, a container must run on a system that uses the same type of operating system kernel. For example, containers built for a Linux environment run on a Linux host system. This is different from virtual machines, which can run completely different operating systems because each virtual machine includes its own full operating system.\n\nBecause containers share the host operating system kernel, multiple containers can run on the same system while still remaining logically isolated from one another. Each container behaves as if it has its own environment, but in reality, they are all using the same underlying operating system resources. Since containers do not require a full operating system, they are significantly smaller and can start up much faster than traditional virtual machines.\n\nThis efficiency makes containers especially useful in modern application development and cloud computing environments. Developers can package an application inside a container and move it easily between systems without worrying about differences in software versions or missing dependencies. For example, a web application that runs inside a container on a developer's laptop can be deployed to a testing server or a cloud platform with confidence that it will behave the same way as long as the host system supports the same operating system environment required by the container.\n\nIt is important to understand that containers are not intended to completely replace virtual machines. Instead, they serve a different purpose. Virtual machines are ideal when you need to run entirely separate operating systems on the same hardware, such as running Windows and Linux on the same physical server.\n\nContainers are designed to run applications efficiently within the same operating system environment. In many real world environments, these technologies are often used together. For example, an organization might run several virtual machines on a server using a hypervisor and then run multiple containers inside those virtual machines to host individual applications.\n\nThis approach allows administrators to combine the strong operating system isolation of virtual machines with the speed and efficiency of containers. To summarize the key difference, virtual machines rely on a hypervisor and include a complete operating system for every instance. Containers share the host operating system kernel and package only the application and its required components.\n\nRegardless of the approach used, both technologies provide isolation and flexibility when running applications and workloads.", "uyghur": "Exam Objective 4.1 — Virtualization Concepts\n\n## Desktop Virtualization / VDI\n\nDesktop virtualization دا user نىڭ desktop environment ى local device تا تولۇق ساقلانماي، remote server/cloud تا ئىجرا بولىدۇ. User network ئارقىلىق OS، applications ۋە files غا كىرىدۇ.\n\n**VDI (Virtual Desktop Infrastructure)** نى بۇ course ئۈچ بۆلەك بىلەن چۈشەندۈرىدۇ:\n1. **Client / thin client** — laptop، workstation، tablet ياكى smartphone؛ virtual desktop قا ئۇلىنىدىغان endpoint.\n2. **Server** — virtual machines نى ساقلاپ/باشقۇرىدىغان on-premises ياكى cloud infrastructure.\n3. **Virtual machines** — ھەر user نىڭ OS، apps ۋە personal files بار virtual desktop instance ى؛ server ئۈستىدە hypervisor ئارقىلىق ئىجرا بولىدۇ.\n\nVDI connection جەريانىدا user client application/web portal ئارقىلىق username/password بىلەن authenticate قىلىدۇ. Server شۇ user غا تەۋە VM نى تاپىدۇ، GUI نى client قا كۆرسىتىدۇ؛ processing ۋە storage ئاساسەن server تەرەپتە بولىدۇ.\n\n### VDI benefits\n- Desktop نى تېز provision/deprovision قىلىش.\n- Centralized management.\n- Data/application نى centralize قىلىپ security/control نى ياخشىلاش.\n- Remote access.\n- ھەر physical endpoint نى قولدا ئوخشاش configure قىلىش ئېھتىياجىنى ئازايتىش.\n\n## Client-side Virtualization\n\nClient-side virtualization دا VM remote server دا ئەمەس، user نىڭ ئۆزىنىڭ host computer ىدا ئىجرا بولىدۇ. ئادەتتە host OS ئۈستىگە **Type 2 hypervisor** قاچىلىنىدۇ.\n\nHost نىڭ CPU، RAM، storage ۋە network resource لىرىنىڭ بىر قىسمى VM لارغا allocate قىلىنىدۇ. VM نىڭ ئۆزىگە ئايرىم guest OS، apps ۋە data بولىدۇ. Resource نى VM غا بەك كۆپ بەرسىڭىز host OS قا يېتەرلىك resource قالماسلىقى مۇمكىن.\n\n### Use cases\n- Sandbox/test environment.\n- Software development/testing.\n- Different OS/hardware/network configuration نى سىناش.\n- Legacy OS/application نى dedicated old hardware سىز ئىشلىتىش.\n- Cross-platform development.\n\n## Hypervisors\n\n**Hypervisor** بىر physical hardware ئۈستىدە كۆپ OS/VM نى بىرلا ۋاقىتتا ئىشلىتىشكە ئىمكان بېرىدىغان software layer.\n\n### Type 1 — Bare-metal\n- Hypervisor بىۋاسىتە physical hardware ئۈستىدە.\n- Underlying general-purpose host OS تەلەپ قىلمايدۇ.\n- Performance، efficiency، scalability يۇقىرى.\n- Server/data center/enterprise virtualization دا كۆپ.\n\n### Type 2 — Hosted\n- Windows/macOS/Linux قاتارلىق host OS ئۈستىدە application سۈپىتىدە ئىشلەيدۇ.\n- Hardware resource نى host OS ئارقىلىق ئىشلىتىدۇ.\n- Client-side virtualization، lab، individual use قا ماس.\n\nHypervisor ئارقىلىق VM create/start/stop/delete، RAM/CPU core allocation ۋە virtual networking نى configure قىلغىلى بولىدۇ.\n\n### Virtualization Security\n- BIOS/UEFI دا virtualization نى disable قىلىپ unauthorized VM execution نى چەكلەش مۇمكىن.\n- **vTPM (Virtual Trusted Platform Module):** VM ئىچىدە TPM-like security functions، Secure Boot/encryption support تەمىنلەيدۇ.\n- **VM escape:** attacker guest VM ئىچىدىن hypervisor/host boundary دىن «چىقىپ»، host ياكى باشقا sensitive resource غا unauthorized access قىلىدىغان خەتەر. بۇ virtualized environment ئۈچۈن ئېغىر security risk.\n\n## Containers\n\n**Container** application + libraries + configuration + dependencies نى بىر lightweight package قا جەم قىلىپ ئىجرا قىلىش ئۇسۇلى. بۇ application نىڭ developer laptop، server ياكى cloud دا ئوخشاش behavior قىلىشىغا ياردەم بېرىدۇ.\n\n### Container vs VM\n**VM:**\n- ھەر instance ئۆزىنىڭ تولۇق guest OS ى بار.\n- Hypervisor CPU/RAM/storage نى بۆلۈپ باشقۇرىدۇ.\n- OS-level isolation كۈچلۈك، ئەمما resource usage چوڭ ۋە startup ئاستىراق.\n\n**Container:**\n- تولۇق OS نى ھەر instance قا قوشمايدۇ.\n- Host OS **kernel** نى share قىلىدۇ.\n- Application + dependencies لا package قىلىنىدۇ.\n- كىچىك، تېز start، resource-efficient.\n- Host kernel/environment compatibility غا باغلىق.\n\nContainer لار بىر kernel نى share قىلسىمۇ logical isolation نى ساقلايدۇ. VM بىلەن container رىقابەتچى ئەمەس؛ real-world دا VM ئىچىدە كۆپ container ئىشلىتىلىشى مۇمكىن.\n\n**ئىمتىھان memory trick:**\n- VM → hypervisor + full guest OS.\n- Container → shared host kernel + app/dependencies.\n\n#"}, {"id": "4.2", "number": "4.2", "domain": "4", "domain_en": "Virtualization & Cloud", "domain_ug": "مەۋھۇملاشتۇرۇش ۋە بۇلۇت", "english": "Exam objective 4.2, summarize cloud computing concepts. Cloud models. Cloud computing is defined as a model for enabling convenient on-demand network access to a shared pool of configurable computing resources.\n\nFor example, networks, servers, storage, applications, and services. Additionally, these resources can be rapidly provisioned and released with minimal management effort or service provider interaction. In simpler terms, cloud computing refers to using remote servers on the internet to store, manage, and process data rather than relying on a local server or personal computer.\n\nTo assist with understanding this concept, I will compare cloud computing to renting a storage unit. Instead of needing to build and maintain your own storage space at home, which would require a lot of effort and resources, you can simply rent a storage unit from a company. Similarly, with cloud computing, instead of setting up and maintaining your own servers and infrastructure, you can use remote servers provided by cloud service providers like Amazon Web Services, Microsoft Azure, or Google Cloud Platform.\n\nIt's like outsourcing the storage and management of your data and computing resources to a specialized company that takes care of everything for you. With cloud computing, there are various cloud models that exist. Among these cloud models are public cloud, private cloud, hybrid cloud, and community cloud.\n\nEach model presents distinct characteristics and benefits tailored to address specific requirements and challenges. A public cloud owned and operated by third party providers offers scalable resources on demand, making it suitable for a wide range of applications and workloads. With a public cloud, organizations can access computing resources such as servers, storage, and applications over the internet without needing to invest in or maintain their own infrastructure.\n\nThis model allows for flexibility and agility as resources can be provisioned or scaled up and down quickly based on demand. Additionally, public cloud providers handle tasks such as infrastructure management, security, and maintenance, relieving organizations of these responsibilities and allowing them to focus on their core business activities. Conversely, a private cloud offers dedicated infrastructure solely for one organization, ensuring enhanced control and security over data and applications.\n\nThis isolation from others minimizes the risk of unauthorized access and data breaches. With complete control over data management, compliance with regulatory requirements and internal policies is ensured. Private clouds also guarantee reliability and availability, maintaining access even during local internet outages.\n\nThe limited attack surface increases security, making private clouds ideal for storing sensitive information. Hybrid clouds blend public and private cloud features, providing flexibility in workload deployment and data storage. Organizations can host sensitive data on site while utilizing the scalability of public cloud resources for other tasks.\n\nThis integration enables seamless data movement between environments, optimizing resource utilization based on performance, security, and cost considerations. Overall, hybrid clouds offer a versatile solution for organizations seeking to balance control, security, scalability, and cost effectiveness in their IT infrastructure. Finally, community clouds serve a defined group of organizations with shared interests or requirements, fostering collaboration while maintaining autonomy and control.\n\nThese various cloud computing models empower organizations to tailor their IT infrastructure to align with their unique objectives, regulatory constraints, and operational needs. Exam objective 4.2, summarize cloud computing concepts. Cloud characteristics.\n\nCloud computing has revolutionized the way organizations manage and utilize their IT resources, offering a plethora of benefits, such as flexibility, scalability, and cost effectiveness. At the heart of cloud computing lie several key characteristics that underpin its functionality and value proposition. These characteristics, including shared resources, metered utilization, rapid elasticity, high availability, file synchronization, and multi-tenancy, collectively contribute to the efficiency, reliability, and accessibility of cloud services.\n\nUnderstanding these fundamental aspects is essential for organizations seeking to leverage the full potential of cloud computing in their operations. So let's define each characteristic and add them to our vocabulary. Shared resources in cloud computing refers to the pooling of computing resources, such as servers, storage, and networking, to serve multiple users or tenants.\n\nThis is often referred to as resource pooling. In this model, the underlying physical infrastructure is shared among many customers, and resources are dynamically allocated and reassigned based on demand. This allows cloud providers to efficiently utilize their hardware while delivering scalable services to many users at the same time.\n\nThe opposite approach is known as dedicated resources. In that model, the computing resources, such as servers, storage, or networking components, are not shared. Instead, they are reserved for a single customer or tenant.\n\nMetered utilization refers to the capability of cloud computing systems to measure and charge only for the resources that are actually used. This provides transparency and accountability for both cloud providers and their customers. Usage is typically measured on a pay-as-you-go basis, meaning organizations are billed according to the amount of computing resources they consume rather than paying for fixed infrastructure.\n\nCloud providers track several types of resource usage. Common examples include CPU utilization, which measures how much processing power is consumed, storage usage, which tracks how much data is stored in the cloud environment, and network ingress and egress, which measures the amount of data entering and leaving the cloud network. By monitoring these metrics, providers can accurately bill customers based on their actual resource consumption.\n\nThis metered approach allows organizations to scale their infrastructure up or down as needed while maintaining control over costs. As a result, companies can optimize resource allocation and budgeting based on real usage rather than estimated capacity. Rapid elasticity is the ability of cloud computing systems to scale resources up or down quickly and automatically in response to changing demand.\n\nThis scalability is often achieved through the dynamic provisioning and deprovisioning of resources. Cloud environments can rapidly scale resources to accommodate fluctuations in workload demand, such as adding resources during the peak usage times and automatically removing it when the peak is over. For example, with an e-commerce website, more web servers can be quickly added to handle increased traffic.\n\nOverall, rapid elasticity enables cloud systems to be provisioned according to demand, allowing organizations to efficiently manage their resources and adapt to changing workload requirements without manual intervention. High availability refers to the ability of cloud computing systems to ensure that services and resources are accessible and operational for users when needed, typically through redundancy and fault tolerance. Cloud providers implement redundancy and fault tolerance across their infrastructure to minimize downtime and ensure continuous availability of services.\n\nThis includes measures to prevent a single point of failure, ensuring that if one component fails, redundant systems can immediately take over without interrupting service. Additionally, cloud environments can quickly failover to another server, data center, or region in the event of an outage, further enhancing availability and resilience. These failover mechanisms provide organizations with confidence in relying on cloud services for critical operations, knowing that their applications and data will remain accessible even in the face of hardware failures or maintenance activities.\n\nNext up, we have file synchronization. This is the process of ensuring that files and data are consistently updated and mirrored across multiple devices or locations, allowing users to access the latest versions of files from any device or location. Cloud storage services often include file synchronization capabilities, allowing users to sync files across devices and access them from anywhere with an internet connection.\n\nThis facilitates collaboration, data sharing, and remote access to files, improving productivity and efficiency for users and organizations. Lastly, we have multi-tenancy. Multi-tenancy is a cloud computing architecture in which a single system or infrastructure serves multiple customers, often referred to as tenants.\n\nEach tenant operates in a logically isolated environment, even though they are all using the same underlying physical hardware and platform. In a multi-tenant environment, the cloud provider manages the shared infrastructure while ensuring that each tenant's data, applications, and workloads remain separate and secure. From the user's perspective, it appears as though they have their own dedicated environment.\n\nBut in reality, the system is efficiently supporting many different organizations at the same time. This concept closely relates to the idea of shared resources that we discussed earlier. In most multi-tenant environments, multiple tenants share the same underlying computing resources, such as servers, storage, and networking infrastructure.\n\nThese resources are pooled and dynamically allocated as needed. However, some cloud providers also offer dedicated resource options within a multi-tenant platform. In those cases, a customer may have exclusive access to specific hardware while still benefiting from the overall cloud management platform and services.\n\nUnderstanding multi-tenancy helps explain how cloud providers efficiently support many different organizations at once while maintaining logical separation and security between tenants. Exam Objective 4.2, Summarize Cloud Computing Concepts. Cloud Service Types.\n\nWe're on the brink of wrapping up our exploration of Domain 4 in the CompTIA A+ Core 1 exam objectives. But hold onto your hats because we've got one more exciting topic to cover, cloud service types. Now, building upon our previous discussion of the diverse cloud deployment models, public, private, hybrid, and community, it's now time to learn about the various service types that comprise the cloud computing landscape.\n\nCloud services fall into three primary categories, infrastructure as a service, or IaaS, platform as a service, or PaaS, and software as a service, or SaaS. These service types represent distinct levels of abstraction and functionality, each offering unique benefits and use cases. Let's explore each of these service types in detail to gain a comprehensive understanding of their functionalities and advantages.\n\nIaaS serves as the foundational layer. It grants organizations access to fundamental computing resources like servers, storage, and networking infrastructure. Here, users have the autonomy to build and manage their virtual machines and networks remotely, allowing for seamless scalability according to demand.\n\nIaaS liberates businesses from the burden of investing in costly hardware and alleviates the complexities of maintenance, providing a flexible environment for building and hosting their data and applications. Building upon the infrastructure layer, PaaS elevates cloud computing by offering a comprehensive software development and deployment environment. Imagine PaaS as a streamlined construction site where software developers are empowered to build and deploy applications without worrying about the underlying infrastructure.\n\nPaaS platforms abstract away the intricacies of configuring servers and managing networking resources, enabling software developers to focus solely on coding. This model accelerates the development life cycle, fostering rapid application delivery and facilitating collaboration among development teams. At the pinnacle of cloud services lies SaaS.\n\nSaaS can be likened to a fully furnished home where users simply consumed ready-made applications over the internet. With SaaS, organizations can access a plethora of software applications from productivity suites to customer relationship management systems via web browsers or dedicated clients. This consumption-based model eliminates the need for installation, maintenance or updates, providing unparalleled convenience and accessibility for users.\n\nIn essence, cloud services empower organizations to leverage modern computing technologies while minimizing operational overhead and capital expenditures. Whether it's the flexibility of IaaS, the agility of PaaS or the convenience of SaaS, cloud computing serves as a catalyst for innovation, collaboration and business growth in today's digital landscape. Moving forward with this topic, you should also understand how responsibility is shared between users and cloud service providers across different service types.\n\nIn managing a cloud environment, this shared responsibility encompasses various components, including the data center, networking, storage, servers, virtualization, operating system, data and applications. For infrastructure as a service, users bear more responsibility for managing the operating system, applications and data. The cloud provider handles infrastructure-related tasks such as data center management, networking, storage, server maintenance and virtualization management.\n\nIn platform as a service, the cloud provider takes on more responsibility for managing the un
