ۈن major display technology نىڭ قانداق ئىشلەيدىغانلىقى، پەرقى ۋە use case ىنى بىلىش كېرەك.\n\n### LCD — Liquid Crystal Display\n\nLCD backlight نىڭ نۇرىنى liquid-crystal layer ئارقىلىق كونترول قىلىپ image ھاسىل قىلىدىغان flat-panel technology.\n\nھەر كىچىك picture element ئىچىدە **LCD cell** بار. Cell ئىچىدىكى liquid crystal electrical current بېرىلگەندە twist/align بولۇپ، قانچىلىك light ئۆتىدىغانلىقىنى كونترول قىلىدۇ.\n\nLiquid crystal ئۆزى light ھاسىل قىلمايدۇ؛ backlight نى كونترول قىلىدىغان tiny shutter غا ئوخشايدۇ.\n\n### Backlight ۋە “LED Monitor”\n\nBacklight — screen كەينىدىكى light source. Backlight بولمىسا LCD قاراڭغۇ.\n\nنۇرغۇن modern monitor دا backlight ئۈچۈن **LED — Light Emitting Diode** ئىشلىتىلىدۇ. شۇڭا «LED monitor» دېيىلگەن نۇرغۇن device ئەمەلىيەتتە LCD panel + LED backlight.\n\nImage نى يەنىلا LCD cell لار شەكىللەندۈرىدۇ.\n\nLCD separate backlight ئىشلىتىدىغان بولغاچقا **true black** ھاسىل قىلالمايدۇ؛ black image بولسىمۇ backlight panel كەينىدە يانغان بولىدۇ.\n\nLCD ئادەتتە cost-effective، reliable ۋە bright environment تا ياخشى ئىشلىگەنلىكى ئۈچۈن كەڭ ئىشلىتىلىدۇ.\n\n### IPS — In-Plane Switching\n\nLCD panel تۈرى.\n\nئەۋزەللىكى:\n- excellent color accuracy\n- wide viewing angle\n- side دىن قارىسىمۇ image consistent/vibrant\n\nColor precision مۇھىم بولغان:\n- graphic design\n- photography\n- content creation\nغا ماس.\n\nكەمچىلىكى: ئادەتتە قىممەتراق.\n\n### TN — Twisted Nematic\n\nSource transcript تا «twisted pneumatic» دەپ خاتا transcribe قىلىنغان بولۇشى مۇمكىن؛ exam context TN panel نى كۆرسىتىدۇ. تەرجىمىدە original abbreviation **TN** نى ساقلايمەن.\n\nئەۋزەللىكى:\n- fast response time\n- high refresh rate\n- gaming monitor غا ماس\n\nكەمچىلىكى:\n- color accuracy ئاجىزراق\n- viewing angle تار\n- side دىن قارىغاندا image quality ناچارلىشىدۇ\n\n### VA — Vertical Alignment\n\nئەۋزەللىكى:\n- IPS/TN غا قارىغاندا stronger contrast ratio\n- deeper black\n- TN دىن ياخشىراق viewing angle\n\nViewing angle IPS دەك كەڭ ئەمەس.\n\nMedia consumption ئۈچۈن contrast performance سەۋەبىدىن كۆپ ئىشلىتىلىدۇ.\n\n### Mini-LED\n\nMini-LED يەنىلا **LCD technology**، ئەمما advanced backlighting ئىشلىتىدۇ.\n\nئادەتتىكى چوڭ backlight zone ئورنىغا screen كەينىدە مىڭلىغان كىچىك LED بار.\n\nبۇ **local dimming** نى ياخشىلايدۇ: screen نىڭ ھەر رايونى مۇستەقىل dim/bright بولالايدۇ.\n\nنەتىجە:\n- better contrast\n- brighter highlight\n- traditional LCD دىن ياخشى black level\n\nئەمما يەنىلا backlight قا تايانغاچقا OLED دەك ھەر individual pixel نى پۈتۈنلەي off قىلالمايدۇ.\n\n### OLED — Organic Light-Emitting Diode\n\nOLED دا **backlight يوق**.\n\nھەر individual pixel ئۆزى light ھاسىل قىلىدۇ.\n\nBlack كۆرسىتىش كېرەك بولسا pixel پۈتۈنلەي off بولىدۇ.\n\nشۇڭا:\n- true black\n- extremely high contrast\n- vibrant color\n- wide viewing angle\n- very thin design\n\nBacklight layer يوق بولغاچقا flexible display قۇرغىلى بولىدۇ؛ curved display، foldable phone، wearable device لاردا ئىشلىتىلىدۇ.\n\nكەمچىلىكى:\n- قىممەتراق\n- static image ئۇزۇن ۋاقىت تۇرسا burn-in خەۋپى بولۇشى مۇمكىن\n\n### Exam Memory\n\n- **LCD:** backlight + liquid crystal\n- **IPS/TN/VA:** LCD panel variations\n- **Mini-LED:** advanced LCD backlight/local dimming\n- **OLED:** each pixel makes its own light → true black\n\nExam Objective 3.1\nDisplay component ۋە attribute لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Display Components\n\n### Touchscreen\n\nTouchscreen user غا screen دىكى مەزمۇن بىلەن بىۋاسىتە touch input ئارقىلىق interaction قىلىشقا يول قويىدۇ:\n- tap\n- swipe\n- pinch\n- drag\n\nMobile device دا standard، laptop ۋە all-in-one system دامۇ كۆپ ئۇچرايدۇ.\n\nTouchscreen بىرلا component ئەمەس؛ بىر نەچچە layer بىرلىكتە ئىشلەيدۇ.\n\n### Digitizer\n\nDigitizer display panel ئۈستىدىكى transparent layer بولۇپ **touch input نى detect قىلىدۇ**.\n\nUser screen غا تەگكەندە:\n- exact touch location نى detect قىلىدۇ\n- physical touch/motion نى system چۈشىنىدىغان digital signal غا ئايلاندۇرىدۇ\n\nمۇھىم پەرق:\n- **Display panel → image كۆرسىتىدۇ**\n- **Digitizer → touch نى detect قىلىدۇ**\n\nTroubleshooting:\n- image بار، touch يوق → digitizer مەسىلىسى بولۇشى مۇمكىن\n- touch جاۋاب بېرىدۇ، image يوق → display panel مەسىلىسى بولۇشى مۇمكىن\n\n### Inverter\n\nInverter ئاساسلىقى **old laptop + CCFL backlight** تا ئۇچرايدىغان small circuit board.\n\n**CCFL — Cold Cathode Fluorescent Lamp** high-voltage AC power تەلەپ قىلىدۇ.\n\nLaptop battery/adapter بولسا low-voltage DC power بېرىدۇ.\n\nInverter:\n- low-voltage DC → high-voltage AC\nغا convert قىلىپ CCFL backlight نى ئىشلىتىدۇ.\n\nInverter ئىشلىمىسە display:\n- very dim\n- ياكى black\nبولۇشى مۇمكىن، image ئۆزى ھاسىل بولۇۋاتقان تەقدىردىمۇ.\n\nClassic test: screen قاراڭغۇ بولسا flashlight بىلەن screen غا قاراپ بېقىڭ. Faint image كۆرۈنسە display panel ئىشلىۋاتىدۇ، backlight system دا مەسىلە بولۇشى مۇمكىن.\n\nModern LED-backlit display low-voltage DC نى بىۋاسىتە ئىشلىتىدىغان بولغاچقا separate inverter ئادەتتە كېرەك ئەمەس.\n\nExam Objective 3.1\nDisplay component ۋە attribute لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Display Attributes\n\n### Pixel\n\nPixel — picture element — screen دىكى image نى ھاسىل قىلىدىغان ئەڭ كىچىك color dot.\n\nText، image، video مىڭلىغان ياكى مىليونلىغان pixel دىن قۇرۇلىدۇ.\n\n### Resolution\n\nScreen resolution — screen دا كۆرسىتىلىدىغان total pixel سانى؛ ئادەتتە **width × height**.\n\nمىسال:\n`1920 × 1080`\n- 1920 pixel across\n- 1080 pixel down\n\nCommon resolution:\n- **1280 × 720 — HD**\n- **1920 × 1080 — Full HD**\n- **2560 × 1440 — QHD / Quad HD**\n- **3840 × 2160 — UHD / 4K**\n\nئادەتتە higher resolution → more total pixels → sharper/more detailed image.\n\n### Pixel Density — PPI\n\nResolution total pixel سانىنى ئېيتىدۇ؛ **pixel density** pixel لارنىڭ قانچىلىك زىچ ئورۇنلاشقانلىقىنى ئېيتىدۇ.\n\nئۆلچەم: **PPI — Pixels Per Inch**.\n\nئوخشاش resolution ئىككى screen دا:\n- smaller physical screen → pixel closer → higher PPI\n- larger screen → pixel farther apart → lower PPI\n\nHigher PPI ئادەتتە:\n- sharper text\n- smoother edge\n- clearer image\n\n### Refresh Rate\n\nRefresh rate — display نىڭ image نى بىر سېكۇنتتا قانچە قېتىم update قىلىدىغانلىقى.\n\nئۆلچەم: **Hz — Hertz**.\n\n- 60 Hz → 60 refresh/sec\n- 120 Hz → 120 refresh/sec\n\nHigher refresh rate → smoother motion.\n\nMovie action scene ۋە gaming دا ئالاھىدە كۆرۈنەرلىك.\n\nمۇھىم:\n- resolution / pixel density → clarity/detail\n- refresh rate → motion smoothness\n\n### Color Gamut\n\nColor gamut — display ھاسىل قىلالايدىغان color range.\n\nWider gamut:\n- more shades/tones\n- richer/vibrant image\n- more lifelike color\n\nLower-end display color washed-out ياكى inaccurate بولۇشى مۇمكىن.\n\nHigh-quality display:\n- deeper red\n- brighter green\n- subtle shade transition\nنى ياخشى كۆرسىتىدۇ.\n\nPhoto editing، graphic design، video production، media consumption دا مۇھىم.\n\nئىككى monitor resolution + refresh rate ئوخشاش بولسىمۇ، بىرى dull، بىرى vibrant كۆرۈنسە پەرق color gamut بولۇشى مۇمكىن."}, {"id": "3.2", "number": "3.2", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.2, summarize basic cable types and their connectors, features, and purposes. Copper network cables. In this video segment, we'll explore the fundamental types of copper network cables and how they're utilized.\n\nNetwork cabling, along with associated interfaces, serves the crucial function of linking network devices to facilitate data sharing. These cables are integral to the infrastructure of most wired networks and are available in several forms. The copper cabling options include phone cables, coaxial cables, and ethernet or CAT cables.\n\nCopper phone cables, although originally designed for voice communication, have evolved to support various data communication applications. While they still play a crucial role in landline telephone connections, phone cables are also commonly used for dial-up and DSL internet connections. Both these technologies allow data to be transmitted over existing phone lines, enabling internet access for homes and businesses without the need for additional infrastructure.\n\nNext, we have coaxial cables. These copper cables are commonly used in broadband internet connections, particularly in cable internet services. These cables enable the delivery of high-speed internet access to homes and businesses, supporting activities such as web browsing, video streaming, online gaming, and file downloads.\n\nAs for ethernet or CAT cables, where CAT is short for category, they are indispensable in modern networking, facilitating crucial connections such as linking a modem to a SOHO router or connecting a SOHO router to a desktop PC. And given their widespread use in networking setups today, it only makes sense that we should explore this copper cable type in more depth. We'll begin our in-depth exploration of CAT cables by first examining their specifications.\n\nOver time, the evolution of CAT cables has been driven by an ever-increasing demand for network speed and reliability. This has led to many different CAT cable standards over time. While it's not necessary to memorize every CAT cable standard ever created, we do need to know a few specific ones for the CompTIA A+ Core 1 certification exam.\n\nHere are a few cable specifications you should memorize. CAT5 cables support 100 megabits per second of throughput for a distance of up to 100 meters. This conforms to the 100BaseTx standard.\n\nCAT5e cables support 1000 megabits per second of throughput for a distance of up to 100 meters. This conforms to the 1000BaseTx standard. CAT6 cables also support 1000 megabits per second of throughput for a distance of up to 100 meters and conforms to the 1000BaseTx standard just like a CAT5e cable, but they also support 10 gigabits per second of throughput at a shorter distance of 55 meters.\n\nThis conforms to the 10GBaseTx standard. Last, we have the CAT6a cable. The 80 stands for augmented.\n\nCAT6a supports 10 gigabits per second for the full 100 meter distance, improving upon CAT6. It also conforms to the 10GBaseTx standard. For many modern high speed networks, CAT6a is a common choice.\n\nNow let's briefly discuss CAT7 and CAT8. CAT7 cables were designed to support speeds up to 10 gigabits per second at 100 meters, similar to CAT6a, but with even more shielding. CAT7 uses shielded twisted pair construction and is designed to reduce electromagnetic interference even further.\n\nFinally, we have CAT8. CAT8 is designed for very high speed data centers. It supports up to 40 gigabits per second, but only at shorter distances, typically up to 30 meters.\n\nCAT8 is heavily shielded and intended for high performance environments, such as server rooms and data centers, not typical home or small office installations. For the 80 plus core one exam, your primary focus should be on CAT5, CAT5e, CAT6, and CAT6a, along with their speeds and distance limitations. Understanding CAT7 and CAT8 conceptually is helpful, especially knowing that CAT8 supports up to 40 gigabits per second at shorter distances.\n\nCAT cables are twisted pair cables. That means cables consist of pairs of insulated copper wires twisted together. This twisting of wires helps to mitigate electromagnetic interference, or EMI.\n\nOne key term to understand in this context is crosstalk. Crosstalk refers to the interference caused when the signals transmitted on one wire pair affect the signals on an adjacent wire pair. By twisting the wires together in pairs, crosstalk is minimized, ensuring that data can be transmitted more reliably.\n\nNext, we have two main types of twisted pair cables, unshielded twisted pair, or UTP, and shielded twisted pair, or STP. UTP cables do not have any additional EMI protection beyond the twisting of the wire pairs. STP cables, on the other hand, feature an extra layer of shielding, such as foil or braided metal, that is wrapped around the outside of the wire pairs, providing further protection against interference.\n\nThese STP cables are commonly used in environments where there are high levels of electromagnetic interference, such as industrial settings or areas with heavy machinery. Another construction consideration is a plenum rating. Plenum-rated cables are specifically designed for use in plenum spaces within buildings.\n\nA plenum space is an area used for air circulation in HVAC, or heating, ventilation, and air conditioning systems, typically found above suspended ceilings or below raised floors. These spaces serve as pathways for air to circulate throughout the building, helping to maintain proper airflow and temperature regulation. What sets plenum-rated cables apart is their construction and materials.\n\nThese cables are manufactured using fire-retardant materials that are capable of withstanding high temperatures without emitting toxic fumes or spreading flames rapidly. This is crucial in plenum spaces, as any fire hazard poses a significant risk to the entire building. Additionally, plenum-rated cables undergo stringent testing and certification processes to ensure they meet specific safety standards and building codes.\n\nThis includes testing for flame spread, smoke generation, and toxicity levels. Using plenum-rated cables in plenum spaces is not only a matter of compliance with building regulations, but also a crucial safety measure. In the event of a fire, these cables help to minimize the spread of flames and reduce the release of harmful gases, providing occupants with valuable time to evacuate safely.\n\nAnd to wrap up our study of CAT cables, let's discuss connector pinouts, specifically the T5-68A and T5-68B standards. Connector pinouts define the arrangement of wires within ethernet connectors, ensuring consistency and compatibility across network installations. T5-68A and T5-68B are two commonly used pinup standards for ethernet cables, dictating the order in which wires are terminated at the connector ends.\n\nT5-68A and T5-68B standards differ in their wire arrangement, primarily in the positioning of the green and orange wire pairs. T5-68A features a green pair on pins one and two and an orange pair on pins three and six. In contrast, T5-68B reverses this arrangement, placing the orange pair on pins one and two and the green pair on pins three and six.\n\nExam objective 3.2, summarize basic cable types and their connectors, features and purposes. Fiber optic network cables. In this video segment, we will discuss the fundamental aspects of fiber optic network cables.\n\nThese cables are at the forefront of modern networking and are revolutionizing the way data is transmitted across vast distances with unparalleled speed and reliability. Unlike traditional copper cables, which rely on electrical signals to transmit data, fiber optic network cables harness the power of light pulses to convey information. This innovative approach not only ensures faster transmission speeds, but also significantly enhances the efficiency of data transfer processes.\n\nBy leveraging light signals, fiber optic cables mitigate many of the limitations associated with copper-based counterparts, such as signal degradation and electromagnetic interference, thus offering a superior solution for modern networking needs. Now let's explore the two main types of fiber optic cables, single mode fiber and multimode fiber. For this, we will start by exploring single mode fiber, a type of fiber optic cable designed for transmitting a single mode of light through a very small tube known as a core.\n\nThis method of light transmission results in remarkably lower signal attenuation, allowing for longer distance transmissions with superior bandwidth capabilities. Single mode fiber stands out as the preferred choice for long haul telecommunications, where reliability and high performance data transmission over extensive distances are paramount. It serves as the backbone of intercontinental network infrastructure, seamlessly connecting locations worldwide and facilitating high speed data transmission applications with unparalleled efficiency and reliability.\n\nOn the other hand, multimode fiber, as the name suggests, accommodates multiple modes of light propagation simultaneously within its core. This characteristic makes it an ideal choice for short distance transmissions typically found within buildings or campus environments. With its larger core diameter, multimode fiber facilitates easier alignment of light signals, simplifying installation and making it more cost effective for shorter distances.\n\nIt finds widespread use in local area network setups, data centers and multimedia applications owing to its affordability and versatility in accommodating various networking needs. Exam objective 3.2, summarize basic cable types and their connectors, features and purposes. Peripheral cables.\n\nAs a starting point in the field of information technology, understanding peripheral cables is fundamental to your grasp of hardware components and their connectivity. So let's dive in. Peripheral cables serve as the vital links between various devices and your computer.\n\nThey enable the transmission of data, power and signals, facilitating seamless communication and functionality. These cables come in different types, each tailored to specific purposes and technologies. One of the most well-known peripheral cables is the USB.\n\nUSB, short for universal serial bus, is a standard interface used for connecting peripherals to computers and other devices. And this cable type has revolutionized connectivity since its inception in 1996. They facilitate data transfer, power supply and device connectivity.\n\nWith USB cables, you can transfer files, connect peripherals like keyboards and printers or charge your devices. USB cables have undergone significant evolution since their introduction with USB version 1.0. Initially, USB 1.0 provided modest data transfer speeds reaching up to 12 megabits per second, suitable for basic peripherals.\n\nHowever, with the demand for faster and more efficient connectivity, USB 2.0 emerged, representing a significant advancement. USB 2.0 brought about notable improvements in data transfer rates, offering speeds of up to 480 megabits per second, making it the preferred choice for connecting peripherals like keyboards, mice and printers to your computer. This upgrade allowed for smoother and more responsive interaction with these essential devices enhancing overall user experience.\n\nAs technology continued to advance, the need for even faster data transfer became apparent. Enter USB 3.0, a groundbreaking development in USB technology. USB 3.0 cables, easily distinguishable by their blue connectors, revolutionized data transfer with substantially increased speeds compared to their predecessors.\n\nThese cables are designed to handle high bandwidth applications, offering speeds of five gigabits per second or more, depending on the 3.0 version, making them ideal for connecting high speed devices such as external data drives and high definition webcams. With USB 3.0, users can transfer large files and multimedia content swiftly and efficiently without experiencing bottlenecks or slowdowns. This enhanced performance has transformed how we interact with peripheral devices, providing seamless access to vast amounts of data and multimedia content.\n\nTransitioning from USB cables, another type of peripheral cable is the serial cable. A serial cable is a type of connection used for serial transmission of data between devices. Although less common in contemporary computing environments, it maintains relevance for specific applications where its unique characteristics are advantageous.\n\nSerial cables are recognized for their method of serial data transmission, which involves sending data one bit at a time over a single wire or pair of wires, in contrast to parallel transmission used in interfaces like USB. While serial transmission generally results in lower data transfer speeds compared to USB, it offers advantages in certain scenarios such as long distance communication and simplicity of implementation. Now let's shift our focus to yet another remarkable peripheral cable technology, Thunderbolt.\n\nThunderbolt is a high speed peripheral standard that enables rapid data transfer and versatile connectivity. This cable standard was developed by Intel in collaboration with Apple. Thunderbolt enables blazing fast data transfer rates and supports a wide array of peripherals, including displays and storage devices.\n\nOne of the defining features of Thunderbolt is its ability to handle multiple types of data streams simultaneously, making it ideal for demanding applications that require high bandwidth. At its core, a Thunderbolt cable is a high performance connection solution designed to deliver unparalleled speed and flexibility. It combines data transfer, video output, network connectivity and power delivery into a single compact cable, streamlining connectivity for users.\n\nExam objective 3.2, summarize basic cable types and their connectors, features and purposes. Video cables. Video connectivity in information technology involves several different cable standards used to transmit visual and sometimes audio signals between devices such as computers, monitors, televisions and projectors.\n\nOver time, these standards have evolved from analog only video connections to high speed digital interfaces capable of carrying both audio and ultra high definition video. In this video segment, we will walk through the major video cable types you need to recognize for the A+ Core 1 exam, beginning with VGA. VGA stands for Video Graphics Array and was introduced in 1987.\n\nIt became widely adopted in early desktop computers and monitors. VGA uses a 15 pin connector, commonly colored blue and transmits video only. If audio is required, a separate cable must be used.\n\nVGA is an analog standard, meaning it transmits continuous electrical signals rather than discrete digital data. Because it is analog, VGA is more susceptible to signal degradation over longer cable distances and does not support modern high definition resolutions. While it was capable of respectable resolutions for its time, it is now considered legacy technology.\n\nVGA also separates and transmits red, green and blue color signals individually. Next is DVI, which stands for Digital Visual Interface. Released in 1999, DVI was designed to bridge the gap between older analog displays and newer digital displays.\n\nUnlike VGA, DVI introduced digital signaling, which allowed for improved image clarity and higher resolutions. Some DVI variants also maintain support for analog signals to ease the transition from VGA. With up to 29 pins at its disposal, the DVI standard comes with five different variants.\n\nAs I stated previously, DVI supports both analog and digital signals. So here is how we keep things organized. DVI-A is the analog variant.\n\nDVI-A transmits only analog signals. It is designed to transmit video signals in a manner similar to a VGA connection. DVI-T is the digital variant.\n\nDVI-T transmits digital signals only and its connectors can come in different configurations, such as single link or dual link. In single link DVI, there's only one channel or pathway available for transmitting data and dual link has two channels. With a second channel, higher quality graphics can be achieved.\n\nIt sure seems like we are always on a quest for bigger and better graphics. Okay, now for the last variant, DVI-I. With DVI-I, the second I stands for integrated.\n\nThis variant is a hybrid interface that combines both analog and digital signals in a single connector. DVI-I also offers single link and dual link configuration options, but these options are only supported by the digital half of this variant. That was a lot of information and worthy of a quick summary.\n\nSo remember, DVI-A transmits analog signals. DVI-D transmits digital signals and DVI-I transmits both analog and digital signals. Moving forward, HDMI was introduced in 2004.\n\nHDMI stands for high definition multimedia interface. Unlike VGA and DVI, HDMI carries both digital video and digital audio through a single 19 pin connector. This eliminated the need for separate audio cables and quickly made HDMI the dominant interface in televisions and consumer electronics.\n\nHDMI is fully digital and supports high definition and ultra high definition resolutions, including 4K and beyond, depending on the version. Today, HDMI is one of the most widely used video interfaces in both home and business environments. In 2008, DisplayPort was introduced.\n\nDisplayPort uses a 20 pin connector and like HDMI, supports both digital video and audio transmission. It was designed with higher bandwidth capabilities and has historically offered strong support for high refresh rates and multiple display configurations. One key advantage is that DisplayPort supports daisy chaining multiple monitors from a single port in certain configurations.\n\nDisplayPort is also commonly found in professional and enterprise environments. Unlike HDMI, which requires licensing fees from manufacturers, DisplayPort is royalty free, which has contributed to its widespread adoption in computing devices. Finally, we arrive at USB type C, commonly referred to as USB-C.\n\nIt is important to understand that USB-C is a connector type, not a video standard by itself. However, it has become extremely important in modern video connectivity. USB-C is a small reversible connector capable of carrying power, data and video over a single cable.\n\nUSB-C supports video through what is called DisplayPort alternate mode. This allows a USB-C port to transmit DisplayPort video signals directly to a monitor. Some USB-C ports also support Thunderbolt, which provides even greater bandwidth and advanced display capabilities.\n\nBecause of this flexibility, USB-C is now commonly found on laptops, tablets, docking stations, and even smartphones. With the appropriate cable or adapter, USB-C can connect to HDMI, DisplayPort or USB-C monitors. Exam objective 3.2, summarize basic cable types and their connectors, features and purposes.\n\nHard drive cables. In this video segment, we will summarize basic hard drive cable types and their purposes. Under exam objective 3.2, the current version of the A+Core 1 exam focuses specifically on SATA and eSATA, so let's break those down clearly and simply.\n\nLet's begin with serial advanced technology attachment, commonly pronounced SATA. Serial advanced technology attachment, or SATA, is a storage interface used to connect internal storage devices, such as hard disk drives and solid state drives directly to the motherboard. It became the standard internal storage interface because it is faster and more efficient than the older parallel interfaces it replaced.\n\nSATA uses a seven-pin data cable that connects from the drive to a SATA port on the motherboard. SATA supports multiple speed revisions, but for the purposes of the A+ exam, the most important concept is that SATA is the standard interface for connecting internal storage devices inside a desktop or laptop system. Now, let's move outside the case.\n\nExternal serial advanced technology attachment, or eSATA, is an extension of the SATA interface designed specifically for external storage devices. While standard SATA is used inside the computer case, eSATA allows a similar high-speed connection for drives located outside the system. eSATA uses a different connector shape that is more durable and better suited for external connections. It was designed to provide performance similar to internal SATA connections, giving external drives direct access to the system's storage controller.\n\nOver time, however, USB became the more common external storage interface, which means eSATA is less frequently seen on modern consumer systems. For the exam, remember this simple distinction. SATA connects internal drives to the motherboard. eSATA connects external drives to the computer using a SATA-based interface.\n\nIf you can clearly identify which one is internal and which one is external, you are exactly where you need to be for exam objective 3.2. Exam objective 3.2, summarize basic cable types and their connectors, features, and purposes. Connector types.\n\nIn the context of IT, wired interfaces require a cable to extend between two devices. These cables will terminate with a connector and these connectors will plug into a port on the device. These connectors facilitate the transfer of data, signals, power, or other forms of information between different entities within a computer network or between computer peripherals.\n\nIn the last few video segments of this course, we have discussed many different cable types and interface standards. Now it is time to discuss the connectors that sit at the end of those cables. And to get the ball rolling, we will begin with the RJ11 connector.\n\nRJ11, where the RG stands for registered jack, is a common network cable connector used in telephone communications, dial-up internet, and DSL. The RJ11 connector can support up to six pins or positions into which wires can be inserted, but most use cases for the RJ11 connector only utilize two or four of those pins. Another registered jack connector is the RJ45 connector.\n\nRJ45 is a common network cable connector used to terminate ethernet cat cables, which are the most common network cables in use today. The RJ45 connector has eight pins or positions into which wires can be inserted. When placed side by side with an RJ11 connector, the RJ45 connector will appear similar in design to the RJ11 connector, but will be noticeably larger.\n\nThe F-type connector is a network cable connector that provides a termination point in coaxial cable systems. It embodies a threaded design that ensures steadfast connections. Designed specifically for coaxial cables, it facilitates seamless transmission of signals in various applications, such as cable television, satellite broadcasting, and broadband internet.\n\nIts threaded construction not only guarantees a secure fit, but also minimizes signal loss and interference. ST or straight tip connectors are an integral component in fiber optic networks, particularly in setups utilizing multimode fiber for shorter distance transmissions within local area networks. With their cylindrical design and push-pull connectivity, ST connectors offer a reliable solution for seamlessly connecting networking equipment in environments such as office buildings, data centers, and educational institutions.\n\nThe cylindrical design ensures precise alignment between fiber optic cables and devices, while the push-pull mechanism facilitates swift installation and removal. The SC or subscriber connector is another fiber optic network connector used particularly in systems employing single mode fiber for long distance transmissions. Characterized by its square shape and push-pull mechanism, SC connectors provide a robust and efficient solution for interconnecting networking equipment in diverse settings, such as telecommunications, enterprise networks, and internet service provider infrastructures.\n\nThe LC or Lucent connector is found in more modern fiber optic networks, particularly in setups utilizing single mode fiber for high speed and long distance transmissions. With its compact and versatile design, the LC connector offers a reliable solution for interconnecting networking equipment in various environments, ranging from telecommunications and data centers to enterprise networks. Its small form factor and push-pull latch mechanism make it well suited for high density installations where space is limited.\n\nPunchdown blocks serve as fundamental components in telecommunications and network infrastructure, providing a reliable and efficient means of terminating and connecting copper cables. Commonly utilized in structured cabling systems, punchdown blocks offer a straightforward solution for organizing and distributing incoming and outgoing cables within a network environment. Their simple yet robust design features a series of insulation displacement contacts arranged in rows, allowing cables to be securely terminated.\n\nThis ease of termination makes punchdown blocks particularly suitable for quick installations and field configurations. With their ability to accommodate various cable types, including twisted pair cables commonly used in ethernet networks, punchdown blocks facilitate the creation of organized and easily manageable cable runs. Additionally, punchdown blocks are known for their reliability and cost effectiveness, making them a preferred choice for telecommunications infrastructure in a wide range of applications, from small offices to large scale data centers.\n\nNext, we have USB connectors. USB connectors come in many different form factors. And since most of these should be recognizable, I will only cover some of the most common form factors.\n\nFirst, there's the USB type A connector, which has a rectangular shape and is commonly found in computers and laptops. It's used for connecting peripherals like keyboards, mice, printers, and external storage devices. Next is the mini USB connector, which is smaller and is often used in portable devices such as older digital cameras and smartphones due to its compact design.\n\nThen there's the micro USB connector, which is even smaller and has become very common in mobile devices like smartphones and tablets. Finally, the USB type C or just USB-C connector has emerged as the latest standard. This USB-C connector is reversible or non-keyed, meaning you can insert a USB type C connector into its port with either side facing up.\n\nIt also boasts higher data transfer speeds, increased power delivery, and supports various protocols. Heck, this connector is so awesome, even the Thunderbolt standard is using it. The Lightning connector developed by Apple is exclusively used in devices such as Apple iPhones, iPads, and iPods.\n\nSimilar to the USB-C connector, the Lightning connector features a reversible or non-keyed design. Again, this means you can insert the connector into its port with either side facing up. The Lightning cable and connector offers fast data transfer speeds and supports various functionalities, including charging, data transfer, and audio output.\n\nThe Lightning connector has become a standard feature in Apple's product lineup since its introduction in 2012, offering a compact and durable upgrade to Apple's outdated 30-pin connector. The DB9 connector, also known as a D-subminiature nine-pin connector, is a common interface used for serial communication in computer systems and peripherals. Named for its nine-pin configuration, the DB9 connector is characterized by its D-shaped metal shell and screw locking mechanism, which ensures a secure connection.\n\nIt is often found on devices such as computer serial ports, modems, printers, barcode scanners, point of sale systems, and industrial equipment for transmitting data over serial communication protocols. Despite being larger and less common in modern computing, the DB9 connector remains relevant in specific industries and applications where serial communication is still widely used. For one last connector, we have a power connector called a Molex connector.\n\nThe Molex connector offers a robust solution for transferring electrical power within electronic devices and systems. Characterized by its versatile design and secure locking mechanism, the Molex connector ensures reliable power distribution in various applications, ranging from computers and servers to industrial machinery. With its standardized four-pin configuration and compact form factor, the Molex connector facilitates easy installation and maintenance, making it a preferred choice for computing components worldwide.\n\nWhether delivering power to hard drives, fans, or other components, the Molex connector plays a crucial role in powering the modern technological landscape.", "uyghur": "Exam Objective 3.2\nئاساسىي cable تۈرلىرى ۋە ئۇلارنىڭ connector، feature ۋە purpose لىرىنى خۇلاسىلەڭ.\n\n## Copper Network Cables\n\nCopper cable network device لارنى physically ئۇلاپ data sharing نى مۇمكىن قىلىدۇ.\n\nئاساسلىق تۈرلەر:\n- phone cable\n- coaxial cable\n- Ethernet/CAT cable\n\n### Phone Cable\n\nئەسلى voice communication ئۈچۈن، ئەمما data application غىمۇ ئىشلىتىلگەن.\n\n- landline telephone\n- dial-up Internet\n- DSL Internet\n\nExisting phone line ئارقىلىق data يەتكۈزۈشكە يول قويىدۇ.\n\n### Coaxial Cable\n\nBroadband/cable Internet دا كۆپ ئىشلىتىلىدىغان copper cable.\n\nHome/business قا high-speed Internet يەتكۈزۈپ:\n- browsing\n- streaming\n- gaming\n- file download\nنى قوللايدۇ.\n\n### Ethernet / CAT Cable\n\nCAT = Category.\n\nModern wired networking دا ئەڭ مۇھىم cable لارنىڭ بىرى:\n- modem → SOHO router\n- SOHO router → desktop PC\nقاتارلىق connection لاردا.\n\n### CAT Cable Specifications\n\n**CAT5**\n- 100 Mbps\n- 100 m غىچە\n- 100Base-TX\n\n**CAT5e**\n- 1000 Mbps / 1 Gbps\n- 100 m غىچە\n- 1000Base-T\n\n**CAT6**\n- 1 Gbps → 100 m غىچە\n- 10 Gbps → 55 m غىچە\n- 10GBase-T capability\n\n**CAT6a**\n- “a” = augmented\n- 10 Gbps → full 100 m\n- 10GBase-T\n\n**CAT7**\n- 10 Gbps → 100 m\n- extra shielding\n- shielded twisted pair\n- EMI نى تېخىمۇ ئازايتىش ئۈچۈن\n\n**CAT8**\n- data-center/high-performance use\n- 40 Gbps غىچە\n- ئادەتتە 30 m غىچە\n- heavily shielded\n- server room/data center ئۈچۈن، ئادەتتىكى home/small-office installation ئۈچۈن ئەمەس\n\nA+ ئۈچۈن primary focus:\n**CAT5, CAT5e, CAT6, CAT6a + speed/distance**.\n\n### Twisted-pair كابېل، UTP/STP ۋە Plenum\n\nCAT7 ۋە CAT8 نىڭ ئۇقۇمىنى بىلىپ قويۇش پايدىلىق. بولۇپمۇ CAT8 قىسقا ئارىلىقتا **40 Gbps** غىچە سۈرئەتنى قوللىيالايدۇ.\n\nCAT تۈرىدىكى Ethernet كابېللىرى **twisted-pair**، يەنى بىر-بىرىگە ئورالغان مىس سىم جۈپلىرىدىن تۈزۈلىدۇ. سىملارنى جۈپ-جۈپ قىلىپ ئوراش **EMI (electromagnetic interference)** نى ئازايتىدۇ. يەنە مۇھىم بىر ئۇقۇم **crosstalk** بولۇپ، بىر سىم جۈپتىكى سىگنالنىڭ يېنىدىكى باشقا سىم جۈپتىكى سىگنالغا تەسىر قىلىشىنى كۆرسىتىدۇ. سىملارنى ئوراپ قويۇش crosstalk نى ئازايتىپ، سانلىق مەلۇماتنى تېخىمۇ ئىشەنچلىك يەتكۈزۈشكە ياردەم بېرىدۇ.\n\nTwisted-pair كابېلنىڭ ئىككى ئاساسلىق تۈرى بار:\n- **UTP (Unshielded Twisted Pair):** ئورالغان سىم جۈپلىرىنىڭ ئۆزىدىن باشقا قوشۇمچە EMI قالقىنى يوق.\n- **STP (Shielded Twisted Pair):** سىم جۈپلىرىنىڭ سىرتىدا foil ياكى توقۇلغان مېتال قالقان بار. شۇڭا سانائەت مۇھىتى ياكى ئېغىر ماشىنا-ئۈسكۈنىلەر بار، EMI يۇقىرى جايغا تېخىمۇ ماس كېلىدۇ.\n\nيەنە بىر مۇھىم قۇرۇلما ئۆلچىمى **plenum rating**. Plenum-rated كابېللار بىنانىڭ HVAC ھاۋا ئايلىنىش بوشلۇقىدا، مەسىلەن ئاسما ئۆگزە ئۈستى ياكى كۆتۈرۈلگەن پول ئاستىدا ئىشلىتىش ئۈچۈن لايىھەلەنگەن. بۇ كابېللار ئوتقا چىداملىق ماتېرىيالدىن ياسىلىدۇ؛ يۇقىرى تېمپېراتۇرىدا تېز يانمايدۇ ۋە زەھەرلىك ئىس-تۈتەكنى ئاز چىقىرىدۇ. ئۇلار flame spread، smoke generation ۋە toxicity قاتارلىق بىخەتەرلىك سىناقلىرىدىن ئۆتۈپ، قۇرۇلۇش كودلىرىغا ماس كېلىشى كېرەك.\n\n### Ethernet pinout: T568A ۋە T568B\n\nEthernet ئۇلىغۇچلىرىدىكى سىملارنىڭ تەرتىپى **pinout** دەپ ئاتىلىدۇ. ئەڭ كۆپ ئىشلىتىلىدىغان ئىككى ئۆلچەم **T568A** ۋە **T568B**.\n\n- **T568A:** يېشىل جۈپ pin 1 ۋە 2 دە؛ ئاپېلسىن جۈپ pin 3 ۋە 6 دە.\n- **T568B:** بۇ تەرتىپ ئالماشتۇرۇلىدۇ؛ ئاپېلسىن جۈپ pin 1 ۋە 2 دە، يېشىل جۈپ pin 3 ۋە 6 دە.\n\n> ئەسكەرتىش: ئەسلى transcript تا «T5-68A/B» دېگەن ئاۋازدىن-تېكىست خاتالىقى بار؛ A+ تېرمىنى **T568A/T568B**.\n\n## Exam Objective 3.2 — Fiber-optic network cables\n\nFiber-optic كابېل مىس كابېلغا ئوخشاش ئېلېكتر سىگنالى ئەمەس، **نۇر پۇلسى** ئارقىلىق سانلىق مەلۇمات يەتكۈزىدۇ. بۇ ئۇسۇل يۇقىرى سۈرئەت، تۆۋەن signal degradation ۋە EMI غا چىدامچانلىق بىلەن تەمىنلەيدۇ.\n\n### Single-mode fiber\n**Single-mode fiber (SMF)** ناھايىتى كىچىك core ئىچىدە بىر نۇر يولىنى يەتكۈزىدۇ. Signal attenuation تۆۋەن، bandwidth يۇقىرى، شۇڭا ئۇزۇن ئارىلىقلىق تېلېكوم ۋە backbone ئۇلىنىشلىرىغا ماس كېلىدۇ.\n\n### Multimode fiber\n**Multimode fiber (MMF)** بىر core ئىچىدە بىر نەچچە نۇر يولىنى بىرلا ۋاقىتتا يەتكۈزىدۇ. Core چوڭراق بولغاچقا ئورنىتىش ئاسان ۋە قىسقا ئارىلىقتا تەننەرخى تۆۋەنرەك. LAN، campus ۋە data center دا كۆپ ئۇچرايدۇ.\n\n**ئىمتىھان خاتىرىسى:**\n- Single-mode → ئۇزۇن ئارىلىق، يۇقىرى bandwidth.\n- Multimode → قىسقا ئارىلىق، ئادەتتە بىنا/LAN ئىچى.\n\n## Exam Objective 3.2 — Peripheral cables\n\nPeripheral كابېللىرى كومپيۇتېر بىلەن سىرتقى ئۈسكۈنىلەر ئارىسىدا **data، power ۋە signal** يەتكۈزىدۇ.\n\n### USB\n**USB (Universal Serial Bus)** 1996-يىلى تونۇشتۇرۇلغان بولۇپ، keyboard، mouse، printer، external storage قاتارلىق ئۈسكۈنىلەرنى ئۇلاش، سانلىق مەلۇمات يەتكۈزۈش ۋە توك بېرىشتە ئىشلىتىلىدۇ.\n\n- **USB 1.0:** تەخمىنەن 12 Mbps غىچە.\n- **USB 2.0:** 480 Mbps غىچە؛ keyboard، mouse، printer قاتارلىقلاردا كەڭ ئىشلىتىلگەن.\n- **USB 3.0:** ئادەتتە كۆك رەڭلىك connector بىلەن تونۇلىدۇ؛ 5 Gbps ياكى نەشىرىگە قاراپ تېخىمۇ يۇقىرى سۈرئەت. External drives ۋە HD webcam قاتارلىق يۇقىرى bandwidth ئۈسكۈنىلەرگە ماس.\n\n### Serial cable\n**Serial cable** سانلىق مەلۇماتنى بىر قېتىمدا بىر bit دىن يەتكۈزىدۇ. ھازىرقى ئادەتتىكى كومپيۇتېرلاردا ئاز كۆرۈنسىمۇ، ئۇزۇن ئارىلىق ئالاقە ياكى سانائەت ئۈسكۈنىلىرىدە يەنىلا ئىشلىتىلىدۇ.\n\n### Thunderbolt\n**Thunderbolt** Intel بىلەن Apple ھەمكارلىشىپ تەرەققىي قىلدۇرغان يۇقىرى سۈرئەتلىك peripheral interface. بىرلا كابېل ئارقىلىق **data، video، networking ۋە power delivery** نى يەتكۈزەلەيدۇ. Display، storage device ۋە باشقا يۇقىرى bandwidth ئۈسكۈنىلەرگە ماس كېلىدۇ.\n\n## Exam Objective 3.2 — Video cables\n\nVideo interface كومپيۇتېر، monitor، TV ۋە projector ئارىسىدا كۆرۈنۈش، بەزىدە ئاۋاز سىگنالى يەتكۈزىدۇ.\n\n### VGA\n**VGA (Video Graphics Array)** 1987-يىلى تونۇشتۇرۇلغان، 15-pin connector ئىشلىتىدىغان **analog، video-only** ئۆلچەم. ئاۋاز ئۈچۈن ئايرىم كابېل لازىم. ئۇزۇن كابېلدا signal degradation كۆرۈلىدۇ، زامانىۋى يۇقىرى resolution نى ياخشى قوللىمايدۇ؛ ھازىر legacy technology ھېسابلىنىدۇ.\n\n### DVI\n**DVI (Digital Visual Interface)** 1999-يىلى تونۇشتۇرۇلغان بولۇپ، analog دىن digital display غا ئۆتۈش دەۋرى ئۈچۈن لايىھەلەنگەن.\n\n- **DVI-A:** analog signal.\n- **DVI-D:** digital signal؛ single-link ياكى dual-link بولىدۇ.\n- **DVI-I:** integrated، analog + digital نى بىر connector دا قوللايدۇ؛ digital قىسمى single-link/dual-link بولالايدۇ.\n\nDual-link ئىككى data channel ئىشلىتىپ، single-link قا قارىغاندا يۇقىرى graphic quality/resolution نى قوللايدۇ.\n\n### HDMI\n**HDMI (High-Definition Multimedia Interface)** 2004-يىلى تونۇشتۇرۇلغان. 19-pin connector ئارقىلىق **digital video + digital audio** نى بىرلا كابېلدا يەتكۈزىدۇ. 4K ۋە ئۇنىڭدىن يۇقىرى resolution لارنى نەشىرىگە قاراپ قوللايدۇ. TV ۋە consumer electronics دا ئىنتايىن كۆپ ئىشلىتىلىدۇ.\n\n### DisplayPort\n**DisplayPort** 2008-يىلى تونۇشتۇرۇلغان، 20-pin connector ئىشلىتىدۇ ۋە digital video + audio نى قوللايدۇ. يۇقىرى bandwidth، يۇقىرى refresh rate ۋە كۆپ monitor سىستېمىسىغا ماس. بەزى سەپلىمىدە بىر پورتتىن بىر نەچچە monitor نى **daisy-chain** قىلغىلى بولىدۇ. DisplayPort royalty-free بولۇپ، كەسپىي ۋە enterprise مۇھىتتا كۆپ ئۇچرايدۇ.\n\n### USB-C نىڭ video رولى\n**USB-C** ئۆزى video standard ئەمەس؛ ئۇ connector تۈرى. ئەمما **DisplayPort Alternate Mode** ئارقىلىق video يەتكۈزەلەيدۇ. بەزى USB-C پورتلىرى Thunderbolt نىمۇ قوللايدۇ. بىرلا كابېلدا power، data ۋە video يەتكۈزۈش ئىمكانى بار. ماس adapter ئارقىلىق HDMI، DisplayPort ياكى USB-C monitor غا ئۇلىغىلى بولىدۇ.\n\n## Exam Objective 3.2 — Hard-drive cables\n\n### SATA\n**SATA (Serial Advanced Technology Attachment)** ئىچكى HDD ۋە SSD نى motherboard غا ئۇلاش ئۈچۈن ئىشلىتىلىدىغان storage interface. SATA data cable ئادەتتە **7-pin** بولۇپ، drive دىن motherboard دىكى SATA port قا ئۇلىنىدۇ.\n\n### eSATA\n**eSATA (External SATA)** SATA نىڭ سىرتقى storage ئۈسكۈنىلىرى ئۈچۈن لايىھەلەنگەن نۇسخىسى. Connector شەكلى سىرتقى ئىشلىتىشكە چىداملىق. بۇرۇن external drive دا يۇقىرى سۈرئەت ئۈچۈن ئىشلىتىلگەن، كېيىن USB كەڭ تارقالغاچقا زامانىۋى consumer سىستېمىدا ئاز كۆرۈلىدۇ.\n\n**ئەستە ساقلاڭ:**\n- SATA → internal drive ↔ motherboard.\n- eSATA → external drive ↔ computer.\n\n## Exam Objective 3.2 — Connector types\n\nكابېلنىڭ ئۇچىدىكى connector ئۈسكۈنىدىكى port قا كىرىدۇ ۋە data، signal ياكى power نى يەتكۈزۈشكە يول ئاچىدۇ.\n\n### RJ11\n**RJ11 (Registered Jack 11)** تېلېفون، dial-up Internet ۋە DSL دا ئىشلىتىلىدۇ. 6 position غىچە بولالايدۇ، ئەمما ئادەتتە 2 ياكى 4 pin ئىشلىتىلىدۇ.\n\n### RJ45\n**RJ45** Ethernet CAT كابېللىرىنىڭ ئەڭ كۆپ ئىشلىتىلىدىغان connector ى. **8 pin/position** بار. RJ11 غا ئوخشايدۇ، ئەمما چوڭراق.\n\n### F-type\n**F-type connector** coaxial cable دا ئىشلىتىلىدىغان threaded connector. Cable TV، satellite ۋە broadband Internet دا كۆپ ئۇچرايدۇ. بۇرمىلىق قۇرۇلما مۇقىم ئۇلىنىش ۋە signal loss/interference نى ئازايتىشقا ياردەم بېرىدۇ.\n\n### Fiber connectors\n- **ST (Straight Tip):** سىلىندىر شەكىللىك، push/pull ئۇلىنىش؛ transcript تا multimode ۋە قىسقا LAN ئارىلىقى بىلەن باغلانغان.\n- **SC (Subscriber Connector):** كۋادرات شەكىللىك، push/pull؛ transcript تا single-mode، ئۇزۇن ئارىلىق بىلەن باغلانغان.\n- **LC (Lucent Connector):** كىچىك شەكىللىك، latch mechanism؛ high-density fiber ئورنىتىشقا ماس، modern network/data center دا كۆپ ئۇچرايدۇ.\n\n### Punchdown block\n**Punchdown block** copper/twisted-pair كابېللارنى ئاخىرلاشتۇرۇش ۋە تەرتىپكە سېلىش ئۈچۈن ئىشلىتىلىدۇ. Structured cabling دا incoming/outgoing كابېللارنى تەشكىللەيدۇ. Insulation displacement contacts ئارقىلىق سىم مۇقىم ئورۇنلاشتۇرۇلىدۇ.\n\n### USB connectors\n- **USB Type-A:** تىك تۆت بۇلۇڭ، كومپيۇتېر ۋە laptop دا كۆپ ئۇچرايدۇ.\n- **Mini-USB:** كىچىكرەك؛ كونا digital camera ۋە mobile device لاردا.\n- **Micro-USB:** Mini-USB دىنمۇ كىچىك؛ بۇرۇن smartphone/tablet تا كەڭ ئىشلىتىلگەن.\n- **USB-C:** reversible، يەنى ئىككى يۈزىنىڭ قايسىسى ئۈستىدە بولسا بولىدۇ. يۇقىرى data speed، power delivery ۋە كۆپ protocol نى قوللايدۇ؛ Thunderbolt مۇ USB-C connector نى ئىشلىتەلەيدۇ.\n\n### Lightning\n**Lightning** Apple تەرىپىدىن تەرەققىي قىلدۇرۇلغان reversible connector. iPhone، iPad، iPod قاتارلىق ئۈسكۈنىلەردە charging، data transfer ۋە audio output ئۈچۈن ئىشلىتىلگەن. 2012-يىلى تونۇشتۇرۇلۇپ، كونا 30-pin Apple connector نىڭ ئورنىنى ئالغان.\n\n### DB9\n**DB9 (D-subminiature 9-pin)** serial communication ئۈچۈن ئىشلىتىلىدىغان D شەكىللىك، screw-lock connector. كونا serial port، modem، printer، barcode scanner، POS ۋە industrial equipment دا كۆرۈلىدۇ.\n\n### Molex power connector\n**Molex connector** كومپيۇتېر ئىچىدە electrical power يەتكۈزۈش ئۈچۈن ئىشلىتىلىدىغان 4-pin power connector. HDD، fan ۋە باشقا زاپچاسلارغا توك بېرىشتە ئىشلىتىلىدۇ. Locking mechanism مۇقىم ئۇلىنىشقا ياردەم بېرىدۇ.\n\n#"}, {"id": "3.3", "number": "3.3", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.3, compare and contrast RAM characteristics. RAM types. To begin our study of RAM, let's start by defining what RAM is.\n\nRAM, or random access memory, is a form of computer memory that stores working data or programs currently in use by a computer. It allows the central processing unit to quickly access and manipulate information while the system is running. Unlike storage devices, such as hard drives or solid state drives, RAM is volatile memory.\n\nThis means its contents are lost when the computer is powered off. It may help to think of RAM as the intersection in a busy four-way information exchange. At the top, you have the processor.\n\nOn one side, you have input devices sending information into the system. On the other side, you have output devices displaying results. At the bottom, you have storage holding long-term data.\n\nRight in the center of all of this is system memory or RAM. Every time data moves between the processor and storage, it must pass through RAM. Every time you click, type, open a program, or run an application, that information travels through the central intersection.\n\nIf the intersection is wide and well-designed, traffic moves quickly and efficiently. But if the intersection is too small or becomes congested, everything begins to slow down and performance suffers. Now that we understand what RAM does, let's talk about how it is physically packaged.\n\nThe most common form factor used in desktop systems is called a DIM, which stands for dual inline memory module. A DIM is the physical circuit board that holds the memory chips and allows them to connect to the motherboard. When you open a desktop computer case, you will typically see long, narrow memory slots positioned close to the processor.\n\nThose slots are designed specifically to accept DIMs. A DIM installs vertically into the motherboard and locks securely into place using retaining clips on each end of the slot. Along the bottom edge of the module are electrical contacts that align with the memory slot.\n\nWhen properly seated, those contacts create the electrical pathway that allows the system to communicate with the RAM. DIMs are keyed, meaning they have a notch cut into the connector edge. That notch is intentionally placed in a specific position so the module can only be inserted in the correct orientation.\n\nIf the notch does not line up with the slot, the module is either flipped the wrong way or not compatible with that system. It is important to never force a DIM into place. If it does not seat easily with even pressure on both ends, something is wrong.\n\nForcing a memory module can damage the RAM, the slot, or even the motherboard itself. In short, a DIM refers to the physical design of RAM used in most desktop computers. It is the standardized packaging that allows system memory to be installed, upgraded, and replaced.\n\nWhile DIMs are used in most desktop systems, laptops and other compact devices require a smaller form factor. This is where SO-DIM comes in. SO-DIM stands for Small Outline Dual Inline Memory Module.\n\nAs the name suggests, it performs the same function as a standard DIM, but in a smaller physical size. Because laptops and compact systems have limited internal space, a full-sized DIM simply would not fit. A SO-DIM is shorter in length and designed specifically for these space-constrained environments.\n\nInstead of installing vertically like most desktop DIMs, SO-DIMs are often inserted into the slot at a slight angle and then pressed downward until they click into place. Just like DIMs, SO-DIMs are keyed to ensure proper orientation and compatibility. If the notch does not line up with the slot, the module is not compatible with that system.\n\nAnd just like before, forcing the module into place can result in damage. It is important to remember this distinction for the exam. Desktops typically use DIMs, while laptops typically use SO-DIMs.\n\nNow that we have covered the physical form factors, we can shift our focus from how RAM looks to how RAM performs. This brings us to double data rate memory, commonly known as DBR. DBR refers to the memory technology itself, not the physical packaging.\n\nThe term double data rate means that the memory is capable of transferring data twice per clock cycle. In simple terms, this allows the memory to move data more efficiently compared to older memory technologies. Over time, DBR has evolved through several generations.\n\nThe most commonly utilized generations include DBR3, TBR4, and DBR5. DBR3 was widely used for many years and became common in systems produced in the late 2000s and early 2010s. It offered solid performance and reasonable power consumption for its time.\n\nDBR4 followed and improved upon DBR3 by offering higher data transfer rates, increased capacity support, and better power efficiency. DBR4 became the mainstream standard in both desktops and laptops for many years. Most recently, DBR5 has entered the market, providing even higher speeds, greater bandwidth, and improved overall efficiency.\n\nAs computing demands continue to increase, DBR5 helps support modern processors, high-performance applications, and more demanding workloads. It is important to understand that each DBR generation is not backward or forward compatible with others. A motherboard designed for one generation of DBR memory cannot use a different generation.\n\nThe slot design, electrical configuration, and performance characteristics are all different. For the exam, you should recognize the progression from DBR3 to DBR4 to DBR5. Understand that each generation improves speed and efficiency, and know that they are not interchangeable.\n\nNext up, we have ECC RAM. In server environments where data integrity is paramount, error correction code, or ECC RAM, stands out as an indispensable component. Unlike standard RAM modules, ECC RAM incorporates additional circuitry specifically designed for error detection and correction.\n\nThis sophisticated technology, for an increased fee of course, enables ECC RAM to identify and rectify memory errors on the fly, ensuring that data remains accurate and reliable, even in the face of potential hardware glitches or transient faults. In highly critical systems, where even the smallest data corruption could have significant consequences, such as financial transactions or medical records, the robust error handling capabilities of ECC RAM provides peace of mind and safeguard against potential data loss or corruption.\n\nTherefore, ECC RAM emerges as the preferred choice for servers where reliability and data integrity are non-negotiable priorities. Lastly, what good is it to go out and purchase some RAM if you can't decipher its specifications? Luckily, I got you covered.\n\nUsing this example RAM module behind me, I will walk you through its specifications piece by piece. The 8GB on the left refers to the capacity of the RAM, which is eight gigabytes in this example. This specification tells you how much data the RAM can hold at once.\n\nMore gigabytes means you can store more data simultaneously. Next, DDR4 stands for double data rate fourth generation. This is the type of RAM technology used.\n\n2666 indicates the speed of the RAM and the unit of measure is megahertz. Specifically, it's 2666 million cycles per second. A higher megahertz rating means the RAM can transfer data faster, leading to better overall performance.\n\nLastly, we have PC4-21300. This is another way of expressing the speed of the RAM, particularly in terms of its theoretical maximum bandwidth. The PC4 part denotes that it's DDR4 memory.\n\nAs for the 21,300, this indicates that the RAM can theoretically transfer up to 21,300 megabytes per second of theta. Now to put it all together, this stick of RAM has a capacity of eight gigabytes, uses DDR4 technology, is capable of operating at a speed of 2666 megahertz and has a bandwidth of 21,300 megabytes per second. Exam objective 3.3, compare and contrast RAM characteristics.\n\nRAM channels. As we have discussed previously in this training course, RAM or random access memory is the component in your computer that stores data temporarily for quick access by the CPU. Now, when we talk about RAM slots on a motherboard, we're referring to the physical slots on the motherboard where you install your RAM modules.\n\nEach RAM slot is strategically positioned on the motherboard to ensure efficient communication between the RAM modules and the CPU. The number of RAM slots varies depending on the motherboard's design and form factor. Some other boards may have two slots, while others can have four or more.\n\nThese slots are not interchangeable as they are designed to accommodate specific types of RAM modules, such as DDR3, DDR4 or DBR5. It's essential to consult the motherboard specifications to ensure compatibility when selecting and installing RAM modules. Next, let's discuss the memory bus or memory channel between the CPU and the memory slots.\n\nThis pathway determines how efficiently data can be transferred between the RAM and the CPU. Imagine your computer system as a bustling city with the CPU acting as the central command center and the RAM as a storage facility. The memory bus or channel can be likened to a highway that connects and facilitates the smooth flow of traffic or data between the RAM and CPU.\n\nThis pathway is absolutely crucial because it determines how efficiently data can be transferred between the RAM and the CPU, which are the two most vital components of your computer system. Just like a well-designed transportation network enhances the city's productivity and connectivity, an optimized memory bus ensures that data can be accessed and processed swiftly, leading to faster overall system performance. Now let's break down the different RAM memory channel configurations based on the number of channels.\n\nIn a standard single channel configuration, data travels along a single pathway between the CPU and RAM, much like a single lane road. While this setup is functional, it can sometimes lead to bottlenecks, especially when the CPU demands a high volume of data. You can recognize a single channel configuration by observing that only one RAM module is installed, or if multiple modules are present, they will not be installed with any significant pairing.\n\nA dual channel configuration doubles the data transfer rate by utilizing two pathways between the CPU and RAM. Think of it as upgrading from a single lane road to a dual lane highway, effectively doubling the capacity for data traffic. To implement dual channel configuration, you typically install a single RAM module or identical RAM modules in pairs, such as two sticks of the same capacity and speed, into specific slots on the motherboard.\n\nThese slots are often color coded, one color per channel, or labeled to indicate where the modules should be placed in order to achieve dual channel operation. When the computer system detects at least one RAM module in each channel, it automatically engages dual channel mode, allowing for synchronized communication between the CPU and RAM. This synchronization ensures that data is distributed evenly across the channels, maximizing throughput and minimizing latency.\n\nTriple channel configuration takes it a step further by employing three pathways between the CPU and RAM. You can picture this as a major highway with three lanes, capable of handling substantial data traffic with ease. Although less common than dual channel setups, it offers even higher bandwidth for data transfer.\n\nIdentifying a triple channel setup is relatively straightforward. Just look for RAM slots to be in multiples of three. These slots are often situated next to each other and may be color coded or labeled to indicate their purpose in facilitating triple channel operation.\n\nFinally, we have quad channel configurations. In the world of memory, a quad channel configuration stands as the pinnacle of efficiency, boasting four dedicated pathways or channels for data to seamlessly traverse between the CPU and RAM. This configuration can be pictured as an expansive four lane highway.\n\nWhen identifying a quad channel setup, it's important not to confuse it with a dual channel configuration. In a quad channel setup, you will typically observe a motherboard with RAM slots in multiples of four. These slots are strategically positioned and may or may not be color coded, depending on the motherboard's design.\n\nFor instance, if there are eight slots, they may or may not be color coded to indicate proper slot pairing for quad channel operation, while a motherboard with only four slots may not utilize color coding at all. If you found this all a bit confusing, there is no need to worry. Each motherboard, when purchased, will come with documentation that can provide guidance on the proper installation and configuration of RAM modules.", "uyghur": "Exam Objective 3.3 — RAM Characteristics\n\n## RAM تۈرلىرى\n\n**RAM (Random Access Memory)** كومپيۇتېر ئىشلىۋاتقاندا ھازىر ئىشلىتىلىۋاتقان پروگرامما ۋە data نى ۋاقىتلىق ساقلايدىغان system memory. CPU RAM دىكى ئۇچۇرغا تېز يېتىپ، ئۇنى بىر تەرەپ قىلالايدۇ. HDD/SSD غا ئوخشىمايدىغان يېرى، RAM **volatile memory**؛ توك ئۆچسە ئىچىدىكى مەزمۇن يوقىلىدۇ.\n\nRAM نى قاتناش ئېغىزىغا ئوخشىتىشقا بولىدۇ: CPU، input device، output device ۋە long-term storage ئارىسىدىكى نۇرغۇن data RAM ئارقىلىق ئۆتىدۇ. RAM يېتەرلىك بولسا data flow راۋان؛ RAM تاراڭ بولسا bottleneck پەيدا بولۇپ، سىستېما ئاستىلايدۇ.\n\n### DIMM\nDesktop سىستېمىدا ئەڭ كۆپ ئىشلىتىلىدىغان RAM شەكلى **DIMM (Dual Inline Memory Module)**. ئۇ memory chip لار ئورنىتىلغان circuit board بولۇپ، motherboard دىكى ئۇزۇن memory slot قا تىك ئورنىتىلىدۇ. Slot نىڭ ئىككى ئۇچىدىكى retaining clip ئۇنى قۇلۇپلايدۇ.\n\nDIMM نىڭ connector تەرىپىدە **key/notch** بار. Notch slot بىلەن توغرا ماسلاشمىسا، module نى زورلاپ كىرگۈزۈشكە بولمايدۇ. زورلاش RAM، slot ياكى motherboard غا زىيان سالالايدۇ.\n\n### SO-DIMM\nLaptop ۋە compact device لاردا كىچىك **SO-DIMM (Small Outline Dual Inline Memory Module)** ئىشلىتىلىدۇ. فۇنكسىيەسى DIMM بىلەن ئوخشاش، ئەمما physical size كىچىك. ئادەتتە slot قا سەل قىيپاش بۇلۇڭدا كىرگۈزۈپ، ئاندىن تۆۋەنگە بېسىپ قۇلۇپلىنىدۇ.\n\n**ئىمتىھان:** Desktop → DIMM؛ Laptop → SO-DIMM.\n\n### DDR memory\n**DDR (Double Data Rate)** RAM تېخنىكىسىنى كۆرسىتىدۇ؛ physical packaging ئەمەس. Double data rate دېگەنلىك بىر clock cycle دا ئىككى قېتىم data transfer قىلالايدۇ.\n\nئەسلى transcript تا بۇ بۆلۈمدە ئاۋازدىن-تېكىست خاتالىقى بىلەن «DBR/TBR» دېيىلگەن؛ RAM تېرمىنى **DDR3، DDR4، DDR5**.\n\n- **DDR3:** 2000-يىللارنىڭ ئاخىرى ۋە 2010-يىللارنىڭ باشلىرىدا كەڭ ئىشلىتىلگەن.\n- **DDR4:** DDR3 تىن تېز، capacity support يۇقىرى ۋە power efficiency ياخشى؛ ئۇزۇن يىل mainstream بولغان.\n- **DDR5:** تېخىمۇ يۇقىرى speed، bandwidth ۋە efficiency؛ زامانىۋى CPU ۋە high-performance workload لارنى قوللايدۇ.\n\nDDR generation لار **ئۆزئارا ئالماشتۇرغىلى بولمايدۇ**. Slot/keying، electrical configuration ۋە performance specifications ئوخشىمايدۇ. DDR4 motherboard قا DDR5 نى سالغىلى بولمايدۇ.\n\n### ECC RAM\n**ECC (Error-Correcting Code) RAM** قوشۇمچە circuitry ئارقىلىق memory error نى بايقاپ ۋە تۈزىتىپ، data integrity نى يۇقىرى قىلىدۇ. Server، finance، medical record قاتارلىق reliability مۇھىم سىستېمىدا ئىشلىتىلىدۇ. ئادەتتىكى RAM غا قارىغاندا قىممەترەك، ئەمما data corruption خەۋپىنى تۆۋەنلىتىدۇ.\n\n## RAM specification نى ئوقۇش\n\nمىسال: **8 GB DDR4-2666 / PC4-21300**\n\n- **8 GB:** RAM capacity؛ بىر ۋاقىتتا قانچە data ساقلىيالايدىغانلىقى.\n- **DDR4:** RAM generation/type.\n- **2666 MHz:** memory speed؛ تەخمىنەن 2666 million cycles per second دەپ كۆرسىتىلگەن.\n- **PC4-21300:** theoretical maximum bandwidth نى ئىپادىلەيدىغان بەلگە؛ transcript بويىچە تەخمىنەن **21,300 MB/s**.\n\nقىسقىسى، بۇ module 8 GB capacity، DDR4 technology، 2666 MHz speed ۋە 21,300 MB/s theoretical bandwidth قا ئىگە.\n\n## RAM Channels\n\nMotherboard دىكى RAM slot لار CPU بىلەن memory channel/bus ئارقىلىق ئالاقىلىشىدۇ. بۇ يول data نىڭ CPU بىلەن RAM ئارىسىدا قانچىلىك ئۈنۈملۈك يۆتكىلىدىغانلىقىغا تەسىر قىلىدۇ.\n\n### Single-channel\nبىر data pathway ئىشلىتىدۇ؛ بىر لىنىيەلىك يولغا ئوخشايدۇ. ئىشلىيدۇ، ئەمما CPU نىڭ data تەلىپى يۇقىرى بولسا bottleneck پەيدا بولۇشى مۇمكىن.\n\n### Dual-channel\nئىككى pathway ئىشلىتىپ bandwidth نى ئاشۇرىدۇ. ئادەتتە ئوخشاش capacity/speed دىكى RAM module لارنى motherboard قوللانمىسىدا كۆرسىتىلگەن جۈپ slot قا ئورنىتىدۇ. Slot لار رەڭ ياكى label بىلەن channel نى كۆرسىتىشى مۇمكىن. سىستېما ھەر channel دا RAM بارلىقىنى بايقىسا dual-channel mode نى قوزغىتىدۇ.\n\n### Triple-channel\nئۈچ pathway ئىشلىتىدۇ. Dual-channel غا قارىغاندا bandwidth تېخىمۇ يۇقىرى، ئەمما ھازىر ئاز ئۇچرايدۇ. Slot سانى ئادەتتە 3 نىڭ كۆپەيتىلمىسىدەك كۆرۈنۈشى مۇمكىن.\n\n### Quad-channel\nتۆت data channel ئىشلىتىدۇ؛ يۇقىرى throughput ئۈچۈن لايىھەلەنگەن. Motherboard تا RAM slot لار 4 نىڭ كۆپەيتىلمىسى بولۇشى مۇمكىن. رەڭلىك كودلاش ھەمىشە بولمايدۇ.\n\n**مۇھىم:** RAM نى قايسى slot قا سېلىش كېرەكلىكى motherboard model غا باغلىق. توغرا channel configuration ئۈچۈن motherboard documentation نى كۆرۈڭ.\n\n#"}, {"id": "3.4", "number": "3.4", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.4, compare and contrast storage devices. Hard disk drives. Storage drives are computing components that are designed to store digital data.\n\nIn contrast to the temporary or short-term storage offered by RAM, storage drives provide long-term memory, holding everything from the operating system and software applications to personal files and documents, even when the system is powered off. A hard disk drive, commonly abbreviated as HDD, is one such type of storage drive. Essentially, an HDD is a storage device where digital data is stored magnetically on a spinning disk.\n\nHDDs are known for their large storage capacities and relatively lower cost compared to other storage technologies. They are widely used in desktop computers, laptops, and servers. However, HDDs are mechanical devices and are susceptible to wear and tear over time.\n\nThey can also be slower in terms of data access when compared to other storage drives. The basic structure of an HDD consists of one or more magnetic disks or platters that rotate at high speeds. Each platter has a magnetic coating that stores the data.\n\nThe platters are stacked vertically on a spindle and the entire assembly is enclosed in a protective casing. To read or write data, an HDD uses a read and write head that hovers just above the surface of the rotating platters. The read and write head moves rapidly across the spinning platter surface to access the desired data.\n\nWhen reading data, the head detects the magnetic changes on the platter surface and converts them into electrical signals that can be processed by the computer. When writing data, the head applies a magnetic field to the platter to encode the information. It might go without saying, but keep these devices away from strong magnets as they could seriously damage an HDD drive.\n\nNow that we know how an HDD drive works, let's talk about read and write speeds. The speed of the rotating platter in a hard disk drive is measured in revolutions per minute or RPM. This measurement indicates the number of full rotations the disk completes within a minute.\n\nThis metric serves as a critical factor in determining the performance of the HDD directly influencing its read and write speeds. The significance of RPM lies in its impact on data access times. With all other factors being equal, higher RPMs generally translates into faster access times because the read and write head can traverse the spinning platter more swiftly, reaching the desired data on the disk more rapidly.\n\nFor instance, consider a hard drive operating at 7,200 RPM. It typically boasts quicker read and write speeds compared to one spinning at 5,400 RPM. Similarly, HDDs with even higher speeds, such as 10,000 or even 15,000 RPM, further enhance access times, facilitating faster data retrieval and storage operations.\n\nLastly, we have the form factors for hard disk drives. Form factors refer to the physical dimensions and specifications of the HDD, influencing its compatibility and usage in various devices. Among the array of form factors available, two of the most prevalent sizes are 3.5 inches and 2.5 inches each catering to distinct computing needs and environments.\n\nThe 3.5 inch form factor is a staple in desktop and server computing setups. Renowned for its larger size, this form factor accommodates spacious storage capacities, making it ideal for desktop computers that often require ample storage for applications or multimedia files, and in server and data center deployments where robust storage solutions are paramount. The generous physical dimensions of the 3.5 inch HDD allow for enhanced airflow and cooling within desktop computer cases, contributing to optimal performance and longevity.\n\nConversely, the 2.5 inch form factor is predominantly associated with laptops and portable computing devices. Characterized by its compact size, the 2.5 inch HDD offers a space efficient solution tailored to the sleek and slender designs of laptops and portable devices. Despite its smaller footprint, the 2.5 inch HDD maintains commendable storage capacities, striking a balance between performance and portability for on the go computing needs.\n\nExam objective 3.4, compare and contrast storage devices. Solid state drives. In this video segment, we are going to discuss solid state drives, commonly known as SSDs.\n\nA solid state drive is a type of storage device where digital data is stored on non-volatile flash memory chips. Unlike traditional hard disk drives, which we covered in the last video segment, SSDs have no moving mechanical parts. There are no spinning platters and no read or write heads.\n\nBecause of this, SSDs are significantly faster at accessing and storing data, including operating system files, applications and personal files. They are also more resistant to physical shock, vibration and temperature changes. With no moving parts, SSDs operate silently and typically consume less power than mechanical drives.\n\nThe primary drawback is cost per gigabyte, although SSD pricing has steadily decreased over time. Inside an SSD, the primary component is NAND flash memory, which is responsible for storing the data, but the flash memory does not operate alone. Working alongside it is the SSD controller, which acts as the brain of the drive.\n\nThe controller manages how data is written, read, stored and organized across the memory cells, ensuring efficient performance and longevity. Many SSDs also include a cache, which functions as a high-speed buffer. The cache temporarily stores frequently accessed data or incoming write operations, allowing the drive to respond more quickly and operate more smoothly under load.\n\nNow let's move into communication interfaces. The communication interface determines how the SSD connects to the motherboard and how fast data can travel between the drive and the system. First, we have SATA, or serial advanced technology attachment.\n\nEarlier in the course, we discussed SATA cables and how they connect storage devices to the motherboard. That same data cable is used with SATA SSDs. A SATA SSD connects to the motherboard using a SATA data cable, which carries data between the drive and the system.\n\nIn addition to the data cable, the drive also requires a separate SATA power connector from the power supply. This means two physical connections are required, one for data and one for power. Because SATA has been a standard interface for many years, it offers broad compatibility across desktops and laptops.\n\nIf a system supports SATA hard drives, it will also support SATA SSDs without requiring special configuration. However, even though SATA SSDs are significantly faster than mechanical hard disk drives, they are still limited by the maximum throughput of the SATA interface itself. The SATA 3 standard, which is the most common version in use today, has a maximum theoretical speed of six gigabits per second.\n\nThat speed cap means SATA SSDs cannot take full advantage of the faster NAND flash memory inside them. Instead, the interface becomes the bottleneck. So while SATA SSDs offer a major performance improvement over traditional hard disk drives, their speed is ultimately restricted by the limitations of the SATA cable and controller.\n\nWhile SATA uses a dedicated data cable to connect storage devices to the motherboard, PCIe, or peripheral component interconnect express, takes a different approach. PCIe is a high speed expansion interface built directly into the motherboard. It was designed to provide fast communication pathways between the processor and high performance components inside a computer.\n\nUnlike SATA, which relies on a separate data cable and storage controller, PCIe provides direct communication lanes to the system. These lanes allow data to travel much more quickly between the storage device and the processor. PCIe operates using what are called lanes.\n\nEach lane consists of two pairs of wires, one pair for sending data and one pair for receiving data. Multiple lanes can be combined to increase total bandwidth. This design allows PCIe to support significantly higher data transfer speeds than SATA.\n\nBecause PCIe connects more directly to the system's high speed pathways, it reduces bottlenecks and increases overall performance. There is no SATA controller limiting throughput. Instead, the storage device communicates over a faster, more efficient interface.\n\nAs a result, SSDs that use PCIe are capable of delivering much higher read and write speeds than SATA-based SSDs. This makes PCIe storage especially useful in high performance systems, where speed and responsiveness are critical. Now that we understand PCIe as the high speed communication interface, we can build on that foundation by discussing NVMe.\n\nNVMe stands for Non-Volatile Memory Express. Unlike SATA or PCIe, NVMe is not a physical interface. It is a communication protocol designed specifically for flash-based storage.\n\nThink of PCIe as the highway itself and NVMe as the highway signs. The highway provides the physical lanes that vehicles travel on, and the signs determine how traffic flows efficiently across those lanes. In the same way, PCIe provides the high speed physical pathway, whereas NVMe defines how data is structured, queued, prioritized, and processed as it moves across that pathway.\n\nNVMe was created specifically for solid state storage. Older storage protocols were originally designed for mechanical hard drives and included extra overhead that flash memory does not need. NVMe removes much of that unnecessary delay, reducing latency and improving responsiveness.\n\nOne of NVMe's biggest advantages is its ability to handle a large number of simultaneous commands. It supports many more command queues and far more commands per queue than older storage protocols. This allows NVMe SSDs to process multiple read and write requests at the same time, significantly improving performance.\n\nFor the exam, remember this distinction clearly, PCIe is the physical communication interface. NVMe is the protocol that runs over PCIe to optimize solid state storage performance. Next, we'll examine another communication interface you are expected to recognize for the exam known as SAS.\n\nSAS, which stands for Serial Attached SCSI, is primarily used in enterprise and server environments rather than in typical consumer desktops or laptops. While SATA is common in personal systems, SAS is designed for higher reliability, scalability, and performance in business-critical environments. Like SATA, SAS is a serial communication interface used to connect storage devices to a system.\n\nHowever, SAS offers several advantages over SADOC in enterprise deployments. It supports higher performance under sustained workloads, improved error detection, and more advanced command handling. One major distinction is that SAS systems are designed to support multiple drives and high availability configurations.\n\nSAS allows for features such as dual port connections, meaning a drive can connect to two separate controllers. This provides redundancy. If one pathway fails, the other can continue operating, which is critical in data centers and mission-critical systems.\n\nBecause of its reliability and scalability, SAS is commonly found in servers, storage arrays, and enterprise data centers. It is built for environments where uptime and data integrity are essential. For the exam, remember this.\n\nSATA is common in consumer systems, and SAS is primarily used in enterprise environments, such as servers and data centers, where reliability, redundancy, and scalability are priorities. Now that we have discussed communication interfaces, let's shift our focus to form factors. Form factor refers to the physical size and shape of the storage device and how it connects to the motherboard.\n\nFirst, we have M.2. M.2 is a modern, compact form factor commonly used for solid state drives in both desktops and laptops. Instead of using traditional data cables, an M.2 drive installs directly into a dedicated slot on the motherboard.\n\nM.2 drives are slim and flat, designed to save space inside the system. This makes them ideal for laptops, small form factor PCs, and modern desktop motherboards. Next, we have M.SATA or Mini SATA.\n\nM.SATA was developed as a smaller version of the SATA interface for compact systems. Like M.2, an M.SATA drive connects directly to the motherboard. M.SATA was more common in earlier compact systems, but it has largely been replaced by M.2.\n\nExam objective 3.4, compare and contrast storage devices. RAID. At its core, RAID, or redundant array of independent disks, is a technology used to combine multiple hard drives into a single logical unit to improve performance, reliability, or both.\n\nIt operates by distributing or replicating data across these disks in a strategic manner. Different RAID configurations, also known as RAID levels, are designed to meet different needs, whether that be speed, redundancy, or a balance of the two. RAID 0, for instance, prioritizes speed and maximum usable storage capacity.\n\nIn this setup, data is striped across two or more disks. Striping refers to the method of dividing data into blocks and distributing those blocks across multiple drives. Each block of data is written sequentially across the array, allowing multiple disks to work at the same time.\n\nThis parallel processing improves performance. However, RAID 0 offers no redundancy. If just one disk in the array fails, all data is lost because portions of every file are stored across multiple drives.\n\nOur next RAID level, RAID 1, operates like a mirror. Data is duplicated across two disks, meaning each drive contains an identical copy of the data. If one drive fails, the other continues operating without data loss.\n\nRAID 1 provides strong redundancy, but usable storage capacity is effectively cut in half because everything is mirrored. While this type of RAID configuration offers redundancy, it doesn't enhance performance in the way RAID 0 does. Then there is RAID 5, which strikes a balance between performance and redundancy.\n\nRAID 5 uses striping similar to RAID 0, but also introduces parity. Parity is a calculated value derived from the data being written. This parity information is distributed across all drives in the array, rather than stored on a single dedicated disk.\n\nIf one drive fails, the missing data can be reconstructed using the remaining data blocks and the parity information. RAID 5 requires a minimum of three drives, and because of this parity information, it can sustain a single drive failure without data loss. But what if protecting against a single drive failure is not enough?\n\nIn larger arrays, especially in enterprise environments, the risk of multiple drives failing at the same time increases. This is where RAID 6 comes into play. RAID 6 builds directly on the foundation of RAID 5.\n\nLike RAID 5, it uses striping and distributed parity. However, RAID 6 stores two sets of parity information instead of one. This means it can sustain the failure of two drives simultaneously without losing data.\n\nThat additional layer of protection makes RAID 6 more resilient than RAID 5, particularly in large arrays where the probability of multiple drive failures increases. Finally, we come to RAID 10, often referred to as RAID 1+0. This configuration combines the striping technique of RAID 0 with the mirroring capabilities of RAID 1.\n\nThis design delivers both strong redundancy and high performance, though it can be costly. RAID 10 offers faster rebuild times and strong fault tolerance because data is mirrored rather than reconstructed from parity. However, like RAID 1, usable capacity is reduced since half of the total storage is dedicated to mirroring.\n\nExam objective 3.4, compare and contrast storage devices. Removable storage. Removable storage devices offer users a convenient way to store and transport data.\n\nOne common type of removable storage is the flash drive. A flash drive is a type of portable storage device where digital data is stored on non-volatile fla
