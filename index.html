<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CompTIA A+ Core 1 — English ↔ Uyghur Study Workspace</title>
<meta name="description" content="A polished bilingual CompTIA A+ Core 1 English–Uyghur study workspace with objectives, search, notes, bookmarks, active recall and offline support.">
<meta name="theme-color" content="#1967d2">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="A+ English Uyghur">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A+ Uyghur">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">

<style>
:root{
  --bg:#f4f6f8;--panel:#fff;--panel2:#f8fafc;--text:#18212f;--muted:#667085;
  --line:#dfe4ea;--accent:#2563eb;--accent2:#eff6ff;--good:#15803d;--warn:#a16207;
  --shadow:0 8px 30px rgba(15,23,42,.07);--fs:18px;--sidebar:300px;
  --ug-font:"Noto Naskh Arabic","Geeza Pro","Noto Sans Arabic","Arial Unicode MS",serif;
  --ug-size:1.08em;
}
body.dark{
  --bg:#0d1117;--panel:#151b23;--panel2:#1b232d;--text:#e6edf3;--muted:#9ba7b4;
  --line:#2d3742;--accent:#58a6ff;--accent2:#172a46;--good:#5bd17a;--warn:#e5bd5d;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:var(--sidebar) 1fr;height:100vh;overflow:hidden}
.sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand h1{font-size:17px;margin:0 0 4px}.brand p{font-size:12px;color:var(--muted);margin:0}
.progress-wrap{padding:14px 18px;border-bottom:1px solid var(--line)}
.progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .2s}
.side-search{padding:12px 12px 8px}
.side-search input,.top input,.top select,.btn,.note textarea{
  border:1px solid var(--line);background:var(--panel);border-radius:9px
}
.side-search input{width:100%;padding:9px 10px}
.nav{overflow:auto;padding:4px 8px 28px}
.domain-title{font-size:11px;font-weight:700;color:var(--muted);padding:14px 9px 6px;text-transform:uppercase;letter-spacing:.06em}
.nav-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:9px;border-radius:8px;color:var(--text)}
.nav-item:hover{background:var(--panel2)}.nav-item.active{background:var(--accent2);color:var(--accent);font-weight:700}
.nav-item .num{width:38px;font-variant-numeric:tabular-nums}.nav-item .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.nav-item .done{margin-left:auto;font-size:12px;color:var(--good)}
.main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .grow{flex:1;min-width:180px}.top input{width:100%;padding:8px 10px}
.top select{padding:8px 9px}.btn{padding:8px 10px;background:var(--panel);white-space:nowrap}
.btn:hover{border-color:var(--accent)}.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.lesson-head{padding:20px 24px 14px;background:var(--bg)}
.crumb{font-size:12px;color:var(--muted);margin-bottom:5px}.lesson-head h2{font-size:23px;margin:0 0 8px}
.lesson-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.complete{display:inline-flex;gap:7px;align-items:center;font-size:13px;color:var(--muted)}
.content-wrap{min-height:0;flex:1;display:flex;flex-direction:column;padding:0 18px 18px}
.reader{min-height:0;flex:1;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.pane{min-width:0;overflow:auto;padding:0 26px 60px;scroll-behavior:smooth}
.pane+.pane{border-left:1px solid var(--line)}
.pane-title{position:sticky;top:0;z-index:4;margin:0 -26px 18px;padding:13px 26px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.pane-title strong{font-size:14px}.pane-title span{font-size:11px;color:var(--muted)}
.article{font-size:var(--fs);line-height:1.78;overflow-wrap:anywhere}
.article p{margin:0 0 1.15em}.article h3{font-size:1.05em;margin:1.5em 0 .7em;color:var(--accent)}
.article ul{margin:.4em 0 1.2em;padding-left:1.35em}.article li{margin:.32em 0}
#ugArticle{
  direction:rtl;
  text-align:right;
  font-family:var(--ug-font);
  font-size:var(--ug-size);
  line-height:2.15;
  letter-spacing:0;
  word-spacing:.035em;
  text-rendering:optimizeLegibility;
  font-kerning:normal;
  font-variant-ligatures:common-ligatures contextual;
  font-feature-settings:"rlig" 1,"calt" 1,"liga" 1,"kern" 1;
}
#ugArticle p,#ugArticle li,#ugArticle h3{
  direction:rtl;
  unicode-bidi:plaintext;
}
#ugArticle ul{padding-left:0;padding-right:1.35em}
#ugArticle bdi{
  direction:ltr;
  unicode-bidi:isolate;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-size:.88em;
  letter-spacing:0;
  word-spacing:0;
}
mark{background:#ffe783;color:#111;border-radius:3px;padding:0 1px}
body.dark mark{background:#786900;color:#fff}
.bottom{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.note{display:none;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.note.open{display:block}.note label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}
.note textarea{width:100%;min-height:95px;padding:10px;resize:vertical}
.empty{padding:28px;color:var(--muted);text-align:center}
body.focus .sidebar{display:none}body.focus .app{grid-template-columns:1fr}
.language-en .reader{grid-template-columns:1fr}.language-en #ugPane{display:none}
.language-ug .reader{grid-template-columns:1fr}.language-ug #enPane{display:none}
@media(max-width:900px){
  :root{--sidebar:250px}.lesson-head{padding:15px 14px 10px}.content-wrap{padding:0 10px 10px}
  .pane{padding-left:18px;padding-right:18px}.pane-title{margin-left:-18px;margin-right:-18px;padding-left:18px;padding-right:18px}
}
@media(max-width:720px){
  .app{display:block;height:auto;min-height:100vh}.sidebar{display:none}.main{overflow:visible}
  .top{position:sticky;top:0;z-index:20}.reader{grid-template-columns:1fr;overflow:visible}
  .pane{height:58vh}.pane+.pane{border-left:0;border-top:1px solid var(--line)}
  .content-wrap{min-height:auto}.lesson-head h2{font-size:19px}.desktop-only{display:none}
}

/* v3 study enhancements */

/* v4 smart-study enhancements */
.global-results{
  display:none;position:absolute;top:52px;left:14px;right:14px;z-index:50;
  max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);padding:6px
}
.global-results.open{display:block}
.search-hit{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:8px}
.search-hit:hover{background:var(--panel2)}
.search-hit strong{display:block;font-size:13px;margin-bottom:3px}
.search-hit span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recall-tools{display:flex;gap:6px;flex-wrap:wrap}
.recall-hidden .recall-target{filter:blur(6px);user-select:none;transition:filter .15s}
.recall-hidden .recall-target:hover,.recall-hidden .recall-target.revealed{filter:none;user-select:text}
.pair-side.recall-target{position:relative}
.reveal-hint{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;pointer-events:none
}
.recall-hidden .pair-side.recall-target .reveal-hint{display:flex}
.recall-hidden .pair-side.recall-target:hover .reveal-hint,
.recall-hidden .pair-side.recall-target.revealed .reveal-hint{display:none}
.align-badge{
  display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);
  border:1px solid var(--line);border-radius:999px;padding:2px 6px;margin-left:6px
}
.resume-pill{
  display:none;font-size:11px;color:var(--accent);background:var(--accent2);
  border:1px solid var(--accent);border-radius:999px;padding:4px 8px;cursor:pointer
}
.resume-pill.show{display:inline-flex}
.bookmarks-only .nav-item:not(.bookmarked){display:none}
.nav-item.bookmarked .label::before{content:"★ ";color:var(--warn)}
.top{position:relative}
@media(max-width:720px){
  .global-results{top:102px;left:8px;right:8px;max-height:55vh}
  .recall-tools{width:100%}.recall-tools .btn{flex:1}
}

.termbar{
  display:flex;gap:6px;overflow:auto;padding:0 0 10px;scrollbar-width:thin;
}
.termchip{
  border:1px solid var(--line);background:var(--panel);border-radius:999px;
  padding:5px 9px;font-size:12px;white-space:nowrap;cursor:pointer;color:var(--muted)
}
.termchip:hover,.termchip.active{border-color:var(--accent);color:var(--accent);background:var(--accent2)}
.study-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reading-mode-note{font-size:11px;color:var(--muted)}
.pair-view{
  display:none;min-height:0;flex:1;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px
}
body.pairs .reader{display:none}
body.pairs .pair-view{display:block}
.pair-card{
  display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);
  border-radius:11px;overflow:hidden;margin-bottom:10px;background:var(--panel)
}
.pair-side{padding:16px 18px;font-size:var(--fs);line-height:1.75}
.pair-side+.pair-side{border-left:1px solid var(--line)}
.pair-ug{
  direction:rtl;text-align:right;font-family:var(--ug-font);font-size:calc(var(--fs) * 1.08);
  line-height:2.08;unicode-bidi:plaintext
}
.pair-num{
  display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;
  border-radius:999px;background:var(--panel2);color:var(--muted);font-size:11px;margin-bottom:8px
}
.pair-card.focused{outline:2px solid var(--accent);outline-offset:1px}
.copybtn{
  float:right;border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 0 2px 8px
}
.copybtn:hover{color:var(--accent)}
#ugArticle .copybtn{float:left;padding:2px 8px 2px 0}
.read-focus .article p,.read-focus .article li{opacity:.34;transition:opacity .12s}
.read-focus .article p:hover,.read-focus .article li:hover,
.read-focus .article .focus-line{opacity:1}
.mobile-lang-tabs{display:none}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--panel);padding:8px 12px;border-radius:999px;font-size:12px;
  opacity:0;pointer-events:none;transition:.2s;z-index:99
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
kbd{font-family:inherit;font-size:11px;border:1px solid var(--line);background:var(--panel2);padding:1px 5px;border-radius:5px}
@media(max-width:720px){
  .pair-card{grid-template-columns:1fr}.pair-side+.pair-side{border-left:0;border-top:1px solid var(--line)}
  .mobile-lang-tabs{display:flex;gap:6px;flex:1}
  .mobile-lang-tabs .btn{flex:1}
}

.more-popover .btn{min-height:36px;font-size:12px}

/* Tiny context strip: orientation without a giant lesson header */
.lesson-context{
  width:100%;max-width:1940px;margin:0 auto;min-height:34px;padding:6px 18px 0;
  display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;
}
.lesson-context-main{display:flex;align-items:center;min-width:0;gap:7px}
.context-objective{font-weight:850;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.context-separator{color:var(--line-strong)}
.context-domain{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-counter{margin-left:auto;color:var(--muted);font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson-meta-hidden{display:none!important}

/* Reader uses the screen, but text does not become uncomfortably wide */
.content-wrap{width:100%;max-width:1940px;margin:0 auto;padding:8px 18px 16px}
.reader{gap:12px;min-height:0}
.pane{padding:0 clamp(22px,2vw,34px) 64px}
.pane-title{
  margin:0 calc(-1 * clamp(22px,2vw,34px)) 20px;
  padding:10px clamp(22px,2vw,34px);min-height:42px;
}
.pane-title strong{font-size:12.5px}
.pane-title span{font-size:10.5px;letter-spacing:.045em;text-transform:none;color:var(--muted)}
.article{width:100%;max-width:74ch;margin-inline:auto;line-height:1.72}
.article p{margin-bottom:1.08em}
.article h3{margin:1.55em 0 .68em}
.article li{margin:.32em 0}
#ugArticle{width:100%;max-width:48rem;margin-inline:auto;line-height:2.0}
.bottom{max-width:1940px;margin-top:8px;padding-inline:18px}

/* Slightly calmer sidebar density */
.brand{padding:17px 15px 13px}.brand-mark{width:42px;height:42px;border-radius:12px}
.progress-wrap{margin-inline:10px;padding:12px}.side-search{padding-inline:10px}.nav{padding-inline:7px}
.nav-item{min-height:40px;padding:7px 9px}.nav-item .label{font-size:12.25px}.domain-title{font-size:10.5px;color:var(--muted)}

/* Compact desktop: hide the sidebar before it squeezes the bilingual reader.
   The objective selector replaces sidebar navigation while both reading panes stay side-by-side. */
@media (max-width:1180px) and (min-width:901px){
  .app{grid-template-columns:1fr}.sidebar{display:none}.focus-toggle{display:none!important}
  .top{padding-inline:12px}.search-wrap{max-width:620px}.top #languageMode{min-width:126px}
  .top-tools{gap:4px}.tool-group{gap:4px}.global-results{width:min(720px,calc(100vw - 40px));left:12px}
  .compact-mobile-objective{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;margin:6px 12px 0;padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
  .compact-mobile-objective label{font-size:10px;font-weight:850;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .compact-mobile-objective select{min-width:0;width:100%;padding:6px 8px;border:0;border-radius:6px;background:var(--panel-soft);font-size:12px;font-weight:700;color:var(--text)}
  .lesson-context{display:none}.content-wrap{padding-inline:12px}.bottom{padding-inline:12px}
  .pane{padding-inline:22px}.pane-title{margin-left:-22px;margin-right:-22px;padding-inline:22px}
  .article{max-width:72ch}.pane-title span{display:none}
}

/* Tablet / narrow-window mode: stacked reader. */
@media (max-width:900px){
  .app{display:block;height:auto;min-height:100vh}.sidebar{display:none}.main{overflow:visible}
  .top{position:sticky;top:0;display:block;padding:8px 10px;z-index:60}.top-main{min-width:0}
  .focus-toggle{display:none!important}.top-tools{margin-top:7px;justify-content:space-between;overflow-x:auto;scrollbar-width:none}
  .top-tools::-webkit-scrollbar{display:none}.view-tools,.study-tools{flex:0 0 auto}.top #languageMode{min-width:132px}
  .global-results{top:48px;left:0;right:0;width:100%;max-height:62vh}.more-menu{display:block}
  .lesson-context{display:none}.compact-mobile-objective{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin:8px 10px 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .compact-mobile-objective label{font-size:10px;font-weight:850;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  .compact-mobile-objective select{min-width:0;width:100%;padding:7px 8px;border:0;border-radius:7px;background:var(--panel-soft);font-size:12px;font-weight:700;color:var(--text)}
  .content-wrap{padding:8px 8px 10px}.reader{grid-template-columns:1fr;gap:9px;overflow:visible}
  .pane{height:63vh;border-radius:11px;padding:0 19px 56px}.pane+.pane{border-left:1px solid var(--line);border-top:1px solid var(--line)}
  .pane-title{margin:0 -19px 18px;padding:10px 19px;border-radius:11px 11px 0 0}
  .article{max-width:74ch;line-height:1.78}.article p{margin-bottom:1.12em}#ugArticle{max-width:48rem;line-height:2.06}
  .bottom{position:sticky;bottom:0;z-index:40;margin-top:7px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 91%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
}

@media (min-width:1941px){
  .content-wrap,.lesson-context,.bottom{max-width:1940px}
}
@media print{.lesson-context{display:none!important}}


/* =========================================================
   v6.3 — Uyghur / Markdown formatting engine
   Proper semantic rendering for all five course domains.
   ========================================================= */
.article strong{font-weight:820;color:var(--text)}
.article code{
  display:inline-block;max-width:100%;padding:.08em .38em;border:1px solid var(--line);
  border-radius:5px;background:var(--panel-soft);color:var(--text);font:600 .88em/1.45 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  direction:ltr;unicode-bidi:isolate;vertical-align:.04em;overflow-wrap:anywhere
}
.article h3,.article h4,.article h5,.article h6{color:var(--text);font-weight:830;line-height:1.34;scroll-margin-top:74px}
.article h3{font-size:1.23em;margin:1.75em 0 .72em;padding-bottom:.42em;border-bottom:1px solid var(--line)}
.article h4{font-size:1.08em;margin:1.45em 0 .55em}
.article h5{font-size:1em;margin:1.25em 0 .48em;color:color-mix(in srgb,var(--text) 90%,var(--muted))}
.article h6{font-size:.94em;margin:1.15em 0 .42em;color:var(--muted);letter-spacing:.01em}
.article h3:before{height:.92em}
.article h4:before,.article h5:before,.article h6:before{content:none}
.article ul,.article ol{margin:.55em 0 1.05em;padding-left:1.45em}
.article ol{padding-left:1.7em}
.article li{margin:.36em 0;padding-left:.16em}
.article li>ul,.article li>ol{margin:.34em 0 .42em}
.article li::marker{color:var(--accent);font-weight:780}
.article .list-cont{display:block;margin-top:.26em;color:color-mix(in srgb,var(--text) 92%,var(--muted))}
#ugArticle ul,#ugArticle ol{padding-left:0;padding-right:1.55em}
#ugArticle ol{padding-right:1.85em}
#ugArticle li{padding-left:0;padding-right:.12em;text-align:right}
#ugArticle li::marker{color:#c56a05}
#ugArticle h3,#ugArticle h4,#ugArticle h5,#ugArticle h6{text-align:right}
#ugArticle h3{border-right:4px solid #d97706;padding-right:.58em}#ugArticle h3:before{display:none}
.md-rule{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.md-quote{margin:1em 0 1.25em;padding:.78em 1em;border-left:4px solid var(--accent);border-radius:0 9px 9px 0;background:var(--accent2);color:var(--text)}
.md-quote>p:first-child{margin-top:0}.md-quote>p:last-child{margin-bottom:0}
#ugArticle .md-quote{border-left:0;border-right:4px solid #d97706;border-radius:9px 0 0 9px;background:var(--warn-soft);text-align:right}
.md-table-wrap{width:100%;max-width:100%;overflow-x:auto;margin:1em 0 1.4em;border:1px solid var(--line);border-radius:10px;background:var(--panel);-webkit-overflow-scrolling:touch;box-shadow:0 1px 2px rgba(16,24,40,.025)}
.md-table{width:100%;min-width:520px;border-collapse:separate;border-spacing:0;font-size:.91em;line-height:1.55}
.md-table th,.md-table td{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;text-align:left;overflow-wrap:anywhere}
.md-table th:last-child,.md-table td:last-child{border-right:0}.md-table tbody tr:last-child td{border-bottom:0}
.md-table th{background:var(--panel-soft);font-weight:800;color:var(--text);white-space:normal}
.md-table tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--panel-soft) 42%,transparent)}
#ugArticle .md-table{direction:rtl}
#ugArticle .md-table th,#ugArticle .md-table td{text-align:right;border-right:0;border-left:1px solid var(--line)}
#ugArticle .md-table th:last-child,#ugArticle .md-table td:last-child{border-left:0}
#ugArticle .md-table .md-ltr-cell{direction:ltr;text-align:left;unicode-bidi:isolate}
.ltr-run{unicode-bidi:isolate}
.article p:hover .copybtn,.article li:hover .copybtn,.article h3:hover .copybtn,.article h4:hover .copybtn,.article h5:hover .copybtn,.article h6:hover .copybtn{opacity:.5}
@media(max-width:900px){
  .article h3{font-size:1.17em;margin-top:1.55em}.article h4{font-size:1.055em}.md-table{min-width:480px;font-size:.88em}.md-table th,.md-table td{padding:9px 10px}
}
@media print{
  .md-table-wrap{overflow:visible;box-shadow:none}.md-table{min-width:0}.article code{border-color:#bbb;background:#f5f5f5}.md-quote{break-inside:avoid}.md-table tr{break-inside:avoid}
}



/* =========================================================
   v6.4 — RTL / bidi polish
   Fix mixed-direction parentheticals, ordered-list markers,
   copy-button positioning, pane-label alignment and RTL tables.
   ========================================================= */
#ugPane .pane-title{direction:rtl;text-align:right}
#ugPane .pane-title>div{direction:rtl}
#ugPane .pane-title>span{direction:ltr;unicode-bidi:isolate}

/* Native RTL ordered-list markers can paint as `.1`. Draw the marker as one
   isolated LTR token instead, while retaining normal RTL list indentation. */
#ugArticle ol{list-style:none;padding-right:0}
#ugArticle ol>li{position:relative;padding-right:2.35em;padding-left:0}
#ugArticle ol>li::before{
  content:counter(list-item) ".";position:absolute;right:0;top:0;width:1.85em;
  direction:ltr;unicode-bidi:isolate;text-align:right;color:#c56a05;font-weight:800;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  font-variant-numeric:tabular-nums
}
#ugArticle .ltr-parenthetical{white-space:normal}

/* Copy is an on-demand overlay now; it no longer floats into the text line or
   creates a visually detached column on the far side of the Uyghur article. */
.article p,.article li,.article h3,.article h4,.article h5,.article h6{position:relative}
.copybtn,#ugArticle .copybtn{
  float:none;position:absolute;z-index:3;top:-.15rem;right:0;left:auto;
  margin:0;padding:3px 7px;border:1px solid var(--line);border-radius:6px;
  background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:0 1px 2px rgba(16,24,40,.05);
  color:var(--muted);font-size:10px;font-weight:750;line-height:1.35;opacity:0;
  transform:translateY(-82%);pointer-events:none;transition:opacity .14s,color .14s,border-color .14s
}
.article p:hover>.copybtn,.article li:hover>.copybtn,.article h3:hover>.copybtn,
.article h4:hover>.copybtn,.article h5:hover>.copybtn,.article h6:hover>.copybtn,
.copybtn:focus-visible{opacity:.88;pointer-events:auto}
.copybtn:hover{opacity:1!important;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 36%,var(--line))}
#ugArticle .copybtn{right:0}

/* Keep RTL table geometry predictable, but isolate English-only cells as a
   complete LTR unit. The wrapper remains horizontally scrollable on phones. */
#ugArticle .md-table-wrap{direction:rtl}
#ugArticle .md-table{direction:rtl}
#ugArticle .md-table th,#ugArticle .md-table td{unicode-bidi:plaintext}
#ugArticle .md-table .md-ltr-cell{direction:ltr;unicode-bidi:isolate;text-align:left}
@media(max-width:900px){
  .copybtn,#ugArticle .copybtn{transform:translateY(-72%);font-size:9px;padding:2px 6px}
}

/* =========================================================
   v6.5 — RTL content polish
   Let English-only study blocks read naturally without pulling
   the whole Uyghur lesson into LTR, and give Uyghur-only mode a
   little more desktop reading width.
   ========================================================= */
#ugArticle .md-ltr-block,
#ugArticle .md-tech-ltr{
  direction:ltr;unicode-bidi:isolate;text-align:left;
  width:fit-content;max-width:100%;margin-left:auto;margin-right:0
}
#ugArticle p.md-ltr-block{margin-left:auto;margin-right:0}
#ugArticle .md-heading.md-ltr-block,
#ugArticle .md-heading.md-tech-ltr{
  text-align:left
}
#ugArticle h3.md-ltr-block,
#ugArticle h3.md-tech-ltr{
  border-right:0;border-left:4px solid #d97706;
  padding-right:0;padding-left:.58em
}

/* Pure-English lists become a compact LTR island anchored to the right edge
   of the Uyghur article. This keeps bullets/numbers on the natural English
   side while preserving the surrounding RTL page geometry. */
#ugArticle .md-ltr-list{
  direction:ltr;unicode-bidi:isolate;text-align:left;
  width:fit-content;max-width:100%;margin-left:auto;margin-right:0
}
#ugArticle ul.md-ltr-list{padding-left:1.45em;padding-right:0}
#ugArticle ul.md-ltr-list>li{padding-left:.12em;padding-right:0;text-align:left}
#ugArticle ol.md-ltr-list{padding-left:2.35em;padding-right:0}
#ugArticle ol.md-ltr-list>li{padding-left:.12em;padding-right:0;text-align:left}
#ugArticle ol.md-ltr-list>li::before{
  left:-2.2em;right:auto;width:1.85em;text-align:right
}

/* Editorial transcript-correction lines are mixed-language metadata rather
   than normal prose. Let the first strong character choose their direction
   and visually separate them from the lesson explanation. */
#ugArticle .md-editor-note{
  unicode-bidi:plaintext;text-align:start;
  width:100%;margin:1em 0 1.2em;padding:.7em .85em;
  border:1px solid color-mix(in srgb,#d97706 20%,var(--line));
  border-radius:9px;background:color-mix(in srgb,var(--warn-soft) 60%,var(--panel));
  font-size:.94em;line-height:1.75
}

/* Uyghur-only desktop mode can use more of the pane without making bilingual
   mode too wide. Keep comfortable line lengths on smaller screens. */
@media(min-width:901px){
  body.language-ug #ugArticle{max-width:62rem}
  body.language-ug #ugPane{padding-left:clamp(30px,4vw,62px);padding-right:clamp(30px,4vw,62px)}
}

<body>
<div class="app">
  <aside class="sidebar" aria-label="Course navigation">
    <div class="brand">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">A+</div>

مگە ماس كېلىدۇ؟\n\nCompTIA A+ گۇۋاھنامىسى ۋە بۇ تەربىيەلەش كۇرسى كىرىش دەرىجىسىدىكى مەسىلە ھەل قىلغۇچىلار ۋە يېڭىلىق ياراتقۇچى تەپەككۇر ئىگىلىرىگە ماس كېلىدۇ. ئەگەر سىزدە IT ئاساسلىرى توغرىسىدا مۇستەھكەم چۈشەنچە بولسا—مەسىلەن CompTIA Tech+ دەرىجىسىدىكى بىلىم—ۋە تېخنىكىلىق مەسىلىلەرنى ھەل قىلىشقا قىزىقىدىغان بولسىڭىز، بۇ سىز ئۈچۈن كېيىنكى قەدەم بولالايدۇ.\n\nA+ يولى ئىشلەتكۈچىلەر بىلەن تېخنىكا ئارىسىدىكى بوشلۇقنى تولدۇرۇشقا تەييار كىشىلەرنى قارشى ئالىدۇ. مەيلى باشقىلار ھەر دائىم تايىنىدىغان IT قوللاش مۇتەخەسسىسى بولۇشنى ئارزۇ قىلىڭ، ياكى كەلگۈسىدە ئىلغار تېخنىكىلىق ھەل قىلىش چارىلىرىنى يارىتىشنى خالاڭ، CompTIA A+ گۇۋاھنامىسى ئاساسىي Tech+ بىلىمىدىن كېيىنكى لوگىكىلىق قەدەم ھېسابلىنىدۇ.\n\n### CompTIA A+ گۇۋاھنامىسىنى قانداق ئالىسىز؟\n\nCompTIA A+ گۇۋاھنامىسىگە ئېرىشىش ئۈچۈن ئىككى ئايرىم ئىمتىھاندىن مۇۋەپپەقىيەتلىك ئۆتۈشىڭىز كېرەك: Core 1 ۋە Core 2. بۇ ئىككى ئىمتىھان IT بىلىمىنىڭ بىر-بىرىنى تولۇقلايدىغان، ئەمما ئوخشىمىغان ساھەلىرىنى سىنايدۇ.\n\nCore 1 ئاساسلىقى قاتتىق دېتال (hardware) ۋە تور (networking) ئاساسلىرىغا مەركەزلىشىدۇ. Core 2 بولسا مەشغۇلات سىستېمىلىرى (operating systems)، بىخەتەرلىك (security) ۋە مەشغۇلات تەرتىپلىرى (operational procedures) نى تېخىمۇ چوڭقۇر قاپلايدۇ. بۇ ئىككى ئىمتىھان بىرلىكتە كىرىش دەرىجىسىدىكى IT كەسپىي خادىملىرىغا كېرەك بولغان ئەمەلىي ۋە نەزەرىي بىلىمنى ئىسپاتلايدۇ.\n\nCompTIA A+ گۇۋاھنامىسىنى ئېلىش ئۈچۈن ھەر ئىككى ئىمتىھاندىن ئۆتۈش شەرت. بۇ كۇرستا Core 1 قىسمىدىن ئۆتۈش ئۈچۈن كېرەك بولغان بارلىق تېمىلار قاپلىنىدۇ.\n\n### IT ئاساسىي بىلىم يولى\n\nئەگەر بۇ يەرگە كەلگەن بولسىڭىز، ئەڭ ياخشىسى CompTIA Tech+ گۇۋاھنامىسىنى ئالغان ياكى شۇنىڭغا تەڭ دەرىجىدىكى IT ئاساسىي بىلىمىڭىز بار دەپ قارىلىدۇ. بۇ بىلىم سىزنى A+ Core 1 كۇرسىغا تەييارلايدۇ.\n\nبۇ باسقۇچتا بىز سىزنىڭ بار بولغان ئاساسىي بىلىمىڭىز ئۈستىگە قۇرۇپ، كېيىنكى CompTIA Network+ ۋە CompTIA Security+ قاتارلىق گۇۋاھنامىلەرگە تەييارلىق قىلىشقا ياردەم بېرىمىز. بۇ كۇرس IT ئىقتىدارىڭىزنى تەدرىجىي كېڭەيتىدىغان بىر پەلەمپەي سۈپىتىدە لايىھەلەنگەن.\n\n### Core 1 دە نېمىلەر ئۆگىنىلىدۇ؟\n\nCompTIA A+ Core 1 گۇۋاھنامە ئىمتىھانى كىرىش دەرىجىسىدىكى IT خادىملىرى كۈندىلىك خىزمەتتە قىلىدىغان ۋەزىپىلەرگە كېرەك بولغان ئاساسىي IT ماھارەت ۋە بىلىملەرگە مەركەزلىشىدۇ.\n\nئىمتىھاندىن ئۆتۈش ئۈچۈن تۆۋەندىكى تېمىلارنى چۈشىنىشىڭىز كېرەك:\n- كۆچمە ئۈسكۈنىلەر (mobile devices)\n- ئاساسىي تور بىلىمى (basic networking)\n- كومپيۇتېر قاتتىق دېتالى (computing hardware)\n- مەۋھۇملاشتۇرۇش (virtualization)\n- بۇلۇت ھېسابلاش (cloud computing)\n- يۇقىرىقى تېمىلارغا مۇناسىۋەتلىك مەسىلە ھەل قىلىش (troubleshooting)\n\n### ئىمتىھان تەپسىلاتى\n\nبۇ كۇرس بايان قىلغان CompTIA A+ Core 1 ئىمتىھانىنىڭ نەشرى 220-1201 بولۇپ، 2025-يىلى 3-ئايدا ئېلان قىلىنغان. بۇ نەشر كىرىش دەرىجىسىدىكى IT كەسپىي خادىملىرىدىن كۈتۈلىدىغان زامانىۋى ماھارەتلەرنى ئەكس ئەتتۈرىدۇ.\n\nئىمتىھاندا ئەڭ كۆپ بولغاندا 90 سوئال بولىدۇ. بۇلارنىڭ ئىچىدە كۆپ تاللاشلىق سوئاللار ۋە PBQ دەپ ئاتىلىدىغان Performance-Based Questions، يەنى ئەمەلىي ئىقتىدارغا ئاساسلانغان سوئاللار بار. ئىمتىھان ۋاقتى 90 مىنۇت، شۇڭا ۋاقىتنى ياخشى باشقۇرۇش مۇھىم.\n\nئۆتۈش نومۇرى 675، نومۇر دائىرىسى 900 گىچە.\n\nCertification Synergy نىڭ چۈشەندۈرۈشى بويىچە:\n- 500 دىن تۆۋەن: ماتېرىيالنى يەنە بىر ئاز كۆپرەك ئۆگىنىش كېرەك.\n- 500–674: ئۆتۈشكە بەك يېقىن؛ يەنە بىر نەچچە مەركەزلەشكەن ئۆگىنىش ۋاقتى كېرەك.\n- 675–749: تەبرىكلەيمىز، A+ Core 1 دىن رەسمىي ئۆتتىڭىز.\n- 750–799: ماتېرىيالنىڭ كۆپ قىسمىنى ناھايىتى ياخشى ئىگىلىگەنلىكىڭىزنى كۆرسىتىدۇ.\n- 800 ياكى ئۇنىڭدىن يۇقىرى: پەقەت ئۆتۈپلا قالماي، ئىنتايىن ياخشى نەتىجە قىلدىڭىز.\n- 900: مۇكەممەل نومۇر. (ۋىدېيودا يۇمۇر قىلىپ «بىزگە دەرھال ئالاقىلىشىڭ، سىزنى ئىشقا ئالماقچىمىز» دەيدۇ.) ئەمما راستىنى ئېيتقاندا، تەجرىبىلىك IT كەسپىي خادىملىرىمۇ 900 نومۇرنى ناھايىتى ئاز ئالىدۇ.\n\n### Exam Objectives — ئىمتىھان نىشانلىرى\n\nA+ Core 1 غا تەييارلىنىشتا CompTIA نىڭ رەسمىي Exam Objectives ھۆججىتى ئەڭ مۇھىم مەنبەلەرنىڭ بىرى. ئۇ پەقەت ئومۇمىي چۈشەندۈرۈش ئەمەس؛ ئىمتىھان كۈنىدىن بۇرۇن بىلىشىڭىز كېرەك بولغان نەرسىلەرنى تەپسىلىي كۆرسىتىدىغان يول خەرىتىسى.\n\nئۇنىڭدا:\n- قانچە سوئال بولۇشى مۇمكىنلىكى،\n- سوئال تۈرلىرى،\n- چۈشىنىشىڭىز تەلەپ قىلىنىدىغان ئېنىق تېمىلار،\n- مەزمۇننىڭ قانداق تەشكىللەنگەنلىكى\nكۆرسىتىلىدۇ.\n\nبۇنى رەسمىي ئۆگىنىش يول خەرىتىسى دەپ قاراشقا بولىدۇ. قايسى تېمىغا كۆپرەك ۋاقىت سەرپ قىلىش كېرەكلىكىنى بىلىشكە ياردەم بېرىدۇ. نۇرغۇن ئوقۇغۇچىلار بۇ ھۆججەتنى ئاتلاپ ئۆتىدۇ، ئەمما ئىنچىكە كۆرۈپ چىققانلار ئادەتتە ئىمتىھانغا تېخىمۇ ئىشەنچ بىلەن كىرىدۇ. شۇڭا ئۇنى ئىختىيارىي ئوقۇش ماتېرىيالى ئەمەس، بەلكى ئىمتىھاندىن ئۆتۈشتىكى مۇھىم قورال دەپ قاراڭ.\n\n### A+ Core 1 نىڭ بەش ئاساسلىق Domain ى\n\nرەسمىي Exam Objectives بويىچە A+ Core 1 بەش چوڭ ساھەگە (domain) بۆلۈنىدۇ:\n\n1. Mobile Devices — كۆچمە ئۈسكۈنىلەر: 13%\n2. Networking — تور: 23%\n3. Hardware — قاتتىق دېتال: 25%\n4. Virtualization and Cloud Computing — مەۋھۇملاشتۇرۇش ۋە بۇلۇت ھېسابلاش: 11%\n5. Hardware and Network Troubleshooting — قاتتىق دېتال ۋە تور مەسىلىلىرىنى ھەل قىلىش: 28%\n\nبۇ پىرسەنتلەر ھەر بىر ساھەنىڭ ئىمتىھاندا قانچىلىك ئېغىرلىققا ئىگە ئىكەنلىكىنى كۆرسىتىدۇ. بۇنى بىلىش «كۆپرەك» ئەمەس، «ئەقىللىقراق» ئۆگىنىشكە ياردەم بېرىدۇ.\n\nھەر بىر domain نىڭ ئىچىدە exam objective لار بار. Domain نى كىتابتىكى بىر باب دەپ قارىسىڭىز، objective لار شۇ باب ئىچىدىكى دەرسلەرگە ئوخشايدۇ.\n\nمەسىلەن، Domain 1 — Mobile Devices. ئۇ Objective 1.1 دىن باشلىنىدۇ:\n«بىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنە قاتتىق دېتالىنى كۆزىتىڭ ۋە مۇۋاپىق ئالماشتۇرۇش ئۇسۇلىنى ئىشلىتىڭ.»\n\nئەگەر بۇ تېمىلارنىڭ بەزىلىرى سىزگە ناتونۇش بولسا ئەنسىرىمەڭ. بۇ كۇرسنىڭ مەقسىتى شۇ تېمىلارنى ئېنىق، چۈشىنىشلىك ۋە ئىمتىھانغا ماس شەكىلدە قەدەممۇ-قەدەم ئۆگىتىش.\n\nنېمە ئۈچۈن تېخنىكىلىق تېمىلارغا كىرىشتىن بۇرۇن Exam Objectives قا بۇنچە ئەھمىيەت بېرىۋاتىمىز؟ چۈنكى ئۇلار سىزگە زادى نېمىلەرنى بىلىش كېرەكلىكىنى ئەڭ ئېنىق كۆرسىتىدۇ. شۇڭا «ئىمتىھاندا نېمە چىقىدۇ؟» دەپ پەرەز قىلىپ ۋاقىت ئىسراپ قىلمايسىز.\n\nكۇرس جەريانىدا ئۇلارنى ئۆگىنىش يېتەكچىسى قىلىپ ئىشلىتىڭ. كۇرسنى تاماملىغاندىن كېيىن بولسا، ئاخىرقى تەكشۈرۈش تىزىملىكى سۈپىتىدە قايتا كۆرۈڭ. ئىمتىھاندىن بۇرۇن Exam Objectives نى قايتا كۆرۈش ئاجىز تەرەپلىرىڭىزنى بايقاشقا ياردەم بېرىدۇ.\n\nرەسمىي Exam Objectives نى ۋىدېيو چۈشەندۈرۈشىدىكى ئۇلىنىش ئارقىلىق چۈشۈرگىلى بولىدۇ.\n\n### بۇ كۇرستىن ئەڭ ياخشى پايدىلىنىش\n\nھەر بىر ۋىدېيو بۆلىكىنى ئۆز سۈرئىتىڭىز بىلەن كۆرۈڭ. كېرەك بولسا توختىتىڭ، چۈشەنمىگەن يەرنى كەينىگە قايتۇرۇپ قايتا كۆرۈڭ، بىر تېمىغا ئىشەنچ ھاسىل قىلغۇچە قانچە قېتىم بولسا شۇنچە قېتىم قايتا كۆرۈشكە بولىدۇ. بۇ كۇرس سىزنىڭ ئېھتىياجىڭىزغا ماس ھالدا ئىشلىتىلىش ئۈچۈن تەييارلانغان.\n\nۋىدېيو قانىلىغا مۇشتەرى بولسىڭىز، Certification Synergy نىڭ يېڭى ھەقسىز تەربىيەلەش مەزمۇنلىرىنى تاپالايسىز. نۇرغۇن ئۆگەنگۈچىلەر بۇ مەنبەدىن پايدىلىنىپ IT كەسپىنى باشلىغان؛ ئەمدى نۆۋەت سىزدە.\n\nسىز بىرىنچى قەدەمنى باستىڭىز. ئەمدى تۇنجى دەرسكە كىرىپ، گۇۋاھنامە يولىنى باشلايلى."}, {"id": "1.1", "number": "1.1", "domain": "1", "domain_en": "Mobile Devices", "domain_ug": "كۆچمە ئۈسكۈنىلەر", "english": "Exam objective 1.1. Given a scenario, monitor mobile device hardware and use appropriate replacement techniques. Mobile device hardware.\n\nThe first topic up for the CompTIA A+ Core 1 certification exam is mobile device hardware and replacement techniques, which is why we are starting by defining the term mobile device. In IT, a mobile device is a portable, battery-powered computing gadget, such as a smartphone, tablet, or laptop, designed for ease of mobility. These devices are built to be used on the go and typically include wireless connectivity, along with features that support communication, web browsing, and application usage from just about anywhere.\n\nBecause mobile devices are portable and powerful, they are also constantly on the move, and that puts them at constant risk. They get dropped, overheat, spilled on, stuffed into backpacks, and charged with whatever cable happens to be closest. In this video segment, we are focusing specifically on mobile device hardware, how to monitor it for signs of failure, and how to determine when replacement is the appropriate solution.\n\nThis is not about guessing or swapping parts at random. It is about recognizing symptoms, understanding what those symptoms point to, and making smart, safe decisions exactly the way CompTIA expects you to do on the exam. While these portable devices allow us to perform many of the same tasks as a traditional desktop computer, their internal computing components are very different.\n\nUnlike the spacious interior of a desktop PC, mobile devices must fit everything into an extremely small and tightly packed space. Because of this, engineers design mobile device hardware with a strong focus on miniaturization, power efficiency, and heat management, all while still delivering usable performance. These design choices introduce unique challenges for IT professionals.\n\nComponents are often soldered directly to the motherboard, which limits upgrade options and makes individual part replacement more difficult. Limited airflow also increases the importance of proper heat management, and battery-powered operation requires careful handling to avoid safety risks. As a result, when hardware problems occur on mobile devices, the correct response is frequently replacement rather than repair.\n\nKeeping these constraints in mind will help you approach mobile device issues logically and choose the most appropriate solution, both on the exam and in real-world scenarios. With these design challenges in mind, the first component we need to talk about is also one of the most important, and potentially the most dangerous, the battery. Before you open a mobile device or begin any internal work, safety should always come first.\n\nAlways start by disconnecting the device from any external power source and make sure it is completely powered off. If the battery is removable, remove it before continuing. This single step helps prevent electrical shorts, protects internal components, and reduces the risk of personal injury.\n\nOn the exam, any scenario that involves opening a device should immediately trigger safe power handling in your thought process. Once safety is handled, we can move on to battery replacement. Not all mobile device batteries are designed the same way.\n\nSome are easy to remove, while others require careful disassembly because everything inside the device is tightly packed. This is where following manufacturer guidelines becomes critical. Common signs that a battery needs to be replaced include rapid battery drain, overheating while charging, unexpected shutdowns, or visible swelling.\n\nBattery swelling is especially serious because it can cause physical damage to the device and create a safety hazard. After replacement, proper battery disposal is just as important. Mobile device batteries should never be thrown into regular trash because of the chemicals they contain.\n\nInstead, they must be disposed of through approved recycling programs or according to local regulations. Another category of mobile device hardware covered in this exam objective is keyboards and individual keys or key caps. Because keyboards are used constantly, they are also one of the most common sources of user-reported problems.\n\nMany laptops use an integrated keyboard, meaning the keyboard is built directly into the device and is not designed to be removed or replaced as a separate component. This design helps keep devices thin and portable, but it also directly affects how keyboard issues are monitored and resolved. Monitoring keyboard problems begins by determining the scope of the issue.\n\nIn some cases, multiple keys may fail or the entire keyboard may become unresponsive. In other situations, the problem is limited to a single key. Keys that fail to register input, repeat characters, feel stuck, or behave differently than surrounding keys often point to a hardware-related issue.\n\nIn these cases, a visual inspection can sometimes reveal debris, residue, or corrosion that helps explain the behavior. When a problem is limited to a single key, the next step is to consider the least disruptive solution. After checking for debris or obstructions, replacing the key cap may restore normal operation without requiring deeper disassembly.\n\nThis approach is cost-effective and appropriate when the rest of the keyboard is functioning normally and it avoids unnecessary replacement of larger components. If keyboard issues extend beyond a single key or continue after basic fixes, the integrated nature of many keyboards becomes a deciding factor. Resolving broader keyboard problems may require replacing the entire keyboard assembly or, in some designs, the top case of the device.\n\nAnother important category of mobile device hardware is random access memory, commonly referred to as RAM. RAM plays a major role in overall system performance and how it is implemented varies depending on the type of mobile device. In laptops, RAM is typically installed using small outline dual in-line memory modules, often abbreviated as SODIM.\n\nAs the name suggests, SODIMs are more compact than the standard memory modules used in desktop computers which allows them to fit inside thinner laptop designs. They are also designed for lower power consumption, helping extend battery life. In many laptops, SODIM memory can be upgraded, making RAM one of the few components that can be replaced to improve performance.\n\nSmartphones and tablets handle RAM a bit differently. In these devices, RAM is commonly soldered directly to the motherboard rather than installed as a removable module. This design saves space and improves efficiency, but it also means the RAM is not user-upgradable.\n\nIncreasing memory capacity would require redesigning the motherboard itself, making RAM a fixed resource from the moment the device is manufactured. The next component we will cover is mobile device storage, which is where the operating system, applications, and user data are stored. In laptops, storage is typically provided by either a hard disk drive or a solid state drive, and understanding the differences between the two is important for both performance and replacement decisions.\n\nA hard disk drive, often referred to as an HDD, uses mechanical components to store and retrieve data. HDDs are generally more affordable and can offer larger storage capacities at a lower cost. However, because they contain moving parts, HDDs are slower, more fragile, and more susceptible to damage, especially in mobile devices that are frequently moved.\n\nA solid state drive, commonly referred to as an SSD, stores data using flash memory and has no moving parts. This design allows SSDs to provide much faster data access, improve durability and shock resistance, and lower power consumption compared to HDDs. In laptops, upgrading from an HDD to an SSD often results in a noticeable improvement in boot times, application loading, and overall responsiveness.\n\nThe final mobile device hardware component we will cover in this video segment is built-in cameras and microphones, which are commonly used for video calls, conferencing, and media capture, because these components are integrated directly into the device. Issues with cameras or microphones can be frustrating for users and sometimes difficult to isolate. Monitoring these components typically starts at the application level.\n\nA camera that is not detected, produces a black image, or works inconsistently across multiple applications may indicate a hardware issue. Physical damage to the camera lens or surrounding area can also impact functionality. Microphone problems often present as distorted audio, no input detected, or audio cutting in and out.\n\nIf these issues occur across multiple applications and settings, the likelihood of a hardware-related problem increases. Replacement considerations for cameras and microphones depend heavily on device design. In many laptops, tablets, and smartphones, these components are integrated into the display assembly or internal frame, making individual repair and replacement difficult.\n\nExam objective 1.1. Given a scenario, monitor mobile device hardware and use appropriate replacement techniques. Wireless cards.\n\nYou open a laptop, connect to Wi-Fi, pair a Bluetooth mouse, and maybe even tether to a mobile hotspot, all without plugging in a single cable. None of that works without one critical piece of hardware behind the scenes, the wireless network interface card. Wireless network interface cards, often called wireless NICs or wireless network adapters, are the hardware components that allow computers and other devices to connect to wireless networks when wired connections like ethernet cables and RJ45 connectors are not available.\n\nThese network interface cards are installed inside mobile devices and handle a wide range of wireless signals that keep users connected on the go. In laptops, how that wireless capability is delivered can vary. Some systems use onboard wireless NICs while others rely on a replaceable expansion card.\n\nOnboard wireless NICs are built directly into the motherboard and are not designed to be replaced individually. Wireless expansion cards, on the other hand, are separate components that can be installed, removed, and replaced if necessary. Many laptops use this expansion style design, allowing a single device to support multiple wireless card technologies.\n\nThose technologies typically include Bluetooth, Wi-Fi, and cellular connectivity. Bluetooth cards support short-range connections to peripherals like keyboards, mice, and speakers. Wireless local area network, or WLAN cards, allow devices to connect to nearby Wi-Fi networks while wireless wide area network, or WLAN cards, enables internet access over cellular networks.\n\nBecause all of this connectivity depends on a small internal card, wireless problems often show up in very noticeable ways. Symptoms may include weak signal strength, intermittent connectivity, or an inability to detect available networks. In some cases, the wireless card itself is not the issue.\n\nInstead, the problem lies with the antenna connections attached to it. Inside a laptop, antenna cables are carefully routed from the wireless card around internal components and up into the display assembly. From there, the antennas are typically positioned near the top of the screen, tucked behind the display trim bezel, where they can receive signals with minimal obstruction.\n\nThis routing is intentional and designed to reduce interference while maximizing signal strength. If these cables become loose, pinched, or routed incorrectly during a repair or installation, wireless performance can suffer even when the wireless card itself is functioning normally.\n\nExam objective 1.1. Given a scenario, monitor mobile device hardware and use appropriate replacement techniques. Physical privacy and security.\n\nThe security features of mobile devices, including laptops, often differ from those found on desktop systems. Because mobile devices are portable and frequently used outside of controlled environments, certain physical privacy and security features are more prominent. Two key examples covered in this objective are biometric authentication and near-field communication, often abbreviated as NFC.\n\nBiometric authentication uses physical characteristics, such as fingerprints or facial features, to verify a user's identity. Fingerprint readers are commonly found on laptops because they provide fast and convenient access without requiring complex passwords. These sensors can be used to unlock the device, authenticate purchases, or sign into secure services while ensuring that only authorized users can gain access.\n\nFrom a physical security standpoint, biometrics help protect devices that may be used in public or shared spaces. Near-field communication is another technology frequently associated with mobile device security. NFC allows devices to exchange data over very short distances, typically requiring close physical proximity.\n\nThis makes NFC useful for secure pairing, authentication, and data exchange with smartphones, tablets, badges, or payment systems. Because NFC operates at such short ranges, it helps reduce the risk of unauthorized access compared to longer-range wireless technologies.", "uyghur": "Exam Objective 1.1\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ قاتتىق دېتال ھالىتىنى نازارەت قىلىڭ ۋە مۇۋاپىق زاپچاس ئالماشتۇرۇش ئۇسۇللىرىنى قوللىنىڭ.\n\n## كۆچمە ئۈسكۈنە قاتتىق دېتالى (Mobile Device Hardware)\n\nCompTIA A+ Core 1 ئىمتىھانىدىكى تۇنجى تېما كۆچمە ئۈسكۈنىنىڭ قاتتىق دېتالى ۋە زاپچاس ئالماشتۇرۇش ئۇسۇللىرىدۇر. شۇڭا ئالدى بىلەن «كۆچمە ئۈسكۈنە» (mobile device) دېگەن نېمە ئىكەنلىكىنى ئېنىقلاپ ئۆتەيلى.\n\nIT ساھەسىدە كۆچمە ئۈسكۈنە — ئەقلىي تېلېفون، تاختا كومپيۇتېر (tablet) ياكى خاتىرە كومپيۇتېر (laptop) غا ئوخشاش، ئېلىپ يۈرۈشكە ئەپلىك ۋە باتارېيەدە ئىشلەيدىغان ھېسابلاش ئۈسكۈنىسىدۇر. بۇ ئۈسكۈنىلەر يولدا ياكى ھەر خىل جايدا ئىشلىتىشكە لايىھەلەنگەن بولۇپ، ئادەتتە سىمسىز ئۇلىنىش، ئالاقە قىلىش، تور كۆرۈش ۋە ئەپ ئىشلىتىش ئىقتىدارلىرىنى ئۆز ئىچىگە ئالىدۇ.\n\nكۆچمە ئۈسكۈنىلەر ئېلىپ يۈرۈشكە قولايلىق ۋە ئىقتىدارلىق بولغاچقا، دائىم يۆتكىلىپ تۇرىدۇ؛ شۇنىڭ بىلەن بىرگە زىيانغا ئۇچراش ئېھتىمالىمۇ يۇقىرى بولىدۇ. مەسىلەن، ئۈسكۈنە يەرگە چۈشۈپ كېتىشى، قىزىپ كېتىشى، ئۈستىگە سۇيۇقلۇق تۆكۈلۈشى، سومكىغا قىستىلىپ قېلىشى ياكى قولغا كەلگەن ھەر قانداق زەرەتلەش سىمى بىلەن زەرەتلىنىشى مۇمكىن.\n\nبۇ بۆلەكتە كۆچمە ئۈسكۈنە قاتتىق دېتالىنىڭ ھالىتىنى قانداق نازارەت قىلىش، بۇزۇلۇش ئالامەتلىرىنى قانداق تونۇش ۋە قاچان زاپچاسنى ئالماشتۇرۇشنىڭ مۇۋاپىق چارە بولىدىغانلىقىنى قانداق بېكىتىش توغرىسىدا ئۆگىنىمىز.\n\nبۇ يەردىكى مەقسەت پەرەز قىلىپ زاپچاسلارنى قالايمىقان ئالماشتۇرۇپ كۆرۈش ئەمەس. بەلكى ئالامەتنى تونۇش، ئۇ ئالامەتنىڭ قايسى مەسىلىگە ئىشارەت قىلىدىغانلىقىنى چۈشىنىش ۋە CompTIA ئىمتىھانىدا كۈتۈلگەندەك ئەقىللىق ھەم بىخەتەر قارار چىقىرىشتۇر.\n\nكۆچمە ئۈسكۈنىلەر ئۈستەل كومپيۇتېرى قىلالايدىغان نۇرغۇن ئىشنى قىلالىسىمۇ، ئۇلارنىڭ ئىچكى زاپچاسلىرىنىڭ لايىھىسى زور دەرىجىدە پەرقلىنىدۇ. ئۈستەل كومپيۇتېرىنىڭ ئىچىدە بوشلۇق كۆپ، ئەمما كۆچمە ئۈسكۈنىدە ھەممە زاپچاس ناھايىتى كىچىك ۋە قىستاڭ بوشلۇققا سىغدۇرۇلۇشى كېرەك.\n\nشۇڭا ئىنژېنېرلار كۆچمە ئۈسكۈنە قاتتىق دېتالىنى لايىھەلەشتە تۆۋەندىكى ئۈچ نۇقتىغا ئالاھىدە ئەھمىيەت بېرىدۇ:\n- زاپچاسلارنى كىچىكلىتىپ لايىھەلەش (miniaturization)\n- توك سەرپىيات ئۈنۈمدارلىقى (power efficiency)\n- ئىسسىقلىقنى باشقۇرۇش (heat management)\n\nبۇنىڭ بىلەن بىر ۋاقىتتا، ئۈسكۈنىنىڭ كۈندىلىك ئىشلىتىشكە يېتەرلىك ئىقتىدارىنىمۇ ساقلاپ قېلىش كېرەك.\n\nبۇ لايىھە چەكلىمىلىرى IT خادىملىرىغا ئۆزىگە خاس قىيىنچىلىق پەيدا قىلىدۇ. نۇرغۇن زاپچاس ئانا تاختىغا (motherboard) بىۋاسىتە لېھىملەپ مۇقىملاشتۇرۇلغان بولىدۇ. بۇ يېڭىلاش ئىمكانىيىتىنى چەكلەپ، يەككە زاپچاسنى ئالماشتۇرۇشنى قىيىنلاشتۇرىدۇ.\n\nھاۋا ئېقىمى چەكلىك بولغاچقا، ئىسسىقلىقنى توغرا باشقۇرۇش تېخىمۇ مۇھىم بولىدۇ. باتارېيەدە ئىشلەيدىغان ئۈسكۈنىلەرنى بىر تەرەپ قىلغاندا بولسا بىخەتەرلىككە ئالاھىدە دىققەت قىلىش كېرەك.\n\nشۇڭا كۆچمە ئۈسكۈنىدە قاتتىق دېتال مەسىلىسى كۆرۈلگەندە، ئەڭ مۇۋاپىق چارە كۆپىنچە يەككە زاپچاسنى رېمونت قىلىش ئەمەس، بەلكى ئۇنى ئالماشتۇرۇش بولۇشى مۇمكىن. بۇ چەكلىمىلەرنى ئەستە تۇتۇش ئىمتىھاندا ۋە ئەمەلىي خىزمەتتە مەسىلىنى لوگىكىلىق تەھلىل قىلىپ، توغرا چارە تاللىشىڭىزغا ياردەم بېرىدۇ.\n\n### باتارېيە (Battery)\n\nكۆچمە ئۈسكۈنىدىكى ئەڭ مۇھىم، شۇنداقلا خاتا بىر تەرەپ قىلىنسا ئەڭ خەتەرلىك بولۇشى مۇمكىن بولغان زاپچاسلارنىڭ بىرى باتارېيەدۇر.\n\nكۆچمە ئۈسكۈنىنى ئېچىپ، ئىچكى زاپچاسلىرى ئۈستىدە ئىشلەشتىن بۇرۇن بىخەتەرلىكنى بىرىنچى ئورۇنغا قويۇڭ:\n1. ئۈسكۈنىنى بارلىق سىرتقى توك مەنبەلىرىدىن ئۈزۈڭ.\n2. ئۈسكۈنىنىڭ پۈتۈنلەي ئۆچۈرۈلگەنلىكىنى جەزملەشتۈرۈڭ.\n3. ئەگەر باتارېيەنى چىقارغىلى بولسا، ئىچكى زاپچاسلارغا تېگىشتىن بۇرۇن باتارېيەنى ئېلىۋېتىڭ.\n\nبۇ ئاددىي قەدەم ئېلېكتر قىسقا تۇتۇش خەۋپىنى ئازايتىدۇ، ئىچكى زاپچاسلارنى قوغدايدۇ ۋە ئادەم يارىلىنىش ئېھتىمالىنى تۆۋەنلىتىدۇ.\n\nئىمتىھاندا ئۈسكۈنىنى ئېچىش تەلەپ قىلىنغان بىر ئەھۋالنى (scenario) كۆرسىڭىز، كاللىڭىزغا ئالدى بىلەن توك مەنبەسىنى بىخەتەر بىر تەرەپ قىلىش كېلىشى كېرەك.\n\nبىخەتەرلىك تەدبىرلىرىنى تاماملىغاندىن كېيىن باتارېيە ئالماشتۇرۇشقا ئۆتكىلى بولىدۇ. بارلىق كۆچمە ئۈسكۈنىلەرنىڭ باتارېيە لايىھىسى ئوخشاش ئەمەس. بەزى باتارېيەلەرنى ئاسانلا چىقارغىلى بولىدۇ؛ بەزىلىرى بولسا ئۈسكۈنىنىڭ ئىچى ناھايىتى قىستاڭ بولغاچقا، ئېھتىياتچانلىق بىلەن چۇۋۇشنى تەلەپ قىلىدۇ. بۇ ۋاقىتتا ئىشلەپچىقارغۇچىنىڭ رەسمىي كۆرسەتمىسىگە ئەگىشىش ئىنتايىن مۇھىم.\n\nباتارېيە ئالماشتۇرۇش كېرەكلىكىنى كۆرسىتىدىغان كۆپ ئۇچرايدىغان ئالامەتلەر:\n- باتارېيە توكىنىڭ ناھايىتى تېز تۈگەپ كېتىشى\n- زەرەتلىگەندە بەك قىزىپ كېتىشى\n- ئۈسكۈنىنىڭ ئويلىمىغان يەردىن ئۆچۈپ قېلىشى\n- باتارېيەنىڭ كۆرۈنەرلىك ئىششىپ كېتىشى\n\nباتارېيەنىڭ ئىششىشى ئالاھىدە ئېغىر ئالامەت. ئۇ ئۈسكۈنىگە جىسمانىي زىيان يەتكۈزۈپلا قالماي، بىخەتەرلىك خەۋپىمۇ پەيدا قىلىشى مۇمكىن.\n\nباتارېيە ئالماشتۇرۇلغاندىن كېيىن، كونا باتارېيەنى بىخەتەر بىر تەرەپ قىلىشمۇ شۇنچە مۇھىم. كۆچمە ئۈسكۈنە باتارېيەلىرىنى ئىچىدىكى خىمىيىلىك ماددىلار سەۋەبىدىن ئادەتتىكى ئەخلەتكە تاشلاشقا بولمايدۇ. ئۇنى تەستىقلانغان باتارېيە يىغىۋېلىش پروگراممىسىغا تاپشۇرۇش ياكى يەرلىك قائىدىلەر بويىچە بىر تەرەپ قىلىش كېرەك.\n\n### كۇنۇپكا تاختىسى، يەككە كۇنۇپكا ۋە كۇنۇپكا قاپقىقى (Keycap)\n\nبۇ objective دا قاپلىنىدىغان يەنە بىر قاتتىق دېتال تۈرى كۇنۇپكا تاختىسى (keyboard)، يەككە كۇنۇپكىلار ۋە كۇنۇپكا قاپقىقى (keycap) دۇر.\n\nكۇنۇپكا تاختىسى دائىم ئىشلىتىلىدىغان بولغاچقا، ئىشلەتكۈچى ئەڭ كۆپ مەسىلە دوكلات قىلىدىغان زاپچاسلارنىڭ بىرى ھېسابلىنىدۇ.\n\nنۇرغۇن خاتىرە كومپيۇتېرلاردا كۇنۇپكا تاختىسى ئۈسكۈنىگە بىۋاسىتە بىرلەشتۈرۈلگەن بولىدۇ (integrated keyboard). بۇ خىل كۇنۇپكا تاختىسى ئادەتتە ئاددىيلا چىقىرىپ، ئايرىم زاپچاس سۈپىتىدە ئالماشتۇرۇش ئۈچۈن لايىھەلەنمىگەن. بۇ لايىھە خاتىرە كومپيۇتېرنى نېپىز ۋە ئېلىپ يۈرۈشكە قولايلىق قىلىدۇ، ئەمما كۇنۇپكا تاختىسىدىكى مەسىلىنى قانداق ھەل قىلىشقا بىۋاسىتە تەسىر كۆرسىتىدۇ.\n\nكۇنۇپكا تاختىسىدىكى مەسىلىنى تەكشۈرگەندە ئالدى بىلەن مەسىلىنىڭ دائىرىسىنى ئېنىقلاڭ:\n- بىر نەچچە كۇنۇپكا ئىشلەمەمدۇ؟\n- پۈتۈن كۇنۇپكا تاختىسى جاۋاب بەرمەمدۇ؟\n- ياكى مەسىلە پەقەت بىرلا كۇنۇپكىدىمۇ؟\n\nكۇنۇپكا باسقاندا ھەرپ ياكى بۇيرۇقنىڭ تىزىملىتىلماسلىقى، بىر ھەرپنىڭ قايتا-قايتا چىقىشى، كۇنۇپكىنىڭ قېتىپ قالغاندەك بولۇشى ياكى باشقا كۇنۇپكىلاردىن پەرقلىق ھەرىكەت قىلىشى قاتتىق دېتال مەسىلىسىگە ئىشارەت قىلىشى مۇمكىن.\n\nكۆز بىلەن تەكشۈرگەندە چاڭ-توزان، كىر-قالدۇق، سۇيۇقلۇق ئىزى ياكى چىرىش (corrosion) قاتارلىق سەۋەبلەرنى بايقىغىلى بولىدۇ.\n\nئەگەر مەسىلە پەقەت بىرلا كۇنۇپكىدا بولسا، ئەڭ ئاز چۇۋۇشنى تەلەپ قىلىدىغان چارىنى ئالدىن تاللاڭ. ئالدى بىلەن كۇنۇپكىنىڭ ئاستىدا كىر ياكى توسالغۇ بار-يوقلۇقىنى تەكشۈرۈڭ. ئاندىن كېرەك بولسا پەقەت كۇنۇپكا قاپقىقىنى (keycap) ئالماشتۇرۇپ نورمال ئىشلىشىنى ئەسلىگە كەلتۈرگىلى بولۇشى مۇمكىن. باشقا كۇنۇپكىلار نورمال ئىشلەۋاتسا، بۇ ئەرزان ۋە مۇۋاپىق چارە بولۇپ، چوڭ زاپچاسنى بىھۇدە ئالماشتۇرۇشتىن ساقلايدۇ.\n\nئەگەر مەسىلە بىر كۇنۇپكىدىن كەڭرەك دائىرىدە بولسا ياكى ئاددىي چارىلەردىن كېيىنمۇ داۋاملاشسا، بىرلەشتۈرۈلگەن كۇنۇپكا تاختىسىنىڭ لايىھىسى قارارغا تەسىر قىلىدۇ. بۇنداق ئەھۋالدا پۈتۈن كۇنۇپكا تاختىسى توپلىمىنى (keyboard assembly)، بەزى مودېللاردا بولسا ئۈستۈنكى قاپ/رامكا قىسمىنى (top case) ئالماشتۇرۇشقا توغرا كېلىشى مۇمكىن.\n\n### RAM — Random Access Memory\n\nكۆچمە ئۈسكۈنە قاتتىق دېتالىدىكى يەنە بىر مۇھىم زاپچاس RAM دۇر. RAM — Random Access Memory نىڭ قىسقارتىلمىسى بولۇپ، سىستېما ئىشلىۋاتقاندا لازىملىق سانلىق مەلۇماتنى ۋاقىتلىق ساقلايدىغان تېز ئىچكى ساقلىغۇچتۇر. ئۇ سىستېمىنىڭ ئومۇمىي ئىقتىدارىغا زور تەسىر كۆرسىتىدۇ، قانداق ئورنىتىلىشى بولسا ئۈسكۈنە تۈرىگە قاراپ پەرقلىنىدۇ.\n\nخاتىرە كومپيۇتېرلاردا RAM ئادەتتە SODIMM (Small Outline Dual In-line Memory Module) مودۇلى شەكلىدە ئورنىتىلىدۇ. SODIMM ئۈستەل كومپيۇتېرىدا ئىشلىتىلىدىغان ئۆلچەملىك RAM مودۇلىدىن كىچىكرەك بولغاچقا، نېپىز خاتىرە كومپيۇتېر لايىھىسىگە ماس كېلىدۇ. بۇ خىل مودۇللار تۆۋەنرەك توك سەرپىياتىغا ماسلاشتۇرۇلغان بولۇپ، باتارېيە ۋاقتىنى ئۇزارتىشقا ياردەم بېرىدۇ.\n\nنۇرغۇن خاتىرە كومپيۇتېرلاردا SODIMM RAM نى يېڭىلاش ياكى ئالماشتۇرۇشقا بولىدۇ. شۇڭا RAM كۆچمە كومپيۇتېردا ئىقتىدارنى ياخشىلاش ئۈچۈن ئالماشتۇرغىلى بولىدىغان ئاز ساندىكى زاپچاسلارنىڭ بىرىدۇر.\n\nئەقلىي تېلېفون ۋە تاختا كومپيۇتېرلاردا RAM باشقىچە ئورنىتىلىدۇ. بۇ ئۈسكۈنىلەردە RAM ئادەتتە چىقىرىۋالغىلى بولىدىغان مودۇل ئەمەس، بەلكى ئانا تاختىغا بىۋاسىتە لېھىملەپ مۇقىملاشتۇرۇلغان بولىدۇ. بۇ بوشلۇقنى تېجەپ، ئۈنۈمدارلىقنى ياخشىلايدۇ؛ ئەمما RAM نى ئىشلەتكۈچىنىڭ ئۆزى يېڭىلىشىغا يول قويمايدۇ. سىغىمىنى كۆپەيتىش ئۈچۈن ئانا تاختا لايىھىسىنى ئۆزگەرتىشكە توغرا كېلىدىغان بولغاچقا، بۇ ئۈسكۈنىلەردىكى RAM ئىشلەپچىقىرىلغان ۋاقىتتىن باشلاپ مۇقىم سىغىم ھېسابلىنىدۇ.\n\n### ساقلاش ئۈسكۈنىلىرى (Storage)\n\nساقلاش ئۈسكۈنىسى مەشغۇلات سىستېمىسى، ئەپلەر ۋە ئىشلەتكۈچىنىڭ سانلىق مەلۇماتلىرى ساقلىنىدىغان جاي.\n\nخاتىرە كومپيۇتېرلاردا ئادەتتە تۆۋەندىكى ئىككى خىل ساقلاش ئۈسكۈنىسى ئۇچرايدۇ:\n- HDD (Hard Disk Drive) — مېخانىكىلىق قاتتىق دىسكا\n- SSD (Solid State Drive) — قاتتىق ھالەتلىك دىسكا\n\nHDD سانلىق مەلۇماتنى ساقلاش ۋە ئوقۇش ئۈچۈن ھەرىكەتچان مېخانىكىلىق زاپچاسلارنى ئىشلىتىدۇ. ئادەتتە باھاسى ئەرزانراق بولۇپ، ئوخشاش باھادا تېخىمۇ چوڭ سىغىم تەمىنلىشى مۇمكىن. ئەمما ئىچىدە ھەرىكەتچان زاپچاس بولغاچقا، SSD غا قارىغاندا ئاستا، نازۇك ۋە سوقۇلۇشتىن ئاسان زىيان كۆرىدۇ — بولۇپمۇ دائىم يۆتكەپ يۈرۈلىدىغان كۆچمە ئۈسكۈنىلەردە.\n\nSSD بولسا سانلىق مەلۇماتنى flash memory دا ساقلايدۇ ۋە ئىچىدە ھەرىكەتچان مېخانىكىلىق زاپچاس بولمايدۇ. شۇڭا SSD:\n- سانلىق مەلۇماتقا تېخىمۇ تېز زىيارەت قىلىدۇ\n- سوقۇلۇشقا تېخىمۇ چىداملىق بولىدۇ\n- HDD غا قارىغاندا تۆۋەنرەك توك سەرپ قىلىدۇ\n\nخاتىرە كومپيۇتېردا HDD نى SSD غا ئالماشتۇرۇش ئادەتتە سىستېمىنىڭ قوزغىلىش ۋاقتىنى، ئەپلەرنىڭ يۈكلىنىش سۈرئىتىنى ۋە ئومۇمىي جاۋاب قايتۇرۇش سۈرئىتىنى كۆرۈنەرلىك ياخشىلايدۇ.\n\n### ئىچىگە بىرلەشتۈرۈلگەن كامېرا ۋە مىكروفون\n\nبۇ بۆلەكتە قاپلىنىدىغان ئاخىرقى كۆچمە ئۈسكۈنە قاتتىق دېتاللىرى ئىچىگە بىرلەشتۈرۈلگەن كامېرا ۋە مىكروفوندۇر. ئۇلار سىنلىق سۆھبەت، تور يىغىنى ۋە سۈرەت/ئاۋاز خاتىرىلەش ئۈچۈن كۆپ ئىشلىتىلىدۇ.\n\nكامېرا ياكى مىكروفون مەسىلىسى ئىشلەتكۈچىگە ناھايىتى بىئاراملىق ئېلىپ كېلىشى مۇمكىن، سەۋەبىنى ئېنىقلاش بولسا بەزىدە قىيىن بولىدۇ.\n\nكامېرانى تەكشۈرۈش ئادەتتە ئالدى بىلەن ئەپ سەۋىيەسىدىن باشلىنىدۇ. تۆۋەندىكى ئەھۋاللار قاتتىق دېتال مەسىلىسىگە ئىشارەت قىلىشى مۇمكىن:\n- كامېرا بايقالمىسا\n- كامېرا قارا كۆرۈنۈش كۆرسەتسە\n- بىر نەچچە ئەپتە مۇقىم ئىشلىمەي قالسا\n- كامېرا لىنزىسى ياكى ئەتراپىدا جىسمانىي زىيان كۆرۈلسە\n\nمىكروفون مەسىلىلىرى كۆپىنچە تۆۋەندىكى شەكىلدە كۆرۈلىدۇ:\n- ئاۋاز بۇزۇلۇپ چىقىدۇ\n- ھېچقانداق ئاۋاز كىرىشى بايقالمىيدۇ\n- ئاۋاز ئۈزۈلۈپ-ئۈزۈلۈپ كېلىدۇ\n\nئەگەر بۇ مەسىلىلەر بىر نەچچە ئەپ ۋە تەڭشەكتە ئوخشاش كۆرۈلسە، قاتتىق دېتال مەسىلىسى بولۇش ئېھتىمالى يۇقىرىلايدۇ.\n\nكامېرا ۋە مىكروفوننى ئالماشتۇرۇش ئۇسۇلى ئۈسكۈنىنىڭ لايىھىسىگە زور دەرىجىدە باغلىق. نۇرغۇن خاتىرە كومپيۇتېر، تاختا كومپيۇتېر ۋە ئەقلىي تېلېفونلاردا بۇ زاپچاسلار ئېكران توپلىمىغا (display assembly) ياكى ئىچكى رامكىغا بىرلەشتۈرۈلگەن بولغاچقا، يەككە زاپچاسنى رېمونت قىلىش ياكى ئالماشتۇرۇش قىيىن بولۇشى مۇمكىن.\n\nExam Objective 1.1\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ قاتتىق دېتال ھالىتىنى نازارەت قىلىڭ ۋە مۇۋاپىق زاپچاس ئالماشتۇرۇش ئۇسۇللىرىنى قوللىنىڭ.\n\n## سىمسىز تور كارتىلىرى (Wireless Cards)\n\nخاتىرە كومپيۇتېرنى ئاچىسىز، Wi-Fi غا ئۇلىنىسىز، Bluetooth مائۇسىنى جۈپلەيسىز، بەزىدە كۆچمە hotspot ئارقىلىق تورغا چىقىسىز — بۇلارنىڭ ھەممىسى بىر تال سىم ئۇلىمايلا ئەمەلگە ئاشىدۇ. بۇ ئىقتىدارلارنىڭ ئارقىسىدا مۇھىم بىر قاتتىق دېتال بار: سىمسىز تور كارتىسى.\n\nWireless network interface card ئادەتتە wireless NIC ياكى wireless network adapter دەپمۇ ئاتىلىدۇ. بۇ زاپچاس كومپيۇتېر ۋە باشقا ئۈسكۈنىلەرنىڭ Ethernet سىمى ياكى RJ45 ئۇلىغۇچقا ئوخشاش سىملىق ئۇلىنىش ئىشلىتىلمىگەن ۋاقىتتا سىمسىز تورغا ئۇلىنىشىنى تەمىنلەيدۇ.\n\nسىمسىز تور كارتىسى كۆچمە ئۈسكۈنىنىڭ ئىچىگە ئورنىتىلىپ، ئىشلەتكۈچىنىڭ ھەرىكەت ئۈستىدىمۇ سىمسىز ئالاقە قىلىشى ئۈچۈن كېرەكلىك سىگناللارنى بىر تەرەپ قىلىدۇ.\n\nخاتىرە كومپيۇتېردا بۇ سىمسىز ئىقتىدار ئىككى خىل ئۇسۇلدا تەمىنلىنىشى مۇمكىن:\n- ئانا تاختىغا بىرلەشتۈرۈلگەن سىمسىز NIC (onboard wireless NIC): ئانا تاختىنىڭ بىر قىسمى بولۇپ، ئادەتتە ئايرىم ئالماشتۇرۇشقا لايىھەلەنمىگەن.\n- سىمسىز كېڭەيتىش كارتىسى (wireless expansion card): ئايرىم زاپچاس بولۇپ، كېرەك بولسا ئورنىتىش، چىقىرىش ۋە ئالماشتۇرۇشقا بولىدۇ.\n\nنۇرغۇن خاتىرە كومپيۇتېرلاردا ئالماشتۇرغىلى بولىدىغان كېڭەيتىش كارتىسى ئىشلىتىلىدۇ. بىر ئۈسكۈنە بىر نەچچە خىل سىمسىز تېخنىكىنى قوللىشى مۇمكىن. كۆپ ئۇچرايدىغانلىرى:\n- Bluetooth\n- Wi-Fi / WLAN\n- كۆچمە ئالاقە تورى / WWAN\n\nBluetooth يېقىن ئارىلىقتىكى كۇنۇپكا تاختىسى، مائۇس ۋە ياڭراتقۇغا ئوخشاش قوشۇمچە ئۈسكۈنىلەر بىلەن ئۇلىنىشقا ئىشلىتىلىدۇ.\n\nWLAN (Wireless Local Area Network) كارتىسى يېقىن ئەتراپتىكى Wi-Fi تورىغا ئۇلىنىشقا ئىشلىتىلىدۇ.\n\nWWAN (Wireless Wide Area Network) ياكى كۆچمە ئالاقە كارتىسى بولسا cellular تورى ئارقىلىق ئىنتېرنېت زىيارىتىنى تەمىنلەيدۇ.\n\nسىمسىز ئۇلىنىش كىچىك بىر ئىچكى كارتاغا تايانغان بولغاچقا، بۇ كارتا ياكى ئۇنىڭ ئۇلىنىشىدا مەسىلە كۆرۈلسە ئالامەت ئادەتتە تېز سېزىلىدۇ. مەسىلەن:\n- سىگنال كۈچى ئاجىز بولۇش\n- ئۇلىنىشنىڭ پات-پات ئۈزۈلۈپ قېلىشى\n- بار بولغان سىمسىز تورلارنى بايقىيالماسلىق\n\nبەزىدە مەسىلە سىمسىز كارتىنىڭ ئۆزىدە ئەمەس، بەلكى ئۇنىڭغا ئۇلانغان ئانتېننا سىملىرىدا بولىدۇ.\n\nخاتىرە كومپيۇتېرنىڭ ئىچىدە ئانتېننا سىملىرى سىمسىز كارتادىن باشلىنىپ، ئىچكى زاپچاسلار ئارىسىدىن ئېھتىياتچانلىق بىلەن ئۆتكۈزۈلۈپ ئېكران توپلىمىغا چىقىرىلىدۇ. ئانتېننا ئادەتتە ئېكراننىڭ ئۈستۈنكى قىسمىغا، ئېكران رامكىسىنىڭ (bezel) كەينىگە ئورۇنلاشتۇرۇلىدۇ. بۇ ئورۇن سىگنالغا توسالغۇنى ئازايتىپ، سىگنال كۈچىنى ياخشىلاش ئۈچۈن تاللانغان.\n\nئەگەر رېمونت ياكى ئورنىتىش جەريانىدا ئانتېننا سىمى بوشاپ قالسا، قىستىلىپ قالسا ياكى خاتا يولدىن ئۆتكۈزۈلسە، سىمسىز كارتا ئۆزى نورمال ئىشلىسىمۇ سىمسىز تور ئىقتىدارى ناچارلىشىشى مۇمكىن.\n\nExam Objective 1.1\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ قاتتىق دېتال ھالىتىنى نازارەت قىلىڭ ۋە مۇۋاپىق زاپچاس ئالماشتۇرۇش ئۇسۇللىرىنى قوللىنىڭ.\n\n## جىسمانىي مەخپىيەتلىك ۋە بىخەتەرلىك (Physical Privacy and Security)\n\nخاتىرە كومپيۇتېر قاتارلىق كۆچمە ئۈسكۈنىلەرنىڭ بىخەتەرلىك ئىقتىدارلىرى ئۈستەل كومپيۇتېرىدىكى ئىقتىدارلاردىن پەرقلىق بولۇشى مۇمكىن. كۆچمە ئۈسكۈنىلەرنى ئېلىپ يۈرگىلى بولىدىغان ۋە كونترول قىلىنغان مۇھىتتىن سىرتتا كۆپ ئىشلىتىدىغان بولغاچقا، جىسمانىي مەخپىيەتلىك ۋە بىخەتەرلىك ئىقتىدارلىرى تېخىمۇ مۇھىم رول ئوينايدۇ.\n\nبۇ objective دا ئىككى مۇھىم تېخنىكا قاپلىنىدۇ:\n- بىئومېترىك كىملىك دەلىللەش (biometric authentication)\n- NFC (Near-Field Communication) — يېقىن مەيدان ئالاقىسى\n\n### بىئومېترىك كىملىك دەلىللەش (Biometric Authentication)\n\nبىئومېترىك كىملىك دەلىللەش بارماق ئىزى ياكى يۈز ئالاھىدىلىكىگە ئوخشاش ئادەمنىڭ جىسمانىي خۇسۇسىيەتلىرىنى ئىشلىتىپ كىملىكىنى دەلىللەيدۇ.\n\nبارماق ئىزى ئوقۇغۇچ (fingerprint reader) خاتىرە كومپيۇتېرلاردا كۆپ ئۇچرايدۇ، چۈنكى ئۇ مۇرەككەپ مەخپىي سۆزنى ھەر قېتىم كىرگۈزمەيلا تېز ۋە قولايلىق كىرىش ئىمكانى بېرىدۇ. بۇ سېنزورلار ئارقىلىق:\n- ئۈسكۈنىنىڭ قۇلۇپىنى ئېچىش\n- سېتىۋېلىش مەشغۇلاتىنى دەلىللەش\n- بىخەتەر مۇلازىمەتلەرگە كىرىش\nمۇمكىن.\n\nبۇ ئۇسۇل پەقەت ھوقۇق بېرىلگەن ئىشلەتكۈچىنىڭ ئۈسكۈنىگە كىرىشىگە ياردەم بېرىدۇ. بولۇپمۇ ئاممىۋى ياكى ئورتاق ئىشلىتىلىدىغان جايلاردا بۇ جىسمانىي بىخەتەرلىكنى كۈچەيتىدۇ.\n\n### NFC — Near-Field Communication\n\nNFC ئۈسكۈنىلەرنىڭ ناھايىتى قىسقا ئارىلىقتا سانلىق مەلۇمات ئالماشتۇرۇشىغا يول قويىدۇ. ئادەتتە ئىككى ئۈسكۈنە بىر-بىرىگە ناھايىتى يېقىن بولۇشى كېرەك.\n\nNFC تۆۋەندىكى ئىشلاردا ئىشلىتىلىشى مۇمكىن:\n- ئۈسكۈنىلەرنى بىخەتەر جۈپلەش\n- كىملىك دەلىللەش\n- ئەقلىي تېلېفون، تاختا كومپيۇتېر، كىرىش كارتىسى (badge) ياكى پۇل تۆلەش سىستېمىسى بىلەن سانلىق مەلۇمات ئالماشتۇرۇش\n\nNFC نىڭ ئىش دائىرىسى ناھايىتى قىسقا بولغاچقا، ئۇزۇن ئارىلىقتا ئىشلەيدىغان سىمسىز تېخنىكىلارغا سېلىشتۇرغاندا رۇخسەتسىز زىيارەت خەۋپىنى ئازايتىشقا ياردەم بېرىدۇ.\n"}, {"id": "1.2", "number": "1.2", "domain": "1", "domain_en": "Mobile Devices", "domain_ug": "كۆچمە ئۈسكۈنىلەر", "english": "Exam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Mobile device accessories. In today's IT landscape, mobile device accessories are no longer just optional add-ons.\n\nThey are essential tools that extend the capabilities of the devices they accompany. Accessories enhance user interaction, improve efficiency, and allow devices to be customized for specific tasks and work styles. While there are many accessories available, in this video segment, we will focus only on those listed in the CompTIA A+ Core 1 exam objectives.\n\nFirst up, we have stylus devices, sometimes referred to as touchpens. The stylus device has changed how users interact with touchscreen devices by providing greater precision and control than a finger alone. These pen-shaped tools allow users to write, draw, annotate, and navigate with improved accuracy, effectively turning a touchscreen into a digital notepad or drawing surface.\n\nStylus devices generally fall into two categories, passive and active. Passive styluses do not require a battery and work simply by making contact with the touchscreen, similar to how a finger is used. They are simple, reliable, and inexpensive, making them well-suited for basic navigation and light drawing tasks.\n\nActive styluses, on the other hand, require a battery to support advanced features such as pressure sensitivity, palm rejection, and electronic erasing. These features are especially useful for digital artists and note-takers, but they also introduce battery management considerations, since the stylus must be charged or have its battery replaced to continue functioning properly. Moving on to audio accessories, headsets and speakers play an important role in improving both sound quality and communication.\n\nAlthough most mobile devices include built-in microphones and speakers, external headsets and speakers often deliver clearer audio, stronger bass, and better overall sound performance. Headsets in particular are valuable for video conferencing and remote work, as they typically include dedicated microphones and may offer noise canceling features that reduce background distractions. When using external audio accessories, it is important to ensure the correct input and output devices are selected in the system settings.\n\nChoosing the appropriate microphone and speaker allows the accessory to take priority over the built-in hardware. Failing to select the correct device can result in poor audio quality or the accessory appearing not to work at all, even though it is properly connected. Transitioning from audio to visual accessories, external webcams are commonly used to improve video quality on mobile devices.\n\nExternal webcams often provide higher resolution, better low light performance, and more accurate color reproduction than built-in cameras. This makes them a popular choice for professional meetings, streaming, and content creation. For best results, external webcams should be mounted securely on a stable surface to prevent shaking or uneven video.\n\nMany webcams allow angle and position adjustments, giving users better control over framing and lighting. It is also important to manage webcam access carefully. If multiple applications attempt to use the webcam at the same time, conflicts can occur, resulting in video errors or the camera failing to activate.\n\nLimiting access to a single application at a time helps prevent these issues. Finally, we have drawing pads and track pads, also known as touch pads. These input accessories provide an alternative to traditional mice.\n\nTrack pads support gesture-based input, making navigation faster and more intuitive, while drawing pads are essential tools for designers and artists who need accurate input for creative work. For these devices to function correctly, they must be properly enabled and calibrated. Poor calibration can result in pointer drift, inaccurate cursor movement, or unresponsive input.\n\nRegular calibration helps ensure the device accurately reflects finger or stylus movements. Additionally, connecting external peripherals or changing system settings can sometimes disable a track pad automatically. If cursor input suddenly stops working, checking the device settings to confirm the track pad is enabled is a critical troubleshooting step.\n\nExam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Mobile device connections. Mobile devices may be great as a standalone computing device but the true magic really happens when they reach out and connect with other devices and accessories.\n\nIn this video, we will discuss some common wired and wireless connection types used by various mobile devices. Let's begin with USB or universal serial bus connections. USB is a wired peripheral device interface standard that allows for data transfer and device charging and the ports come in several form factors.\n\nSome of the most common form factors for mobile devices include mini USB, micro USB, and USB-C. USB-C, known for its reversible design, is the latest and most versatile, allowing for faster data transfer and charging. As for the mini USB and micro USB, these are older but still prevalent.\n\nAnother common wired connection type is the lightning connector. Lightning is a wired peripheral device interface standard that is exclusive to Apple devices and allows for data transfer and device charging. It's a sleek, small connector that can be used for various tasks, like transferring files from an Apple phone to a workstation.\n\nSuch a task could be accomplished by simply plugging one end into your iPhone and the other into the USB port of your computer. Do so and you will be ready to transmit data. Switching away from wired connection types, we will now cover a few wireless connection options used by mobile devices.\n\nAnd first up for the wireless category, we have near field communication, or NSC. NSC is a wireless networking interface standard that uses radio frequencies to share data over a short distance of a few centimeters or inches. This short range wireless connectivity enables various convenient functions like authentication and mobile payments.\n\nFor example, by simply tapping your device to a reader, you can authenticate access or complete purchases quickly and securely. Now we have Bluetooth, a wireless networking interface and peripheral device interface standard that uses radio frequencies to share data over a short distance of a few meters or yards. This technology allows mobile devices to effortlessly connect with peripherals such as wireless headphones, portable speakers and keyboards.\n\nEliminating the need for cables, Bluetooth enables a clutter-free, hands-free experience. Additionally, it supports various functions like file sharing, audio streaming and voice commands, which serves to amplify the capabilities of connected devices, creating a cohesive and more productive personal tech environment. Finally, we come to mobile tethering and hotspot, which are closely related, but not identical.\n\nTethering refers to the ability of a mobile device to share its data connection with other devices. This sharing can be done using a wired connection or a wireless connection. Tethering is commonly used when another device needs internet access, but no traditional wired or wireless network is available.\n\nA mobile hotspot is a specific type of tethering that uses wifi. When hotspot mode is enabled, the mobile device acts as a wireless access point, allowing multiple devices to connect and access the internet at the same time. Hotspots are especially useful while traveling or working remotely, where public or private wifi networks may not be available.\n\nIn short, all hotspots are a form of tethering, but not all tethering uses hotspot functionality. Exam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Port replicator.\n\nA port replicator is a device that plugs into a laptop or other mobile device and provides additional ports for peripherals, but does not provide additional features. With that said, they typically plug directly into these mobile devices through a USB, USB-C, or Thunderbolt port to multiply the number of available connections. Essentially, it allows a laptop to interface with a variety of peripherals that would typically be connected to a desktop computer, providing an array of ports such as USB, HDMI, ethernet, and sometimes more specialized ports like serial or parallel ports, depending on model.\n\nThe convenience of a port replicator lies in its ability to consolidate connections. For individuals who alternate between multiple workspaces or those who are frequently on the move, the port replicator becomes a stationary hub to which all peripherals are connected. When the user arrives at their workspace, they can connect their laptop to the port replicator with a single cable, immediately integrating with all the connected devices.\n\nThis is not only a time saver, but also reduces the physical wear and tear on the laptop's ports from repeatedly plugging and unplugging peripherals. With the trend of making laptops thinner and lighter, many models sacrifice the number of available ports, which can limit functionality. Port replicators address this limitation by providing the extra ports that users need without the need for internal hardware upgrades or external attachments.\n\nAdditionally, they have become more advanced over time, with the latest models supporting USB 3.0, USB-C, and Thunderbolt connections for faster data transfer, providing outputs for high definition displays and offering power delivery to charge the laptop while it's connected. For professionals, students, or anyone who uses their laptop for various tasks and needs to connect multiple devices, a port replicator is a valuable investment. It transforms the laptop into a dynamic workstation that mimics the connectivity of a desktop computer, enhancing productivity, and making it easier to work efficiently in any location.\n\nThe streamlined setup enabled by a port replicator is a simple yet powerful solution for maximizing the potential of portable devices in today's mobile-first world. Exam objective 1.2, compare and contrast accessories and connectivity options for mobile devices. Docking station.\n\nA docking station is a device that plugs into a laptop or other mobile device and provides additional ports for peripherals and provides additional features. This is very similar to the port replicator with that one difference of providing additional features, not just additional ports. Docking stations elevate the functionality of mobile computing devices by incorporating these feature enhancements, which can range from additional storage and improved audio to advanced video graphics capabilities.\n\nThe key to a docking station's ability to offer these enhancements lies in its connection to the mobile device. Using high-speed interfaces like Thunderbolt or proprietary connectors, docking stations can transfer data, power, and video signals simultaneously through a single cable. This robust connection allows the docking station to not only increase the number of available ports, but also to augment the device's capabilities significantly.\n\nOne of the primary additional features of a docking station is the inclusion of its own power supply, which allows it to charge the connected laptop directly. This power can also support more power-hungry peripherals that a port replicator cannot handle due to its reliance on the laptop's power resources. Furthermore, docking stations can host additional hardware like dedicated graphics cards, which empower laptops to perform tasks that are graphically intensive, such as video rendering or gaming, far beyond the laptop's built-in capabilities.\n\nDocking stations also often come with added storage in the form of built-in hard drives or SSDs, providing not just extra space, but also the possibility of enhanced data processing speeds. Some even have their own network ports for faster internet connections, multiple video ports that support high-resolution external monitors, and advanced audio ports for high-fidelity sound systems. These additional features make docking stations particularly suitable for power users who need more than just extra USB ports or a simple video output extension.\n\nThey cater to those who need to transform their laptop into a fully-fledged desktop computing environment when at the office or home, but still require the flexibility to undock and go mobile at a moment's notice.", "uyghur": "Exam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە ئۈسكۈنىلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇپ، ئۇلارنىڭ ئوخشاشلىقى ۋە پەرقىنى چۈشەندۈرۈڭ.\n\n## كۆچمە ئۈسكۈنىنىڭ قوشۇمچە ئۈسكۈنىلىرى (Mobile Device Accessories)\n\nبۈگۈنكى IT مۇھىتىدا كۆچمە ئۈسكۈنىنىڭ قوشۇمچە ئۈسكۈنىلىرى پەقەت ئىختىيارىي قوشۇمچە نەرسە بولۇپلا قالمايدۇ. ئۇلار ئۈسكۈنىنىڭ ئىقتىدارىنى كېڭەيتىدىغان، ئىشلەتكۈچىنىڭ ئۈسكۈنە بىلەن ئۆزئارا ئالاقىسىنى ياخشىلايدىغان ۋە خىزمەت ئۈنۈمدارلىقىنى ئاشۇرىدىغان مۇھىم قوراللاردۇر.\n\nقوشۇمچە ئۈسكۈنىلەر ئارقىلىق بىر كۆچمە ئۈسكۈنىنى مەلۇم خىزمەتكە، ئىش ئۇسۇلىغا ياكى ئىشلەتكۈچىنىڭ ئېھتىياجىغا تېخىمۇ ماسلاشتۇرغىلى بولىدۇ. بازاردا تۈرلۈك قوشۇمچە ئۈسكۈنىلەر بار، ئەمما بۇ بۆلەكتە پەقەت CompTIA A+ Core 1 ئىمتىھان مەزمۇنىدا كۆرسىتىلگەنلىرىگە مەركەزلىشىمىز.\n\n### سېزىمچان قەلەم (Stylus / Touch Pen)\n\nStylus، بەزىدە touch pen دەپمۇ ئاتىلىدۇ، سېزىمچان ئېكرانلىق ئۈسكۈنىنى بارماق بىلەن ئىشلىتىشكە قارىغاندا تېخىمۇ ئېنىق ۋە كونتروللۇق ئىشلىتىش ئىمكانى بېرىدىغان قەلەم شەكىللىك كىرگۈزۈش قورالىدۇر.\n\nStylus ئارقىلىق:\n- يېزىش\n- سىزىش\n- ئىزاھات ياكى بەلگە قويۇش (annotation)\n- ئېكراندىكى مەزمۇنلار ئارىسىدا ئېنىق يۆتكىلىش\nقاتارلىق مەشغۇلاتلارنى قىلىشقا بولىدۇ.\n\nبۇ قورال سېزىمچان ئېكراننى رەقەملىك خاتىرە دەپتىرى ياكى رەسىم سىزىش يۈزىگە ئوخشاش ئىشلىتىشكە ياردەم بېرىدۇ.\n\nStylus ئادەتتە ئىككى تۈرگە بۆلۈنىدۇ:\n\n**پاسسىپ stylus (Passive Stylus):**\n- باتارېيە تەلەپ قىلمايدۇ.\n- بارماققا ئوخشاش، سېزىمچان ئېكرانغا تېگىش ئارقىلىق ئىشلەيدۇ.\n- قۇرۇلمىسى ئاددىي، ئىشەنچلىك ۋە باھاسى ئەرزان.\n- ئاساسىي يۆتكىلىش ۋە ئاددىي سىزىش خىزمەتلىرىگە ماس كېلىدۇ.\n\n**ئاكتىپ stylus (Active Stylus):**\n- باتارېيە ياكى ئىچكى توك مەنبەسىگە ئېھتىياجلىق.\n- بېسىم سەزگۈرلۈكى (pressure sensitivity)، ئالقان تېگىشىنى رەت قىلىش (palm rejection) ۋە ئېلېكترونلۇق ئۆچۈرۈش (electronic erasing) قاتارلىق ئىلغار ئىقتىدارلارنى قوللايدۇ.\n- رەقەملىك سەنئەت بىلەن شۇغۇللانغۇچىلار ۋە رەقەملىك خاتىرە يازغۇچىلارغا ئالاھىدە پايدىلىق.\n- نورمال ئىشلىشى ئۈچۈن زەرەتلەش ياكى باتارېيە ئالماشتۇرۇشقا توغرا كېلىشى مۇمكىن.\n\n### تىڭشىغۇچ-مىكروفون ۋە ياڭراتقۇ (Headset and Speaker)\n\nئاۋازغا مۇناسىۋەتلىك قوشۇمچە ئۈسكۈنىلەر ئىچىدە headset ۋە speaker ئاۋاز سۈپىتىنى ۋە ئالاقە تەجرىبىسىنى ياخشىلاشتا مۇھىم رول ئوينايدۇ.\n\nكۆپىنچە كۆچمە ئۈسكۈنىلەردە ئىچىگە بىرلەشتۈرۈلگەن مىكروفون ۋە ياڭراتقۇ بار. ئەمما سىرتقى headset ياكى speaker ئادەتتە:\n- تېخىمۇ ئېنىق ئاۋاز\n- كۈچلۈكرەك تۆۋەن چاستوتىلىق ئاۋاز (bass)\n- تېخىمۇ ياخشى ئومۇمىي ئاۋاز سۈپىتى\nتەمىنلىشى مۇمكىن.\n\nHeadset بولۇپمۇ سىنلىق يىغىن ۋە يىراقتىن ئىشلەش جەريانىدا پايدىلىق. چۈنكى ئۇ ئادەتتە ئۆزىنىڭ مىكروفونىغا ئىگە بولۇپ، بەزى مودېللاردا ئارقا كۆرۈنۈش شاۋقۇنىنى ئازايتىدىغان noise canceling ئىقتىدارىمۇ بولىدۇ.\n\nسىرتقى ئاۋاز ئۈسكۈنىسىنى ئىشلىتىۋاتقاندا، سىستېما تەڭشەكلىرىدە توغرا ئاۋاز كىرگۈزۈش (input) ۋە ئاۋاز چىقىرىش (output) ئۈسكۈنىسى تاللانغانلىقىنى جەزملەشتۈرۈش كېرەك.\n\nتوغرا مىكروفون ۋە ياڭراتقۇ تاللانسا، سىستېما سىرتقى قوشۇمچە ئۈسكۈنىنى ئىچىگە بىرلەشتۈرۈلگەن ئاۋاز زاپچاسلىرىنىڭ ئورنىدا ئىشلىتەلەيدۇ.\n\nئەگەر خاتا ئۈسكۈنە تاللانسا، سىرتقى headset ياكى speaker توغرا ئۇلانغان بولسىمۇ ئاۋاز سۈپىتى ناچار بولۇشى ياكى ئۈسكۈنە پۈتۈنلەي ئىشلىمەيدىغاندەك كۆرۈنۈشى مۇمكىن.\n\n### سىرتقى تور كامېراسى (External Webcam)\n\nسىرتقى webcam كۆچمە ئۈسكۈنىدىكى سىن سۈپىتىنى ياخشىلاش ئۈچۈن ئىشلىتىلىدۇ. ئۇ ئىچىگە بىرلەشتۈرۈلگەن كامېراغا قارىغاندا كۆپىنچە:\n- تېخىمۇ يۇقىرى ئېنىقلىق (resolution)\n- تۆۋەن يورۇقلۇقتا تېخىمۇ ياخشى كۆرۈنۈش\n- رەڭنى تېخىمۇ توغرا كۆرسىتىش\nئىقتىدارىغا ئىگە بولىدۇ.\n\nشۇڭا سىرتقى webcam كەسپىي يىغىن، بىۋاسىتە تارقىتىش (streaming) ۋە مەزمۇن ئىشلەپچىقىرىش (content creation) قاتارلىق ئىشلاردا كۆپ ئىشلىتىلىدۇ.\n\nئەڭ ياخشى نەتىجە ئۈچۈن webcam نى تەۋرىمەيدىغان مۇقىم ئورۇنغا پۇختا ئورنىتىش كېرەك. نۇرغۇن webcam دا بۇلۇڭ ۋە ئورۇننى تەڭشەش ئىمكانى بار بولۇپ، بۇ كادىرلاش (framing) ۋە يورۇتۇشنى تېخىمۇ ياخشى كونترول قىلىشقا ياردەم بېرىدۇ.\n\nWebcam غا قايسى ئەپنىڭ زىيارەت قىلىۋاتقانلىقىنىمۇ توغرا باشقۇرۇش كېرەك. ئەگەر بىر ۋاقىتتا بىر نەچچە ئەپ webcam نى ئىشلىتىشكە ئۇرۇنسا، ئۆزئارا توقۇنۇش پەيدا بولۇپ:\n- سىن خاتالىقى كۆرۈلۈشى\n- كامېرا ئېچىلماسلىقى\nمۇمكىن.\n\nبىر ۋاقىتتا پەقەت بىر ئەپنىڭ webcam نى ئىشلىتىشىگە يول قويۇش بۇ خىل مەسىلىلەرنى ئازايتىدۇ.\n\n### رەقەملىك سىزىش تاختىسى ۋە سېزىمچان تاختا (Drawing Pad and
