top نى بىرلا cable بىلەن port replicator غا ئۇلاپ، بارلىق ئۈسكۈنىلەرنى دەرھال ئىشلىتەلەيدۇ.\n\nبۇ ۋاقىت تېجەپلا قالماي، laptop port لىرىنى قايتا-قايتا چېتىپ-ئۈزۈشتىن بولىدىغان جىسمانىي ئۇپراشنىمۇ ئازايتىدۇ.\n\nLaptop لار نېپىز ۋە يېنىك بولۇش ئۈچۈن لايىھەلەنگەنسېرى، نۇرغۇن مودېللاردا port سانى ئازايدى. Port replicator ئىچكى hardware upgrade قىلمايلا كېرەكلىك قوشۇمچە port لارنى تەمىنلەيدۇ.\n\nيېڭى مودېللار USB 3.0، USB-C ۋە Thunderbolt قاتارلىق تېز connection لارنى قوللاپ، تېز data transfer، high-definition display output ۋە laptop charging ئۈچۈن power delivery تەمىنلىيەلەيدۇ.\n\nكۆپ ئۈسكۈنە ئۇلايدىغان professional، student ياكى باشقا ئىشلەتكۈچى ئۈچۈن port replicator laptop نى desktop قا ئوخشاش ئۇلىنىش ئىقتىدارىغا ئىگە workstation غا ئايلاندۇرۇشقا ياردەم بېرىدۇ.\n\nExam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە زاپچاسلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇڭ ۋە پەرقلىرىنى چۈشەندۈرۈڭ.\n\n## Docking Station\n\nDocking station laptop ياكى باشقا mobile device غا ئۇلىنىپ، قوشۇمچە peripheral port لار بىلەن بىرگە **قوشۇمچە ئىقتىدارلارنىمۇ** تەمىنلەيدۇ.\n\nئۇ port replicator غا ناھايىتى ئوخشايدۇ، ئەمما مۇھىم پەرقى: port replicator ئاساسلىقى port سانىنى كۆپەيتىدۇ؛ docking station بولسا port تىن باشقا ئىقتىدارلارنىمۇ قوشالايدۇ.\n\nبۇ قوشۇمچە ئىقتىدارلار:\n- extra storage\n- ياخشىراق audio\n- ئىلغار video/graphics ئىقتىدارى\nقاتارلىقلار بولۇشى مۇمكىن.\n\nDocking station نىڭ بۇ ئىقتىدارلارنى تەمىنلىيەلەيدىغان سەۋەبى—mobile device بىلەن بولغان تېز connection. Thunderbolt ياكى proprietary connector ئارقىلىق data، power ۋە video signal نى بىرلا cable دىن بىر ۋاقىتتا يەتكۈزەلەيدۇ.\n\nشۇڭا docking station پەقەت port سانىنى كۆپەيتىپلا قالماي، ئۈسكۈنىنىڭ ئىقتىدارىنىمۇ زور دەرىجىدە كېڭەيتەلەيدۇ.\n\nDocking station نىڭ بىر مۇھىم قوشۇمچە ئىقتىدارى—ئۆزىنىڭ power supply ى بولۇشى. بۇ ئارقىلىق ئۇ ئۇلانغان laptop نى بىۋاسىتە زەرەتلىيەلەيدۇ. شۇنداقلا laptop نىڭ ئۆزىدىكى توكقا تايىنىدىغان port replicator كۆتۈرەلمەيدىغان، كۆپ توك تەلەپ قىلىدىغان peripheral لارنىمۇ قوللىيالايدۇ.\n\nبەزى docking station لاردا dedicated graphics card قاتارلىق قوشۇمچە hardware بولۇشى مۇمكىن. بۇ laptop نىڭ built-in ئىقتىدارىدىن ئېشىپ، video rendering ياكى gaming قاتارلىق graphics-intensive خىزمەتلەرنى قىلىشقا ياردەم بېرىدۇ.\n\nبەزىلىرىدە built-in HDD ياكى SSD بولۇپ، قوشۇمچە storage ۋە بەزى ئەھۋالدا تېز data processing ئىمكانى بېرىدۇ.\n\nباشقا مودېللاردا:\n- تېز Internet ئۈچۈن network port،\n- high-resolution external monitor ئۈچۈن بىر نەچچە video port،\n- high-fidelity sound system ئۈچۈن ئىلغار audio port\nبولۇشى مۇمكىن.\n\nبۇ ئىقتىدارلار docking station نى پەقەت بىر نەچچە extra USB port ياكى video output قا ئېھتىياجلىق ئادەمدىن كۆپرەك ئىقتىدار تەلەپ قىلىدىغان power user لارغا ماس قىلىدۇ.\n\nئۇ office ياكى home دا laptop نى تولۇق desktop computing environment غا ئايلاندۇرۇپ، كېرەك بولغاندا بىرلا ھەرىكەتتە undock قىلىپ يەنە mobile ئىشلىتىشكە يول قويىدۇ."}, {"id": "1.3", "number": "1.3", "domain": "1", "domain_en": "Mobile Devices", "domain_ug": "كۆچمە ئۈسكۈنىلەر", "english": "Exam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Cellular connectivity. Cellular connectivity refers to the technology that allows mobile devices to communicate over long distances without using physical cables.\n\nInstead, these devices rely on radio signals exchanged with nearby cell towers that are strategically placed to provide wide geographic coverage. Whenever you make a phone call, send a text message, or access the internet using mobile data, your device is communicating with one of these towers. To support millions of users at the same time, cellular networks operate across carefully managed frequencies and channels.\n\nAs a user moves from place to place, the connection is automatically handed off from one cell tower to another without interruption. This seamless transition is what allows you to start a phone call in one location and continue it while traveling or stream media while on the move without losing connectivity. Cellular technology has evolved through several standards, commonly referred to as 2G, 3G, 4G, and 5G with each version improving speed, reliability, and overall capacity.\n\n2G or second generation was designed primarily for voice calls and basic text messaging. While it was groundbreaking at the time, its data capabilities are extremely limited by modern standards. 3G or third generation introduced faster data speeds that made mobile web browsing and basic video streaming possible.\n\nThe arrival of 4G or fourth generation marked a major shift in mobile connectivity. With significantly higher speeds and improved performance, 4G enabled high definition video streaming, online gaming, and many of the mobile applications we rely on today. 5G or fifth generation builds on this foundation by offering even faster speeds, increased capacity, and much lower latency.\n\nThese improvements not only enhance everyday mobile use, but also support emerging technologies such as augmented reality and advanced connected systems. As cellular standards have progressed from 2G through 5G, each version has delivered a better user experience by supporting more devices, faster data rates, and more reliable connections. Understanding which cellular standard a device is using helps explain differences in performance, coverage, and connectivity, especially when troubleshooting mobile network issues.\n\nBeyond understanding how cellular networks work, it is also important to know how a device manages its cellular connection. When cellular connectivity is enabled, a mobile device can place calls, send text messages, and access the internet through its mobile service provider, often referred to as a carrier. This connection becomes especially important when Wi-Fi networks are unavailable, such as while commuting or traveling.\n\nThere are also situations where cellular data settings directly impact device behavior. For example, a device may still be able to make phone calls, but lack internet access if cellular data features are restricted. In other cases, cellular connectivity may be limited by network settings that control which cellular technologies are allowed.\n\nEnsuring that the appropriate cellular standards are enabled allows the device to connect properly when signal conditions change. Additionally, when traveling internationally, cellular data may be restricted to prevent unexpected charges. In these situations, enabling data roaming allows the device to access mobile data services outside the home carrier's coverage area.\n\nWhile this restores internet access, it should be used carefully, as roaming can result in additional costs. Most mobile devices allow users to manage cellular connectivity directly through the settings menu. From there, users can enable or disable cellular data, control roaming options, and verify which cellular technologies are active.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Subscriber identity module. To understand how mobile devices connect to cellular networks, we need to start with a subscriber identity module, often abbreviated as SIM.\n\nA SIM is a small card that stores information used to identify a device and authenticate it on a cellular network. This information links the device to a specific mobile service provider and allows the device to make calls, send text messages, and access mobile data. A SIM plays a critical role in activation.\n\nActivation is the process of enabling a device to connect to a carrier's cellular network using the information stored on the SIM. Until a SIM is activated, the device may power on, but it will not have full cellular functionality. Closely related to activation is provisioning, which is the process of configuring the carrier's network services for that device.\n\nProvisioning determines what services are available, such as voice, text, data limits, and roaming capabilities. Another important concept tied to SIM cards is portability. Because the SIM stores subscriber information rather than device-specific hardware details, it can often be moved from one compatible device to another.\n\nThis allows users to switch phones without changing carriers, as long as the devices are unlocked and supported by the network. This portability is why swapping a SIM card can quickly restore service on a replacement device. SIM cards also define the relationship between the device and the carrier.\n\nSome devices are locked to a specific carrier, meaning they will only accept SIM cards from that provider. Other devices are unlocked and can work with SIM cards from multiple carriers. Understanding this relationship is important when troubleshooting connectivity issues or when users attempt to change service providers.\n\nNow let's shift to a newer technology known as embedded SIM, often abbreviated as eSIM. An eSIM performs the same basic function as a physical SIM card, but instead of being removable, it is built directly into the device's hardware. Because it is embedded, there is no physical card to insert or replace.\n\nWith eSIM technology, activation and provisioning are handled digitally. Users can download a carrier profile directly to the device, allowing service to be enabled without visiting a store or inserting a SIM card. This makes eSIM especially useful for devices that need quick setup, frequent carrier switching, or support for multiple cellular plans at once. eSIM also changes how portability works.\n\nInstead of physically moving a SIM card between devices, portability is managed through software by adding or removing carrier profiles. While this offers greater flexibility and convenience, it also means the device must support eSIM and be compatible with the carrier's eSIM implementation. Exam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support.\n\nHotspot connectivity. A mobile device hotspot is your gateway to the internet when traditional network connections are just out of reach. For instance, imagine you are in a cafe that doesn't offer wifi, but you urgently need to send an email from your laptop.\n\nThis is where your smartphone could come to the rescue. By enabling the hotspot feature, your smartphone uses its cellular data connection to create a personal wifi network. You can then connect your laptop to this network, allowing your laptop to access the internet just as if it were connected to a regular wifi or wired network with little time and effort required.\n\nTo begin setting up a mobile device hotspot, you can start with your smartphone. First, enable the hotspot feature by going to the settings menu and enable the hotspot option. Once you do this, your smartphone will begin broadcasting a wifi signal.\n\nOnce your smartphone's hotspot is active, take your laptop and open the wifi network list. Your smartphone's network name should appear here, selected. Now your laptop will be connected to the internet via your smartphone's data connection.\n\nThis seamless connectivity allows you to use your laptop to browse the internet, stream content, or attend virtual meetings, leveraging the mobile data from your phone. Just remember, while connected, your laptop is using your phone's data plan, so be mindful of your data usage to avoid incurring any fees. Now this is just one way in which to set up a hotspot.\n\nThere are many other hotspot arrangements that can be utilized depending on the specific use case. I just walked you through this scenario as it tends to be the most commonly used method. Now for a little housekeeping.\n\nWhen maintaining a hotspot, keep in mind that it can drain your mobile device's battery more quickly, so it may be wise to keep it plugged into a charger during extended use. When you're finished and no longer need the hotspot, don't forget to turn it off on your smartphone to save data and battery life and to keep your connection secure. This is done by simply returning to the settings menu and toggling the hotspot feature off.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Wi-Fi connectivity. While hotspot connectivity allows a mobile device to create a network using cellular data, Wi-Fi connectivity focuses on joining an existing wireless network.\n\nWi-Fi allows mobile devices such as smartphones, tablets, and laptops to connect to local networks provided by home routers, businesses, schools, or public access points. Once connected, the device can access the internet and local network resources without relying on cellular data. A common Wi-Fi scenario might involve arriving at home, opening your laptop, and automatically connecting to your home wireless network.\n\nUnlike a hotspot, this connection is provided by a wireless router that is already connected to the internet through a wired service such as cable or fiber. Because Wi-Fi does not rely on a cellular data plan, it is often faster, more stable, and does not consume mobile data allowances. To connect to a Wi-Fi network, a user opens the device's Wi-Fi settings and views a list of available wireless networks.\n\nAfter selecting the correct network, the device may prompt for a security key or password if the network is protected. Once authenticated, the device establishes a connection and can begin transmitting data. Many mobile devices are configured to remember trusted networks and automatically reconnect when they are in range.\n\nFinally, Wi-Fi settings, just like hotspot settings, allow users to control how and when devices connect. Wi-Fi can be turned on or off to conserve battery life, avoid untrusted networks, or force a device to fall back to cellular data when needed. In many troubleshooting scenarios, simply understanding how Wi-Fi behaves and how it interacts with other connection options can quickly lead you to the right solution.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Bluetooth pairing. Bluetooth is a wireless technology that allows the exchange of data between different devices.\n\nWith Bluetooth, you can connect devices like smartphones, computers, headphones, speakers, and even car audio systems without the hassle of wires. It's a technology that's all about convenience, enabling things like listening to music on wireless headphones or sharing files quickly between devices. But to do this, you first need to know a bit more about Bluetooth pairing.\n\nPairing is the process of establishing a secure wireless connection between two Bluetooth-enabled devices so they can communicate with each other. And the process starts by enabling Bluetooth connections in the settings menu of your mobile device. Once your Bluetooth antenna is enabled and connections are allowed, the next step in the pairing process begins with placing the Bluetooth device you want to connect with into pairing mode.\n\nThis is usually done by holding a button on the device, such as a long press on the power button of Bluetooth headphones. This puts the device into a state where it actively looks to connect with other Bluetooth-enabled devices. Next, you'll go back to the first device and search for available devices.\n\nThis is generally done within the Bluetooth settings page where you can scan for new devices. Once the second device appears on the list, you can select it to initiate the pairing process. Sometimes you may need to enter a pen code to complete the pairing.\n\nIn the Bluetooth pairing process, entering a pen code is an additional security measure to ensure that only users with the correct permissions can establish a connection between devices. The necessity of entering this code prevents unauthorized users from connecting to your device because without the correct pen, the connection cannot be completed. This step is particularly important when pairing devices in public spaces where multiple Bluetooth devices might be present and the risk of an unintended or malicious connection is higher.\n\nAfter the devices are paired, they'll remember each other unless you choose to disconnect them or remove the pairing, meaning you won't have to go through the setup process every time. Lastly, disabling Bluetooth on your device is a straightforward way to conserve battery life and increase security. When you disable Bluetooth, you effectively cut off the wireless communication channel, ensuring that no Bluetooth connections can be made to your device without your consent.\n\nAnd to disable Bluetooth, just toggle the setting to the off position and you're done. Exam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Location services.\n\nIn today's interconnected world, mobile device location services act as the bridge between the digital and physical worlds. These services allow devices to determine where they are and adjust applications and features accordingly. In this video segment, we'll focus on how location services work and how mobile devices use different technologies to pinpoint a user's location.\n\nLet's start with GPS, which stands for global positioning system. GPS is a network of satellites orbiting the earth that transmit location and timing information. A GPS receiver, such as the one inside your smartphone, listens for signals from multiple satellites and uses that information to calculate its position.\n\nThe more satellite signals the device receives, the more accurate the location becomes. This is why GPS works best outdoors with a clear view of the sky. Apart from GPS, cellular signals are also used for something known as device triangulation.\n\nThis method utilizes the signal from cell towers. Your mobile device constantly communicates with nearby towers, and by measuring the strength of your signal to multiple towers, a location can be inferred. The more towers your device can see, the more precise the location.\n\nIt's akin to finding the center point of a triangle when you know it's three corners. Now that we understand how location data is gathered, it's important to address the security and privacy aspect of location services. Many applications rely on location data to function properly.\n\nFor example, navigation apps, weather apps, and ride-sharing services all need to know where you are. Mobile operating systems allow users to control which applications have access to location data. By granting or denying permissions on an app-by-app basis, users can reduce the risk of unnecessary tracking and protect their privacy.\n\nFinally, mobile devices offer location accuracy settings that balance precision with battery usage. High accuracy mode uses multiple signal sources to determine location, including GPS, Wi-Fi, Bluetooth, and cellular networks. This mode provides the most precise location information, but consumes more battery power.\n\nOther modes may limit which technologies are used to conserve power, but high accuracy combines all available signals to deliver the most reliable location data.\n\nExam objective 1.3. Given a scenario, configure basic mobile device network connectivity and provide application support. Mobile device management.\n\nEnterprise mobility management is a comprehensive approach to securing and enabling the use of mobile devices within a business environment. This framework relies on a collection of services and technologies designed to protect mobile devices while maintaining a clear separation between personal and corporate data. As organizations increasingly rely on smartphones, tablets, and laptops for everyday operations, enterprise mobility management provides a structured way to manage how those devices are configured, secured, and used to access company resources.\n\nIn today's workplace, employees often accessed sensitive corporate data from multiple locations and on different types of mobile devices. Without a centralized approach, maintaining security and consistency becomes difficult. Enterprise mobility management helps organizations reduce risk, meet compliance requirements, and support flexible work environments, all while keeping devices functional and productive for end users.\n\nAt the center of enterprise mobility management is mobile device management, often abbreviated as MDM. Mobile device management is a technology that allows IT administrators to control, secure, and enforce policies on mobile devices. Through MDM, organizations can remotely configure device settings, apply security requirements, and manage how devices interact with corporate systems regardless of where the device is physically located.\n\nOne of the primary functions of MDM is device configuration. Device configuration involves setting up mobile devices so they comply with company standards as soon as they are enrolled. This can include configuring email accounts, Wi-Fi access, VPN connections, password requirements, screen lock settings, and encryption.\n\nAutomating these configurations helps ensure consistency across devices while reducing manual setup and configuration errors. How MDM is applied often depends on the device ownership model. In corporate-owned environments, the organization owns the device and applies full management controls through MDM.\n\nThis allows IT administrators to enforce policies across the entire device and maintain a high level of security. One common corporate-owned model is corporate-owned personally enabled, often abbreviated as COPE. COPE is a device ownership model in which the organization owns the device but allows limited personal use by the employee.\n\nBecause the company owns the device, IT maintains strong control over configurations, security policies, and corporate data while still offering some flexibility for personal activities. A variation of this approach is choose your own device, often abbreviated as CYOD. CYOD is a device ownership model in which employees select a device from an organization-approved list while the organization retains ownership and management control.\n\nThis model gives users some choice while allowing IT to limit support complexity and maintain consistent security standards. In contrast, bring your own device, often abbreviated as BYOD, allows employees to use their personal devices for work purposes. BYOD is a device ownership model in which the employee owns the device and the organization applies limited management controls primarily to protect corporate data.\n\nBecause the device belongs to the user, MDM policies in BYOD environments typically focus on securing work-related data rather than managing the entire device. Another critical function of MDM is policy enforcement. Policies define what users can and cannot do on managed devices.\n\nThese policies may require strong passwords, restrict certain device features, lock unapproved applications, or allow IT administrators to remotely lock or wipe a device if it is lost or stolen. Policy enforcement ensures security standards remain in place even when devices are used outside controlled environments. MDM also supports the deployment and management of corporate applications.\n\nOrganizations can use MDM to install approved applications, keep them updated, and remove them when access is no longer required. This helps ensure employees are using secure, supported software while reducing the risk of unauthorized or malicious applications. Overall, enterprise mobility management, powered by mobile device management, allows organizations to securely support modern mobile workflows.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Mobile device synchronization. So what exactly does mobile device synchronization mean?\n\nMobile device synchronization is the process of keeping the same data consistent and up to date across multiple devices, such as smartphones, tablets, and laptops. When synchronization is working correctly, changes made on one device are automatically reflected on others, allowing users to move between devices without losing access to important information. In today's mobile environments, synchronization is typically tied to user accounts and cloud services.\n\nWhen a user signs into a device with an account, that account becomes the central hub for syncing data, like calendars, contacts, emails, and files. As long as synchronization is enabled and the device has connectivity, data is continuously updated in the background. One important factor to consider when syncing mobile devices is recognizing data caps.\n\nMany mobile devices rely on cellular data connections when Wi-Fi is not available and cellular data plans often include usage limits. Synchronizing large amounts of data, such as files or media, can quickly consume available data. For this reason, devices often allow users to restrict synchronization to Wi-Fi connections only, helping prevent excessive data usage and unexpected charges.\n\nSome of the most commonly synchronized data types are calendars and contacts. Calendar synchronization ensures that appointments, meetings, and reminders remain consistent across devices. If a meeting is added or changed on one device, it automatically appears on others.\n\nContact synchronization works in a similar way, keeping phone numbers, email addresses, and contact details updated everywhere the user signs in. Synchronization also plays a major role in business applications, especially email and cloud storage services. Email synchronization allows messages to appear consistently across devices, meaning emails read or deleted on one device reflect the same status elsewhere.\n\nCloud storage synchronization allows files to be stored centrally and accessed from multiple devices. Files uploaded from one device can be downloaded or edited on another, making cloud storage a critical component of modern mobile workflows. However, syncing large files can impact both storage space and data usage, reinforcing the importance of understanding data caps and sync settings.", "uyghur": "Exam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Cellular Connectivity — ھۈجەيرىلىك تور ئۇلىنىشى\n\nCellular connectivity كۆچمە ئۈسكۈنىلەرنىڭ جىسمانىي cable ئىشلىتمەي ئۇزۇن ئارىلىقتا ئالاقە قىلىشىغا يول قويىدىغان تېخنىكا.\n\nئۈسكۈنىلەر كەڭ جۇغراپىيەلىك رايوننى قاپلاش ئۈچۈن پىلانلىق ئورنىتىلغان يېقىن cell tower لار بىلەن radio signal ئالماشتۇرىدۇ.\n\nتېلېفون قىلغاندا، text message يوللىغاندا ياكى mobile data ئارقىلىق Internet كە چىققاندا، ئۈسكۈنىڭىز شۇ tower لارنىڭ بىرى بىلەن ئالاقىلىشىۋاتىدۇ.\n\nمىليونلىغان ئىشلەتكۈچىنى بىر ۋاقىتتا قوللاش ئۈچۈن cellular network لار ئىنچىكە باشقۇرۇلىدىغان frequency ۋە channel لاردا ئىشلەيدۇ.\n\nئىشلەتكۈچى بىر جايدىن يەنە بىر جايغا يۆتكەلگەندە، connection ئۈزۈلمەي بىر cell tower دىن يەنە بىرىگە ئاپتوماتىك handoff قىلىنىدۇ. شۇڭا بىر جايدا باشلىغان تېلېفونىڭىزنى سەپەر جەريانىدا داۋاملاشتۇرالايسىز ياكى ھەرىكەتتە media stream قىلالايسىز.\n\n### 2G، 3G، 4G، 5G\n\nCellular technology بىر نەچچە ئەۋلاد ئارقىلىق تەرەققىي قىلدى:\n\n**2G — Second Generation**\n- ئاساسلىقى voice call ۋە basic text messaging ئۈچۈن لايىھەلەنگەن.\n- ئۆز دەۋرىدە زور يېڭىلىق بولغان، ئەمما بۈگۈنكى ئۆلچەمدە data capacity ئىنتايىن چەكلىك.\n\n**3G — Third Generation**\n- تېخىمۇ تېز data speed ئېلىپ كەلدى.\n- mobile web browsing ۋە basic video streaming نى مۇمكىن قىلدى.\n\n**4G — Fourth Generation**\n- mobile connectivity دا چوڭ سەكرەش بولدى.\n- تېخىمۇ تېز speed ۋە ياخشى performance بىلەن HD video streaming، online gaming ۋە بۈگۈنكى نۇرغۇن mobile application لارنى قوللىدى.\n\n**5G — Fifth Generation**\n- 4G نىڭ ئاساسى ئۈستىگە قۇرۇلغان.\n- تېخىمۇ تېز speed، چوڭ capacity ۋە ناھايىتى تۆۋەن latency تەمىنلەيدۇ.\n- كۈندىلىك mobile use نى ياخشىلاپلا قالماي، augmented reality ۋە ئىلغار connected system قاتارلىق يېڭى تېخنىكىلارنىمۇ قوللايدۇ.\n\n2G دىن 5G غىچە ھەر بىر ئەۋلاد تېخىمۇ كۆپ device، تېز data rate ۋە ئىشەنچلىك connection نى قوللاش ئارقىلىق user experience نى ياخشىلىدى.\n\nTroubleshooting قىلغاندا ئۈسكۈنىنىڭ قايسى cellular standard نى ئىشلىتىۋاتقانلىقىنى بىلىش performance، coverage ۋە connectivity پەرقىنى چۈشىنىشكە ياردەم بېرىدۇ.\n\n### Cellular Setting نى باشقۇرۇش\n\nCellular connectivity enabled بولسا، mobile device carrier دەپمۇ ئاتىلىدىغان mobile service provider ئارقىلىق:\n- phone call قىلىدۇ،\n- text message يوللايدۇ،\n- Internet كە چىقىدۇ.\n\nWi-Fi بولمىغان commuting ياكى traveling جەريانىدا بۇ connection ئالاھىدە مۇھىم.\n\nبەزى setting لار device behavior غا بىۋاسىتە تەسىر قىلىدۇ. مەسىلەن، cellular data چەكلەنگەن بولسا، ئۈسكۈنە تېلېفون قىلالىشى، ئەمما Internet كە چىقالماسلىقى مۇمكىن.\n\nيەنە بەزى network setting لار قايسى cellular technology لارنىڭ ئىشلىتىلىشىگە رۇخسەت قىلىدىغانلىقىنى كونترول قىلىدۇ. توغرا standard لار enabled بولسا، signal condition ئۆزگەرگەندە ئۈسكۈنە توغرا ئۇلىنالايدۇ.\n\nخەلقئارا ساياھەتتە unexpected charge دىن ساقلىنىش ئۈچۈن cellular data چەكلىنىشى مۇمكىن. بۇنداق ئەھۋالدا **data roaming** نى enable قىلىش home carrier coverage سىنىڭ سىرتىدا mobile data service ئىشلىتىشكە يول قويىدۇ. ئەمما roaming قوشۇمچە ھەق پەيدا قىلىشى مۇمكىن، شۇڭا ئېھتىياتچان ئىشلىتىش كېرەك.\n\nكۆپىنچە mobile device settings menu ئارقىلىق:\n- cellular data نى on/off قىلىش،\n- roaming option نى باشقۇرۇش،\n- قايسى cellular technology نىڭ active ئىكەنلىكىنى تەكشۈرۈش\nمۇمكىن.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## SIM — Subscriber Identity Module\n\nMobile device نىڭ cellular network قا قانداق ئۇلىنىدىغانلىقىنى چۈشىنىش ئۈچۈن SIM دىن باشلايمىز.\n\nSIM (Subscriber Identity Module) كىچىك card بولۇپ، ئۈسكۈنىنى cellular network تا تونۇتۇش ۋە authentication قىلىشقا ئىشلىتىلىدىغان ئۇچۇرلارنى ساقلايدۇ.\n\nبۇ ئۇچۇر ئۈسكۈنىنى مەلۇم mobile service provider غا باغلايدۇ ۋە:\n- call قىلىش،\n- text message يوللاش،\n- mobile data ئىشلىتىش\nئىمكانى بېرىدۇ.\n\n### Activation\n\nActivation — SIM دا ساقلانغان ئۇچۇرنى ئىشلىتىپ ئۈسكۈنىنىڭ carrier cellular network غا ئۇلىنىشىنى قوزغىتىش جەريانى.\n\nSIM activation قىلىنمىغۇچە ئۈسكۈنە ئېچىلىشى مۇمكىن، ئەمما تولۇق cellular functionality بولمايدۇ.\n\n### Provisioning\n\nProvisioning activation بىلەن زىچ مۇناسىۋەتلىك. ئۇ carrier نىڭ network service لىرىنى شۇ ئۈسكۈنىگە ماس تەڭشەش جەريانى.\n\nProvisioning قايسى مۇلازىمەتلەرنىڭ بارلىقىنى بېكىتىدۇ، مەسىلەن:\n- voice\n- text\n- data limit\n- roaming capability\n\n### Portability\n\nSIM device-specific hardware detail ئەمەس، subscriber information ساقلىغاچقا، كۆپ ئەھۋالدا بىر compatible device دىن يەنە بىرىگە كۆچۈرگىلى بولىدۇ.\n\nئەگەر device unlocked ۋە network تەرىپىدىن قوللانغان بولسا، ئىشلەتكۈچى carrier نى ئۆزگەرتمەي phone نى ئالماشتۇرالايدۇ.\n\nشۇڭا replacement device قا SIM نى كۆچۈرۈپ قويسا، service نى تېز ئەسلىگە كەلتۈرگىلى بولىدۇ.\n\nSIM يەنە device بىلەن carrier ئارىسىدىكى مۇناسىۋەتنى بەلگىلەيدۇ:\n- **Carrier-locked device:** پەقەت مەلۇم provider نىڭ SIM ىنى قوبۇل قىلىدۇ.\n- **Unlocked device:** بىر نەچچە carrier نىڭ SIM ى بىلەن ئىشلىيەلەيدۇ.\n\nConnectivity troubleshooting ياكى service provider ئالماشتۇرغاندا بۇ پەرقنى بىلىش مۇھىم.\n\n### eSIM — Embedded SIM\n\neSIM فىزىكىلىق SIM بىلەن ئاساسەن ئوخشاش خىزمەت قىلىدۇ، ئەمما removable card ئەمەس؛ device hardware نىڭ ئىچىگە بىۋاسىتە built-in قىلىنغان.\n\nشۇڭا ئۇنى قىستۇرۇش ياكى جىسمانىي ئالماشتۇرۇشقا كېرەك يوق.\n\neSIM دا activation ۋە provisioning رەقەملىك شەكىلدە قىلىنىدۇ. ئىشلەتكۈچى carrier profile نى device غا بىۋاسىتە download قىلىپ، دۇكانغا بارماي ياكى فىزىكىلىق SIM قىستۇرماي service نى قوزغىتالايدۇ.\n\nبۇ eSIM نى تۆۋەندىكى ئەھۋاللارغا ئالاھىدە قولايلىق قىلىدۇ:\n- تېز setup\n- carrier نى دائىم ئالماشتۇرۇش\n- بىر ئۈسكۈنىدە بىر نەچچە cellular plan نى قوللاش\n\neSIM portability ئۇسۇلىنىمۇ ئۆزگەرتىدۇ. فىزىكىلىق SIM نى بىر device دىن يەنە بىرىگە يۆتكەشنىڭ ئورنىغا، carrier profile نى software ئارقىلىق قوشۇش ياكى ئۆچۈرۈش بىلەن باشقۇرۇلىدۇ.\n\nبۇ تېخىمۇ جانلىق ۋە قولايلىق، ئەمما device نىڭ eSIM نى قوللىشى ۋە carrier نىڭ eSIM implementation ى بىلەن compatible بولۇشى شەرت.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Hotspot Connectivity\n\nMobile hotspot ئادەتتىكى تور ئۇلىنىشى يوق ۋاقىتتا Internet كە چىقىشنىڭ قولايلىق ئۇسۇلى.\n\nمەسىلەن، Wi-Fi يوق بىر قەھۋەخانىدا بولۇپ، laptop تىن جىددىي email يوللاش كېرەك دەپ تەسەۋۋۇر قىلىڭ. بۇ ۋاقىتتا smartphone نىڭ hotspot ئىقتىدارى ياردەم بېرىدۇ.\n\nHotspot نى قوزغاتقاندا، smartphone ئۆزىنىڭ cellular data connection ىنى ئىشلىتىپ شەخسىي Wi-Fi تورى قۇرىدۇ. ئاندىن laptop نى شۇ تورغا ئۇلاپ Internet كە چىقالايسىز، خۇددى ئادەتتىكى Wi-Fi ياكى wired network غا ئۇلانغاندەك.\n\nئادەتتىكى setup جەريانى:\n1. Smartphone نىڭ Settings menu سىغا كىرىڭ.\n2. Hotspot نى enable قىلىڭ.\n3. تېلېفون Wi-Fi signal تارقىتىشقا باشلايدۇ.\n4. Laptop تا Wi-Fi network list نى ئېچىڭ.\n5. Smartphone نىڭ network name ىنى تاللاپ ئۇلىنىڭ.\n\nئۇلانغاندىن كېيىن laptop تېلېفوننىڭ data plan ىنى ئىشلىتىدۇ. Internet browsing، streaming ياكى virtual meeting قاتارلىق ئىشلارنى قىلالايسىز.\n\nئەمما data usage غا دىققەت قىلىڭ، چۈنكى laptop تېلېفونىڭىزنىڭ cellular data plan ىنى سەرپ قىلىدۇ ۋە قوشۇمچە ھەق كېلىپ چىقىشى مۇمكىن.\n\nHotspot نى قۇرۇشنىڭ باشقا ئۇسۇللىرىمۇ بار؛ يۇقىرىدىكىسى ئەڭ كۆپ ئۇچرايدىغان scenario.\n\nHotspot ئۇزۇن ۋاقىت ئىشلىتىلسە battery نى تېزرەك تۈگىتىدۇ، شۇڭا ئۇزۇن ئىشلىتىشتە mobile device نى charger غا ئۇلاپ قويۇش ياخشى بولۇشى مۇمكىن.\n\nئىش تۈگىگەندە hotspot نى off قىلىشنى ئۇنتۇماڭ. بۇ:\n- data نى تېجەيدۇ،\n- battery life نى ساقلايدۇ،\n- connection security نى ياخشىلايدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Wi-Fi Connectivity\n\nHotspot cellular data نى ئىشلىتىپ يېڭى تور قۇرىدۇ؛ Wi-Fi connectivity بولسا ئاللىبۇرۇن بار بولغان wireless network قا قوشۇلۇشقا مەركەزلىشىدۇ.\n\nWi-Fi ئارقىلىق smartphone، tablet ۋە laptop لار:\n- home router،\n- business،\n- school،\n- public access point\nتەمىنلىگەن local network قا ئۇلىنالايدۇ.\n\nئۇلانغاندىن كېيىن device cellular data غا تايانماي Internet ۋە local network resource لارنى ئىشلىتەلەيدۇ.\n\nمەسىلەن، ئۆيگە كەلگەندە laptop ئۆي Wi-Fi تورىغا ئاپتوماتىك ئۇلىنىشى مۇمكىن. Hotspot تىن پەرقلىق ھالدا، بۇ network ئادەتتە cable ياكى fiber قاتارلىق wired Internet service غا ئالدىن ئۇلانغان wireless router تەرىپىدىن تەمىنلىنىدۇ.\n\nWi-Fi cellular data plan غا تايانمىغاچقا، كۆپ ئەھۋالدا:\n- تېز،\n- مۇقىم،\n- mobile data allowance نى سەرپ قىلمايدۇ.\n\nWi-Fi network قا ئۇلىنىش:\n1. Device نىڭ Wi-Fi settings ىنى ئېچىڭ.\n2. Available wireless network list نى كۆرۈڭ.\n3. توغرا network نى تاللاڭ.\n4. Protected network بولسا security key ياكى password كىرگۈزۈڭ.\n5. Authentication تاماملانغاندىن كېيىن connection قۇرۇلۇپ data transmission باشلىنىدۇ.\n\nنۇرغۇن device trusted network نى ئەستە ساقلاپ، دائىرىگە كىرگەندە ئاپتوماتىك قايتا ئۇلىنىدۇ.\n\nWi-Fi نى off/on قىلىش ئارقىلىق:\n- battery نى تېجەش،\n- untrusted network تىن ساقلىنىش،\n- كېرەك بولغاندا device نى cellular data غا قايتۇرۇش\nمۇمكىن.\n\nTroubleshooting جەريانىدا Wi-Fi نىڭ قانداق ئىشلەيدىغانلىقى ۋە باشقا connection option لار بىلەن قانداق ئۆزئارا تەسىر قىلىدىغانلىقىنى چۈشىنىش توغرا ھەل قىلىش چارىسىنى تېز تېپىشقا ياردەم بېرىدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Bluetooth Pairing\n\nBluetooth ئوخشىمىغان device لار ئارىسىدا wireless data exchange قىلىدىغان تېخنىكا. ئۇ ئارقىلىق smartphone، computer، headphone، speaker، ھەتتا car audio system نى cable سىز ئۇلاشقا بولىدۇ.\n\nBluetooth نىڭ قولايلىق مىساللىرى:\n- wireless headphone دا music ئاڭلاش\n- device لار ئارىسىدا file نى تېز ھەمبەھىرلەش\n\nبۇنىڭ ئۈچۈن ئالدى بىلەن **Bluetooth pairing** نى چۈشىنىش كېرەك.\n\nPairing — ئىككى Bluetooth-enabled device ئارىسىدا ئۇلار بىر-بىرى بىلەن ئالاقە قىلالايدىغان بىخەتەر wireless connection قۇرۇش جەريانى.\n\n### Pairing قەدەملىرى\n\n1. Mobile device نىڭ Settings ىدا Bluetooth نى enable قىلىڭ.\n2. ئۇلىماقچى بولغان Bluetooth device نى pairing mode غا كىرگۈزۈڭ. ئادەتتە مەلۇم button نى ئۇزۇن بېسىپ تۇرىسىز؛ مەسىلەن Bluetooth headphone نىڭ power button ىنى.\n3. بىرىنچى device قا قايتىپ available device لارنى scan قىلىڭ.\n4. ئىككىنچى device list تا كۆرۈنگەندە ئۇنى تاللاپ pairing نى باشلاڭ.\n5. بەزىدە PIN code كىرگۈزۈش تەلەپ قىلىنىدۇ.\n\nPIN code قوشۇمچە security measure بولۇپ، توغرا رۇخسەت بار ئادەملا device لار ئارىسىدا connection قۇرالايدۇ. توغرا PIN بولمىسا pairing تاماملانمايدۇ.\n\nبۇ قەدەم public space تا ئالاھىدە مۇھىم، چۈنكى ئەتراپتا نۇرغۇن Bluetooth device بولۇشى ۋە خاتا ياكى malicious connection خەۋپى يۇقىرى بولۇشى مۇمكىن.\n\nDevice لار بىر قېتىم paired بولغاندىن كېيىن، ئۇلارنى disconnect ياكى pairing record نى remove قىلمىغۇچە ئادەتتە بىر-بىرىنى ئەستە ساقلايدۇ. شۇڭا ھەر قېتىم قايتا setup قىلىش كېرەك ئەمەس.\n\nBluetooth ئىشلىتىلمىگەندە off قىلىش:\n- battery life نى تېجەيدۇ،\n- security نى ياخشىلايدۇ،\n- رۇخسىتىڭىزسىز Bluetooth connection قۇرۇلۇشىنى توسۇشقا ياردەم بېرىدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Location Services — ئورۇن مۇلازىمىتى\n\nMobile-device location service رەقەملىك دۇنيا بىلەن جىسمانىي دۇنيا ئارىسىدىكى كۆۋرۈك رولىنى ئوينايدۇ. بۇ service لار device نىڭ ئۆزىنىڭ قەيەردە ئىكەنلىكىنى بەلگىلەپ، application ۋە feature لارنى شۇنىڭغا ماس ئىشلىتىشىگە يول قويىدۇ.\n\n### GPS — Global Positioning System\n\nGPS يەر شارىنى ئايلىنىپ يۈرگەن satellite تورى بولۇپ، location ۋە timing information تارقىتىدۇ.\n\nSmartphone ئىچىدىكى GPS receiver بىر نەچچە satellite نىڭ signal ىنى قوبۇل قىلىپ، شۇ ئۇچۇرلار ئارقىلىق ئۆزىنىڭ ئورنىنى ھېسابلايدۇ.\n\nقانچە كۆپ satellite signal قوبۇل قىلىنسا، location ئادەتتە شۇنچە ئېنىق بولىدۇ. شۇڭا GPS ئوچۇق ئاسمان كۆرۈنىدىغان سىرتقى مۇھىتتا ئەڭ ياخشى ئىشلەيدۇ.\n\n### Cellular Triangulation\n\nGPS دىن باشقا، cellular signal ئارقىلىق **device triangulation** قىلىشقىمۇ بولىدۇ.\n\nMobile device يېقىن cell tower لار بىلەن داۋاملىق ئالاقىلىشىدۇ. بىر نەچچە tower غا بولغان signal strength نى ئۆلچەش ئارقىلىق device نىڭ تەخمىنىي ئورنىنى چىقارغىلى بولىدۇ.\n\nDevice قانچە كۆپ tower نى «كۆرەلەيدۇ»، location شۇنچە ئېنىق بولىدۇ. بۇنى ئۈچ بۇلۇڭنىڭ ئۈچ نۇقتىسىنى بىلىپ ئوتتۇرىدىكى ئورۇننى تېپىشقا ئوخشىتىشقا بولىدۇ.\n\n### Privacy ۋە Permission\n\nNavigation app، weather app ۋە ride-sharing service قاتارلىق نۇرغۇن application توغرا ئىشلىشى ئۈچۈن location data غا ئېھتىياجلىق.\n\nMobile operating system ئىشلەتكۈچىگە قايسى application نىڭ location data غا access قىلىدىغانلىقىنى كونترول قىلىش ئىمكانى بېرىدۇ.\n\nApp-by-app permission نى allow ياكى deny قىلىش ئارقىلىق unnecessary tracking خەۋپىنى ئازايتىپ privacy نى قوغدىغىلى بولىدۇ.\n\n### Location Accuracy\n\nMobile device لاردا location accuracy بىلەن battery usage ئارىسىدا تەڭپۇڭلۇق ساقلايدىغان setting لار بار.\n\n**High Accuracy mode** بىر نەچچە signal source نى بىرلىكتە ئىشلىتىدۇ:\n- GPS\n- Wi-Fi\n- Bluetooth\n- cellular network\n\nبۇ ئەڭ ئېنىق location information نى بېرىدۇ، ئەمما battery نى كۆپرەك سەرپ قىلىدۇ.\n\nباشقا mode لار power نى تېجەش ئۈچۈن ئىشلىتىدىغان technology سانىنى چەكلىشى مۇمكىن. High Accuracy بولسا بارلىق signal نى بىرلەشتۈرۈپ ئەڭ ئىشەنچلىك location data نى تەمىنلەيدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Mobile Device Management — MDM\n\nEnterprise Mobility Management (EMM) — كارخانا مۇھىتىدا mobile device لارنى بىخەتەر ئىشلىتىش ۋە باشقۇرۇشنىڭ جامع ئۇسۇلى.\n\nبۇ framework mobile device نى قوغدايدىغان ھەمدە personal data بىلەن corporate data ئارىسىدا ئېنىق ئايرىشنى ساقلايدىغان بىر توپ service ۋە technology غا تايىنىدۇ.\n\nكارخانىلار كۈندىلىك خىزمەتتە smartphone، tablet ۋە laptop قا تېخىمۇ كۆپ تايانغاچقا، EMM بۇ device لارنىڭ:\n- قانداق configure قىلىنىشى،\n- قانداق secure قىلىنىشى،\n- company resource غا قانداق access قىلىشى\nنى تەرتىپلىك باشقۇرۇش ئۇسۇلىنى تەمىنلەيدۇ.\n\nخىزمەتچىلەر corporate sensitive data غا ھەر خىل جايدىن ۋە ھەر خىل mobile device ئارقىلىق كىرىشى مۇمكىن. Centralized management بولمىسا security ۋە consistency نى ساقلاش قىيىن.\n\nEMM كارخانىلارغا:\n- risk نى ئازايتىش،\n- compliance requirement نى قاندۇرۇش،\n- flexible work environment نى قوللاش،\n- شۇنىڭ بىلەن بىر ۋاقىتتا device نى user ئۈچۈن ئىشلىتىشكە قولايلىق ۋە productive ساقلاش\nئىمكانى بېرىدۇ.\n\n### MDM — Mobile Device Management\n\nEMM نىڭ مەركىزىدە MDM بار.\n\nMDM IT administrator لارنىڭ mobile device لارنى:\n- control قىلىشى،\n- secure قىلىشى،\n- policy مەجبۇرىي ئىجرا قىلدۇرۇشى\nغا يول قويىدىغان technology.\n\nMDM ئارقىلىق organization device قەيەردە بولۇشىدىن قەتئىينەزەر:\n- device setting نى remote configure قىلىدۇ،\n- security requirement قوللىنىدۇ،\n- device نىڭ corporate system بىلەن قانداق ئۆزئارا ئىشلىشىنى باشقۇرىدۇ.\n\n### Device Configuration\n\nMDM نىڭ ئاساسلىق خىزمەتلىرىدىن بىرى device configuration.\n\nDevice enrollment قىلىنغان ھامان company standard غا ماس قىلىپ setup قىلىنىدۇ. بۇ تۆۋەندىكىلەرنى ئۆز ئىچىگە ئېلىشى مۇمكىن:\n- email account\n- Wi-Fi access\n- VPN connection\n- password requirement\n- screen-lock setting\n- encryption\n\nبۇ setup لارنى automation قىلىش device لار ئارىسىدا consistency نى ساقلايدۇ، manual setup ۋە configuration error نى ئازايتىدۇ.\n\n### Device Ownership Models\n\nMDM نىڭ قانداق قوللىنىلىشى device ownership model غا باغلىق.\n\n**Corporate-owned:**\nOrganization device نىڭ ئىگىسى. MDM ئارقىلىق پۈتۈن device ئۈستىدە تولۇق management control قوللىنىدۇ. IT administrator پۈتۈن device بويىچە policy ئىجرا قىلىپ، يۇقىرى security level نى ساقلىيالايدۇ.\n\n**COPE — Corporate-Owned, Personally Enabled:**\n- Device نى organization سېتىۋالغان ۋە ئىگىدارچىلىق قىلىدۇ.\n- Employee غا چەكلىك personal use رۇخسەت قىلىنىدۇ.\n- Company device نىڭ configuration، security policy ۋە corporate data سى ئۈستىدە كۈچلۈك control نى ساقلايدۇ.\n- شۇنىڭ بىلەن بىر ۋاقىتتا employee غا مەلۇم personal flexibility بېرىدۇ.\n\n**CYOD — Choose Your Own Device:**\n- Employee organization تەستىقلىغان device list ئىچىدىن ئۆزى تاللايدۇ.\n- Device نىڭ ئىگىدارچىلىقى ۋە management control ى organization دا قالىدۇ.\n- User غا مەلۇم تاللاش ئەركىنلىكى بېرىدۇ، IT support complexity نى چەكلەيدۇ ۋە consistent security standard نى ساقلايدۇ.\n\n**BYOD — Bring Your Own Device:**\n- Employee ئۆزىنىڭ personal device ىنى work ئۈچۈن ئىشلىتىدۇ.\n- Device نىڭ ئىگىسى employee.\n- Organization ئاساسلىقى corporate data نى قوغداش ئۈچۈن چەكلىك management control قوللىنىدۇ.\n- MDM policy پۈتۈن device نى باشقۇرۇشقا ئەمەس، work-related data نى secure قىلىشقا مەركەزلىشىدۇ.\n\n### Policy Enforcement\n\nMDM نىڭ يەنە بىر مۇھىم خىزمىتى—policy enforcement.\n\nPolicy managed device تا user نېمە قىلالايدىغانلىقى ۋە نېمە قىلالمايدىغانلىقىنى بەلگىلەيدۇ. مەسىلەن:\n- strong password تەلەپ قىلىش\n- بەزى device feature لارنى چەكلەش\n- unapproved application نى block قىلىش\n- device يوقالسا ياكى ئوغرىلانسا remote lock ياكى remote wipe قىلىش\n\nPolicy enforcement device controlled environment سىرتىدا ئىشلىتىلسىمۇ security standard نىڭ ساقلىنىشىغا ياردەم بېرىدۇ.\n\n### Corporate Application Management\n\nMDM corporate application لارنى deploy ۋە manage قىلىشنىمۇ قوللايدۇ.\n\nOrganization:\n- approved application نى install قىلىدۇ،\n- update قىلىپ تۇرىدۇ،\n- access ئەمدى كېرەك بولمىسا remove قىلىدۇ.\n\nبۇ employee لارنىڭ secure ۋە supported software ئىشلىتىشىگە ياردەم بېرىپ، unauthorized ياكى malicious application خەۋپىنى ئازايتىدۇ.\n\nئومۇمەن، MDM بىلەن كۈچەيتىلگەن Enterprise Mobility Management كارخانىلارنىڭ زامانىۋى mobile workflow نى بىخەتەر قوللىشىغا ياردەم بېرىدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە application support تەمىنلەڭ.\n\n## Mobile Device Synchronization\n\nMobile device synchronization — بىر خىل data نى smartphone، tablet ۋە laptop قاتارلىق بىر نەچچە device ئارىسىدا بىردەك ۋە ئەڭ يېڭى ھالەتتە ساقلاش جەريانى.\n\nSynchronization توغرا ئىشلىسە، بىر device تا قىلىنغان ئۆزگىرىش باشقا device لاردا ئاپتوماتىك ئەكس ئېتىدۇ. بۇ user نىڭ مۇھىم ئۇچۇرنى يوقاتماي device لار ئارىسىدا ئالماشتۇرۇپ ئىشلىشىگە يول قويىدۇ.\n\nبۈگۈنكى mobile environment تا synchronization ئادەتتە user account ۋە cloud service غا باغلانغان.\n\nUser بىر account بىلەن device قا sign in قىلغاندا، شۇ account تۆۋەندىكى data نى sync قىلىدىغان مەركىزىي hub قا ئايلىنىدۇ:\n- calendar\n- contact\n- email\n- file\n\nSync enabled ۋە connectivity بار بولسىلا data background تا داۋاملىق update قىلىنىدۇ.\n\n### Data Cap قا دىققەت قىلىش\n\nWi-Fi يوق ۋاقىتتا mobile device cellular data غا تايىنىشى مۇمكىن، cellular plan لاردا كۆپىنچە usage limit بولىدۇ.\n\nFile ياكى media قاتارلىق چوڭ data نى sync قىلىش available data نى تېز سەرپ قىلىدۇ. شۇڭا device كۆپىنچە synchronization نى پەقەت Wi-Fi دا قىلىشقا چەكلەش setting ى بىلەن تەمىنلەيدۇ. بۇ excessive data usage ۋە unexpected charge نى ئازايتىدۇ.\n\n### Calendar ۋە Contact Sync\n\nCalendar synchronization appointment، meeting ۋە reminder نىڭ بارلىق device تا بىردەك بولۇشىنى كاپالەتلەيدۇ. بىر device تا meeting قوشۇلسا ياكى ئۆزگەرتىلسە، باشقىلىرىدا ئاپتوماتىك كۆرۈنىدۇ.\n\nContact sync مۇ ئوخشاش ئىشلىيدۇ؛ phone number، email address ۋە contact detail user sign in قىلغان بارلىق device تا update ھالەتتە تۇرىدۇ.\n\n### Email ۋە Cloud Storage Sync\n\nEmail synchronization message لارنى device لار ئارىسىدا بىردەك كۆرسىتىدۇ. بىر device تا email ئوقۇلسا ياكى delete قىلىنسا، شۇ status باشقا device لاردىمۇ ئەكس ئېتىدۇ.\n\nCloud storage synchronization file لارنى مەركىزىي جايدا ساقلاپ، بىر نەچچە device دىن access قىلىشقا يول قويىدۇ. بىر device تىن upload قىلىنغان file نى يەنە بىر device تىن download ياكى edit قىلىشقا بولىدۇ.\n\nئەمما چوڭ file sync قىلىش storage space ۋە data usage غا تەسىر قىلىدۇ. شۇڭا data cap ۋە sync setting نى چۈشىنىش مۇھىم."}, {"id": "2.1", "number": "2.1", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.1, compare and contrast TCP and UDP ports, protocols, and their purposes. Networking protocols. With this video segment, we will be kicking off our study of the second domain of the Comp-TA plus core one certification exam.\n\nThis domain will be all about computer networking. If you completed our Tech+ course, you have already been introduced to many foundational networking concepts, and that baseline knowledge is expected as we move deeper into networking topics in this domain. With that said, let's jump into domain two, feed first.\n\nNetworking in the context of IT refers to the practice of connecting two or more computing devices together by some form of transmission medium in order to share resources and information. This connection can be established over wired or wireless mediums and enables devices to communicate and transfer data efficiently. Networking forms the backbone of modern IT infrastructure, allowing for functionalities like internet access, file sharing, and collaborative work environments.\n\nNow, onto networking protocols. A network protocol is a set of rules and standards that govern the exchange of information between devices or systems. It defines how data is transmitted, received, interpreted, and acted upon during communication.\n\nJust as we follow social norms to interact with others effectively, devices on a network adhere to specific protocols to ensure seamless communication. Think of protocols as a common language that devices use to understand and interpret each other's messages. Protocols also define how devices identify one another and how errors are handled.\n\nThey provide a structured framework that allows devices to communicate in a reliable and standardized manner. Without protocols, communication across networks would be chaotic and prone to errors. Can you imagine trying to have a conversation where everyone is speaking a different language?\n\nIt would be confusing, inefficient, and communication would quickly break down, which is exactly what happens on a network without protocols. Lastly, we'll discuss networking ports. A network port is a virtual point where network connections start and end.\n\nPorts are identified by port numbers, with each port number indicating a specific service or protocol. For instance, HTTP, the protocol for unencrypted web traffic typically uses port 80, while emails sent by the SMTP protocol will use port 25 by default. Understanding ports is paramount in network configuration and security, as managing these ports can control the flow of data and protect against unauthorized access.\n\nBy grasping these fundamental concepts of networking, protocols, and ports, you're well on your way to building a strong foundation in IT networking. This knowledge is not only important for your CompTIA A plus Core 1 exam, but also essential for a successful career in information technology. Exam objective 2.1, compare and contrast TCP and UDP ports, protocols, and their purposes.\n\nPorts and protocols. In this video segment, we're going to explore some of the most common networking protocols and their default port numbers. Whether you're new to this topic or looking to refresh your knowledge, you're in the right place.\n\nMy goal isn't to make you an expert by the end of this video segment, but to provide you with a basic understanding of each protocol's main purpose and their associated default port number, as that will be sufficient enough knowledge for this stage in your certification journey. To kick things off, let's start with the file transfer protocol, commonly known as FTP. This is a standard network protocol designed for transferring files between devices over a network connection.\n\nEssentially, FTP enables users to upload files from their local computer to a remote server or download files from a server to their computer. While FTP is a popular choice for its efficiency in file transfer, it's important to note that it has significant security limitations, particularly because it does not encrypt data. FTP typically uses two ports, port 20 and port 21.\n\nPort 21 is used for establishing a connection between the client and the server, often referred to as the control port. Through this port, commands and responses are exchanged. Port 20, on the other hand, is known as the data port, and it's used for the actual transfer of files.\n\nThe lack of encryption in FTP means that data, including potentially sensitive information like usernames and passwords, is transmitted in plain text. This makes it vulnerable to interception and unauthorized access. Moving on to the next protocol in the CompTIA AE plus core one exam objectives, we have secure shell, or SSH.\n\nThis protocol provides a secure method for accessing a remote computer or server. It's widely used for executing remote commands through the command line interface, or CLI. SSH stands out for its robust security, encrypting all data to prevent unauthorized access.\n\nIt primarily operates on port 22, which handles both the secure connection establishment and encrypted data transfers. This encryption ensures the confidentiality of all communications, including login details. Next up is Telnet, a protocol that shares many similarities with SSH, but with a key difference, it lacks security features.\n\nTelnet is another method used for accessing remote computers or servers, allowing users to remotely log into another computer over a network and execute CLI commands. However, Telnet transmits all data, including login credentials in plain text, making it susceptible to eavesdropping and unauthorized access. This lack of encryption starkly contrasts with SSH, which secures data transmission.\n\nTypically, Telnet operates on port 23. Its unsecured nature makes it less ideal for sensitive operations, especially in environments where data security is a priority. Continuing on, we have simple mail transfer protocol, or SMTP.\n\nThis protocol is used for sending emails from a client to a server or between servers. When you compose an email and click send, your email client uses SMTP to transfer that email to the desired email server for delivery. There it is stored until the recipient checks their inbox.\n\nWhile SMTP effectively handles the sending of emails, it does not encrypt them, which can be a concern for confidentiality. As for the protocol's default port, it operates primarily on port 25. Next, we have domain name system, or DNS, which is a fundamental protocol of the internet, often likened to a phone book for the world wide web.\n\nIts primary function is to translate domain names, which are easy for humans to remember, into IP addresses, which computers use to identify each other on the network. DNS operates mainly on port 53. This port is used for both querying DNS servers and receiving responses.\n\nFor instance, when you type a website URL into your browser, DNS servers use port 53 to find the corresponding IP address and direct your request to the correct server. Let's now explore DHCP, or dynamic host configuration protocol. This network management protocol is used to automate the process of configuring devices on IP networks.\n\nEssentially, DHCP allows network devices, like computers and printers, to automatically obtain IP addresses and other necessary network configurations. This makes it much easier to manage large networks, where assigning IP addresses manually would be impractical. DHCP operates primarily on two ports, port 67 and 68, and utilizes a four-step process known as DORA, discover, offer, request, and acknowledge, to automate network configuration.\n\nInitially, a client device seeking network access sends a discover message on port 68, signaling its need for an IP address. A DHCP server listening on port 67 responds with an offer message, proposing an available IP address and other configuration details. The client device then sends back a request message, essentially accepting the offered settings.\n\nFinally, the DHCP server completes the process by sending an acknowledge message, confirming the IP address and network settings assignment. Shifting our focus once again, we now have the hypertext transfer protocol, or HTTP. This protocol is the foundation of data communications across the world wide web.\n\nIt's used for transmitting web content from web servers to web browsers. Whenever you enter a website URL or click on a web link, HTTP is the protocol facilitating that webpage's retrieval and display. HTTP typically operates on port 80 and is another protocol that does not offer encryption for its data, which means that information sent and received through HTTP can potentially be intercepted and viewed by others.\n\nNext in our exploration of network protocols, we have another email protocol. This one is POP3, short for Post Office Protocol version 3 and is used for email retrieval. It's one of the oldest methods used by email clients to retrieve messages from an email server.\n\nWhen you set up your email account on a client, POP3 can be one of the protocols you choose for downloading your emails. Operating on port 110, POP3 is designed for simplicity and supports basic email functionalities. It allows the email client to download all messages from the server to the local device.\n\nAnd once downloaded, these emails are deleted from the server. This makes it a good option for users who prefer to access their emails from a single device. It's important to note that in its standard form, POP3 does not encrypt the email data it retrieves.\n\nThis can pose a security risk, especially when accessing emails over unsecured or public networks. As we continue our exploration of network protocols, we turn our focus to NetBIOS, or Network Basic Input Output system. This protocol is a key player in local area networks, primarily facilitating tasks like file sharing and printer access within smaller networks.\n\nNetBIOS operates using multiple ports, with each serving a specific function. Port 137 is designated for name services, essential for the identification of networked computers. Meanwhile, port 139 is involved in session services, enabling the establishment and maintenance of network connections between devices.\n\nWhile NetBIOS is highly useful in small scale network environments, it is not designed to handle the complexities of modern large scale internet networking. Now we have one more email protocol to cover. IMAP, or Internet Message Access Protocol, is a modern, synchronized way of handling emails.\n\nWhen you use IMAP, your email client remains connected to the email server. Instead of downloading and removing the emails, IMAP keeps your emails stored on the server while syncing them with your email client or multiple clients. If you haven't deduced this already, the main advantage of IMAP is that you can access your emails from multiple devices, like your workstation, laptop, or smartphone, and they'll always be in sync.\n\nAny changes you make on one device, like reading, replying, or deleting emails, are reflected on all your devices. Next, we have SNMP, or Simple Network Management Protocol. While SNMP is not directly tested within this exam objective it is an important protocol to become familiar with as you continue advancing in networking.\n\nThis protocol is used for monitoring and managing network devices, and is instrumental in gathering information from, and configuring, various network devices like routers, switches, servers, printers, and more. SNMP is particularly valuable in large scale network environments where a constant monitoring and adjustments are necessary for maintaining network health and performance. SNMP primarily operates on ports 161 and 162 for sending requests from the manager to the managed devices or agents, and receiving responses from these agent devices.\n\nAnother protocol available for use is LDAP, or Lightweight Directory Access Protocol. This is a protocol used for managing and accessing information in a network. It's like a phone book for a network helping to organize and find information about network resources such as users and services.\n\nLDAP uses port 389 to communicate. It allows network administrators to quickly find and manage information about users and resources on their network. This is especially useful in large organizations with lots of users and network services.\n\nNow it is time to take another look at HTTP, which is the protocol that facilitates communications across the World Wide Web or internet. But this time we will add some security. HTTPS stands for Hypertext Transfer Protocol Secure.\n\nIt's essentially HTTP with an added layer of security. This protocol is used for secure communication across the World Wide Web. HTTPS encrypts the data being sent and received, which is crucial for protecting sensitive information like login credentials, personal information, and payment details.\n\nThe primary port for HTTPS is port 443. When you visit a website with HTTPS, the connection between your browser and the web server is encrypted. This encryption helps to prevent eavesdroppers from being able to intercept the data being transferred, ensuring that your browsing and personal data remain private and secure.\n\nGreat job for making it this far. Just two more protocols to go for this video segment. Next is SMB.\n\nSMB, which stands for Server Message Block, is a network communication protocol used primarily for providing shared access to files, printers, and serial ports among devices on a network. It's most commonly seen in Windows environments, where it facilitates the easy sharing of files and printers within a local area network. SMB commonly operates on port 445 with modern network configurations.\n\nOne of the key features of SMB is its ability to allow computers within the same network to read and write to files and to request services from servers in a computer network. The protocol can also authenticate and authorize access to network resources, making it a versatile protocol for network administrators. And for our last protocol, we have RDP, or Remote Desktop Protocol.\n\nThis is another method used for accessing remote computers or servers, much like SSH and Telnet. It allows users to remotely log into another computer over a network connection. However, RDP stands out by providing a graphical user interface or GUI for the remote connection instead of a CLI-only option.\n\nThis means that users can see and interact with the desktop environment of the remote computer as if they were sitting right in front of it. RDP is extensively used in corporate environments for remote administration, remote work, and providing IT support. RDP primarily operates on port 3389 and provides a full desktop experience for remote access over a network connection.\n\nExam objective 2.1, compare and contrast TCP and UDP ports, protocols, and their purposes. TCP versus UDP. In the last video segment, we touched upon various network protocols which fall under the category of application protocols.\n\nApplication protocols in networking dictate how data is exchanged between applications across a network. These protocols enable different software applications, often running on different machines, to communicate and share data seamlessly. To facilitate these application protocols, transport protocols like TCP and UDP come into play.\n\nThese are more fundamental protocols that handle the actual process of data transmission over the network. They work by breaking down the data from application protocols into smaller data packets, transmitting these packets across the network, and then reassembling them at the destination. In essence, they provide the necessary infrastructure that enables application protocols to function effectively across diverse network environments.\n\nAlthough TCP and UDP share the common role of being transport protocols for network data transmission, their approaches to performing this task differ significantly. I will start by explaining a bit about TCP, also known as Transmission Control Protocol. When a device sends information using TCP, it establishes a connection with the recipient using a process referred to as a three-way handshake.\n\nThis connection process is just like a phone call. You wanna make sure the other person is on the line before you start talking. Once the connection is established, TCP checks whether all data packets are received and in the right order.\n\nIf something is missing, the protocol is designed to request a resend. This check process ensures complete data integrity and guarantees data delivery. UDP, or User Datagram Protocol, on the other hand, is more like sending a postcard.\n\nIt's fast and efficient, but doesn't guarantee that the postcard will reach its destination. UDP sends packets without establishing a connection, making it faster but less reliable than TCP. It's used when speed is more critical than accuracy, like live video streaming or online gaming, where receiving data quickly is more important than getting every single packet.\n\nIn conclusion, our exploration of TCP and UDP as transport protocols in networking reveals distinct differences in their functionalities. TCP is connection-oriented, establishing a reliable connection before data transmission, ensuring guaranteed delivery. This makes it ideal for application protocols that require data integrity and security.\n\nOn the other hand, UDP operates in a connectionless manner, where data is sent without establishing a connection, leading to non-guaranteed delivery. This is suitable for applications where speed is more critical than reliability. Understanding these differences is crucial in choosing the right protocol for specific networking tasks balancing the trade-offs between reliability and efficiency.", "uyghur": "Exam Objective 2.1\nTCP ۋە UDP port لىرى، protocol لار ۋە ئۇلارنىڭ مەقسىتىنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Networking Protocols — تور كېلىشىملىرى\n\nبۇ بۆلەك CompTIA A+ Core 1 نىڭ 2-domain ى—computer networking—نى باشلايدۇ.\n\nئەگەر Tech+ كۇرسىنى تاماملىغان بولسىڭىز، ئاللىبۇرۇن نۇرغۇن foundational networking concept بىلەن تونۇشقان بولۇشىڭىز كېرەك. بۇ domain دا شۇ ئاساس ئۈستىگە تېخىمۇ چوڭقۇر كىرىمىز.\n\n### Networking دېگەن نېمە؟\n\nIT دا networking — resource ۋە information نى ھەمبەھىرلەش ئۈچۈن ئىككى ياكى ئۇنىڭدىن كۆپ computing device نى مەلۇم transmission medium ئارقىلىق بىر-بىرىگە ئۇلاش جەريانى.\n\nConnection wired ياكى wireless بولۇشى مۇمكىن. ئۇ device لارنىڭ:\n- ئالاقە قىلىشى،\n- data يۆتكىشى،\n- Internet كە چىقىشى،\n- file sharing قىلىشى،\n- collaborative work environment قۇرۇشى\nغا يول قويىدۇ.\n\nNetworking زامانىۋى IT infrastructure نىڭ ئاساسىي تۈۋرۈكى.\n\n### Network Protocol دېگەن نېمە؟\n\nNetwork protocol — device ياكى system لار ئارىسىدا information exchange نى باشقۇرىدىغان rule ۋە standard لار توپلىمى.\n\nئۇ:\n- data قانداق transmit قىلىنىدۇ،\n- قانداق receive قىلىنىدۇ،\n- قانداق interpret قىلىنىدۇ،\n- ئۇچۇرغا قانداق جاۋاب قايتۇرۇلىدۇ\nدېگەن نەرسىلەرنى بەلگىلەيدۇ.\n\nبۇنى كىشىلەر ئارىسىدىكى «ئورتاق تىل» غا ئوخشىتىشقا بولىدۇ. Device لار specific protocol غا ئەگىشىپلا بىر-بىرىنىڭ message ىنى توغرا چۈشىنىدۇ.\n\nProtocol يەنە device لارنىڭ بىر-بىرىنى قانداق identify قىلىدىغانلىقى ۋە error نىڭ قانداق بىر تەرەپ قىلىنىدىغانلىقىنى بەلگىلەيدۇ.\n\nProtocol بولمىسا network communication قالايمىقان ۋە خاتالىققا تولغان بولاتتى؛ خۇددى ھەممە ئادەم ئوخشىمىغان تىلدا سۆزلىشىۋاتقان سۆھبەتكە ئوخشاش.\n\n### Network Port دېگەن نېمە؟\n\nNetwork port — network connection باشلىنىدىغان ياكى ئاخىرلىشىدىغان virtual point.\n\nPort number ھەر خىل service ياكى protocol نى پەرقلەندۈرۈشكە ئىشلىتىلىدۇ.\n\nمەسىلەن:\n- HTTP ئادەتتە port 80\n- SMTP ئادەتتە port 25\n\nPort نى چۈشىنىش network configuration ۋە security ئۈچۈن مۇھىم، چۈنكى port لارنى باشقۇرۇش data flow نى كونترول قىلىش ۋە unauthorized access نى توسۇشقا ياردەم بېرىدۇ.\n\nNetworking، protocol ۋە port نىڭ بۇ ئاساسىي ئۇقۇملىرى CompTIA A+ Core 1 غا ۋە كېيىنكى IT كەسپىگە مۇستەھكەم ئاساس قۇرىدۇ.\n\nExam Objective 2.1\nTCP ۋە UDP port لىرى، protocol لار ۋە ئۇلارنىڭ مەقسىتىنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Ports and Protocols\n\nبۇ بۆلەكتە ئەڭ كۆپ ئۇچرايدىغان network protocol لار ۋە default port number لىرىنى كۆرۈپ چىقىمىز.\n\nبۇ باسقۇچتا ھەر بىر protocol نىڭ:\n- ئاساسىي مەقسىتى،\n- default port number ى\nنى بىلىش يېتەرلىك.\n\n### FTP — File Transfer Protocol\n\nFTP network ئارقىلىق device لار ئارىسىدا file يۆتكەش ئۈچۈن ئىشلىتىلىدىغان standard network protocol.\n\nئۇ ئارقىلىق:\n- local computer دىن remote server غا file upload قىلىش،\n- server دىن local computer غا file download قىلىش\nمۇمكىن.\n\nFTP file transfer دا ئۈنۈملۈك، ئەمما مۇھىم security limitation بار: **data نى encrypt قىلمايدۇ.**\n\nFTP ئادەتتە ئىككى port ئىشلىتىدۇ:\n- **Port 21 — Control port:** client بىلەن server ئارىسىدا connection قۇرۇش، command ۋە response ئالماشتۇرۇش.\n- **Port 20 — Data port:** actual file transfer.\n\nEncryption بولمىغاچقا username ۋە password قاتارلىق sensitive information مۇ plain text ھالەتتە يوللىنىشى مۇمكىن. بۇ interception ۋە unauthorized access خەۋپىنى پەيدا قىلىدۇ.\n\n### SSH — Secure Shell\n\nSSH remote computer ياكى server غا بىخەتەر access قىلىش ئۇسۇلى.\n\nئۇ CLI (Command-Line Interface) ئارقىلىق remote command ئىجرا قىلىشتا كۆپ ئىشلىتىلىدۇ.\n\nSSH بارلىق data نى encrypt قىلىپ unauthorized access نى توسۇشقا ياردەم بېرىدۇ.\n\n- **Default port: 22**\n\nPort 22 secure connection establishment ۋە encrypted data transfer نى بىر تەرەپ قىلىدۇ. Login information قاتارلىق بارلىق communication نىڭ confidentiality سىنى قوغدايدۇ.\n\n### Telnet\n\nTelnet نىڭ مەقسىتى SSH غا ئوخشايدۇ: network ئارقىلىق remote computer ياكى server غا login قىلىپ CLI command ئىجرا قىلىش.\n\nئەمما مۇھىم پەرقى: **Telnet encryption ئىشلەتمەيدۇ.**\n\nLogin credential نىمۇ ئۆز ئىچىگە ئالغان بارلىق data plain text ھالەتتە يوللىنىدۇ. شۇڭا eavesdropping ۋە unauthorized access قا ئاسان ئۇچرايدۇ.\n\n- **Default port: 23**\n\nSensitive operation ۋە security مۇھىم مۇھىتتا Telnet ياخشى تاللاش ئەمەس.\n\n### SMTP — Simple Mail Transfer Protocol\n\nSMTP email **يوللاش** ئۈچۈن ئىشلىتىلىدۇ:\n- client دىن mail server غا،\n- mail server دىن يەنە بىر mail server غا.\n\nEmail يېزىپ Send نى باسقاندا، email client SMTP ئارقىلىق message نى لازىملىق mail server غا يوللايدۇ. ئۇ يەردە recipient inbox نى تەكشۈرگۈچە ساقلىنىدۇ.\n\nSource بويىچە SMTP ئۆزى email نى encrypt قىلمايدۇ، بۇ confidentiality مەسىلىسى بولۇشى مۇمكىن.\n\n- **Default port: 25**\n\n### DNS — Domain Name System\n\nDNS Internet نىڭ ئاساسىي protocol لىرىدىن بىرى بولۇپ، «World Wide Web نىڭ تېلېفون دەپتىرى» دەپ ئوخشىتىلىدۇ.\n\nئاساسىي خىزمىتى:\n- ئادەمگە ئاسان domain name نى\n- computer لار network تا ئىشلىتىدىغان IP address قا\nتەرجىمە قىلىش.\n\n- **Port: 53**\n\nPort 53 DNS server غا query يوللاش ۋە response قوبۇل قىلىشقا ئىشلىتىلىدۇ.\n\nمەسىلەن، browser غا website URL يازغاندا DNS server port 53 ئارقىلىق corresponding IP address نى تېپىپ request نى توغرا server غا يۆتكەشكە ياردەم بېرىدۇ.\n\n### DHCP — Dynamic Host Configuration Protocol\n\nDHCP IP network تا device configuration نى automation قىلىدىغان network-management protocol.\n\nComputer، printer قاتارلىق device لارنىڭ:\n- IP address،\n- ۋە باشقا لازىملىق network setting لارنى\nئاپتوماتىك ئېلىشىغا يول قويىدۇ.\n\nبۇ چوڭ network تا IP address نى قولدا تەقسىملەشنىڭ ئورنىغا باشقۇرۇشنى ئاسانلاشتۇرىدۇ.\n\nDHCP ئاساسلىقى:\n- **Port 67**\n- **Port 68**\nنى ئىشلىتىدۇ.\n\n### DORA جەريانى\n\nDHCP network configuration نى **DORA** دەپ ئاتىلىدىغان 4 قەدەم بىلەن ئاپتوماتلاشتۇرىدۇ:\n\n1. **Discover** — Client network access ئىزدەپ، IP address كېرەكلىكىنى بىلدۈرىدىغان Discover message يوللايدۇ.\n2. **Offer** — Port 67 دا ئاڭلاۋاتقان DHCP server available IP address ۋە باشقا configuration detail نى Offer قىلىدۇ.\n3. **Request** — Client شۇ تەكلىپنى قوبۇل قىلىپ Request message يوللايدۇ.\n4. **Acknowledge** — DHCP server ACK message ئارقىلىق IP address ۋە network setting تەقسىم قىلىنغانلىقىنى جەزملەشتۈرىدۇ.\n\n### HTTP — Hypertext Transfer Protocol\n\nHTTP World Wide Web دىكى data communication نىڭ ئاساسىي protocol لىرىدىن بىرى.\n\nWeb server دىن web browser غا web content يەتكۈزۈشكە ئىشلىتىلىدۇ.\n\nWebsite URL كىرگۈزگەندە ياكى link چەككەندە، HTTP webpage نى ئېلىپ browser دا كۆرسىتىش جەريانىغا ياردەم بېرىدۇ.\n\n- **Default port: 80**\n\nHTTP data نى encrypt قىلمايدۇ. شۇڭا HTTP ئارقىلىق يوللانغان ياكى قوبۇل قىلىنغان ئۇچۇرنى باشقىلار توسۇپ كۆرۈش ئېھتىماللىقى بار.\n\n### POP3 — Post Office Protocol version 3\n\nPOP3 email **قوبۇل قىلىش/چۈشۈرۈش** ئۈچۈن ئىشلىتىلىدىغان كونا protocol لارنىڭ بىرى.\n\nEmail client POP3 ئارقىلىق mail server دىن message لارنى local device قا download قىلىدۇ. Source تا بايان قىلىنىشىچە، download قىلىنغاندىن كېيىن message لار server دىن ئۆچۈرۈلىدۇ؛ شۇڭا بىرلا device تىن email ئىشلىتىشنى خالايدىغان ئادەمگە ماس كېلىدۇ.\n\n- **Default port: 110**\n- Standard POP3 email data نى encrypt قىلمايدۇ.\n\nشۇڭا unsecured ياكى public network تا ئىشلىتىش security risk پەيدا قىلىشى مۇمكىن.\n\n### NetBIOS — Network Basic Input/Output System\n\nNetBIOS كىچىك Local Area Network لاردا file sharing ۋە printer access قاتارلىق خىزمەتلەرگە ياردەم بېرىدىغان protocol.\n\nئۇ بىر نەچچە port ئىشلىتىدۇ:\n- **Port 137 — Name service:** network تا computer نى identify قىلىشقا ياردەم بېرىدۇ.\n- **Port 139 — Session service:** device لار ئارىسىدا network session قۇرۇش ۋە ساقلاشقا ئىشلىتىلىدۇ.\n\nNetBIOS كىچىك local network تا پايدىلىق، ئەمما زامانىۋى چوڭ Internet networking نىڭ مۇرەككەپلىكى ئۈچۈن لايىھەلەنمىگەن.\n\n### IMAP — Internet Message Access Protocol\n\nIMAP email نى زامانىۋى، synchronized شەكىلدە باشقۇرىدۇ.\n\nIMAP ئىشلىتىلگەندە email client mail server بىلەن connection نى ساقلايدۇ. Email نى server دىن چۈشۈرۈپ ئۆچۈرۈشنىڭ ئورنىغا، message لار server دا ساقلىنىپ، بىر ياكى بىر نەچچە client بىلەن sync قىلىنىدۇ.\n\nئاساسلىق ئەۋزەللىكى: workstation، laptop، smartphone قاتارلىق بىر نەچچە device تىن email غا كىرىپ، ھەممىسىنى synchronized ھالەتتە ساقلىغىلى بولىدۇ.\n\nبىر device تا email نى:\n- read،\n- reply،\n- delete\nقىلسىڭىز، ئۆزگىرىش باشقا device لاردىمۇ ئەكس ئېتىدۇ.\n\n### SNMP — Simple Network Management Protocol\n\nSNMP بۇ exam objective دا بىۋاسىتە سىنالمىسىمۇ، networking دا مۇھىم protocol.\n\nئۇ router، switch، server، printer قاتارلىق network device لارنى:\n- monitor قىلىش،\n- manage قىلىش،\n- ئۇچۇر توپلاش،\n- configure قىلىش\nئۈچۈن ئىشلىتىلىدۇ.\n\nچوڭ network تا health ۋە performance نى ساقلاش ئۈچۈن داۋاملىق monitoring ۋە adjustment كېرەك بولغاچقا SNMP ئالاھىدە پايدىلىق.\n\n- **Ports 161 ۋە 162** — manager بىلەن managed device/agent ئارىسىدىكى request/response ۋە notification خىزمەتلىرى ئۈچۈن.\n\n### LDAP — Lightweight Directory Access Protocol\n\nLDAP network ئىچىدىكى information نى manage ۋە access قىلىش protocol ى. ئۇنى network نىڭ «تېلېفون دەپتىرى» دەپ ئوخشىتىشقا بولىدۇ.\n\nUser ۋە service قاتارلىق network resource لارنى تەشكىللەش ۋە تېپىشقا ياردەم بېرىدۇ.\n\n- **Default port: 389**\n\nبولۇپمۇ user ۋە network service كۆپ بولغان چوڭ organization دا administrator لارغا resource نى تېز تېپىش ۋە باشقۇرۇشقا پايدىلىق.\n\n### HTTPS — Hypertext Transfer Protocol Secure\n\nHTTPS ئاساسەن HTTP نىڭ security قوشۇلغان شەكلى.\n\nئۇ World Wide Web ئارقىلىق secure communication ئۈچۈن ئىشلىتىلىدۇ. Data نى encrypt قىلىپ تۆۋەندىكى sensitive information نى قوغدايدۇ:\n- login credential\n- personal information\n- payment detail\n\n- **Default port: 443**\n\nHTTPS website قا كىرگەندە browser بىلەن web server ئارىسىدىكى connection encrypted بولىدۇ. بۇ eavesdropper نىڭ data نى توسۇپ ئوقۇشىنى قىيىنلاشتۇرۇپ، browsing ۋە personal data نىڭ privacy/security سىنى ياخشىلايدۇ.\n\n### SMB — Server Message Block\n\nSMB network communication protocol بولۇپ، network ئىچىدىكى device لارغا:\n- file،\n- printer،\n- serial port\nقاتارلىق resource لارنى share قىلىشقا يول قويىدۇ.\n\nWindows environment تا كۆپ ئۇچرايدۇ ۋە Local Area Network دا file/printer sharing نى ئاسانلاشتۇرىدۇ.\n\n- **Modern SMB default port: 445**\n\nSMB بىر network ئىچىدىكى computer لارنىڭ shared file نى read/write قىلىشى ۋە server service نى request قىلىشىغا يول قويىدۇ. شۇنداقلا network resource غا access نى authenticate ۋە authorize قىلالايدۇ.\n\n### RDP — Remote Desktop Protocol\n\nRDP remote computer ياكى server غا network ئارقىلىق كىرىش ئۇسۇلى. SSH ۋە Telnet غا ئوخشاش remote access تەمىنلەيدۇ، ئەمما مۇھىم پەرقى—**GUI (Graphical User Interface)** تەمىنلەيدۇ.\n\nUser remote computer نىڭ desktop environment ىنى كۆرۈپ، خۇددى ئۇ computer نىڭ ئالدىدا ئولتۇرغاندەك ئىشلىتەلەيدۇ.\n\nRDP corporate environment تا:\n- remote administration،\n- remote work،\n- IT support\nئۈچۈن كۆپ ئىشلىتىلىدۇ.\n\n- **Default port: 3389**\n\nExam Objective 2.1\nTCP ۋە UDP port لىرى، protocol لار ۋە ئۇلارنىڭ مەقسىتىنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## TCP vs UDP\n\nئالدىنقى بۆلەكتە FTP، HTTP، DNS، SMTP قاتارلىق **application protocol** لارنى كۆردۇق. Application protocol لار network ئارقىلىق application لارنىڭ data نى قانداق ئالماشتۇرىدىغانلىقىنى بەلگىلەيدۇ.\n\nبۇ application protocol لارنىڭ data سىنى ئەمەلىي network ئارقىلىق يەتكۈزۈشتە **transport protocol** بولغان TCP ۋە UDP مۇھىم رول ئوينايدۇ.\n\nئۇلار application data نى كىچىك packet لارغا بۆلۈپ، network ئارقىلىق يەتكۈزۈپ، destination دا قايتا بىرلەشتۈرۈشكە ياردەم بېرىدۇ.\n\n### TCP — Transmission Control Protocol\n\nTCP **connection-oriented** protocol.\n\nDevice TCP ئارقىلىق data يوللاشتىن بۇرۇن recipient بىلەن **three-way handshake** ئارقىلىق connection قۇرىدۇ. بۇنى تېلېفون قىلىشقا ئوخشىتىشقا بولىدۇ: سۆزلەشتىن بۇرۇن قارشى تەرەپنىڭ لىنىيەدە ئىكەنلىكىنى جەزملەشتۈرىسىز.\n\nConnection قۇرۇلغاندىن كېيىن TCP:\n- بارلىق packet يېتىپ كەلدىمۇ،\n- توغرا تەرتىپتە كەلدىمۇ\nدېگەننى تەكشۈرىدۇ.\n\nPacket يوقالسا resend تەلەپ قىلىدۇ.\n\nشۇڭا TCP:\n- data integrity نى ساقلايدۇ،\n- reliable delivery تەمىنلەيدۇ،\n- data نىڭ تولۇق يېتىپ بېرىشى مۇھىم بولغان application غا ماس.\n\n### UDP — User Datagram Protocol\n\nUDP **connectionless** protocol.\n\nئۇ data يوللاشتىن بۇرۇن connection قۇرمايدۇ. شۇڭا TCP غا قارىغاندا تېزرەك ۋە يېنىكرەك، ئەمما delivery نى كاپالەتلەندۈرمەيدۇ.\n\nبۇنى postcard يوللاشقا ئوخشىتىشقا بولىدۇ: تېز ۋە ئاسان، ئەمما چوقۇم destination غا يېتىدۇ دەپ كاپالەت يوق.\n\nUDP speed reliability دىن مۇھىم بولغان ئىشلارغا ماس، مەسىلەن:\n- live video streaming\n- online gaming\n\nبۇ scenario لاردا ھەر بىر packet نىڭ مۇكەممەل يېتىشىدىن كۆرە data نىڭ تېز كېلىشى مۇھىمراق.\n\n### TCP vs UDP ئەستە تۇتۇش\n\n**TCP:** connection-oriented، reliable، delivery guarantee، integrity مۇھىم.\n\n**UDP:** connectionless، fast، delivery guarantee يوق، speed مۇھىم.\n\nNetwork task قا توغرا protocol تاللاش reliability بىلەن efficiency ئارىسىدىكى trade-off نى چۈشىنىشكە باغلىق."}, {"id": "2.2", "number": "2.2", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.2, explain wireless networking technologies. Wireless frequencies. Imagine wireless signals as invisible waves carrying data through the air.\n\nThese signal waves have different frequencies, which determine how they behave and what tasks they excel at. A signal frequency is a measurement of how fast a signal wave moves up and down. Think of a bouncing ball and you counting how many times it bounces up and down in one second.\n\nSignal frequency is similar. It measures how many times a signal wave goes up and down in one second. If it moves up and down quickly, it has a high frequency.\n\nBut if it moves up and down slowly, it has a low frequency. Signal frequencies are usually measured in hertz, which represents the number of cycles per second. The electromagnetic spectrum chart behind me shows the entire range of electromagnetic frequencies.\n\nThis is just to give you an idea of the vast nature of wireless signal frequencies. But for the CompTIA A+ exam, we are going to focus on the three primary frequency bands used in modern wireless networking. These frequency bands are 2.4 gigahertz, five gigahertz and six gigahertz.\n\nThe first frequency band we will discuss is the 2.4 gigahertz band. It's like a slow but steady marathon runner. The 2.4 gigahertz band offers better range, meaning it can travel further.\n\nThis characteristic makes it ideal for providing wifi coverage in larger spaces. The 2.4 gigahertz band can also penetrate solid objects like walls more effectively. However, since it's quite popular, the 2.4 gigahertz band can get crowded, leading to potential interference from other nearby devices competing for the same frequency.\n\nNow let's meet our speedy sprinter, the five gigahertz band. It may not travel as far as the 2.4 gigahertz band, but it offers faster and more reliable connections over shorter distances. Due to its higher frequency, the five gigahertz band can handle more data, making it ideal for higher bandwidth tasks like HD video streaming, online gaining, and file transfers.\n\nAdditionally, since the five gigahertz band is less crowded, it experiences less interference from neighboring wireless signals, though it is more affected by walls and other physical obstacles. Finally, we have the newest runner in the race, the six gigahertz band. This frequency band offers even more available bandwidth and significantly less congestion because fewer devices currently operate in this range.\n\nThe trade-off is that like five gigahertz. It has a shorter range and an even more limited ability to pass through physical obstacles. For your CompTIA exam, it's important to recognize the trade-offs between these different frequency bands and that the six gigahertz band is designed specifically to support high-performance wireless networking in environments that require speed, capacity, and minimal signal competition.\n\nExam objective 2.2, explain wireless networking technologies. Wireless channels. In this video segment, we are going to take the wireless frequency bands we just discussed and break them down further into wireless channels.\n\nImagine tuning into a radio station where each station broadcasts on a specific frequency so that signals do not collide. In wireless networking, a wireless channel works the same way. A
