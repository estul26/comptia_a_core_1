channel is a smaller slice of a frequency band that devices use to transmit and receive data, helping reduce interference and keep communication organized.\n\nIn wireless networking, we primarily work with the 2.4 gigahertz, five gigahertz, and six gigahertz frequency bands. Each of these bands is divided into multiple channels, and the way those channels are selected can directly impact performance. Channel selection involves considering the channel's width, its frequency placement, and the band it operates within, all of which influence speed, range, and potential interference.\n\nStarting with some information about the 2.4 gigahertz band, this range is divided into multiple channels that are closely spaced together. Because these channels are wider than the separation between them, many of the channels overlap. This overlap can cause interference when multiple wireless networks operate nearby.\n\nFor this reason, channels one, six, and 11 are commonly used since they are spaced far enough apart to avoid overlapping with each other. Selecting non-overlapping channels in the 2.4 gigahertz band helps improve reliability, especially in crowded environments. Moving to the five gigahertz band, channels are more widely spaced and do not overlap in the same way.\n\nThis band offers a greater number of available channels and supports wider channel widths. A single wireless channel in this band typically starts at 20 megahertz, which provides stable performance and good compatibility. Through channel bonding, a technique that combines multiple adjacent wireless channels into a single wider channel, multiple 20 megahertz channels can be combined to form wider channels of 40, 80, or even 160 megahertz, allowing more data to be transmitted at once.\n\nWider channels increase throughput and are ideal for high bandwidth activities like video streaming and large file transfers, but they also consume more spectrum and can reduce effective range while becoming more sensitive to physical obstacles and signal interference. The six gigahertz band builds on these same concepts, offering even more available channels and wider channel options. Because this band is newer and less congested, it experiences minimal interference from competing wireless signals.\n\nHowever, like the five gigahertz band, it has a shorter range and limited ability to pass through walls. For the exam, it is important to recognize that six gigahertz is designed to support high capacity wireless environments where performance and clean channel availability are the priority. Finally, wireless channels are subject to regional regulations, which determine which channels and channel widths are allowed in different parts of the world.\n\nThese regulations exist to prevent interference with other wireless services and to protect critical communications. For example, in the 2.4 gigahertz band, the United States typically allows channels one through 11, while parts of Europe and other regions allow additional channels beyond that range. As a result, available channels and power levels can vary depending on location, making regulatory awareness an important part of wireless channel selection.\n\nExam objective 2.2, explain wireless networking technologies. Wi-Fi. When discussing wireless networks, the technology that most commonly comes to mind is Wi-Fi.\n\nWi-Fi, short for wireless fidelity, is a technology that allows computing devices to connect to and communicate with other computing devices wirelessly. It enables the transmission of data over short distances using radio waves and is most commonly used in homes, small offices, and public spaces like cafes, airports, and campuses. Earlier in this course, we covered Wi-Fi connectivity, where we focused on how a device connects to a wireless network from the user's perspective.\n\nIn this video segment, we are taking a step back to better understand what Wi-Fi actually is, how it functions at a higher level, and why it behaves the way it does. This foundational understanding will make troubleshooting and exam scenarios much easier to reason through. Wi-Fi communication begins when a device connects to a wireless access point, which acts as the bridge between the wireless device and a larger network.\n\nThat connection takes place over specific radio frequency bands, most commonly the 2.4 gigahertz, five gigahertz, and now six gigahertz bands. Each of these bands has different characteristics related to range, speed, and interference, which is why Wi-Fi performance can vary depending on environment and usage. Now that we have a working definition of Wi-Fi, we can move toward understanding how it is standardized.\n\nSince Wi-Fi was first introduced in 1997, it has evolved through multiple standards developed by the IEEE, or the Institute of Electrical and Electronics Engineers. The IEEE is a professional organization known for developing technical standards across many industries, including networking and telecommunications. Within the large collection of standards developed by the IEEE, the 802 family of standards focuses on local area networking, also known as LAN communications.\n\nFrom there, a specific subset of those standards applies to wireless networking. That subset is known as 802.11. The 802.11 standards define how Wi-Fi works, how devices communicate wirelessly, and how wireless local area networks, or WLANs, operate.\n\nWith that foundation in place, the next video segment will focus on the individual 802.11 standards you need to recognize for the CompTIA A+ Core 1 certification exam, and how they differ in terms of performance, frequency use, and capabilities. Exam objective 2.2, explain wireless networking technologies. 802.11 standards.\n\nThe first Wi-Fi standard appeared in 1997 with the introduction of the IEEE 802.11 standard. This original version laid the groundwork for wireless networking by allowing devices to communicate without physical cables. While it was limited in speed and capability, it marked the beginning of Wi-Fi as we know it today, and set the stage for decades of innovation.\n\nAs wireless networking grew in popularity, demand quickly increased for faster and more reliable connections. This led to the evolution of multiple 802.11 standards, each improving on the last. Understanding how these standards progressed helps explain why modern Wi-Fi behaves the way it does.\n\nIn 1999, 802.11a was introduced. This standard operates in the five gigahertz frequency band and was among the first to support higher data rates, reaching up to 54 megabits per second. While it offered improved performance, it's shorter range and higher cost at the time limited widespread adoption.\n\nLater that same year, 802.11b was released. This standard operates in the 2.4 gigahertz frequency band, which provides better range and improved wall penetration, but is more susceptible to interference. Its maximum throughput reached 11 megabits per second, and its lower cost helped Wi-Fi gain mainstream popularity.\n\nIn 2003, 802.11g arrived. It also uses the 2.4 gigahertz band, but increased throughput to 54 megabits per second, matching the speeds of 802.11a while maintaining the longer range benefits of the 2.4 gigahertz frequency band. This made it a widely adopted standard for many years.\n\nThe next major advancement came with 802.11n, introduced in 2009. This standard operates in both the 2.4 gigahertz and five gigahertz frequency bands, and marked a major shift in wireless performance. One of its most important contributions was the introduction of multiple input multiple output, often called MIMO.\n\nWith support for multiple data streams, 802.11n offers a theoretical maximum throughput of up to 600 megabits per second. MIMO, which was introduced with 802.11n, works by using multiple antennas to transmit and receive data at the same time, allowing several data streams to flow simultaneously instead of one at a time. This parallel transmission improves overall efficiency and performance, especially in environments with multiple connected devices.\n\nBy supporting up to four MIMO streams, wireless communication becomes faster and more reliable compared to earlier single stream standards. In 2013, 802.11ac, also known as Wi-Fi 5, was released. This standard operates exclusively in the five gigahertz band and further increase performance through wider channels and enhanced MIMO capabilities.\n\nIt introduced multi-user MIMO, which allows an access point to communicate with multiple devices at the same time instead of serving them one at a time. Theoretical throughput under ideal conditions can reach up to 6.9 gigabits per second. Multi-user MIMO builds on the original MIMO concept by shifting the focus from a single device to multiple devices at once.\n\nWith traditional MIMO, an access point could use multiple antennas to communicate more efficiently with one device at a time. Multi-user MIMO expands this capability by allowing the access point to transmit data to several devices simultaneously. This reduces waiting time, improves overall network efficiency, and is especially beneficial in environments where many devices are connected and competing for bandwidth.\n\nNext is 802.11ax, commonly known as Wi-Fi 6, which was released in 2019. Wi-Fi 6 operates in both the 2.4 gigahertz and 5 gigahertz bands and focuses on improving efficiency, capacity, and performance in crowded environments. While its theoretical speeds can reach up to 9.6 gigabits per second, its primary benefit is better handling of multiple connected devices rather than simply increased throughput.\n\nFinally, building on Wi-Fi 6, we come to Wi-Fi 6E. This standard expands support into the 6 gigahertz band. By operating in this newer frequency range, Wi-Fi 6E provides additional bandwidth and significantly reduced congestion, making it well-suited for high-performance wireless environments.\n\nThe progression of the 802.11 standards reflects how Wi-Fi has evolved to meet growing demands for speed, efficiency, and capacity. From early wireless connections to modern high-density networks, these standards continue to shape how devices communicate wirelessly today. Exam Objective 2.2, Explain Wireless Networking Technologies.\n\nBluetooth. As mentioned earlier in this course, Bluetooth is a wireless technology that allows devices to exchange data over short distances. It enables connections between devices such as smartphones, computers, headphones, speakers, keyboards, and even car audio systems without the need for physical cables.\n\nBluetooth is designed for convenience, making it ideal for everyday tasks like listening to audio through wireless headphones or connecting peripheral devices quickly and easily. In a previous video segment on Bluetooth connectivity, we focused on how devices are paired from a user's perspective. In this video segment, we are stepping back to better understand how Bluetooth operates as a wireless networking technology and why it behaves differently from technologies like Wi-Fi.\n\nThis higher level view helps explain Bluetooth strengths, limitations, and common use cases you may see in exam scenarios. Bluetooth operates using radio waves in the 2.4 gigahertz frequency band, which is the same general range used by many Wi-Fi networks. However, Bluetooth is optimized for short range, low power communication, rather than high speed data transfer.\n\nSince its introduction in 1999, Bluetooth has steadily evolved to become more reliable, efficient, and versatile. Early versions of Bluetooth faced challenges with interference and device compatibility, but improvements were made over time. Bluetooth 1.2 introduced better interference avoidance, helping devices coexist more smoothly with other wireless technologies.\n\nBluetooth 2.0 increased data transfer speeds up to three megabits per second, and Bluetooth 2.1 simplified the pairing process, making connections easier for users. Bluetooth 3.0 introduced the ability to negotiate a Wi-Fi connection when transferring large amounts of data, allowing speeds of up to 24 megabits per second for those specific use cases. A major turning point came with Bluetooth 4.0, which introduced Bluetooth Low Energy, often called BLE.\n\nBLE was designed for devices that require very low power consumption, such as fitness trackers, smart sensors, and other IoT devices. Bluetooth 5.0 focused on improving speed, reliability, and range while maintaining low power usage. Under ideal conditions, Bluetooth 5.0 can support communication over distances up to 100 meters for certain devices.\n\nThese improvements made Bluetooth more effective in environments with multiple connected devices and expanded its usefulness beyond simple point-to-point connections. Bluetooth 6.0 continues this evolution by further refining efficiency, responsiveness, and device awareness. While it maintains Bluetooth's short range, low power design, Bluetooth 6.0 enhances how devices interact and coordinate with one another, supporting more advanced use cases in areas like smart devices, wearables, and proximity-based applications.\n\nFor the exam, it's important to recognize Bluetooth as an ongoing progression rather than focusing on specific performance numbers.\n\nExam objective 2.2. Explain wireless networking technologies. NFC.\n\nNear Field Communication, or NFC, is a wireless networking interface standard that was released in 2003. It is an innovative technology that uses radio frequencies to allow two devices to share data when they are in close proximity to each other, typically over a short distance of a few centimeters. This technology operates at a frequency of 13.56 megahertz and offers data transfer speeds up to 424 kilobits per second.\n\nWhile these speeds might seem slow compared to other wireless technologies like Wi-Fi or Bluetooth, they are perfectly suited for the types of data NFC is designed to handle, such as exchanging digital access keys or processing mobile payments. One application of NFC is in building security systems. In these systems, an NFC-enabled device like a smartphone or a security badge is tapped against a reader to gain entry.\n\nThis method is increasingly popular in modern offices and hotels due to its enhanced security and convenience. NFC's short-range capabilities makes it a more secure option compared to traditional magnetic stripe cards as it is harder to intercept or duplicate the signal. NFC has also become a cornerstone in the world of mobile payments, transforming how we conduct transactions in our daily lives.\n\nServices such as Apple Pay, Google Wallet, and Samsung Pay utilize NFC to facilitate contactless payments, providing a seamless and efficient user experience. This technology enables users to complete purchases with a simple tap of their NSC-enabled phone or smartwatch against the payment terminal. Moreover, the role of NSC in mobile payments is bolstered by its underlying technology.\n\nIt provides a one-to-one connection with bi-directional communication, meaning that two devices can send and receive data to and from each other. This two-way communication capability is essential in transactions, allowing for not just the transfer of payment information, but also the confirmation of transaction details and receipts. Additionally, NSC incorporates built-in security protocols, which are critical in safeguarding sensitive information like credit card numbers and personal identification data.\n\nThese protocols often include encryption and secure channels, ensuring that the data transmitted during a transaction is protected against potential threats. Exam objective 2.2, explain wireless networking technologies. RFID.\n\nRFID is an acronym for radio frequency identification and is a wireless networking device interface technology used to communicate and interact with RFID-enabled peripherals. This interface allows for wireless identification, tracking, and data exchange between the peripheral devices and a source computing device. This standard is best suited for enhancing automation and efficiency in various industries and applications.\n\nWhen using RFID, an RFID reader scans a tag. The tag then responds back with information that has been programmed into it. RFID systems can be either passive or active in nature.\n\nPassive RFID systems consist of an RFID tag and reader, where the tag relies on the reader's energy in the form of electrical inductance to power and transmit its stored information. Active RFID systems, on the other hand, use battery-powered tags that actively send signals to the reader, allowing for longer ranges and continuous tracking. Passive RFID is cost-effective and suitable for short-range applications, while active RFID offers greater range and real-time tracking capabilities, making it ideal for scenarios like asset management.\n\nRFID technology is widely utilized for inventory control and tracking due to its ability to provide accurate and efficient identification and monitoring of assets. By tagging items with RFID tags and deploying RFID readers, businesses can automate inventory management, streamline supply chain operations, and gain real-time visibility into stock levels, location tracking, and movement history. RFID technology is also commonly employed for physical access control systems.\n\nBy utilizing RFID cards or key fobs embedded with RFID tags, individuals can easily gain authorized access to secured areas by presenting their credentials to RFID readers. Using RFID in this manner assists in ensuring only authorized personnel can enter restricted areas.", "uyghur": "Exam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## Wireless Frequencies — سىمسىز چاستوتىلار\n\nWireless signal نى ھاۋا ئارقىلىق data ئېلىپ ماڭىدىغان كۆرۈنمەس دولقۇن دەپ تەسەۋۋۇر قىلىڭ. بۇ دولقۇنلارنىڭ frequency سى ئۇلارنىڭ قانداق ھەرىكەت قىلىدىغانلىقى ۋە قايسى خىزمەتكە ياخشى ماس كېلىدىغانلىقىنى بەلگىلەيدۇ.\n\nSignal frequency — دولقۇننىڭ بىر سېكۇنتتا قانچە قېتىم يۇقىرى-تۆۋەن cycle قىلىدىغانلىقىنىڭ ئۆلچىمى.\n\n- تېز cycle قىلسا: high frequency\n- ئاستا cycle قىلسا: low frequency\n\nFrequency ئادەتتە **Hertz (Hz)** بىلەن ئۆلچىنىدۇ؛ Hz بىر سېكۇنتتىكى cycle سانىنى كۆرسىتىدۇ.\n\nCompTIA A+ ئۈچۈن زامانىۋى Wi-Fi دا ئىشلىتىلىدىغان ئۈچ مۇھىم frequency band:\n- **2.4 GHz**\n- **5 GHz**\n- **6 GHz**\n\n### 2.4 GHz\n\n2.4 GHz نى «ئاستا، ئەمما ئۇزۇنغا بارىدىغان marathon runner» دەپ تەسەۋۋۇر قىلىشقا بولىدۇ.\n\nئالاھىدىلىكى:\n- range ئۇزۇنراق\n- چوڭ رايوندا Wi-Fi coverage ئۈچۈن ياخشى\n- wall قاتارلىق solid object دىن تېخىمۇ ياخشى ئۆتىدۇ\n- كۆپ device ئىشلىتىدىغان frequency بولغاچقا congestion ۋە interference كۆپرەك بولۇشى مۇمكىن\n\n### 5 GHz\n\n5 GHz نى «تېز sprinter» دەپ قاراشقا بولىدۇ.\n\nئالاھىدىلىكى:\n- 2.4 GHz غا قارىغاندا range قىسقىراق\n- قىسقا ئارىلىقتا تېخىمۇ تېز ۋە ئىشەنچلىك connection\n- higher frequency بولغاچقا كۆپرەك data كۆتۈرەلەيدۇ\n- HD streaming، online gaming، file transfer قاتارلىق high-bandwidth task قا ماس\n- 2.4 GHz دىن ئادەتتە congestion ئازراق\n- wall ۋە physical obstacle نىڭ تەسىرىگە تېخىمۇ كۆپ ئۇچرايدۇ\n\n### 6 GHz\n\n6 GHz يېڭىراق band.\n\nئالاھىدىلىكى:\n- available bandwidth تېخىمۇ كۆپ\n- device ئاز بولغاچقا congestion ناھايىتى ئاز\n- speed/capacity يۇقىرى بولغان environment قا ماس\n- 5 GHz غا ئوخشاش range قىسقا\n- physical obstacle دىن ئۆتۈش ئىقتىدارى تېخىمۇ چەكلىك\n\nCompTIA ئۈچۈن ئەستە تۇتۇڭ: frequency يۇقىرىلىغانسېرى ئادەتتە speed/capacity ياخشىلىنىدۇ، ئەمما range ۋە wall penetration تۆۋەنلەيدۇ.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## Wireless Channels\n\nFrequency band نى radio station لار بار چوڭ دائىرە دەپ قارىسىڭىز، **channel** شۇ band ئىچىدىكى كىچىكرەك frequency بۆلىكى.\n\nDevice لار channel ئارقىلىق data transmit/receive قىلىدۇ. Channel تاللاش interference نى ئازايتىپ communication نى تەرتىپلىك قىلىشقا ياردەم بېرىدۇ.\n\n2.4 GHz، 5 GHz ۋە 6 GHz band لارنىڭ ھەر بىرى بىر نەچچە channel غا بۆلۈنىدۇ. Performance غا تۆۋەندىكىلەر تەسىر قىلىدۇ:\n- channel width\n- frequency placement\n- قايسى band تا ئىشلەۋاتقانلىقى\n\n### 2.4 GHz Channels\n\n2.4 GHz channel لار بىر-بىرىگە يېقىن. Channel width ئۇلارنىڭ ئارىلىقىدىن كەڭ بولغاچقا، نۇرغۇن channel overlap قىلىدۇ.\n\nNearby wireless network لار overlap قىلغان channel ئىشلىتىلسە interference پەيدا بولىدۇ.\n\nشۇڭا 2.4 GHz دا ئادەتتە **Channel 1، 6، 11** ئىشلىتىلىدۇ؛ ئۇلار بىر-بىرى بىلەن overlap قىلمايدۇ.\n\nCrowded environment تا non-overlapping channel تاللاش reliability نى ياخشىلايدۇ.\n\n### 5 GHz Channels\n\n5 GHz دا channel لار تېخىمۇ كەڭ ئارىلىقتا بولۇپ، 2.4 GHz دىكىدەك overlap مەسىلىسى ئاز.\n\nAvailable channel سانى كۆپ ۋە wider channel width قوللايدۇ.\n\nئادەتتىكى channel width:\n- 20 MHz\n\n**Channel bonding** ئارقىلىق يېنىدىكى 20 MHz channel لار بىرلەشتۈرۈلۈپ:\n- 40 MHz\n- 80 MHz\n- 160 MHz\nقىلىنالايدۇ.\n\nWider channel بىر ۋاقىتتا كۆپرەك data يەتكۈزۈپ throughput نى ئاشۇرىدۇ، streaming ۋە large-file transfer غا ياخشى. ئەمما:\n- spectrum نى كۆپرەك سەرپ قىلىدۇ،\n- effective range نى قىسقارتىشى مۇمكىن،\n- obstacle ۋە interference غا سەزگۈرلىكى ئاشىدۇ.\n\n### 6 GHz Channels\n\n6 GHz شۇ channel concept نىڭ تېخىمۇ كەڭ ۋە يېڭى شەكلى:\n- available channel تېخىمۇ كۆپ\n- wide-channel option كۆپ\n- congestion ئاز\n- competing wireless signal interference سى ئاز\n\nئەمما 5 GHz غا ئوخشاش:\n- range قىسقا\n- wall دىن ئۆتۈش ئىقتىدارى چەكلىك\n\n6 GHz high-capacity wireless environment تا clean channel availability ۋە performance مۇھىم بولغاندا لايىھەلەنگەن.\n\n### Regional Regulation\n\nWireless channel دۇنيانىڭ ھەر رايونىدىكى قائىدىگە باغلىق. Regulation قايسى channel ۋە channel width نى ئىشلىتىشكە بولىدىغانلىقىنى بەلگىلەپ، باشقا wireless service ۋە critical communication قا interference پەيدا بولۇشنىڭ ئالدىنى ئالىدۇ.\n\nمەسىلەن، source تا:\n- United States: 2.4 GHz دا ئادەتتە channel 1–11\n- Europe ۋە بەزى رايونلار: بۇنىڭدىن كۆپ channel ئىشلىتىلىشى مۇمكىن\nدېيىلگەن.\n\nشۇڭا available channel ۋە transmit power location غا قاراپ ئۆزگىرىشى مۇمكىن.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## Wi-Fi\n\nWi-Fi computing device لارنىڭ physical cable سىز بىر-بىرىگە ئۇلىنىپ communication قىلىشىغا يول قويىدىغان wireless technology.\n\nRadio wave ئارقىلىق قىسقا ئارىلىقتا data transmission قىلىدۇ ۋە كۆپىنچە:\n- home\n- small office\n- cafe\n- airport\n- campus\nقاتارلىق جايلاردا ئىشلىتىلىدۇ.\n\nWi-Fi communication device نىڭ **Wireless Access Point (AP)** قا ئۇلىنىشىدىن باشلىنىدۇ. AP wireless device بىلەن چوڭراق network ئارىسىدا bridge رولىنى ئوينايدۇ.\n\nConnection كۆپىنچە:\n- 2.4 GHz\n- 5 GHz\n- 6 GHz\nband لاردا قۇرۇلىدۇ.\n\nھەر band نىڭ range، speed ۋە interference خۇسۇسىيىتى پەرقلىق بولغاچقا Wi-Fi performance environment غا قاراپ ئۆزگىرىدۇ.\n\n### IEEE ۋە 802.11\n\nWi-Fi 1997-يىلدىن باشلاپ IEEE standard لار ئارقىلىق تەرەققىي قىلدى.\n\n**IEEE — Institute of Electrical and Electronics Engineers** networking ۋە telecommunications نى ئۆز ئىچىگە ئالغان نۇرغۇن ساھە ئۈچۈن technical standard تۈزۈدىغان كەسپىي organization.\n\nIEEE نىڭ **802 family** سى Local Area Networking (LAN) غا مەركەزلىشىدۇ.\n\nWireless networking قا مۇناسىۋەتلىك subset — **802.11**.\n\n802.11 standard لار:\n- Wi-Fi قانداق ئىشلەيدۇ،\n- device لار قانداق wireless communication قىلىدۇ،\n- WLAN قانداق ئىشلەيدۇ\nدېگەننى بەلگىلەيدۇ.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## 802.11 Wi-Fi Standards\n\n### Original 802.11 — 1997\n\n1997-يىلى تۇنجى IEEE 802.11 standard چىقتى. Speed ۋە capability چەكلىك بولسىمۇ، physical cable سىز device communication نىڭ ئاساسىنى قۇردى ۋە Wi-Fi نىڭ باشلىنىشى بولدى.\n\n### 802.11a — 1999\n\n- Frequency: **5 GHz**\n- Maximum theoretical data rate: **54 Mbps**\n- Performance ياخشى، ئەمما شۇ دەۋردە range قىسقىراق ۋە cost يۇقىرى بولغاچقا كەڭ تارقالمىغان.\n\n### 802.11b — 1999\n\n- Frequency: **2.4 GHz**\n- Maximum throughput: **11 Mbps**\n- Range ياخشىراق\n- Wall penetration ياخشىراق\n- Interference غا سەزگۈررەك\n- Cost تۆۋەن بولغاچقا Wi-Fi نىڭ كەڭ تارقىلىشىغا زور تەسىر قىلغان.\n\n### 802.11g — 2003\n\n- Frequency: **2.4 GHz**\n- Maximum throughput: **54 Mbps**\n- 802.11a نىڭ speed ىغا يېقىن، 2.4 GHz نىڭ ئۇزۇن range ئەۋزەللىكىنى ساقلىغان.\n- ئۇزۇن يىللار كەڭ ئىشلىتىلگەن.\n\n### 802.11n — 2009\n\n- Frequency: **2.4 GHz ۋە 5 GHz**\n- Theoretical maximum: **600 Mbps**\n- مۇھىم يېڭىلىق: **MIMO — Multiple Input Multiple Output**\n\nMIMO بىر نەچچە antenna نى ئىشلىتىپ data نى بىر ۋاقىتتا transmit ۋە receive قىلىدۇ. بىر stream نىڭ ئورنىغا بىر نەچچە parallel data stream ئىشلىتىلىدۇ.\n\nبۇ:\n- efficiency نى ياخشىلايدۇ،\n- performance نى ئاشۇرىدۇ،\n- multiple connected device مۇھىتىدا reliability نى ياخشىلايدۇ.\n\nSource تا 802.11n نىڭ 4 گىچە MIMO stream نى قوللىيالايدىغانلىقى بايان قىلىنغان.\n\n### 802.11ac — Wi-Fi 5 — 2013\n\n- Frequency: **5 GHz only**\n- Wider channel ۋە enhanced MIMO\n- **MU-MIMO — Multi-User MIMO** نى تونۇشتۇردى\n- Ideal theoretical throughput: **6.9 Gbps** غىچە\n\nTraditional MIMO AP نىڭ بىر ۋاقىتتا بىر device بىلەن كۆپ antenna ئىشلىتىپ ئۈنۈملۈك communication قىلىشىغا ياردەم بېرىدۇ.\n\nMU-MIMO بولسا AP نىڭ بىر ۋاقىتتا **بىر نەچچە device** قا data يوللىشىغا يول قويىدۇ.\n\nبۇ:\n- waiting time نى ئازايتىدۇ،\n- overall network efficiency نى ياخشىلايدۇ،\n- device كۆپ ۋە bandwidth ئۈچۈن رىقابەت كۆپ بولغان مۇھىتقا پايدىلىق.\n\n### 802.11ax — Wi-Fi 6 — 2019\n\n- Frequency: **2.4 GHz ۋە 5 GHz**\n- Theoretical speed: **9.6 Gbps** غىچە\n- ئاساسلىق مەقسىتى پەقەت speed نى ئاشۇرۇش ئەمەس، crowded environment تا efficiency، capacity ۋە multiple-device performance نى ياخشىلاش.\n\n### Wi-Fi 6E\n\nWi-Fi 6 نى **6 GHz band** قا كېڭەيتىدۇ.\n\nئەۋزەللىكى:\n- additional bandwidth\n- congestion ناھايىتى ئاز\n- high-performance wireless environment قا ماس\n\n802.11 standard لارنىڭ تەرەققىياتى Wi-Fi نىڭ speed، efficiency ۋە capacity غا بولغان كۈنسېرى ئېشىۋاتقان ئېھتىياجنى قانداق قاندۇرغانلىقىنى كۆرسىتىدۇ.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## Bluetooth\n\nBluetooth قىسقا ئارىلىقتا device لار ئارىسىدا data exchange قىلىدىغان wireless technology.\n\nSmartphone، computer، headphone، speaker، keyboard ۋە car audio system قاتارلىق device لارنى cable سىز ئۇلاشقا ئىشلىتىلىدۇ.\n\nBluetooth Wi-Fi غا ئوخشاش **2.4 GHz** frequency range دا radio wave ئىشلىتىدۇ، ئەمما Wi-Fi غا ئوخشىماي:\n- short range\n- low power communication\nغا optimized قىلىنغان، high-speed data transfer ئاساسلىق مەقسىتى ئەمەس.\n\n### Bluetooth نىڭ تەرەققىياتى\n\n**Bluetooth 1.2**\n- interference avoidance ياخشىلاندى\n- باشقا wireless technology بىلەن coexist قىلىش ئاسانلاشتى\n\n**Bluetooth 2.0**\n- data speed **3 Mbps** غىچە\n\n**Bluetooth 2.1**\n- pairing process ئاددىيلاشتى\n\n**Bluetooth 3.0**\n- چوڭ data transfer جەريانىدا Wi-Fi connection نى negotiate قىلالايدۇ\n- specific use case تا **24 Mbps** غىچە\n\n**Bluetooth 4.0**\n- مۇھىم يېڭىلىق: **BLE — Bluetooth Low Energy**\n- fitness tracker، smart sensor ۋە IoT device قاتارلىق بەك تۆۋەن power تەلەپ قىلىدىغان ئۈسكۈنىلەر ئۈچۈن\n\n**Bluetooth 5.0**\n- speed، reliability، range ياخشىلاندى\n- low power usage ساقلانغان\n- ideal condition تا بەزى device لاردا 100 m غىچە communication\n\n**Bluetooth 6.0**\n- efficiency، responsiveness ۋە device awareness تېخىمۇ ياخشىلانغان\n- smart device، wearable ۋە proximity-based application ئۈچۈن advanced interaction نى قوللايدۇ\n\nCompTIA ئۈچۈن ھەر بىر version نىڭ ئېنىق performance number ىنى يادلاشتىن كۆرە Bluetooth نىڭ داۋاملىق تەرەققىي قىلىۋاتقان short-range، low-power wireless technology ئىكەنلىكىنى چۈشىنىش مۇھىم.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## NFC — Near Field Communication\n\nNFC 2003-يىلى چىققان wireless networking interface standard.\n\nRadio frequency ئىشلىتىپ ئىككى device ناھايىتى يېقىن—ئادەتتە بىر نەچچە سانتىمېتىر—بولغاندا data share قىلىدۇ.\n\n- **Frequency: 13.56 MHz**\n- **Data rate: 424 Kbps غىچە**\n\nWi-Fi ياكى Bluetooth غا قارىغاندا speed ئاستا، ئەمما NFC لايىھەلەنگەن use case لارغا يېتەرلىك:\n- digital access key\n- mobile payment\n\n### Building Access\n\nNFC-enabled smartphone ياكى security badge نى reader غا تەگكۈزۈپ secure area غا كىرىشكە بولىدۇ.\n\nOffice ۋە hotel دا security + convenience سەۋەبىدىن كۆپ ئىشلىتىلىدۇ.\n\nShort range بولغاچقا traditional magnetic-stripe card غا قارىغاندا signal نى intercept ياكى duplicate قىلىش قىيىنراق.\n\n### Mobile Payment\n\nApple Pay، Google Wallet ۋە Samsung Pay قاتارلىق service لار NFC ئارقىلىق contactless payment قىلىدۇ.\n\nUser NFC-enabled phone ياكى smartwatch نى payment terminal غا يېقىنلاشتۇرۇپ purchase نى تاماملايدۇ.\n\nNFC **one-to-one، bidirectional communication** نى قوللايدۇ؛ ئىككى device بىر-بىرىگە data send ۋە receive قىلالايدۇ.\n\nTransaction دا بۇ:\n- payment information يەتكۈزۈش،\n- transaction detail نى confirm قىلىش،\n- receipt ئۇچۇرىنى ئالماشتۇرۇش\nقاتارلىق ئىشلارغا پايدىلىق.\n\nNFC built-in security protocol، encryption ۋە secure channel ئارقىلىق credit-card number ۋە personal identification data قاتارلىق sensitive information نى قوغداشقا ياردەم بېرىدۇ.\n\nExam Objective 2.2\nسىمسىز تور تېخنىكىلىرىنى چۈشەندۈرۈڭ.\n\n## RFID — Radio Frequency Identification\n\nRFID wireless device-interface technology بولۇپ، RFID-enabled peripheral بىلەن communication ۋە interaction قىلىشقا ئىشلىتىلىدۇ.\n\nئۇ:\n- wireless identification\n- tracking\n- data exchange\nنى قوللاپ، automation ۋە efficiency نى ياخشىلاشقا ئىشلىتىلىدۇ.\n\n### RFID قانداق ئىشلەيدۇ؟\n\nRFID reader tag نى scan قىلىدۇ، tag ئۆزىگە programmed قىلىنغان information بىلەن response قايتۇرىدۇ.\n\nRFID system ئىككى خىل:\n\n**Passive RFID**\n- Tag نىڭ ئۆزىدە battery يوق.\n- Reader دىن كەلگەن energy/inductance ئارقىلىق power ئېلىپ stored information نى يوللايدۇ.\n- Cost-effective\n- short-range application غا ماس\n\n**Active RFID**\n- Tag battery-powered.\n- Reader غا ئاكتىپ signal يوللايدۇ.\n- Range ئۇزۇنراق\n- continuous / real-time tracking نى قوللايدۇ\n- asset management قاتارلىق ئىشلارغا ماس\n\n### Use Cases\n\n**Inventory control & tracking:**\nItem غا RFID tag چاپلاپ، RFID reader ئارقىلىق inventory management نى automation قىلىش، supply chain نى ئاسانلاشتۇرۇش ۋە stock level، location، movement history نى real-time كۆرۈش.\n\n**Physical access control:**\nRFID card ياكى key fob نى reader غا كۆرسىتىپ secure area غا authorized access ئېلىش. بۇ restricted area غا پەقەت ھوقۇق بېرىلگەن personnel كىرىشىگە ياردەم بېرىدۇ."}, {"id": "2.3", "number": "2.3", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.3, summarize services provided by networked hosts. Server roles. This might be a bit of a review for some of you, but I'm going to start this video with a quick definition of what a server is.\n\nIn a logical sense, a server is a computing device that provides a service to other computing devices, known as clients. A single server can perform one role or many roles within a network, and that is exactly what we are focusing on in this video segment. First, let's talk about DNS servers or domain name system servers.\n\nThink of DNS as the internet's phone book. When you type a website name like www.certificationsynergy.com into your browser, you are using a fully qualified domain name, often abbreviated as FQDN. DNS servers translate that human-friendly name into an IP address, which is the numerical address computers use to locate resources on a network.\n\nWithout DNS, users would have to remember IP addresses instead of simple names, which would make everyday internet use extremely impractical. Next, we have DHCP servers, which stands for Dynamic Host Configuration Protocol. DHCP servers automatically assign IP addresses to devices when they connect to a network.\n\nIn addition to an IP address, a DHCP server typically provides other essential network settings, such as the subnet mask, default gateway, and DNS server information. This automatic configuration process allows devices to connect and communicate without requiring manual network setup. File servers provide a centralized location where users can store, access, and share files across the network.\n\nThis makes collaboration easier and helps organizations manage data more efficiently by keeping files in a single, controlled location. Print servers manage printing resources on a network. They receive print jobs from users and forward them to the appropriate printer.\n\nThis centralizes printer management and prevents each device from needing a direct connection to every printer. Mail servers are responsible for sending, receiving, and storing email messages. When you send an email, it is processed by a mail server before being delivered to the recipient.\n\nMail servers also store messages so users can access their email from multiple devices. Syslog servers are used for logging and monitoring. They collect log files and system messages from network devices, servers, and applications.\n\nThese logs are critical for troubleshooting issues, monitoring performance, and identifying security events. Web servers host websites and deliver web content to users' browsers. When you visit a website, your browser sends a request to a web server, which responds by sending back the website's data so it can be displayed on your screen.\n\nNext, we have servers that handle authentication, authorization, and accounting, commonly referred to as AAA servers. These servers verify who a user is, determines what they are allowed to access, and keeps records of their activity. AAA servers play a critical role in network security by ensuring only approved users and devices can access network resources.\n\nTwo common implementations of AAA services are RADIUS and TACACS+, which are often used to control access to networks and network devices. Now let's look at database servers, which are a new addition to the exam objectives. Database servers store, organize, and manage large amounts of structured data.\n\nApplications rely on database servers to quickly retrieve, update, and store information such as user accounts, transaction records, or inventory data. While users rarely interact with database servers directly, many web applications and services depend on them behind the scenes. Lastly, we have network time protocol servers, often abbreviated as NTP.\n\nNTP servers ensure that devices on a network have accurate and synchronized time. This is critical for logging, security events, authentication processes, and troubleshooting, since mismatched timestamps can make it difficult to track activity or correlate events accurately. Exam objective 2.3, summarize services provided by network hosts.\n\nInternet appliances. Internet appliances are specialized devices focused on specific internet related functions. Their dedicated nature contrasts with general purpose computers, offering more efficiency in handling particular tasks.\n\nOne critical type of internet appliance is the spam gateway. This tool plays a vital role in filtering out unsolicited emails or spam, which not only clutters your inbox, but also poses significant security threats. To maintain their effectiveness, spam gateways use a range of techniques such as blacklisting, whitelisting, and content analysis.\n\nBy regularly updating the rules and keyword filters on these internet appliances, you ensure the spam gateway can adapt to the ever evolving nature of spam emails, which frequently change their content and tactics. This adaptability is key in safeguarding users from malicious emails. By continuously updating the keywords and rules for filtering, spam gateways provide a dynamic and robust defense against the influx of spam, making them an indispensable tool in email security management.\n\nAnother pivotal appliance is the unified threat management or UTM device. UTM devices offer a multifaceted security solution by combining several protective measures into a single platform. These measures include firewall protection, antivirus programs, anti-spam tools, intrusion detection, intrusion prevention, VPNs, content filtering, and more.\n\nUTMs are especially beneficial for small and medium-sized businesses, providing a cost-effective, streamlined approach to comprehensive network security, an all-in-one security device, if you will. Now we will turn our attention to load balancers. These devices distribute network or application traffic across several servers, preventing any single server from becoming overloaded.\n\nThis distribution ensures smoother, more reliable network service access by ensuring each server is utilized efficiently. Lastly, we have proxy servers. A standard internet connection provides direct access between a local network and resources across the internet.\n\nSo where does a proxy server fit in? A proxy server interrupts the standard connection in order to establish a monitored connection. That is why we can refer to it as a middleman.\n\nThe proxy server can then intercept network traffic, allowing only approved traffic to pass through. Conversely, the proxy server will deny network traffic that violates any security rules. Additionally, if you find something is being blocked that shouldn't be, no problem.\n\nJust configure a traffic exemption. Exam objective 2.3, summarize services provided by network hosts. Legacy and embedded systems.\n\nLet's begin this video segment by defining what a legacy system is. In the realm of IT, a legacy system refers to outdated computer systems, software, or technology that is still in use, despite newer versions being available. These systems are often critical to an organization's daily operations, making upgrading or replacing them a complex, risky, or costly endeavor.\n\nThey may lack support, updates, or compatibility with newer technologies, which can pose challenges in terms of security and efficiency. However, their continued use is usually due to the system's pivotal role in specific business processes or the high cost and effort required for an upgrade. Now let's shift our focus to embedded systems.\n\nAn embedded system is a specialized computing system that performs dedicated functions. Unlike a general purpose computer, an embedded system performs specific tasks and is designed with a very specific set of requirements. These systems are ubiquitous in everyday life, found in devices like microwaves, traffic lights, and thermostats.\n\nThey are known for being highly reliable, efficient, and optimized for their particular application, often running for years without the need for intervention. Finally, to keep in step with the CompTIA A, plus core one exam objectives, let's discuss how these concepts apply to SCADA systems. SCADA, or Supervisory Control and Data Acquisition systems, are designed to monitor and control industrial environments.\n\nThese systems often rely on a combination of legacy and embedded systems. Legacy systems are common in SCADA environments due to the longevity and stability required in critical infrastructures like power plants or water treatment facilities. Embedded systems, on the other hand, are used within SCADA for specific control tasks, like regulating the pressure in pipelines or maintaining temperatures in industrial processes.\n\nTheir reliability and efficiency make embedded systems ideal for these critical control functions. Exam objective 2.3, Summarize services provided by networked hosts. IoT devices.\n\nIn previous video segments, we discussed common networked devices, such as servers, workstations, smartphones, and tablets. But what about all the other devices that have processing power and network connectivity built into them? These devices fall into a broad category known as Internet of Things, often abbreviated as IoT.\n\nFrom the viewpoint of information technology, IoT specifically refers to physical devices, objects, and sensors that are connected to a network and are capable of collecting, exchanging, and transmitting data. These devices are typically built with sensors, an embedded operating system, and network connectivity that allows them to communicate with other devices, services, or users. Back in our Tech+ course, IoT was introduced as a foundational concept.\n\nHere, we are focusing on how IoT devices function as networked hosts within modern environments. IoT devices are designed to interact with both people and other systems. This interaction allows for data collection, automation, remote monitoring, and remote control.\n\nFrom a networking perspective, each IoT device is another endpoint on the network, often communicating with cloud services or centralized controllers to perform its function. In home environments, IoT devices commonly include smart appliances, home automation systems, doorbells, thermostats, security cameras, and streaming media devices. These devices connect to the network to provide convenience, automation, and remote access, often through mobile applications or web interfaces.\n\nIoT devices are also widely used in vehicles, where connected systems provide features such as navigation, diagnostics, maintenance alerts, and remote access capabilities. In healthcare, IoT-enabled medical devices allow for continuous monitoring and data sharing, supporting improved patient care and faster response times. Other common examples include fitness equipment and wearable devices like smartwatches and fitness trackers.\n\nFor the exam, it's important to recognize IoT devices as network-connected endpoints that extend networking beyond traditional computers. While they offer convenience and powerful capabilities, they also introduce additional considerations related to connectivity, management, and security. IoT devices are everywhere, and understanding their role as networked hosts is a key part of modern networking environments.", "uyghur": "Exam Objective 2.3\nNetwork host لار تەمىنلەيدىغان service لارنى خۇلاسىلەڭ.\n\n## Server Roles\n\nلوگىكىلىق مەنىدە **server** — باشقا computing device، يەنى **client** لارغا service تەمىنلەيدىغان computing device.\n\nبىر server network ئىچىدە بىرلا role ياكى بىر نەچچە role نى بىرلا ۋاقىتتا ئورۇندىيالايدۇ.\n\n### DNS Server\n\nDNS server human-friendly domain name نى IP address قا translate قىلىدۇ.\n\nمەسىلەن، `www.certificationsynergy.com` — بۇ **FQDN (Fully Qualified Domain Name)**.\n\nDNS ئۇنى computer network resource نى تېپىش ئۈچۈن ئىشلىتىدىغان numerical IP address قا ئايلاندۇرىدۇ.\n\nDNS بولمىسا user لار website name نىڭ ئورنىغا IP address يادلىشى كېرەك بولاتتى.\n\n### DHCP Server\n\nDHCP server device network قا ئۇلانغاندا IP address نى ئاپتوماتىك تەقسىملەيدۇ.\n\nئۇ ئادەتتە تۆۋەندىكى setting لارنىمۇ بېرىدۇ:\n- subnet mask\n- default gateway\n- DNS server information\n\nبۇ automatic configuration manual network setup نى بىكار قىلىپ، device نىڭ تېز communication قىلىشىغا يول قويىدۇ.\n\n### File Server\n\nFile server user لارغا file نى مەركىزىي بىر جايدا:\n- store\n- access\n- share\nقىلىشقا يول قويىدۇ.\n\nCollaboration نى ئاسانلاشتۇرىدۇ ۋە data نى controlled location دا باشقۇرۇشقا ياردەم بېرىدۇ.\n\n### Print Server\n\nPrint server network printer resource نى باشقۇرىدۇ.\n\nUser دىن print job نى قوبۇل قىلىپ، توغرا printer غا forward قىلىدۇ. شۇڭا ھەر بىر device نىڭ ھەر printer غا بىۋاسىتە connection قىلىشىنىڭ ھاجىتى يوق.\n\n### Mail Server\n\nMail server email message نى:\n- send\n- receive\n- store\nقىلىدۇ.\n\nEmail يوللىغاندا recipient قا يېتىشتىن بۇرۇن mail server تەرىپىدىن processing قىلىنىدۇ. Mail server message نى ساقلىغاچقا user بىر نەچچە device تىن email غا access قىلالايدۇ.\n\n### Syslog Server\n\nSyslog server logging ۋە monitoring ئۈچۈن.\n\nNetwork device، server ۋە application دىن:\n- log file\n- system message\nتوپلايدۇ.\n\nبۇ log لار:\n- troubleshooting\n- performance monitoring\n- security event identification\nئۈچۈن ئىنتايىن مۇھىم.\n\n### Web Server\n\nWeb server website نى host قىلىدۇ ۋە browser غا web content يەتكۈزىدۇ.\n\nWebsite قا كىرگەندە browser web server غا request يوللايدۇ، server website data سىنى قايتۇرۇپ، screen دا كۆرسىتىلىشىگە يول قويىدۇ.\n\n### AAA Server — Authentication, Authorization, Accounting\n\nAAA server:\n- **Authentication:** user كىم؟\n- **Authorization:** نېمىگە access قىلىشقا بولىدۇ؟\n- **Accounting:** user نېمە قىلدى؟ activity record ساقلاش\n\nNetwork resource غا پەقەت approved user/device access قىلىشىغا ياردەم بېرىدۇ.\n\nكۆپ ئۇچرايدىغان implementation:\n- **RADIUS**\n- **TACACS+**\n\nئۇلار network ۋە network device access نى control قىلىشتا كۆپ ئىشلىتىلىدۇ.\n\n### Database Server\n\nDatabase server چوڭ مىقداردىكى structured data نى:\n- store\n- organize\n- manage\nقىلىدۇ.\n\nApplication بۇ server ئارقىلىق user account، transaction record، inventory data قاتارلىق information نى تېز retrieve/update/store قىلىدۇ.\n\nUser database server بىلەن بىۋاسىتە interaction قىلماسلىقى مۇمكىن، ئەمما نۇرغۇن web application ۋە service ئارقا تەرەپتە database server غا تايىنىدۇ.\n\n### NTP Server — Network Time Protocol\n\nNTP server network device لارنىڭ ۋاقتىنى توغرا ۋە synchronized ھالەتتە ساقلايدۇ.\n\nبۇ:\n- logging\n- security event\n- authentication process\n- troubleshooting\nئۈچۈن ئىنتايىن مۇھىم، چۈنكى timestamp لار ماس كەلمىسە event لارنى توغرا correlate قىلىش قىيىن.\n\nExam Objective 2.3\nNetwork host لار تەمىنلەيدىغان service لارنى خۇلاسىلەڭ.\n\n## Internet Appliances\n\nInternet appliance — مەلۇم Internet-related function غا مەخسۇس لايىھەلەنگەن device. General-purpose computer غا قارىغاندا بىر specific task نى تېخىمۇ ئۈنۈملۈك بىر تەرەپ قىلىدۇ.\n\n### Spam Gateway\n\nSpam gateway unsolicited email / spam نى filter قىلىدۇ.\n\nSpam inbox نى قالايمىقانلاشتۇرۇپلا قالماي security threat مۇ بولالايدۇ.\n\nSpam gateway ئىشلىتىدىغان ئۇسۇللار:\n- blacklisting\n- whitelisting\n- content analysis\n- keyword filtering\n\nSpam attacker لار content ۋە tactic نى دائىم ئۆزگەرتكەچكە rule ۋە keyword filter نى دائىم update قىلىش كېرەك. شۇنداق قىلغاندا gateway malicious email غا ماسلىشىپ dynamic defense تەمىنلەيدۇ.\n\n### UTM — Unified Threat Management\n\nUTM بىر نەچچە security function نى بىر platform/device قا بىرلەشتۈرىدۇ، مەسىلەن:\n- firewall\n- antivirus\n- anti-spam\n- intrusion detection\n- intrusion prevention\n- VPN\n- content filtering\n\nSmall/medium business ئۈچۈن cost-effective ۋە streamlined all-in-one security solution بولالايدۇ.\n\n### Load Balancer\n\nLoad balancer network ياكى application traffic نى بىر نەچچە server غا تارقىتىدۇ.\n\nبۇ بىرلا server نىڭ overload بولۇشىنىڭ ئالدىنى ئېلىپ:\n- service نى تېخىمۇ smooth،\n- reliable،\n- resource utilization نى تېخىمۇ efficient\nقىلىدۇ.\n\n### Proxy Server\n\nئادەتتىكى Internet connection local network بىلەن Internet resource ئارىسىدا direct connection قۇرىدۇ.\n\nProxy server بۇ direct path نىڭ ئوتتۇرىسىغا كىرىپ **middleman** رولىنى ئوينايدۇ.\n\nئۇ network traffic نى intercept قىلىپ:\n- approved traffic نى ئۆتكۈزىدۇ،\n- security rule غا خىلاپ traffic نى deny قىلىدۇ.\n\nئەگەر توغرا traffic خاتا block قىلىنسا traffic exemption configure قىلىشقا بولىدۇ.\n\nExam Objective 2.3\nNetwork host لار تەمىنلەيدىغان service لارنى خۇلاسىلەڭ.\n\n## Legacy and Embedded Systems\n\n### Legacy System\n\nIT دا **legacy system** — يېڭى version ياكى technology بار بولسىمۇ يەنىلا ئىشلىتىلىۋاتقان كونا computer system، software ياكى technology.\n\nبۇ system لار organization نىڭ كۈندىلىك operation ىغا ناھايىتى مۇھىم بولۇشى مۇمكىن؛ شۇڭا upgrade ياكى replacement:\n- complex\n- risky\n- expensive\nبولۇشى مۇمكىن.\n\nLegacy system دا support، update ياكى newer technology compatibility كەم بولۇشى مۇمكىن؛ بۇ security ۋە efficiency challenge پەيدا قىلىدۇ.\n\nشۇنداق بولسىمۇ، ئۇلارنىڭ business process تا critical role ئوينىشى ياكى upgrade نىڭ cost/effort ى بەك يۇقىرى بولۇشى سەۋەبىدىن ئىشلىتىش داۋاملىشىدۇ.\n\n### Embedded System\n\n**Embedded system** — مەخسۇس بىر ياكى بىر نەچچە dedicated function نى ئورۇندايدىغان specialized computing system.\n\nGeneral-purpose computer غا ئوخشىمايدۇ؛ ناھايىتى ئېنىق requirement ۋە task ئۈچۈن لايىھەلەنگەن.\n\nكۈندىلىك تۇرمۇشتا ناھايىتى كۆپ ئۇچرايدۇ، مەسىلەن:\n- microwave\n- traffic light\n- thermostat\n\nEmbedded system ئادەتتە:\n- reliable\n- efficient\n- مەلۇم application ئۈچۈن optimized\nبولۇپ، بەزىدە ئادەم ئارىلىشىشىسىز يىللارچە ئىشلەيدۇ.\n\n### SCADA — Supervisory Control and Data Acquisition\n\nSCADA industrial environment نى monitor ۋە control قىلىدىغان system.\n\nSCADA مۇھىتىدا legacy ۋە embedded system لار بىرلىكتە ئىشلىتىلىشى مۇمكىن.\n\n**Legacy system** power plant ياكى water-treatment facility قاتارلىق critical infrastructure دا ئۇزۇن مۇددەتلىك stability تەلەپ قىلىنغاچقا كۆپ ئۇچرايدۇ.\n\n**Embedded system** بولسا specific control task ئۈچۈن ئىشلىتىلىدۇ، مەسىلەن:\n- pipeline pressure نى تەڭشەش\n- industrial process temperature نى ساقلاش\n\nئۇلارنىڭ reliability ۋە efficiency سى بۇ critical control function لارغا ماس كېلىدۇ.\n\nExam Objective 2.3\nNetwork host لار تەمىنلەيدىغان service لارنى خۇلاسىلەڭ.\n\n## IoT Devices — Internet of Things\n\nServer، workstation، smartphone ۋە tablet دىن باشقا، processing power ۋە network connectivity ئىچىگە قۇرۇلغان نۇرغۇن باشقا device بار. ئۇلارنىڭ كەڭ تۈرى **IoT — Internet of Things** دەپ ئاتىلىدۇ.\n\nIT نۇقتىسىدىن IoT — network قا ئۇلانغان ۋە data نى:\n- collect\n- exchange\n- transmit\nقىلالايدىغان physical device، object ۋە sensor لار.\n\nIoT device تا ئادەتتە:\n- sensor\n- embedded operating system\n- network connectivity\nبولۇپ، باشقا device، service ياكى user بىلەن communication قىلىدۇ.\n\nIoT device network host سۈپىتىدە:\n- data collection\n- automation\n- remote monitoring\n- remote control\nنى قوللايدۇ.\n\nNetworking نۇقتىسىدىن ھەر بىر IoT device network دىكى يەنە بىر endpoint بولۇپ، كۆپىنچە cloud service ياكى centralized controller بىلەن communication قىلىدۇ.\n\n### Home IoT مىساللىرى\n\n- smart appliance\n- home automation system\n- smart doorbell\n- thermostat\n- security camera\n- streaming-media device\n\nئۇلار mobile app ياكى web interface ئارقىلىق convenience، automation ۋە remote access تەمىنلەيدۇ.\n\n### Vehicle IoT\n\nConnected vehicle system لار:\n- navigation\n- diagnostics\n- maintenance alert\n- remote access\nقاتارلىق function لارنى تەمىنلەيدۇ.\n\n### Healthcare IoT\n\nIoT-enabled medical device:\n- continuous monitoring\n- data sharing\nئارقىلىق patient care ۋە response time نى ياخشىلاشقا ياردەم بېرىدۇ.\n\nباشقا مىساللار:\n- fitness equipment\n- smartwatch\n- fitness tracker\n\nCompTIA ئۈچۈن IoT نى traditional computer دىن سىرتقى، network قا ئۇلانغان endpoint دەپ تونۇش مۇھىم. ئۇ convenience ۋە كۈچلۈك capability بىلەن بىللە connectivity، management ۋە security توغرىسىدا قوشۇمچە consideration ئېلىپ كېلىدۇ."}, {"id": "2.4", "number": "2.4", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.4, explain common network configuration concepts. DNS, the Domain Name System, or DNS, is a networking service that translates domain names into IP addresses that computers use to communicate with each other. Think of DNS as a phone book, allowing us to use easy-to-remember domain names, such as www.certificationsenergy.com, instead of complex IP addresses.\n\nThese user-friendly names are known as fully qualified domain names, or FQDNs. The DNS server takes this FQDN and translates it into its corresponding IP address, directing your device to the precise location of the resource you wish to access. This conversion from FQDN to IP address is essential for navigating the internet, as it spares us from having to memorize the numerical addresses for every website we want to access.\n\nNow, how exactly does DNS convert a fully qualified domain name into an IP address? Let's break it down, starting with what makes up an FQDN. An FQDN is a complete address used to access a specific device, across the internet, like a web server.\n\nIt's composed of several parts, including an optional subdomain or subdomains, a domain name, and a top-level domain. For an example, let's take the URL https://www.example.com/info/aboutus.html and slice out a portion of it. The FQDN will include the www as the subdomain, example as the domain, and .com as the top-level domain.\n\nWhen you use this FQDN in an attempt to search for a device, it sends a request to a DNS recursive server. This recursive server, also known as a DNS resolver, is specifically designed to handle DNS queries. The DNS recursive server then starts the process of finding the IP address that matches the FQDN you're searching for.\n\nNow, let's dive into this lookup process, step-by-step, to understand how it translates an FQDN, like www.example.com, into a numeric IP address that leads you to your desired resource. When you start your lookup, it sends a request to a DNS recursive server, which begins the process of looking up the IP address associated with the domain name you entered. The first stop is a root name server.\n\nA root name server provides a referral to the appropriate top-level domain server. For our scenario, the .com TLD server. The DNS recursive server then reaches out to the TLD server, which then directs the DNS recursive server to the domain name server responsible for the specific domain.\n\nThe domain name server will then return the IP address associated with the domain to the DNS recursive server. The DNS recursive server will complete the lookup process by providing the requested IP address back to your browser. Now that we know how the DNS lookup process works, in the next video segment, we will probe deeper into the topic of DNS records and learn about the many different types of information or records that we can request.\n\nExam objective 2.4, explain common network configuration concepts. DNS records. In this video segment, we will be taking a closer look at domain name servers or name servers for short.\n\nFor IT professionals, understanding the operation and significance of DNS servers is fundamental. These servers not only facilitate the basic function of connecting users to web servers, email servers, or other online resources, but also play a key role in network security and efficiency. Name servers can be configured to block access to malicious sites, redirect traffic for load balancing, and even implement custom domain name rules within private networks.\n\nSo how did these name servers work? Well, simply put, they house a database of DNS records. A DNS record is a database entry on a domain name server that links a domain name to various types of information.\n\nThese records are stored in the server's database and play a critical role in controlling the behavior of internet traffic. They contain instructions on how to route requests for a domain, including IP addresses, mail server configurations, and other essential data. One of the most common types of DNS records is the A record, also known as an address record.\n\nAn A record maps a fully qualified domain name directly to its corresponding IPv4 address, which is the standard protocol for the majority of internet traffic. For example, when you enter a website URL into your browser, the DNS lookup process takes the FQDN and sets out to find the A record to resolve the domain name to its IPv4 address, guiding your request to the correct web server. Up next, we have Quad A records.\n\nThese records perform a function very similar to A records, but are used to map a fully qualified domain name directly to its corresponding IPv6 address, which is the newer internet protocol designed to eventually replace IPv4. Quad A records ensure that domains can be resolved and connected over the IPv6 infrastructure, future-proofing the internet's expansion. Moving on, we have the MX record or mail exchange record.\n\nThese records are vital for email functionality, directing where emails that are sent to your domain should be delivered. Each MX record maps an email domain to a FQDN of a mail server, and is accompanied by a priority setting. This priority setting allows for a primary, secondary, and further backup mail servers to ensure email delivery even if one server goes down.\n\nTXT records are versatile DNS records that contain text-based application specified values. They're often used for verifying domain ownership. Additionally, TXT records are crucial for implementing various security measures, which brings us to our next point.\n\nIn the context of spam management, three significant TXT records come into play, DKIM, SPF, and DMARC. DKIM, or Domain Keys Identified Mail, verifies the sender's domain and ensures that the emails have not been tampered with in transit. SPF, or Sender Policy Framework, specifies which mail servers are authorized to send emails on behalf of your domain, preventing email spoofing.\n\nLastly, DMARC, which stands for Domain-Based Message Authentication, Reporting, and Conformance, builds upon DKIM and SPF, providing instructions on how to handle emails that fail DKIM and SPF checks, thus enhancing email security and integrity. Exam Objective 2.4, Explain Common Network Configuration Concepts. DHCP.\n\nDynamic Host Configuration Protocol, or DHCP, is a networking service that automates the configuration of devices on an IP network. Essentially, DHCP allows network devices, like computers and printers, to automatically obtain IP addresses and other necessary network configurations. This makes it much easier to manage large networks, where assigning IP addresses manually would be impractical.\n\nTo simplify things, imagine every device connected to a network is like a house in a vast neighborhood. Just like every house needs a unique address to receive mail, every device needs a unique identifier, known as an IP address, to send and receive data on a network. Here's where DHCP steps in.\n\nIt acts like the neighborhood's post office, dynamically assigning IP addresses to devices as they join the network, ensuring each one has a unique address and can communicate efficiently. Now let's talk about how DHCP does its job. The secret to DHCP is DORA.\n\nNo, not that DORA. Okay, much better. This DORA stands for Discover, Offer, Request, and Acknowledge, and is a four-step process.\n\nHere is a quick breakdown. The process begins with discovery. Imagine a new device, like a laptop or a smartphone, connecting to a network for the first time.\n\nThis device doesn't yet have an IP address, so it broadcasts a discovery message across the network. This message is a digital shout-out, saying, \"I'm new here. Is there a DHCP server that can assign me an IP address?\" Upon hearing this call, a DHCP server on the network springs into action, entering the offer phase.\n\nThe server selects an available IP address from its pool of addresses and sends an offer message back to the device. This message essentially says, \"Hello, device. I am the DHCP server, and I propose this specific IP address for you to use.\" The device, upon receiving this offer, moves the process to the request phase.\n\nIt evaluates the proposed IP address, and finding it suitable, sends a request message back to the DHCP server. This message is the device's way of saying, \"I accept your offer of this IP address. May I use it?\" The final step in this dance is acknowledgement.\n\nThe DHCP server receives the device's request and seals the deal by sending an acknowledgement message back. This message confirms the IP address assignment, effectively saying, \"The IP address is yours to use. Welcome to the network.\" With this exchange, the device is now a fully functional member of the network, able to communicate with other devices using its newly assigned IP address.\n\nIf only all communications in real life were this cordial. With that said, it is also important to note that DHCP does more than just handle IP addresses. It also configures other essential settings for network communications, such as the subnet mask, which determines the network size, the default gateway for connecting to other networks, and information on how to find the network's preferred DNS server or servers in order to resolve domain names into IP addresses.\n\nAnother key concept in DHCP is the lease, which is the period of time for which an IP address is assigned to a device. Leases are temporary, allowing for efficient reuse of IP addresses in environments where devices frequently connect to and disconnect from the network. Next, we have the DHCP scope.\n\nThe scope is the predefined range of IP addresses that the DHCP server is authorized to assign to devices. It's essentially the pool of addresses that the server can draw from when assigning addresses to network devices. Then there are DHCP reservations.\n\nThis is a handy feature that allows network administrators to reserve specific IP addresses for certain devices, ensuring they always receive the same IP address each time they connect to the network. This is particularly useful for devices like printers or servers that need a consistent IP address for network users to access them easily. Finally, we have DHCP exclusions.\n\nExclusions are specific IP addresses or ranges within a DHCP scope that the DHCP server is instructed not to assign. These excluded addresses are often set aside for devices that use manually configured static IP addresses, such as routers, servers, or network appliances. By using exclusions, administrators prevent IP address conflicts and ensure that DHCP only assigns addresses that are truly available.\n\nSo did you get all of that? I hope so, because understanding DHCP and its components is necessary for anyone stepping into the IT field. It's a fundamental part of network management, ensuring devices can connect and communicate seamlessly in a dynamic network environment.\n\nExam objective 2.4, explain common network configuration concepts. VLAN. Let's start this video segment by thinking about how traffic moves across a network.\n\nImagine a network as a growing town where roads represent network cables and buildings represent computers and devices. In a small town, traffic flows freely. Everyone uses the same roads and vehicles move wherever they need to go without much congestion or restriction.\n\nThis kind of set works well when there are only a few devices and everything on the network is trusted. As the town grows, traffic increases and challenges begin to appear. Some types of traffic need priority.\n\nCertain areas require stronger security and not every device should be able to communicate with every other device. When all traffic shares the same space, performance can suffer and managing the network becomes more difficult. This is where VLAN, short for virtual local area network, comes into play.\n\nA VLAN is a technology that allows you to divide a single physical network into multiple separate logical networks. In this setup, each VLAN functions as its own isolated network. Devices within the same VLAN can communicate with each other as if they were connected to a dedicated network, even though they share the same physical infrastructure.\n\nThis logical separation helps improve security, reduces unnecessary traffic, and makes large networks easier to manage without adding extra physical hardware. Devices in different VLANs are kept separate unless communication between them is intentionally allowed. To tie this back to our city analogy, think of a VLAN as an advanced traffic management system in a busy city.\n\nCity planners can create dedicated lanes on existing roads, separating traffic based on purpose or priority. Emergency vehicles may use restricted lanes, while everyday traffic stays in general lanes. Everyone still uses the same roads, but traffic is organized in a way that keeps things running efficiently and securely.\n\nAs networks continue to grow in size and complexity, this type of logical separation becomes increasingly important. VLANs provide a practical way to organize devices, improve performance, and enhance security by segmenting traffic within a shared physical network. Recognizing what a VLAN is and why it exists is an important part of understanding modern network design.\n\nExam objective 2.4, explain common network configuration concepts. VPN. A VPN, short for virtual private network, is a technology that creates a secure encrypted connection between a device and a remote network.\n\nThis secure connection acts like a protected tunnel for data allowing information to travel safely across the internet without being exposed to unauthorized users. To visualize this, imagine the internet as a busy public highway where data is constantly moving in all directions. Normally, information traveling on this highway can potentially be seen or intercepted.\n\nA VPN creates a private tunnel within that highway, allowing only authorized traffic to pass through. When a device connects to a VPN, its data is encrypted before it leaves the system, making it unreadable to anyone who might intercept it along the way. VPNs are commonly used to create a secured communication channel between workstations in different locations.\n\nThis allows remote users to safely access internal network resources as if they were physically connected to the local network. Access to a VPN is typically protected using credentials, such as usernames, passwords, or other authentication methods, ensuring that only approved users can establish the connection. This makes VPNs especially valuable when working remotely or when connecting over public Wi-Fi networks, where security risks are higher.\n\nBy encrypting data and requiring authentication, a VPN helps protect sensitive information and maintain privacy during network communication. For the exam, it's important to recognize that a VPN does not replace the internet, but rather secures communication over it. VPNs extend private network access across public infrastructure, making them a key concept in modern networking and remote connectivity.", "uyghur": "Exam Objective 2.4\nكۆپ ئۇچرايدىغان network configuration concept لارنى چۈشەندۈرۈڭ.\n\n## DNS — Domain Name System\n\nDNS domain name نى computer لار communication ئۈچۈن ئىشلىتىدىغان IP address قا translate قىلىدىغان networking service.\n\nئۇنى «Internet تېلېفون دەپتىرى» دەپ قاراشقا بولىدۇ. User `www.example.com` غا ئوخشاش ئاسان ئەستە قالىدىغان نامنى ئىشلىتىدۇ؛ DNS ئۇنى numerical IP address قا ئايلاندۇرىدۇ.\n\nبۇ user-friendly complete domain name لار **FQDN — Fully Qualified Domain Name** دەپ ئاتىلىدۇ.\n\n### FQDN نىڭ قۇرۇلمىسى\n\nمىسال URL:\n`https://www.example.com/info/aboutus.html`\n\nبۇ يەردىكى FQDN:\n`www.example.com`\n\nئۇنىڭ بۆلەكلىرى:\n- `www` — subdomain\n- `example` — domain name\n- `.com` — Top-Level Domain (TLD)\n\n### DNS Lookup Process\n\nUser FQDN نى ئىشلەتكەندە request **DNS recursive server** ياكى **DNS resolver** غا بارىدۇ.\n\nResolver IP address نى تېپىش ئۈچۈن قەدەممۇ-قەدەم lookup قىلىدۇ:\n\n1. **DNS recursive server / resolver** query نى قوبۇل قىلىدۇ.\n2. **Root name server** غا سورايدۇ.\n3. Root server مۇۋاپىق **TLD server** غا referral بېرىدۇ. مەسىلەن `.com`.\n4. Resolver `.com` TLD server غا سورايدۇ.\n5. TLD server شۇ domain غا مەسئۇل **authoritative/domain name server** نى كۆرسىتىدۇ.\n6. Domain name server corresponding IP address نى resolver غا قايتۇرىدۇ.\n7. Resolver IP address نى browser غا قايتۇرىدۇ.\n8. Browser شۇ IP address ئارقىلىق لازىملىق resource/server غا ئۇلىنىدۇ.\n\nDNS بولمىسا ھەر website نىڭ numerical IP address ىنى يادلاشقا توغرا كېلەتتى.\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان network configuration concept لارنى چۈشەندۈرۈڭ.\n\n## DNS Records\n\nName server نىڭ database ىدا **DNS record** لار ساقلىنىدۇ.\n\nDNS record — domain name نى ھەر خىل information بىلەن باغلايدىغان database entry.\n\nئۇلار Internet traffic نىڭ قانداق ھەرىكەت قىلىدىغانلىقىغا مۇھىم تەسىر كۆرسىتىدۇ ۋە domain request نى قانداق route قىلىش توغرىسىدا instruction ساقلايدۇ، مەسىلەن:\n- IP address\n- mail-server configuration\n- باشقا مۇھىم data\n\nName server پەقەت website ياكى mail server غا user نى يەتكۈزۈش بىلەنلا قالماي، security ۋە efficiency ئۈچۈنمۇ ئىشلىتىلىدۇ. مەسىلەن:\n- malicious site نى block قىلىش\n- load balancing ئۈچۈن traffic redirect قىلىش\n- private network ئىچىدە custom domain-name rule ئىشلىتىش\n\n### A Record — Address Record\n\nA record FQDN نى corresponding **IPv4 address** قا بىۋاسىتە map قىلىدۇ.\n\nWebsite URL كىرگۈزگەندە DNS lookup FQDN غا ماس A record نى ئىزدەپ، domain name نى IPv4 address قا resolve قىلىدۇ ۋە request نى توغرا web server غا يەتكۈزىدۇ.\n\n### AAAA Record — Quad A\n\nAAAA record A record غا ئوخشاش، ئەمما FQDN نى **IPv6 address** قا map قىلىدۇ.\n\nIPv6 infrastructure ئارقىلىق domain resolution ۋە connection نى قوللايدۇ.\n\n### MX Record — Mail Exchange\n\nMX record domain غا كەلگەن email نىڭ قايسى mail server غا يەتكۈزۈلىدىغانلىقىنى بەلگىلەيدۇ.\n\nھەر MX record:\n- email domain نى mail server FQDN غا map قىلىدۇ\n- priority value بار\n\nPriority ئارقىلىق primary، secondary ۋە backup mail server بېكىتىلىپ، بىر server ئىشلىمىسە email delivery نىڭ داۋاملىشىشىغا ياردەم بېرىدۇ.\n\n### TXT Record\n\nTXT record text-based، application-specific value ساقلايدىغان flexible DNS record.\n\nكۆپ ئىشلىتىلىشى:\n- domain ownership verification\n- email/security configuration\n\nSpam/email security دا مۇھىم ئۈچ TXT-based mechanism:\n\n**DKIM — DomainKeys Identified Mail**\n- sender domain نى verify قىلىشقا ياردەم بېرىدۇ\n- email transit جەريانىدا ئۆزگەرتىلمىگەنلىكىنى تەكشۈرۈشكە ياردەم بېرىدۇ\n\n**SPF — Sender Policy Framework**\n- قايسى mail server لارنىڭ domain نامىدىن email يوللاشقا authorized ئىكەنلىكىنى بەلگىلەيدۇ\n- email spoofing نى ئازايتىشقا ياردەم بېرىدۇ\n\n**DMARC — Domain-based Message Authentication, Reporting and Conformance**\n- DKIM ۋە SPF ئۈستىگە قۇرۇلىدۇ\n- DKIM/SPF check دىن ئۆتەلمىگەن email نى قانداق بىر تەرەپ قىلىش توغرىسىدا policy/instruction بېرىدۇ\n- email security ۋە integrity نى كۈچەيتىدۇ\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان network configuration concept لارنى چۈشەندۈرۈڭ.\n\n## DHCP — Dynamic Host Configuration Protocol\n\nDHCP IP network تا device configuration نى automation قىلىدىغان networking service.\n\nComputer، printer قاتارلىق device network قا ئۇلانغاندا:\n- IP address\n- subnet mask\n- default gateway\n- DNS server information\nقاتارلىق setting لارنى ئاپتوماتىك ئېلىشىغا ياردەم بېرىدۇ.\n\nبۇنى چوڭ بىر مەھەللىگە ئوخشىتايلى: ھەر بىر ئۆيگە خەت يېتىشى ئۈچۈن address لازىم؛ network تا ھەر بىر device غا data send/receive قىلىش ئۈچۈن unique IP address لازىم. DHCP شۇ مەھەللىنىڭ post office سىغا ئوخشاش dynamically address تەقسىملەيدۇ.\n\n### DORA\n\nDHCP نىڭ 4 قەدەملىك process ى:\n\n1. **Discover** — IP address يوق يېڭى client network كە broadcast message يوللاپ DHCP server ئىزدەيدۇ.\n2. **Offer** — DHCP server address pool دىن available IP تاللاپ client قا offer قىلىدۇ.\n3. **Request** — Client تەكلىپنى قوبۇل قىلىپ request message قايتۇرىدۇ.\n4. **Acknowledge (ACK)** — Server assignment نى confirm قىلىدۇ.\n\nبۇندىن كېيىن client network نىڭ تولۇق member ى بولۇپ communication قىلالايدۇ.\n\n### Lease\n\n**DHCP lease** — IP address نىڭ device قا تەقسىملەنگەن ۋاقىت مۇددىتى.\n\nLease temporary بولغاچقا device لار دائىم connect/disconnect قىلىدىغان environment تا IP address نى ئۈنۈملۈك قايتا ئىشلىتىشكە بولىدۇ.\n\n### Scope\n\n**DHCP scope** — DHCP server تەقسىملەشكە رۇخسەت قىلىنغان predefined IP address range/pool.\n\n### Reservation\n\n**DHCP reservation** — مەلۇم device غا ھەر قېتىم network قا ئۇلانغاندا ئوخشاش IP address بېرىش ئۈچۈن شۇ address نى reserve قىلىش.\n\nPrinter ياكى server قاتارلىق consistent IP كېرەك بولغان device قا پايدىلىق.\n\n### Exclusion\n\n**DHCP exclusion** — scope ئىچىدىكى DHCP server ھەرگىز تەقسىملىمەيدىغان specific IP address ياكى range.\n\nبۇ address لار كۆپىنچە static IP بىلەن قولدا configure قىلىنغان:\n- router\n- server\n- network appliance\nقاتارلىق device لارغا ئايرىلىدۇ.\n\nExclusion IP conflict نىڭ ئالدىنى ئېلىپ، DHCP نىڭ پەقەت ھەقىقىي available address نى تەقسىملىشىگە ياردەم بېرىدۇ.\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان network configuration concept لارنى چۈشەندۈرۈڭ.\n\n## VLAN — Virtual Local Area Network\n\nVLAN بىر physical network نى بىر نەچچە ئايرىم **logical network** قا بۆلۈش technology سى.\n\nكىچىك network تا ھەممە device بىرلا traffic space نى share قىلسا ئاددىي بولىدۇ. ئەمما network چوڭايغاندا:\n- traffic كۆپىيىدۇ\n- بەزى traffic قا priority كېرەك\n- بەزى رايونغا كۈچلۈك security كېرەك\n- ھەر device ھەر device بىلەن communication قىلماسلىقى كېرەك\n\nVLAN بۇ مەسىلىلەرنى logical segmentation ئارقىلىق ھەل قىلىشقا ياردەم بېرىدۇ.\n\nھەر VLAN ئۆزىنىڭ isolated network ىدەك ئىشلەيدۇ. بىر VLAN ئىچىدىكى device لار بىر physical infrastructure نى share قىلسىمۇ، خۇددى dedicated network تا تۇرغاندەك بىر-بىرى بىلەن communication قىلىدۇ.\n\nئەۋزەللىكى:\n- security نى ياخشىلايدۇ\n- unnecessary traffic نى ئازايتىدۇ\n- large network management نى ئاسانلاشتۇرىدۇ\n- extra physical hardware قوشماي segmentation قىلىدۇ\n\nDifferent VLAN دىكى device لار communication نى ئالاھىدە allow قىلمىغۇچە بىر-بىرىدىن ئايرىلغان بولىدۇ.\n\nبۇنى شەھەردىكى dedicated traffic lane غا ئوخشىتىشقا بولىدۇ: ھەممە ماشىنا بىرلا road infrastructure نى ئىشلىتىدۇ، ئەمما purpose/priority بويىچە ئايرىم lane غا بۆلۈنىدۇ.\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان network configuration concept لارنى چۈشەندۈرۈڭ.\n\n## VPN — Virtual Private Network\n\nVPN device بىلەن remote network ئارىسىدا **secure encrypted connection** قۇرىدىغان technology.\n\nئۇ public Internet ئۈستىدە protected tunnel قۇرۇپ، data نىڭ unauthorized user تەرىپىدىن كۆرۈلۈشىنىڭ ئالدىنى ئېلىشقا ياردەم بېرىدۇ.\n\nInternet نى ئادەم كۆپ public highway دەپ قارىسىڭىز، VPN شۇ highway ئىچىدە private protected tunnel قۇرىدۇ.\n\nDevice VPN غا ئۇلانغاندا data system دىن چىقىشتىن بۇرۇن encrypt قىلىنىدۇ. يولدا intercept قىلىنغان تەقدىردىمۇ ئوقۇش قىيىن بولىدۇ.\n\nVPN كۆپىنچە:\n- remote worker نى company internal network قا ئۇلاش\n- ئوخشىمىغان location دىكى workstation لار ئارىسىدا secure channel قۇرۇش\n- public Wi-Fi دا sensitive data نى قوغداش\nئۈچۈن ئىشلىتىلىدۇ.\n\nVPN access ئادەتتە:\n- username/password\n- ياكى باشقا authentication method\nبىلەن قوغدىلىدۇ، شۇڭا پەقەت approved user connection قۇرالايدۇ.\n\nCompTIA ئۈچۈن مۇھىم: VPN Internet نىڭ ئورنىنى ئالمايدۇ؛ **Internet ئۈستىدىكى communication نى secure قىلىدۇ.**"}, {"id": "2.5", "number": "2.5", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.5, compare and contrast common networking hardware devices. Common networking hardware. This video segment is designed to give you a foundational understanding of key network devices and the knowledge essential for anyone aspiring to pass the CompTIA A+ Core 1 certification exam.\n\nTo kick things off, I will start with a rather antiquated or outdated device, the network hub. The hub is a basic networking device that connects multiple computers or other network devices together. And while this is no longer a part of the exam objectives for this new version of the 80+ Core 1 exam, it sure helps to know how things started back in the beginning.\n\nWhen a hub receives data from one device, it broadcasts that data to all the other connected devices. As a visual, you can imagine a hub as a speaker making a public broadcast announcement, thus sending the same message to everyone in a room. By sending the same data to all computers inside a network, without distinguishing which device the data is meant for, the hub is inherently less efficient and less secure compared to more advanced devices like network switches.\n\nDue to these limitations, hubs are mostly obsolete. At the heart of any modern local area network, you are likely to find a network switch, or maybe multiple switches if the network is large and complex. A switch is a network device that connects multiple devices within a local area network.\n\nIt acts similarly to a network hub, allowing devices like computers, printers, servers, or other end devices to communicate with each other by forwarding data packets on the same LAN, but with a few improvements. Think of a network switch as a traffic controller in a network. It receives data packets from one device and intelligently forwards them to the intended recipient, ensuring efficient and direct communication between devices within the network.\n\nNetwork switches commonly use ethernet cables or CAT cables to connect end devices to the ports on the network switch and communicate using the ethernet protocol. When a device wants to send data to a specific device within the LAN network, it encapsulates the data into a data packet. This data packet will contain the destination address, the sender's source address, and the actual data or payload being transmitted.\n\nThis encapsulated data packet is then given the name ethernet frame. The switch then receives the data packet and examines the destination address. It then uses this information to determine the best path or port to forward the packet to the intended device.\n\nThis direct forwarding allows for fast and efficient communication between devices. Network switches fall into two primary categories, unmanaged and managed switches. Unmanaged switches are the simpler option, providing basic connectivity without requiring any configuration.\n\nThese plug and play devices are especially suitable for small networks, such as those in small office or home office environments. Typically, they come with a limited number of ports, with configurations of four or eight ports being the most common. This simplicity makes unmanaged switches an ideal choice for straightforward networking needs.\n\nManaged switches, on the other hand, are designed for larger, more complex networks. While they can function like unmanaged switches out of the box, they offer a significant advantage in terms of configurability. Administrators have the ability to access and configure these switches, allowing for the implementation of advanced features, such as security protocols, network traffic control, and the segregation of different types of network traffic, like voice communications.\n\nThis feature is particularly important in networks where ensuring the quality and reliability of specific traffic, like voice traffic, is paramount. Managed switches are frequently used in corporate environments and typically come equipped with a higher number of ports, often including 24, 48, or more, to accommodate a larger scale of network devices. Now, let's talk about the access point, or AP.\n\nAn access point, also called a wireless access point, is a network device that allows wireless communications between devices in a network. It connects wifi-enabled devices, such as laptops or smartphones, to the network. Access points are used to provide wireless connectivity in homes, offices, and public spaces, enabling mobility and flexibility in network access.\n\nIt may be easier to think of a network access point as a wireless version of a switch. It acts as a bridge between devices and the network, creating a wireless connection for them to communicate with each other. But how does a wireless access point work with other wired networks?\n\nWell, it's quite simple. The wireless access point takes the data packets it receives from devices, such as smartphones, tablets, and laptops, and transmits it wirelessly to the network. Similarly, it receives data from the network and sends it wirelessly to the devices connected to it.\n\nThis two-way communication allows devices to access the network and share information with each other seamlessly. Now, you might be wondering how devices connect to a wireless access point. Well, it's as easy as connecting to a wifi network.\n\nWhen you turn on your device's wifi, it scans for available wireless networks, and when it detects a wireless access point, it prompts you to connect to it. Once connected, you can access the network's resources and communicate with other devices in the network, just like you would in a wired network. So if an access point sounds a lot like a switch, you are right.\n\nAn access point is just a wireless version of a switch that provides local device connectivity. By now, you may be realizing that computer networks are basically a digital highway, connecting devices together to facilitate communication and resource sharing. And just as highways have in
