 here. Is there a DHCP server that can assign me an IP address?\" Upon hearing this call, a DHCP server on the network springs into action, entering the offer phase.\n\nThe server selects an available IP address from its pool of addresses and sends an offer message back to the device. This message essentially says, \"Hello, device. I am the DHCP server, and I propose this specific IP address for you to use.\" The device, upon receiving this offer, moves the process to the request phase.\n\nIt evaluates the proposed IP address, and finding it suitable, sends a request message back to the DHCP server. This message is the device's way of saying, \"I accept your offer of this IP address. May I use it?\" The final step in this dance is acknowledgement.\n\nThe DHCP server receives the device's request and seals the deal by sending an acknowledgement message back. This message confirms the IP address assignment, effectively saying, \"The IP address is yours to use. Welcome to the network.\" With this exchange, the device is now a fully functional member of the network, able to communicate with other devices using its newly assigned IP address.\n\nIf only all communications in real life were this cordial. With that said, it is also important to note that DHCP does more than just handle IP addresses. It also configures other essential settings for network communications, such as the subnet mask, which determines the network size, the default gateway for connecting to other networks, and information on how to find the network's preferred DNS server or servers in order to resolve domain names into IP addresses.\n\nAnother key concept in DHCP is the lease, which is the period of time for which an IP address is assigned to a device. Leases are temporary, allowing for efficient reuse of IP addresses in environments where devices frequently connect to and disconnect from the network. Next, we have the DHCP scope.\n\nThe scope is the predefined range of IP addresses that the DHCP server is authorized to assign to devices. It's essentially the pool of addresses that the server can draw from when assigning addresses to network devices. Then there are DHCP reservations.\n\nThis is a handy feature that allows network administrators to reserve specific IP addresses for certain devices, ensuring they always receive the same IP address each time they connect to the network. This is particularly useful for devices like printers or servers that need a consistent IP address for network users to access them easily. Finally, we have DHCP exclusions.\n\nExclusions are specific IP addresses or ranges within a DHCP scope that the DHCP server is instructed not to assign. These excluded addresses are often set aside for devices that use manually configured static IP addresses, such as routers, servers, or network appliances. By using exclusions, administrators prevent IP address conflicts and ensure that DHCP only assigns addresses that are truly available.\n\nSo did you get all of that? I hope so, because understanding DHCP and its components is necessary for anyone stepping into the IT field. It's a fundamental part of network management, ensuring devices can connect and communicate seamlessly in a dynamic network environment.\n\nExam objective 2.4, explain common network configuration concepts. VLAN. Let's start this video segment by thinking about how traffic moves across a network.\n\nImagine a network as a growing town where roads represent network cables and buildings represent computers and devices. In a small town, traffic flows freely. Everyone uses the same roads and vehicles move wherever they need to go without much congestion or restriction.\n\nThis kind of set works well when there are only a few devices and everything on the network is trusted. As the town grows, traffic increases and challenges begin to appear. Some types of traffic need priority.\n\nCertain areas require stronger security and not every device should be able to communicate with every other device. When all traffic shares the same space, performance can suffer and managing the network becomes more difficult. This is where VLAN, short for virtual local area network, comes into play.\n\nA VLAN is a technology that allows you to divide a single physical network into multiple separate logical networks. In this setup, each VLAN functions as its own isolated network. Devices within the same VLAN can communicate with each other as if they were connected to a dedicated network, even though they share the same physical infrastructure.\n\nThis logical separation helps improve security, reduces unnecessary traffic, and makes large networks easier to manage without adding extra physical hardware. Devices in different VLANs are kept separate unless communication between them is intentionally allowed. To tie this back to our city analogy, think of a VLAN as an advanced traffic management system in a busy city.\n\nCity planners can create dedicated lanes on existing roads, separating traffic based on purpose or priority. Emergency vehicles may use restricted lanes, while everyday traffic stays in general lanes. Everyone still uses the same roads, but traffic is organized in a way that keeps things running efficiently and securely.\n\nAs networks continue to grow in size and complexity, this type of logical separation becomes increasingly important. VLANs provide a practical way to organize devices, improve performance, and enhance security by segmenting traffic within a shared physical network. Recognizing what a VLAN is and why it exists is an important part of understanding modern network design.\n\nExam objective 2.4, explain common network configuration concepts. VPN. A VPN, short for virtual private network, is a technology that creates a secure encrypted connection between a device and a remote network.\n\nThis secure connection acts like a protected tunnel for data allowing information to travel safely across the internet without being exposed to unauthorized users. To visualize this, imagine the internet as a busy public highway where data is constantly moving in all directions. Normally, information traveling on this highway can potentially be seen or intercepted.\n\nA VPN creates a private tunnel within that highway, allowing only authorized traffic to pass through. When a device connects to a VPN, its data is encrypted before it leaves the system, making it unreadable to anyone who might intercept it along the way. VPNs are commonly used to create a secured communication channel between workstations in different locations.\n\nThis allows remote users to safely access internal network resources as if they were physically connected to the local network. Access to a VPN is typically protected using credentials, such as usernames, passwords, or other authentication methods, ensuring that only approved users can establish the connection. This makes VPNs especially valuable when working remotely or when connecting over public Wi-Fi networks, where security risks are higher.\n\nBy encrypting data and requiring authentication, a VPN helps protect sensitive information and maintain privacy during network communication. For the exam, it's important to recognize that a VPN does not replace the internet, but rather secures communication over it. VPNs extend private network access across public infrastructure, making them a key concept in modern networking and remote connectivity.", "uyghur": "Exam Objective 2.4\nكۆپ ئۇچرايدىغان تور تەڭشەش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n## DNS — Domain Name System\n\n**DNS (Domain Name System)** — ئادەم ئاسان ئەستە ساقلايدىغان domain name نى كومپيۇتېرلار توردا ئالاقە قىلىشتا ئىشلىتىدىغان IP address قا ئايلاندۇرىدىغان تور مۇلازىمىتى.\n\nDNS نى «تېلېفون دەپتىرى» گە ئوخشىتىشقا بولىدۇ:\n- ئادەم website نامىنى ئەستە ساقلايدۇ\n- DNS شۇ نامغا ماس IP address نى تېپىپ بېرىدۇ\n\nمەنبەدە بۇ خىل ئادەمگە قولايلىق تولۇق domain name **FQDN — Fully Qualified Domain Name** دەپ ئاتىلىدۇ.\n\nمەسىلەن، بىر website URL دىن:\n\n`https://www.example.com/info/aboutus.html`\n\nFQDN قىسمىنى ئايرىساق:\n\n`www.example.com`\n\nبۇ يەردە:\n- `www` — subdomain\n- `example` — domain name\n- `.com` — top-level domain (TLD)\n\nFQDN بىر تور resource ى، مەسىلەن web server نىڭ تولۇق نام ئادرېسى سۈپىتىدە ئىشلىتىلىدۇ.\n\n### DNS Lookup — FQDN دىن IP Address قا\n\nئىشلەتكۈچى FQDN ئارقىلىق بىر resource نى ئىزدىگەندە، DNS lookup جەريانى باشلىنىدۇ.\n\nمەنبە بويىچە ئاددىي جەريان:\n\n1. **DNS recursive server / DNS resolver**\n   - ئىشلەتكۈچىنىڭ DNS query سىنى قوبۇل قىلىدۇ.\n   - FQDN غا ماس IP address نى تېپىش جەريانىنى باشلايدۇ.\n\n2. **Root name server**\n   - Resolver غا مۇۋاپىق top-level domain server غا بېرىش ئۈچۈن referral قايتۇرىدۇ.\n   - مەسىلەن `.com` ئۈچۈن `.com` TLD server.\n\n3. **TLD server**\n   - Resolver نى شۇ domain غا مەسئۇل domain name server غا يېتەكلەيدۇ.\n\n4. **Domain name server**\n   - Domain غا ماس IP address نى resolver غا قايتۇرىدۇ.\n\n5. **DNS recursive server**\n   - تېپىلغان IP address نى browser غا قايتۇرىدۇ.\n\nشۇنداق قىلىپ:\n\n**FQDN → DNS lookup → IP address → لازىملىق resource**\n\nجەريانى ئەمەلگە ئاشىدۇ.\n\nمەنبەنىڭ ئاساسىي نۇقتىسى: DNS بولمىسا، ئىشلەتكۈچىلەر ھەر بىر website ياكى network resource نىڭ رەقەملىك IP address ىنى ئەستە ساقلىشىغا توغرا كېلەتتى.\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان تور تەڭشەش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n## DNS خاتىرىلىرى (DNS Records)\n\nDNS name server لار پەقەت domain name نى IP address قا ئايلاندۇرۇپلا قالمايدۇ. مەنبە بويىچە ئۇلار:\n- web server\n- email server\n- باشقا online resource\nلارغا يەتكۈزۈشكە ياردەم بېرىدۇ ۋە تور بىخەتەرلىكى/ئۈنۈمدارلىقىدا رول ئوينىيالايدۇ.\n\nمەنبە name server نىڭ:\n- زىيانلىق site قا زىيارەتنى توسۇشى\n- load balancing ئۈچۈن traffic نى باشقا يەرگە يۆتكەشكە ياردەم بېرىشى\n- private network ئىچىدە custom domain-name rule ئىشلىتىشى\nمۇمكىنلىكىنى مىسال قىلىدۇ.\n\n### DNS Record دېگەن نېمە؟\n\n**DNS record** — domain name server نىڭ database ىدىكى بىر entry بولۇپ، domain name نى مەلۇم بىر ئۇچۇر بىلەن باغلايدۇ.\n\nDNS record لار domain غا كەلگەن request نىڭ قانداق بىر تەرەپ قىلىنىشىغا مۇناسىۋەتلىك ئۇچۇرلارنى ساقلايدۇ.\n\nمەنبە مىسال قىلىدىغان ئۇچۇرلار:\n- IP address\n- mail server configuration\n- باشقا زۆرۈر domain ئۇچۇرلىرى\n\n### A Record — Address Record\n\n**A record** FQDN نى ماس كېلىدىغان **IPv4 address** قا باغلايدۇ.\n\nمەسىلەن، browser غا website URL كىرگۈزۈلسە، DNS lookup شۇ FQDN ئۈچۈن A record نى تېپىپ، domain name نى IPv4 address قا resolve قىلىشقا ئىشلىتىشى مۇمكىن.\n\n**ئەستە تۇتۇڭ:**\n- **A = IPv4**\n\n### AAAA Record — “Quad A” Record\n\n**AAAA record** نىڭ رولى A record غا ئوخشايدۇ، ئەمما ئۇ FQDN نى **IPv6 address** قا باغلايدۇ.\n\nمەنبە IPv6 نى IPv4 نىڭ ئورنىنى ۋاقىتنىڭ ئۆتۈشى بىلەن ئېلىش ئۈچۈن لايىھەلەنگەن يېڭىراق Internet Protocol دەپ چۈشەندۈرىدۇ.\n\n**ئەستە تۇتۇڭ:**\n- **AAAA = IPv6**\n\n### MX Record — Mail Exchange Record\n\n**MX record** بىر domain غا كەلگەن email نىڭ قايسى mail server غا يەتكۈزۈلىدىغانلىقىنى بەلگىلەشكە ئىشلىتىلىدۇ.\n\nھەر بىر MX record:\n- email domain نى\n- mail server نىڭ FQDN ىغا\nباغلايدۇ.\n\nئۇنىڭغا **priority** قىممىتىمۇ قوشۇلىدۇ.\n\nمەنبە بۇ priority ئارقىلىق:\n- primary mail server\n- secondary mail server\n- backup mail server\nلارنى تەرتىپلەشكە بولىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nبىر mail server ئىشلىمىسە، باشقا backup server ئارقىلىق email delivery داۋاملىشىشىغا ياردەم بېرىدۇ.\n\n### TXT Record\n\n**TXT record** — application بەلگىلىگەن text-based value لارنى ساقلىيالايدىغان جانلىق DNS record تۈرى.\n\nمەنبە TXT record نىڭ:\n- domain ownership نى دەلىللەش\n- email security تەدبىرلىرىنى قوللاش\nقاتارلىق ئىشلاردا ئىشلىتىلىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nSpam/email security بىلەن مۇناسىۋەتلىك ئۈچ مۇھىم TXT-based mechanism مەنبەدە تىلغا ئېلىنىدۇ:\n- DKIM\n- SPF\n- DMARC\n\n### DKIM — Domain Keys Identified Mail\n\nمەنبە DKIM نى:\n- sender domain نى دەلىللەشكە\n- email يولدا ئۆزگەرتىلمىگەنلىكىنى تەكشۈرۈشكە\nياردەم بېرىدىغان email security mechanism دەپ چۈشەندۈرىدۇ.\n\n### SPF — Sender Policy Framework\n\nSPF قايسى mail server لارنىڭ مەلۇم domain نامىدىن email يوللاشقا رۇخسەت قىلىنغانلىقىنى بەلگىلەيدۇ.\n\nمەنبە بويىچە بۇ **email spoofing** نىڭ ئالدىنى ئېلىشقا ياردەم بېرىدۇ.\n\n### DMARC — Domain-Based Message Authentication, Reporting, and Conformance\n\nDMARC DKIM ۋە SPF ئۈستىگە قۇرۇلۇپ، DKIM ياكى SPF تەكشۈرۈشىدىن ئۆتەلمىگەن email لارغا قانداق مۇئامىلە قىلىش كېرەكلىكى توغرىسىدا كۆرسەتمە بېرىدۇ.\n\nمەنبە بۇنىڭ email security ۋە integrity نى كۈچەيتىشكە ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### DNS Records — تېز ئەستە ساقلاش\n\n| Record | مەنبەدىكى ئاساسىي مەقسەت |\n|---|---|\n| **A** | FQDN → IPv4 |\n| **AAAA** | FQDN → IPv6 |\n| **MX** | Email → mail server |\n| **TXT** | Text-based application/security values |\n| **DKIM** | Sender domain / message integrity نى تەكشۈرۈش |\n| **SPF** | قايسى mail server يوللاشقا رۇخسەتلىك ئىكەنلىكى |\n| **DMARC** | DKIM/SPF fail بولغان email غا قانداق مۇئامىلە قىلىش |\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان تور تەڭشەش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n## DHCP — Dynamic Host Configuration Protocol\n\n**DHCP** — IP تورىدىكى ئۈسكۈنىلەرنىڭ تور تەڭشەكلىرىنى ئاپتوماتىك بېرىدىغان تور مۇلازىمىتى.\n\nDHCP ئارقىلىق computer، printer ۋە باشقا network device:\n- IP address\n- subnet mask\n- default gateway\n- DNS server ئۇچۇرى\nقاتارلىق تەڭشەكلەرنى ئاپتوماتىك ئالالايدۇ.\n\nبۇ چوڭ تورلاردا network configuration نى قولدا بىرمۇ-بىر بېكىتىش ئېھتىياجىنى زور دەرىجىدە ئازايتىدۇ.\n\nمەنبە DHCP نى بىر مەھەللىنىڭ پوچتىخانىسىغا ئوخشىتىدۇ:\n- ھەر بىر ئۆيگە ئادرېس كېرەك\n- ھەر بىر network device قا IP address كېرەك\n- DHCP server بولسا ئۈسكۈنە تورغا قوشۇلغاندا ئۇنىڭغا ئىشلىتىشكە بولىدىغان ئادرېس بېرىدۇ\n\n### DORA — DHCP نىڭ تۆت باسقۇچى\n\nDHCP نىڭ ئاساسىي جەريانى:\n\n**DORA = Discover → Offer → Request → Acknowledge**\n\n#### 1. Discover\n\nيېڭى device تېخى IP address قا ئىگە ئەمەس.\n\nئۇ network قا **Discover message** تارقىتىپ:\n> «بۇ يەردە ماڭا IP address بېرىدىغان DHCP server بارمۇ؟»\n\nدېگەن مەنىدىكى تەلەپنى يوللايدۇ.\n\n#### 2. Offer\n\nDHCP server:\n- ئۆزىنىڭ address pool ىدىن ئىشلىتىشكە بولىدىغان IP address نى تاللايدۇ\n- device قا **Offer message** يوللايدۇ\n\nيەنى server بىر IP address نى تەكلىپ قىلىدۇ.\n\n#### 3. Request\n\nDevice شۇ تەكلىپنى قوبۇل قىلىپ:\n- **Request message** نى DHCP server غا قايتۇرىدۇ\n\nيەنى:\n> «بۇ IP address نى ئىشلىتىشنى قوبۇل قىلىمەن.»\n\nدېگەن مەنىنى بىلدۈرىدۇ.\n\n#### 4. Acknowledge\n\nDHCP server:\n- **Acknowledge message** يوللايدۇ\n- IP address تەقسىم قىلىنغانلىقىنى جەزملەشتۈرىدۇ\n\nشۇنىڭ بىلەن device توردا نورمال ئالاقە قىلالايدىغان ھالەتكە كېلىدۇ.\n\n### DHCP تەمىنلەيدىغان باشقا تەڭشەكلەر\n\nDHCP پەقەت IP address بېرىپلا قالمايدۇ.\n\nمەنبە تۆۋەندىكىلەرنىمۇ قاپلايدۇ:\n\n**Subnet Mask**\n- تورنىڭ قانچىلىك چوڭ ئىكەنلىكىنى / IP address نىڭ network قىسمىنى پەرقلەندۈرۈشكە مۇناسىۋەتلىك تەڭشەك\n\n**Default Gateway**\n- باشقا تورلارغا چىقىشقا ئىشلىتىلىدىغان gateway ئۇچۇرى\n\n**DNS Server Information**\n- domain name نى IP address قا resolve قىلىشتا قايسى DNS server نى ئىشلىتىش كېرەكلىكى\n\n### DHCP Lease\n\n**Lease** — بىر IP address نىڭ مەلۇم device قا تەقسىملەنگەن ۋاقىت مۇددىتى.\n\nDHCP ئارقىلىق بېرىلگەن IP address مەڭگۈلۈك بولۇشى شەرت ئەمەس.\n\nمەنبە lease نىڭ ۋاقىتلىق بولۇشى:\n- device لار دائىم تورغا كىرىپ-چىقىدىغان مۇھىتتا\n- IP address لارنى قايتا ئۈنۈملۈك ئىشلىتىشكە\nياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### DHCP Scope\n\n**DHCP scope** — DHCP server تەقسىملەشكە ھوقۇقلۇق بولغان IP address لارنىڭ ئالدىن بېكىتىلگەن دائىرىسى.\n\nيەنى server يېڭى device قا IP address بېرىشتە مۇشۇ **address pool** ئىچىدىن تاللايدۇ.\n\n### DHCP Reservation\n\n**DHCP reservation** — مەلۇم بىر device ئۈچۈن مەلۇم IP address نى ئالدىن ساقلاپ قويۇش.\n\nبۇ device ھەر قېتىم تورغا ئۇلانغاندا ئوخشاش IP address نى ئېلىشىغا ياردەم بېرىدۇ.\n\nمەنبە بۇنىڭ:\n- printer\n- server\nغا ئوخشاش مۇقىم IP address كېرەك بولغان ئۈسكۈنىلەر ئۈچۈن پايدىلىق ئىكەنلىكىنى چۈشەندۈرىدۇ.\n\n### DHCP Exclusion\n\n**DHCP exclusion** — DHCP scope ئىچىدىكى، ئەمما DHCP server غا «بۇ IP address ياكى بۇ range نى تەقسىم قىلما» دەپ بېكىتىلگەن ئادرېس.\n\nمەنبە بۇ excluded address لارنىڭ كۆپىنچە:\n- router\n- server\n- network appliance\nغا ئوخشاش قولدا static IP بېكىتىلگەن device لار ئۈچۈن ساقلىنىشى مۇمكىنلىكىنى بايان قىلىدۇ.\n\nExclusion ئىشلىتىش:\n- IP address conflict نىڭ ئالدىنى ئېلىش\n- DHCP نىڭ پەقەت ھەقىقەتەن available address لارنى تەقسىم قىلىشى\nغا ياردەم بېرىدۇ.\n\n### DHCP — ئەڭ مۇھىم پەرق\n\n| DHCP concept | مەنىسى |\n|---|---|\n| **DORA** | IP ئېلىشنىڭ 4 باسقۇچى |\n| **Lease** | IP قانچە ۋاقىت device قا بېرىلىدۇ |\n| **Scope** | DHCP تارقىتالايدىغان IP دائىرىسى |\n| **Reservation** | مەلۇم device قا ھەمىشە بىر IP بېرىش |\n| **Exclusion** | Scope ئىچىدە DHCP تارقاتمايدىغان IP |\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان تور تەڭشەش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n## VLAN — Virtual Local Area Network\n\nتور كىچىك بولغاندا بارلىق device لار بىر physical network ئىچىدە بىۋاسىتە ئالاقە قىلىشى ئاسان بولۇشى مۇمكىن.\n\nئەمما network چوڭايغانسېرى:\n- traffic كۆپىيىدۇ\n- بەزى traffic قا priority كېرەك بولىدۇ\n- بەزى device ياكى department نى ئايرىش كېرەك بولىدۇ\n- ھەر بىر device نىڭ باشقا ھەممە device بىلەن ئالاقە قىلىشى مۇۋاپىق بولماسلىقى مۇمكىن\n- performance ۋە management قىيىنلىشىشى مۇمكىن\n\nبۇ يەردە **VLAN — Virtual Local Area Network** ئىشلىتىلىدۇ.\n\n### VLAN دېگەن نېمە؟\n\nVLAN بىرلا **physical network** نى بىر نەچچە ئايرىم **logical network** قا بۆلۈش ئىمكانى بېرىدىغان تېخنىكا.\n\nھەر بىر VLAN:\n- ئۆزىگە خاس ئايرىم network كە ئوخشاش ئىشلەيدۇ\n- شۇ VLAN ئىچىدىكى device لارنىڭ بىر-بىرى بىلەن ئالاقە قىلىشىغا يول قويىدۇ\n- باشقا VLAN دىكى device لاردىن لوگىكىلىق ئايرىپ تۇرىدۇ\n\nبۇ device لار ئوخشاش physical infrastructure نى ھەمبەھىرلەۋاتقان بولسىمۇ، network logically segment قىلىنغان بولىدۇ.\n\n### VLAN نىڭ پايدىسى\n\nمەنبە VLAN نىڭ:\n- security نى ياخشىلاش\n- زۆرۈرسىز traffic نى ئازايتىش\n- چوڭ network نى باشقۇرۇشنى ئاسانلاشتۇرۇش\n- قوشۇمچە physical hardware قوشماي logical separation قۇرۇش\nقا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nئوخشىمىغان VLAN دىكى device لار:\n- default ھالەتتە ئايرىم تۇرىدۇ\n- ئۇلار ئارىسىدىكى communication پەقەت مەقسەتلىك رۇخسەت قىلىنغاندا بولىدۇ\n\nمەنبە VLAN نى چوڭ شەھەردىكى traffic management غا ئوخشىتىدۇ:\n- يول ئوخشاش\n- ئەمما مەخسۇس lane لار traffic نى مەقسەت ياكى priority بويىچە ئايرىيدۇ\n\nشۇنداقلا VLAN:\n> **بىر physical network ئىچىدىكى traffic نى logical segment لارغا ئايرىش**\n\nدەپ ئەستە ساقلاشقا بولىدۇ.\n\n### VLAN — ئىمتىھان ئۈچۈن\n\n**Physical network بىر دانە بولۇشى مۇمكىن، ئەمما VLAN ئارقىلىق بىر نەچچە logical network قۇرغىلى بولىدۇ.**\n\nبۇنىڭ مەقسىتى:\n- organization\n- performance\n- security\n\nنى ياخشىلاش.\n\nExam Objective 2.4\nكۆپ ئۇچرايدىغان تور تەڭشەش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n## VPN — Virtual Private Network\n\n**VPN (Virtual Private Network)** — بىر device بىلەن يىراقتىكى network ئارىسىدا بىخەتەر ۋە شىفىرلانغان connection قۇرىدىغان تېخنىكا.\n\nمەنبە VPN connection نى Internet ئارقىلىق ئۆتىدىغان **قوغدالغان tunnel** غا ئوخشىتىدۇ.\n\nئادەتتىكى Internet نى traffic كۆپ بولغان ئاممىۋى يول دەپ تەسەۋۋۇر قىلساق، VPN شۇ يول ئىچىدە private tunnel قۇرىدۇ.\n\n### VPN قانداق قوغدايدۇ؟\n\nDevice VPN غا ئۇلانغاندا، مەنبە بويىچە:\n- سانلىق مەلۇمات system دىن چىقىشتىن بۇرۇن شىفىرلىنىدۇ\n- يولدا traffic نى تۇتۇۋالغان كىشىگە data نى ئوقۇش قىيىن بولىدۇ\n- connection پەقەت authorized user غا رۇخسەت قىلىنىدۇ\n\nVPN access ئادەتتە:\n- username\n- password\n- باشقا authentication method\nلار بىلەن قوغدىلىدۇ.\n\n### Remote Access\n\nVPN نىڭ كۆپ ئۇچرايدىغان ئىشلىتىلىشى — ئوخشىمىغان جايدىكى workstation ياكى remote user نىڭ private internal network resource غا بىخەتەر زىيارەت قىلىشى.\n\nمەنبە بويىچە remote user VPN ئارقىلىق:\n- خۇددى local network قا physical ئۇلانغاندەك\n- ئىچكى network resource لارغا\nبىخەتەر زىيارەت قىلالايدۇ.\n\nبۇ:\n- remote work\n- public Wi‑Fi\nغا ئوخشاش بىخەتەرلىك خەۋپى يۇقىرى مۇھىتتا ئالاھىدە پايدىلىق.\n\n### VPN نىڭ ئىككى مۇھىم ئىدىيەسى\n\n**Encryption**\n- يوللىنىۋاتقان data نى قوغدايدۇ\n\n**Authentication**\n- پەقەت تەستىقلانغان user نىڭ VPN connection قۇرۇشىغا يول قويىدۇ\n\nمەنبە VPN نىڭ:\n- سەزگۈر ئۇچۇرنى قوغداش\n- network communication مەخپىيەتلىكىنى ساقلاش\nقا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### VPN نېمە ئەمەس؟\n\nمەنبە ئىمتىھان ئۈچۈن مۇھىم بىر پەرقنى ئالاھىدە تەكىتلەيدۇ:\n\n> **VPN Internet نىڭ ئورنىنى ئالمايدۇ.**\n\nVPN:\n- Internet/public infrastructure نى ئىشلىتىدۇ\n- شۇ infrastructure ئۈستىدىكى communication نى بىخەتەر قىلىدۇ\n- private network access نى public network ئارقىلىق كېڭەيتىدۇ\n\n### Objective 2.4 — قىسقا ئەستە ساقلاش\n\n- **DNS** = Name → IP\n- **A** = IPv4\n- **AAAA** = IPv6\n- **MX** = Mail server\n- **TXT / DKIM / SPF / DMARC** = Domain / email security-related records and values\n- **DHCP** = Network configuration نى ئاپتوماتىك بېرىش\n- **DORA** = Discover → Offer → Request → Acknowledge\n- **Lease** = ۋاقىت\n- **Scope** = address pool\n- **Reservation** = مەلۇم device غا مۇقىم DHCP IP\n- **Exclusion** = DHCP تارقاتمايدىغان IP\n- **VLAN** = بىر physical network → بىر نەچچە logical network\n- **VPN** = Public network ئۈستىدە encrypted private communication\n"}, {"id": "2.5", "number": "2.5", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.5, compare and contrast common networking hardware devices. Common networking hardware. This video segment is designed to give you a foundational understanding of key network devices and the knowledge essential for anyone aspiring to pass the CompTIA A+ Core 1 certification exam.\n\nTo kick things off, I will start with a rather antiquated or outdated device, the network hub. The hub is a basic networking device that connects multiple computers or other network devices together. And while this is no longer a part of the exam objectives for this new version of the 80+ Core 1 exam, it sure helps to know how things started back in the beginning.\n\nWhen a hub receives data from one device, it broadcasts that data to all the other connected devices. As a visual, you can imagine a hub as a speaker making a public broadcast announcement, thus sending the same message to everyone in a room. By sending the same data to all computers inside a network, without distinguishing which device the data is meant for, the hub is inherently less efficient and less secure compared to more advanced devices like network switches.\n\nDue to these limitations, hubs are mostly obsolete. At the heart of any modern local area network, you are likely to find a network switch, or maybe multiple switches if the network is large and complex. A switch is a network device that connects multiple devices within a local area network.\n\nIt acts similarly to a network hub, allowing devices like computers, printers, servers, or other end devices to communicate with each other by forwarding data packets on the same LAN, but with a few improvements. Think of a network switch as a traffic controller in a network. It receives data packets from one device and intelligently forwards them to the intended recipient, ensuring efficient and direct communication between devices within the network.\n\nNetwork switches commonly use ethernet cables or CAT cables to connect end devices to the ports on the network switch and communicate using the ethernet protocol. When a device wants to send data to a specific device within the LAN network, it encapsulates the data into a data packet. This data packet will contain the destination address, the sender's source address, and the actual data or payload being transmitted.\n\nThis encapsulated data packet is then given the name ethernet frame. The switch then receives the data packet and examines the destination address. It then uses this information to determine the best path or port to forward the packet to the intended device.\n\nThis direct forwarding allows for fast and efficient communication between devices. Network switches fall into two primary categories, unmanaged and managed switches. Unmanaged switches are the simpler option, providing basic connectivity without requiring any configuration.\n\nThese plug and play devices are especially suitable for small networks, such as those in small office or home office environments. Typically, they come with a limited number of ports, with configurations of four or eight ports being the most common. This simplicity makes unmanaged switches an ideal choice for straightforward networking needs.\n\nManaged switches, on the other hand, are designed for larger, more complex networks. While they can function like unmanaged switches out of the box, they offer a significant advantage in terms of configurability. Administrators have the ability to access and configure these switches, allowing for the implementation of advanced features, such as security protocols, network traffic control, and the segregation of different types of network traffic, like voice communications.\n\nThis feature is particularly important in networks where ensuring the quality and reliability of specific traffic, like voice traffic, is paramount. Managed switches are frequently used in corporate environments and typically come equipped with a higher number of ports, often including 24, 48, or more, to accommodate a larger scale of network devices. Now, let's talk about the access point, or AP.\n\nAn access point, also called a wireless access point, is a network device that allows wireless communications between devices in a network. It connects wifi-enabled devices, such as laptops or smartphones, to the network. Access points are used to provide wireless connectivity in homes, offices, and public spaces, enabling mobility and flexibility in network access.\n\nIt may be easier to think of a network access point as a wireless version of a switch. It acts as a bridge between devices and the network, creating a wireless connection for them to communicate with each other. But how does a wireless access point work with other wired networks?\n\nWell, it's quite simple. The wireless access point takes the data packets it receives from devices, such as smartphones, tablets, and laptops, and transmits it wirelessly to the network. Similarly, it receives data from the network and sends it wirelessly to the devices connected to it.\n\nThis two-way communication allows devices to access the network and share information with each other seamlessly. Now, you might be wondering how devices connect to a wireless access point. Well, it's as easy as connecting to a wifi network.\n\nWhen you turn on your device's wifi, it scans for available wireless networks, and when it detects a wireless access point, it prompts you to connect to it. Once connected, you can access the network's resources and communicate with other devices in the network, just like you would in a wired network. So if an access point sounds a lot like a switch, you are right.\n\nAn access point is just a wireless version of a switch that provides local device connectivity. By now, you may be realizing that computer networks are basically a digital highway, connecting devices together to facilitate communication and resource sharing. And just as highways have intersections and signs to guide traffic, networks have switches to direct data packets, but switches are not the only devices used to control traffic.\n\nWe also have network routers. A network router is a network device that directs data packets between different computer networks. Yes, this is similar to a switch, with the exception that a switch directs traffic within a local area network, and a router controls data packets entering or leaving a local area network.\n\nBut how does a network router actually work? Well, when a device wants to send data to another device in a different network, it compiles a data packet. These data packets will contain a source IP address and a destination IP address.\n\nIf the data packet has a destination IP address that is not located within the current network, the data packet will then seek out the router. The router examines the packet's destination address, much like reading a street address, and determines the most efficient path for the data to reach its intended destination. To sum up a router, a router is a gateway sitting at the edge of a network's broadcast domain, controlling inbound and outbound connectivity to other networks.\n\nThese could be other directly attached local area networks, or more commonly, they are installed between a local area network and a wide area network connection, like the one provided by an internet service provider or ISP. To close out this video segment, I have one more device to cover, the SOHO router. Having just covered the topics of network switch, access point, and router, I figured now would be a great time to discuss how these devices fit into a smaller setting of a home or a small business environment.\n\nThe type of networking equipment used in a home or a small business environment can be described as SOHO, where SOHO stands for small office, home office. This particular type of network will calmly utilize a multifunction network device referred to as a SOHO router, but don't let the name fool you. Though similar in some aspects, this is not like the enterprise grade router we studied earlier in this exam objective.\n\nA SOHO router can perform routing functions, but that is not all it can do. So let's break down the main components that make up a SOHO router. First up, we have the network switch.\n\nYou may recall that a network switch is a network device that connects multiple devices within a local area network. And yes, the SOHO router has a built-in network switch. It may not have as many ports as an enterprise switch, but it will still function the same.\n\nThe SOHO router displayed here can only connect four computing devices together in an ethernet LAN. The switch ports are the yellow RG45 ports located inside box number one. Next, we have the access point.\n\nAs a refresher, the access point is a network device that allows wireless communications between devices in a network. And yes, the SOHO router has a built-in access point too. It may not support as many wireless clients as an enterprise access point, but it will still function the same.\n\nThe SOHO router displayed here has an antenna in side box number two that can transmit and receive wifi signals. Lastly, let's talk about the router itself. The router is the gateway between your SOHO network and the internet or ISP.\n\nThat is where box number three comes in. This is your wide area network or WAN connection. Pretty cool how a SOHO router seamlessly integrates all these components into one compact device.\n\nIf you are dealing with a limited number of computing devices in your network, a SOHO router would be the perfect choice to provide network connectivity. Exam objective 2.5, compare and contrast common networking hardware devices. Patch panel.\n\nThis video segment will cover an unsung hero in the networking world, the patch panel. A patch panel is a device containing ports used to manage and organize cable connections. It is a central location in a building's network system where all the network cables converge.\n\nIt's typically a flat panel with numerous ports where network cables are plugged in. These panels provide a convenient and organized way of managing cable connections from different rooms or areas in a building in order to provide a connection to network devices like switches and routers. So how does a patch panel function?\n\nThink of it as a switchboard operator. When a network cable from a computer or another device is connected to the panel, it doesn't directly communicate with other devices. Instead, it connects to another port that leads to a network switch or router.\n\nThis setup allows for easy management of cable connections. If a device needs to be moved or connected to a different network segment, it's simply a matter of changing the patch cable connections at the panel rather than rerunning the entire cable. In the realm of networking, a patch panel is a key component in ensuring both organization and flexibility.\n\nCommonly found in server rooms or network closets, its primary role is to centralize all network cables from various endpoints into a single manageable location. This centralization simplifies many aspects of network management. Firstly, it streamlines the troubleshooting process.\n\nWith all cables leading to one point, identifying and resolving issues becomes much easier and quicker as there's no need to trace individual cables through complex and often inaccessible routes. Secondly, when it comes to network maintenance or reconfiguration, a patch panel is invaluable. Adjustments, whether adding new devices or changing network layouts, can be done efficiently at the panel without the need to disturb the entire cable setup.\n\nMoreover, a patch panel helps in protecting the network's physical integrity. By reducing the frequency of handling the actual network cables and devices, wear and tear are minimized. This leads to a more stable and durable network setup, enhancing overall network performance and longevity.\n\nExam objective 2.5, compare and contrast common networking hardware devices. Power over Ethernet. Power over Ethernet, or PoE, is a technology standard that allows network cables to simultaneously transmit data and power using a single network cable.\n\nIn simpler terms, PoE enables a single cable to provide both a data connection and electrical power to devices such as wireless access points, IP cameras, and voice over IP phones. This means that instead of needing two separate cables, one for power and one for data, PoE allows you to use just one Ethernet cable for both purposes. So how does PoE function?\n\nThere are two primary ways through a PoE switch or a PoE injector. A PoE switch is a network switch that has the ability to provide power over Ethernet to connected devices. When a compatible device is connected to a PoE enabled port, the switch detects it and automatically provides the appropriate power.\n\nOn the other hand, a PoE injector is used when you don't have a PoE switch. It's a small device that adds power to the Ethernet cable and can be placed between the switch and the device to provide power along with the data. Now, when working with PoE, there are various PoE standards that you should be aware of, with the most common being 802.3af, 802.3at, and 802.3bt.\n\nThe 802.3af standard, often referred to as just PoE, can deliver up to 15.4 watts of power per port. In contrast, the 802.3at standard, known as PoE+, provides up to 30 watts per port. More recently, the 802.3bt standard, also known as PoE++, has been introduced.\n\nThis latest standard can deliver even higher power over Ethernet, up to 60 watts per port with Type 3 devices and up to 90 watts with Type 4 devices. These varying standards are designed to ensure that devices and power sources can work together safely and effectively. Just be sure to match the power source with the power requirements of the connected device to avoid any compatibility issues and to ensure efficient operation.\n\nExam objective 2.5, compare and contrast common networking hardware devices. Network firewall. Let's imagine our computer network as a fortress.\n\nJust like a fortress has protective barriers and guards, a computer network needs a way to safeguard against unwanted intrusions and threats. This is where network firewalls come into play. A network firewall is a network security device that monitors and controls incoming and outgoing network traffic.\n\nSo, how does a network firewall work? Well, it performs a data packet inspection for each packet that tries to pass through it, inspecting its source address, destination address, and content. It compares this information against a set of predefined security rules and policies.\n\nWhen a data packet arrives at the firewall, it undergoes a thorough evaluation against these security rules. If the data packet aligns with the allowed parameters set in the security rules, the firewall permits it to pass through. This enables legitimate data to flow uninterrupted towards its intended destination, maintaining the network's operational efficiency and communication needs.\n\nConversely, if a data packet is found to be in violation of any of the established security rules, the firewall blocks the offending packet from entering or exiting the network. By preventing these harmful data packets from penetrating or leaving the network, the firewall plays an integral role in maintaining the overall security integrity of the network infrastructure. The security rules and policies used by network firewalls are often implemented using a mechanism known as an access control list or ACL.\n\nAn ACL defines the specific criteria that determines whether network traffic will be allowed or denied by the firewall. Access control lists are essentially a set of rules that dictate what types of network traffic are permitted and what types should be blocked. As a data packet is received by a network firewall, the network firewall will compare the data packet against the security rules listed in its access control list.\n\nIf the data packet does not match any of the allow rules in the access control list, the data packet will be denied. Then the next packet can be processed. The network firewall will again compare the data packet against the security rules listed in its access control list.\n\nIf the data packet matches an allow rule in the access control list, the data packet will be permitted and forwarded on. Exam objective 2.5, compare and contrast common networking hardware devices. Modern modems.\n\nHold on one second while I try to connect. Just kidding. Some of you may have recognized that sound, but if you didn't, that was an old school dial-up modem attempting to connect to an internet service provider.\n\nDial-up used to be very common and very slow. Fortunately, today we have a few more modern connection methods available to us, each using their own special type of modem. Depending on the transmission medium and service connection type in use, there are many different types of modems that can be deployed.\n\nTo ease into this topic, I will start with a basic definition. In networking, a modem, short for modulator demodulator, is a networking device that converts data from one signaling format to another so it can travel between a local network and an internet service provider. Now, before I go any further, I want to remind you that this course builds upon the topics covered in the CompTIA Tech+ certification exam.\n\nSpecific to this video segment, you should have the prerequisite knowledge of electrical signals, as well as a basic understanding of cable, DSL, and fiber optic communications, all of which can be found in our free CompTIA Tech+ training course. With that said, I will now talk about cable modems. A cable modem modulates and demodulates cable TV signals to provide internet access.\n\nYour internet service provider sends internet data in one format that the cable modem then converts into another format that your computer or network can understand. This also happens in reverse for outgoing data. As for making a connection, a cable modem connects to your home through the same coaxial cable that brings in cable TV.\n\nIt plugs into a cable outlet on one end and to a computer or router on the other end, usually via an ethernet cable. Next, we have a digital subscriber line or DSL modem. DSL uses a separate frequency band on a traditional phone line for internet data transmissions, so you can use the internet and phone simultaneously.\n\nThe DSL modem modulates internet data into high-frequency signals for transmission over the telephone lines and demodulates incoming signals back into a format that your computer or network can comprehend. Hooking up a DSL modem involves connecting to the internet through your home's telephone line. It plugs into a telephone jack using a DSL filter into a computer or router via an ethernet cable.\n\nLastly, we have an optical network terminal or ONT. An ONT converts the optical signals transmitted via a fiber optic cable into electrical ethernet signals that your computer network can utilize. This is similar to how DSL and cable modems work, but uses light signals instead of electrical signals over copper lines.\n\nAn ONT is used exclusively with fiber optic internet connections. In order to provide a connection, the ONT connects to the ISP's fiber optic network on one end and to your computer network on the other end. Exam objective 2.5, compare and contrast common networking hardware devices.\n\nNIC. A NIC, short for network interface card, is a common networking component that allows a computing device to connect to a network or another computing device. It acts as the communication link that enables data to be sent and received.\n\nThe primary function of a NIC is to convert the digital data generated by a device into an electrical or optical signal for transmission, and then convert incoming signals back into digital data that the device can understand. NICs come in many forms and support different ways of connecting to a network. Broadly speaking, they fall into two main categories, wired and wireless.\n\nWired NICs use physical cables, such as ethernet cables, to establish a network connection. This direct connection typically provides faster speeds, lower latency, and greater reliability. Because wired connections are less susceptible to interference and signal loss, wired NICs are commonly used in environments where stable and consistent performance is critical, such as offices, data centers, and gaming sabs.\n\nWireless NICs, on the other hand, use wireless technologies such as Wi-Fi, Bluetooth, NFC, or cellular connections. These NICs allow devices to connect to networks without physical cabling, providing flexibility and mobility. While wireless NICs offer convenience, they can be affected by interference, signal strength, and environmental factors, which may result in lower or less consistent performance compared to wired connections.\n\nWireless NICs are ideal for mobile devices like laptops, smartphones, and tablets, or in situations where running cables is not practical. NICs can also be classified based on how they are installed in a system. Some NICs are integrated, meaning they are built directly into the motherboard.\n\nThese are often referred to as onboard NICs. Integrated NICs require no additional installation and work right out of the box, but they offer limited upgrade options if your networking needs change. Other NICs are add-on or expansion cards.\n\nThese NICs are installed separately and can be easily replaced or upgraded. If a system requires a faster connection, a different network type or improved features, an add-on NIC allows for flexibility without replacing the entire motherboard. In addition to providing physical or wireless connectivity, every NIC is also associated with a unique identifier that distinguishes it from every other network interface in the world.\n\nThis identifier plays a critical role in how devices communicate on a network, and that brings us directly into the topic we will cover in the next video segment, MAC addresses. Exam objective 2.5, compare and contrast common networking hardware devices. MAC address.\n\nWe just finished talking about network interface cards or NICs and how they allow devices to connect to a network. Every NIC also comes with something equally important built into it, a MAC address. MAC stands for media access control, and a MAC address is a unique hardware identification address assigned to a network interface at the time it is manufactured.\n\nYou can think of it as a digital fingerprint for the NIC. Any device that can connect to a network, whether it is a computer, smartphone, printer, or network device, has at least one MAC address associated with its network interface. A helpful comparison is a vehicle identification number, or VIN.\n\nJust like no two cars are supposed to have the same VIN, no two network interfaces should share the same MAC address. MAC addresses are written using the hexadecimal numbering system, which uses the numbers zero through nine and the letters A through F. A standard MAC address is made up of 12 hexadecimal characters, which represents 48 bits in total.\n\nThe MAC address itself is divided into two main parts. The first half is called the organizationally unique identifier, often abbreviated as OUI. This portion identifies the manufacturer of the network interface card.\n\nThe second half is assigned by the manufacturer and uniquely identifies that specific network interface. Together, these two sections ensure that MAC addresses are globally unique. This uniqueness is essential for network communication.\n\nImagine trying to deliver mail in a neighborhood where two houses have the exact same address. The mail carrier would have no idea where the letter belongs. The same problem would occur on a network if two devices shared the same MAC address.\n\nNetwork devices would not know which interface should receive the data. Now, you might be wondering, how are MAC addresses used? Well, MAC addresses play a vital role in the communication between devices on a local area network or LAN.\n\nWhen you send data from your device to another device within the same local area network, the MAC address is used to identify the intended recipient. It helps ensure that your message reaches the correct destination. So why don't we look at this in action?\n\nFirst, we need a data packet to be sent. Luckily, the workstation in the top left of our diagram has a data packet to send to another device in our local area network. Now the workstation needs to encapsulate the data to be sent into an ethernet frame.\n\nThe ethernet frame will include the destination MAC address or the MAC address of the device the workstation will be sending the data packet to. The ethernet frame will also include the workstation's own MAC address, known as the source MAC address, and finally, the data or payload that will be sent with this packet. Next, the data packet will then be sent out of the workstation's network interface card to the network switch.\n\nThe switch will determine which network path is to be used to reach the device matching our destination MAC address in the ethernet frame. And if everything goes right, our data packet will finally be delivered. All thanks to the help of MAC addresses.", "uyghur": "Exam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ، ئۇلارنىڭ ئوخشاشلىقى ۋە پەرقىنى چۈشەندۈرۈڭ.\n\n## كۆپ ئۇچرايدىغان تور قاتتىق دېتالى (Common Networking Hardware)\n\n### Network Hub\n\n**Hub** — بىر نەچچە كومپيۇتېر ياكى تور ئۈسكۈنىسىنى ئۆزئارا ئۇلايدىغان ئاددىي تور ئۈسكۈنىسى.\n\nمەنبە hub نى كونا ۋە ھازىر كۆپىنچە ئىشلىتىلمەيدىغان ئۈسكۈنە دەپ چۈشەندۈرىدۇ. ئۇ يېڭى A+ Core 1 objective لىرىنىڭ بىۋاسىتە بىر قىسمى بولمىسىمۇ، switch نىڭ نېمە ئۈچۈن تېخىمۇ ياخشى ئىكەنلىكىنى چۈشىنىشكە ياردەم بېرىدۇ.\n\nHub بىر ئۈسكۈنىدىن data قوبۇل قىلغاندا:\n- قايسى ئۈسكۈنىگە كېرەكلىكىنى تاللىمايدۇ\n- شۇ data نى ئۇلانغان **بارلىق** ئۈسكۈنىلەرگە broadcast قىلىدۇ\n\nمەنبە بۇنى بىر ئۆيدىكى ھەممە ئادەمگە بىرلا ۋاقىتتا ئاڭلىتىش بېرىدىغان ياڭراتقۇغا ئوخشىتىدۇ.\n\nشۇڭا hub:\n- traffic نى نىشانلىق يوللىمايدۇ\n- ئۈنۈمدارلىقى تۆۋەنرەك\n- switch قا سېلىشتۇرغاندا بىخەتەرلىكىمۇ تۆۋەنرەك\n\nبۇ چەكلىمىلەر سەۋەبىدىن hub لار بۈگۈنكى تورلاردا كۆپىنچە obsolete، يەنى ئەمەلىي ئىشلىتىشتىن قالغان.\n\n### Network Switch\n\n**Switch** — Local Area Network (LAN) ئىچىدىكى بىر نەچچە ئۈسكۈنىنى ئۇلايدىغان تور ئۈسكۈنىسى.\n\nئۇ:\n- computer\n- printer\n- server\n- باشقا endpoint\nلارنىڭ بىر LAN ئىچىدە ئۆزئارا ئالاقە قىلىشىغا ياردەم بېرىدۇ.\n\nHub بىلەن ئوخشاش، switch بىر نەچچە ئۈسكۈنىنى ئۇلايدۇ. ئەمما مۇھىم پەرق:\n\n> **Hub data نى ھەممىگە broadcast قىلىدۇ؛ switch بولسا data نى نىشان ئۈسكۈنىگە يوللاشقا تىرىشىدۇ.**\n\nمەنبە switch نى توردىكى **traffic controller** غا ئوخشىتىدۇ.\n\nSwitch:\n1. بىر ئۈسكۈنىدىن frame/data قوبۇل قىلىدۇ.\n2. destination address نى تەكشۈرىدۇ.\n3. مۇناسىپ network path ياكى switch port نى تاللايدۇ.\n4. data نى نىشان ئۈسكۈنىگە يوللايدۇ.\n\nمەنبە Ethernet LAN دا ئۈسكۈنە يوللىماقچى بولغان data نىڭ:\n- destination address\n- source address\n- payload\nنى ئۆز ئىچىگە ئالغان **Ethernet frame** شەكلىدە يەتكۈزۈلىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n#### Unmanaged Switch\n\n**Unmanaged switch**:\n- ئاددىي\n- plug-and-play\n- ئادەتتە configuration تەلەپ قىلمايدۇ\n\nمەنبە ئۇنى:\n- كىچىك تور\n- SOHO — Small Office/Home Office\nمۇھىتىغا ماس دەپ چۈشەندۈرىدۇ.\n\nكۆپ ئۇچرايدىغان كىچىك unmanaged switch لاردا:\n- 4 port\n- 8 port\nبولۇشى مۇمكىن.\n\n#### Managed Switch\n\n**Managed switch**:\n- چوڭراق ۋە مۇرەككەپ تورغا ماس\n- administrator تەرىپىدىن configuration قىلىشقا بولىدۇ\n- unmanaged switch غا قارىغاندا تېخىمۇ كۆپ كونترول ئىمكانى تەمىنلەيدۇ\n\nمەنبە managed switch ئارقىلىق:\n- security feature / protocol لارنى قوللىنىش\n- network traffic نى كونترول قىلىش\n- voice traffic قا ئوخشاش ئوخشىمىغان traffic تۈرلىرىنى ئايرىش\nمۇمكىنلىكىنى چۈشەندۈرىدۇ.\n\nبۇ بولۇپمۇ مەلۇم traffic نىڭ quality ۋە reliability سىنى قوغداش مۇھىم بولغان مۇھىتتا پايدىلىق.\n\nمەنبە managed switch نىڭ corporate environment دا كۆپ ئىشلىتىلىدىغانلىقىنى ۋە:\n- 24 port\n- 48 port\n- ياكى تېخىمۇ كۆپ port\nقا ئىگە بولۇشى مۇمكىنلىكىنى بايان قىلىدۇ.\n\n### Wireless Access Point — AP\n\n**Access Point (AP)**، ياكى **Wireless Access Point** — Wi‑Fi ئىقتىدارى بار ئۈسكۈنىلەرنىڭ تورغا سىمسىز ئۇلىنىشىغا يول قويىدىغان تور ئۈسكۈنىسى.\n\nئۇ:\n- laptop\n- smartphone\n- tablet\nقاتارلىق wireless device لارنى تورغا باغلايدۇ.\n\nمەنبە access point نى ئاددىيلا:\n\n> **switch نىڭ سىمسىز شەكلى**\n\nدەپ تەسەۋۋۇر قىلىشقا بولىدىغانلىقىنى ئېيتىدۇ.\n\nAP:\n- wireless device دىن data قوبۇل قىلىپ تورغا يوللايدۇ\n- توردىن data قوبۇل قىلىپ wireless client لارغا يوللايدۇ\n\nبۇ ئىككى يۆنىلىشلىك ئالاقە ئارقىلىق wireless device:\n- network resource غا كىرەلەيدۇ\n- باشقا ئۈسكۈنىلەر بىلەن ئالاقە قىلالايدۇ\n\nWi‑Fi قوزغىتىلغان device بار network لارنى scan قىلغاندا، access point تارقاتقان wireless network نى كۆرۈپ ئۇنىڭغا ئۇلىنالايدۇ.\n\n### Network Router\n\n**Router** — data packet لارنى **ئوخشىمىغان تورلار ئارىسىدا** يوللايدىغان تور ئۈسكۈنىسى.\n\nSwitch بىلەن router نىڭ ئەڭ مۇھىم پەرقى:\n\n- **Switch** → بىر LAN ئىچىدىكى traffic نى يوللايدۇ\n- **Router** → بىر network دىن باشقا network قا كىرىدىغان ياكى چىقىدىغان traffic نى يوللايدۇ\n\nبىر device باشقا network دىكى device قا data يوللىماقچى بولسا، packet ئىچىدە:\n- source IP address\n- destination IP address\nبولىدۇ.\n\nئەگەر destination IP ھازىرقى local network ئىچىدە بولمىسا، packet router غا يوللىنىدۇ.\n\nRouter destination address نى تەكشۈرۈپ، data نىڭ نىشانغا يېتىشى ئۈچۈن مۇۋاپىق يولنى تاللايدۇ.\n\nمەنبە router نى:\n> **network نىڭ broadcast domain چېتىدىكى gateway**\n\nدەپ چۈشەندۈرىدۇ.\n\nئۇ:\n- local network بىلەن باشقا LAN ئارىسىدا\n- ياكى كۆپ ئۇچرايدىغىنى local network بىلەن ISP تەمىنلىگەن WAN/Internet connection ئارىسىدا\ntraffic نى باشقۇرىدۇ.\n\n### SOHO Router — Small Office/Home Office Router\n\n**SOHO** — Small Office/Home Office.\n\nSOHO router ئۆي ياكى كىچىك كارخانا تورى ئۈچۈن لايىھەلەنگەن **كۆپ ئىقتىدارلىق تور ئۈسكۈنىسى**.\n\nئۇنىڭ نامى router بولسىمۇ، مەنبە بويىچە ئادەتتە بىر نەچچە ئۈسكۈنىنىڭ ئىقتىدارىنى بىرلا قاپقا بىرلەشتۈرىدۇ:\n\n1. **Router**\n2. **Network switch**\n3. **Wireless access point**\n\n#### Built-in Switch\n\nSOHO router دا بىر قانچە Ethernet LAN port بولىدۇ.\n\nمەنبەدىكى ئۈسكۈنە مىسالىدا:\n- 4 Ethernet LAN port بار\n- ئۇلار **RJ45** port سۈپىتىدە كۆرسىتىلگەن\n\nبۇ switch port لار local wired device لارنى ئۇلاشقا ئىشلىتىلىدۇ.\n\n#### Built-in Access Point\n\nSOHO router wireless access point ئىقتىدارىنىمۇ ئۆز ئىچىگە ئالىدۇ.\n\nAntenna ئارقىلىق:\n- Wi‑Fi signal يوللايدۇ\n- Wi‑Fi signal قوبۇل قىلىدۇ\n\nشۇ ئارقىلىق wireless client لار SOHO network قا ئۇلىنىدۇ.\n\n#### Router / WAN Connection\n\nSOHO router نىڭ router قىسمى:\n- local SOHO network\n- Internet / ISP connection\nئارىسىدىكى gateway رولىنى ئوينايدۇ.\n\nWAN port ياكى WAN connection بۇ سىرتقى تور ئۇلىنىشى ئۈچۈن ئىشلىتىلىدۇ.\n\n**ئىمتىھاندا ئەستە تۇتۇش:**\n\n> **SOHO router = Router + Switch + Wireless AP**\n\nمەنبە ئۇنى device سانى چەكلىك بولغان ئۆي ياكى كىچىك ئىشخانا تورى ئۈچۈن قولايلىق تاللاش دەپ چۈشەندۈرىدۇ.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## Patch Panel\n\n**Patch panel** — تور كابېللىرىنى بىر مەركىزىي جايدا تەرتىپكە سېلىش ۋە باشقۇرۇش ئۈچۈن كۆپ port قا ئىگە بولغان panel.\n\nئۇ ئادەتتە:\n- server room\n- network closet\nدا ئۇچرايدۇ.\n\nبىنانىڭ ھەر خىل ئۆي ياكى رايونلىرىدىن كەلگەن network cable لار patch panel غا يىغىلىدۇ.\n\n### Patch Panel switch ئەمەس\n\nبۇ ناھايىتى مۇھىم پەرق.\n\nمەنبە بويىچە، computer دىن كەلگەن cable patch panel غا ئۇلانغاندا، patch panel ئۆزى network traffic نى switch غا ئوخشاش بىۋاسىتە باشقۇرمايدۇ.\n\nئۇ:\n- cable connection نى مەركەزلەشتۈرىدۇ\n- شۇ connection نى باشقا port ئارقىلىق network switch ياكى router غا ئۇلاشنى ئاسانلاشتۇرىدۇ\n\nيەنى patch panel نىڭ ئاساسلىق رولى:\n> **cable organization and management**\n\n### Patch Cable ئارقىلىق ئۆزگەرتىش\n\nئەگەر بىر device نى:\n- باشقا network segment قا يۆتكەش\n- باشقا switch port غا ئۇلاش\nكېرەك بولسا، پۈتۈن cable نى قايتا ياتقۇزۇشنىڭ ئورنىغا patch panel دىكى patch cable connection نى ئۆزگەرتىش يېتەرلىك بولۇشى مۇمكىن.\n\n### Patch Panel نىڭ پايدىسى\n\nمەنبە تۆۋەندىكى ئەۋزەللىكلەرنى چۈشەندۈرىدۇ:\n\n**1. تەرتىپ**\n- نۇرغۇن network cable نى بىر جايدا باشقۇرۇش ئاسان\n\n**2. Troubleshooting**\n- بارلىق cable بىر مەركىزىي نۇقتىغا كەلگەچكە، مەسىلە بار connection نى تېپىش ئاسانراق\n\n**3. Maintenance / Reconfiguration**\n- يېڭى device قوشۇش ياكى network layout نى ئۆزگەرتىش تېخىمۇ قولايلىق\n\n**4. Physical protection**\n- ئاساسىي permanent cable ۋە network device لارنى قايتا-قايتا تۇتۇش ئازىيىدۇ\n- wear and tear ئازىيىدۇ\n- network cabling نىڭ ئۇزۇن مۇددەتلىك مۇقىملىقىغا ياردەم بېرىدۇ\n\n**ئەستە تۇتۇڭ:**\n\n> **Patch panel = cable management؛ switch = data forwarding**\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## PoE — Power over Ethernet\n\n**PoE (Power over Ethernet)** — بىرلا Ethernet cable ئارقىلىق:\n- network data\n- electrical power\nنى بىر ۋاقىتتا يەتكۈزۈشكە يول قويىدىغان تېخنىكا ئۆلچىمى.\n\nبۇ ئارقىلىق device قا:\n- بىر data cable\n- بىر power cable\nدەپ ئىككى ئايرىم cable لازىم بولمايدۇ.\n\nمەنبە PoE ئارقىلىق توك ۋە data بىلەن تەمىنلىنىدىغان device مىساللىرى:\n- wireless access point\n- IP camera\n- VoIP phone\n\n### PoE Switch\n\n**PoE switch** — ئۇلانغان ماس device لارغا Ethernet port ئارقىلىق توك تەمىنلىيەلەيدىغان network switch.\n\nمەنبە بويىچە:\n1. compatible device PoE-enabled port قا ئۇلىنىدۇ.\n2. Switch device نى بايقايدۇ.\n3. مۇۋاپىق power نى ئاپتوماتىك تەمىنلەيدۇ.\n\n### PoE Injector\n\nئەگەر network switch ئۆزى PoE نى قوللىمىسا، **PoE injector** ئىشلىتىشكە بولىدۇ.\n\nPoE injector:\n- switch بىلەن powered device ئارىسىغا قويۇلىدۇ\n- Ethernet cable غا power قوشىدۇ\n- data بىلەن power نى شۇ بىر cable ئارقىلىق يەتكۈزۈشكە ياردەم بېرىدۇ\n\n### PoE ئۆلچەملىرى\n\nمەنبە ئۈچ مۇھىم ئۆلچەمنى بېرىدۇ:\n\n| Standard | Common name | Source-stated maximum |\n|---|---|---:|\n| **802.3af** | PoE | 15.4 W / port |\n| **802.3at** | PoE+ | 30 W / port |\n| **802.3bt Type 3** | PoE++ | 60 W / port |\n| **802.3bt Type 4** | PoE++ | 90 W / port |\n\nتۈرلۈك PoE standard لار device بىلەن power source نىڭ بىخەتەر ۋە ئۈنۈملۈك بىرلىكتە ئىشلىشىگە ياردەم بېرىدۇ.\n\n**مۇھىم:** power source نىڭ ئىقتىدارى بىلەن ئۇلانغان device نىڭ power requirement ى ماس بولۇشى كېرەك.\n\nبۇ:\n- compatibility مەسىلىسىدىن ساقلىنىش\n- ئۈسكۈنىنىڭ توغرا ئىشلىشى\nئۈچۈن مۇھىم.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## Network Firewall\n\n**Network firewall** — تورغا كىرىدىغان ۋە توردىن چىقىدىغان network traffic نى نازارەت قىلىپ ۋە كونترول قىلىدىغان تور بىخەتەرلىك ئۈسكۈنىسى.\n\nمەنبە network نى قەلئەگە، firewall نى بولسا قەلئەنىڭ توساق ۋە قوغدىغۇچىلىرىغا ئوخشىتىدۇ.\n\n### Packet Inspection\n\nPacket firewall دىن ئۆتمەكچى بولغاندا، مەنبە بويىچە firewall تۆۋەندىكى ئۇچۇرلارنى تەكشۈرىدۇ:\n- source address\n- destination address\n- content\n\nئاندىن بۇ ئۇچۇرنى ئالدىن بېكىتىلگەن:\n- security rule\n- security policy\nلار بىلەن سېلىشتۇرىدۇ.\n\nئەگەر packet رۇخسەت قىلىنغان شەرتلەرگە ماس كەلسە:\n- firewall ئۇنى ئۆتكۈزىدۇ\n- packet نى نىشان تەرەپكە يوللايدۇ\n\nئەگەر security rule غا خىلاپ بولسا:\n- packet توسۇلىدۇ\n- تورغا كىرىشى ياكى توردىن چىقىشىغا يول قويۇلمايدۇ\n\n### ACL — Access Control List\n\nمەنبە network firewall دىكى rule/policy لارنىڭ كۆپىنچە **ACL — Access Control List** ئارقىلىق ئىپادىلىنىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nACL:\n- قايسى traffic قا رۇخسەت بېرىلىدىغانلىقى\n- قايسى traffic توسۇلىدىغانلىقى\nنى بەلگىلەيدىغان rule لار توپلىمى.\n\nمەنبەدىكى ئاددىي جەريان:\n1. Firewall packet نى ACL rule لار بىلەن سېلىشتۇرىدۇ.\n2. Packet allow rule غا ماس كەلمىسە، deny قىلىنىدۇ.\n3. Allow rule غا ماس كەلسە، permit قىلىنىپ forward قىلىنىدۇ.\n\n**ئىمتىھاندا ئەستە تۇتۇڭ:**\n\n> **Firewall = traffic نى rule بويىچە allow ياكى deny قىلىش**\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## زامانىۋى مودېملار (Modern Modems)\n\n**Modem** — **modulator-demodulator** نىڭ قىسقارتىلمىسى.\n\nمەنبە بويىچە modem نىڭ ئاساسىي ۋەزىپىسى:\n> **data نى بىر signaling format دىن يەنە بىر format قا ئايلاندۇرۇپ، local network بىلەن ISP ئارىسىدا يەتكۈزۈشكە ماسلاشتۇرۇش.**\n\nConnection medium ۋە ISP service تۈرىگە قاراپ modem / terminal تۈرىمۇ پەرقلىنىدۇ.\n\nمەنبە بۇ بۆلەكتە:\n- cable modem\n- DSL modem\n- ONT\nنى قاپلايدۇ.\n\n### Cable Modem\n\nCable modem cable TV infrastructure ئارقىلىق Internet access تەمىنلەيدۇ.\n\nمەنبە بويىچە:\n- ISP دىن كەلگەن cable signal نى local computer/network چۈشىنەلەيدىغان format قا ئايلاندۇرىدۇ\n- outgoing data ئۈچۈن بۇ جەريان ئەكسىچە يۈز بېرىدۇ\n\nPhysical connection:\n- ئۆيگە كەلگەن **coaxial cable**\n- cable outlet\n- modem دىن computer ياكى router غا ئادەتتە Ethernet cable\n\n**Cable modem → coaxial cable**\n\n### DSL Modem — Digital Subscriber Line\n\nDSL ئەنئەنىۋى telephone line دا Internet data ئۈچۈن ئايرىم frequency band ئىشلىتىدۇ.\n\nمەنبە بويىچە بۇ:\n- Internet ئىشلىتىش\n- telephone ئىشلىتىش\nنى بىر ۋاقىتتا مۇمكىن قىلىدۇ.\n\nDSL modem:\n- Internet data نى telephone line دا يەتكۈزۈشكە ماس high-frequency signal غا ئايلاندۇرىدۇ\n- incoming signal نى computer/network چۈشىنىدىغان data format قا قايتۇرىدۇ\n\nPhysical connection:\n- telephone line\n- telephone jack\n- مەنبە تىلغا ئالغان DSL filter\n- modem دىن computer/router غا Ethernet\n\n**DSL modem → telephone line**\n\n### ONT — Optical Network Terminal\n\n**ONT (Optical Network Terminal)** — fiber-optic Internet connection دا ئىشلىتىلىدىغان ئۈسكۈنە.\n\nئۇ:\n- fiber cable ئارقىلىق كەلگەن optical/light signal نى\n- local computer network ئىشلىتەلەيدىغان electrical Ethernet signal غا\nئايلاندۇرىدۇ.\n\nمەنبە ONT نىڭ:\n- fiber optic Internet ئۈچۈن مەخسۇس ئىشلىتىلىدىغانلىقىنى\n- بىر ئۇچى ISP نىڭ fiber network ىغا\n- يەنە بىر ئۇچى local computer network قا\nئۇلىنىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n**ONT → fiber optic**\n\n### Connection Types — تېز ئەستە ساقلاش\n\n| Device | Source medium |\n|---|---|\n| Cable modem | Coaxial cable |\n| DSL modem | Telephone line |\n| ONT | Fiber-optic cable |\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## NIC — Network Interface Card\n\n**NIC (Network Interface Card)** — ھېسابلاش ئۈسكۈنىسىنىڭ network ياكى باشقا computing device بىلەن ئالاقە قىلىشىغا يول قويىدىغان تور زاپچىسى.\n\nNIC:\n- data يوللاش\n- data قوبۇل قىلىش\nئۈچۈن device بىلەن network ئارىسىدىكى communication link رولىنى ئوينايدۇ.\n\nمەنبە NIC نىڭ ئاساسىي ۋەزىپىسىنى:\n- device ھاسىل قىلغان digital data نى transmission ئۈچۈن electrical ياكى optical signal غا ئايلاندۇرۇش\n- incoming signal نى device چۈشىنىدىغان digital data غا قايتۇرۇش\nدەپ چۈشەندۈرىدۇ.\n\n### Wired NIC\n\nWired NIC:\n- Ethernet cable غا ئوخشاش physical cable ئارقىلىق network connection قۇرىدۇ\n\nمەنبە wired connection نىڭ ئادەتتە:\n- تېزرەك speed\n- تۆۋەنرەك latency\n- يۇقىرىراق reliability\nتەمىنلىشى مۇمكىنلىكىنى چۈشەندۈرىدۇ.\n\nPhysical cable بولغاچقا:\n- interference\n- signal loss\nتەسىرى wireless غا قارىغاندا تۆۋەنرەك بولۇشى مۇمكىن.\n\nشۇڭا مەنبە wired NIC نى:\n- office\n- data center\n- مۇقىم ۋە ئىزچىل performance مۇھىم بولغان باشقا مۇھىت\nقا ماس دەپ چۈشەندۈرىدۇ.\n\n### Wireless NIC\n\nWireless NIC physical cable سىز wireless technology ئارقىلىق connection تەمىنلەيدۇ.\n\nمەنبە مىسال سۈپىتىدە:\n- Wi‑Fi\n- Bluetooth\n- NFC\n- cellular connection\nنى تىلغا ئالىدۇ.\n\nWireless NIC نىڭ ئەۋزەللىكى:\n- mobility\n- flexibility\n- cable ياتقۇزۇش قىيىن بولغان جايدا قولايلىق\n\nئەمما مەنبە wireless performance نىڭ:\n- interference\n- signal strength\n- environmental factor\nدىن تەسىرلىنىپ، wired connection غا سېلىشتۇرغاندا تۆۋەنرەك ياكى تۇراقسىزراق بولۇشى مۇمكىنلىكىنى چۈشەندۈرىدۇ.\n\nWireless NIC:\n- laptop\n- smartphone\n- tablet\nغا ئوخشاش كۆچمە ئۈسكۈنىلەرگە ماس.\n\n### Integrated / Onboard NIC\n\n**Integrated NIC** ياكى **onboard NIC**:\n- motherboard قا بىۋاسىتە بىرلەشتۈرۈلگەن\n- قوشۇمچە installation تەلەپ قىلمايدۇ\n- سىستېما بىلەن تەييار كېلىدۇ\n\nئەمما networking requirement ئۆزگەرسە upgrade تاللانمىسى چەكلىك بولۇشى مۇمكىن.\n\n### Add-on / Expansion NIC\n\n**Add-on NIC** ياكى **expansion card NIC**:\n- ئايرىم ئورنىتىلىدۇ\n- ئالماشتۇرۇش ياكى upgrade قىلىش ئاسانراق\n\nمەنبە بۇنىڭ:\n- تېزرەك connection\n- باشقا network type\n- ياخشىلانغان feature\nكېرەك بولغاندا، پۈتۈن motherboard نى ئالماشتۇرمايلا network interface نى يېڭىلاشقا يول قويىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### NIC — ئەستە ساقلاش\n\n| NIC type | ئاساسىي پەرق |\n|---|---|\n| Wired | Cable، ئادەتتە تېز/تۆۋەن latency/مۇقىم |\n| Wireless | Cable يوق، mobility/flexibility |\n| Integrated / onboard | Motherboard قا بىرلەشتۈرۈلگەن |\n| Add-on / expansion | ئايرىم، replace/upgrade قىلىش ئاسان |\n\nھەر بىر NIC بىلەن network communication دا ئىشلىتىلىدىغان بىر مۇھىم unique identifier باغلانغان؛ كېيىنكى بۆلەك شۇ **MAC address** ھەققىدە.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان تور قاتتىق دېتال ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## MAC Address — Media Access Control Address\n\n**MAC (Media Access Control) address** — network interface بىلەن باغلانغان unique hardware identification address.\n\nمەنبە ئۇنى NIC نىڭ **رەقەملىك بارماق ئىزى** غا ئوخشىتىدۇ.\n\nمەنبە بويىچە، network قا ئۇلىنالايدىغان:\n- computer\n- smartphone\n- printer\n- network device\nنىڭ network interface ى بىلەن كەم دېگەندە بىر MAC address باغلانغان بولىدۇ.\n\nمەنبە MAC address نى ماشىنىنىڭ **VIN — Vehicle Identification Number** غا ئوخشىتىدۇ:\n- ھەر بىر network interface نى باشقىلاردىن پەرقلەندۈرۈش ئۈچۈن ئىشلىتىلىدۇ\n\n### MAC Address شەكلى\n\nMAC address **hexadecimal** سىستېمىسىدا يېزىلىدۇ.\n\nHexadecimal:\n- `0–9`\n- `A–F`\nھەرپ/رەقەملىرىنى ئىشلىتىدۇ.\n\nمەنبە بويىچە standard MAC address:\n- **12 hexadecimal character**\n- جەمئىي **48 bit**\nدىن تەركىب تاپىدۇ.\n\n### MAC Address نىڭ ئىككى قىسمى\n\nمەنبە MAC address نى ئىككى چوڭ بۆلەككە ئايرىيدۇ.\n\n#### 1. OUI — Organizationally Unique Identifier\n\nMAC address نىڭ ئالدىنقى يېرىمى:\n\n**OUI — Organizationally Unique Identifier**\n\nدەپ ئاتىلىدۇ.\n\nمەنبە بويىچە بۇ قىسمى network interface نىڭ manufacturer ىنى پەرقلەندۈرۈشكە ئىشلىتىلىدۇ.\n\n#### 2. Manufacturer-assigned Portion\n\nئىككىنچى يېرىمى manufacturer تەرىپىدىن بېرىلىپ، شۇ مەخسۇس network interface نى پەرقلەندۈرىدۇ.\n\nمەنبە بۇ ئىككى بۆلەك بىرلىكتە MAC address نىڭ global uniqueness ىغا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### LAN ئىچىدىكى رولى\n\nMAC address local area network (LAN) ئىچىدىكى device-to-device communication دا مۇھىم.\n\nبىر workstation شۇ LAN ئىچىدىكى باشقا device قا data يوللىغاندا:\n\n1. Data **Ethernet frame** ئىچىگە encapsulate قىلىنىدۇ.\n2. Frame ئىچىگە **destination MAC address** قوشۇلىدۇ.\n3. Frame ئىچىگە workstation نىڭ **source MAC address** ىمۇ قوشۇلىدۇ.\n4. Payload frame ئىچىدە يەتكۈزۈلىدۇ.\n5. NIC frame نى network switch قا يوللايدۇ.\n6. Switch destination MAC address قا ماس device قا بارىدىغان network path/port نى تاللايدۇ.\n7. Data نى نىشان network interface قا يەتكۈزۈشكە ياردەم بېرىدۇ.\n\n**ئىمتىھاندا ئەستە تۇتۇڭ:**\n\n> **IP address = network-level addressing**\n>\n> **MAC address = local network interface identification**\n\nبۇ ئاخىرقى memory line مەنبەنىڭ switch/router ۋە MAC توغرىسىدىكى شۇ objective ئىچىدىكى teaching model نى خۇلاسىلەيدۇ؛ ئۇنىڭغا قوشۇمچە protocol-layer تەپسىلاتلىرى قوشۇلمىدى.\n\n### Objective 2.5 — قىسقا ئەستە ساقلاش\n\n- **Hub** = Data نى بارلىق port/device قا broadcast قىلىدۇ\n- **Switch** = LAN ئىچىدە data نى نىشانغا يوللايدۇ\n- **AP** = Wireless device لارغا local network access\n- **Router** = ئوخشىمىغان network لار ئارىسىدا traffic يوللايدۇ\n- **SOHO router** = Router + Switch + AP\n- **Patch panel** = Cable organization، data forwarding ئەمەس\n- **PoE** = بىر Ethernet cable دا data + power\n- **Firewall** = Rule/ACL بويىچە traffic allow/deny\n- **Cable modem** = Coax\n- **DSL modem** = Telephone line\n- **ONT** = Fiber\n- **NIC** = Device نىڭ network interface ى\n- **MAC** = Network interface نى پەرقلەندۈرىدىغان hardware address\n"}, {"id": "2.6", "number": "2.6", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.6. Given a scenario, configure basic wired and wireless SOHO networks. IP address.\n\nBy the end of this video segment, you will have a basic understanding of what an IP address is and how it functions in the world of networking. So let's get to it. First up is to define what an IP address is.\n\nIP stands for Internet Protocol. And an IP address is a unique numerical identifier assigned to every device connected to a network. Within this definition, the keyword is assigned as an IP address is logically assigned, can be changed and even reassigned as needed.\n\nCurrently, there are two versions of IP addresses in use. IPv4 and IPv6. IPv4, which stands for Internet Protocol version four, is the older and more widely adopted version.\n\nAn IPv4 address identifies a device in an Internet Protocol version four or an IPv4 network. It is worth noting that IPv4 addresses use a specific type of notation called dot decimal notation. Dot decimal notation is a way of displaying a big number in manageable chunks.\n\nIn the case of an IPv4 address, each address is 32 binary digits long. This is a bit difficult to understand. So let's group this 32 binary digit address into different containers that are separated by dots.\n\nThis will create four sets of eight binary digits, also known as octets. Next, we will convert each octet from binary to their decimal value equivalents, resulting in a dot decimal notation that is much easier to read. With this dot decimal notation, each octet can range from zero to 255, providing us with over 4.2 billion numerical combinations.\n\nIPv6 addresses are considerably longer than an IPv4 address at 128 binary digits long. IPv6 addresses also use a different addressing scheme. IPv6 addresses include eight groups of four hexadecimal digits separated by colons.\n\nEach group of four hexadecimal digits can also be called a hextet. Next, let's explore how IP addresses are assigned to devices. There are two main methods, static and dynamic.\n\nA static IP address is manually assigned to a device and remains constant over time. This is often used for servers, printers, or other devices that need a persistent unchanging address in order to be consistently located by other devices. On the other hand, dynamic IP addresses are automatically assigned by a service called DHCP, which stands for Dynamic Host Configuration Protocol.\n\nWith dynamic addressing using DHCP, a device receives an IP address from a DHCP server when it connects to the network. This dynamic addressing using DHCP allows for efficient assignment and use of IP addresses. Additionally, dynamic IP addressing using DHCP simplifies the process of getting connected to a network for non-technical users.\n\nInstead of manually configuring IP addresses, DHCP automatically assigns an IP address to a device when it connects to the network. This eliminates the need for users to have prior knowledge of networking or IP addressing, making it more user-friendly and convenient. Non-technical users can simply connect their devices to the network and DHCP takes care of the rest.\n\nNow let's look at private and public IPv4 addresses. Private IPv4 addresses are used within local area networks, such as a home or small office. These addresses are not routable on the internet and are meant for internal communication, like a workstation connecting to a printer or accessing an internal server.\n\nPrivate IPv4 addresses fall within specific reserve ranges and any address within those ranges is restricted to use inside a local area network. For a list of private IPv4 ranges, just look to the right. Public IPv4 addresses behave a bit differently.\n\nThey are assigned to devices that connect directly to the internet. These addresses are unique globally and allow devices to communicate with each other across the internet. Internet service providers, or ISPs, assign public IP addresses to devices connected to their network.\n\nNow this is a video segment that might be worth watching a couple of times. We covered the definition of an IP address, the different IP protocols version four and version six, static and dynamic IP address assignment, and the difference between private and public IP addresses. Great job.\n\nExam objective 2.6, given a scenario, configure basic wired and wireless SOHO networks. APIPA, APIPA stands for automatic private IP addressing. It's a mechanism used to automatically assign a self-configured IP address to a computer.\n\nThis happens when the computer fails to obtain an IP address from a dynamic host configuration protocol or DHCP server. When a computer tries and fails to get an IP address the usual way through DHCP, it activates APIPA, which then assigns a temporary self-generated IP address. This is a bit like a backup plan to ensure that the computer's network interface is always operational.\n\nThis automatic assignment is vital in networking as it keeps devices connected and able to communicate with each other, even when there are issues with the DHCP server. The range of IP addresses reserved for APIPA extends from 169.254.0.1 through 169.254.255.254. This range is set aside specifically for this automatic addressing and is recognized across all systems that support APIPA.\n\nHaving this reserved range ensures that devices can self-assign an address that's unlikely to conflict with addresses assigned by a DHCP server. With troubleshooting in mind, let's discuss one of the most common reasons why a device obtains an APIPA address. The primary reason is the inability to reach a DHCP server.\n\nThis could be due to the server being offline, network congestion or issues with the network infrastructure such as faulty cables or incorrect network settings. When a computer boots up and requests an IP address but receives no response from a DHCP server, it defaults to assigning itself an APIPA address. Now, having an APIPA address will come with certain restrictions.\n\nThe most significant limitation is the lack of internet connectivity. Devices with APIPA addresses can communicate with other devices on the same local network segment that also have APIPA addresses, but they cannot access external networks, including the internet. This is because APIPA is designed for local network communication only and routers typically do not forward traffic originating from APIPA addresses to other networks.\n\nExam objective 2.6. Given a scenario, configure basic wired and wireless SOHO networks. Subnet mask.\n\nWhen a device connects to a network, it is not given just an IP address. There are several network settings that work together to allow proper communication. And one of the most important of these is the subnet mask.\n\nA subnet mask is a value that works alongside an IP address to determine the range of IP addresses that are considered part of the same local area network. In simple terms, the subnet mask helps a device decide whether another device is on the same local network or a part of another network. Think of the subnet mask like a neighborhood boundary drawn on a map.\n\nThe subnet mask defines exactly which houses belong to your neighborhood and which ones do not. If another house falls within that boundary, you can walk next door and deliver a message directly. In networking terms, that means your device can communicate straight to another device on the same local area network without any extra help.\n\nHowever, if the house is outside your neighborhood boundary, you cannot reach it directly. Instead, you have to go through a main road that leads out of the neighborhood. In a network, that main road is the default gateway.\n\nWhen a device determines, using the subnet mask, that a destination IP address is not local, it forwards the traffic to the default gateway, which then takes responsibility for getting the data to its final destination. Now that we understand how a device determines whether traffic stays local or needs to leave the network, we're ready to take a closer look at the default gateway and the role it plays in getting data where it needs to go.\n\nExam objective 2.6. Given a scenario, configure basic wired and wireless SOHO networks. Default gateway.\n\nA default gateway is a router or networking device that connects a local network to other networks, including the internet. You can think of it as the exit point for traffic that is not destined for the local area network. When a device wants to communicate with another device, it first uses the subnet mask to decide whether that destination is local.\n\nIf the destination is outside the local network, the device knows it cannot reach it directly. Instead, it forwards the traffic to the default gateway. The default gateway then takes responsibility for delivering that data beyond the local network.\n\nOnce the traffic reaches the gateway, it is forwarded to the appropriate external network, such as the internet or another connected network. This process allows devices on a local network to reach resources that do not exist within the same local area network. This is how everyday activities like visiting websites, streaming videos, sending emails, and downloading files are made possible.\n\nYour device does not need to know the exact path to the destination. It only needs to know that the traffic is not local and that the default gateway is responsible for handling it. When the requested data or response comes back, it follows the reverse path.\n\nThe default gateway receives the returning traffic from the external network and recognizes which internal device originally requested it. The gateway then forwards the data back to that device on the local network, completing the communication process. This back and forth handling of outgoing and incoming traffic is what allows multiple devices on the same local network to communicate with systems outside the network reliably and efficiently.\n\nIn most home and small office networks, the default gateway is typically a router. Devices are usually given the default gateway address automatically through DHCP along with their IP address and subnet mask. This automatic configuration allows devices to communicate both locally and externally without requiring any manual setup.\n\nIn some cases, the default gateway can also be configured manually by entering its IP address directly into a device's network settings. While this is less common in everyday home networks, it is important to understand that the default gateway is simply the device that handles traffic leaving the local network.", "uyghur": "Exam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي سىملىق ۋە سىمسىز SOHO تورلىرىنى تەڭشەڭ.\n\n## IP ئادرېس (IP Address)\n\n**IP** — **Internet Protocol** نىڭ قىسقارتىلمىسى.\n\n**IP address** — تورغا ئۇلانغان ئۈسكۈنىگە لوگىكىلىق شەكىلدە تەقسىم قىلىنىدىغان رەقەملىك تونۇتقۇچ.\n\nبۇ يەردىكى مۇھىم سۆز **تەقسىم قىلىنىدۇ (assigned)** دېگەن سۆز. مەنبە بويىچە IP address قاتتىق دېتالغا مەڭگۈلۈك ئويۇلۇپ قويۇلغان تونۇتقۇچ ئەمەس؛ ئۇ:\n- ئۆزگەرتىلىشى\n- قايتا تەقسىم قىلىنىشى\nمۇمكىن.\n\nھازىر مەنبە ئىككى خىل IP نەشرىنى قاپلايدۇ:\n- **IPv4 — Internet Protocol version 4**\n- **IPv6 — Internet Protocol version 6**\n\n### IPv4\n\nIPv4 — كونا ۋە كەڭ قوللىنىلغان IP نەشرى.\n\nIPv4 address نىڭ ئۇزۇنلۇقى:\n- **32 bit**\n\nمەنبە IPv4 نىڭ **dot-decimal notation** ئىشلىتىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n32 bit:\n- 4 گۇرۇپپىغا بۆلۈنىدۇ\n- ھەر بىر گۇرۇپپا **8 bit**\n- ھەر بىر 8-bit گۇرۇپپا **octet** دەپ ئاتىلىدۇ\n\nھەر بىر octet binary دىن decimal غا ئايلاندۇرۇلۇپ، نۇقتا (`.`) بىلەن ئايرىلىدۇ.\n\nھەر بىر octet نىڭ decimal قىممىتى:\n- **0 دىن 255 گىچە**\n\nمەنبە بويىچە بۇ IPv4 كە **4.2 مىلياردتىن كۆپرەك** رەقەملىك بىرىكمە تەمىنلەيدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **IPv4 = 32 bit = 4 octet = dot-decimal notation**\n\n### IPv6\n\nIPv6 address IPv4 تىن كۆپ ئۇزۇن.\n\nIPv6 address نىڭ ئۇزۇنلۇقى:\n- **128 bit**\n\nمەنبە بويىچە IPv6 address:\n- **8 گۇرۇپپا**\n- ھەر بىر گۇرۇپپىدا **4 hexadecimal digit**\n- گۇرۇپپىلار ئارىسىدا colon (`:`)\nبار.\n\nھەر بىر 4-hexadecimal-digit گۇرۇپپا:\n- **hextet**\n\nدەپمۇ ئاتىلىدۇ.\n\n**ئەستە تۇتۇڭ:**\n\n> **IPv6 = 128 bit = 8 hextet = hexadecimal + colon**\n\n### Static IP Address\n\n**Static IP address** — ئۈسكۈنىگە قولدا بېرىلىدىغان ۋە ۋاقىت ئۆتكەندىمۇ ئۆزگەرمەي تۇرىدىغان IP address.\n\nمەنبە static IP نى كۆپىنچە:\n- server\n- printer\n- باشقا دائىم بىر ئادرېستا تېپىلىشى كېرەك بولغان ئۈسكۈنە\nلارغا ماس دەپ چۈشەندۈرىدۇ.\n\nبۇ ئۈسكۈنىلەرنى باشقا network device لارنىڭ ئىزچىل بىر IP address ئارقىلىق تېپىشىغا ياردەم بېرىدۇ.\n\n### Dynamic IP Address\n\n**Dynamic IP address** — DHCP ئارقىلىق ئاپتوماتىك تەقسىم قىلىنىدىغان IP address.\n\n**DHCP — Dynamic Host Configuration Protocol**\n\nDevice تورغا ئۇلانغاندا:\n1. DHCP server دىن IP address ئالىدۇ.\n2. قولدا IP address كىرگۈزۈشنىڭ ھاجىتى قالمايدۇ.\n3. IP address لارنى ئۈنۈملۈك تەقسىملەش ئاسانلىشىدۇ.\n\nمەنبە بۇنى non-technical user ئۈچۈنمۇ قولايلىق دەپ چۈشەندۈرىدۇ؛ ئىشلەتكۈچى تور تەڭشەكلىرىنى قولدا بىلمىسىمۇ، device نى تورغا ئۇلىسا DHCP قالغان تەڭشەشنى ئاپتوماتىك قىلىدۇ.\n\n### Private IPv4 Address\n\n**Private IPv4 address** — local area network (LAN) ئىچىدە ئىشلىتىلىدىغان IPv4 address.\n\nمەنبەدىكى مىسال مۇھىت:\n- ئۆي تورى\n- كىچىك ئىشخانا تورى\n\nPrivate IPv4 address:\n- Internet دا بىۋاسىتە routable ئەمەس\n- internal communication ئۈچۈن ئىشلىتىلىدۇ\n\nمەنبە مىساللىرى:\n- workstation → printer\n- workstation → internal server\n\nمەنبە private IPv4 address لارنىڭ بەلگىلەنگەن reserved range لار ئىچىدە بولىدىغانلىقىنى ئېيتىدۇ.\n\n**Source-boundary note:** بۇ transcript پارچىسى private IPv4 range لارنىڭ رەقەملىرىنى ئۆزى يېزىپ بەرمەيدۇ؛ پەقەت سىندا «ئوڭ تەرەپكە قاراڭ» دەپ كۆرسىتىدۇ. شۇڭا reviewed Uyghur بۇ يەرگە سىرتقى مەنبەدىن range قوشمايدۇ.\n\n### Public IPv4 Address\n\n**Public IPv4 address** — Internet بىلەن بىۋاسىتە ئالاقە قىلىدىغان ئۈسكۈنىگە تەقسىم قىلىنىدىغان IPv4 address.\n\nمەنبە بويىچە:\n- بۇ address لار دۇنيا مىقياسىدا unique\n- Internet ئارقىلىق ئۈسكۈنىلەرنىڭ ئۆزئارا ئالاقە قىلىشىغا يول قويىدۇ\n- ISP (Internet Service Provider) public IP address تەقسىم قىلىدۇ\n\n### IP Address — تېز سېلىشتۇرۇش\n\n| ئۇقۇم | مەنبەدىكى ئاساسىي پەرق |\n|---|---|\n| **IPv4** | 32 bit، 4 octet، dot-decimal |\n| **IPv6** | 128 bit، 8 hextet، hexadecimal |\n| **Static IP** | قولدا بېرىلىدۇ، مۇقىم تۇرىدۇ |\n| **Dynamic IP** | DHCP ئارقىلىق ئاپتوماتىك بېرىلىدۇ |\n| **Private IPv4** | LAN ئىچىدە، Internet دا بىۋاسىتە routable ئەمەس |\n| **Public IPv4** | Internet بىلەن بىۋاسىتە ئالاقە ئۈچۈن، ISP تەقسىم قىلىدۇ |\n\nExam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي سىملىق ۋە سىمسىز SOHO تورلىرىنى تەڭشەڭ.\n\n## APIPA — Automatic Private IP Addressing\n\n**APIPA** — **Automatic Private IP Addressing** نىڭ قىسقارتىلمىسى.\n\nAPIPA — كومپيۇتېر DHCP ser
