tersections and signs to guide traffic, networks have switches to direct data packets, but switches are not the only devices used to control traffic.\n\nWe also have network routers. A network router is a network device that directs data packets between different computer networks. Yes, this is similar to a switch, with the exception that a switch directs traffic within a local area network, and a router controls data packets entering or leaving a local area network.\n\nBut how does a network router actually work? Well, when a device wants to send data to another device in a different network, it compiles a data packet. These data packets will contain a source IP address and a destination IP address.\n\nIf the data packet has a destination IP address that is not located within the current network, the data packet will then seek out the router. The router examines the packet's destination address, much like reading a street address, and determines the most efficient path for the data to reach its intended destination. To sum up a router, a router is a gateway sitting at the edge of a network's broadcast domain, controlling inbound and outbound connectivity to other networks.\n\nThese could be other directly attached local area networks, or more commonly, they are installed between a local area network and a wide area network connection, like the one provided by an internet service provider or ISP. To close out this video segment, I have one more device to cover, the SOHO router. Having just covered the topics of network switch, access point, and router, I figured now would be a great time to discuss how these devices fit into a smaller setting of a home or a small business environment.\n\nThe type of networking equipment used in a home or a small business environment can be described as SOHO, where SOHO stands for small office, home office. This particular type of network will calmly utilize a multifunction network device referred to as a SOHO router, but don't let the name fool you. Though similar in some aspects, this is not like the enterprise grade router we studied earlier in this exam objective.\n\nA SOHO router can perform routing functions, but that is not all it can do. So let's break down the main components that make up a SOHO router. First up, we have the network switch.\n\nYou may recall that a network switch is a network device that connects multiple devices within a local area network. And yes, the SOHO router has a built-in network switch. It may not have as many ports as an enterprise switch, but it will still function the same.\n\nThe SOHO router displayed here can only connect four computing devices together in an ethernet LAN. The switch ports are the yellow RG45 ports located inside box number one. Next, we have the access point.\n\nAs a refresher, the access point is a network device that allows wireless communications between devices in a network. And yes, the SOHO router has a built-in access point too. It may not support as many wireless clients as an enterprise access point, but it will still function the same.\n\nThe SOHO router displayed here has an antenna in side box number two that can transmit and receive wifi signals. Lastly, let's talk about the router itself. The router is the gateway between your SOHO network and the internet or ISP.\n\nThat is where box number three comes in. This is your wide area network or WAN connection. Pretty cool how a SOHO router seamlessly integrates all these components into one compact device.\n\nIf you are dealing with a limited number of computing devices in your network, a SOHO router would be the perfect choice to provide network connectivity. Exam objective 2.5, compare and contrast common networking hardware devices. Patch panel.\n\nThis video segment will cover an unsung hero in the networking world, the patch panel. A patch panel is a device containing ports used to manage and organize cable connections. It is a central location in a building's network system where all the network cables converge.\n\nIt's typically a flat panel with numerous ports where network cables are plugged in. These panels provide a convenient and organized way of managing cable connections from different rooms or areas in a building in order to provide a connection to network devices like switches and routers. So how does a patch panel function?\n\nThink of it as a switchboard operator. When a network cable from a computer or another device is connected to the panel, it doesn't directly communicate with other devices. Instead, it connects to another port that leads to a network switch or router.\n\nThis setup allows for easy management of cable connections. If a device needs to be moved or connected to a different network segment, it's simply a matter of changing the patch cable connections at the panel rather than rerunning the entire cable. In the realm of networking, a patch panel is a key component in ensuring both organization and flexibility.\n\nCommonly found in server rooms or network closets, its primary role is to centralize all network cables from various endpoints into a single manageable location. This centralization simplifies many aspects of network management. Firstly, it streamlines the troubleshooting process.\n\nWith all cables leading to one point, identifying and resolving issues becomes much easier and quicker as there's no need to trace individual cables through complex and often inaccessible routes. Secondly, when it comes to network maintenance or reconfiguration, a patch panel is invaluable. Adjustments, whether adding new devices or changing network layouts, can be done efficiently at the panel without the need to disturb the entire cable setup.\n\nMoreover, a patch panel helps in protecting the network's physical integrity. By reducing the frequency of handling the actual network cables and devices, wear and tear are minimized. This leads to a more stable and durable network setup, enhancing overall network performance and longevity.\n\nExam objective 2.5, compare and contrast common networking hardware devices. Power over Ethernet. Power over Ethernet, or PoE, is a technology standard that allows network cables to simultaneously transmit data and power using a single network cable.\n\nIn simpler terms, PoE enables a single cable to provide both a data connection and electrical power to devices such as wireless access points, IP cameras, and voice over IP phones. This means that instead of needing two separate cables, one for power and one for data, PoE allows you to use just one Ethernet cable for both purposes. So how does PoE function?\n\nThere are two primary ways through a PoE switch or a PoE injector. A PoE switch is a network switch that has the ability to provide power over Ethernet to connected devices. When a compatible device is connected to a PoE enabled port, the switch detects it and automatically provides the appropriate power.\n\nOn the other hand, a PoE injector is used when you don't have a PoE switch. It's a small device that adds power to the Ethernet cable and can be placed between the switch and the device to provide power along with the data. Now, when working with PoE, there are various PoE standards that you should be aware of, with the most common being 802.3af, 802.3at, and 802.3bt.\n\nThe 802.3af standard, often referred to as just PoE, can deliver up to 15.4 watts of power per port. In contrast, the 802.3at standard, known as PoE+, provides up to 30 watts per port. More recently, the 802.3bt standard, also known as PoE++, has been introduced.\n\nThis latest standard can deliver even higher power over Ethernet, up to 60 watts per port with Type 3 devices and up to 90 watts with Type 4 devices. These varying standards are designed to ensure that devices and power sources can work together safely and effectively. Just be sure to match the power source with the power requirements of the connected device to avoid any compatibility issues and to ensure efficient operation.\n\nExam objective 2.5, compare and contrast common networking hardware devices. Network firewall. Let's imagine our computer network as a fortress.\n\nJust like a fortress has protective barriers and guards, a computer network needs a way to safeguard against unwanted intrusions and threats. This is where network firewalls come into play. A network firewall is a network security device that monitors and controls incoming and outgoing network traffic.\n\nSo, how does a network firewall work? Well, it performs a data packet inspection for each packet that tries to pass through it, inspecting its source address, destination address, and content. It compares this information against a set of predefined security rules and policies.\n\nWhen a data packet arrives at the firewall, it undergoes a thorough evaluation against these security rules. If the data packet aligns with the allowed parameters set in the security rules, the firewall permits it to pass through. This enables legitimate data to flow uninterrupted towards its intended destination, maintaining the network's operational efficiency and communication needs.\n\nConversely, if a data packet is found to be in violation of any of the established security rules, the firewall blocks the offending packet from entering or exiting the network. By preventing these harmful data packets from penetrating or leaving the network, the firewall plays an integral role in maintaining the overall security integrity of the network infrastructure. The security rules and policies used by network firewalls are often implemented using a mechanism known as an access control list or ACL.\n\nAn ACL defines the specific criteria that determines whether network traffic will be allowed or denied by the firewall. Access control lists are essentially a set of rules that dictate what types of network traffic are permitted and what types should be blocked. As a data packet is received by a network firewall, the network firewall will compare the data packet against the security rules listed in its access control list.\n\nIf the data packet does not match any of the allow rules in the access control list, the data packet will be denied. Then the next packet can be processed. The network firewall will again compare the data packet against the security rules listed in its access control list.\n\nIf the data packet matches an allow rule in the access control list, the data packet will be permitted and forwarded on. Exam objective 2.5, compare and contrast common networking hardware devices. Modern modems.\n\nHold on one second while I try to connect. Just kidding. Some of you may have recognized that sound, but if you didn't, that was an old school dial-up modem attempting to connect to an internet service provider.\n\nDial-up used to be very common and very slow. Fortunately, today we have a few more modern connection methods available to us, each using their own special type of modem. Depending on the transmission medium and service connection type in use, there are many different types of modems that can be deployed.\n\nTo ease into this topic, I will start with a basic definition. In networking, a modem, short for modulator demodulator, is a networking device that converts data from one signaling format to another so it can travel between a local network and an internet service provider. Now, before I go any further, I want to remind you that this course builds upon the topics covered in the CompTIA Tech+ certification exam.\n\nSpecific to this video segment, you should have the prerequisite knowledge of electrical signals, as well as a basic understanding of cable, DSL, and fiber optic communications, all of which can be found in our free CompTIA Tech+ training course. With that said, I will now talk about cable modems. A cable modem modulates and demodulates cable TV signals to provide internet access.\n\nYour internet service provider sends internet data in one format that the cable modem then converts into another format that your computer or network can understand. This also happens in reverse for outgoing data. As for making a connection, a cable modem connects to your home through the same coaxial cable that brings in cable TV.\n\nIt plugs into a cable outlet on one end and to a computer or router on the other end, usually via an ethernet cable. Next, we have a digital subscriber line or DSL modem. DSL uses a separate frequency band on a traditional phone line for internet data transmissions, so you can use the internet and phone simultaneously.\n\nThe DSL modem modulates internet data into high-frequency signals for transmission over the telephone lines and demodulates incoming signals back into a format that your computer or network can comprehend. Hooking up a DSL modem involves connecting to the internet through your home's telephone line. It plugs into a telephone jack using a DSL filter into a computer or router via an ethernet cable.\n\nLastly, we have an optical network terminal or ONT. An ONT converts the optical signals transmitted via a fiber optic cable into electrical ethernet signals that your computer network can utilize. This is similar to how DSL and cable modems work, but uses light signals instead of electrical signals over copper lines.\n\nAn ONT is used exclusively with fiber optic internet connections. In order to provide a connection, the ONT connects to the ISP's fiber optic network on one end and to your computer network on the other end. Exam objective 2.5, compare and contrast common networking hardware devices.\n\nNIC. A NIC, short for network interface card, is a common networking component that allows a computing device to connect to a network or another computing device. It acts as the communication link that enables data to be sent and received.\n\nThe primary function of a NIC is to convert the digital data generated by a device into an electrical or optical signal for transmission, and then convert incoming signals back into digital data that the device can understand. NICs come in many forms and support different ways of connecting to a network. Broadly speaking, they fall into two main categories, wired and wireless.\n\nWired NICs use physical cables, such as ethernet cables, to establish a network connection. This direct connection typically provides faster speeds, lower latency, and greater reliability. Because wired connections are less susceptible to interference and signal loss, wired NICs are commonly used in environments where stable and consistent performance is critical, such as offices, data centers, and gaming sabs.\n\nWireless NICs, on the other hand, use wireless technologies such as Wi-Fi, Bluetooth, NFC, or cellular connections. These NICs allow devices to connect to networks without physical cabling, providing flexibility and mobility. While wireless NICs offer convenience, they can be affected by interference, signal strength, and environmental factors, which may result in lower or less consistent performance compared to wired connections.\n\nWireless NICs are ideal for mobile devices like laptops, smartphones, and tablets, or in situations where running cables is not practical. NICs can also be classified based on how they are installed in a system. Some NICs are integrated, meaning they are built directly into the motherboard.\n\nThese are often referred to as onboard NICs. Integrated NICs require no additional installation and work right out of the box, but they offer limited upgrade options if your networking needs change. Other NICs are add-on or expansion cards.\n\nThese NICs are installed separately and can be easily replaced or upgraded. If a system requires a faster connection, a different network type or improved features, an add-on NIC allows for flexibility without replacing the entire motherboard. In addition to providing physical or wireless connectivity, every NIC is also associated with a unique identifier that distinguishes it from every other network interface in the world.\n\nThis identifier plays a critical role in how devices communicate on a network, and that brings us directly into the topic we will cover in the next video segment, MAC addresses. Exam objective 2.5, compare and contrast common networking hardware devices. MAC address.\n\nWe just finished talking about network interface cards or NICs and how they allow devices to connect to a network. Every NIC also comes with something equally important built into it, a MAC address. MAC stands for media access control, and a MAC address is a unique hardware identification address assigned to a network interface at the time it is manufactured.\n\nYou can think of it as a digital fingerprint for the NIC. Any device that can connect to a network, whether it is a computer, smartphone, printer, or network device, has at least one MAC address associated with its network interface. A helpful comparison is a vehicle identification number, or VIN.\n\nJust like no two cars are supposed to have the same VIN, no two network interfaces should share the same MAC address. MAC addresses are written using the hexadecimal numbering system, which uses the numbers zero through nine and the letters A through F. A standard MAC address is made up of 12 hexadecimal characters, which represents 48 bits in total.\n\nThe MAC address itself is divided into two main parts. The first half is called the organizationally unique identifier, often abbreviated as OUI. This portion identifies the manufacturer of the network interface card.\n\nThe second half is assigned by the manufacturer and uniquely identifies that specific network interface. Together, these two sections ensure that MAC addresses are globally unique. This uniqueness is essential for network communication.\n\nImagine trying to deliver mail in a neighborhood where two houses have the exact same address. The mail carrier would have no idea where the letter belongs. The same problem would occur on a network if two devices shared the same MAC address.\n\nNetwork devices would not know which interface should receive the data. Now, you might be wondering, how are MAC addresses used? Well, MAC addresses play a vital role in the communication between devices on a local area network or LAN.\n\nWhen you send data from your device to another device within the same local area network, the MAC address is used to identify the intended recipient. It helps ensure that your message reaches the correct destination. So why don't we look at this in action?\n\nFirst, we need a data packet to be sent. Luckily, the workstation in the top left of our diagram has a data packet to send to another device in our local area network. Now the workstation needs to encapsulate the data to be sent into an ethernet frame.\n\nThe ethernet frame will include the destination MAC address or the MAC address of the device the workstation will be sending the data packet to. The ethernet frame will also include the workstation's own MAC address, known as the source MAC address, and finally, the data or payload that will be sent with this packet. Next, the data packet will then be sent out of the workstation's network interface card to the network switch.\n\nThe switch will determine which network path is to be used to reach the device matching our destination MAC address in the ethernet frame. And if everything goes right, our data packet will finally be delivered. All thanks to the help of MAC addresses.", "uyghur": "Exam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Common Networking Hardware\n\n### Hub\n\nNetwork hub بىر نەچچە computer ياكى network device نى ئۇلايدىغان ئاددىي، كونا network device.\n\nHub بىر device دىن data قوبۇل قىلسا، ئۇنى **بارلىق connected device** غا broadcast قىلىدۇ.\n\nبۇنى ئۆيدىكى ھەممە ئادەمگە بىرلا ۋاقىتتا ئاڭلىتىدىغان speaker غا ئوخشىتىشقا بولىدۇ.\n\nDestination نى پەرقلەندۈرمەي بارلىق device قا data يوللىغاچقا:\n- inefficient\n- security تۆۋەن\n\nSwitch غا ئوخشاش advanced device لارغا قارىغاندا ناچار، شۇڭا hub ھازىر كۆپىنچە obsolete.\n\n### Network Switch\n\nزامانىۋى LAN نىڭ مەركىزىدە ئادەتتە network switch بار.\n\nSwitch LAN ئىچىدە:\n- computer\n- printer\n- server\n- باشقا end device\nلارنى بىر-بىرىگە ئۇلايدۇ.\n\nHub غا ئوخشىمايدۇ؛ data نى intelligently intended recipient قا forward قىلىدۇ.\n\nبۇنى traffic controller غا ئوخشىتىشقا بولىدۇ.\n\nEthernet cable/CAT cable ئارقىلىق end device switch port قا ئۇلىنىدۇ ۋە Ethernet protocol ئىشلىتىدۇ.\n\nDevice LAN ئىچىدىكى باشقا device قا data يوللىغاندا data:\n- destination address\n- source address\n- payload\nبىلەن packet/frame غا encapsulate قىلىنىدۇ.\n\nEthernet دا بۇ encapsulated unit **Ethernet frame** دەپ ئاتىلىدۇ.\n\nSwitch destination address نى تەكشۈرۈپ، intended device قا بارىدىغان توغرا port/path نى تاللايدۇ.\n\n### Unmanaged Switch\n\n- basic connectivity\n- configuration تەلەپ قىلمايدۇ\n- plug-and-play\n- small office/home office غا ماس\n- ئادەتتە 4 ياكى 8 port\n\n### Managed Switch\n\n- large/complex network ئۈچۈن\n- default تا unmanaged switch غا ئوخشاش ئىشلىيەلەيدۇ، ئەمما configure قىلىش ئىمكانى بار\n- advanced security\n- traffic control\n- traffic type segmentation، مەسىلەن voice traffic\n- enterprise environment تا كۆپ ئىشلىتىلىدۇ\n- 24، 48 ياكى ئۇنىڭدىن كۆپ port بولۇشى مۇمكىن\n\n### Access Point — AP\n\nWireless Access Point wireless device لارنىڭ network قا ئۇلىنىشىغا يول قويىدىغان network device.\n\nLaptop، smartphone قاتارلىق Wi-Fi-enabled device لارنى network قا ئۇلايدۇ.\n\nHome، office ۋە public space تا wireless connectivity تەمىنلەيدۇ.\n\nAP نى **wireless version of a switch** دەپ قاراشقا بولىدۇ.\n\nئۇ wireless device بىلەن wired/local network ئارىسىدا bridge رولىنى ئوينايدۇ.\n\nAP:\n- wireless device دىن data packet قوبۇل قىلىپ network قا يەتكۈزىدۇ\n- network دىن data قوبۇل قىلىپ connected wireless device قا يوللايدۇ\n\nUser Wi-Fi نى ئاچقاندا available network نى scan قىلىدۇ، AP نى بايقىسا ئۇلىنىدۇ. ئۇلانغاندىن كېيىن wired network دىكىگە ئوخشاش network resource ۋە باشقا device بىلەن communication قىلالايدۇ.\n\n### Router\n\nRouter **ئوخشىمىغان computer network لار ئارىسىدا** data packet نى route قىلىدىغان network device.\n\nSwitch بىلەن مۇھىم پەرق:\n- **Switch:** LAN ئىچىدىكى traffic نى باشقۇرىدۇ\n- **Router:** بىر network دىن يەنە بىر network قا كىرىدىغان/چىقىدىغان traffic نى باشقۇرىدۇ\n\nPacket تا:\n- source IP address\n- destination IP address\nبولىدۇ.\n\nئەگەر destination current network ئىچىدە بولمىسا packet router غا بارىدۇ. Router destination IP نى تەكشۈرۈپ، data نىڭ intended destination غا بېرىشتىكى ئەڭ مۇۋاپىق path نى تاللايدۇ.\n\nRouter network broadcast domain نىڭ چېتىدىكى **gateway** بولۇپ، inbound/outbound connectivity نى control قىلىدۇ.\n\nئۇ:\n- باشقا directly attached LAN،\n- ياكى كۆپىنچە LAN بىلەن ISP تەمىنلىگەن WAN/Internet ئارىسىدا\nتۇرىدۇ.\n\n### SOHO Router — Small Office/Home Office\n\nSOHO router home ياكى small-business network ئۈچۈن multifunction network device.\n\nEnterprise router غا ئوخشاش پەقەت routing قىلىپلا قالمايدۇ؛ ئادەتتە بىر device ئىچىگە تۆۋەندىكى component لار بىرلەشتۈرۈلگەن:\n\n1. **Built-in network switch** — Ethernet LAN دىكى wired device لارنى ئۇلايدۇ.\n2. **Built-in wireless access point** — Wi-Fi client لارنى ئۇلايدۇ.\n3. **Router/WAN gateway** — SOHO network نى ISP/Internet قا ئۇلايدۇ.\n\nDevice سانى چەكلىك home/small-office مۇھىتىغا قولايلىق ۋە compact solution.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Patch Panel\n\nPatch panel نۇرغۇن port لىرى بار بولۇپ، cable connection لارنى manage ۋە organize قىلىدىغان device.\n\nBuilding network تا ھەر خىل room/area دىن كەلگەن network cable لار مەركىزىي بىر جايدا مۇشۇ panel غا يىغىلىدۇ.\n\nPatch panel ئۆزى switch غا ئوخشاش data switching قىلمايدۇ. End-device cable panel port غا كېلىدۇ؛ patch cable ئارقىلىق باشقا port/network switch/router غا ئۇلىنىدۇ.\n\nئەۋزەللىكى:\n- cable management رەتلىك بولىدۇ\n- troubleshooting ئاسانلىشىدۇ\n- device نى باشقا network segment قا يۆتكەشتە پۈتۈن cable نى قايتا تارتىشنىڭ ئورنىغا panel دىكى patch connection نى ئۆزگەرتىش يېتەرلىك\n- maintenance/reconfiguration ئاسان\n- actual permanent cable نى دائىم قولغا ئالماسلىق ئارقىلىق wear and tear ئازىيىدۇ\n- network physical stability ۋە longevity ياخشىلىنىدۇ\n\nكۆپىنچە server room ياكى network closet تا ئۇچرايدۇ.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## PoE — Power over Ethernet\n\nPoE بىرلا Ethernet cable ئارقىلىق **data + electrical power** نى بىر ۋاقىتتا يەتكۈزۈشكە يول قويىدىغان standard.\n\nمەسىلەن:\n- wireless access point\n- IP camera\n- VoIP phone\n\nئادەتتە power cable + data cable ئىككىسىنىڭ ئورنىغا بىرلا Ethernet cable ئىشلىتىلىدۇ.\n\n### PoE Switch\n\nPoE-enabled switch compatible device ئۇلانغاندا ئۇنى detect قىلىپ مۇۋاپىق power تەمىنلەيدۇ.\n\n### PoE Injector\n\nPoE switch يوق بولسا injector switch بىلەن end device ئارىسىغا قويۇلۇپ Ethernet cable غا power قوشىدۇ.\n\n### PoE Standards\n\n- **802.3af — PoE:** 15.4 W غىچە / port\n- **802.3at — PoE+:** 30 W غىچە / port\n- **802.3bt — PoE++:** Type 3 دا 60 W غىچە، Type 4 دا 90 W غىچە\n\nPower source نى connected device نىڭ power requirement ىغا ماسلاشتۇرۇش compatibility ۋە safe/efficient operation ئۈچۈن مۇھىم.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Network Firewall\n\nNetwork firewall incoming ۋە outgoing network traffic نى monitor ۋە control قىلىدىغان network-security device.\n\nئۇنى network قورغىنىنىڭ دەرۋازىسى/قوغدىغۇچىسى دەپ قاراشقا بولىدۇ.\n\nFirewall ھەر packet نى inspection قىلىپ:\n- source address\n- destination address\n- content/other packet information\nنى predefined security rule/policy بىلەن سېلىشتۇرىدۇ.\n\n- Rule allow قىلسا → packet pass قىلىدۇ.\n- Rule غا خىلاپ بولسا → packet block قىلىنىدۇ.\n\nبۇ legitimate traffic نىڭ نورمال ئېقىشىغا يول قويۇپ، harmful/unauthorized traffic نىڭ network قا كىرىشى ياكى چىقىشىنى توسۇشقا ياردەم بېرىدۇ.\n\n### ACL — Access Control List\n\nFirewall rule/policy كۆپىنچە **ACL** ئارقىلىق ئىجرا قىلىنىدۇ.\n\nACL — قايسى network traffic allow، قايسىسى deny قىلىنىدىغانلىقىنى بەلگىلەيدىغان rule لار تىزىملىكى.\n\nPacket firewall غا كەلگەندە ACL rule بىلەن سېلىشتۇرۇلىدۇ:\n- allow rule غا ماس كەلسە forward قىلىنىدۇ\n- allow rule غا ماس كەلمىسە source دا بايان قىلىنغان logic بويىچە deny قىلىنىدۇ\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Modern Modems\n\nModem — **modulator/demodulator** — data نى بىر signaling format دىن يەنە بىرىگە ئايلاندۇرۇپ local network بىلەن ISP ئارىسىدا يەتكۈزۈشكە ياردەم بېرىدىغان network device.\n\nConnection medium/service تۈرىگە قاراپ modem تۈرى پەرقلىق.\n\n### Cable Modem\n\nCable TV signal نى modulate/demodulate قىلىپ Internet access تەمىنلەيدۇ.\n\nISP دىن كەلگەن Internet data نى computer/network چۈشىنىدىغان format قا ئايلاندۇرىدۇ؛ outgoing data دا جەريان ئەكسىچە بولىدۇ.\n\nConnection:\n- ISP/home تەرەپتە coaxial cable\n- local computer/router تەرەپتە ئادەتتە Ethernet\n\n### DSL Modem — Digital Subscriber Line\n\nDSL traditional telephone line دىكى ئايرىم high-frequency band نى Internet data ئۈچۈن ئىشلىتىدۇ، شۇڭا telephone بىلەن Internet نى بىر ۋاقىتتا ئىشلىتىشكە بولىدۇ.\n\nDSL modem Internet data نى telephone line دا يەتكۈزۈشكە high-frequency signal غا modulate قىلىدۇ؛ incoming signal نى computer/network چۈشىنىدىغان format قا demodulate قىلىدۇ.\n\nConnection ئادەتتە telephone jack/DSL filter دىن modem غا، ئاندىن Ethernet ئارقىلىق computer ياكى router غا.\n\n### ONT — Optical Network Terminal\n\nONT fiber-optic cable ئارقىلىق كەلگەن **optical/light signal** نى computer network ئىشلىتىدىغان electrical Ethernet signal غا ئايلاندۇرىدۇ.\n\nCable/DSL modem غا function جەھەتتىن ئوخشايدۇ، ئەمما copper electrical signal نىڭ ئورنىغا light signal ئىشلىتىدۇ.\n\nONT پەقەت fiber-optic Internet connection بىلەن ئىشلىتىلىدۇ.\n\nبىر تەرەپتە ISP fiber network، يەنە بىر تەرەپتە local computer network غا ئۇلىنىدۇ.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## NIC — Network Interface Card\n\nNIC computing device نىڭ network ياكى باشقا computing device قا ئۇلىنىشىغا يول قويىدىغان network component.\n\nئۇ device نىڭ communication link ى بولۇپ data نى send/receive قىلىشقا ياردەم بېرىدۇ.\n\nNIC نىڭ ئاساسلىق function ى:\n- device generated digital data نى transmission ئۈچۈن electrical ياكى optical signal غا ئايلاندۇرۇش\n- incoming signal نى device چۈشىنىدىغان digital data غا قايتۇرۇش\n\n### Wired NIC\n\nEthernet cable قاتارلىق physical cable ئىشلىتىدۇ.\n\nئادەتتە:\n- faster speed\n- lower latency\n- higher reliability\n\nInterference ۋە signal loss ئاز بولغاچقا office، data center، gaming setup قاتارلىق stable performance مۇھىم مۇھىتتا ياخشى.\n\n### Wireless NIC\n\nWi-Fi، Bluetooth، NFC ياكى cellular قاتارلىق wireless technology ئىشلىتىدۇ.\n\nئەۋزەللىكى:\n- flexibility\n- mobility\n- cable يوق\n\nئەمما:\n- interference\n- signal strength\n- environment\nنىڭ تەسىرىگە ئۇچراپ، wired connection غا قارىغاندا performance تۆۋەن ياكى inconsistent بولۇشى مۇمكىن.\n\nLaptop، smartphone، tablet ۋە cable تارتىش قىيىن جايلارغا ماس.\n\n### Integrated vs Add-on NIC\n\n**Integrated / Onboard NIC:**\n- motherboard قا built-in\n- additional installation كېرەك ئەمەس\n- upgrade option چەكلىك\n\n**Add-on / Expansion NIC:**\n- ئايرىم card سۈپىتىدە install قىلىنىدۇ\n- replace/upgrade ئاسان\n- faster connection، باشقا network type ياكى feature كېرەك بولسا motherboard نى ئالماشتۇرماي upgrade قىلغىلى بولىدۇ\n\nھەر NIC قا unique identifier باغلانغان؛ ئۇ **MAC address**.\n\nExam Objective 2.5\nكۆپ ئۇچرايدىغان networking hardware device لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## MAC Address — Media Access Control Address\n\nMAC address NIC/network interface قا manufacturing ۋاقتىدا بېرىلىدىغان **unique hardware identification address**.\n\nئۇنى NIC نىڭ «digital fingerprint» ى دەپ قاراشقا بولىدۇ.\n\nComputer، smartphone، printer ياكى network device بولسۇن، network interface بار ھەر device دا كەم دېگەندە بىر MAC address بولىدۇ.\n\nبۇنى vehicle VIN غا ئوخشىتىشقا بولىدۇ: ئىككى ماشىنىنىڭ VIN ى ئوخشاش بولماسلىقى كېرەك بولغاندەك، ئىككى network interface نىڭ MAC address ىمۇ ئوخشاش بولماسلىقى كېرەك.\n\nMAC address **hexadecimal** numbering system دا يېزىلىدۇ، يەنى:\n- 0–9\n- A–F\nھەرپ/سانلىرى ئىشلىتىلىدۇ.\n\n### MAC Address نىڭ قۇرۇلمىسى\n\nStandard MAC address **12 hexadecimal character = 48 bit**.\n\nئۇ ئىككى ئاساسىي بۆلەككە بۆلۈنىدۇ:\n\n1. **OUI — Organizationally Unique Identifier**\n   - MAC address نىڭ ئالدىنقى يېرىمى\n   - NIC/network-interface manufacturer نى identify قىلىدۇ\n\n2. **Manufacturer-assigned unique portion**\n   - كېيىنكى يېرىمى\n   - شۇ specific network interface نى unique identify قىلىدۇ\n\nبۇ ئىككى بۆلەك بىرلىكتە MAC address نىڭ global unique بولۇشىغا ياردەم بېرىدۇ.\n\nUnique MAC address LAN communication ئۈچۈن مۇھىم. ئىككى ئۆينىڭ address ى ئوخشاش بولسا postman قايسى ئۆيگە خەت بېرىشنى بىلمەيدىغاندەك، ئىككى network interface ئوخشاش MAC address ئىشلەتسە network device data نى قايسى interface قا يەتكۈزۈشنى بىلەلمەيدۇ.\n\n### LAN دا MAC Address قانداق ئىشلىتىلىدۇ؟\n\nLAN ئىچىدە بىر device دىن يەنە بىر device قا data يوللىغاندا intended recipient نى identify قىلىشتا MAC address ئىشلىتىلىدۇ.\n\nEthernet frame ئادەتتە:\n- destination MAC address\n- source MAC address\n- data/payload\nنى ئۆز ئىچىگە ئالىدۇ.\n\nWorkstation frame نى NIC ئارقىلىق switch قا يوللايدۇ. Switch destination MAC address نى كۆرۈپ، شۇ MAC قا ماس device قا بارىدىغان port/path نى تاللايدۇ ۋە frame نى توغرا destination غا يەتكۈزىدۇ."}, {"id": "2.6", "number": "2.6", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.6. Given a scenario, configure basic wired and wireless SOHO networks. IP address.\n\nBy the end of this video segment, you will have a basic understanding of what an IP address is and how it functions in the world of networking. So let's get to it. First up is to define what an IP address is.\n\nIP stands for Internet Protocol. And an IP address is a unique numerical identifier assigned to every device connected to a network. Within this definition, the keyword is assigned as an IP address is logically assigned, can be changed and even reassigned as needed.\n\nCurrently, there are two versions of IP addresses in use. IPv4 and IPv6. IPv4, which stands for Internet Protocol version four, is the older and more widely adopted version.\n\nAn IPv4 address identifies a device in an Internet Protocol version four or an IPv4 network. It is worth noting that IPv4 addresses use a specific type of notation called dot decimal notation. Dot decimal notation is a way of displaying a big number in manageable chunks.\n\nIn the case of an IPv4 address, each address is 32 binary digits long. This is a bit difficult to understand. So let's group this 32 binary digit address into different containers that are separated by dots.\n\nThis will create four sets of eight binary digits, also known as octets. Next, we will convert each octet from binary to their decimal value equivalents, resulting in a dot decimal notation that is much easier to read. With this dot decimal notation, each octet can range from zero to 255, providing us with over 4.2 billion numerical combinations.\n\nIPv6 addresses are considerably longer than an IPv4 address at 128 binary digits long. IPv6 addresses also use a different addressing scheme. IPv6 addresses include eight groups of four hexadecimal digits separated by colons.\n\nEach group of four hexadecimal digits can also be called a hextet. Next, let's explore how IP addresses are assigned to devices. There are two main methods, static and dynamic.\n\nA static IP address is manually assigned to a device and remains constant over time. This is often used for servers, printers, or other devices that need a persistent unchanging address in order to be consistently located by other devices. On the other hand, dynamic IP addresses are automatically assigned by a service called DHCP, which stands for Dynamic Host Configuration Protocol.\n\nWith dynamic addressing using DHCP, a device receives an IP address from a DHCP server when it connects to the network. This dynamic addressing using DHCP allows for efficient assignment and use of IP addresses. Additionally, dynamic IP addressing using DHCP simplifies the process of getting connected to a network for non-technical users.\n\nInstead of manually configuring IP addresses, DHCP automatically assigns an IP address to a device when it connects to the network. This eliminates the need for users to have prior knowledge of networking or IP addressing, making it more user-friendly and convenient. Non-technical users can simply connect their devices to the network and DHCP takes care of the rest.\n\nNow let's look at private and public IPv4 addresses. Private IPv4 addresses are used within local area networks, such as a home or small office. These addresses are not routable on the internet and are meant for internal communication, like a workstation connecting to a printer or accessing an internal server.\n\nPrivate IPv4 addresses fall within specific reserve ranges and any address within those ranges is restricted to use inside a local area network. For a list of private IPv4 ranges, just look to the right. Public IPv4 addresses behave a bit differently.\n\nThey are assigned to devices that connect directly to the internet. These addresses are unique globally and allow devices to communicate with each other across the internet. Internet service providers, or ISPs, assign public IP addresses to devices connected to their network.\n\nNow this is a video segment that might be worth watching a couple of times. We covered the definition of an IP address, the different IP protocols version four and version six, static and dynamic IP address assignment, and the difference between private and public IP addresses. Great job.\n\nExam objective 2.6, given a scenario, configure basic wired and wireless SOHO networks. APIPA, APIPA stands for automatic private IP addressing. It's a mechanism used to automatically assign a self-configured IP address to a computer.\n\nThis happens when the computer fails to obtain an IP address from a dynamic host configuration protocol or DHCP server. When a computer tries and fails to get an IP address the usual way through DHCP, it activates APIPA, which then assigns a temporary self-generated IP address. This is a bit like a backup plan to ensure that the computer's network interface is always operational.\n\nThis automatic assignment is vital in networking as it keeps devices connected and able to communicate with each other, even when there are issues with the DHCP server. The range of IP addresses reserved for APIPA extends from 169.254.0.1 through 169.254.255.254. This range is set aside specifically for this automatic addressing and is recognized across all systems that support APIPA.\n\nHaving this reserved range ensures that devices can self-assign an address that's unlikely to conflict with addresses assigned by a DHCP server. With troubleshooting in mind, let's discuss one of the most common reasons why a device obtains an APIPA address. The primary reason is the inability to reach a DHCP server.\n\nThis could be due to the server being offline, network congestion or issues with the network infrastructure such as faulty cables or incorrect network settings. When a computer boots up and requests an IP address but receives no response from a DHCP server, it defaults to assigning itself an APIPA address. Now, having an APIPA address will come with certain restrictions.\n\nThe most significant limitation is the lack of internet connectivity. Devices with APIPA addresses can communicate with other devices on the same local network segment that also have APIPA addresses, but they cannot access external networks, including the internet. This is because APIPA is designed for local network communication only and routers typically do not forward traffic originating from APIPA addresses to other networks.\n\nExam objective 2.6. Given a scenario, configure basic wired and wireless SOHO networks. Subnet mask.\n\nWhen a device connects to a network, it is not given just an IP address. There are several network settings that work together to allow proper communication. And one of the most important of these is the subnet mask.\n\nA subnet mask is a value that works alongside an IP address to determine the range of IP addresses that are considered part of the same local area network. In simple terms, the subnet mask helps a device decide whether another device is on the same local network or a part of another network. Think of the subnet mask like a neighborhood boundary drawn on a map.\n\nThe subnet mask defines exactly which houses belong to your neighborhood and which ones do not. If another house falls within that boundary, you can walk next door and deliver a message directly. In networking terms, that means your device can communicate straight to another device on the same local area network without any extra help.\n\nHowever, if the house is outside your neighborhood boundary, you cannot reach it directly. Instead, you have to go through a main road that leads out of the neighborhood. In a network, that main road is the default gateway.\n\nWhen a device determines, using the subnet mask, that a destination IP address is not local, it forwards the traffic to the default gateway, which then takes responsibility for getting the data to its final destination. Now that we understand how a device determines whether traffic stays local or needs to leave the network, we're ready to take a closer look at the default gateway and the role it plays in getting data where it needs to go.\n\nExam objective 2.6. Given a scenario, configure basic wired and wireless SOHO networks. Default gateway.\n\nA default gateway is a router or networking device that connects a local network to other networks, including the internet. You can think of it as the exit point for traffic that is not destined for the local area network. When a device wants to communicate with another device, it first uses the subnet mask to decide whether that destination is local.\n\nIf the destination is outside the local network, the device knows it cannot reach it directly. Instead, it forwards the traffic to the default gateway. The default gateway then takes responsibility for delivering that data beyond the local network.\n\nOnce the traffic reaches the gateway, it is forwarded to the appropriate external network, such as the internet or another connected network. This process allows devices on a local network to reach resources that do not exist within the same local area network. This is how everyday activities like visiting websites, streaming videos, sending emails, and downloading files are made possible.\n\nYour device does not need to know the exact path to the destination. It only needs to know that the traffic is not local and that the default gateway is responsible for handling it. When the requested data or response comes back, it follows the reverse path.\n\nThe default gateway receives the returning traffic from the external network and recognizes which internal device originally requested it. The gateway then forwards the data back to that device on the local network, completing the communication process. This back and forth handling of outgoing and incoming traffic is what allows multiple devices on the same local network to communicate with systems outside the network reliably and efficiently.\n\nIn most home and small office networks, the default gateway is typically a router. Devices are usually given the default gateway address automatically through DHCP along with their IP address and subnet mask. This automatic configuration allows devices to communicate both locally and externally without requiring any manual setup.\n\nIn some cases, the default gateway can also be configured manually by entering its IP address directly into a device's network settings. While this is less common in everyday home networks, it is important to understand that the default gateway is simply the device that handles traffic leaving the local network.", "uyghur": "Exam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي wired ۋە wireless SOHO network نى configure قىلىڭ.\n\n## IP Address\n\nIP — **Internet Protocol**.\n\nIP address — network قا connected ھەر بىر device قا بېرىلىدىغان unique numerical identifier.\n\nبۇ يەردە «assigned» دېگەن سۆز مۇھىم: IP address logical شەكىلدە تەقسىملىنىدۇ، شۇڭا ئۇنى change ياكى reassign قىلىشقا بولىدۇ.\n\nھازىر ئاساسلىق ئىككى version ئىشلىتىلىدۇ:\n- IPv4\n- IPv6\n\n### IPv4\n\nIPv4 — Internet Protocol version 4 — كونا ۋە كەڭ ئىشلىتىلگەن version.\n\nIPv4 address:\n- **32 bit**\n- **dot-decimal notation** ئىشلىتىدۇ\n- 4 octet تىن تەركىب تاپىدۇ\n- ھەر octet 8 bit\n- ھەر octet نىڭ decimal قىممىتى **0–255**\n\nمىسال شەكلى:\n`192.168.1.10`\n\n32 bit address تەخمىنەن 4.2 billion combination بېرەلەيدۇ.\n\n### IPv6\n\nIPv6 address:\n- **128 bit**\n- 8 group دىن تەركىب تاپىدۇ\n- ھەر group تا 4 hexadecimal digit\n- group لار colon `:` بىلەن ئايرىلىدۇ\n- ھەر 4-hex-digit group نى **hextet** دەپمۇ ئاتايدۇ\n\nIPv4 دىن زور دەرىجىدە ئۇزۇن address space تەمىنلەيدۇ.\n\n### Static IP vs Dynamic IP\n\n**Static IP:**\n- manually assigned\n- ۋاقىت ئۆتسىمۇ ئوخشاش تۇرىدۇ\n- server، printer ۋە ھەر ۋاقىت ئوخشاش address بىلەن تېپىلىشى كېرەك بولغان device قا ماس\n\n**Dynamic IP:**\n- DHCP ئارقىلىق automatically assigned\n- device network قا connect قىلغاندا DHCP server دىن IP ئالىدۇ\n- address utilization نى ئۈنۈملۈك قىلىدۇ\n- non-technical user ئۈچۈن setup نى ئاسانلاشتۇرىدۇ\n\nUser network/IP addressing نى قولدا بىلمىسىمۇ، device نى connect قىلىدۇ؛ DHCP قالغان setup نى ئاپتوماتىك قىلىدۇ.\n\n### Private IPv4 vs Public IPv4\n\n**Private IPv4:**\n- home/small office LAN ئىچىدە ئىشلىتىلىدۇ\n- Internet تا routable ئەمەس\n- internal communication ئۈچۈن، مەسىلەن workstation → printer ياكى internal server\n- specific reserved range لاردا بولىدۇ\n\n**Public IPv4:**\n- Internet قا بىۋاسىتە ئۇلىنىدىغان endpoint/network ئۈچۈن\n- globally unique\n- Internet ئارقىلىق communication قا يول قويىدۇ\n- ئادەتتە ISP تەرىپىدىن تەقسىملىنىدۇ\n\nExam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي wired ۋە wireless SOHO network نى configure قىلىڭ.\n\n## APIPA — Automatic Private IP Addressing\n\nAPIPA computer DHCP server دىن IP address ئالالمىغاندا ئۆزىگە temporary self-configured IP address بېرىدىغان mechanism.\n\nNormal DHCP process مەغلۇپ بولسا APIPA backup plan سۈپىتىدە network interface نى local communication ئۈچۈن ئىشلىتىش ھالىتىدە ساقلايدۇ.\n\n### APIPA Range\n\n**169.254.0.1 – 169.254.255.254**\n\nبۇ range APIPA ئۈچۈن reserved.\n\n### نېمە ئۈچۈن APIPA چىقىدۇ؟\n\nئەڭ كۆپ سەۋەب: device **DHCP server غا يېتەلمەيدۇ**.\n\nمۇمكىن سەۋەبلەر:\n- DHCP server offline\n- network congestion\n- faulty cable\n- incorrect network setting\n- باشقا network infrastructure issue\n\nDevice boot بولغاندا DHCP دىن IP سورايدۇ؛ response كەلمىسە ئۆزىگە APIPA address بېرىدۇ.\n\n### APIPA نىڭ چەكلىمىسى\n\nAPIPA address بار device:\n- ئوخشاش local segment دىكى APIPA device لار بىلەن communication قىلالايدۇ\n- **Internet ياكى باشقا external network قا چىقالمايدۇ**\n\nسەۋەبى APIPA local communication ئۈچۈن؛ router ئادەتتە APIPA source traffic نى باشقا network قا forward قىلمايدۇ.\n\nExam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي wired ۋە wireless SOHO network نى configure قىلىڭ.\n\n## Subnet Mask\n\nDevice network قا connect بولغاندا پەقەت IP address لالا بېرىلمەيدۇ. Proper communication ئۈچۈن بىر نەچچە network setting بىرلىكتە ئىشلەيدۇ؛ subnet mask شۇلارنىڭ ئەڭ مۇھىملىرىدىن بىرى.\n\nSubnet mask IP address بىلەن بىللە ئىشلىتىلىپ، قايسى IP address لارنىڭ **ئوخشاش local network** قا تەۋە ئىكەنلىكىنى بەلگىلەيدۇ.\n\nئاددىي قىلىپ:\n- destination same local network تىمۇ؟\n- ياكى different network تىمۇ؟\nدېگەننى device subnet mask ئارقىلىق بىلىدۇ.\n\nبۇنى map ئۈستىدىكى neighborhood boundary غا ئوخشىتىشقا بولىدۇ.\n\nDestination boundary ئىچىدە بولسا device data نى direct local network ئارقىلىق يوللايدۇ.\n\nDestination boundary سىرتىدا بولسا device direct يېتەلمەيدۇ؛ traffic نى **default gateway** غا يوللايدۇ.\n\nExam Objective 2.6\nبىر ئەھۋال بېرىلگەندە، ئاساسىي wired ۋە wireless SOHO network نى configure قىلىڭ.\n\n## Default Gateway\n\nDefault gateway — local network نى باشقا network، جۈملىدىن Internet قا ئۇلايدىغان router ياكى network device.\n\nئۇنى local network دىن چىقىدىغان traffic نىڭ **exit point** ى دەپ قاراشقا بولىدۇ.\n\nProcess:\n1. Device subnet mask ئارقىلىق destination local ياكى non-local ئىكەنلىكىنى بەلگىلەيدۇ.\n2. Non-local بولسا traffic نى default gateway غا يوللايدۇ.\n3. Gateway traffic نى مۇۋاپىق external network/Internet قا forward قىلىدۇ.\n4. Response قايتقاندا gateway ئۇنى قوبۇل قىلىپ، original internal device قا قايتۇرىدۇ.\n\nشۇڭا website كۆرۈش، video streaming، email يوللاش، file download قىلىش قاتارلىق Internet خىزمەتلىرى مۇمكىن بولىدۇ.\n\nDevice final destination غا بارىدىغان پۈتۈن path نى بىلىشىنىڭ ھاجىتى يوق؛ پەقەت traffic local ئەمەس ۋە gateway غا بېرىش كېرەكلىكىنى بىلىشى يېتەرلىك.\n\nHome/small-office network تا default gateway ئادەتتە router.\n\nDHCP كۆپىنچە device قا:\n- IP address\n- subnet mask\n- default gateway\nنى بىرلىكتە automatically تەقسىملەيدۇ.\n\nكېرەك بولسا default gateway IP address نى manual configure قىلىشقىمۇ بولىدۇ."}, {"id": "2.7", "number": "2.7", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.7, compare and contrast internet connection types, network types, and their characteristics. Internet connection types. An internet service provider or ISP is a company or organization that provides individuals, businesses, and other entities with access to the internet.\n\nISPs are responsible for connecting customers to the internet through various technologies. Wired technologies include fiber optics, cable, and DSL. Wireless technologies include satellite and cellular.\n\nWith each option, there are typically a range of subscription plans that vary in terms of throughput speeds and pricing designed to meet the needs of different users. Another consideration is location. Not all connection types are available in all areas.\n\nNow that we know what an ISP is, let's discuss each of the available connection types one at a time. Fiber optic is a type of wired internet connection that utilizes fiber optic cables to transmit data. It is considered one of the fastest and most reliable forms of internet connectivity available today.\n\nFiber optic cables are made of thin strands of glass or plastic known as optical fibers. These fibers are designed to transmit data using pulses of light. Fiber optic internet connections can be relatively more expensive compared to some other types of internet connections and are commonly deployed by ISPs in urban areas.\n\nCable internet is a type of wired internet connection that utilizes the same coaxial copper cabling that is used for cable television transmission to deliver high-speed internet access to homes and businesses. It provides sufficient speeds for most homes and small businesses, but falls short of the speeds possible with fiber optic connections. As a plus, cable internet is usually cheaper than fiber optic connections and has a larger coverage area.\n\nAs a slight downside, the copper cable medium does result in a shared customer bandwidth. DSL, or digital subscriber line, is a type of wired internet connection that uses existing copper telephone lines, traditionally known as POTS, or plain old telephone service, to transmit data. It is a popular alternative to cable and fiber optic connections in areas where these options may not be available.\n\nTo establish a DSL connection, a DSL modem is required. The modem connects to the telephone line and translates the digital data from the user's devices into signals that can be transmitted over the copper telephone lines. DSL is relatively slow compared to fiber optic and cable connections, but DSL tends to be more cost-efficient.\n\nAnd since it uses the existing telephone network, coverage is pretty widespread. Satellite internet is a type of wireless internet connection that uses communication satellites and satellite antennas to provide internet access to users. It is a viable option for areas where traditional wired connections like fiber optic, cable, or DSL are not available or practical, usually due to a lack of existing infrastructure.\n\nWhile satellite may be your only option in a remote location, it is probably going to be expensive and slow. This connection type is expensive because a satellite internet service provider operates a network of communication satellites in geostationary orbit around the earth. And this connection type is slow because these satellites are positioned approximately 35,000 kilometers above the earth's surface.\n\nIt takes a fair amount of time for a radio signal to travel 35,000 kilometers to the satellite and then back down again, causing data latency. And if you have bad weather like a rainstorm interfering with your radio signals, just forget it. Cellular internet, also known as mobile internet, is a type of wireless internet access that utilizes cellular networks to provide connectivity to devices such as smartphones, tablets, and laptops.\n\nIt enables users to access the internet while on the go or traveling without relying on fixed wired connections. Each device will have an antenna that allows it to connect to a cellular network infrastructure. This infrastructure consists of a system of interconnected base stations or cell towers that are strategically placed to provide coverage over a specific geographic area.\n\nLastly, I would like to add one more wireless connection type to the mix. This one is wireless internet service providers, also known as a WISP. A WISP uses fixed wireless technology to provide internet access in areas that might not be served by wired connection options.\n\nWith this connection type, a small dish or antenna is installed at your location to connect to the provider's tower. WISPs can be a great option in rural or underserved areas. The setup is relatively simple and doesn't require extensive infrastructure.\n\nHowever, like satellite internet, it can be susceptible to weather conditions and might offer lower speeds compared to wired connections. Exam objective 2.7, compare and contrast internet connection types, network types, and their characteristics. Network types.\n\nNetworks of different sizes can be categorized in different ways based on their coverage and scale. In this video segment, we will cover the most common network types, starting with a PAN or personal area network. A PAN is the smallest of the network types we will cover.\n\nIt's designed for individual use within a range of a few meters. Imagine the wireless connectivity between your smartphone, your Bluetooth headset, and your smartwatch. That's a perfect example of a PAN.\n\nIt's primarily used for personal devices to connect and communicate over short distances, often using wireless technologies like Bluetooth. Next, we have local area networks or LANs. A LAN is a wired network that covers a small geographical area, typically within a building, small office, or home.\n\nThis type of network allows devices to share resources, such as files or printers, within a single contained environment. LANs are typically wired using ethernet cables to connect computers and other devices to a central router or switch, but they can also be wireless. Speaking of wireless, we also have WLAN networks.\n\nWLAN stands for Wireless Local Area Network. A WLAN is similar to a LAN, but the key difference is the use of wireless technology for connectivity. Instead of relying on physical cables, WLANs use wireless signals, such as Wi-Fi, to connect devices within a localized area.\n\nA WLAN may also be connected to a LAN. In this way, a WLAN can extend a LAN by providing a method for wireless devices to connect to and share resources with the wired LAN network. Now, let us expand our horizon to wide area networks, or WANs.\n\nWANs cover a much larger area than LANs, or WLANs. A WAN is a network that spans a large geographical area, typically connecting multiple LANs or remote locations. WANs are used to connect networks across cities, countries, or even continents.\n\nThey enable long-distance communications and data exchanges between geographically dispersed sites. The internet itself can be considered a massive WAN, connecting networks worldwide. Metropolitan area networks, or MANs, cover an area larger than a LAN, but smaller than a WAN, typically spanning a city or a metropolitan area.\n\nThey are used to connect multiple LANs within a geographical area, allowing organizations and buildings to share resources at high speeds. Lastly, we'll cover storage area networks, or SANs. A SAN is a dedicated high-speed network that interconnects and presents shared pools of storage devices to multiple servers.\n\nSANs are designed to handle large volumes of data and are typically used in server rooms or data centers. They allow for more efficient storage management and access in complex environments.", "uyghur": "Exam Objective 2.7\nInternet connection type، network type ۋە ئۇلارنىڭ خۇسۇسىيەتلىرىنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Internet Connection Types\n\n**ISP — Internet Service Provider** — individual، business ۋە organization غا Internet access تەمىنلەيدىغان company/organization.\n\nISP ھەر خىل technology ئارقىلىق customer نى Internet قا ئۇلايدۇ.\n\n### Wired Internet\n\n#### Fiber Optic\n\nFiber-optic cable ئىچىدىكى نېپىز glass/plastic optical fiber ئارقىلىق **light pulse** بىلەن data يەتكۈزىدۇ.\n\nئالاھىدىلىكى:\n- ئەڭ تېز Internet تۈرلىرىنىڭ بىرى\n- reliability يۇقىرى\n- بەزى باشقا option غا قارىغاندا قىممەت بولۇشى مۇمكىن\n- source تا urban area دا كۆپ deployment قىلىنىدىغانلىقى بايان قىلىنغان\n\n#### Cable Internet\n\nCable TV دا ئىشلىتىلىدىغان **coaxial copper cable** ئارقىلىق high-speed Internet تەمىنلەيدۇ.\n\nHome/small business ئۈچۈن يېتەرلىك speed، ئەمما fiber غا يەتمەيدۇ.\n\nئەۋزەللىكى:\n- fiber دىن ئادەتتە ئەرزانراق\n- coverage كەڭرەك\n\nكەمچىلىكى:\n- copper medium/shared infrastructure سەۋەبىدىن customer bandwidth share قىلىنىشى مۇمكىن\n\n#### DSL — Digital Subscriber Line\n\nExisting copper telephone line/POTS ئارقىلىق data يەتكۈزىدۇ.\n\nCable/fiber يوق رايوندا alternative.\n\nDSL modem telephone line دىكى signal بىلەن computer digital data ئارىسىدا conversion قىلىدۇ.\n\nئالاھىدىلىكى:\n- fiber/cable دىن ئاستا\n- cost ئەرزانراق بولۇشى مۇمكىن\n- existing telephone network سەۋەبىدىن coverage كەڭ\n\n### Wireless Internet\n\n#### Satellite Internet\n\nCommunication satellite + satellite antenna ئارقىلىق Internet access.\n\nWired infrastructure يوق remote area دا پايدىلىق.\n\nSource تا traditional geostationary satellite scenario توغرىسىدا:\n- cost يۇقىرى\n- latency يۇقىرى\n- satellite تەخمىنەن 35,000 km ئېگىزلىكتە بولغاچقا signal نىڭ بېرىپ-كېلىش ۋاقتى ئۇزۇن\n- rainstorm قاتارلىق bad weather signal غا تەسىر قىلىشى مۇمكىن\nدېيىلگەن.\n\n#### Cellular Internet\n\nMobile/cellular network ئارقىلىق smartphone، tablet، laptop قاتارلىق device غا Internet access.\n\nFixed cable سىز moving/traveling جەريانىدا Internet ئىشلىتىشكە يول قويىدۇ.\n\nDevice antenna ئارقىلىق interconnected cell tower/base station infrastructure غا ئۇلىنىدۇ.\n\n#### WISP — Wireless Internet Service Provider\n\nWISP **fixed wireless** technology ئارقىلىق wired option يوق ياكى يېتەرلىك ئەمەس رايونلارغا Internet بېرىدۇ.\n\nCustomer location غا small dish/antenna ئورنىتىلىپ provider tower غا ئۇلىنىدۇ.\n\nRural/underserved area غا ياخشى بولالايدۇ؛ extensive wired infrastructure تەلەپ قىلمايدۇ.\n\nكەمچىلىكى:\n- weather تەسىرىگە ئۇچرىشى مۇمكىن\n- wired connection غا قارىغاندا speed تۆۋەن بولۇشى مۇمكىن\n\nExam Objective 2.7\nInternet connection type، network type ۋە ئۇلارنىڭ خۇسۇسىيەتلىرىنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Network Types\n\n### PAN — Personal Area Network\n\nئەڭ كىچىك network تۈرى.\n\n- personal use\n- بىر نەچچە meter دائىرە\n- كۆپىنچە Bluetooth قاتارلىق short-range wireless technology\n\nمىسال:\nsmartphone + Bluetooth headset + smartwatch.\n\n### LAN — Local Area Network\n\nكىچىك geographical area نى قاپلايدىغان network:\n- building\n- small office\n- home\n\nDevice لار file/printer قاتارلىق resource نى share قىلالايدۇ.\n\nLAN ئادەتتە Ethernet cable ئارقىلىق central router/switch قا ئۇلىنىدۇ، ئەمما wireless component مۇ بولۇشى مۇمكىن.\n\n### WLAN — Wireless Local Area Network\n\nLAN غا ئوخشاش، ئەمما connectivity ئۈچۈن physical cable نىڭ ئورنىغا Wi-Fi قاتارلىق wireless signal ئىشلىتىدۇ.\n\nWLAN wired LAN غا ئۇلىنىپ، wireless device لارنىڭ wired LAN resource لىرىنى ئىشلىتىشىگە يول قويالايدۇ.\n\n### WAN — Wide Area Network\n\nLAN/WLAN دىن زور جۇغراپىيەلىك رايوننى قاپلايدۇ.\n\n- multiple LAN\n- remote location\n- city/country/continent ئارىسىدىكى network\nلارنى بىرلەشتۈرىدۇ.\n\n**Internet ئۆزى غايەت زور WAN دەپ قاراشقا بولىدۇ.**\n\n### MAN — Metropolitan Area Network\n\nLAN دىن چوڭ، WAN دىن كىچىك.\n\nئادەتتە بىر city/metropolitan area نى قاپلاپ، بىر نەچچە LAN نى high speed بىلەن بىرلەشتۈرىدۇ.\n\n### SAN — Storage Area Network\n\nMultiple server غا shared storage pool تەمىنلەيدىغان dedicated high-speed network.\n\n- large data volume\n- server room/data center\n- efficient storage management/access\nئۈچۈن ئىشلىتىلىدۇ."}, {"id": "2.8", "number": "2.8", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.8, explain networking tools and their purposes. Networking tools are the essential instruments that IT professionals use to build, analyze, and maintain the vast and intricate world of computer networks. They range from simple handheld devices for wiring tasks to sophisticated software that monitors and optimizes network traffic, each serving a specific purpose in the lifecycle of a network's infrastructure.\n\nIn this video segment, we will cover some more common networking tools, starting with cable strippers. The cable stripper is a precision tool designed to remove the outer jacket of a cable to reveal the delicate wires inside. This tool is indispensable for anyone looking to install or repair cables.\n\nIts precise blades allow for the stripping of various cable thicknesses without nicking the internal wiring, ensuring that your data transmissions remain intact and reliable. Moving on, we have a crimper. This tool is the cornerstone of creating physical network connections.\n\nIt's used to affix RJ11, RJ45, and F-type connectors to corresponding cables, be it telephone, ethernet, or coaxial cables, respectively. The crimping tool must apply just the right amount of pressure to secure the connector without damaging the delicate wires inside. Whether you're crafting a custom length ethernet cable for a network setup, or attaching a connector to a coaxial cable for a television or internet connection, the crimping tool ensures a snug, stable connection that won't loosen over time.\n\nThe cable tester is an analytical tool, essential for verifying the integrity of network cables. It checks for proper wire pinouts, essential for communication between devices, evaluates signal quality by measuring resistance, signal attenuation, noise, and interference, and can even estimate the length of a cable. This tool is crucial not just for troubleshooting, but also for certifying that a cable meets the required performance standards before it becomes part of a critical network infrastructure.\n\nThe punchdown tool is another fundamental instrument for network technicians. It allows for the insertion and trimming of wires in one motion, making it perfect for organizing and connecting wires to patch panels and blocks, a common scenario in large network installations. A toner probe set, affectionately known as a fox and hound, is the go-to for tracing cables.\n\nWhen you have a mess of wires and need to find a specific one, the tone generator sends a signal down the wire, which is then detected by the probe. This is incredibly useful for locating specific cables within a bundle or identifying the termination point of a cable on a patch panel, which is often a challenge in complex network environments. A loopback plug is a simple but powerful diagnostic tool.\n\nIt is primarily used to test network ports and the functionality of the network interface card, or NIC, by redirecting the output signal back into the system as a return signal. This self-communication verifies that the port and NIC can send and receive data correctly, which is a fundamental check for network troubleshooting. A network tap, short for network test access point, is a dedicated hardware tool designed to facilitate the monitoring of network traffic.\n\nIt serves an essential role in settings where maintaining high security and conducting thorough traffic analysis are paramount. By integrating a network tap into a specific segment of a network, it can duplicate all the data traversing that segment and redirect the copies to a separate monitoring device for detailed examination. This capability enables in-depth observation and analysis of network activities while ensuring that the regular flow and function of the network remains unaffected.\n\nLastly, a Wi-Fi analyzer is a modern necessity in the arsenal of network tools. It is used to assess the quality of Wi-Fi signals. It can even help create a signal heat map to visualize signal strengths across different areas, as well as identify channels with less traffic for optimal performance and reduced latency.\n\nThis is particularly beneficial when optimizing a wireless network to ensure the best possible connectivity for users. In summary, each tool that was described is an essential component of a network technician's toolkit playing a pivotal role in the successful setup and maintenance of network infrastructures.", "uyghur": "Exam Objective 2.8\nNetworking tool لار ۋە ئۇلارنىڭ مەقسىتىنى چۈشەندۈرۈڭ.\n\n## Networking Tools\n\n### Cable Stripper\n\nCable نىڭ outer jacket ىنى ئېلىپ، ئىچكى نېپىز wire لارنى ئاشكارىلايدىغان precision tool.\n\nInternal wire نى زىيانلىماي ھەر خىل cable thickness نى strip قىلىشقا ئىشلىتىلىدۇ.\n\nCable install/repair ئۈچۈن مۇھىم.\n\n### Crimper\n\nRJ11، RJ45 ۋە F-type connector نى مۇناسىپ cable غا قىسىپ بېكىتىدىغان tool:\n- RJ11 → telephone cable\n- RJ45 → Ethernet cable\n- F-type → coaxial cable\n\nConnector نى پۇختا تۇتۇش، ئەمما internal wire نى زىيانلىماسلىق ئۈچۈن مۇۋاپىق pressure ئىشلىتىش كېرەك.\n\n### Cable Tester\n\nNetwork cable integrity نى تەكشۈرىدۇ:\n- correct pinout\n- resistance\n- signal attenuation\n- noise\n- interference\n- بەزى tool لار cable length نىمۇ estimate قىلىدۇ\n\nTroubleshooting ۋە cable نىڭ performance standard غا ماسلىقىنى verify/certify قىلىش ئۈچۈن.\n\n### Punchdown Tool\n\nWire نى patch panel/block قا بىر ھەرىكەتتە insert + trim قىلىشقا ئىشلىتىلىدۇ.\n\nLarge network installation دا cable termination ئۈچۈن كۆپ ئىشلىتىلىدۇ.\n\n### Toner Probe Set — “Fox and Hound”\n\nCable trace قىلىش ئۈچۈن.\n\n- Tone generator specific wire غا signal يوللايدۇ.\n- Probe شۇ signal نى تېپىدۇ.\n\nCable bundle ئىچىدىن لازىملىق cable نى تېپىش ياكى patch panel دىكى termination point نى identify قىلىشقا پايدىلىق.\n\n### Loopback Plug\n\nNetwork port/NIC نىڭ send + receive ئىقتىدارىنى test قىلىدۇ.\n\nOutput signal نى قايتا input قا loop قىلىپ، interface ئۆزى بىلەن communication قىلالامدۇ دەپ تەكشۈرىدۇ.\n\n### Network TAP — Test Access Point\n\nNetwork traffic monitoring ئۈچۈن dedicated hardware.\n\nSpecific network segment دىن ئۆتۈۋاتقان data نىڭ copy سىنى ئېلىپ separate monitoring device قا يوللايدۇ.\n\nبۇ:\n- deep traffic analysis\n- security monitoring\nنى production traffic flow غا تەسىر قىلماي قىلىشقا ياردەم بېرىدۇ.\n\n### Wi-Fi Analyzer\n\nWi-Fi signal quality نى باھالايدۇ.\n\n- signal strength\n- channel usage\n- less-congested channel\nنى تەكشۈرەلەيدۇ.\n\nبەزىلىرى signal **heat map** قۇرۇپ، ھەر رايوندىكى signal strength نى كۆرۈنۈشلۈك كۆرسىتىدۇ. Wireless network نى optimal performance ۋە lower latency ئۈچۈن optimize قىلىشقا پايدىلىق."}, {"id": "3.1", "number": "3.1", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.1, compare and contrast display components and attributes. Display types. With domain three now underway, we begin by exploring display types.\n\nModern mobile devices, laptops, and desktop monitors commonly use flat panel display technologies because they are thin, energy efficient, and capable of producing high quality images. For the A+ exam, you need to understand how the major display technologies work, how they differ, and where each one is typically used. Let's begin with LCD, which stands for liquid crystal display.\n\nAn LCD display is a flat panel technology that uses a backlight shining through a layer of liquid crystals to create an image. Each tiny picture element on the screen contains what is known as an LCD cell. An LCD cell holds liquid crystal material that twists or aligns when electrical current is applied, controlling how much light passes through.\n\nThe liquid crystals do not create light on their own. Instead, they act like tiny shutters inside each LCD cell, regulating the light coming from the backlight behind the screen. By controlling how much light passes through each cell, the display forms the images you see.\n\nNow let's pause for a moment and make sure you fully understand this topic. A backlight is simply a light source position behind the screen. Without it, the display would be completely dark.\n\nIn many modern monitors, that backlight is made of LEDs or light emitting diodes. This is why you often hear the term LED monitor. In most cases, that is still an LCD display.\n\nThe LEDs are just the light source behind the liquid crystal panel. The image itself is still being formed by LCD cells controlling that light. Because LCD relies on a separate backlight layer, it cannot produce what we call true black.\n\nEven when an image appears black, the backlight is still on behind the panel. LCD displays are generally cost-effective, reliable, and perform well in bright environments, which is why they are still widely used in mobile devices, laptops, and desktop monitors. Within the LCD family, there are three main panel types you need to recognize, IPS, TN, and VA.\n\nIPS, which stands for in plane switching, is known for excellent color accuracy and wide viewing angles. Even if you are not sitting directly in front of the display, the image still looks consistent and vibrant. IPS panels are commonly used in environments where color precision matters, such as graphic design, photography, and content creation.\n\nThe trade-off is that IPS panels are typically more expensive. TN, or twisted pneumatic panels, prioritize speed. They usually offer very fast response times and can support high refresh rates, making them popular in gaming monitors where motion clarity is important.\n\nHowever, TN panels have weaker color accuracy and narrower viewing angles. If you move off to the side, the image quality can noticeably degrade. Then we have VA, which stands for vertical alignment.\n\nVA panels offer stronger contrast ratios and deeper blacks than IPS or TN because they block the backlight more effectively. They also provide better viewing angles than TN, though not quite as strong as IPS. VA panels are often used for media consumption because of their strong contrast performance.\n\nNow let's talk about a newer development in LCD technology, Mini-LED. Mini-LED is still technically an LCD display, but it uses a much more advanced backlighting system. Instead of relying on a small number of larger backlight zones, Mini-LED panels use thousands of very small LEDs behind the screen.\n\nThis allows for improved local dimming, meaning certain areas of the screen can dim or brighten independently. The result is better contrast, brighter highlights, and improved black levels compared to traditional LCD displays. However, because Mini-LED still relies on a backlight, it still cannot completely turn off individual pixels the way OLED can.\n\nThis brings us to OLED, which stands for Organic Light Emitting Diode. Unlike LCD and Mini-LED, OLED does not use a backlight at all. Instead, each individual pixel produces its own light.\n\nYou can think of it as millions of tiny colored lights that can turn on or off independently. If a pixel needs to display black, it simply turns off completely. This ability to shut off individual pixels allows OLED displays to produce true blacks and extremely high contrast ratios.\n\nOLED panels are known for vibrant colors, excellent contrast, wide viewing angles, and very thin designs. Because there is no backlight layer, OLED displays can also be flexible. This is why they are used in curved displays, foldable phones, and some wearable devices.\n\nHowever, OLED technology is generally more expensive and can be prone to burn in if static images are displayed for long periods of time. For the A+ exam, remember these key distinctions. Traditional LCD uses a backlight and liquid crystals to control light.\n\nIPS, TN, and VA are variations within LCD technology, each with different strengths. Mini-LED is an advanced form of LCD that improves backlighting and contrast. OLED allows each pixel to generate its own light, producing true blacks and superior contrast.\n\nUnderstanding these differences will help you compare display technologies and identify the best choice in exam scenarios. Exam objective 3.1, compare and contrast display components and attributes. Display components.\n\nA touchscreen is a display that allows users to interact directly with what appears on the screen using touch input. Instead of relying solely on a keyboard or mouse, users can tap, swipe, pinch, or drag their fingers across the display to control the device. This direct interaction has become standard in mobile devices and is increasingly common in laptops and all-in-one systems.\n\nBut here is an important distinction. The touchscreen you see and interact with is not a single component. It is actually made up of multiple layers working together behind the scenes.\n\nThis brings us to the digitizer. The digitizer is a transparent layer positioned above the display panel. Its job is to detect touch input.\n\nWhen a user touches the screen, the digitizer senses the exact location of that touch and converts the physical motion into digital signals that the system can understand. It is important to understand that the display panel and the digitizer serve two different functions. The display panel produces the image.\n\nThe digitizer detects the touch. If the image appears correctly, but the screen does not respond to touch, the digitizer may be the issue. If the screen responds to touch but shows no image, the display panel itself may be the problem.\n\nNow let's shift to a component you may encounter on older systems, the inverter. An inverter is a small circuit board found primarily in older laptops that use CCFL backlighting, which stands for cold cathode fluorescent lamp. Unlike modern LED backlit displays, CCFL backlights require high voltage AC power to operate.\n\nThe inverter's job is to convert the low voltage DC power supplied by the laptop's battery or power adapter into the high voltage AC power required by the CCFL backlight. Without a functioning inverter, the display may appear extremely dim or completely dark, even though the image is still being generated. A classic troubleshooting technique when a laptop screen appears black is to shine a flashlight at the display.\n\nIf you can faintly see the image, it indicates that the display panel is functioning, but the backlight is not. It is important to note that inverters are largely obsolete in modern systems because LED backlighting does not require high voltage AC power. LED displays use low voltage DC power directly and therefore do not require a separate inverter board.\n\nFor the A+ exam, you should be able to distinguish between the touchscreen, the digitizer, and the inverter, understand their roles, and recognize common failure symptoms associated with each. In the next segment, we will shift from physical components to display attributes such as resolution, pixel density, refresh rate, and color gamut, which describe how a display performs rather than how it is built. Exam objective 3.1, compare and contrast display components and attributes.\n\nDisplay attributes. As we move away from the physical components of a display, we now turn our attention to display attributes. These attributes describe how a screen performs and how images appear to the user.\n\nWhile there are many specifications that influence display performance, under exam objective 3.1, you need to understand resolution, pixel density, refresh rate, and color gamut, and how each one differs. Let's begin with resolution. To understand resolution, we first need to understand what a pixel is.\n\nA pixel, short for picture element, is the smallest individual dot of color that makes up an image on a screen. Every image you see is made up of thousands or even millions of these tiny colored dots working together to form text, images, and video. Once you understand that a screen is simply a grid made up of pixels, resolution becomes much easier to grasp.\n\nNow that we understand what a pixel is, we can define resolution more clearly. Screen resolution refers to the total number of pixels displayed on a screen, typically written as width by height. For example, 1920 by 1080 means the screen contains 1,920 pixels across and 1,080 pixels down.\n\nWhen you multiply those numbers together, you get the total number of pixels that make up the image. Some of the most common resolutions you should recognize include 1280 by 720, commonly called High Definition or HD, 1920 by 1080 known as Full HD, 2560 by 1440, often referred to as Quad HD, and 3840 by 2160, which is commonly known as Ultra HD or 4K. In general, a higher resolution means more total pixels on the screen, which allows for more detailed and sharper images.\n\nNow that we understand resolution, let's take the next logical step and talk about pixel density. While resolution tells us the total number of pixels on a screen, pixel density tells us how tightly those pixels are packed together. Pixel density is commonly measured in pixels per inch, often abbreviated as PPI.\n\nThis measurement describes how many pixels fit within a single inch of the display. Here is where the distinction becomes important. Two screens can have the same resolution, but if one screen is physically smaller, the pixels will be packed closer together.\n\nThat smaller screen will have a higher pixel density. On the other hand, if that same resolution is displayed on a much larger screen, the pixels are spread out more, resulting in lower pixel density. Higher pixel density generally produces sharper text, smoother edges, and clearer images because the individual pixels are harder to see with the human eye.\n\nLower pixel density can sometimes make images appear less refined, especially when viewed up close. So far, we've talked about how many pixels a screen has, which is resolution, and how tightly those pixels are packed together, which is pixel density. Both of those attributes affect how sharp and detailed an image appears.\n\nNow let's shift from image sharpness to something slightly different, how smoothly that image moves. This brings us to refresh rate. Refresh rate refers to how many times per second the display updates the image on the screen.\n\nIt is measured in hertz, abbreviated as hc. If a display has a refresh rate of 60 hertz, that means the screen refreshes the image 60 times every second. A 120 hertz display refreshes 120 times per second.\n\nHigher refresh rates create smoother motion. This becomes especially noticeable when watching action scenes in a movie or playing video games. Lower refresh rates can make motion appear less fluid, particularly during fast movement.\n\nIt is important to remember that refresh rate is completely separate from resolution and pixel density. Resolution and pixel density affect clarity and detail. Refresh rate affects motion smoothness.\n\nA display can be extremely sharp but still feel less smooth if the refresh rate is low. Lastly, we have color gamut. Color gamut refers to the range of colors a display is capable of producing.\n\nIn simple terms, it describes how many different shades and tones a screen can accurately show. A wider color gamut means the display can reproduce more colors resulting in images that appear richer, more vibrant, and more true to life. Not all displays are capable of producing the same range of colors.\n\nLower end displays may show colors that appear washed out or less accurate. Higher quality displays are able to produce deeper reds, brighter greens, and more subtle transitions between shades. This becomes especially important in areas such as photo editing, graphic design, video production, and media consumption.\n\nNow let's put this into a quick scenario. Imagine two monitors sitting side by side. Both have the same resolution and the same refresh rate.\n\nOn paper, they look identical. But when you display a colorful image on both screens, one appears dull while the other looks vivid and lifelike. The difference is color gamut.\n\nOne display is capable of producing a wider range of colors than the other.", "uyghur": "Exam Objective 3.1\nDisplay component ۋە attribute لارنى سېلىشتۇرۇڭ ۋە پەرقلەندۈرۈڭ.\n\n## Display Types\n\nزامانىۋى mobile device، laptop ۋە desktop monitor كۆپىنچە flat-panel display ئىشلىتىدۇ، چۈنكى ئۇلار:\n- نېپىز\n- energy-efficient\n- high-quality image بېرەلەيدۇ\n\nA+ ئۈچ
