oated with carbon that is released by the physical pressure. This facilitates the creation of duplicate or triplicate copies with each printout. This streamlines the print process, allowing for efficient and convenient production of multiple copies without additional printing steps.\n\nLastly, while impact printers are known for their robustness and reliability, they do require a bit of maintenance to ensure optimal performance. Regular maintenance tasks are essential to keep these printers running smoothly and to extend their lifespan. One such maintenance task involves replacing the printer's ribbon.\n\nOver time, the ribbon becomes worn out, leading to faded or illegible prints. By replacing the ribbon when necessary, users can ensure that print quality remains consistent. Additionally, the print head, which plays a central role in transferring ink onto the paper, may also require replacement.\n\nAs with any mechanical component, the print head can wear out over time, affecting print quality and consistency. Regularly, replacing the print head ensures that the printer continues to produce clear and legible prints. Furthermore, it's important to always have additional paper stock on hand.\n\nThough it is continuous feed paper, it won't last forever. By performing regular maintenance tasks, such as replacing the ribbon, print head, and paper, users can ensure that their impact printers continue to operate smoothly and reliably.", "uyghur": "Exam Objective 3.8\nبىر ئەھۋال بېرىلگەندە، مۇۋاپىق پرىنتېر ئاسراش مەشغۇلاتلىرىنى ئىجرا قىلىڭ.\n\n## پرىنتېر ئاسراشنىڭ ئاساسىي مەقسىتى\n\nPrinter لار mechanical/electronic device بولغاچقا، ۋاقىت ئۆتۈشى بىلەن:\n- component لار ئۇپرايدۇ\n- consumable لار تۈگەيدۇ\n- ئىچكى قىسمى چاڭ-توزان ياكى residue بىلەن بۇلغىنىدۇ\n- alignment ئۆزگىرىشى مۇمكىن\n\nمەنبە regular maintenance نىڭ:\n- printer lifespan نى ئۇزارتىش\n- unexpected downtime نى ئازايتىش\n- consistent print quality نى ساقلاش\n- clear/accurate output ھاسىل قىلىش\n\nئۈچۈن مۇھىملىقىنى چۈشەندۈرىدۇ.\n\nObjective 3.8 دا تۆت ئاساسىي printer type قاپلىنىدۇ:\n\n1. Inkjet\n2. Laser\n3. Thermal\n4. Impact\n\n**مۇھىم:** بۇ تۆت technology نىڭ printing method ى پەرقلىق بولغاچقا، ئۇلارنىڭ maintenance task ۋە replacement component لىرىمۇ پەرقلىق.\n\n---\n\n# 1. Inkjet Printer Maintenance\n\n## Inkjet Printer قانداق ئىشلەيدۇ؟\n\nInkjet printer:\n- **ink cartridge** دىكى liquid ink نى\n- **printhead** ئارقىلىق\n- paper ئۈستىگە precise pattern شەكلىدە تارقىتىپ\n\ntext ۋە image ھاسىل قىلىدۇ.\n\n### Ink Cartridge\n\n**Ink cartridge**\n- printing ئۈچۈن لازىملىق ink نى ساقلايدىغان reservoir\n\nمەنبە color output نىڭ:\n- vibrant\n- precise\n\nبولۇشىغا cartridge دىكى formulated ink ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Printhead\n\n**Printhead**\n- ink نى paper ئۈستىگە precise pattern شەكلىدە چىقىرىدۇ\n\nSource بويىچە printhead ئىككى خىل بولۇشى مۇمكىن:\n\n- **Detached / separate printhead** → cartridge بىلەن ئايرىم\n- **Integrated printhead** → printhead cartridge نىڭ ئۆزىگە built-in\n\n### Pickup Roller\n\n**Pickup roller**\n- paper tray/input tray دىن بىر دانە paper نى friction ئارقىلىق تارتىپ printer mechanism غا كىرگۈزىدۇ\n\n### Feed Rollers\n\n**Feed rollers**\n- paper نى printer ئىچىدىكى paper path بويىچە ئالغا يۆتكەيدۇ\n\nPickup + feed roller لار:\n- paper handling نى راۋان قىلىدۇ\n- misfeed/paper jam نى ئازايتىشقا ياردەم بېرىدۇ\n\n### Carriage Belt\n\n**Carriage belt**\n- printhead assembly نى paper كەڭلىكى بويىچە\n- back-and-forth\n- precise movement\n\nقىلدۇرىدۇ.\n\n**Inkjet component memory:**\n- Cartridge = Ink\n- Printhead = Apply ink\n- Pickup roller = Pick one sheet\n- Feed rollers = Move paper\n- Carriage belt = Move printhead side-to-side\n\n---\n\n## Inkjet Calibration\n\n**Calibration**\n- printhead\n- paper-feed mechanism\n\nقاتارلىق component لارنى align قىلىپ، ink application ۋە paper handling نى تېخىمۇ precise قىلىش.\n\nSource process:\n1. Printer test page بېسىپ چىقىرىدۇ\n2. Test page دا alignment pattern ياكى color gradient بار\n3. Printer test page نى analyze قىلىدۇ\n4. لازىم بولسا adjustment قىلىدۇ\n\nCalibration:\n- automatic\n- ياكى printer settings menu ئارقىلىق manual\n\nبولۇشى مۇمكىن.\n\nمەنبە periodic calibration نى تەۋسىيە قىلىدۇ، بولۇپمۇ:\n- ink cartridge ئالماشتۇرغاندىن كېيىن\n- maintenance task قىلغاندىن كېيىن\n\n**ئەستە تۇتۇڭ: Inkjet calibration = Alignment / print quality**\n\n---\n\n## Inkjet Maintenance Tasks\n\n### 1. Clean the Printhead\n\nPrinthead ۋاقىت ئۆتۈشى بىلەن:\n- dried ink\n- debris\n\nبىلەن clog بولۇشى مۇمكىن.\n\nSymptoms:\n- poor print quality\n- streaky prints\n\nSource maintenance:\n- built-in cleaning utility\n- ياكى printhead cleaning kit\n\nئىشلىتىش.\n\n### 2. Replace Ink Cartridges\n\nInk level تۆۋەنلىسە ياكى cartridge بوشىسا:\n- cartridge نى ئالماشتۇرۇش كېرەك\n\nمەنبە:\n- ink-level indicator\n- manufacturer compatibility/installation guidance\n\nغا دىققەت قىلىشنى تەكىتلەيدۇ.\n\n### 3. Clear Paper Jams\n\nPaper jam بولسا:\n1. Manufacturer instruction بويىچە jammed paper نى ئېھتىيات بىلەن ئېلىڭ\n2. Internal component غا زىيان يەتكۈزمەڭ\n3. Paper path ئىچىدىكى paper fragment/debris نى تازىلاڭ\n\n**Inkjet exam memory:**\n> **Clean printhead + Replace ink + Clear jams + Calibrate**\n\n---\n\nExam Objective 3.8\nبىر ئەھۋال بېرىلگەندە، مۇۋاپىق پرىنتېر ئاسراش مەشغۇلاتلىرىنى ئىجرا قىلىڭ.\n\n# 2. Laser Printer Maintenance\n\nLaser printer:\n- liquid ink ئەمەس\n- **toner cartridge** دىكى fine powder\n\nئىشلىتىدۇ.\n\nمەنبە laser printer نى:\n- speed\n- precision\n- high-volume printing\n\nبىلەن باغلايدۇ.\n\nئۇ inkjet دىن internal mechanism ۋە imaging process جەھەتتە مۇرەككەپراق.\n\n---\n\n## Laser Printing Imaging Process — 7 Stages\n\nمەنبە تۆۋەندىكى يەتتە phase نى ئېنىق قاپلايدۇ:\n\n1. Processing\n2. Charging\n3. Exposing\n4. Developing\n5. Transferring\n6. Fusing\n7. Cleaning\n\n**Exam memory: Laser = Processing → Charging → Exposing → Developing → Transferring → Fusing → Cleaning**\n\n---\n\n## 1. Processing\n\nPrinting job:\n- printer onboard memory غا load قىلىنىدۇ\n- printer چۈشىنەلەيدىغان format قا ئايلاندۇرۇلىدۇ\n\nمەنبە:\n- entire job printing باشلىنىشتىن بۇرۇن printer memory غا load بولىدۇ\n- sufficient printer memory بۇ جەريان ئۈچۈن مۇھىم\n\nدەپ چۈشەندۈرىدۇ.\n\n---\n\n## 2. Charging\n\n**Photosensitive drum / imaging drum**\n- uniform static electrical charge بىلەن charge قىلىنىدۇ\n\nبۇ:\n- كېيىنكى image formation ئۈچۈن drum نى تەييارلايدۇ\n\n**ئەستە تۇتۇڭ: Charging = Drum gets uniform static charge**\n\n---\n\n## 3. Exposing\n\nLaser beam:\n- charged drum ئۈستىگە چۈشىدۇ\n- source model بويىچە laser چۈشكەن جايدا static charge نى ئۆزگەرتىپ/ئېلىۋېتىپ\n- invisible electrostatic image ھاسىل قىلىدۇ\n\n**Source-framing note:** reviewed Uyghur بۇ charge-polarity mechanism نى transcript نىڭ own simplified model ى بويىچە ساقلايدۇ؛ سىرتقى electro-photographic detail قوشمايدۇ.\n\n**ئەستە تۇتۇڭ: Exposing = Laser creates invisible image on drum**\n\n---\n\n## 4. Developing\n\n**Developing**\n- electrostatic image نى visible toner image غا ئايلاندۇرىدۇ\n\nSource model:\n- toner particle لار drum دىكى image area غا جەلپ بولىدۇ\n- invisible outline toner بىلەن تولۇپ visible image ھاسىل بولىدۇ\n\n**ئەستە تۇتۇڭ: Developing = Toner sticks to image on drum**\n\n---\n\n## 5. Transferring\n\n**Transferring**\n- drum ئۈستىدىكى toner image نى paper غا يۆتكەيدۇ\n\nSource components:\n- transfer belt\n- ياكى transfer roller\n\nPaper drum يېنىدىن ئۆتكەندە:\n- toner image paper تەرەپكە يۆتكىلىدۇ\n\n**ئەستە تۇتۇڭ: Transferring = Drum image → Paper**\n\n---\n\n## 6. Fusing\n\nToner paper ئۈستىگە چۈشكەن بولسىمۇ، تېخى final bond ئەمەس.\n\nPaper:\n- **fuser assembly** غا كىرىدۇ\n\nFuser ئىچىدىكى heated roller لار:\n- heat\n- pressure\n\nئىشلىتىپ toner نى melt قىلىدۇ ۋە paper fiber غا bond قىلىدۇ.\n\nشۇڭا:\n- laser printout printer دىن چىققاندا warm بولۇشى مۇمكىن\n- toner paper غا permanent fixed بولىدۇ\n\n**ئەستە تۇتۇڭ: Fusing = Heat + Pressure**\n\n---\n\n## 7. Cleaning\n\nPrint job دىن كېيىن drum ئۈستىدە قالغان excess toner:\n- cleaning blade\n- ياكى brush\n\nئارقىلىق ئېلىۋېتىلىدۇ.\n\nمەقسەت:\n- next print cycle ئۈچۈن drum نى تەييارلاش\n- contamination نى ئازايتىش\n- print quality نى ساقلاش\n\n**ئەستە تۇتۇڭ: Cleaning = Remove leftover toner from drum**\n\n---\n\n## Laser Printer Maintenance Tasks\n\n### 1. Replace Toner\n\nToner cartridge:\n- low\n- ياكى empty\n\nبولسا ئالماشتۇرۇلىدۇ.\n\nمەنبە spare toner cartridge ساقلاش:\n- downtime نى ئازايتىشقا ياردەم بېرىدۇ\n\nدەپ چۈشەندۈرىدۇ.\n\n---\n\n### 2. Apply / Replace Maintenance Kit Components\n\nLaser printer دا periodic **maintenance kit** ئىشلىتىلىشى مۇمكىن.\n\nمەنبە maintenance kit ئىچىدە بولۇشى مۇمكىن دەپ كۆرسەتكەن parts:\n\n- fuser assembly\n- transfer roller\n- cleaning blade\n- باشقا wearable component\n\nبۇ parts نى routine maintenance دا ئالماشتۇرۇش:\n- printer life نى ئۇزارتىش\n- print quality نى ساقلاش\n\nقا ياردەم بېرىدۇ.\n\n---\n\n### 3. Reset Maintenance/Page Counters\n\nبەزى laser printer:\n- printed-page count\n- maintenance due tracking\n\nئۈچۈن counter ئىشلىتىدۇ.\n\nMaintenance ياكى consumable replacement تاماملانغاندىن كېيىن:\n- counter نى reset قىلىش\n\nsource بويىچە:\n- accurate tracking\n- future maintenance scheduling\n\nئۈچۈن مۇھىم.\n\n**ئەستە تۇتۇڭ: Maintenance done → Reset counter if printer uses one**\n\n---\n\n### 4. Clean the Printer\n\nمەنبە:\n- exterior\n- interior\n\nنى regular cleaning قىلىشنى تىلغا ئالىدۇ.\n\nتازىلىنىدىغان residue:\n- dust\n- toner residue\n- debris\n\nSource-stated cleaning material:\n- lint-free cloth ياكى swab\n- isopropyl alcohol بىلەن dampened\n\n**Source-safety note:** reviewed lesson بۇنى پەقەت transcript نىڭ own manufacturer-guideline context ىدا ساقلايدۇ؛ printer model غا ماس بولمىغان universal chemical-cleaning instruction دەپ كېڭەيتمەيدۇ.\n\n---\n\n## Laser Calibration\n\nSource process:\n1. Test page\n2. Alignment pattern ياكى color gradient\n3. Printer analyze\n4. Internal sensor/mechanism adjustment\n\nCalibration:\n- automatic\n- manual through settings menu\n\nمەنبە periodic calibration نى تەۋسىيە قىلىدۇ، بولۇپمۇ:\n- toner cartridge ئالماشتۇرغاندىن كېيىن\n- maintenance task قىلغاندىن كېيىن\n\n**Laser exam memory:**\n> **Replace toner + Maintenance kit + Reset counter + Clean + Calibrate**\n\n---\n\nExam Objective 3.8\nبىر ئەھۋال بېرىلگەندە، مۇۋاپىق پرىنتېر ئاسراش مەشغۇلاتلىرىنى ئىجرا قىلىڭ.\n\n# 3. Thermal Printer Maintenance\n\n## Thermal Printer قانداق ئىشلەيدۇ؟\n\nThermal printer:\n- ink ئىشلەتمەيدۇ\n- toner ئىشلەتمەيدۇ\n- **heat** ئىشلىتىدۇ\n\nئۇ:\n- specially coated **thermal paper**\n\nئۈستىدىكى heat-sensitive chemical layer نى heating element ئارقىلىق قوزغىتىپ text/image ھاسىل قىلىدۇ.\n\nSource common example:\n- store receipt\n\n---\n\n## Thermal Printer Components\n\n### Feed Assembly\n\n**Feed assembly**\n- thermal paper نى printer ئارقىلىق تارتىپ ئۆتكۈزىدۇ\n- smooth/consistent paper movement نى ساقلايدۇ\n\n### Heating Element\n\n**Heating element**\n- precise heat ھاسىل قىلىدۇ\n- thermal paper نىڭ بەلگىلەنگەن area لىرىنى قىزىتىدۇ\n- شۇ ئارقىلىق character/image ھاسىل قىلىدۇ\n\n### Thermal Paper\n\n**Thermal paper**\n- heat-sensitive chemical coating بار مەخسۇس paper\n\n**Thermal component memory:**\n- Feed assembly = Move paper\n- Heating element = Apply heat\n- Thermal paper = Heat-reactive media\n\n---\n\n## Heat Sensitivity / Temperature\n\nDifferent thermal paper:\n- heat sensitivity جەھەتتە پەرقلىق بولۇشى مۇمكىن\n\nمەنبە:\n- heating-element temperature نى manufacturer guideline بويىچە configure قىلىش\n- clear/crisp print بىلەن paper integrity ئارىسىدا balance قىلىش\n\nنى تەكىتلەيدۇ.\n\nSource:\n- higher-sensitivity paper → less heat required\n- ئەمما ۋاقىت ئۆتۈشى بىلەن fading غا تېخىمۇ سەزگۈر بولۇشى مۇمكىن\n\n---\n\n## Thermal Paper Storage\n\nThermal paper نى:\n- cool\n- dry\n- direct sunlight دىن يىراق\n\nجايدا ساقلاش تەۋسىيە قىلىنىدۇ.\n\nمەنبە تۆۋەندىكىلەرنىڭ paper performance نى ناچارلاشتۇرۇشى مۇمكىنلىكىنى چۈشەندۈرىدۇ:\n- excessive heat\n- humidity\n- direct sunlight\n\n---\n\n## Thermal Maintenance Tasks\n\n### 1. Replace Paper Roll\n\nPaper roll:\n- low\n- ياكى depleted\n\nبولسا ۋاقتىدا ئالماشتۇرۇڭ.\n\nمەقسەت:\n- printing interruption نى ئازايتىش\n- workflow نى داۋاملاشتۇرۇش\n\n### 2. Clean Heating Element\n\nHeating element دا:\n- residue\n- debris\n\nيىغىلىشى مۇمكىن.\n\nبۇ:\n- print quality نى تۆۋەنلىتىشى\n- overheating issue پەيدا قىلىشى\n\nمۇمكىن.\n\nPeriodic cleaning:\n- heating element نىڭ efficient operation ىنى ساقلايدۇ\n- print quality نى ساقلايدۇ\n- overheating-related malfunction نى ئازايتىشقا ياردەم بېرىدۇ\n\n### 3. Remove Internal Debris\n\nPrinter mechanism ئىچىدىكى debris نى تازىلاش:\n- jam risk نى ئازايتىدۇ\n- mechanical malfunction نى ئازايتىدۇ\n- printer lifespan نى ئۇزارتىشقا ياردەم بېرىدۇ\n\n**Thermal exam memory:**\n> **Replace paper + Clean heating element + Remove debris + Protect paper from heat/humidity/sunlight**\n\n---\n\nExam Objective 3.8\nبىر ئەھۋال بېرىلگەندە، مۇۋاپىق پرىنتېر ئاسراش مەشغۇلاتلىرىنى ئىجرا قىلىڭ.\n\n# 4. Impact Printer Maintenance\n\n## Impact Printer قانداق ئىشلەيدۇ؟\n\n**Impact printer**\n- mechanical force ئىشلىتىدۇ\n- printhead ink ribbon نى paper غا سوقىدۇ\n- dots ياكى lines ئارقىلىق character/image ھاسىل قىلىدۇ\n\nمەنبە ئۇنى:\n- multipart form\n- invoice\n- service ticket\n- contract\n\nقاتارلىق business use بىلەن باغلايدۇ.\n\nSource trade-off:\n- modern non-impact printer لارنىڭ speed/resolution ىغا يەتمەسلىكى مۇمكىن\n- ئەمما business environment دا يەنىلا ئىشلىتىلىدۇ\n\n---\n\n## Impact Printer Components\n\n### Printhead\n\n**Printhead**\n- ink ribbon نى paper غا mechanical strike قىلىدۇ\n- character/image ھاسىل قىلىدۇ\n\n### Ink Ribbon\n\n**Ink ribbon**\n- printhead بىلەن paper ئارىسىدا تۇرىدۇ\n- ink نى carry قىلىدۇ\n- impact ئارقىلىق ink paper غا يۆتكىلىدۇ\n\n### Tractor Feed\n\n**Tractor feed mechanism**\n- continuous paper نى controlled manner دا يۆتكەيدۇ\n- printhead ئاستىدىكى paper position/alignment نى ساقلايدۇ\n\n**Impact component memory:**\n- Printhead = Strike\n- Ribbon = Ink\n- Tractor feed = Move/align continuous paper\n\n---\n\n## Continuous-Form / Impact Paper\n\nImpact printer:\n- **continuous-form paper**\nئىشلىتىشى مۇمكىن.\n\nSource description:\n- continuous roll\n- ياكى perforated sheets joined together\n\nبۇ:\n- lengthy document نى frequent reload قىلماي print قىلىشقا ياردەم بېرىدۇ\n\nSource examples:\n- invoices\n- receipts\n\n---\n\n## Multipart / Carbon Copies\n\nImpact paper:\n- multipart construction\n\nبولۇشى مۇمكىن.\n\nSource بۇنى **carbon copies** بىلەن چۈشەندۈرىدۇ.\n\nPrinthead pressure:\n- top layer غا print قىلىدۇ\n- subsequent layer لارغا pressure ئارقىلىق copy ھاسىل بولىدۇ\n\nنەتىجە:\n- duplicate\n- triplicate\n\ncopy نى بىر print operation دا ھاسىل قىلىش مۇمكىن.\n\n**ئەستە تۇتۇڭ: Impact printer = Multipart forms / pressure-based copies**\n\n---\n\n## Impact Printer Maintenance Tasks\n\n### 1. Replace Ribbon\n\nRibbon ۋاقىت ئۆتۈشى بىلەن:\n- worn\n- ink weak\n\nبولىدۇ.\n\nSymptoms:\n- faded print\n- illegible print\n\nSolution:\n- ribbon نى ئالماشتۇرۇش\n\n### 2. Replace Printhead\n\nMechanical printhead:\n- wear out بولۇشى مۇمكىن\n\nنەتىجە:\n- print quality/consistency تۆۋەنلەيدۇ\n\nSource:\n- لازىم بولغاندا printhead نى ئالماشتۇرۇش\n\nنى تىلغا ئالىدۇ.\n\n### 3. Keep / Replace Paper Stock\n\nContinuous-feed paper مۇ تۈگەيدۇ.\n\nمەنبە:\n- additional paper stock on hand\n\nساقلاشنى تەۋسىيە قىلىدۇ.\n\n**Impact exam memory:**\n> **Replace ribbon + Replace worn printhead + Refill continuous paper**\n\n---\n\n# Objective 3.8 — Final Comparison\n\n| Printer type | Printing method | Source maintenance focus |\n|---|---|---|\n| **Inkjet** | Liquid ink through printhead | Clean printhead, replace ink, clear jams, calibrate |\n| **Laser** | Toner + imaging drum + fuser | Replace toner, maintenance kit, reset counter, clean, calibrate |\n| **Thermal** | Heat on thermal paper | Replace paper, clean heating element, remove debris |\n| **Impact** | Printhead strikes ink ribbon | Replace ribbon, worn printhead, continuous paper |\n\n## Laser Imaging Process — Final Memory\n\n1. **Processing**\n2. **Charging**\n3. **Exposing**\n4. **Developing**\n5. **Transferring**\n6. **Fusing**\n7. **Cleaning**\n\n## Quick Consumable Match\n\n- **Inkjet** → Ink cartridge\n- **Laser** → Toner cartridge\n- **Thermal** → Thermal paper\n- **Impact** → Ink ribbon + continuous paper\n\n## Quick Troubleshooting/Maintenance Clues\n\n- Streaky inkjet → Check/clean printhead\n- Ink depleted → Replace ink cartridge\n- Laser toner low → Replace toner\n- Laser maintenance due → Maintenance kit / counter\n- Thermal print poor → Check heating element / thermal paper\n- Impact print faded → Ribbon may be worn\n- Impact paper feeding → Tractor-feed/continuous-paper path\n"}, {"id": "4.1", "number": "4.1", "domain": "4", "domain_en": "Virtualization & Cloud", "domain_ug": "مەۋھۇملاشتۇرۇش ۋە بۇلۇت", "english": "Exam objective 4.1, explain virtualization concepts. Desktop virtualization. Desktop virtualization fundamentally changes how we interact with computers by decoupling or separating the content displayed on your screen from the physical hardware used for processing and storage.\n\nPicture a scenario where your computer's operating system, all the applications you use, and your files, are not stored directly on your device. Instead, they reside on a server that's accessible over a network connection. This means that regardless of the device you're using or where you are, you can access your desktop environment with all your familiar applications and files intact.\n\nThis paradigm shift embodies the core of desktop virtualization, providing unmatched flexibility, accessibility, and convenience in our technological interactions. Virtual desktop infrastructure, or VDI, takes this concept further. For the purpose of this training course, I will be simplifying this concept down to three main parts, the client, the server, and the virtual machines that house our virtual desktops.\n\nThe client, which in this context may be referred to as a thin client, is your computer or device that you use to connect to the virtual machine. It could be a laptop, workstation, or even a tablet or a smartphone. The server is the central hub that stores and manages all the virtual machine setups.\n\nThis server can be local, referred to as on-premises, or located in the cloud. Then there are the virtual machines, which house our virtual desktops. These virtual machines reside on the server and are controlled by a special piece of software known as a Type 1 hypervisor.\n\nWith VDI, each user will have their own virtual machine, complete with an operating system, applications, and their personal files. Just imagine each virtual machine as a personalized workspace, tailor-made for each user. Together, these components form the backbone of VDI.\n\nNow let's walk through how a connection works. Imagine you're at home or in the office and need to do some work. You grab your laptop, which acts as the client device, and turn it on.\n\nNow it is time to connect to the server. To do this, you would open up a program, website, or domain-based connection on your laptop designed to connect you to your virtual desktop. Next, the program will prompt you to enter your username and password.\n\nOnce you do, it knows who you are and where to take you. The program then communicates with the server, saying, \"Hey, someone wants to use their virtual desktop. Can you help them out?\" The server looks up your details and locates the virtual machine that contains your virtual desktop.\n\nThe server says, \"Sure thing,\" and sets up a special connection just for you. From here, you will be able to interact with a graphical user interface, or GUI, while all the processing and storage takes place on the server. And that's how a connection works in VDI.\n\nIt's like having your personal computer stored remotely. That is available whenever you need it. So far, you know what VDI is and how it works.\n\nNow it is time to discuss some of its benefits. Firstly, VDI provides agility by allowing clients and virtual desktops to be easily initiated and terminated from the virtual desktop infrastructure. Additionally, it centralizes desktop management, leading to increased productivity.\n\nFurthermore, VDI enhances security by centralizing data and applications, granting companies remote control over users' operating systems and enabling strict access controls. With VDI, you get all these benefits and more, while also reducing operational costs and the need to manually configure each device, be it a workstation, laptop, tablet, or smartphone. Exam objective 4.1, explain virtualization concepts.\n\nClient-side virtualization. As previously discussed, desktop virtualization and the virtual desktop infrastructure involves hosting desktop environments on remote servers. In this model, the desktop environment, including the operating system, applications, and user data, resides centrally on a server and is accessed by a user's client device over a network connection.\n\nWhile this works great for many use cases, we do have another virtualization option. This option is called client-side virtualization, and it involves running virtual machines directly on the end user device. In this model, a Type 2 hypervisor, or virtualization software, is installed on the client device, not a remote server, allowing users to create and run multiple virtual machines concurrently.\n\nEach virtual machine operates as an isolated environment with its own operating system and applications, enabling users to run different operating systems or experiment with software configurations without affecting the host system. Next, I will take you a bit deeper into this topic and show you what client-side virtualization might look like. In the image here, I have a laptop, which will be referred to as the host device in this client-side virtualization setup.\n\nThis device has physical hardware, such as a CPU, memory, storage, and a network connection. This host device also has an operating system installed on it. So far, this setup is just like any other until I install a Type 2 hypervisor application.\n\nOnce I do that, I unlock the power of client-side virtualization. With a Type 2 hypervisor installed on the host OS, I can create and control virtual machines, complete with their own isolated operating systems, applications, and data files. Each virtual machine will also be allocated a configurable portion of the host machine's physical resources with which to use.\n\nWhile you can configure the virtual machine with as little or as much resources as you would like, just make sure to save enough resources for the host OS. Moving on, client-side virtualization provides a versatile solution for various use cases. Firstly, it can serve as a sandbox environment, allowing users to create isolated virtual machines for testing new software, experimental code, or conducting system experiments without impacting their primary operating environment.\n\nThis ensures that any potential issues or conflicts are contained within the virtual environment, minimizing risks to the host system. Additionally, client-side virtualization is invaluable for software development and testing, enabling developers to replicate different operating systems, hardware configurations, or network setups for comprehensive testing and validation of applications. Furthermore, it facilitates the virtualization of legacy software or operating systems, enabling organizations to continue using outdated applications without the need for dedicated legacy hardware.\n\nLastly, client-side virtualization supports cross-platform development and testing by allowing users to create virtual machines with different operating systems, ensuring seamless performance across diverse platforms. Overall, client-side virtualization enhances productivity, streamlines testing processes, and overcomes compatibility challenges in software development and deployment. Exam objective 4.1, explain virtualization concepts.\n\nHypervisors. Now, you might recall that we encountered the term hypervisor in our studies of desktop virtualization, and then again when I covered client-side virtualization. Well, that is because a hypervisor is the software that makes virtualization possible.\n\nA hypervisor is a software layer that allows multiple operating systems to run on a single physical hardware platform simultaneously. It accomplishes this by dividing up the computer's resources, like its processing power, memory, and storage, so that different programs or operating systems can run on it without getting in each other's way. Now that we have a solid definition for hypervisor in place, we will move on to learning about the two main types, which are the Type 1 hypervisor and the Type 2 hypervisor.\n\nType 1 hypervisors, also known as bare metal hypervisors, operate directly on the host hardware without requiring an underlying operating system. They have direct access to physical resources, offering high performance and efficiency, which makes them suitable for enterprise environments and beta centers where virtualizing servers is common practice. In contrast, Type 2 hypervisors, also known as hosted hypervisors, run as applications on top of conventional operating systems like Windows, Mac OS, or Linux.\n\nThey rely on the underlying operating system to manage hardware resources and provide services to virtual machines. Type 2 hypervisors are often used for client-side virtualization. The primary distinction between Type 1 and Type 2 hypervisors lies in their architecture and how they interact with hardware, with Type 1 offering superior performance and scalability for larger-scale virtualization deployments, while Type 2 is more suitable for smaller-scale or individual virtualization needs.\n\nAfter you install a hypervisor, you can open up its user interface and begin to create, start up, shut down, and terminate any number of virtual machines. You will also have the ability to control resource allocations to each instance, including the amount of memory or RAM, the number of CPU cores. You can even set up various types of networking capabilities.\n\nLastly, let's explore virtualization security. When it comes to securing virtualized environments, several measures can be taken. One strategy is to limit the ability to create virtual machines altogether.\n\nDisabling virtualization in the BIOS or UEFI settings is a security measure used to prevent unauthorized or unintended virtual machine creation and execution on a system. Next, we have a virtual trusted platform module, or VTPM. This technology is used in virtualized environments to provide security functions similar to a physical TPM.\n\nThe virtual trusted platform module enables the creation and management of a virtual TPM instance within virtual machines, allowing them to benefit from TPM functionality without requiring physical TPM hardware. This technology enhances security by enabling features such as secure boot and hardware-based encryption within the guest operating system. Even with all this security in place, the primary security concern facing a virtualized environment is an attack known as virtual machine escape.\n\nThis is a security vulnerability in virtualized environments where an attacker gains unauthorized access to the host system or hypervisor from within a guest virtual machine. This exploit allows the attacker to break out of the confines of the virtual machine and execute malicious code or access sensitive information on the host system. Virtual machine escape vulnerabilities pose a significant security risk as they can potentially compromise the integrity and security of the entire virtualized environment.\n\nExam objective 4.1, explain virtualization concepts. Containers. Now that we understand desktop virtualization, client-side virtualization, and hypervisors, there is one more important concept to discuss before wrapping up this objective, and that concept is containers.\n\nA container is a lightweight method of packaging and running an application along with everything it needs to operate. This includes the application itself, the libraries it depends on, configuration files, and other required supporting components. By packaging all of these pieces together, a container ensures that the application behaves the same way no matter where it runs.\n\nWhether the container is deployed on a developer's laptop, a company server, or a cloud environment, the application inside the container will operate consistently because all of its required components travel with it. To understand how containers work, it helps to compare them to the virtual machines we previously discussed. In a virtual machine environment, each virtual machine contains its own complete operating system, along with its applications and supporting files.\n\nThese virtual machines rely on a hypervisor to divide and manage the physical hardware resources, such as CPU, memory, and storage. The hypervisor keeps each virtual machine isolated from the others so that they do not interfere with one another. While this design provides strong separation between systems, it also means that each virtual machine requires additional system resources because every instance includes a full operating system.\n\nThis increases storage usage and memory requirements, and it can take longer for a virtual machine to start up. Containers take a different and more efficient approach. Instead of running a full operating system for every instance, containers share the host system's operating system kernel.\n\nThe kernel is the core part of the operating system that communicates directly with the hardware. Because containers share this kernel, they do not include their own full operating system. This means that containers are dependent on the operating system of the host system.\n\nIn other words, a container must run on a system that uses the same type of operating system kernel. For example, containers built for a Linux environment run on a Linux host system. This is different from virtual machines, which can run completely different operating systems because each virtual machine includes its own full operating system.\n\nBecause containers share the host operating system kernel, multiple containers can run on the same system while still remaining logically isolated from one another. Each container behaves as if it has its own environment, but in reality, they are all using the same underlying operating system resources. Since containers do not require a full operating system, they are significantly smaller and can start up much faster than traditional virtual machines.\n\nThis efficiency makes containers especially useful in modern application development and cloud computing environments. Developers can package an application inside a container and move it easily between systems without worrying about differences in software versions or missing dependencies. For example, a web application that runs inside a container on a developer's laptop can be deployed to a testing server or a cloud platform with confidence that it will behave the same way as long as the host system supports the same operating system environment required by the container.\n\nIt is important to understand that containers are not intended to completely replace virtual machines. Instead, they serve a different purpose. Virtual machines are ideal when you need to run entirely separate operating systems on the same hardware, such as running Windows and Linux on the same physical server.\n\nContainers are designed to run applications efficiently within the same operating system environment. In many real world environments, these technologies are often used together. For example, an organization might run several virtual machines on a server using a hypervisor and then run multiple containers inside those virtual machines to host individual applications.\n\nThis approach allows administrators to combine the strong operating system isolation of virtual machines with the speed and efficiency of containers. To summarize the key difference, virtual machines rely on a hypervisor and include a complete operating system for every instance. Containers share the host operating system kernel and package only the application and its required components.\n\nRegardless of the approach used, both technologies provide isolation and flexibility when running applications and workloads.", "uyghur": "Exam Objective 4.1\nمەۋھۇملاشتۇرۇش (Virtualization) ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n# Virtualization دېگەن نېمە؟\n\n**Virtualization** — بىر physical computer/server نىڭ hardware resource لىرىنى software ئارقىلىق بۆلۈپ ياكى abstraction قىلىپ، بىر نەچچە ئايرىم virtual environment نى ئىشلىتىش ئۇسۇلى.\n\nObjective 4.1 دا مەنبە تۆت ئاساسىي بۆلەكنى قاپلايدۇ:\n\n1. Desktop Virtualization / VDI\n2. Client-Side Virtualization\n3. Hypervisors + Virtualization Security\n4. Containers\n\n---\n\n# 1. Desktop Virtualization ۋە VDI\n\n## Desktop Virtualization\n\n**Desktop virtualization**\n- ئىشلەتكۈچى ئېكراندا كۆرۈۋاتقان desktop environment نى\n- processing/storage ئىشلىتىدىغان physical hardware دىن ئايرىيدۇ\n\nمەنبە scenario:\n- operating system\n- applications\n- user files\n\nئىشلەتكۈچىنىڭ local device ىدا بىۋاسىتە ساقلانمايدۇ؛ ئۇلار network ئارقىلىق زىيارەت قىلىنىدىغان server دا بولىدۇ.\n\nنەتىجىدە user:\n- قايسى device ئىشلىتىشىدىن\n- قەيەردە بولۇشىدىن\n\nقەتئىينەزەر، ئۆزىنىڭ familiar desktop environment ىغا:\n- applications\n- files\n\nبىلەن access قىلالايدۇ.\n\nSource-stated benefits:\n- flexibility\n- accessibility\n- convenience\n\n**ئەستە تۇتۇڭ: Desktop virtualization = Desktop experience remote hardware/server دىن كېلىدۇ**\n\n---\n\n## VDI — Virtual Desktop Infrastructure\n\n**VDI — Virtual Desktop Infrastructure**\n\nمەنبە بۇ course ئۈچۈن VDI نى ئۈچ ئاساسىي بۆلەككە ئاددىيلاشتۇرىدۇ:\n\n1. **Client**\n2. **Server**\n3. **Virtual Machines (VMs)**\n\n### 1. Client\n\nClient:\n- user نىڭ virtual desktop قا ئۇلىنىدىغان device ى\n\nSource examples:\n- laptop\n- workstation\n- tablet\n- smartphone\n\nTranscript بۇ context دا client نى **thin client** دەپمۇ ئاتىلىشى مۇمكىن دەيدۇ.\n\n**Source-model caution:** reviewed Uyghur بۇنى source نىڭ simplified VDI model ى سۈپىتىدە ساقلايدۇ؛ ھەر بىر laptop/workstation نى universal technical definition بويىچە thin client دەپ ئومۇملاشتۇرمايدۇ.\n\n### 2. Server\n\nServer:\n- virtual machine setup لارنى centrally store/manage قىلىدىغان hub\n\nSource location examples:\n- on-premises\n- cloud\n\n### 3. Virtual Machines\n\nVM لار:\n- server ئۈستىدە تۇرىدۇ\n- virtual desktop نى ئۆز ئىچىگە ئالىدۇ\n\nمەنبە بۇ VDI model دا VM لارنى:\n- **Type 1 hypervisor**\n\nباشقۇرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nSource teaching model:\n- ھەر user نىڭ ئۆزىگە خاس VM ى بار\n- VM ئىچىدە:\n  - operating system\n  - applications\n  - personal files\n\nبار.\n\n**Source-scope note:** بۇ `each user has their own VM` wording transcript نىڭ course-level VDI model ى؛ reviewed lesson pooled/shared desktop architecture قاتارلىق سىرتقى VDI model لارنى قوشمايدۇ.\n\n---\n\n## VDI Connection قانداق ئىشلەيدۇ؟\n\nمەنبەدىكى step-by-step flow:\n\n1. User client device نى قوزغىتىدۇ\n2. Virtual desktop قا ئۇلايدىغان:\n   - program\n   - website\n   - ياكى domain-based connection\n   نى ئاچىدۇ\n3. Username/password كىرگۈزىدۇ\n4. Connection software server بىلەن ئالاقىلىشىدۇ\n5. Server user غا مۇناسىۋەتلىك virtual machine نى تاپىدۇ\n6. Server connection نى قۇرىدۇ\n7. User **GUI — Graphical User Interface** بىلەن interaction قىلىدۇ\n8. Processing ۋە storage server تەرەپتە ئېلىپ بېرىلىدۇ\n\n**Exam memory:**\n> **Client displays/interacts**\n>\n> **Server/VM does the source-described processing and storage**\n\n---\n\n## VDI Benefits\n\nمەنبە تۆۋەندىكى benefits نى بېرىدۇ:\n\n### Agility\n- virtual desktop/client environment نى ئاسان initiate/terminate قىلىش\n\n### Centralized Management\n- desktop management نى centralized قىلىش\n- productivity نى ياخشىلاش\n\n### Security\n- data/application لارنى centralized قىلىش\n- company/user OS ئۈستىدە remote control\n- strict access control\n\n### Operational Efficiency\n- operational cost نى ئازايتىش\n- ھەر device نى قولدا ئايرىم configure قىلىش ئېھتىياجىنى ئازايتىش\n\nSource examples:\n- workstation\n- laptop\n- tablet\n- smartphone\n\n**VDI memory: Centralized desktop + Remote access + Central management/security**\n\n---\n\nExam Objective 4.1\nمەۋھۇملاشتۇرۇش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n# 2. Client-Side Virtualization\n\nDesktop virtualization/VDI دا desktop:\n- remote server دا hosted\n\nبولىدۇ.\n\n**Client-side virtualization** دا بولسا:\n- virtual machine لار **end-user device نىڭ ئۆزىدە** ئىجرا بولىدۇ\n\n---\n\n## Type 2 Hypervisor on Client\n\nClient-side virtualization دا:\n\n**Type 2 hypervisor / virtualization software**\n- client device غا install قىلىنىدۇ\n- remote server غا ئەمەس\n- host operating system ئۈستىدە ئىشلەيدۇ\n\nئۇ:\n- multiple VM create\n- multiple VM run\n- multiple VM control\n\nقىلىشقا يول قويىدۇ.\n\nھەر VM:\n- isolated environment\n- own operating system\n- own applications\n- own data files\n\nبولالايدۇ.\n\n---\n\n## Host Device\n\nمەنبە laptop مىسالىنى ئىشلىتىدۇ.\n\n**Host device**\n- physical computer\n\nئۇنىڭ physical resources:\n- CPU\n- memory\n- storage\n- network connection\n\nبار.\n\nHost قا:\n- host operating system\n\nئورنىتىلغان.\n\nئۇنىڭ ئۈستىگە:\n- Type 2 hypervisor application\n\nئورنىتىلغاندىن كېيىن client-side virtualization ئىشلىتىلىدۇ.\n\n---\n\n## VM Resource Allocation\n\nھەر VM غا host نىڭ physical resource لىرىدىن configurable portion تەقسىملىنىدۇ.\n\nSource examples:\n- RAM\n- CPU/resource capacity\n- storage/network-related host resources\n\nمەنبەنىڭ practical warning ى:\n\n> VM غا resource تەقسىملىگەندە **host OS ئۈچۈن يېتەرلىك resource قالدۇرۇڭ**.\n\n**Source wording note:** transcript `as little or as much resources as you would like` دەپ ئاددىيلاشتۇرىدۇ؛ reviewed lesson بۇنى unlimited-resource rule دەپ كېڭەيتمەيدۇ.\n\n---\n\n## Client-Side Virtualization Use Cases\n\n### 1. Sandbox\n\n**Sandbox environment**\n- new software\n- experimental code\n- system experiment\n\nنى isolated VM دا test قىلىش.\n\nBenefit:\n- problem/conflict VM ئىچىدە قېلىشى\n- host system غا risk نى ئازايتىش\n\n### 2. Software Development and Testing\n\nDeveloper:\n- different operating system\n- hardware configuration\n- network setup\n\nنى replicate قىلىپ application test/validation قىلالايدۇ.\n\n### 3. Legacy Software / OS\n\nOld application ياكى OS نى:\n- dedicated legacy hardware بولمىسىمۇ\n- VM ئىچىدە ئىشلىتىش\n\n### 4. Cross-Platform Development / Testing\n\nDifferent operating system لار بىلەن VM قۇرۇپ:\n- cross-platform development\n- compatibility testing\n\nقىلىش.\n\nSource-stated benefits:\n- productivity\n- streamlined testing\n- compatibility challenge نى ئازايتىش\n\n**Exam memory: Client-side virtualization = Local host + Type 2 + Test/Sandbox/Legacy**\n\n---\n\nExam Objective 4.1\nمەۋھۇملاشتۇرۇش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n# 3. Hypervisors\n\n## Hypervisor دېگەن نېمە؟\n\n**Hypervisor**\n- virtualization نى ئەمەلگە ئاشۇرىدىغان software layer\n- بىر physical hardware platform ئۈستىدە multiple operating system/VM نى بىرلا ۋاقىتتا ئىشلەتكىلى بولىدۇ\n\nHypervisor physical resource لارنى باشقۇرىدۇ/تەقسىملەيدۇ:\n\n- CPU processing power\n- memory\n- storage\n\nشۇنداق قىلىپ VM/OS لار:\n- بىر-بىرىگە توسالغۇ قىلماي\n- ئايرىم environment سۈپىتىدە\n\nئىشلىيەلەيدۇ.\n\n---\n\n## Type 1 Hypervisor — Bare-Metal\n\n**Type 1 hypervisor**\n- **bare-metal hypervisor** دەپمۇ ئاتىلىدۇ\n- physical host hardware ئۈستىدە بىۋاسىتە ئىشلەيدۇ\n- underlying general-purpose OS تەلەپ قىلمايدۇ\n\nمەنبە source-stated benefits نى:\n- direct hardware/resource access\n- high performance\n- efficiency\n- scalability\n\nدەپ چۈشەندۈرىدۇ.\n\nSource use:\n- enterprise\n- server virtualization\n- data center\n\n**Transcript correction:** source `enterprise environments and beta centers` دەپ transcript قىلىنغان. Server virtualization context بويىچە reviewed Uyghur دا **data centers** ئىشلىتىلدى؛ ئەسلى English transcript ئۆزگەرتىلمىدى.\n\n**ئەستە تۇتۇڭ: Type 1 = Hardware → Hypervisor → VMs**\n\n---\n\n## Type 2 Hypervisor — Hosted\n\n**Type 2 hypervisor**\n- **hosted hypervisor**\n- conventional operating system ئۈستىدە application سۈپىتىدە ئىشلەيدۇ\n\nSource OS examples:\n- Windows\n- macOS\n- Linux\n\nType 2:\n- underlying OS غا تايىنىپ hardware resource لارنى manage قىلىدۇ\n- VM لارغا service/resource access تەمىنلەيدۇ\n\nSource use:\n- client-side virtualization\n- smaller-scale\n- individual virtualization need\n\n**ئەستە تۇتۇڭ: Type 2 = Hardware → Host OS → Hypervisor App → VMs**\n\n---\n\n## Type 1 vs Type 2\n\n| Type 1 | Type 2 |\n|---|---|\n| Bare-metal | Hosted |\n| Directly on hardware | Runs on host OS |\n| Source: higher performance/efficiency/scalability | Source: smaller/client-side use |\n| Enterprise/server virtualization | Individual/testing/client-side |\n\n---\n\n## Hypervisor بىلەن نېمىلەرنى باشقۇرغىلى بولىدۇ؟\n\nHypervisor UI ئارقىلىق:\n- create VM\n- start VM\n- shut down VM\n- terminate VM\n- RAM allocation\n- CPU core allocation\n- networking capability\n\nنى configure/control قىلغىلى بولىدۇ.\n\n---\n\n# Virtualization Security\n\nمەنبە Objective 4.1 hypervisor section نىڭ ئىچىدە ئۈچ security concept نى قاپلايدۇ:\n\n1. Disable virtualization in BIOS/UEFI\n2. vTPM\n3. VM escape\n\n---\n\n## Disable Virtualization in BIOS/UEFI\n\nBIOS/UEFI دا virtualization نى disable قىلىش:\n- unauthorized VM creation\n- unintended VM execution\n\nنىڭ ئالدىنى ئېلىش ئۈچۈن ئىشلىتىلىدىغان security measure سۈپىتىدە source دا بېرىلگەن.\n\n**Source-scope note:** reviewed lesson بۇنى source scenario سۈپىتىدە ساقلايدۇ؛ enterprise policy ياكى universal best-practice دەپ كېڭەيتمەيدۇ.\n\n---\n\n## vTPM — Virtual Trusted Platform Module\n\n**vTPM — Virtual Trusted Platform Module**\n\nمەنبە بويىچە:\n- physical TPM غا ئوخشاش security function نى VM غا تەمىنلەيدۇ\n- VM ئىچىدە virtual TPM instance create/manage قىلىشقا يول قويىدۇ\n\nSource-stated capabilities:\n- Secure Boot\n- hardware-based encryption\n\nنى guest operating system ئىچىدە قوللاش.\n\n**Source-framing note:** transcript `without requiring physical TPM hardware` دەپ چۈشەندۈرىدۇ. Reviewed Uyghur بۇنى course wording سۈپىتىدە ساقلايدۇ؛ vTPM implementation/backing architecture نى سىرتتىن قوشمايدۇ.\n\n---\n\n## VM Escape — Virtual Machine Escape\n\n**VM escape**\n- guest VM ئىچىدىن\n- host system ياكى hypervisor غا\n- unauthorized access ئېلىش\n\nبىلەن مۇناسىۋەتلىك virtualization vulnerability.\n\nSource attack model:\n1. Attacker guest VM ئىچىدە\n2. VM isolation boundary دىن «escape» قىلىدۇ\n3. Host/hypervisor غا زىيانلىق code ئىجرا قىلىشى\n4. Sensitive information غا access قىلىشى مۇمكىن\n\nImpact:\n- entire virtualized environment integrity/security غا خەۋپ\n\n**Exam memory: VM escape = Guest breaks isolation → Host/Hypervisor risk**\n\n---\n\nExam Objective 4.1\nمەۋھۇملاشتۇرۇش ئۇقۇملىرىنى چۈشەندۈرۈڭ.\n\n# 4. Containers\n\n## Container دېگەن نېمە؟\n\n**Container**\n- application نى\n- ئۇنىڭغا لازىملىق supporting component لار بىلەن بىرلىكتە\n\npackage قىلىپ ئىجرا قىلىدىغان lightweight method.\n\nSource package includes:\n- application\n- libraries\n- configuration files\n- other required components\n\nمەقسەت:\n- application قەيەردە ئىجرا بولۇشىدىن قەتئىينەزەر consistent behavior ساقلاش\n\nSource environment examples:\n- developer laptop\n- company server\n- cloud environment\n\n**ئەستە تۇتۇڭ: Container = App + Dependencies packaged together**\n\n---\n\n## VM قانداق پەرقلىق؟\n\nTraditional VM:\n- each VM has complete operating system\n- applications\n- supporting files\n\nHypervisor:\n- CPU\n- memory\n- storage\n\nresource لارنى multiple VM ئارىسىدا باشقۇرىدۇ.\n\nVM isolation:\n- each VM بىر-بىرىدىن ئايرىم\n\nTrade-off:\n- ھەر VM دا full OS بار\n- storage usage كۆپ\n- memory requirement كۆپ\n- startup ۋاقىت ئۇزۇنراق\n\n---\n\n## Container Architecture\n\nContainer:\n- ھەر instance ئۈچۈن full OS قاچىلىمايدۇ\n- **host operating system kernel** نى share قىلىدۇ\n\n### Kernel\n\n**Kernel**\n- operating system نىڭ core قىسمى\n- hardware بىلەن بىۋاسىتە communication قىلىدۇ\n\nContainer لار:\n- same host kernel نى share قىلىدۇ\n- شۇنداقتىمۇ logically isolated بولالايدۇ\n\nSource-stated effects:\n- smaller size\n- faster startup\n- efficient resource use\n\n---\n\n## Container Host-OS Dependency — Source Model\n\nTranscript نىڭ teaching model ى:\n\n> Container host system نىڭ operating-system kernel type ىغا تايىنىدۇ.\n\nSource example:\n- Linux environment ئۈچۈن ياسالغان container → Linux host system دا ئىجرا بولىدۇ\n\nVM بولسا:\n- own full OS بار\n- source model بويىچە different OS لارنى بىر physical system ئۈستىدە ئىجرا قىلالايدۇ\n\n**Source-scope caution:** reviewed Uyghur بۇنى transcript نىڭ simplified architecture comparison ى سۈپىتىدە ساقلايدۇ؛ cross-platform container runtime، compatibility layer ياكى hidden VM implementation قاتارلىق سىرتقى detail قوشۇلمايدۇ.\n\n---\n\n## Containers نىڭ Benefits / Use Cases\n\nSource:\n- significantly smaller than traditional VM\n- faster startup\n- modern application development\n- cloud computing\n- portability\n- dependency consistency\n\nDeveloper container ئىچىدە application package قىلىپ:\n- laptop\n- test server\n- cloud platform\n\nئارىسىدا يۆتكەيدۇ.\n\nSource condition:\n- host system container تەلەپ قىلىدىغان operating-system environment نى قوللىشى كېرەك\n\n---\n\n## VM vs Container\n\n| Virtual Machine | Container |\n|---|---|\n| Full OS per instance | Shares host OS kernel |\n| Uses hypervisor | Lightweight application packaging/runtime |\n| More storage/memory overhead | Smaller/lighter |\n| Slower startup, per source | Faster startup |\n| Can host separate OS environments, per source model | Same-kernel/environment dependency, per source model |\n| Strong OS-level separation | Logical application isolation |\n\n---\n\n## VM ۋە Container بىرلىكتە ئىشلىتىلىشى مۇمكىن\n\nمەنبە:\n- VM ۋە container بىر-بىرىنىڭ تولۇق ئورنىنى باسمايدۇ\n\nدەپ تەكىتلەيدۇ.\n\nReal-world source example:\n1. Physical server ئۈستىدە hypervisor\n2. Multiple VM\n3. ھەر VM ئىچىدە multiple container\n4. ھەر container ئايرىم application host قىلىدۇ\n\nSource-stated combination:\n- VM → strong operating-system isolation\n- Container → speed/efficiency\n\n**ئەستە تۇتۇڭ: VM + Container = Can be used together**\n\n---\n\n# Objective 4.1 — Final Exam Memory Map\n\n## Desktop Virtualization / VDI\n- Desktop environment remote server/VM دا\n- Client connects over network\n- VDI source model = Client + Server + VMs\n- Type 1 hypervisor on server\n- GUI on client; processing/storage server-side in source model\n- Centralized management/security\n\n## Client-Side Virtualization\n- VM runs on user's local host device\n- Type 2 hypervisor\n- Sandbox / testing / legacy software / cross-platform testing\n- Leave enough resources for host OS\n\n## Hypervisors\n- **Type 1** = Bare-metal / directly on hardware\n- **Type 2** = Hosted / runs on host OS\n- Manage VM CPU/RAM/networking\n\n## Security\n- Disable virtualization in BIOS/UEFI → source security measure\n- **vTPM** = Virtual TPM functions for VM\n- **VM escape** = Guest isolation broken → host/hypervisor compromise risk\n\n## Containers\n- App + libraries + config + dependencies\n- Share host OS kernel\n- Smaller/faster than full VM, per source\n- VM = full OS per instance\n- Containers and VMs can be used together\n"}, {"id": "4.2", "number": "4.2", "domain": "4", "domain_en": "Virtualization & Cloud", "domain_ug": "مەۋھۇملاشتۇرۇش ۋە بۇلۇت", "english": "Exam objective 4.2, summarize cloud computing concepts. Cloud models. Cloud computing is defined as a model for enabling convenient on-demand network access to a shared pool of configurable computing resources.\n\nFor example, networks, servers, storage, applications, and services. Additionally, these resources can be rapidly provisioned and released with minimal management effort or service provider interaction. In simpler terms, cloud computing refers to using remote servers on the internet to store, manage, and process data rather than relying on a local server or personal computer.\n\nTo assist with understanding this concept, I will compare cloud computing to renting a storage unit. Instead of needing to build and maintain your own storage space at home, which would require a lot of effort and resources, you can simply rent a storage unit from a company. Similarly, with cloud computing, instead of setting up and maintaining your own servers and infrastructure, you can use remote servers provided by cloud service providers like Amazon Web Services, Microsoft Azure, or Google Cloud Platform.\n\nIt's like outsourcing the storage and management of your data and computing resources to a specialized company that takes care of everything for you. With cloud computing, there are various cloud models that exist. Among these cloud models are public cloud, private cloud, hybrid cloud, and community cloud.\n\nEach model presents distinct characteristics and benefits tailored to address specific requirements and challenges. A public cloud owned and operated by third party providers offers scalable resources on demand, making it suitable for a wide range of applications and workloads. With a public cloud, organizations can access computing resources such as servers, storage, and applications over the internet without needing to invest in or maintain their own infrastructure.\n\nThis model allows for flexibility and agility as resources can be provisioned or scaled up and down quickly based on demand. Additionally, public cloud providers handle tasks such as infrastructure management, security, and maintenance, relieving organizations of these responsibilities and allowing them to focus on their core business activities. Conversely, a private cloud offers dedicated infrastructure solely for one organization, ensuring enhanced control and security over data and applications.\n\nThis isolation from others minimizes the risk of unauthorized access and data breaches. With complete control over data management, compliance with regulatory requirements and internal policies is ensured. Private clouds also guarantee reliability and availability, maintaining access even during local internet outages.\n\nThe limited attack surface increases security, making private clouds ideal for storing sensitive information. Hybrid clouds blend public and private cloud features, providing flexibility in workload deployment and data storage. Organizations can host sensitive data on site while utilizing the scalability of public cloud resources for other tasks.\n\nThis integration enables seamless data movement between environments, optimizing resource utilization based on performance, security, and cost considerations. Overall, hybrid clouds offer a versatile solution for organizations seeking to balance control, security, scalability, and cost effectiveness in their IT infrastructure. Finally, community clouds serve a defined group of organizations with shared interests or requirements, fostering collaboration while maintaining autonomy and control.\n\nThese various cloud computing models empower organizations to tailor their IT infrastructure to align with their unique objectives, regulatory constraints, and operational needs. Exam objective 4.2, summarize cloud computing concepts. Cloud characteristics.\n\nCloud computing has revolutionized the way organizations manage and utilize their IT resources, offering a plethora of benefits, such as flexibility, scalability, and cost effectiveness. At the heart of cloud computing lie several key characteristics that underpin its functionality and value proposition. These characteristics, including shared resources, metered utilization, rapid elasticity, high availability, file synchronization, and multi-tenancy, collectively contribute to the efficiency, reliability, and accessibility of cloud services.\n\nUnderstanding these fundamental aspects is essential for organizations seeking to leverage the full potential of cloud computing in their operations. So let's define each characteristic and add them to our vocabulary. Shared resources in cloud computing refers to the pooling of computing resources, such as servers, storage, and networking, to serve multiple users or tenants.\n\nThis is often referred to as resource pooling. In this model, the underlying physical infrastructure is shared among many customers, and resources are dynamically allocated and reassigned based on demand. This allows cloud providers to efficiently utilize their hardware while delivering scalable services to many users at the same time.\n\nThe opposite approach is known as dedicated resources. In that model, the computing resources, such as servers, storage, or networking components, are not shared. Instead, they are reserved for a single customer or tenant.\n\nMetered utilization refers to the capability of cloud computing systems to measure and charge only for the resources that are actually used. This provides transparency and accountability for both cloud providers and their customers. Usage is typically measured on a pay-as-you-go basis, meaning organizations are billed according to the amount of computing resources they consume rather than paying for fixed infrastructure.\n\nCloud providers track several types of resource usage. Common examples include CPU utilization, which measures how much processing power is consumed, storage usage, which tracks how much data is stored in the cloud environment, and network ingress and egress, which measures the amount of data entering and leaving the cloud network. By monitoring these metrics, providers can accurately bill customers based on their actual resource consumption.\n\nThis metered approach allows organizations to scale their infrastructure up or down as needed while maintaining control over costs. As a result, companies can optimize resource allocation and budgeting based on real usage rather than estimated capacity. Rapid elasticity is the ability of cloud computing systems to scale resources up or down quickly and automatically in response to changing demand.\n\nThis scalability is often achieved through the dynamic provisioning and deprovisioning of resources. Cloud environments can rapidly scale resources to accommodate fluctuations in workload demand, such as adding resources during the peak usage times and automatically removing it when the peak is over. For example, with an e-commerce website, more web servers can be quickly added to handle increased traffic.\n\nOverall, rapid elasticity enables cloud systems to be provisioned according to demand, allowing organizations to efficiently manage their resources and adapt to changing workload requirements without manual intervention. High availability refers to the ability of cloud computing systems to ensure that services and resources are accessible and operational for users when needed, typically through redundancy and fault tolerance. Cloud providers implement redundancy and fault tolerance across their infrastructure to minimize downtime and ensure continuous availability of services.\n\nThis includes measures to prevent a single point of failure, ensuring that if one component fails, redundant systems can immediately take over without interrupting service. Additionally, cloud environments can quickly failover to another server, data center, or region in the event of an outage, further enhancing availability and resilience. These failover mechanisms provide organizations with confidence in relying on cloud services for critical operations, knowing that their applications and data will remain accessible even in the face of hardware failures or maintenance activities.\n\nNext up, we have file synchronization. This is the process of ensuring that files and data are consistently updated and mirrored across multiple devices or locations, allowing users to access the latest versions of files from any device or location. Cloud storage services often include file synchronization capabilities, allowing users to sync files across devices and access them from anywhere with an internet connection.\n\nThis facilitates collaboration, data sharing, and remote access to files, improving productivity and efficiency for users and organizations. Lastly, we have multi-tenancy. Multi-tenancy is a cloud computing architecture in which a single system or infrastructure serves multiple customers, often referred to as tenants.\n\nEach tenant operates in a logically isolated environment, even though they are all using the same underlying physical hardware and platform. In a multi-tenant environment, the cloud provider manages the shared infrastructure while ensuring that each tenant's data, applications, and workloads remain separate and secure. From the user's perspective, it appears as though they have their own dedicated environment.\n\nBut in reality, the system is efficiently supporting many different organizations at the same time. This concept closely relates to the idea of shared resources that we discussed earlier. In most multi-tenant environments, multiple tenants share the same underlying computing resources, such as servers, storage, and networking infrastructure.\n\nThese resources are pooled and dynamically allocated as needed. However, some cloud providers also offer dedicated resource options within a multi-tenant platform. In those cases, a customer may have exclusive access to specific hardware while still benefiting from the overall cloud management platform and services.\n\nUnderstanding multi-tenancy helps explain how cloud providers efficiently support many different organizations at once while maintaining logical separation and security between tenants. Exam Objective 4.2, Summarize Cloud Computing Concepts. Cloud Service Types.\n\nWe're on the brink of wrapping up our exploration of Domain 4 in the CompTIA A+ Core 1 exam objectives. But hold onto your hats because we've got one more exciting topic to cover, cloud service types. Now, building upon our previous discussion of the diverse cloud deployment models, public, private, hybrid, and community, it's now time to learn about the various service types that comprise the cloud computing landscape.\n\nCloud services fall into three primary categories, infrastructure as a service, or IaaS, platform as a service, or PaaS, and software as a service, or SaaS. These service types represent distinct levels of abstraction and functionality, each offering unique benefits and use cases. Let's explore each of these service types in detail to gain a comprehensive understanding of their functionalities and advantages.\n\nIaaS serves as the foundational layer. It grants organizations access to fundamental computing resources like servers, storage, and networking infrastructure. Here, users have the autonomy to build and manage their virtual machines and networks remotely, allowing for seamless scalability according to demand.\n\nIaaS liberates businesses from the burden of investing in costly hardware and alleviates the complexities of maintenance, providing a flexible environment for building and hosting their data and applications. Building upon the infrastructure layer, PaaS elevates cloud computing by offering a comprehensive software development and deployment environment. Imagine PaaS as a streamlined construction site where software developers are empowered to build and deploy applications without worrying about the underlying infrastructure.\n\nPaaS platforms abstract away the intricacies of configuring servers and managing networking resources, enabling software developers to focus solely on coding. This model accelerates the development life cycle, fostering rapid application delivery and facilitating collaboration among development teams. At the pinnacle of cloud services lies SaaS.\n\nSaaS can be likened to a fully furnished home where users simply consumed ready-made applications over the internet. With SaaS, organizations can access a plethora of software applications from productivity suites to customer relationship management systems via web browsers or dedicated clients. This consumption-based model eliminates the need for installation, maintenance or updates, providing unparalleled convenience and accessibility for users.\n\nIn essence, cloud services empower organizations to leverage modern computing technologies while minimizing operational overhead and capital expenditures. Whether it's the flexibility of IaaS, the agility of PaaS or the convenience of SaaS, cloud computing serves as a catalyst for innovation, collaboration and business growth in today's digital landscape. Moving forward with this topic, you should also understand how responsibility is shared between users and cloud service providers across different service types.\n\nIn managing a cloud environment, this shared responsibility encompasses various components, including the data center, networking, storage, servers, virtualization, operating system, data and applications. For infrastructure as a service, users bear more responsibility for managing the operating system, applications and data. The cloud provider handles infrastructure-related tasks such as data center management, networking, storage, server maintenance and virtualization management.\n\nIn platform as a service, the cloud provider takes on more responsibility for managing the underlying infrastructure by including the operating system. Users are primarily responsible for developing, deploying and managing their applications and data. With software as a service, the cloud provider assumes the majority of responsibility, including managing the entire stack from infrastructure to applications.\n\nUsers are typically responsible for configuring the application settings and managing user access. This division of responsibility allows users to focus on their core business functions while leveraging the expertise and resources of the cloud service provider. By understanding the shared responsibilities across different service types, organizations can effectively manage their cloud environments and maximize the benefits of cloud computing.", "uyghur": "Exam Objective 4.2\nبۇلۇت ھېسابلاش (Cloud Computing) ئۇقۇملىرىنى خۇلاسىلەڭ.\n\n# Cloud Computing دېگەن نېمە؟\n\n**Cloud computing** — network ئارقىلىق، ئېھتىياجغا ئاساسەن (on-demand)، ئورتاق ئىشلىتىلىدىغان ۋە تەڭشىگىلى بولىدىغان computing resource لارغا access قىلىش model ى.\n\nمەنبە resource مىساللىرىنى:\n- networks\n- servers\n- storage\n- applications\n- services\n\nدەپ بېرىدۇ.\n\nبۇ resource لار:\n- تېز provision قىلىنىشى\n- تېز release قىلىنىشى\n- ئازراق management effort\n- ياكى ئازراق service-provider interaction\n\nبىلەن ئىشلىتىلىشى مۇمكىن.\n\nئاددىي قىلىپ:\n> **Local computer/server نىڭ ئۆزىگەلا تايانماي، Internet ئارقىلىق remote server/resource ئىشلىتىش**\n\nمەنبە cloud computing نى **storage unit ئىجارىگە ئېلىش** بىلەن سېلىشتۇرىدۇ:\n\n- ئۆزىڭىز storage space قۇرۇپ/ئاسرىمايسىز\n- باشقا company تەمىنلىگەن resource نى ئىشلىتىسىز\n\nSource examples:\n- Amazon Web Services (AWS)\n- Microsoft Azure\n- Google Cloud Platform (GCP)\n\n**Source-scope note:** بۇ vendor لار source example؛ reviewed Uyghur ئۇلارنىڭ current product/service list ىنى سىرتتىن كېڭەيتمەيدۇ.\n\nObjective 4.2 ئۈچ ئاساسىي بۆلەكنى قاپلايدۇ:\n\n1. Cloud Models\n2. Cloud Characteristics\n3. Cloud Service Types + Shared Responsibility\n\n---\n\n# 1. Cloud Models\n\nمەنبە تۆت cloud model نى قاپلايدۇ:\n\n1. Public Cloud\n2. Private Cloud\n3. Hybrid Cloud\n4. Community Cloud\n\n## Public Cloud\n\n**Public cloud**\n- third-party provider تەرىپىدىن owned/operated\n- Internet ئارقىلىق resource تەمىنلەيدۇ\n- on-demand scalability بىلەن باغلىنىدۇ\n\nSource-stated resources:\n- servers\n- storage\n- applications\n\nOrganization:\n- ئۆزىنىڭ infrastructure ىنى سېتىۋېلىپ/ئاسراپ تۇرۇش ئېھتىياجىنى ئازايتالايدۇ\n- resource نى demand غا قاراپ تېز scale up/down قىلالايدۇ\n\nProvider source-stated responsibilities:\n- infrastructure management\n- security\n- maintenance\n\nSource-stated benefits:\n- flexibility\n- agility\n- scalability\n- organization نىڭ core business قا تېخىمۇ كۆپ ئەھمىيەت بېرىشى\n\n**Exam memory: Public cloud = Third-party provider + Shared/on-demand Internet resources**\n\n## Private Cloud\n\n**Private cloud**\n- بىر organization ئۈچۈن dedicated infrastructure\n\nSource-stated benefits:\n- enhanced control\n- enhanced security\n- data/application isolation\n- compliance support\n- internal-policy control\n- reliability/availability\n- sensitive information ئۈچۈن ماس\n\nمەنبە private cloud نىڭ isolation سەۋەبىدىن:\n- unauthorized access\n- data breach\n\nخەۋپىنى ئازايتىشقا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Source-Framing Caution\n\nTranscript يەنە private cloud:\n> **local Internet outage ۋاقىتتىمۇ access نى ساقلايدۇ**\n\nدەپ source claim بېرىدۇ.\n\nReviewed Uyghur بۇنى:\n- **مەنبەنىڭ ئۆز teaching claim ى**\n\nسۈپىتىدەلا ساقلايدۇ.\n\nبۇ claim نى ھەر private-cloud architecture ئۈچۈن universal rule دەپ كېڭەيتمەيدۇ، چۈنكى source topology detail بەرمەيدۇ.\n\n**Exam memory: Private cloud = One organization + Dedicated control/security**\n\n## Hybrid Cloud\n\n**Hybrid cloud**\n- public cloud\n- private cloud\n\nئىككىسىنىڭ feature لىرىنى بىرلەشتۈرىدۇ.\n\nSource example:\n- sensitive data → on-site/private environment\n- باشقا workload → scalable public cloud resource\n\nمەنبە hybrid model نىڭ:\n- workload deployment flexibility\n- data-storage flexibility\n- environment لار ئارىسىدا data movement\n- resource optimization\n\nنى:\n- performance\n- security\n- cost\n\nقا ئاساسەن باشقۇرۇشقا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n**Exam memory: Hybrid = Public + Private**\n\n## Community Cloud\n\n**Community cloud**\n- shared interest\n- shared requirement\n\nبار بولغان **defined group of organizations** ئۈچۈن cloud environment.\n\nSource-stated goals:\n- collaboration\n- autonomy\n- control\n\nئۇ:\n- unique objectives\n- regulatory constraints\n- operational needs\n\nغا ماس IT infrastructure قۇرۇشقا ياردەم بېرەلەيدۇ.\n\n**Exam memory: Community cloud = Several organizations with shared requirements**\n\n## Cloud Model Comparison\n\n| Cloud model | Source teaching focus |\n|---|---|\n| **Public** | Third-party / scalable / Internet resources |\n| **Private** | One organization / dedicated control |\n| **Hybrid** | Public + Private together |\n| **Community** | Group of organizations with shared needs |\n\n---\n\nExam Objective 4.2\nبۇلۇت ھېسابلاش ئۇقۇملىرىنى خۇلاسىلەڭ.\n\n# 2. Cloud Characteristics\n\nمەنبە cloud computing نىڭ ئالتە مۇھىم characteristic ىنى قاپلايدۇ:\n\n1. Shared Resources\n2. Metered Utilization\n3. Rapid Elasticity\n4. High Availability\n5. File Synchronization\n6. Multi-Tenancy\n\n## Shared Resources / Resource Pooling\n\n**Shared resources**\n- computing resource لارنى بىر pool قا يىغىش\n- multiple user/tenant غا مۇلازىمەت قىلىش\n\nSource resource examples:\n- servers\n- storage\n- networking\n\nبۇ:\n- **resource pooling**\n\nدەپمۇ ئاتىلىدۇ.\n\nSource model:\n- underlying physical infrastructure multiple customer ئارىسىدا shared\n- resource demand غا قاراپ dynamically allocated/reassigned\n\nBenefits:\n- hardware utilization ياخشىلىنىدۇ\n- scalable service نى multiple user غا تەمىنلەش ئاسانلىشىدۇ\n\n## Dedicated Resources\n\n**Dedicated resources**\n- shared resource نىڭ opposite approach ى\n\nResource:\n- server\n- storage\n- network component\n\nmultiple customer بىلەن shared ئەمەس.\n\nئەكسىچە:\n- بىر customer/tenant ئۈچۈن reserved\n\n**Exam memory:**\n> **Shared = Pool used by multiple tenants**\n>\n> **Dedicated = Reserved for one customer/tenant**\n\n## Metered Utilization\n\n**Metered utilization**\n- cloud resource usage نى measure قىلىش\n- actual usage غا قاراپ charge/bill قىلىش\n\nSource phrase:\n- **pay-as-you-go**\n\nيەنى:\n- fixed infrastructure ئۈچۈن ئالدىن پۇل تۆلەشنىڭ ئورنىغا\n- consumed computing resource غا قاراپ billing\n\nSource-tracked examples:\n\n### CPU Utilization\n- قانچىلىك processing power ئىشلىتىلدى\n\n### Storage Usage\n- cloud دا قانچىلىك data ساقلىنىۋاتىدۇ\n\n### Network Ingress / Egress\n- **Ingress** → cloud network قا كىرگەن data\n- **Egress** → cloud network دىن چىققان data\n\nBenefits:\n- transparent billing\n- actual-consumption-based cost\n- budgeting/control\n- resource allocation optimization\n\n**Exam memory: Metered = Measure usage → Pay for what you consume**\n\n## Rapid Elasticity\n\n**Rapid elasticity**\n- demand ئۆزگەرگەندە resource نى تېز:\n  - scale up\n  - scale down\n\nقىلىش ئىقتىدارى.\n\nSource process:\n- dynamic provisioning\n- dynamic deprovisioning\n\nExample:\n- e-commerce website traffic كۆپەيسە → more web servers added\n- peak تۈگىسە → extra resources removed\n\nSource-stated point:\n- changing workload demand غا تېز ماسلىشىش\n- manual intervention نى ئازايتىش\n\n### Scalability vs Rapid Elasticity\n\nSource بۇ يەردە scalability نى elasticity بىلەن يېقىن باغلاپ چۈشەندۈرىدۇ.\n\nReviewed lesson نىڭ exam takeaway ى:\n> **Rapid elasticity = Demand changes → Resources quickly expand/shrink**\n\nسىرتقى cloud architecture distinction ياكى auto-scaling policy detail قوشۇلمايدۇ.\n\n## High Availability\n\n**High availability**\n- service/resource لار user غا كېرەك بولغاندا:\n  - accessible\n  - operational\n\nبولۇشىنى ساقلاش.\n\nSource mechanisms:\n- redundancy\n- fault tolerance\n- failover\n\n### Redundancy / Fault Tolerance\n\nمەنبە:\n- single point of failure نىڭ ئالدىنى ئېلىش\n- بىر component fail بولسا redundant system takeover قىلىش\n\nنى چۈشەندۈرىدۇ.\n\n### Failover\n\nCloud environment outage بولسا:\n- باشقا server\n- data center\n- region\n\nغا failover قىلىشى مۇمكىن.\n\nSource-stated goal:\n- downtime نى ئازايتىش\n- service continuity\n- resilience\n- critical application/data access\n\n**Exam memory: High availability = Redundancy + Fault tolerance + Failover**\n\n## File Synchronization\n\n**File synchronization**\n- file/data نىڭ latest version ىنى\n- multiple device ياكى location ئارىسىدا\n- consistent ۋە mirrored ھالدا ساقلاش\n\nCloud storage service:\n- file لارنى multiple device ئارىسىدا sync قىلالايدۇ\n- Internet ئارقىلىق different location دىن access قىلىشقا يول قويىدۇ\n\nSource-stated benefits:\n- collaboration\n- data sharing\n- remote access\n- productivity\n- efficiency\n\n**Exam memory: File sync = Same/latest files across devices/locations**\n\n## Multi-Tenancy\n\n**Multi-tenancy**\n- بىر system/infrastructure\n- multiple customer\n\nغا مۇلازىمەت قىلىدىغان architecture.\n\nھەر customer:\n- **tenant**\n\nدەپ ئاتىلىدۇ.\n\nSource model:\n- physical hardware/platform shared\n- ھەر tenant logically isolated\n\nProvider:\n- shared infrastructure نى manage قىلىدۇ\n- tenant لارنىڭ:\n  - data\n  - applications\n  - workloads\n\nنى logically separate/secure ساقلاشقا تىرىشىدۇ.\n\nUser perspective:\n- ئۆزىنىڭ dedicated environment ى باردەك كۆرۈنىدۇ\n\nئەمما underlying system:\n- بىر ۋاقىتتا multiple organization غا مۇلازىمەت قىلىدۇ.\n\n### Multi-Tenancy and Shared Resources\n\nمەنبە:\n- multi-tenancy\n- shared resources\n\nنىڭ يېقىن مۇناسىۋەتلىك ئىكەنلىكىنى چۈشەندۈرىدۇ.\n\nMost source-described multi-tenant environments:\n- servers\n- storage\n- networking\n\nنى pool قىلىپ share قىلىدۇ.\n\nئەمما source يەنە:\n- multi-tenant platform ئىچىدە dedicated hardware/resource option بولۇشى مۇمكىن\n\nدەپ تىلغا ئالىدۇ.\n\n**Exam memory: Multi-tenancy = Many tenants + Logical isolation**\n\n## Cloud Characteristics Comparison\n\n| Characteristic | Exam memory |\n|---|---|\n| **Shared resources** | Pool resources among users |\n| **Dedicated resources** | Reserved for one tenant |\n| **Metered utilization** | Measure usage / pay-as-you-go |\n| **Rapid elasticity** | Scale up/down quickly |\n| **High availability** | Redundancy / failover |\n| **File synchronization** | Latest files across devices |\n| **Multi-tenancy** | Many customers, logically isolated |\n\n---\n\nExam Objective 4.2\nبۇلۇت ھېسابلاش ئۇقۇملىرىنى خۇلاسىلەڭ.\n\n# 3. Cloud Service Types\n\nCloud service لار source بويىچە ئۈچ primary category غا بۆلۈنىدۇ:\n\n1. **IaaS — Infrastructure as a Service**\n2. **PaaS — Platform as a Service**\n3. **SaaS — Software as a Service**\n\nبۇ ئۈچ model:\n- abstraction level\n- functionality\n- user vs provider responsibility\n\nجەھەتتە پەرقلىنىدۇ.\n\n## IaaS — Infrastructure as a Service\n\n**IaaS**\n- foundational cloud layer\n- fundamental computing infrastructure resource تەمىنلەيدۇ\n\nSource resources:\n- servers\n- storage\n- networking infrastructure\n\nUser:\n- virtual machine قۇرالايدۇ\n- network قۇرالايدۇ\n- remote management قىلالايدۇ\n- demand غا قاراپ scale قىلالايدۇ\n\nSource-stated benefit:\n- costly physical hardware غا investment ئېھتىياجىنى ئازايتىش\n- infrastructure maintenance burden نى ئازايتىش\n- flexible environment for data/application hosting\n\n**Exam memory: IaaS = Rent infrastructure**\n\n## PaaS — Platform as a Service\n\n**PaaS**\n- software development\n- application deployment\n\nئۈچۈن managed platform/environment تەمىنلەيدۇ.\n\nSource analogy:\n> **Streamlined construction site for developers**\n\nProvider:\n- underlying server configuration\n- networking resource management\n\nقاتارلىق infrastructure detail لارنى abstraction قىلىدۇ.\n\nDeveloper:\n- coding\n- building applications\n- deploying applications\n\nقا مەركەزلەشەلەيدۇ.\n\nSource-stated benefits:\n- faster development lifecycle\n- rapid application delivery\n- team collaboration\n\n**Exam memory: PaaS = Build/deploy apps without managing underlying infrastructure**\n\n## SaaS — Software as a Service\n\n**SaaS**\n- ready-made software application نى Internet ئارقىلىق ئىشلەتكۈچىگە تەمىنلەش\n\nSource analogy:\n> **Fully furnished home**\n\nAccess:\n- web browser\n- dedicated client\n\nSource examples/categories:\n- productivity suites\n- CRM — Customer Relationship Management systems\n\nSource-stated benefits:\n- local installation burden نى ئازايتىش\n- maintenance burden نى ئازايتىش\n- update burden نى ئازايتىش\n- convenience\n- accessibility\n\n**Source wording note:** transcript بۇ جۈملىدە grammatical error بار؛ reviewed Uyghur intended meaning نى natural شەكىلدە بېرىدۇ: **users use/consume ready-made applications over the Internet**.\n\n**Exam memory: SaaS = Use finished software**\n\n# Shared Responsibility\n\nCloud computing دا:\n- user\n- cloud service provider\n\nئارىسىدا management/security/operation responsibility بۆلۈنىدۇ.\n\nSource components:\n- data center\n- networking\n- storage\n- servers\n- virtualization\n- operating system\n- data\n- applications\n\n## IaaS Responsibility — Source Model\n\n### Provider\n- data center\n- networking\n- storage\n- server maintenance\n- virtualization management\n\n### User\n- operating system\n- applications\n- data\n\n**Exam memory: IaaS = User manages more**\n\n## PaaS Responsibility — Source Model\n\nProvider:\n- underlying infrastructure\n- operating system\n\nنىمۇ manage قىلىدۇ.\n\nUser:\n- application development\n- application deployment\n- application management\n- data\n\nغا مەسئۇل.\n\n**Exam memory: PaaS = Provider manages platform; user manages apps/data**\n\n## SaaS Responsibility — Source Model\n\nProvider:\n- source wording بويىچە infrastructure دىن application غىچە **majority / entire stack** نى manage قىلىدۇ.\n\nUser:\n- application settings/configuration\n- user access\n\nنى manage قىلىدۇ.\n\n**Exam memory: SaaS = Provider manages most; user configures/uses app**\n\n## Shared Responsibility Comparison\n\n| Layer / responsibility | IaaS | PaaS | SaaS |\n|---|---|---|---|\n| Data center | Provider | Provider | Provider |\n| Networking | Provider | Provider | Provider |\n| Storage | Provider | Provider | Provider |\n| Servers | Provider | Provider | Provider |\n| Virtualization | Provider | Provider | Provider |\n| Operating system | **User** | **Provider** | Provider |\n| Applications | **User** | **User** | Provider |\n| Data | **User** | **User** | Source says provider manages most stack; user still uses/configures application |\n| App settings / user access | User-side management | User-side management | **User** |\n\n### Source-Scope Caution\n\nبۇ table transcript نىڭ own responsibility model ىنى study-friendly شەكىلدە كۆرسىتىدۇ.\n\nReviewed Uyghur:\n- vendor-specific shared-responsibility matrix\n- security/compliance exception\n- identity/network-control nuance\n- customer-data ownership detail\n\nنى سىرتقى مەنبەدىن قوشمايدۇ.\n\n---\n\n# Objective 4.2 — Final Exam Memory Map\n\n## Cloud Models\n- **Public** = Third-party provider / scalable Internet resources\n- **Private** = One organization / dedicated control\n- **Hybrid** = Public + Private\n- **Community** = Organizations with shared needs\n\n## Characteristics\n- **Shared resources** = Resource pooling\n- **Dedicated resources** = One tenant\n- **Metered utilization** = Pay-as-you-go\n- **Rapid elasticity** = Quickly scale up/down\n- **High availability** = Redundancy + fault tolerance + failover\n- **File synchronization** = Latest files across devices\n- **Multi-tenancy** = Multiple tenants + logical isolation\n\n## Service Types\n- **IaaS** = Infrastructure\n- **PaaS** = Development/deployment platform\n- **SaaS** = Ready-made software\n\n## Responsibility\n- **IaaS** → User manages OS + apps + data\n- **PaaS** → User manages apps + data\n- **SaaS** → Provider manages most; user handles app settings/user access in source model\n\n## One-Line Memory\n> **IaaS: Build on it → PaaS: Develop on it → SaaS: Use it**\n"}, {"id": "5.1", "number": "5.1", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam objective 5.1. Given a scenario, troubleshoot motherboards, RAM, CPUs and power. This video segment will cover troubleshooting issues related to motherboards, RAM, CPUs and power.\n\nFor each of the common symptoms listed in exam objective 5.1, I will provide some basic information and possible root causes. Additionally, as a protest taking tip, you should always perform verifications, inspections or checks before performing any repairs or component replacements. Just something to keep in mind come exam day.\n\nWith that in mind, let's begin with one of the most common and concerning troubleshooting scenarios, a computer system that fails to power on. When a computer system fails to power on, it signals a potential array of underlying issues that require attention. One primary culprit for this scenario could be a malfunctioning power supply unit or PSU, which is responsible for supplying electrical power to the computing device.\n\nA faulty PSU may fail to deliver adequate power or fail entirely, preventing the system from starting up. Additionally, loose connections between the power supply cables and the motherboard, CPU or other components can disrupt the flow of electricity resulting in a failure to power on. Furthermore, the PSU may not be receiving power from the wall outlet.\n\nIf the computing device has sufficient power, it will proceed to the power on self test or post. If everything checks out okay during the post, a single audible beep will be heard. Otherwise, a series of beeps will be triggered indicating a potential hardware malfunction.\n\nThese audible alerts or beeps play a crucial role in diagnosing underlying issues. Each beep pattern will correspond to a specific hardware problem with the most common culprits being motherboard malfunctions, memory failures or CPU issues. By recognizing and deciphering these post beep codes, users can promptly address the root cause, whether it involves examining the motherboard for defects such as chipset failures, damaged capacitors, corrosion or loose components.\n\nTroubleshooting memory modules to see if they have failed or become unseated. Or inspecting the CPU for failure or a disconnected CPU fan. Encountering a black screen upon startup can be indicative of several potential hardware issues within a computer system.\n\nOne possible
