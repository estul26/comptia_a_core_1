sh memory chips. This definition may look similar to the definition of an SSD drive.\n\nWell, it should. Flash drives and SSDs use the same flash memory chips to store data. The difference is that flash drives are small and compact, making them portable.\n\nA flash drive may also be called a thumb drive or a USB flash drive if it has a USB connector. Flash drives have a connector or interface on one end which plugs into a computer, laptop, or other compatible device. The interface provides both data transfer and power to the flash drive, eliminating the need for additional cables or power adapters.\n\nOnce connected to a computer, the flash drive appears as a removable storage device in the operating system. From there, you can simply drag and drop files or folders onto the drive to store them. Similarly, you can copy files from the flash drive to your computer for accessing or editing.\n\nAnother type of removable storage is memory cards. These cards also use flash memory technology to store and transfer data. However, there are some differences in terms of form factors.\n\nWith memory cards, each form factor has its own unique characteristics and applications. For example, secure digital or SD cards are among the most widely used memory card formats. They come in a standard size and are commonly found in devices like digital cameras and camcorders.\n\nSD cards offer moderate storage capacities and are renowned for their reliability and compatibility across a wide range of devices. They are suitable for storing photos, videos, music, and other multimedia files. Many SD cards are a smaller variant of the SD card format designed for use in compact electronic devices where space is limited.\n\nWhile they offer the same functionality as standard SD cards, their smaller size makes them ideal for devices like smartphones and GPS units. However, many SD cards are less common nowadays as they have largely been supplanted by the even smaller micro SD format. But don't let their compact dimensions fool you.\n\nMicro SD cards offer impressive storage capacities and are widely used in smartphones, tablets, and wearable devices. Another form factor is compact flash or CF for short. These cards are a different type of memory card commonly used in professional grade digital cameras and other high performance devices.\n\nCF cards are larger and thicker than SD cards featuring a robust design that offers increased durability and reliability, making them well suited for demanding environments. And then there are XD cards, short for extreme digital. These memory cards were developed by Olympus and Fujifilm as a proprietary memory card format for digital cameras.\n\nWhile they were popular for a time, XD cards have become less common in recent years, largely replaced by SD and micro SD cards. They offer moderate storage capacities and are generally compatible with devices that support the XD format. Last up for our removable storage types, we have optical disks, which are inserted into optical drives.\n\nAn optical drive is a type of storage device that can read and write to optical disks. Optical drives are classified based on the type of optical disks that can read and write to. The three main types of optical disks are CDs or compact disks, DVDs or digital versatile disks and Blu-ray disks.\n\nAs for how an optical drive works, they consist of a tray or slot where you insert the disk. When you insert a disk, the drive uses a laser beam to read the data stored on the disk surface. The laser scans the disk reflecting off its surface and the drive interprets the reflected signals as digital data, such as audio, video or computer files.\n\nSimilarly, when writing data to a disk, the optical drive uses a laser to etch or burn information onto the disk surface. This process creates pits and lands on the disk that represent the data being written. Once the data is written, it can be read by any compatible optical drive.\n\nAnother topic worth discussing with regard to optical disks is their storage limits. According to the CompTIA official study guide, the maximum storage limit for a CD is 700 megabytes. That is roughly 74 minutes of uncompressed stereo digital audio.\n\nThe maximum storage limit for a DVD is approximately 17 gigabytes. And the maximum storage limit for a Blu-ray disk is 128 gigabytes.", "uyghur": "Exam Objective 3.4 — Storage Devices\n\n## Hard Disk Drive (HDD)\n\nStorage drive كومپيۇتېردا digital data نى ئۇزۇن مۇددەت ساقلايدۇ. RAM غا ئوخشىماي، power off بولسىمۇ OS، application ۋە personal file لار ساقلىنىپ قالىدۇ.\n\n**HDD (Hard Disk Drive)** سانلىق مەلۇماتنى ئايلىنىدىغان **magnetic platter** ئۈستىگە ماگنىتلىق ئۇسۇلدا ساقلايدۇ. Capacity چوڭ ۋە تەننەرخى نىسبەتەن تۆۋەن، شۇڭا desktop، laptop ۋە server دا ئۇزۇن يىل ئىشلىتىلگەن. ئەمما mechanical moving parts بار بولغاچقا wear-and-tear ۋە زەربىگە SSD دىن سەزگۈر، data access مۇ ئادەتتە ئاستىراق.\n\n### HDD قانداق ئىشلەيدۇ؟\nHDD ئىچىدە بىر ياكى بىر نەچچە platter spindle ئۈستىدە يۇقىرى سۈرئەتتە ئايلىنىدۇ. **Read/write head** platter نىڭ يۈزىگە ناھايىتى يېقىن تۇرۇپ يۆتكىلىدۇ.\n\n- Read قىلغاندا head platter دىكى magnetic change نى سېزىپ electrical signal غا ئايلاندۇرىدۇ.\n- Write قىلغاندا head magnetic field ئارقىلىق platter ئۈستىگە data encode قىلىدۇ.\n\nكۈچلۈك ماگنىت HDD غا زىيان يەتكۈزۈشى مۇمكىن، شۇڭا يىراق تۇتۇش كېرەك.\n\n### RPM\nHDD platter ئايلىنىش سۈرئىتى **RPM (Revolutions Per Minute)** بىلەن ئۆلچىنىدۇ. باشقا ئامىللار تەڭ بولسا، RPM يۇقىرى بولغانسېرى data access تېز بولىدۇ.\n\nكۆپ ئۇچرايدىغان سۈرئەتلەر:\n- 5,400 RPM\n- 7,200 RPM\n- 10,000 RPM\n- 15,000 RPM\n\nمەسىلەن، 7,200 RPM ئادەتتە 5,400 RPM دىن تېز؛ 10,000/15,000 RPM بولسا تېخىمۇ يۇقىرى performance بېرەلەيدۇ.\n\n### HDD Form Factors\n- **3.5-inch HDD:** Desktop ۋە server دا كۆپ ئىشلىتىلىدۇ؛ چوڭراق شەكىل، capacity ۋە airflow ئۈچۈن بوشلۇق كۆپ.\n- **2.5-inch HDD:** Laptop ۋە portable device دا كۆپ ئىشلىتىلىدۇ؛ كىچىك، بوشلۇق تېجەيدۇ، ئەمما يەنىلا ياخشى storage capacity تەمىنلەيدۇ.\n\n## Solid-State Drive (SSD)\n\n**SSD (Solid-State Drive)** سانلىق مەلۇماتنى **non-volatile NAND flash memory** دا ساقلايدۇ. HDD غا ئوخشىمايدىغان يېرى، SSD دا spinning platter ياكى read/write head يوق. شۇڭا:\n- data access تېز؛\n- زەربە ۋە vibration غا چىداملىقراق؛\n- جىم ئىشلەيدۇ؛\n- ئادەتتە power consumption تۆۋەن؛\n- ئەمما GB بېشىغا تەننەرخ HDD دىن قىممەترەك بولۇشى مۇمكىن.\n\nSSD ئىچىدىكى مۇھىم زاپچاسلار:\n- **NAND flash:** data ساقلايدۇ.\n- **SSD controller:** data نى قانداق write/read/organize قىلىشنى باشقۇرىدىغان «مېڭە».\n- **Cache:** كۆپ ئىشلىتىلىدىغان data ياكى incoming write operation نى ۋاقىتلىق يۇقىرى سۈرئەتتە ساقلاپ، performance نى ياخشىلايدۇ.\n\n### SATA SSD\nSATA SSD motherboard قا **SATA data cable** ئارقىلىق ئۇلىنىدۇ ۋە power supply دىن ئايرىم **SATA power connector** تەلەپ قىلىدۇ. يەنى ئىككى physical connection: data + power.\n\n**SATA III** نىڭ theoretical maximum speed ى **6 Gbps**. SSD ئىچىدىكى NAND flash بۇنىڭدىن تېز بولالايدىغان بولسىمۇ، SATA interface bottleneck بولۇپ قالىدۇ.\n\n### PCIe SSD\n**PCIe (Peripheral Component Interconnect Express)** motherboard ئىچىدىكى يۇقىرى سۈرئەتلىك expansion interface. SATA غا ئوخشىماي، data ئۈچۈن بىۋاسىتە high-speed lanes تەمىنلەيدۇ.\n\nھەر PCIe lane دا data send ۋە receive قىلىدىغان wire pair لار بار؛ lane لارنى كۆپەيتسە bandwidth ئاشىدۇ. شۇڭا PCIe SSD ئادەتتە SATA SSD دىن تېز.\n\n### NVMe\n**NVMe (Non-Volatile Memory Express)** physical connector/interface ئەمەس؛ flash storage ئۈچۈن لايىھەلەنگەن **communication protocol**.\n\nئوخشىتىش:\n- PCIe = يۇقىرى سۈرئەتلىك تاشيول.\n- NVMe = شۇ تاشيولدىكى قاتناشنى تەرتىپكە سالىدىغان قائىدە/بەلگە.\n\nNVMe نۇرغۇن command queue ۋە بىر queue ئىچىدە نۇرغۇن command نى بىرلا ۋاقىتتا بىر تەرەپ قىلالايدۇ، latency نى تۆۋەنلىتىپ، SSD performance نى ئاشۇرىدۇ.\n\n**ئىمتىھان:** PCIe → physical communication interface/path؛ NVMe → PCIe ئۈستىدە ئىشلەيدىغان storage protocol.\n\n### SAS\n**SAS (Serial Attached SCSI)** ئاساسلىقى enterprise/server/data center دا ئىشلىتىلىدۇ. SATA consumer system دا كۆپ بولسا، SAS reliability، scalability، sustained workload ۋە advanced error handling ئۈچۈن لايىھەلەنگەن.\n\nSAS تا **dual-port** بولالايدۇ، يەنى بىر drive ئىككى controller/path قا ئۇلىنالايدۇ. بىر يول كاشىلا بولسا يەنە بىرى داۋاملىق ئىشلەپ، redundancy تەمىنلەيدۇ.\n\n> ئەسلى transcript تا بىر جايدا «SADOC» دەپ چىققان؛ مەزمۇن بويىچە بۇ **SATA** بىلەن سېلىشتۇرۇش.\n\n### SSD form factors\n- **M.2:** كىچىك، تەكشى، motherboard دىكى dedicated slot قا بىۋاسىتە ئورنىتىلىدۇ؛ laptop، SFF PC ۋە modern desktop دا كۆپ.\n- **mSATA (Mini-SATA):** compact system ئۈچۈن كىچىك SATA شەكلى؛ motherboard قا بىۋاسىتە ئورنىتىلىدۇ. ھازىر كۆپىنچە M.2 ئۇنىڭ ئورنىنى ئالغان.\n\n## RAID\n\n**RAID (Redundant Array of Independent Disks)** بىر نەچچە physical drive نى بىر logical unit قىلىپ، performance، redundancy ياكى ئىككىسىنى تەڭشەش تېخنىكىسى.\n\n### RAID 0 — Striping\nData block لار ئىككى ياكى ئۇنىڭدىن كۆپ drive قا بۆلۈنۈپ يېزىلىدۇ. بىر نەچچە drive بىرلا ۋاقىتتا ئىشلەيدىغانلىقى ئۈچۈن performance يۇقىرى.\n\n- Minimum: **2 drives**\n- Advantage: speed + بارلىق capacity نى ئىشلىتىش.\n- Redundancy: **يوق**.\n- بىر drive بۇزۇلسا، بارلىق array data سى يوقىلىدۇ.\n\n### RAID 1 — Mirroring\nData ئىككى drive قا ئوخشاش كۆچۈرۈلىدۇ.\n\n- Minimum: **2 drives**\n- بىر drive بۇزۇلسا يەنە بىرىدە data بار.\n- Usable capacity تەخمىنەن يېرىم، چۈنكى ھەممىسى mirror قىلىنىدۇ.\n- Reliability ياخشى، ئەمما RAID 0 دەك performance improvement نى مەقسەت قىلمايدۇ.\n\n### RAID 5 — Striping + distributed parity\nRAID 0 غا ئوخشاش striping ئىشلىتىدۇ، ئۇنىڭ ئۈستىگە **parity** قوشىدۇ. Parity information بارلىق drive لارغا تارقىتىپ ساقلىنىدۇ.\n\n- Minimum: **3 drives**\n- **1 drive failure** غا چىدايدۇ.\n- بىر drive بۇزۇلسا، قالغان data + parity ئارقىلىق missing data نى reconstruct قىلغىلى بولىدۇ.\n\n### RAID 6 — Striping + double parity\nRAID 5 نىڭ ئاساسىدا، ئەمما **2 sets of parity** ساقلايدۇ.\n\n- Minimum ئادەتتە **4 drives**.\n- **2 drive failures** غا بىرلا ۋاقىتتا چىدايدۇ.\n- چوڭ enterprise array دا RAID 5 دىن كۈچلۈك fault tolerance تەمىنلەيدۇ.\n\n### RAID 10 — RAID 1+0\n**Mirroring + striping** نى بىرلەشتۈرىدۇ.\n\n- Minimum ئادەتتە **4 drives**.\n- High performance + strong redundancy.\n- Rebuild parity دىن ئەمەس mirror دىن بولغاچقا تېز.\n- Total capacity نىڭ يېرىمى mirror ئۈچۈن كېتىدۇ؛ تەننەرخ يۇقىرىراق.\n\n## Removable Storage\n\n### Flash drive\n**Flash drive / thumb drive / USB flash drive** non-volatile flash memory ئىشلىتىدىغان كىچىك portable storage. SSD بىلەن بىر خىل flash memory technology ئىشلىتىدۇ، ئەمما portability ۋە connector شەكلى بىلەن پەرقلىنىدۇ.\n\nUSB connector ئارقىلىق data + power نى بىرلا ئۇلىنىشتا ئالىدۇ. OS دا removable drive سۈپىتىدە كۆرۈنىدۇ؛ file/folder نى drag-and-drop ئارقىلىق كۆچۈرگىلى بولىدۇ.\n\n### Memory cards\nMemory card لارمۇ flash memory ئىشلىتىدۇ.\n\n- **SD (Secure Digital):** digital camera/camcorder قاتارلىقلاردا كەڭ؛ photo، video، music قاتارلىق data.\n- **MiniSD:** SD نىڭ كىچىك نۇسخىسى؛ compact device ئۈچۈن. ھازىر microSD تەرىپىدىن كۆپىنچە ئالماشتۇرۇلغان.\n- **microSD:** ئىنتايىن كىچىك، smartphone، tablet، wearable قاتارلىقلاردا.\n- **CF (CompactFlash):** چوڭراق ۋە قېلىنراق، چىداملىق؛ professional camera ۋە high-performance device دا.\n- **xD (Extreme Digital):** Olympus/Fujifilm proprietary format؛ بۇرۇن camera دا ئىشلىتىلگەن، ھازىر SD/microSD غا ئورۇن بەرگەن.\n\n### Optical discs\nOptical drive laser ئارقىلىق optical disc نى read/write قىلىدۇ.\n\nئاساسلىق تۈرلەر:\n- **CD:** ئەسلى course guide بويىچە maximum ≈ **700 MB**.\n- **DVD:** maximum ≈ **17 GB**.\n- **Blu-ray:** maximum ≈ **128 GB**.\n\nRead قىلغاندا laser disc يۈزىدىن reflected signal نى digital data غا ئايلاندۇرىدۇ. Write قىلغاندا laser disc يۈزىدە data نى «burn» قىلىدۇ.\n\n#"}, {"id": "3.5", "number": "3.5", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.5, given a scenario, install and configure motherboards, central processing units and add-on cards. Motherboard connector types. This video segment will have us exploring the various types of connectors found on motherboards.\n\nSome of these we have covered earlier in this course, but there will be a few new details and a few new connector types that will be included as well. So it is best to pay attention to avoid missing anything. With that said, our first motherboard connector type will be PCI.\n\nPeripheral component interconnect, or PCI for short, is a standard expansion connector or slot that is commonly found on older computer motherboards. These slots enable users to connect various expansion cards. Examples include sound cards for improved audio output, network adapters for seamless internet connectivity, and graphics cards for enhanced visual performance.\n\nWhile PCI slots are gradually becoming less prevalent in modern motherboard designs, they retain significance in legacy systems and specific niche applications where older hardware configurations persist. Moving on, we have PCI's more contemporary replacement, PCIe or PCI Express. In recent years, PCIe has risen as the leading standard for expansion slots in modern motherboard designs, replacing the traditional PCI architecture.\n\nThe PCIe interface boasts several advantages over its predecessor, notably providing significantly higher bandwidth and faster data transfer rates. This enhanced performance makes PCIe particularly well suited for demanding computing tasks, ranging from immersive gaming experiences to resource-intensive multimedia editing projects. Moreover, PCIe's scalability and versatility are evident in its various slot sizes, including by one, by four, by eight, and by 16 configurations.\n\nEach designation corresponds to the number of lanes allocated for data transfer, allowing for tailored connectivity solutions that cater to diverse hardware requirements. Among the essential power connector types for motherboards, we have the 20-pin, 24-pin, and 20+4-pin connectors. The 20-pin connector was a standard for older motherboards, but has largely been replaced by the more robust 24-pin connector.\n\nThis 24-pin connector provides additional power for modern systems with more advanced components and higher power requirements. As for the 20+4-pin connector, this offers flexibility by combining the 20-pin and 24-pin configurations into a single connector. This design allows compatibility with both older and newer motherboards, ensuring seamless integration across a range of hardware configurations.\n\nNext, we have a few motherboard connector types that are used to connect hard drives to the system. Serial Advanced Technology Attachment, or SATA connectors, are one such connector type. They are used to connect storage devices, such as hard disk drives, HDDs, and solid-state drives, SSDs, to the motherboard.\n\nSATA offers high-speed data transfer rates and is widely used in modern computers for connecting internal storage devices, providing reliable storage solutions for various applications. External Serial Advanced Technology Attachment, or eSATA ports, are external SATA connectors that allow users to connect external storage devices, such as external hard drives, directly to the motherboard. eSATA offers faster data transfer speeds compared to earlier USB connections, making it a preferred choice for users requiring high-speed external storage solutions.\n\nAs for M.2, this connector type is used in conjunction with a cutting-edge interface that is revolutionizing storage solutions in modern computer systems. These compact and versatile connectors enable direct attachment of solid-state drives to the motherboard, offering unparalleled performance and flexibility. Additionally, their diminutive size and low profile make them ideal for compact builds and portable devices.\n\nLast up, we have motherboard header connectors. Headers on the motherboard serve as vital connectors that link various internal components, offering a versatile platform for integrating peripherals and accessories into the computer system. These connectors, often located along the edges of the motherboard, establish connections with components mounted within the computer case.\n\nOne of their primary functions is facilitating the connection of USB ports, enabling seamless integration of external devices, such as keyboards, mice, printers, and storage drives. These headers typically connect to ports located on the front or top panel of the computer case, allowing for easy access and convenient connectivity. Moreover, headers play a pivotal role in linking audio jacks, establishing a pathway for transmitting audio signals between the system and external speakers, headphones, microphones, and other audio devices.\n\nThese connectors typically link to audio ports located on the front or top panel of the computer case, providing users with immersive audio experiences while engaging in gaming, multimedia playback, and communication. Front panel headers on the motherboard enable the connection of essential controls, including power buttons, reset buttons, and LED indicators directly to the case. By linking these components to the motherboard, users can conveniently manage system power, perform resets, and monitor system status from the front panel of the case.\n\nAdditionally, headers for fans provide a means of connecting case fans, CPU fans, and other cooling components directly to the motherboard. These connectors facilitate system cooling and optimize thermal performance by regulating fan speeds based on temperature sensors located throughout the case.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Motherboard form factors.\n\nAs a refresher, a motherboard is the main circuit board in a computing device that connects and allows communication between all the other components. Another way of describing it is as the backbone that ties a computer's hardware together. Without the motherboard, none of the components could interact.\n\nIt sits at the heart of the system, and every other component must be compatible with it. Motherboards come in different physical sizes and layouts, known as form factors. The form factor determines the board's dimensions, mounting points, power connections, and overall layout.\n\nFor the exam, you should understand three common desktop motherboard form factors. These are the ATX, Micro ATX, and ITX form factors. Let's begin with ATX, which stands for Advanced Technology Extended.\n\nATX motherboards are the most widely adopted standard in desktop systems. They are larger in size and provide ample space for components and connectors. Because of their larger dimensions, ATX boards typically support multiple PCIe expansion slots, allowing for additional graphics cards, network adapters, and other add-on cards.\n\nATX motherboards commonly include four or more DIMM slots for RAM, enabling higher memory capacity. They also provide multiple SATA ports and numerous onboard headers for USB connections, cooling fans, and front panel connectors. Their size makes them well-suited for full tower and mid tower desktop cases, where expandability and performance are priorities.\n\nNext, we have Micro ATX. Micro ATX is a smaller version of the ATX form factor. It maintains many of the same features, but in a more compact design.\n\nMicro ATX boards typically offer fewer PCIe expansion slots than full ATX boards, but still provide enough flexibility for most standard desktop configurations. In many cases, Micro ATX boards include two to four DIMM slots and a reduced number of expansion slots compared to ATX. They are commonly used in mid-sized systems where space savings are desired without significantly limiting performance or upgrade potential.\n\nMicro ATX strikes a practical balance between size and expandability. Finally, we have ITX, which is short for information technology extended. ITX motherboards are designed for compact systems where minimizing space is the primary concern.\n\nBecause of their smaller footprint, ITX motherboards typically include a single PCIe expansion slot and often two DIMM slots for memory. While ITX motherboards offer limited expansion compared to ATX and Micro ATX, they can still support modern processors, solid state drives, and high-speed memory. They are commonly used in small form factor builds where compact design is more important than expandability.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Motherboard compatibility.\n\nCPU socket compatibility is an important factor when selecting a motherboard, particularly in desktop computing where performance and functionality requirements vary wildly. At the forefront of the CPU market are Intel and AMD, each offering their distinct lineup of processors tailored to various computing needs. Motherboards are intricately designed to cater to the specific requirements of these processors, whether from Intel or AMD.\n\nTherefore, an Intel CPU cannot be installed in a motherboard intended for an AMD CPU and vice versa. This is primarily due to the different CPU socket types they use. Intel processors typically use an LGA type socket, which is short for land grid array.\n\nIn this configuration, the CPU's underside is devoid of pins featuring instead a flat surface with an array of contact points or pads. This corresponds to the motherboard socket, which contains tiny holes where metal contacts reside. When installed, these contacts align precisely with the pads on the CPU, creating a direct and secure connection.\n\nThis design facilitates easy installation and removal of the CPU, reducing the risk of damage during handling. Conversely, AMD processors commonly utilize PGA or pin grid array sockets. In this configuration, the CPU itself contains a grid of pins that align with corresponding holes on the motherboard socket, creating a grid-like pattern for connection.\n\nWhen the CPU is installed, these pins penetrate into the motherboard's holes, establishing electrical contact with the circuitry beneath. This arrangement ensures a secure and stable connection between the CPU and the motherboard, facilitating efficient communication and data transfer. Transitioning to server environments, multi-socket motherboards become essential to meet the demands of intensive workloads and multitasking.\n\nUnlike single-socket motherboards prevalent in desktop computing, server environments require increased processing power and scalability. Multi-socket motherboards, capable of accommodating multiple CPUs, are engineered to support the installation and operation of two or more processors simultaneously. Whether they are equipped with LGA or PGA sockets, server motherboards are meticulously designed to deliver enhanced processing capabilities and unparalleled reliability, making them indispensable in enterprise settings and data centers.\n\nMobile devices, in stark contrast to their desktop and server counterparts, operate on a distinct architecture, commonly incorporating ARM-based CPUs. These processors are renowned for striking a delicate balance between performance and energy efficiency, making them particularly well-suited for the demands of mobile computing. Engineered to deliver robust processing capabilities while consuming minimal power, ARM-based CPUs are encapsulated within a compact footprint.\n\nThis compactness is paramount in the design of mobile devices, where space constraints and portability are critical considerations. Consequently, ARM-based CPUs have become the cornerstone of mobile computing, enabling devices like smartphones and tablets to deliver optimal performance while prolonging battery life, thereby enhancing the overall user experience. Exam objective 3.5, given a scenario, install and configure motherboards, central processing units, and add-on cards.\n\nCPU architecture. When we talk about CPU architecture, we are talking about the fundamental design of a processor. CPU architecture influences performance, compatibility, power efficiency, and overall system capability.\n\nAt its core, CPU architecture defines how a processor is built and how it executes instructions. One of the most important components of that architecture is the instruction set. An instruction set determines the types of operations a processor can perform.\n\nIn simple terms, it defines the language the processor understands. Within modern computing, two major instruction set families dominate the landscape. These are x86 and x64.\n\nThe terms x86 and x64 refer to processor architectures and instruction sets. Historically, x86 refers to 32-bit processors. The name originates from early 32-bit Intel processors, such as the 8086, 802.86, 803.86, and 804.86, all of which ended in the numbers 86.\n\nBecause of this naming pattern, the shortened term x86 became synonymous with that entire processor family, and over time with 32-bit computing as a whole. x64 represents the 64-bit extension of that architecture. It builds upon the original x86 design, but expands its capabilities significantly. So what does 32-bit versus 64-bit actually mean?\n\nA 32-bit CPU processes data in 32-bit chunks. A 64-bit CPU processes data in 64-bit chunks. That difference affects memory addressing, performance potential, and operating system compatibility.\n\nHere is where the trickle-down effect begins. First, the operating system must match the processor architecture. A 32-bit processor can only run a 32-bit operating system.\n\nA 64-bit processor can run both 64-bit and 32-bit operating systems. The same concept applies to applications. A 32-bit operating system can only run 32-bit applications.\n\nA 64-bit operating system can run 64-bit applications and most 32-bit applications. Now let's talk about memory. A 32-bit processor can only directly address up to four gigabytes of RAM.\n\nThat is a hard architectural limitation. In practice, usable memory is often slightly less due to hardware reservations. A 64-bit processor can address dramatically more memory.\n\nThe theoretical limit is extremely large, far beyond what typical consumer systems require. For modern computing environments, 64-bit architecture removes the memory ceiling that restricted older systems. So when you see x86 on the exam, think 32-bit and a four gigabyte RAM limitation.\n\nWhen you see x64, think 64-bit expanded memory support, modern operating systems, and higher performance potential. Now that we have covered the traditional desktop and server instruction sets, let's shift gears and talk about another major architecture family known as ARM. ARM stands for Advanced Risk Machine.\n\nAs for the acronym RISC in Advanced Risk Machine, that stands for Reduced Instruction Set Computer. Unlike the more complex instruction sets used in x86 and x64 processors, ARM processors are designed around a simplified set of instructions. This simplified design focuses on efficiency.\n\nARM processors are engineered to perform tasks using fewer, highly optimized instructions. The result is lower power consumption and excellent performance per watt. That is why ARM processors dominate the mobile market.\n\nSmartphones, tablets, and many embedded devices rely on ARM processors because battery life is critical. ARM architecture allows these devices to deliver impressive performance while consuming minimal power. So while x86 and x64 dominate traditional desktops and servers, ARM dominates mobile and power sensitive environments.\n\nNow that we understand instruction sets, let's discuss another important architectural concept, core configurations. Before we go further, we need to define what a core actually is. A core is an independent processing unit within a CPU.\n\nIn simple terms, a core is capable of fetching, decoding, and executing instructions on its own. You can think of a core as a complete mini processor built into the larger CPU package. Early processors contained only a single core.\n\nA single core processor has just one processing unit, which means it can execute only one instruction at a time. While it can rapidly switch between tasks, it is still fundamentally handling one instruction at any given moment. As software evolved and operating systems became more advanced, computers were expected to handle multiple tasks simultaneously.\n\nRunning a web browser, streaming music, editing documents, and performing background system updates, all at the same time placed heavy demands on single core processors. This is where the limitations of a single core becomes obvious. Because the processor has to constantly switch between tasks, performance bottlenecks became common.\n\nAs a result, the system would feel sluggish, especially under heavy multitasking. To solve this problem, manufacturers began integrating multiple cores onto a single processor chip. A multi-core processor contains two or more independent cores within the same physical CPU.\n\nEach core can execute its own instruction simultaneously. This enables true parallel processing. For example, in a quad core processor, four cores can handle four separate instructions at the same time.\n\nInstead of rapidly switching between tasks, the workload can be divided and processed concurrently. This dramatically improves multitasking performance and overall system responsiveness. A helpful analogy is to think of a single core processor as one worker handling every job sequentially.\n\nA multi-core processor is like having multiple workers dividing the workload and completing tasks in parallel. Now let's connect this to another modern architectural feature known as virtualization support. Modern CPU architectures frequently incorporate support for virtualization, a technology that enables the simultaneous operation of multiple virtual machines or VM on a single physical CPU.\n\nThis capability is particularly valuable in enterprise environments where there is a need to efficiently utilize hardware resources while maintaining flexibility in deploying and managing IT infrastructure. Virtualization support in CPUs such as Intel's virtualization technology known as VT and AMD's virtualization known as AMD-V play a crucial role in enabling efficient virtualization solutions. These technologies provide hardware level support for virtualization, enhancing the performance and security of virtualized environments.\n\nWith virtualization support, the CPU can efficiently allocate resources to multiple virtual machines ensuring optimal CPU utilization. Exam objective 3.5, given a scenario install and configure motherboards, central processing units and add-on cards. Expansion cards, expansion cards also known as add-on cards are peripheral devices that can be inserted into the expansion slots of a computer's motherboard to enhance its functionality.\n\nThese cards are essential components in modern computing systems, allowing users to customize and upgrade their machines according to their needs. One common type of expansion card is the sound card which is responsible for processing audio signals and producing sound output. By adding a sound card to a computer, users can achieve better audio quality and support for advanced audio features such as surround sound and digital audio processing.\n\nAnother important expansion card is the video card commonly referred to as a graphics card. This card is tasked with rendering graphics and images on the computer's display. Now let me warn you, the commonly used term GPU which stands for graphical processing unit and graphics card are often used interchangeably by those who are not lucky enough to be taking my course but I will make sure you know better.\n\nA GPU and a graphics card actually refer to different aspects of a computing system. To demonstrate, let me strip off the cooling unit and the cover on the graphics card presented here. That's better.\n\nOkay, here is the GPU. It is just a part of the graphics card and only handles the processing. A graphics card is actually much more.\n\nA graphics card has its own circuit board, dedicated memory, the GPU of course, and interface ports. Additionally, you should know that the graphics card's dedicated memory, also known as VRAM, which is short for video, random access memory, is responsible for storing graphical data, ensuring rapid access by the GPU for rendering purposes. The quantity and speed of this VRAM has a significant impact on a system's graphics performance.\n\nHigher VRAM capacity allows for the handling of more complex and detailed graphics, resulting in a smoother visual experience. Next, we have capture cards. These sophisticated expansion cards serve a distinct purpose in the world of computing.\n\nTheir primary function is to capture audio and video signals from a variety of external sources, including cameras, microphones, and gaming consoles for the purpose of real-time recording. This versatility makes them invaluable tools for a diverse range of users, including content creators, gamers, and professionals seeking to create high-quality audio-visual content. Lastly, we have a NIC or network interface card.\n\nThese expansion cards enable computers to connect to a network and acts as a communication link, enabling the transfer of data. The primary function of a NIC is to convert the digital data generated by the computer into electrical signals that can be transmitted as an output. Also, they need to be able to receive data by converting electrical signals back into digital data as an input.\n\nNICs come in various forms, including ethernet cards for wired connections and Wi-Fi cards for wireless connections. By adding a NIC to a computer, users can establish reliable network connectivity and access resources and services available on the network. In summary, expansion cards are essential components in modern computing systems, allowing users to enhance their computer's functionality and performance by adding specialized features.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Cooling.\n\nHeat is a natural byproduct of electronic operations. As such, efficient cooling methods are needed to prevent damage and maintain safe operating temperatures. Within a computing device, you are likely to find one or more of the following cooling methods in use.\n\nFirst up, we have a heat sink. A heat sink is a metal structure that absorbs and disperses heat generated by electronic components, such as CPUs or GPUs. It helps prevent overheating by providing a larger surface area for heat dissipation into the surrounding air through the process of convection.\n\nHeat sinks are a passive cooling device capable of minimal heat dispersion, but they can be combined with cooling fans in order to increase their efficiency. Oftentimes, computing devices output too much heat for a passive heat sink to handle, so a more common cooling method is to utilize fans. Fans are considered active cooling and improve heat dissipation by increasing the airflow across computing components.\n\nThe general logic is more fans will equal more cooling, but there will be a limit to how much heat dissipation can be achieved using this method. If fans come up short and things are getting hotter, there is one more option. You can use liquid cooling.\n\nLiquid cooling offers superior cooling, but comes with a higher price tag. This type of cooling would be best suited for high-end servers or gaming PCs. In a computing device, liquid cooling involves actively circulating a liquid, typically water or a coolant, through a closed loop system.\n\nThis method provides the best cooling because liquids are more efficient than air convection at dispersing heat. In summation, heat sinks are good, fans are better, and liquid is best, unless cost is an issue. One more trick up our sleeves when it comes to heat dissipation is thermal paste.\n\nThermal paste is a specialized substance designed to facilitate the transfer of heat between electronic components, such as the CPU and its attached heat sink. Its primary function is to bridge the microscopic gaps and imperfections that naturally exist between the mating surfaces of the CPU and the heat sink. By filling in these irregularities, thermal paste effectively eliminates air voids, ensuring intimate contact between the two surfaces.\n\nOnce the thermal paste is applied, just know it won't last forever. Regular maintenance, including periodic replacement of thermal paste, will be required to maintain an effective heat transfer over time. With that said, let's take a look at how to install a CPU properly and then replace the thermal paste once it gets old.\n\nFirst, we need to install the CPU in its socket. Then we apply the thermal paste. Not too much.\n\nAfter that, it is time to attach the CPU heat sink. Now, over time, the thermal paste will dry out. When that happens, detach the heat sink and remove the old thermal paste.\n\nThen apply fresh thermal paste. Again, not too much. Reattach the CPU heat sink and you're done.\n\nNow, in the event that any of these cooling components fail to perform effectively, the system will be at risk of overheating. When a computer overheats, several detrimental effects can occur, potentially leading to system instability, performance degradation, and hardware damage. Initially, as temperatures rise beyond safe operating limits, the system may throttle down its performance to reduce heat generation, resulting in decreased processing power and slower operation.\n\nContinual overheating can cause components such as the CPU, GPU, and motherboard to degrade over time, shortening their lifespan and increasing the likelihood of premature failure. In severe cases, prolonged exposure to high temperatures can lead to thermal runaway, where components reach temperatures beyond their design limits, causing malfunctions, system crashes, and even permanent damage. Luckily, most computing devices have built-in safety mechanisms such as automatic shutdowns to prevent catastrophic failures, though this may still lead to interrupted workflows and data loss.\n\nOverall, computer overheating poses significant risks to system reliability, performance, and longevity, highlighting the importance of effective cooling solutions and proactive temperature monitoring and management.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Encryption, understanding the distinction between plain text and ciphertext is the very first step when venturing into the expansive realm of encryption and its study, termed cryptography.\n\nSo let's take that first step and begin with a quick look into plain text. Picture yourself jotting down a message to a friend. This message, in its original readable form, is what we call plain text.\n\nIn the realm of IT, plain text is any data or text that has not yet undergone encryption, making it readable by both humans and computers. But here's where the plot thickens. When we aim to safeguard our data or message, especially in the digital domain, we resort to encryption.\n\nThis encrypted form of our plain text is what we refer to as ciphertext. Think of ciphertext as a coded message. To the untrained eye, it appears as mere gibberish.\n\nNow, please allow me to reiterate and further define this concept. Plain text is data presented in a format that is immediately understandable and accessible. It's in its most basic, unaltered state, free from any form of encryption or coding.\n\nThis means that there are no protective layers or barriers concealing its content. As for ciphertext, it stands in stark contrast to plain text. It is the result of taking understandable, clear data and transforming it into a format that appears random and nonsensical at first glance.\n\nThis transformation is achieved through a process called encryption, which employs an encryption key, combined with a specific mathematical algorithm in order to jumble the original data. These algorithms rearrange the data in such a way that its original meaning becomes obscured. The primary purpose of this scrambling is to protect the data's integrity and confidentiality.\n\nWithout the correct decryption key or method, which acts as a sort of digital password or blueprint to reverse the encryption, the ciphertext remains a puzzling array of characters, numbers, and symbols. Only those possessing the right key can revert the ciphertext back to its original plain text form. And that brings us to our next topic, the trusted platform module.\n\nA trusted platform module, or TPM for short, is a specialized microchip designed to provide hardware-based security functions. It serves as a secure repository for cryptographic keys, passwords, and pens. In simpler terms, think of TPM as a small, secure vault inside your computer that stores important secrets, ensuring they can't be easily accessed or tampered with by unauthorized users or malicious software.\n\nThe TPM works in conjunction with the motherboard by being integrated directly onto it or connected via a dedicated header. When the computer boots up, the TPM initializes and performs security functions such as generating and storing encryption keys, verifying the integrity of the boot process, and providing secure storage for sensitive data. It works closely with the computer's firmware and operating system to ensure that only authorized users and software can access critical resources and protects against various forms of attacks, including unauthorized access, tampering, and data theft.\n\nOne crucial function of a TPM is its ability to store keys for hard drive encryption. When you encrypt your hard drive using technologies like BitLocker on Windows or FileVault on Mac OS, the encryption keys are generated and securely stored within the TPM. These keys are used to encrypt and decrypt data on the hard drive, ensuring that even if someone were to physically access your hard drive, they wouldn't be able to read its contents without the proper decryption key stored in the TPM.\n\nThis brings me to one essential fact you should know as a budding IT professional. The TPM is paired to the motherboard. Therefore, removing or replacing the motherboard can potentially lead to complications.\n\nSince the TPM is a hardware-based security measure tied to the specific hardware configuration of your computer, changing the motherboard could result in the loss of access to the encrypted data stored on the hard drive. Additionally, the TPM establishes a unique relationship with the specific motherboard it's installed on. If you were to replace the motherboard without properly handling the TPM, this too would result in the loss of access to the cryptographic keys stored within the TPM.\n\nAs a result, you might not be able to decrypt your hard drive and access your data, leading to data loss. Therefore, it's important to take precautions when dealing with systems equipped with a TPM. Before making any changes to the hardware, it's advisable to back up any important data, and if necessary, properly migrate or deactivate the TPM to avoid any potential issues with data access and cryptographic keys.\n\nNow, a TPM may excel at bolstering the security of individual devices, but will likely fall short when it comes to meeting the demands of enterprise-level security. In such scenarios, a hardware security module, or HSM for short, is often preferred as an alternative to TPMs. HSM's offer robust security for cryptographic operations and key management, making them ideal for environments requiring high levels of protection and scalability.\n\nUnlike TPMs, which are typically integrated into individual devices, HSM's are standalone units providing centralized management and control over cryptographic keys and operations. This feature makes them well-suited for large-scale deployments and stringent security requirements.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. BIOS and UEFI.\n\nBefore we talk about specific BIOS and UEFI settings, we need to clearly understand the term firmware. Firmware is a type of low-level software that is embedded into electronic devices to control their operation. For most computing systems, this low-level software is stored on a chip on the motherboard and acts as the bridge between the system's hardware and the operating system.\n\nUnlike applications that load after the operating system starts, firmware runs first. It initializes hardware components, verifies that they are functioning, and prepares the system to load the operating system. Without firmware, the system would not know how to communicate with the CPU, RAM, storage devices, or input and output components during startup.\n\nTraditionally, this firmware was called the BIOS. BIOS stands for Basic Input Output System. BIOS has been used in personal computers for decades.\n\nWhen you power on a computer, the BIOS performs a power-on self-test or a POST. During this power-on self-test, the system checks critical hardware components, such as the CPU, RAM, storage drives, and video system. If something is wrong, you may hear beep codes or see error messages before the operating system loads.\n\nAfter the POST completes successfully, the BIOS searches for a bootable device based on the configured boot order. It then loads the operating system into memory and hands-off control. However, traditional BIOS had limitations.\n\nIt used older partition schemes, supported smaller drive sizes, and relied on a simple text-based interface. To overcome these limitations, UEFI was introduced. UEFI stands for Unified Extensible Firmware Interface.\n\nUEFI performs the same fundamental tasks as BIOS, but with modern enhanced capabilities. UEFI supports much larger storage drives through the use of GPT partitioning. It boots faster because it initializes hardware more efficiently.\n\nIt also includes a graphical user interface, or GUI, that allows mouse support. Most importantly, it introduces advanced security features, such as Secure Boot. Now that we understand what BIOS and UEFI are, and what firmware does, let's talk about how to access and configure their settings.\n\nIn order to access the BIOS or UEFI settings on your computer, you'll need to follow a few simple steps. Begin by restarting your device. During the startup process, keep an eye out for a message or logo that indicates which key to press to enter the setup utility.\n\nCommon keys include DELETE, F1, F2, F10, or ESCAPE, but the specific key may vary depending on your computer's manufacturer. Once you've identified the correct key, press it repeatedly as soon as you see the message or logo appear on the screen. Timing is important here, so be ready to press the key immediately upon startup.\n\nIf successful, you'll be taken to the BIOS or UEFI setup utility. From the setup utility, you will find a range of options for configuring your computer's hardware and firmware settings. So, are you interested in covering a few common scenarios with me?\n\nWell, all right then. Scenario one. Imagine you are installing a new operating system from a USB drive.\n\nYou insert the USB device, restart the computer, and nothing happens. The system continues loading the existing operating system from the internal drive. In this situation, you would enter the BIOS or UEFI setup utility and navigate to the boot order settings.\n\nBoot order determines the exact sequence in which the system checks devices for a bootable operating system. If the internal drive is listed first, the system will load from it before ever checking the USB device. To resolve the issue, you would move the USB drive higher in the boot priority list, so it is checked before the internal storage device.\n\nBoot order is one of the most frequently configured firmware settings in real-world scenarios, especially during operating system installation, recovery procedures, or troubleshooting startup problems. Scenario two. Suppose you're concerned about the security of your data and decide to enable drive encryption using technologies like Windows BitLocker.\n\nHowever, you encounter an issue where the drive encryption process is not proceeding smoothly. Suspecting that the Trusted Platform Module, or TPM, may not be enabled, you access the BIOS setup utility to investigate. Within the security settings, you locate the option to enable the TPM, which is a hardware-based security feature that enhances data protection.\n\nWith the TPM now enabled, the drive encryption proceeds seamlessly, providing an additional layer of security for your sensitive data. Okay, one more scenario before moving on, and this time I will use the UEFI interface in my example. Imagine you want to set up a virtual lab environment to test different operating systems and software configurations.\n\nTo accomplish this, you plan to use virtualization software. However, when attempting to create virtual machines, you encounter errors indicating that virtualization support is not enabled. Suspecting that virtualization support may be disabled in the UEFI settings, you access the setup utility to investigate.\n\nWithin the UEFI interface, you would look for options such as Intel Virtualization Technology, or AMD-V, which enables virtualization support. After ensuring that virtualization support is enabled, you restart your computer. Now, with virtualization enabled, you can create and run virtual machines smoothly, facilitating your experimentation and testing processes.\n\nIn each of the scenarios described, accessing the BIOS or UEFI setup utility played a pivotal role in resolving hardware related issues and optimizing system performance. BIOS and UEFI provides users with direct control over essential hardware configurations, allowing them to adjust settings such as memory allocation, storage detection, security features, and virtualization support. By navigating through the BIOS or UEFI interface, users can fine tune their computer's hardware settings to suit their needs, ensuring optimal performance and compatibility with various software configurations.\n\nBeyond hardware configuration, BIOS and UEFI also manage peripheral control, including USB devices. Within the BIOS or UEFI settings, users can configure USB permissions to control access to connected devices. This feature is particularly useful for enhancing security by preventing unauthorized access or malicious activities through USB ports.\n\nBy adjusting USB permissions, users can mitigate potential security risks and safeguard their system against external threats. In addition to controlling hardware configurations and managing connected devices, BIOS and UEFI also provide important access control mechanisms at the firmware level. These controls determine who is allowed to modify system settings and who is allowed to start the computer in the first place.\n\nNow let's discuss two important security settings that are often confused, iOS password and boot password. A BIOS password, sometimes called a setup password or supervisory password, protects access to the BIOS or UEFI setup utility. If this password is set, a user must enter it before they can view or modify firmware settings.\n\nThis prevents unauthorized changes to critical system configurations, such as boot order, TPM settings, secure boot or hardware enablement options. In simple terms, a BIOS password protects the firmware settings. On the other hand, a boot password, sometimes called a power on password, serves a different purpose.\n\nA boot password is required immediately when the system powers on. The operating system will not begin loading until the correct password is entered. This restricts access to the entire system at startup.\n\nIn simple terms, a boot password protects operating system access. To summarize, a BIOS password controls access to firmware configuration settings. A boot password controls access to the operating system.\n\nUnderstanding this difference is important because exam questions often test whether you know which layer of protection is being requested. Now let's move into temperature monitoring and fan considerations. Modern BIOS and UEFI interfaces provide built-in hardware monitoring tools that allow you to view real-time temperature readings for critical components, such as the CPU and motherboard.\n\nMonitoring these values is essential because excessive heat can lead to system instability, automatic shutdowns, reduced performance due to throttling, and long-term hardware damage. If a computer powers off unexpectedly during heavy workloads, becomes unusually loud, or feels excessively hot, checking temperature readings within the BIOS or UEFI setup utility is a logical troubleshooting step. One important advantage of firmware-level temperature monitoring is that it occurs before the operating system loads.\n\nThis allows you to determine whether overheating is a hardware issue rather than a software problem. If temperatures are already elevated while sitting in the firmware interface, the issue is likely related to cooling hardware, airflow, or improper installation of components. In addition to monitoring temperatures, BIOS and UEFI settings allow you to configure how system fans respond to rising heat levels.\n\nMany systems provide adjustable fan profiles or customizable fan curves. A fan curve defines how aggressively the cooling fans increase speed as temperature rises. For example, a quiet profile may allow fans to spin slowly until higher temperature thresholds are reached, while a performance profile increases fan speed more aggressively to maintain lower operating temperatures.\n\nProper fan configuration plays a critical role in maintaining system stability and protecting hardware. After installing a new CPU, replacing a heat sink, applying new thermal paste, or building a custom system, verifying temperature readings and fan operation within the firmware settings is an important final step. For exam purposes, if a scenario mentions overheating, unexpected shutdowns under load, loud fan behavior, or thermal warnings, temperature monitoring, and fan configuration within BIOS or UEFI should immediately come to mind.", "uyghur": "Exam Objective 3.5 — Motherboards, CPUs and Add-on Cards\n\n## Motherboard Connector Types\n\n### PCI\n**PCI (Peripheral Component Interconnect)** كونا motherboard لاردا expansion card ئۈچۈن ئىشلىتىلگەن slot. Sound card، network adapter ۋە graphics card قاتارلىقلارنى قوشۇشقا ئىشلىتىلگەن. Modern motherboard دا PCI ئازىيىپ، legacy system دا كۆپرەك قالغان.\n\n### PCIe\n**PCIe (PCI Express)** modern expansion slot ئۆلچىمى بولۇپ، PCI نىڭ ئورنىنى ئالغان. Bandwidth ۋە data transfer speed زور دەرىجىدە يۇقىرى.\n\nSlot/lane configuration:\n- x1\n- x4\n- x8\n- x16\n\n«x» دىن كېيىنكى سان data lane سانىنى كۆرسىتىدۇ. Graphics card ئادەتتە x16 بىلەن باغلىنىدۇ.\n\n### Motherboard main power connectors\n- **20-pin:** كونا motherboard.\n- **24-pin:** modern motherboard دا كەڭ، تېخىمۇ كۆپ power تەمىنلەيدۇ.\n- **20+4-pin:** 20-pin ۋە 24-pin compatibility نى بىرلەشتۈرىدۇ.\n\n### Storage connectors\n- **SATA:** internal HDD/SSD نى motherboard قا ئۇلايدۇ.\n- **eSATA:** external SATA storage ئۈچۈن.\n- **M.2:** SSD نى بىۋاسىتە motherboard قا ئورنىتىدىغان compact connector/slot.\n\n### Motherboard headers\nMotherboard header لار case ئىچىدىكى زاپچاسلارنى motherboard قا ئۇلايدۇ.\n\nكۆپ ئۇچرايدىغانلىرى:\n- Front/top **USB ports** header.\n- Front **audio jacks** header.\n- **Power button / reset button / status LED** front-panel header.\n- **CPU fan / case fan** headers؛ بەزى motherboard temperature sensor غا قاراپ fan speed نى تەڭشىيەلەيدۇ.\n\n## Motherboard Form Factors\n\nMotherboard كومپيۇتېردىكى بارلىق hardware زاپچاسلارنى ئۆزئارا ئۇلايدىغان ئاساسىي circuit board. **Form factor** ئۇنىڭ physical dimensions، mounting points، power connections ۋە layout ىنى بەلگىلەيدۇ.\n\n### ATX\n**ATX (Advanced Technology Extended)** desktop تا ئەڭ كەڭ form factor.\n- چوڭراق board.\n- كۆپ PCIe expansion slots.\n- ئادەتتە 4 ياكى ئۇنىڭدىن كۆپ DIMM slots.\n- كۆپ SATA ports، USB/fan/front-panel headers.\n- Mid-tower ۋە full-tower case قا ماس.\n- Expandability يۇقىرى.\n\n### Micro-ATX\nATX نىڭ كىچىكرەك نۇسخىسى.\n- PCIe slot سانى ATX دىن ئازراق.\n- ئادەتتە 2–4 DIMM slots.\n- Size بىلەن expandability ئارىسىدا تەڭپۇڭ.\n- Mid-size ۋە budget/general desktop تا كۆپ.\n\n### ITX\nCompact system ئۈچۈن كىچىك form factor.\n- ئادەتتە 1 PCIe expansion slot.\n- كۆپىنچە 2 DIMM slots.\n- Expansion چەكلىك، ئەمما modern CPU، SSD، high-speed RAM نى قوللىيالايدۇ.\n- Small-form-factor build ئۈچۈن.\n\n## Motherboard/CPU Compatibility\n\nCPU بىلەن motherboard نىڭ **socket compatibility** سى چوقۇم ماس كېلىشى كېرەك. Intel CPU نى AMD ئۈچۈن لايىھەلەنگەن socket قا، AMD CPU نى Intel socket قا ئورنىتىشقا بولمايدۇ.\n\nCourse بۇنى تۆۋەندىكىچە چۈشەندۈرىدۇ:\n\n### LGA\n**LGA (Land Grid Array)** دا CPU نىڭ ئاستىدا pin ئەمەس، flat contact pads بار؛ socket تەرەپتە metal contacts بولىدۇ. ئورنىتىلغاندا pad بىلەن contact ماس كېلىپ electrical connection قۇرىدۇ.\n\n### PGA\n**PGA (Pin Grid Array)** دا CPU تەرەپتە pins بار، motherboard socket تا ماس كېلىدىغان holes بار. CPU نى ئورنىتىشتا pins توغرا ماسلىشىشى كېرەك.\n\n> Socket design CPU generation/model غا باغلىق؛ vendor نامىنىڭ ئۆزىلا compatibility نى بەلگىلىمەيدۇ. Exam scenario دا socket type/specification نى تەكشۈرۈڭ.\n\n### Multi-socket server motherboard\nServer/enterprise مۇھىتتا بىر motherboard دا **2 ياكى ئۇنىڭدىن كۆپ CPU sockets** بولۇشى مۇمكىن. بۇ intensive workload، multitasking، scalability ۋە processing power نى ئاشۇرۇش ئۈچۈن.\n\n### ARM-based mobile CPUs\nMobile device لاردا **ARM-based CPU** كۆپ ئىشلىتىلىدۇ. ARM performance بىلەن power efficiency ئارىسىدا ياخشى تەڭپۇڭلۇق تەمىنلەيدۇ؛ battery life ۋە compact design مۇھىم smartphone/tablet/embedded system غا ماس.\n\n## CPU Architecture\n\nCPU architecture processor نىڭ قانداق قۇرۇلغانلىقى ۋە instruction نى قانداق ئىجرا قىلىدىغانلىقىنى بەلگىلەيدۇ. **Instruction set** CPU چۈشىنىدىغان «تىل» دەپ قاراشقا بولىدۇ.\n\n### x86 ۋە x64\n- **x86:** بۇ course تا 32-bit architecture بىلەن باغلىنىدۇ.\n- **x64:** 64-bit extension.\n\n32-bit CPU data نى 32-bit chunk دا، 64-bit CPU 64-bit chunk دا بىر تەرەپ قىلىدۇ. بۇ memory addressing، performance ۋە OS compatibility غا تەسىر قىلىدۇ.\n\nCourse بويىچە:\n- 32-bit CPU → 32-bit OS.\n- 64-bit CPU → 64-bit ۋە كۆپ 32-bit OS/software compatibility.\n- 32-bit OS → 32-bit application.\n- 64-bit OS → 64-bit ۋە كۆپ 32-bit application.\n- 32-bit architecture نىڭ direct addressable RAM چېكى ≈ **4 GB**.\n- 64-bit architecture تېخىمۇ زور memory نى address قىلالايدۇ.\n\n**ئىمتىھان memory trick:** x86 → 32-bit / ~4 GB؛ x64 → 64-bit / much larger RAM support.\n\n### ARM / RISC\nARM architecture **RISC (Reduced Instruction Set Computer)** پەلسەپىسىگە تايىنىپ، ئاددىي ۋە optimize قىلىنغان instructions ئارقىلىق power efficiency نى يۇقىرى كۆتۈرىدۇ. Smartphone، tablet ۋە embedded device دا كۆپ ئىشلىتىلىشىنىڭ سەۋەبى performance-per-watt ياخشى.\n\n> ئەسلى transcript «Advanced Risk Machine» دەپ خاتا ئاڭلانغان. ARM نىڭ تارىخىي نامى **Advanced RISC Machines** دەپ ئىشلىتىلىدۇ؛ بۇ يەردە exam ئۈچۈن ARM/RISC مۇناسىۋىتىنى تونۇش مۇھىم.\n\n## CPU Core Configurations\n\n**Core** CPU ئىچىدىكى مۇستەقىل processing unit بولۇپ، instruction نى fetch، decode ۋە execute قىلالايدۇ.\n\n### Single-core\nبىر processing core. Tasks ئارىسىدا تېز ئالماشتۇرالايدۇ، ئەمما بىر ۋاقىتتا parallel execution ئىقتىدارى چەكلىك. Heavy multitasking دا bottleneck بولۇشى مۇمكىن.\n\n### Multi-core\n2 ياكى ئۇنىڭدىن كۆپ independent cores بىر CPU package ئىچىدە. ھەر core ئۆزىنىڭ instruction/workload نى بىرلا ۋاقىتتا بىر تەرەپ قىلىپ **parallel processing** نى قوللايدۇ.\n\nمەسىلەن، quad-core CPU دا 4 core workload نى بۆلۈشۈپ ئىشلەپ، multitasking ۋە responsiveness نى ياخشىلايدۇ.\n\n### Virtualization support\nModern CPU لار hardware-level virtualization نى قوللايدۇ:\n- Intel: **VT/VT-x** family.\n- AMD: **AMD-V**.\n\nبۇ feature بىر physical CPU/system ئۈستىدە كۆپ **VM (Virtual Machine)** نى ئۈنۈملۈك ئىشلىتىشكە، resource allocation ۋە isolation نى ياخشىلاشقا ياردەم بېرىدۇ.\n\n## Expansion / Add-on Cards\n\nExpansion card motherboard دىكى expansion slot قا ئورنىتىلىپ، computer functionality نى كېڭەيتىدۇ.\n\n### Sound card\nAudio signal processing ۋە sound output ئۈچۈن؛ surround sound، digital audio processing قاتارلىق advanced feature نى قوللىيالايدۇ.\n\n### Graphics card ۋە GPU\n**GPU (Graphics Processing Unit)** بىلەن **graphics card** ئوخشاش نەرسە ئەمەس.\n\n- GPU → graphics processing chip نىڭ ئۆزى.\n- Graphics card → PCB + GPU + dedicated memory (**VRAM**) + cooling + interface/output ports قاتارلىقلاردىن تەركىب تاپقان تولۇق expansion card.\n\n**VRAM (Video RAM)** graphical data نى GPU غا تېز يېتىدىغان قىلىپ ساقلايدۇ. Capacity ۋە speed يۇقىرى بولسا، يۇقىرى resolution/complex graphics workload دا performance ياخشىلىنىدۇ.\n\n### Capture card\nCamera، microphone، game console قاتارلىق external source دىن audio/video signal نى capture قىلىپ، real-time recording/streaming ئۈچۈن ئىشلىتىلىدۇ. Content creator، gamer ۋە professional media workflow دا كۆپ.\n\n### NIC\n**NIC (Network Interface Card)** computer نى network قا ئۇلايدۇ. Wired Ethernet card ياكى wireless Wi-Fi card بولالايدۇ. Data نى network signal غا ۋە network signal نى computer ئىشلىتىدىغان digital data غا ئايلاندۇرۇش/يەتكۈزۈش رولى بار.\n\n## Cooling\n\nElectronic component لار ئىشلەۋاتقاندا heat چىقىدۇ. Cooling نىڭ مەقسىتى safe operating temperature نى ساقلاش، instability ۋە hardware damage نىڭ ئالدىنى ئېلىش.\n\n### Heat sink\nMetal structure بولۇپ، CPU/GPU دىن heat نى سۈمۈرۈپ، چوڭ surface area ئارقىلىق ھاۋاغا تارقىتىدۇ. **Passive cooling** دەپ قارىلىدۇ. Fan بىلەن بىرلەشتۈرۈلسە efficiency ئاشىدۇ.\n\n### Fans\n**Active cooling**. Airflow نى ئاشۇرۇپ heat dissipation نى ياخشىلايدۇ. Fan كۆپەيسە cooling كۈچى ئاشىدۇ، ئەمما air cooling نىڭمۇ physical limit ى بار.\n\n### Liquid cooling\nClosed-loop ئىچىدە water/coolant نى ئايلاندۇرۇپ heat نى يۆتكەيدۇ. Air cooling دىن كۈچلۈك، ئەمما قىممەت. High-end gaming PC ۋە server/workstation دا ماس.\n\n### Thermal paste\nCPU بىلەن heat sink ئارىسىدىكى microscopic gap/imperfection نى تولدۇرۇپ، air pocket نى ئازايتىپ heat transfer نى ياخشىلايدۇ.\n\nCPU installation جەريانى:\n1. CPU نى socket قا توغرا ئورنىتىڭ.\n2. Thermal paste نى ئاز مىقداردا ئىشلىتىڭ.\n3. Heat sink نى ئورنىتىڭ.\n4. ۋاقىت ئۆتۈپ paste قۇرۇپ قالسا، heat sink نى ئېلىپ old paste نى تازىلاڭ.\n5. Fresh thermal paste نى ئاز مىقداردا قايتا سۈرۈپ، heat sink نى قايتا ئورنىتىڭ.\n\n### Overheating effects\nCooling يېتەرسىز بولسا:\n- CPU/GPU **thermal throttling** قىلىپ performance نى تۆۋەنلىتىشى مۇمكىن.\n- System instability ۋە crash.\n- Component degradation، lifespan قىسقىرىش.\n- ئېغىر ئەھۋالدا permanent hardware damage.\n- Modern system ئادەتتە critical temperature دا automatic shutdown ئارقىلىق ئۆزىنى قوغدايدۇ، ئەمما unsaved data/work يوقىلىشى مۇمكىن.\n\n## Encryption, TPM and HSM\n\n### Plaintext ۋە Ciphertext\n**Plaintext** تېخى encryption قىلىنمىغان، ئادەم ياكى كومپيۇتېر بىۋاسىتە ئوقۇيالايدىغان data. **Ciphertext** بولسا plaintext نى encryption algorithm + encryption key ئارقىلىق ئۆزگەرتىپ چىققان، قارىماققا مەنىسىز كۆرۈنىدىغان قوغدالغان data.\n\nEncryption نىڭ مەقسىتى data نىڭ **confidentiality** ۋە integrity سىنى قوغداش. توغرا decryption key بولمىسا ciphertext نى ئەسلى plaintext قا قايتۇرۇش قىيىن.\n\n### TPM\n**TPM (Trusted Platform Module)** cryptographic key، password/PIN قاتارلىق سەزگۈر ئۇچۇرلارنى hardware دەرىجىسىدە ساقلايدىغان specialized security chip/module.\n\nTPM:\n- encryption key generate/store قىلىدۇ؛\n- boot process integrity نى تەكشۈرۈشكە ياردەم بېرىدۇ؛\n- firmware/OS بىلەن بىرلىكتە secure storage تەمىنلەيدۇ؛\n- drive encryption قاتارلىق ئىشلارغا ياردەم بېرىدۇ.\n\nCourse مىساللىرى: Windows **BitLocker** ۋە macOS **FileVault** بىلەن drive encryption key لىرى hardware security بىلەن باغلىنىشى مۇمكىن.\n\n**مۇھىم:** TPM motherboard/system بىلەن باغلانغان بولۇشى مۇمكىن. Motherboard ئالماشتۇرۇشتىن بۇرۇن encryption recovery key ۋە مۇھىم data نى backup قىلىش كېرەك؛ بولمىسا encrypted drive غا كىرىش مەسىلىسى كۆرۈلۈشى مۇمكىن.\n\n### HSM\n**HSM (Hardware Security Module)** enterprise دە cryptographic operations ۋە key management ئۈچۈن ئىشلىتىلىدىغان dedicated hardware. TPM ئادەتتە بىر endpoint/system غا باغلىق بولسا، HSM centralized، scalable key management ئۈچۈن ئىشلىتىلىدۇ.\n\n## BIOS and UEFI\n\n### Firmware\n**Firmware** hardware بىلەن OS ئارىسىدىكى low-level software. ئادەتتە motherboard دىكى chip تا ساقلىنىدۇ ۋە OS دىن بۇرۇن ئىشلەيدۇ. Startup تا CPU، RAM، storage ۋە I/O hardware نى initialize قىلىدۇ.\n\n### BIOS\n**BIOS (Basic Input/Output System)** كونا firmware framework.\nStartup دا **POST (Power-On Self-Test)** قىلىپ CPU، RAM، storage، video قاتارلىق critical hardware نى تەكشۈرىدۇ. كاشىلا بولسا beep code ياكى error message بولۇشى مۇمكىن. POST مۇۋەپپەقىيەتلىك بولغاندىن كېيىن boot order بويىچە bootable device ئىزدەپ OS نى memory غا يۈكلەيدۇ.\n\n### UEFI\n**UEFI (Unified Extensible Firmware Interface)** BIOS نىڭ زامانىۋى نۇسخىسى:\n- **GPT** partitioning بىلەن چوڭ drive لارنى قوللايدۇ؛\n- تېز boot;\n- GUI/mouse support;\n- **Secure Boot** قاتارلىق security features.\n\n### BIOS/UEFI غا كىرىش\nComputer restart قىلغاندا manufacturer غا قاراپ **Delete, F1, F2, F10, Esc** قاتارلىق key لارنىڭ بىرىنى startup مەزگىلىدە بېسىش كېرەك.\n\n### Scenario 1 — USB دىن boot\nUSB installer سالغان بولسىمۇ internal drive دىن boot بولسا، BIOS/UEFI دىكى **boot order/boot priority** نى تەكشۈرۈپ USB نى internal disk نىڭ ئالدىغا قويۇڭ.\n\n### Scenario 2 — TPM enable\nBitLocker/drive encryption TPM نى تەلەپ قىلىپ ئىشلىمىسە، BIOS/UEFI security settings دا TPM نى enable قىلىش مۇمكىن.\n\n### Scenario 3 — Virtualization enable\nVM software hardware virtualization يوق دەپ error بەرسە، UEFI دا **Intel Virtualization Technology/VT-x** ياكى **AMD-V** نى enable قىلىڭ.\n\nBIOS/UEFI دا memory، storage detection، USB permissions، security features، virtualization ۋە باشقا hardware configuration نى باشقۇرغىلى بولىدۇ.\n\n### BIOS password vs Boot password\n- **BIOS/setup/supervisor password:** BIOS/UEFI settings نى كۆرۈش ياكى ئۆزگەرتىشنى قوغدايدۇ.\n- **Boot/power-on password:** computer power on بولغاندا OS يۈكلىنىشتىن بۇرۇن password تەلەپ قىلىدۇ.\n\n**ئىمتىھان memory trick:** BIOS password → firmware settings؛ Boot password → startup/system access.\n\n### Temperature and fan monitoring\nBIOS/UEFI دا CPU/motherboard temperature نى OS يۈكلەنمەي تۇرۇپ كۆرگىلى بولىدۇ. Heavy load دا unexpected shutdown، fan زىيادە شاۋقۇن، system بەك قىزىش بولسا firmware temperature reading نى تەكشۈرۈش ياخشى troubleshooting قەدىمى.\n\nFirmware ئىچىدىلا temperature يۇقىرى بولسا، cooling hardware، airflow ياكى installation مەسىلىسىگە تېخىمۇ گۇمان قىلىنىدۇ.\n\n**Fan curve/profile** temperature ئۆرلىگەندە fan speed نىڭ قانچىلىك تېز ئاشىدىغانلىقىنى بەلگىلەيدۇ. Quiet profile fan نى ئاستىراق، performance profile تېخىمۇ aggressive باشقۇرىدۇ.\n\n#"}, {"id": "3.6", "number": "3.6", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.6, given a scenario, install the appropriate power supply. In the context of information technology, a power supply unit, or PSU, is a vital component in desktop PCs. Its job is to convert the AC, or alternating current, from a wall outlet into DC, or direct current that the computer's components can use.\n\nWhen you plug your PC into a wall outlet, the electricity it receives is in the form of alternating current, which fluctuates rapidly in direction and amplitude. However, the delicate circuitry inside your computer requires a steady stream of direct current to function properly. This is where the power supply unit comes in.\n\nIts primary function is to convert the incoming AC power from the wall outlet into the stable DC power needed by the computer's various components. By performing this conversion, the PSU ensures that the computer operates smoothly and reliably, powering everything from the motherboard and CPU to the graphics card and storage drives. Thus, the power supply unit is truly the lifeblood of the desktop PC, providing the electrical energy necessary for its proper functioning.\n\nMoving forward with this topic, the next term we should know is voltage. Voltage refers to the measure of electrical potential difference between two points in a circuit. To state this another way, voltage is the force or pressure that pushes electrical charges through an electrical circuit.\n\nWhen you plug your desktop PC into a wall outlet, it receives electrical power in the form of alternating current. This alternating current typically comes in two primary voltage standards, 120 volt alternating current, or VAC, and 240 volt alternating current. These voltage standards dictate the level of electrical pressure that flows through the wires and into your computer's PSU.\n\nWithin the computer, various components require specific voltages to operate effectively. For instance, the motherboard, CPU, graphics card, and storage drives each require different levels of voltage to function optimally. Common output voltages provided by the PSU include 3.3 volts, five volts, and 12 volts.\n\nIt is important to note, once again, that these output voltages are in the form of direct current. To deliver these various output voltages, the PSU comes with various connectors, the most notable being the motherboard connector. Depending on the age of the motherboard and the PSU, we have the 20 pin, 24 pin, and 20 plus four pin connectors.\n\nThe 20 pin connector was a standard for older motherboards, but has largely been replaced by the more robust 24 pin connector. This 24 pin connector provides additional power for modern systems with more advanced components and higher power requirements. As for the 20 plus four pin connector, this offers flexibility by combining the 20 pin and 24 pin configurations into a single connector.\n\nThis design allows compatibility with both older and newer motherboards, ensuring seamless integration across a range of hardware configurations. Now that you understand voltage and how it is applied to power supply units, the next term you will need in your vocabulary is watt. A watt is a unit of measurement for electrical power.\n\nIt indicates how much energy is used or produced. Furthermore, wattage, in the context of computer hardware, refers to the measure of electrical power that a power supply unit can deliver to a computer system. It's a critical specification to consider when selecting a PSU for a particular computer build.\n\nThe wattage rating of a PSU indicates its maximum power output capacity, which determines the number and type of components it can reliably power. Components such as the CPU, graphics card, storage drives, and peripherals all draw power from the PSU to operate. Therefore, it's essential to choose a PSU with an adequate wattage rating to meet the power demands of these components.\n\nWhen determining the appropriate wattage rating for a computer build, it's important to consider the power requirements of each component individually and then calculate the total power consumption. Factors such as the type and number of components, their power draw under load, and any potential future upgrades or expansions should all be taken into account. Selecting a PSU with an insufficient wattage rating can result in system instability, unexpected shutdowns, or even damage to components.\n\nConversely, choosing a PSU with excessive wattage may lead to unnecessary expenses and inefficiencies, as the system will only draw the power it requires. Therefore, understanding wattage and accurately determining the power requirements of a computer build are essential steps in ensuring a stable and efficient system. This knowledge enables users to select an appropriate PSU that can adequately power their components while also accommodating any future upgrades or expansions.\n\nNow, given the fictional setup here, I have a few questions for you to ponder. What component requires the most power? What is the total wattage requirement for this system?\n\nWould a 500-watt PSU be sufficient for this build? Would a 500-watt PSU allow for future upgrades? You are welcome to leave your thoughts in the comments.\n\nNow that we have discussed wattage, there is one more important specification to understand when selecting a power supply, and that is energy efficiency. Energy efficiency refers to how effectively a power supply converts incoming AC power from the wall into usable DC power for the computer's components. During this conversion process, some potential energy is lost as heat.\n\nA more efficient power supply wastes less energy and produces less heat. Efficiency is commonly measured using the 80-plus certification program. An 80-plus rated power supply guarantees at least 80% efficiency at certain load levels.\n\nThere are higher tiers such as bronze, silver, gold, platinum, and titanium, which indicate increasing levels of efficiency. It is important to understand that efficiency does not increase the wattage capacity of a power supply. Wattage determines how much power can be delivered.\n\nEfficiency determines how effectively power is converted. Moving on with our discussion of power supplies, we now need to cover modular power supplies. Unlike traditional power supplies where all cables are permanently attached, modular power supplies feature detachable cables.\n\nThis unique design allows users to connect only the cables they need for their specific configuration, leaving unused cables disconnected. As a result, modular power supplies significantly reduce cable clutter inside the computer case, creating a cleaner and more organized internal layout. This streamlined setup not only enhances the aesthetics of the build, but also improves airflow within the case, promoting better cooling performance.\n\nWith modular power supplies, PC builders can easily customize their cable management to suit their preferences and optimize the airflow dynamics inside their system. Redundant power supplies is another power consideration when uninterrupted operation is paramount. Unlike traditional power supplies, which rely solely on a single unit, redundant power supplies offer a fail-safe mechanism by providing backup power in the event of a primary PSU failure.\n\nThis redundancy ensures that even if one power supply unit malfunctions, the system can seamlessly switch to the backup power supply unit without interruption. As a result, critical operations can continue without disruption, minimizing downtime and potential data loss. Redundant power supplies are meticulously engineered to meet stringent reliability standards, offering peace of mind to organizations that rely on continuous operation for their business activities.\n\nLastly, in situations where there are sudden and unexpected power interruptions, an uninterruptible power supply, or UPS, becomes an invaluable asset to ensure maximum uptime. A UPS is a device designed to provide immediate and uninterrupted emergency power to connected equipment when the main power source is lost. This seamless transition of power is especially important in IT environments where servers are constantly processing and transmitting data.\n\nEven a momentary power disruption can lead to unsaved data being lost or systems shutting down improperly, which can cause potential damage. When there's a sudden loss of power, a UPS instantly kicks in, ensuring that there's no break in the electricity supply. This immediate response allows IT professionals the time to either switch to a longer-term power solution, like a generator, or to safely shut down systems and save critical data.\n\nWhen connecting a UPS, it is important to understand that not every device in your workspace should be plugged into it. A UPS typically has two types of outlets. Some outlets provide battery backup and surge protection, while others may provide surge protection only.\n\nDevices that are critical to system operation should be connected to the battery backup outlets. For example, in a small office or home environment, you would typically connect the computer or server itself, the monitor, and essential networking equipment, such as a router and cable modem. In a business or enterprise environment, critical servers, network switches, and storage devices may also be connected to a UPS to maintain uptime.\n\nThe reason for connecting networking equipment like a router, modem, or switch is simple. If your computer stays on during a power outage but your network devices lose power, you still lose connectivity. In many IT scenarios, maintaining network communication is just as important as keeping the system powered.\n\nOn the other hand, non-essential or high-power devices should not be connected to the battery-backed outlets. Devices such as printers, scanners, or large speakers draw significant power and can rapidly drain the UPS battery. Laser printers in particular consume a large amount of power when heating their internal components.\n\nIf too many high-draw devices are connected, the UPS battery will deplete quickly, defeating its purpose. The goal of a UPDES is not to run your entire office for hours. Its purpose is to provide short-term power so you can save data, maintain temporary uptime, or perform a safe shutdown.\n\nFor the exam, remember this key concept. Connect critical systems to the UPS battery outlets and avoid connecting non-essential or high-wattage devices that could drain the battery too quickly.", "uyghur": "Exam Objective 3.6 — Power Supply\n\n## PSU\n**PSU (Power Supply Unit)** wall outlet دىكى **AC (Alternating Current)** نى computer component لار ئىشلىتىدىغان **DC (Direct Current)** غا ئايلاندۇرىدۇ.\n\nPSU motherboard، CPU، GPU، storage ۋە peripherals غا لازىملىق مۇقىم DC power تەمىنلەيدۇ.\n\n### Voltage\nVoltage ئېلېكتر charge نى circuit ئىچىدە ھەرىكەتلەندۈرىدىغان potential difference/«بېسىم».\n\nWall power ئادەتتە رايونغا قاراپ **120 VAC** ياكى **240 VAC** بولىدۇ. PSU بۇنى common DC rails غا ئايلاندۇرىدۇ، مەسىلەن:\n- **3.3 V DC**\n- **5 V DC**\n- **12 V DC**\n\nMotherboard main power connector لار 20-pin، 24-pin ۋە 20+4-pin بولالايدۇ.\n\n### Wattage\n**Watt (W)** electrical power نىڭ ئۆلچەم بىرلىكى. PSU wattage ئۇنىڭ ئەڭ كۆپ قانچىلىك power تەمىنلىيەلەيدىغانلىقىنى كۆرسىتىدۇ.\n\nPSU تاللىغاندا CPU، GPU، drives، peripherals نىڭ load ئاستىدىكى power draw ىنى قوشۇپ، future upgrade ئۈچۈن headroom قالدۇرۇش كېرەك.\n\nWattage بەك تۆۋەن بولسا instability، shutdown ياكى hardware problem بولۇشى مۇمكىن. بەك چوڭ PSU سىستېمىغا زۆرۈر power دىن ئارتۇقنى مەجبۇرىي «ئىتتىرىپ» بەرمەيدۇ؛ system ئېھتىياجى بويىچە power تارتىدۇ، ئەمما unnecessary cost بولۇشى مۇمكىن.\n\n### 80 PLUS efficiency\nEnergy efficiency PSU نىڭ AC نى DC غا قانچىلىك ئۈنۈملۈك ئايلاندۇرىدىغانلىقى. Conversion دا بىر قىسىم energy heat بولۇپ يوقىلىدۇ.\n\n**80 PLUS** certification نىڭ tier لىرى:\n- 80 PLUS\n- Bronze\n- Silver\n- Gold\n- Platinum\n- Titanium\n\nTier يۇقىرى بولغانسېرى efficiency يۇقىرى. **Efficiency wattage capacity نى ئاشۇرمايدۇ.** Wattage = power capacity؛ efficiency = conversion قانچىلىك ئۈنۈملۈك.\n\n### Modular PSU\nModular PSU نىڭ cables ى detachable. پەقەت لازىملىق cable لارنىلا ئۇلاپ، cable clutter نى ئازايتىپ، airflow/cable management نى ياخشىلايدۇ.\n\n### Redundant PSU\nCritical server/enterprise environment دا ئىككى ياكى ئۇنىڭدىن كۆپ PSU ئىشلىتىپ redundancy تەمىنلەيدۇ. Primary PSU كاشىلا بولسا backup PSU ئۈزۈلمەي power تەمىنلىيەلەيدۇ.\n\n### UPS\n**UPS (Uninterruptible Power Supply)** main power ئۈزۈلگەندە قىسقا مۇددەتتە battery power تەمىنلەيدۇ. مەقسىتى پۈتۈن ئىشخانىنى سائەتلەپ ئىشلىتىش ئەمەس؛ **data save، temporary uptime، safe shutdown** ئۈچۈن ۋاقىت بېرىش.\n\nUPS دا outlet لار:\n- battery backu
