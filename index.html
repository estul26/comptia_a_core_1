le with devices that support the XD format. Last up for our removable storage types, we have optical disks, which are inserted into optical drives.\n\nAn optical drive is a type of storage device that can read and write to optical disks. Optical drives are classified based on the type of optical disks that can read and write to. The three main types of optical disks are CDs or compact disks, DVDs or digital versatile disks and Blu-ray disks.\n\nAs for how an optical drive works, they consist of a tray or slot where you insert the disk. When you insert a disk, the drive uses a laser beam to read the data stored on the disk surface. The laser scans the disk reflecting off its surface and the drive interprets the reflected signals as digital data, such as audio, video or computer files.\n\nSimilarly, when writing data to a disk, the optical drive uses a laser to etch or burn information onto the disk surface. This process creates pits and lands on the disk that represent the data being written. Once the data is written, it can be read by any compatible optical drive.\n\nAnother topic worth discussing with regard to optical disks is their storage limits. According to the CompTIA official study guide, the maximum storage limit for a CD is 700 megabytes. That is roughly 74 minutes of uncompressed stereo digital audio.\n\nThe maximum storage limit for a DVD is approximately 17 gigabytes. And the maximum storage limit for a Blu-ray disk is 128 gigabytes.", "uyghur": "Exam Objective 3.4\nساقلاش ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## HDD — Hard Disk Drive\n\n### Storage Drive دېگەن نېمە؟\n\nStorage drive — digital data نى **ئۇزۇن مۇددەت** ساقلايدىغان computing component.\n\nRAM غا سېلىشتۇرغاندا:\n- RAM → temporary / short-term storage\n- storage drive → long-term storage\n\nStorage drive:\n- operating system\n- software application\n- personal file\n- document\n\nقاتارلىق data نى computer power off بولغاندىن كېيىنمۇ ساقلاپ قالىدۇ.\n\n---\n\n### HDD قانداق data ساقلايدۇ؟\n\n**HDD — Hard Disk Drive** data نى:\n- ئايلىنىدىغان magnetic disk / platter\n\nئۈستىدە **magnetically** ساقلايدۇ.\n\nHDD نىڭ مەنبەدە بېرىلگەن ئەۋزەللىكلىرى:\n- large storage capacity\n- باشقا storage technology غا قارىغاندا نىسبەتەن تۆۋەن cost\n\nئىشلىتىلىدىغان جايلار:\n- desktop\n- laptop\n- server\n\nكەمچىلىكلىرى:\n- mechanical parts بار\n- wear and tear غا ئۇچرايدۇ\n- data access SSD غا ئوخشاش تېخىمۇ يېڭى storage تۈرلىرىدىن ئاستىراق بولۇشى مۇمكىن\n\n---\n\n### HDD نىڭ ئىچكى زاپچاسلىرى\n\nHDD نىڭ ئاساسىي قۇرۇلمىسى:\n\n- **Platter** → magnetic coating بار disk\n- **Spindle** → platter لارنى ئايلاندۇرىدۇ\n- **Read/Write Head** → platter ئۈستىدىكى data نى ئوقۇيدۇ ياكى يازىدۇ\n- **Protective casing** → ئىچكى زاپچاسلارنى قوغدايدۇ\n\nPlatter لار:\n- بىر ياكى بىر نەچچە بولۇشى مۇمكىن\n- spindle ئۈستىدە vertically stacked بولىدۇ\n- high speed دا ئايلىنىدۇ\n\n### Read Operation\n\nRead/write head:\n- rotating platter يۈزىنىڭ ئۈستىدە ناھايىتى يېقىن ھالەتتە ھەرىكەت قىلىدۇ\n- magnetic change لارنى بايقايدۇ\n- ئۇلارنى computer process قىلالايدىغان electrical signal غا ئايلاندۇرىدۇ\n\n### Write Operation\n\nData يازغاندا:\n- read/write head magnetic field ئىشلىتىپ platter يۈزىدىكى magnetic state نى ئۆزگەرتىدۇ\n- شۇ ئارقىلىق information encode قىلىنىدۇ\n\nمەنبە HDD نى كۈچلۈك magnet دىن يىراق ساقلاشنى ئاگاھلاندۇرىدۇ.\n\n---\n\n## HDD RPM\n\n**RPM — Revolutions Per Minute**\n\nHDD platter نىڭ بىر مىنۇتتا قانچە تولۇق ئايلىنىدىغانلىقىنى كۆرسىتىدۇ.\n\nمەنبە بويىچە RPM:\n- HDD performance\n- read/write access time\n\nغا مۇناسىۋەتلىك.\n\nAll else equal بولغاندا:\n- higher RPM → faster access\n\nمەنبە مىساللىرى:\n\n| HDD speed | Source comparison |\n|---|---|\n| **5,400 RPM** | ئاستىراق |\n| **7,200 RPM** | 5,400 RPM دىن تېزرەك |\n| **10,000 RPM** | تېخىمۇ تېز |\n| **15,000 RPM** | تېخىمۇ تېز |\n\n**Source wording note:** transcript higher RPM نى read/write head نىڭ `traverse the spinning platter more swiftly` قىلىشى بىلەن چۈشەندۈرىدۇ. Reviewed Uyghur بۇنى ئاددىي source conclusion — platter تېزرەك ئايلىنسا access time ياخشىلىنىدۇ — شەكلىدە ساقلايدۇ، مېخانىكىلىق تەپسىلاتنى سىرتقى مەنبەدىن قايتا يازمايدۇ.\n\n---\n\n## HDD Form Factors\n\n### 3.5-inch HDD\n\nمەنبە 3.5-inch HDD نى:\n- desktop\n- server\n- data center\n\nبىلەن باغلايدۇ.\n\nئالاھىدىلىك:\n- physical size چوڭراق\n- larger storage capacity غا ماس\n- desktop case ئىچىدە airflow/cooling ئۈچۈن تېخىمۇ كۆپ بوشلۇق بار\n\n### 2.5-inch HDD\n\nمەنبە 2.5-inch HDD نى:\n- laptop\n- portable computing device\n\nبىلەن باغلايدۇ.\n\nئالاھىدىلىك:\n- compact\n- space-efficient\n- portability غا ماس\n- كىچىك بولسىمۇ ياخشى storage capacity تەمىنلىيەلەيدۇ\n\n**Exam memory:**\n> **3.5\" = Desktop / Server**\n>\n> **2.5\" = Laptop / Portable**\n\n---\n\nExam Objective 3.4\nساقلاش ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## SSD — Solid State Drive\n\n**SSD — Solid State Drive** digital data نى **non-volatile flash memory chip** لاردا ساقلايدۇ.\n\nHDD غا سېلىشتۇرغاندا:\n- spinning platter يوق\n- read/write head يوق\n- moving mechanical part يوق\n\nشۇڭا مەنبە SSD نىڭ:\n- data access تېزرەك\n- physical shock قا چىداملىقراق\n- vibration غا چىداملىقراق\n- temperature change غا چىداملىقراق\n- silent\n- power consumption تۆۋەنرەك\n\nبولۇشى مۇمكىنلىكىنى چۈشەندۈرىدۇ.\n\nئاساسىي trade-off:\n- cost per GB يۇقىرىراق\n- ئەمما price ۋاقىتنىڭ ئۆتۈشى بىلەن تۆۋەنلىگەن\n\n---\n\n## SSD نىڭ ئىچكى زاپچاسلىرى\n\n### NAND Flash Memory\n\n**NAND flash memory**\n- actual data نى ساقلايدۇ\n\n### SSD Controller\n\n**SSD controller**\n- drive نىڭ `brain` ى دەپ تەسۋىرلەنگەن\n\nئۇ:\n- data نىڭ قانداق write قىلىنىشى\n- read قىلىنىشى\n- stored بولۇشى\n- organized بولۇشى\n\nنى باشقۇرىدۇ.\n\nمەنبە بويىچە بۇ:\n- performance\n- longevity\n\nنى ياخشىلاشقا ياردەم بېرىدۇ.\n\n### Cache\n\nنۇرغۇن SSD دا **cache** بار.\n\nCache:\n- high-speed buffer\n- frequently accessed data\n- incoming write operation\n\nنى ۋاقىتلىق ساقلاپ:\n- response time نى تېزلىتىدۇ\n- load ئاستىدا drive نىڭ راۋان ئىشلىشىگە ياردەم بېرىدۇ\n\n---\n\n## SSD Communication Interfaces\n\n### SATA SSD\n\n**SATA — Serial Advanced Technology Attachment**\n\nSATA SSD:\n- motherboard غا **SATA data cable** بىلەن ئۇلىنىدۇ\n- power supply دىن **separate SATA power connector** تەلەپ قىلىدۇ\n\nيەنى:\n1. Data connection\n2. Power connection\n\nئىككى physical connection كېرەك.\n\nمەنبە SATA نىڭ:\n- desktop/laptop لاردا كەڭ compatibility\n\nتەمىنلەيدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### SATA 3 Speed\n\nمەنبە:\n- **SATA 3**\n- theoretical maximum = **6 Gbps**\n\nدەپ بېرىدۇ.\n\nSATA SSD HDD دىن تېز بولسىمۇ:\n- NAND flash تېخىمۇ تېز بولالايدۇ\n- SATA interface ئۆزى bottleneck بولۇشى مۇمكىن\n\n**Exam memory:**\n> **SATA SSD = Fast vs HDD, but limited by SATA interface**\n\n---\n\n### PCIe — Peripheral Component Interconnect Express\n\n**PCIe**:\n- motherboard قا built-in high-speed expansion interface\n- processor بىلەن high-performance component ئارىسىدا fast communication pathway تەمىنلەيدۇ\n\nSATA غا ئوخشىمايدىغىنى:\n- separate SATA data cable غا تايانمايدۇ\n- direct communication lane لارنى ئىشلىتىدۇ\n\n### PCIe Lanes\n\nمەنبە بويىچە ھەر بىر lane:\n- بىر pair send\n- بىر pair receive\n\nدىن تەركىب تاپىدۇ.\n\nMultiple lane:\n- total bandwidth نى ئاشۇرىدۇ\n\nشۇڭا PCIe SSD:\n- SATA-based SSD دىن تېخىمۇ يۇقىرى read/write performance تەمىنلىيەلەيدۇ\n\nمىسال:\n- high-performance system\n- responsiveness مۇھىم مۇھىت\n\n---\n\n### NVMe — Non-Volatile Memory Express\n\n**NVMe** physical interface ئەمەس.\n\nئۇ:\n- flash-based storage ئۈچۈن لايىھەلەنگەن **communication protocol**\n\nمەنبە analogy:\n\n> **PCIe = Highway**\n>\n> **NVMe = Highway signs**\n\nيەنى:\n- PCIe → data ماڭىدىغان physical/high-speed pathway\n- NVMe → data نىڭ قانداق structured, queued, prioritized, processed بولىدىغانلىقىنى بەلگىلەيدۇ\n\nNVMe:\n- flash storage ئۈچۈن مەخسۇس لايىھەلەنگەن\n- older mechanical-drive-oriented protocol overhead نى ئازايتىدۇ\n- latency نى ئازايتىدۇ\n- responsiveness نى ياخشىلايدۇ\n- many simultaneous command / queue نى قوللايدۇ\n\n**ئىمتىھاندا ئەستە تۇتۇڭ:**\n> **PCIe = Physical communication interface**\n>\n> **NVMe = Protocol that runs over PCIe for SSD performance**\n\n---\n\n### SAS — Serial Attached SCSI\n\n**SAS — Serial Attached SCSI**\n\nمەنبە SAS نى:\n- enterprise\n- server\n- storage array\n- data center\n\nمۇھىتىغا باغلايدۇ.\n\nSATA كۆپىنچە consumer system دا ئىشلىتىلسە، SAS مەنبە بويىچە:\n- higher reliability\n- scalability\n- sustained-workload performance\n- improved error detection\n- advanced command handling\n\nنى تەمىنلەشكە لايىھەلەنگەن.\n\n### Dual-Port Redundancy\n\nSAS:\n- drive نىڭ ئىككى separate controller غا ئۇلىنىشىغا يول قويالايدۇ\n\nبۇ:\n- redundancy\n\nتەمىنلەيدۇ.\n\nئەگەر بىر pathway fail بولسا:\n- ئىككىنچى pathway دا operation داۋاملىشىشى مۇمكىن\n\n**Transcript correction:** source `SAS offers several advantages over SADOC` دەپ transcript قىلىنغان. Context ۋە كېيىنكى summary ئېنىق ھالدا **SATA** بىلەن سېلىشتۇرۇۋاتىدۇ؛ reviewed Uyghur **SATA** نى ئىشلىتىدۇ.\n\n**Exam memory:**\n> **SATA = Consumer**\n>\n> **SAS = Enterprise / Reliability / Redundancy / Scalability**\n\n---\n\n## SSD Form Factors\n\n### M.2\n\n**M.2**\n- modern\n- compact\n- desktop ۋە laptop SSD لاردا كۆپ ئىشلىتىلىدىغان form factor\n\nM.2 drive:\n- traditional data cable ئىشلەتمەيدۇ\n- motherboard دىكى dedicated slot قا بىۋاسىتە ئورنىتىلىدۇ\n\nئالاھىدىلىك:\n- slim\n- flat\n- space-saving\n\nمىسال:\n- laptop\n- small-form-factor PC\n- modern desktop motherboard\n\n### mSATA — Mini SATA\n\n**mSATA — Mini SATA**\n\nمەنبە:\n- compact system ئۈچۈن كىچىك SATA form\n- motherboard غا بىۋاسىتە ئۇلىنىدۇ\n- earlier compact system لاردا كۆپ ئۇچرىغان\n- كېيىن M.2 تەرىپىدىن كۆپىنچە ئالماشتۇرۇلغان\n\n**Exam memory:**\n> **M.2 = Modern compact form factor**\n>\n> **mSATA = Older compact SATA form factor**\n\n---\n\n## SSD Interface vs Form Factor — مۇھىم پەرق\n\nبۇ objective دا ئارىلاشمايدىغان ئۇقۇملار:\n\n- **SATA** → communication interface\n- **PCIe** → high-speed physical communication interface\n- **NVMe** → protocol\n- **SAS** → enterprise serial storage interface\n- **M.2** → form factor\n- **mSATA** → compact SATA form factor\n\n---\n\nExam Objective 3.4\nساقلاش ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## RAID — Redundant Array of Independent Disks\n\n**RAID** بىر نەچچە physical disk نى بىر **logical unit** قىلىپ بىرلەشتۈرۈپ:\n- performance\n- reliability\n- ياكى ئىككىسى\n\nنى ياخشىلاشقا ئىشلىتىلىدىغان technology.\n\nRAID:\n- data نى multiple drive ئارىسىدا distribute\n- ياكى replicate\n\nقىلىدۇ.\n\nDifferent configuration:\n- **RAID level**\n\nدەپ ئاتىلىدۇ.\n\nمەنبە قاپلايدىغان RAID level لار:\n- RAID 0\n- RAID 1\n- RAID 5\n- RAID 6\n- RAID 10 / 1+0\n\n---\n\n### RAID 0 — Striping\n\nRAID 0 نىڭ مەقسىتى:\n- speed\n- maximum usable storage capacity\n\nData:\n- **striped**\n- 2 ياكى تېخىمۇ كۆپ disk ئارىسىدا بۆلۈپ يېزىلىدۇ\n\n**Striping**\n- data نى block لارغا بۆلىدۇ\n- block لارنى multiple drive غا تارقىتىدۇ\n- multiple disk بىر ۋاقىتتا ئىشلەيدۇ\n\nنەتىجە:\n- performance ياخشىلىنىدۇ\n\nئەمما:\n\n> **RAID 0 = No redundancy**\n\nبىر disk fail بولسىمۇ:\n- array دىكى data نىڭ ھەممىسى يوقىلىشى مۇمكىن\n\nچۈنكى ھەر file نىڭ پارچىلىرى multiple drive غا تارقالغان.\n\n**ئەستە تۇتۇڭ: RAID 0 = Speed / Striping / No redundancy**\n\n---\n\n### RAID 1 — Mirroring\n\nRAID 1:\n- data نى **2 disk** قا identical copy قىلىپ يازىدۇ\n\nيەنى:\n- **mirroring**\n\nئەگەر بىر drive fail بولسا:\n- ئىككىنچى drive operation نى داۋاملاشتۇرىدۇ\n- data loss بولمايدۇ\n\nئەۋزەللىك:\n- strong redundancy\n\nTrade-off:\n- usable capacity يېرىم\n- چۈنكى ھەممە data duplicate قىلىنىدۇ\n\nمەنبە:\n- RAID 0 غا ئوخشاش performance enhancement تەمىنلىمەيدۇ\n\nدەپ چۈشەندۈرىدۇ.\n\n**ئەستە تۇتۇڭ: RAID 1 = Mirror / Redundancy / 50% usable capacity**\n\n---\n\n### RAID 5 — Striping + Distributed Parity\n\nRAID 5:\n- striping\n- parity\n\nنى بىرلەشتۈرىدۇ.\n\n**Parity**:\n- written data دىن ھېسابلىنىدىغان value\n- بارلىق drive لار ئارىسىدا distributed بولىدۇ\n- single dedicated parity disk قا قويۇلمايدۇ\n\nبىر drive fail بولسا:\n- remaining data block\n- parity information\n\nئارقىلىق missing data reconstructed قىلىنىدۇ.\n\nمەنبە بويىچە:\n- **minimum 3 drives**\n- **1 drive failure** غا بەرداشلىق بېرەلەيدۇ\n\n**ئەستە تۇتۇڭ: RAID 5 = Striping + Distributed parity + 1-drive fault tolerance**\n\n---\n\n### RAID 6 — Double Distributed Parity\n\nRAID 6، RAID 5 ئۈستىگە قۇرۇلغان.\n\nئۇمۇ:\n- striping\n- distributed parity\n\nئىشلىتىدۇ.\n\nپەرق:\n\n> **RAID 6 = Two sets of parity**\n\nشۇڭا مەنبە بويىچە:\n- simultaneous **2 drive failure** غا بەرداشلىق بېرەلەيدۇ\n\nبۇ:\n- large array\n- enterprise environment\n\nدا تېخىمۇ resilient.\n\n**Source-boundary note:** transcript RAID 6 نىڭ minimum drive count نى بۇ segment دا بەرمەيدۇ؛ reviewed Uyghur سىرتقى سان قوشمايدۇ.\n\n---\n\n### RAID 10 — RAID 1+0\n\n**RAID 10**\n- RAID 0 striping\n- RAID 1 mirroring\n\nنى بىرلەشتۈرىدۇ.\n\nمەنبە بويىچە:\n- high performance\n- strong redundancy\n- faster rebuild\n- strong fault tolerance\n\nتەمىنلەيدۇ.\n\nRebuild تېزرەك بولۇشىنىڭ source explanation ى:\n- data parity دىن reconstruct قىلىنمايدۇ\n- mirrored copy دىن ئىشلىتىلىدۇ\n\nTrade-off:\n- cost يۇقىرى\n- usable capacity يېرىم\n- total storage نىڭ يېرىمى mirroring ئۈچۈن ئىشلىتىلىدۇ\n\n**Source-boundary note:** transcript RAID 10 نىڭ minimum drive count نى بۇ segment دا بەرمەيدۇ؛ reviewed Uyghur سىرتقى سان قوشمايدۇ.\n\n---\n\n## RAID Comparison\n\n| RAID | Method | Source-stated strength | Source-stated risk/trade-off |\n|---|---|---|---|\n| **0** | Striping | Speed + max usable capacity | No redundancy |\n| **1** | Mirroring | Strong redundancy | 50% usable capacity |\n| **5** | Striping + parity | 1-drive fault tolerance | Parity overhead |\n| **6** | Striping + double parity | 2-drive fault tolerance | More protection/overhead |\n| **10** | Striping + mirroring | Speed + redundancy | 50% usable capacity / cost |\n\n**Source-scope note:** transcript RAID نى performance/reliability technology سۈپىتىدە چۈشەندۈرىدۇ؛ `RAID is not a backup` دېگەن قوشۇمچە industry rule بۇ source segment دا يوق، شۇڭا reviewed lesson غا قوشۇلمىدى.\n\n---\n\nExam Objective 3.4\nساقلاش ئۈسكۈنىلىرىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## Removable Storage\n\n**Removable storage** data نى:\n- ساقلاش\n- يۆتكەش\n- باشقا device قا ئېلىپ بېرىش\n\nئۈچۈن قولايلىق portable storage.\n\nمەنبە تۆۋەندىكى تۈرلەرنى قاپلايدۇ:\n- flash drive\n- memory cards\n- optical discs\n\n---\n\n## Flash Drive\n\n**Flash drive**:\n- portable storage\n- non-volatile flash memory chip\n\nئىشلىتىدۇ.\n\nSSD بىلەن ئوخشاشلىقى:\n- ئىككىسىمۇ flash memory ئىشلىتىدۇ\n\nپەرق:\n- flash drive كىچىك ۋە portable\n\nناملىرى:\n- flash drive\n- thumb drive\n- USB flash drive، ئەگەر USB connector بولسا\n\nConnector/interface:\n- computer/laptop/device قا بىۋاسىتە كىرىدۇ\n- data transfer + power نى بىر connection ئارقىلىق تەمىنلەيدۇ\n- separate power adapter كېرەك ئەمەس\n\nOS غا ئۇلانغاندىن كېيىن:\n- removable storage device سۈپىتىدە كۆرۈنىدۇ\n\nئىشلەتكۈچى:\n- drag/drop\n- copy\n\nئارقىلىق file نى يۆتكىيەلەيدۇ.\n\n---\n\n## Memory Cards\n\nMemory card لارمۇ:\n- flash memory technology\n\nئىشلىتىدۇ.\n\nئەمما form factor ۋە intended device تۈرى پەرقلىنىدۇ.\n\n### SD — Secure Digital\n\n**SD card — Secure Digital**\n\nمەنبە:\n- widely used\n- standard size\n- digital camera\n- camcorder\n\nبىلەن باغلايدۇ.\n\nئىشلىتىش:\n- photo\n- video\n- music\n- multimedia file\n\nمەنبە ئۇنى:\n- reliable\n- widely compatible\n\nدەپ تەسۋىرلەيدۇ.\n\n---\n\n### MiniSD\n\n**Transcript correction:** source بۇ بۆلەكتە ئىككى قېتىم `many SD cards` دەپ transcript قىلىنغان، ئەمما description:\n- standard SD دىن كىچىك variant\n- compact device\n- كېيىن microSD تەرىپىدىن largely replaced\n\nدەپ ئېنىقلايدۇ.\n\nReviewed Uyghur بۇنى **MiniSD** دەپ كۆرسىتىدۇ.\n\nMiniSD:\n- standard SD نىڭ كىچىكرەك variant ى\n- compact device ئۈچۈن\n- source examples: smartphone / GPS unit\n- كېيىن microSD تەرىپىدىن كۆپىنچە ئالماشتۇرۇلغان\n\n---\n\n### microSD\n\n**microSD**\n- MiniSD دىنمۇ كىچىكرەك format\n- compact size بولسىمۇ high storage capacity تەمىنلىيەلەيدۇ\n\nمەنبە مىساللىرى:\n- smartphone\n- tablet\n- wearable device\n\n---\n\n### CF — CompactFlash\n\n**CF — CompactFlash**\n\nمەنبە:\n- professional-grade digital camera\n- high-performance device\n\nبىلەن باغلايدۇ.\n\nSD غا سېلىشتۇرغاندا:\n- larger\n- thicker\n- robust\n- durable/reliable\n\nشۇڭا demanding environment غا ماس.\n\n---\n\n### xD Card\n\nمەنبە:\n- `XD cards, short for extreme digital`\n- Olympus ۋە Fujifilm تەرەققىي قىلدۇرغان proprietary digital-camera memory-card format\n\nدەپ چۈشەندۈرىدۇ.\n\nSource بويىچە:\n- بۇرۇن popular\n- ھازىر less common\n- SD / microSD تەرىپىدىن largely replaced\n- moderate storage capacity\n- xD-support device بىلەن compatible\n\n**Source wording note:** reviewed lesson `extreme digital` expansion نى source wording سۈپىتىدە ساقلايدۇ؛ بۇ نامنى سىرتقى مەنبە بىلەن ئالماشتۇرمايدۇ.\n\n---\n\n## Optical Discs\n\n**Optical drive**:\n- optical disc نى read/write قىلالايدىغان storage device\n\nئاساسىي optical disc تۈرلىرى:\n- **CD — Compact Disc**\n- **DVD — Digital Versatile Disc**\n- **Blu-ray Disc**\n\n### Optical Drive قانداق ئىشلەيدۇ؟\n\nDisc:\n- tray ياكى slot قا كىرگۈزۈلىدۇ\n\nRead:\n- laser beam disc يۈزىنى scan قىلىدۇ\n- reflected signal digital data غا interpretation قىلىنىدۇ\n\nWrite:\n- laser disc يۈزىگە information burn/etch قىلىدۇ\n- pits and lands data نى ئىپادىلەيدۇ\n\nCompatible optical drive:\n- يېزىلغان data نى كېيىن ئوقۇيالايدۇ\n\n---\n\n## Optical Disc Capacity — Source-Stated Maximums\n\nمەنبە `CompTIA official study guide` غا تايىنىپ تۆۋەندىكى maximum value لارنى بېرىدۇ:\n\n| Media | Source-stated maximum |\n|---|---:|\n| **CD** | **700 MB** |\n| **DVD** | **≈17 GB** |\n| **Blu-ray** | **128 GB** |\n\nCD ئۈچۈن مەنبە يەنە:\n- تەخمىنەن **74 minutes of uncompressed stereo digital audio**\n\nدەپ بېرىدۇ.\n\n**Source-boundary note:** reviewed Uyghur بۇ value لارنى source-stated maximum دەپ ساقلايدۇ؛ single-layer/dual-layer/BDXL قاتارلىق سىرتقى detail قوشۇلمايدۇ.\n\n---\n\n## Objective 3.4 — قىسقا Exam Memory Map\n\n### HDD\n- Magnetic + Mechanical\n- Platters + spindle + read/write head\n- RPM = 5,400 / 7,200 / 10,000 / 15,000 source examples\n- 3.5\" = Desktop/Server\n- 2.5\" = Laptop/Portable\n\n### SSD\n- NAND flash + Controller + Cache\n- No moving parts\n- SATA 3 = source-stated 6 Gbps theoretical max\n- PCIe = Physical high-speed interface\n- NVMe = Protocol over PCIe\n- SAS = Enterprise / redundancy\n- M.2 = Modern compact form factor\n- mSATA = Older compact SATA form factor\n\n### RAID\n- **0** = Striping / No redundancy\n- **1** = Mirroring\n- **5** = Striping + parity / min 3 / survive 1 drive failure\n- **6** = Double parity / survive 2 drive failures\n- **10** = Striping + mirroring\n\n### Removable\n- Flash drive = Portable flash\n- SD / MiniSD / microSD / CF / xD\n- CD = 700 MB\n- DVD ≈ 17 GB\n- Blu-ray = 128 GB\n"}, {"id": "3.5", "number": "3.5", "domain": "3", "domain_en": "Hardware", "domain_ug": "قاتتىق دېتال", "english": "Exam objective 3.5, given a scenario, install and configure motherboards, central processing units and add-on cards. Motherboard connector types. This video segment will have us exploring the various types of connectors found on motherboards.\n\nSome of these we have covered earlier in this course, but there will be a few new details and a few new connector types that will be included as well. So it is best to pay attention to avoid missing anything. With that said, our first motherboard connector type will be PCI.\n\nPeripheral component interconnect, or PCI for short, is a standard expansion connector or slot that is commonly found on older computer motherboards. These slots enable users to connect various expansion cards. Examples include sound cards for improved audio output, network adapters for seamless internet connectivity, and graphics cards for enhanced visual performance.\n\nWhile PCI slots are gradually becoming less prevalent in modern motherboard designs, they retain significance in legacy systems and specific niche applications where older hardware configurations persist. Moving on, we have PCI's more contemporary replacement, PCIe or PCI Express. In recent years, PCIe has risen as the leading standard for expansion slots in modern motherboard designs, replacing the traditional PCI architecture.\n\nThe PCIe interface boasts several advantages over its predecessor, notably providing significantly higher bandwidth and faster data transfer rates. This enhanced performance makes PCIe particularly well suited for demanding computing tasks, ranging from immersive gaming experiences to resource-intensive multimedia editing projects. Moreover, PCIe's scalability and versatility are evident in its various slot sizes, including by one, by four, by eight, and by 16 configurations.\n\nEach designation corresponds to the number of lanes allocated for data transfer, allowing for tailored connectivity solutions that cater to diverse hardware requirements. Among the essential power connector types for motherboards, we have the 20-pin, 24-pin, and 20+4-pin connectors. The 20-pin connector was a standard for older motherboards, but has largely been replaced by the more robust 24-pin connector.\n\nThis 24-pin connector provides additional power for modern systems with more advanced components and higher power requirements. As for the 20+4-pin connector, this offers flexibility by combining the 20-pin and 24-pin configurations into a single connector. This design allows compatibility with both older and newer motherboards, ensuring seamless integration across a range of hardware configurations.\n\nNext, we have a few motherboard connector types that are used to connect hard drives to the system. Serial Advanced Technology Attachment, or SATA connectors, are one such connector type. They are used to connect storage devices, such as hard disk drives, HDDs, and solid-state drives, SSDs, to the motherboard.\n\nSATA offers high-speed data transfer rates and is widely used in modern computers for connecting internal storage devices, providing reliable storage solutions for various applications. External Serial Advanced Technology Attachment, or eSATA ports, are external SATA connectors that allow users to connect external storage devices, such as external hard drives, directly to the motherboard. eSATA offers faster data transfer speeds compared to earlier USB connections, making it a preferred choice for users requiring high-speed external storage solutions.\n\nAs for M.2, this connector type is used in conjunction with a cutting-edge interface that is revolutionizing storage solutions in modern computer systems. These compact and versatile connectors enable direct attachment of solid-state drives to the motherboard, offering unparalleled performance and flexibility. Additionally, their diminutive size and low profile make them ideal for compact builds and portable devices.\n\nLast up, we have motherboard header connectors. Headers on the motherboard serve as vital connectors that link various internal components, offering a versatile platform for integrating peripherals and accessories into the computer system. These connectors, often located along the edges of the motherboard, establish connections with components mounted within the computer case.\n\nOne of their primary functions is facilitating the connection of USB ports, enabling seamless integration of external devices, such as keyboards, mice, printers, and storage drives. These headers typically connect to ports located on the front or top panel of the computer case, allowing for easy access and convenient connectivity. Moreover, headers play a pivotal role in linking audio jacks, establishing a pathway for transmitting audio signals between the system and external speakers, headphones, microphones, and other audio devices.\n\nThese connectors typically link to audio ports located on the front or top panel of the computer case, providing users with immersive audio experiences while engaging in gaming, multimedia playback, and communication. Front panel headers on the motherboard enable the connection of essential controls, including power buttons, reset buttons, and LED indicators directly to the case. By linking these components to the motherboard, users can conveniently manage system power, perform resets, and monitor system status from the front panel of the case.\n\nAdditionally, headers for fans provide a means of connecting case fans, CPU fans, and other cooling components directly to the motherboard. These connectors facilitate system cooling and optimize thermal performance by regulating fan speeds based on temperature sensors located throughout the case.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Motherboard form factors.\n\nAs a refresher, a motherboard is the main circuit board in a computing device that connects and allows communication between all the other components. Another way of describing it is as the backbone that ties a computer's hardware together. Without the motherboard, none of the components could interact.\n\nIt sits at the heart of the system, and every other component must be compatible with it. Motherboards come in different physical sizes and layouts, known as form factors. The form factor determines the board's dimensions, mounting points, power connections, and overall layout.\n\nFor the exam, you should understand three common desktop motherboard form factors. These are the ATX, Micro ATX, and ITX form factors. Let's begin with ATX, which stands for Advanced Technology Extended.\n\nATX motherboards are the most widely adopted standard in desktop systems. They are larger in size and provide ample space for components and connectors. Because of their larger dimensions, ATX boards typically support multiple PCIe expansion slots, allowing for additional graphics cards, network adapters, and other add-on cards.\n\nATX motherboards commonly include four or more DIMM slots for RAM, enabling higher memory capacity. They also provide multiple SATA ports and numerous onboard headers for USB connections, cooling fans, and front panel connectors. Their size makes them well-suited for full tower and mid tower desktop cases, where expandability and performance are priorities.\n\nNext, we have Micro ATX. Micro ATX is a smaller version of the ATX form factor. It maintains many of the same features, but in a more compact design.\n\nMicro ATX boards typically offer fewer PCIe expansion slots than full ATX boards, but still provide enough flexibility for most standard desktop configurations. In many cases, Micro ATX boards include two to four DIMM slots and a reduced number of expansion slots compared to ATX. They are commonly used in mid-sized systems where space savings are desired without significantly limiting performance or upgrade potential.\n\nMicro ATX strikes a practical balance between size and expandability. Finally, we have ITX, which is short for information technology extended. ITX motherboards are designed for compact systems where minimizing space is the primary concern.\n\nBecause of their smaller footprint, ITX motherboards typically include a single PCIe expansion slot and often two DIMM slots for memory. While ITX motherboards offer limited expansion compared to ATX and Micro ATX, they can still support modern processors, solid state drives, and high-speed memory. They are commonly used in small form factor builds where compact design is more important than expandability.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Motherboard compatibility.\n\nCPU socket compatibility is an important factor when selecting a motherboard, particularly in desktop computing where performance and functionality requirements vary wildly. At the forefront of the CPU market are Intel and AMD, each offering their distinct lineup of processors tailored to various computing needs. Motherboards are intricately designed to cater to the specific requirements of these processors, whether from Intel or AMD.\n\nTherefore, an Intel CPU cannot be installed in a motherboard intended for an AMD CPU and vice versa. This is primarily due to the different CPU socket types they use. Intel processors typically use an LGA type socket, which is short for land grid array.\n\nIn this configuration, the CPU's underside is devoid of pins featuring instead a flat surface with an array of contact points or pads. This corresponds to the motherboard socket, which contains tiny holes where metal contacts reside. When installed, these contacts align precisely with the pads on the CPU, creating a direct and secure connection.\n\nThis design facilitates easy installation and removal of the CPU, reducing the risk of damage during handling. Conversely, AMD processors commonly utilize PGA or pin grid array sockets. In this configuration, the CPU itself contains a grid of pins that align with corresponding holes on the motherboard socket, creating a grid-like pattern for connection.\n\nWhen the CPU is installed, these pins penetrate into the motherboard's holes, establishing electrical contact with the circuitry beneath. This arrangement ensures a secure and stable connection between the CPU and the motherboard, facilitating efficient communication and data transfer. Transitioning to server environments, multi-socket motherboards become essential to meet the demands of intensive workloads and multitasking.\n\nUnlike single-socket motherboards prevalent in desktop computing, server environments require increased processing power and scalability. Multi-socket motherboards, capable of accommodating multiple CPUs, are engineered to support the installation and operation of two or more processors simultaneously. Whether they are equipped with LGA or PGA sockets, server motherboards are meticulously designed to deliver enhanced processing capabilities and unparalleled reliability, making them indispensable in enterprise settings and data centers.\n\nMobile devices, in stark contrast to their desktop and server counterparts, operate on a distinct architecture, commonly incorporating ARM-based CPUs. These processors are renowned for striking a delicate balance between performance and energy efficiency, making them particularly well-suited for the demands of mobile computing. Engineered to deliver robust processing capabilities while consuming minimal power, ARM-based CPUs are encapsulated within a compact footprint.\n\nThis compactness is paramount in the design of mobile devices, where space constraints and portability are critical considerations. Consequently, ARM-based CPUs have become the cornerstone of mobile computing, enabling devices like smartphones and tablets to deliver optimal performance while prolonging battery life, thereby enhancing the overall user experience. Exam objective 3.5, given a scenario, install and configure motherboards, central processing units, and add-on cards.\n\nCPU architecture. When we talk about CPU architecture, we are talking about the fundamental design of a processor. CPU architecture influences performance, compatibility, power efficiency, and overall system capability.\n\nAt its core, CPU architecture defines how a processor is built and how it executes instructions. One of the most important components of that architecture is the instruction set. An instruction set determines the types of operations a processor can perform.\n\nIn simple terms, it defines the language the processor understands. Within modern computing, two major instruction set families dominate the landscape. These are x86 and x64.\n\nThe terms x86 and x64 refer to processor architectures and instruction sets. Historically, x86 refers to 32-bit processors. The name originates from early 32-bit Intel processors, such as the 8086, 802.86, 803.86, and 804.86, all of which ended in the numbers 86.\n\nBecause of this naming pattern, the shortened term x86 became synonymous with that entire processor family, and over time with 32-bit computing as a whole. x64 represents the 64-bit extension of that architecture. It builds upon the original x86 design, but expands its capabilities significantly. So what does 32-bit versus 64-bit actually mean?\n\nA 32-bit CPU processes data in 32-bit chunks. A 64-bit CPU processes data in 64-bit chunks. That difference affects memory addressing, performance potential, and operating system compatibility.\n\nHere is where the trickle-down effect begins. First, the operating system must match the processor architecture. A 32-bit processor can only run a 32-bit operating system.\n\nA 64-bit processor can run both 64-bit and 32-bit operating systems. The same concept applies to applications. A 32-bit operating system can only run 32-bit applications.\n\nA 64-bit operating system can run 64-bit applications and most 32-bit applications. Now let's talk about memory. A 32-bit processor can only directly address up to four gigabytes of RAM.\n\nThat is a hard architectural limitation. In practice, usable memory is often slightly less due to hardware reservations. A 64-bit processor can address dramatically more memory.\n\nThe theoretical limit is extremely large, far beyond what typical consumer systems require. For modern computing environments, 64-bit architecture removes the memory ceiling that restricted older systems. So when you see x86 on the exam, think 32-bit and a four gigabyte RAM limitation.\n\nWhen you see x64, think 64-bit expanded memory support, modern operating systems, and higher performance potential. Now that we have covered the traditional desktop and server instruction sets, let's shift gears and talk about another major architecture family known as ARM. ARM stands for Advanced Risk Machine.\n\nAs for the acronym RISC in Advanced Risk Machine, that stands for Reduced Instruction Set Computer. Unlike the more complex instruction sets used in x86 and x64 processors, ARM processors are designed around a simplified set of instructions. This simplified design focuses on efficiency.\n\nARM processors are engineered to perform tasks using fewer, highly optimized instructions. The result is lower power consumption and excellent performance per watt. That is why ARM processors dominate the mobile market.\n\nSmartphones, tablets, and many embedded devices rely on ARM processors because battery life is critical. ARM architecture allows these devices to deliver impressive performance while consuming minimal power. So while x86 and x64 dominate traditional desktops and servers, ARM dominates mobile and power sensitive environments.\n\nNow that we understand instruction sets, let's discuss another important architectural concept, core configurations. Before we go further, we need to define what a core actually is. A core is an independent processing unit within a CPU.\n\nIn simple terms, a core is capable of fetching, decoding, and executing instructions on its own. You can think of a core as a complete mini processor built into the larger CPU package. Early processors contained only a single core.\n\nA single core processor has just one processing unit, which means it can execute only one instruction at a time. While it can rapidly switch between tasks, it is still fundamentally handling one instruction at any given moment. As software evolved and operating systems became more advanced, computers were expected to handle multiple tasks simultaneously.\n\nRunning a web browser, streaming music, editing documents, and performing background system updates, all at the same time placed heavy demands on single core processors. This is where the limitations of a single core becomes obvious. Because the processor has to constantly switch between tasks, performance bottlenecks became common.\n\nAs a result, the system would feel sluggish, especially under heavy multitasking. To solve this problem, manufacturers began integrating multiple cores onto a single processor chip. A multi-core processor contains two or more independent cores within the same physical CPU.\n\nEach core can execute its own instruction simultaneously. This enables true parallel processing. For example, in a quad core processor, four cores can handle four separate instructions at the same time.\n\nInstead of rapidly switching between tasks, the workload can be divided and processed concurrently. This dramatically improves multitasking performance and overall system responsiveness. A helpful analogy is to think of a single core processor as one worker handling every job sequentially.\n\nA multi-core processor is like having multiple workers dividing the workload and completing tasks in parallel. Now let's connect this to another modern architectural feature known as virtualization support. Modern CPU architectures frequently incorporate support for virtualization, a technology that enables the simultaneous operation of multiple virtual machines or VM on a single physical CPU.\n\nThis capability is particularly valuable in enterprise environments where there is a need to efficiently utilize hardware resources while maintaining flexibility in deploying and managing IT infrastructure. Virtualization support in CPUs such as Intel's virtualization technology known as VT and AMD's virtualization known as AMD-V play a crucial role in enabling efficient virtualization solutions. These technologies provide hardware level support for virtualization, enhancing the performance and security of virtualized environments.\n\nWith virtualization support, the CPU can efficiently allocate resources to multiple virtual machines ensuring optimal CPU utilization. Exam objective 3.5, given a scenario install and configure motherboards, central processing units and add-on cards. Expansion cards, expansion cards also known as add-on cards are peripheral devices that can be inserted into the expansion slots of a computer's motherboard to enhance its functionality.\n\nThese cards are essential components in modern computing systems, allowing users to customize and upgrade their machines according to their needs. One common type of expansion card is the sound card which is responsible for processing audio signals and producing sound output. By adding a sound card to a computer, users can achieve better audio quality and support for advanced audio features such as surround sound and digital audio processing.\n\nAnother important expansion card is the video card commonly referred to as a graphics card. This card is tasked with rendering graphics and images on the computer's display. Now let me warn you, the commonly used term GPU which stands for graphical processing unit and graphics card are often used interchangeably by those who are not lucky enough to be taking my course but I will make sure you know better.\n\nA GPU and a graphics card actually refer to different aspects of a computing system. To demonstrate, let me strip off the cooling unit and the cover on the graphics card presented here. That's better.\n\nOkay, here is the GPU. It is just a part of the graphics card and only handles the processing. A graphics card is actually much more.\n\nA graphics card has its own circuit board, dedicated memory, the GPU of course, and interface ports. Additionally, you should know that the graphics card's dedicated memory, also known as VRAM, which is short for video, random access memory, is responsible for storing graphical data, ensuring rapid access by the GPU for rendering purposes. The quantity and speed of this VRAM has a significant impact on a system's graphics performance.\n\nHigher VRAM capacity allows for the handling of more complex and detailed graphics, resulting in a smoother visual experience. Next, we have capture cards. These sophisticated expansion cards serve a distinct purpose in the world of computing.\n\nTheir primary function is to capture audio and video signals from a variety of external sources, including cameras, microphones, and gaming consoles for the purpose of real-time recording. This versatility makes them invaluable tools for a diverse range of users, including content creators, gamers, and professionals seeking to create high-quality audio-visual content. Lastly, we have a NIC or network interface card.\n\nThese expansion cards enable computers to connect to a network and acts as a communication link, enabling the transfer of data. The primary function of a NIC is to convert the digital data generated by the computer into electrical signals that can be transmitted as an output. Also, they need to be able to receive data by converting electrical signals back into digital data as an input.\n\nNICs come in various forms, including ethernet cards for wired connections and Wi-Fi cards for wireless connections. By adding a NIC to a computer, users can establish reliable network connectivity and access resources and services available on the network. In summary, expansion cards are essential components in modern computing systems, allowing users to enhance their computer's functionality and performance by adding specialized features.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Cooling.\n\nHeat is a natural byproduct of electronic operations. As such, efficient cooling methods are needed to prevent damage and maintain safe operating temperatures. Within a computing device, you are likely to find one or more of the following cooling methods in use.\n\nFirst up, we have a heat sink. A heat sink is a metal structure that absorbs and disperses heat generated by electronic components, such as CPUs or GPUs. It helps prevent overheating by providing a larger surface area for heat dissipation into the surrounding air through the process of convection.\n\nHeat sinks are a passive cooling device capable of minimal heat dispersion, but they can be combined with cooling fans in order to increase their efficiency. Oftentimes, computing devices output too much heat for a passive heat sink to handle, so a more common cooling method is to utilize fans. Fans are considered active cooling and improve heat dissipation by increasing the airflow across computing components.\n\nThe general logic is more fans will equal more cooling, but there will be a limit to how much heat dissipation can be achieved using this method. If fans come up short and things are getting hotter, there is one more option. You can use liquid cooling.\n\nLiquid cooling offers superior cooling, but comes with a higher price tag. This type of cooling would be best suited for high-end servers or gaming PCs. In a computing device, liquid cooling involves actively circulating a liquid, typically water or a coolant, through a closed loop system.\n\nThis method provides the best cooling because liquids are more efficient than air convection at dispersing heat. In summation, heat sinks are good, fans are better, and liquid is best, unless cost is an issue. One more trick up our sleeves when it comes to heat dissipation is thermal paste.\n\nThermal paste is a specialized substance designed to facilitate the transfer of heat between electronic components, such as the CPU and its attached heat sink. Its primary function is to bridge the microscopic gaps and imperfections that naturally exist between the mating surfaces of the CPU and the heat sink. By filling in these irregularities, thermal paste effectively eliminates air voids, ensuring intimate contact between the two surfaces.\n\nOnce the thermal paste is applied, just know it won't last forever. Regular maintenance, including periodic replacement of thermal paste, will be required to maintain an effective heat transfer over time. With that said, let's take a look at how to install a CPU properly and then replace the thermal paste once it gets old.\n\nFirst, we need to install the CPU in its socket. Then we apply the thermal paste. Not too much.\n\nAfter that, it is time to attach the CPU heat sink. Now, over time, the thermal paste will dry out. When that happens, detach the heat sink and remove the old thermal paste.\n\nThen apply fresh thermal paste. Again, not too much. Reattach the CPU heat sink and you're done.\n\nNow, in the event that any of these cooling components fail to perform effectively, the system will be at risk of overheating. When a computer overheats, several detrimental effects can occur, potentially leading to system instability, performance degradation, and hardware damage. Initially, as temperatures rise beyond safe operating limits, the system may throttle down its performance to reduce heat generation, resulting in decreased processing power and slower operation.\n\nContinual overheating can cause components such as the CPU, GPU, and motherboard to degrade over time, shortening their lifespan and increasing the likelihood of premature failure. In severe cases, prolonged exposure to high temperatures can lead to thermal runaway, where components reach temperatures beyond their design limits, causing malfunctions, system crashes, and even permanent damage. Luckily, most computing devices have built-in safety mechanisms such as automatic shutdowns to prevent catastrophic failures, though this may still lead to interrupted workflows and data loss.\n\nOverall, computer overheating poses significant risks to system reliability, performance, and longevity, highlighting the importance of effective cooling solutions and proactive temperature monitoring and management.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. Encryption, understanding the distinction between plain text and ciphertext is the very first step when venturing into the expansive realm of encryption and its study, termed cryptography.\n\nSo let's take that first step and begin with a quick look into plain text. Picture yourself jotting down a message to a friend. This message, in its original readable form, is what we call plain text.\n\nIn the realm of IT, plain text is any data or text that has not yet undergone encryption, making it readable by both humans and computers. But here's where the plot thickens. When we aim to safeguard our data or message, especially in the digital domain, we resort to encryption.\n\nThis encrypted form of our plain text is what we refer to as ciphertext. Think of ciphertext as a coded message. To the untrained eye, it appears as mere gibberish.\n\nNow, please allow me to reiterate and further define this concept. Plain text is data presented in a format that is immediately understandable and accessible. It's in its most basic, unaltered state, free from any form of encryption or coding.\n\nThis means that there are no protective layers or barriers concealing its content. As for ciphertext, it stands in stark contrast to plain text. It is the result of taking understandable, clear data and transforming it into a format that appears random and nonsensical at first glance.\n\nThis transformation is achieved through a process called encryption, which employs an encryption key, combined with a specific mathematical algorithm in order to jumble the original data. These algorithms rearrange the data in such a way that its original meaning becomes obscured. The primary purpose of this scrambling is to protect the data's integrity and confidentiality.\n\nWithout the correct decryption key or method, which acts as a sort of digital password or blueprint to reverse the encryption, the ciphertext remains a puzzling array of characters, numbers, and symbols. Only those possessing the right key can revert the ciphertext back to its original plain text form. And that brings us to our next topic, the trusted platform module.\n\nA trusted platform module, or TPM for short, is a specialized microchip designed to provide hardware-based security functions. It serves as a secure repository for cryptographic keys, passwords, and pens. In simpler terms, think of TPM as a small, secure vault inside your computer that stores important secrets, ensuring they can't be easily accessed or tampered with by unauthorized users or malicious software.\n\nThe TPM works in conjunction with the motherboard by being integrated directly onto it or connected via a dedicated header. When the computer boots up, the TPM initializes and performs security functions such as generating and storing encryption keys, verifying the integrity of the boot process, and providing secure storage for sensitive data. It works closely with the computer's firmware and operating system to ensure that only authorized users and software can access critical resources and protects against various forms of attacks, including unauthorized access, tampering, and data theft.\n\nOne crucial function of a TPM is its ability to store keys for hard drive encryption. When you encrypt your hard drive using technologies like BitLocker on Windows or FileVault on Mac OS, the encryption keys are generated and securely stored within the TPM. These keys are used to encrypt and decrypt data on the hard drive, ensuring that even if someone were to physically access your hard drive, they wouldn't be able to read its contents without the proper decryption key stored in the TPM.\n\nThis brings me to one essential fact you should know as a budding IT professional. The TPM is paired to the motherboard. Therefore, removing or replacing the motherboard can potentially lead to complications.\n\nSince the TPM is a hardware-based security measure tied to the specific hardware configuration of your computer, changing the motherboard could result in the loss of access to the encrypted data stored on the hard drive. Additionally, the TPM establishes a unique relationship with the specific motherboard it's installed on. If you were to replace the motherboard without properly handling the TPM, this too would result in the loss of access to the cryptographic keys stored within the TPM.\n\nAs a result, you might not be able to decrypt your hard drive and access your data, leading to data loss. Therefore, it's important to take precautions when dealing with systems equipped with a TPM. Before making any changes to the hardware, it's advisable to back up any important data, and if necessary, properly migrate or deactivate the TPM to avoid any potential issues with data access and cryptographic keys.\n\nNow, a TPM may excel at bolstering the security of individual devices, but will likely fall short when it comes to meeting the demands of enterprise-level security. In such scenarios, a hardware security module, or HSM for short, is often preferred as an alternative to TPMs. HSM's offer robust security for cryptographic operations and key management, making them ideal for environments requiring high levels of protection and scalability.\n\nUnlike TPMs, which are typically integrated into individual devices, HSM's are standalone units providing centralized management and control over cryptographic keys and operations. This feature makes them well-suited for large-scale deployments and stringent security requirements.\n\nExam objective 3.5. Given a scenario, install and configure motherboards, central processing units, and add-on cards. BIOS and UEFI.\n\nBefore we talk about specific BIOS and UEFI settings, we need to clearly understand the term firmware. Firmware is a type of low-level software that is embedded into electronic devices to control their operation. For most computing systems, this low-level software is stored on a chip on the motherboard and acts as the bridge between the system's hardware and the operating system.\n\nUnlike applications that load after the operating system starts, firmware runs first. It initializes hardware components, verifies that they are functioning, and prepares the system to load the operating system. Without firmware, the system would not know how to communicate with the CPU, RAM, storage devices, or input and output components during startup.\n\nTraditionally, this firmware was called the BIOS. BIOS stands for Basic Input Output System. BIOS has been used in personal computers for decades.\n\nWhen you power on a computer, the BIOS performs a power-on self-test or a POST. During this power-on self-test, the system checks critical hardware components, such as the CPU, RAM, storage drives, and video system. If something is wrong, you may hear beep codes or see error messages before the operating system loads.\n\nAfter the POST completes successfully, the BIOS searches for a bootable device based on the configured boot order. It then loads the operating system into memory and hands-off control. However, traditional BIOS had limitations.\n\nIt used older partition schemes, supported smaller drive sizes, and relied on a simple text-based interface. To overcome these limitations, UEFI was introduced. UEFI stands for Unified Extensible Firmware Interface.\n\nUEFI performs the same fundamental tasks as BIOS, but with modern enhanced capabilities. UEFI supports much larger storage drives through the use of GPT partitioning. It boots faster because it initializes hardware more efficiently.\n\nIt also includes a graphical user interface, or GUI, that allows mouse support. Most importantly, it introduces advanced security features, such as Secure Boot. Now that we understand what BIOS and UEFI are, and what firmware does, let's talk about how to access and configure their settings.\n\nIn order to access the BIOS or UEFI settings on your computer, you'll need to follow a few simple steps. Begin by restarting your device. During the startup process, keep an eye out for a message or logo that indicates which key to press to enter the setup utility.\n\nCommon keys include DELETE, F1, F2, F10, or ESCAPE, but the specific key may vary depending on your computer's manufacturer. Once you've identified the correct key, press it repeatedly as soon as you see the message or logo appear on the screen. Timing is important here, so be ready to press the key immediately upon startup.\n\nIf successful, you'll be taken to the BIOS or UEFI setup utility. From the setup utility, you will find a range of options for configuring your computer's hardware and firmware settings. So, are you interested in covering a few common scenarios with me?\n\nWell, all right then. Scenario one. Imagine you are installing a new operating system from a USB drive.\n\nYou insert the USB device, restart the computer, and nothing happens. The system continues loading the existing operating system from the internal drive. In this situation, you would enter the BIOS or UEFI setup utility and navigate to the boot order settings.\n\nBoot order determines the exact sequence in which the system checks devices for a bootable operating system. If the internal drive is listed first, the system will load from it before ever checking the USB device. To resolve the issue, you would move the USB drive higher in the boot priority list, so it is checked before the internal storage device.\n\nBoot order is one of the most frequently configured firmware settings in real-world scenarios, especially during operating system installation, recovery procedures, or troubleshooting startup problems. Scenario two. Suppose you're concerned about the security of your data and decide to enable drive encryption using technologies like Windows BitLocker.\n\nHowever, you encounter an issue where the drive encryption process is not proceeding smoothly. Suspecting that the Trusted Platform Module, or TPM, may not be enabled, you access the BIOS setup utility to investigate. Within the security settings, you locate the option to enable the TPM, which is a hardware-based security feature that enhances data protection.\n\nWith the TPM now enabled, the drive encryption proceeds seamlessly, providing an additional layer of security for your sensitive data. Okay, one more scenario before moving on, and this time I will use the UEFI interface in my example. Imagine you want to set up a virtual lab environment to test different operating systems and software configurations.\n\nTo accomplish this, you plan to use virtualization software. However, when attempting to create virtual machines, you encounter errors indicating that virtualization support is not enabled. Suspecting that virtualization support may be disabled in the UEFI settings, you access the setup utility to investigate.\n\nWithin the UEFI interface, you would look for options such as Intel Virtualization Technology, or AMD-V, which enables virtualization support. After ensuring that virtualization support is enabled, you restart your computer. Now, with virtualization enabled, you can create and run virtual machines smoothly, facilitating your experimentation and testing processes.\n\nIn each of the scenarios described, accessing the BIOS or UEFI setup utility played a pivotal role in resolving hardware related issues and optimizing system performance. BIOS and UEFI provides users with direct control over essential hardware configurations, allowing them to adjust settings such as memory allocation, storage detection, security features, and virtualization support. By navigating through the BIOS or UEFI interface, users can fine tune their computer's hardware settings to suit their needs, ensuring optimal performance and compatibility with various software configurations.\n\nBeyond hardware configuration, BIOS and UEFI also manage peripheral control, including USB devices. Within the BIOS or UEFI settings, users can configure USB permissions to control access to connected devices. This feature is particularly useful for enhancing security by preventing unauthorized access or malicious activities through USB ports.\n\nBy adjusting USB permissions, users can mitigate potential security risks and safeguard their system against external threats. In addition to controlling hardware configurations and managing connected devices, BIOS and UEFI also provide important access control mechanisms at the firmware level. These controls determine who is allowed to modify system settings and who is allowed to start the computer in the first place.\n\nNow let's discuss two important security settings that are often confused, iOS password and boot password. A BIOS password, sometimes called a setup password or supervisory password, protects access to the BIOS or UEFI setup utility. If this password is set, a user must enter it before they can view or modify firmware settings.\n\nThis prevents unauthorized changes to critical system configurations, such as boot order, TPM settings, secure boot or hardware enablement options. In simple terms, a BIOS password protects the firmware settings. On the other hand, a boot password, sometimes called a power on password, serves a different purpose.\n\nA boot password is required immediately when the system powers on. The operating system will not begin loading until the correct password is entered. This restricts access to the entire system at startup.\n\nIn simple terms, a boot password protects operating system access. To summarize, a BIOS password controls access to firmware configuration settings. A boot password controls access to the operating system.\n\nUnderstanding this difference is important because exam questions often test whether you know which layer of protection is being requested. Now let's move into temperature monitoring and fan considerations. Modern BIOS and UEFI interfaces provide built-in hardware monitoring tools that allow you to view real-time temperature readings for critical components, such as the CPU and motherboard.\n\nMonitoring these values is essential because excessive heat can lead to system instability, automatic shutdowns, reduced performance due to throttling, and long-term hardware damage. If a computer powers off unexpectedly during heavy workloads, becomes unusually loud, or feels excessively hot, checking temperature readings within the BIOS or UEFI setup utility is a logical troubleshooting step. One important advantage of firmware-level temperature monitoring is that it occurs before the operating system loads.\n\nThis allows you to determine whether overheating is a hardware issue rather than a software problem. If temperatures are already elevated while sitting in the firmware interface, the issue is likely related to cooling hardware, airflow, or improper installation of components. In addition to monitoring temperatures, BIOS and UEFI settings allow you to configure how system fans respond to rising heat levels.\n\nMany systems provide adjustable fan profiles or customizable fan curves. A fan curve defines how aggressively the cooling fans increase speed as temperature rises. For example, a quiet profile may allow fans to spin slowly until higher temperature thresholds are reached, while a performance profile increases fan speed more aggressively to maintain lower operating temperatures.\n\nProper fan configuration plays a critical role in maintaining system stability and protecting hardware. After installing a new CPU, replacing a heat sink, applying new thermal paste, or building a custom system, verifying temperature readings and fan operation within the firmware settings is an important final step. For exam purposes, if a scenario mentions overheating, unexpected shutdowns under load, loud fan behavior, or thermal warnings, temperature monitoring, and fan configuration within BIOS or UEFI should immediately come to mind.", "uyghur": "Exam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، مەركىزىي بىر تەرەپ قىلغۇچ (CPU) ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## ئانا تاختا ئۇلىغۇچ تۈرلىرى (Motherboard Connector Types)\n\nئانا تاختا كومپيۇتېردىكى نۇرغۇن زاپچاسلارنى ئۆزئارا باغلايدىغان ئاساسىي circuit board. Objective 3.5 نىڭ بۇ بۆلىكى motherboard ئۈستىدىكى كۆپ ئۇچرايدىغان connector، slot ۋە header لارنى قاپلايدۇ.\n\n### PCI — Peripheral Component Interconnect\n\n**PCI (Peripheral Component Interconnect)** — كونا motherboard لاردا كۆپ ئۇچرايدىغان standard expansion slot.\n\nPCI slot ئارقىلىق قوشقىلى بولىدىغان expansion card مىساللىرى:\n- sound card\n- network adapter\n- graphics card\n\nمەنبە PCI نىڭ زامانىۋى motherboard لاردا ئازىيىپ، كۆپىنچە:\n- legacy system\n- ئالاھىدە كونا hardware environment\n\nدا ئۇچرايدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### PCIe — PCI Express\n\n**PCIe / PCI Express** — زامانىۋى motherboard لاردا PCI نىڭ ئورنىنى ئالغان ئاساسلىق expansion interface.\n\nمەنبە PCIe نىڭ:\n- PCI دىن يۇقىرى bandwidth\n- تېزرەك data transfer\n- scalability\n- versatility\n\nتەمىنلەيدىغانلىقىنى چۈشەندۈرىدۇ.\n\nئىشلىتىش مىساللىرى:\n- gaming\n- multimedia editing\n- high-performance expansion card\n\n### PCIe Lane / Slot Sizes\n\nمەنبە slot configuration لارنى:\n- **x1**\n- **x4**\n- **x8**\n- **x16**\n\nدەپ قاپلايدۇ.\n\n**Transcript normalization:** narration `by one, by four, by eight, by 16` دەپ ئاڭلانغان؛ reviewed Uyghur exam-standard notation **x1 / x4 / x8 / x16** نى ئىشلىتىدۇ.\n\nھەر بىر designation:\n- data transfer ئۈچۈن تەقسىملەنگەن lane سانىغا مۇناسىۋەتلىك\n\n**ئەستە تۇتۇڭ: PCIe x1/x4/x8/x16 = lane count**\n\n---\n\n## Motherboard Power Connectors\n\nمەنبە ئۈچ power connector تۈرىنى قاپلايدۇ:\n\n### 20-pin\n- older motherboard لاردا standard بولغان\n\n### 24-pin\n- 20-pin نىڭ ئورنىنى كۆپىنچە ئالغان\n- modern component لارنىڭ يۇقىرىراق power requirement ىنى قوللايدۇ\n\n### 20+4-pin\n- 20-pin ۋە 24-pin motherboard بىلەن compatibility تەمىنلەش ئۈچۈن flexible design\n\n**ئەستە تۇتۇڭ:**\n> **20-pin = Older**\n>\n> **24-pin = Modern**\n>\n> **20+4-pin = Flexible compatibility**\n\n---\n\n## Storage Connectors on Motherboard\n\n### SATA\n\n**SATA — Serial Advanced Technology Attachment**\n\nMotherboard دىكى SATA connector:\n- HDD\n- SSD\n\nغا ئوخشاش internal storage device نى ئۇلاشقا ئىشلىتىلىدۇ.\n\n### eSATA\n\n**eSATA — External Serial Advanced Technology Attachment**\n\nمەنبە eSATA نى:\n- external SATA connector/port\n- external hard drive نى motherboard قا ئۇلاش\n\nبىلەن باغلايدۇ.\n\nمەنبە ئۇنى earlier USB connection لارغا قارىغاندا تېزرەك external-storage choice دەپ چۈشەندۈرىدۇ.\n\n### M.2\n\n**M.2**\n- compact connector / slot\n- SSD نى motherboard قا بىۋاسىتە ئورنىتىشقا يول قويىدۇ\n- cable نى ئازايتىدۇ\n- low-profile / compact build غا ماس\n\n**ئەستە تۇتۇڭ: M.2 = Compact SSD connection directly on motherboard**\n\n---\n\n## Motherboard Headers\n\n**Header** — motherboard ئۈستىدىكى internal connector بولۇپ، computer case ئىچىدىكى component ياكى front/top panel feature لارنى motherboard قا باغلايدۇ.\n\n### USB Headers\nCase نىڭ:\n- front USB\n- top USB\n\nport لارنى motherboard قا ئۇلايدۇ.\n\n### Audio Headers\nCase نىڭ front/top:\n- headphone\n- microphone\n- audio jack\n\nلارنى motherboard audio system غا باغلايدۇ.\n\n### Front-Panel Headers\nتۆۋەندىكىلەرنى ئۇلايدۇ:\n- power button\n- reset button\n- LED indicator\n\n### Fan Headers\nتۆۋەندىكى cooling component لارنى motherboard قا ئۇلايدۇ:\n- case fan\n- CPU fan\n- باشقا cooling fan\n\nمەنبە fan header لارنىڭ temperature sensor ئۇچۇرىغا ئاساسەن fan speed نى باشقۇرۇشقا ياردەم بېرىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Motherboard Connector Memory Map\n\n- **PCI** = Legacy expansion\n- **PCIe** = Modern expansion\n- **20/24/20+4 pin** = Motherboard power\n- **SATA** = Internal storage\n- **eSATA** = External SATA storage\n- **M.2** = Direct compact SSD\n- **USB header** = Case USB\n- **Audio header** = Case audio\n- **Front-panel header** = Power/reset/LED\n- **Fan header** = Cooling fan\n\n---\n\nExam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، CPU ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## ئانا تاختا شەكىل ئۆلچىمى (Motherboard Form Factors)\n\n**Motherboard form factor** ئانا تاختىنىڭ:\n- physical dimensions\n- mounting points\n- power connections\n- overall layout\n\nنى بەلگىلەيدۇ.\n\nمەنبە desktop ئۈچۈن ئۈچ common form factor نى قاپلايدۇ:\n1. ATX\n2. Micro ATX\n3. ITX\n\n### ATX — Advanced Technology Extended\n\n**ATX**\n- desktop motherboard لارنىڭ كەڭ ئىشلىتىلىدىغان standard ى\n- physical size چوڭراق\n- component/connector ئۈچۈن كۆپرەك بوشلۇق\n\nمەنبە بويىچە ATX ئادەتتە:\n- multiple PCIe expansion slot\n- **4 ياكى تېخىمۇ كۆپ DIMM slot**\n- multiple SATA port\n- كۆپ USB/fan/front-panel header\n\nتەمىنلەيدۇ.\n\nCase:\n- full tower\n- mid tower\n\nغا ماس.\n\n**ئەستە تۇتۇڭ: ATX = Larger + More expansion**\n\n### Micro ATX\n\n**Micro ATX**\n- ATX نىڭ كىچىكرەك شەكلى\n- نۇرغۇن ئوخشاش feature نى ساقلايدۇ\n- expansion slot سانى ATX دىن ئازراق\n\nمەنبە:\n- ئادەتتە **2–4 DIMM slot**\n- fewer PCIe expansion slot\n\nدەپ چۈشەندۈرىدۇ.\n\nئىشلىتىش:\n- mid-sized system\n- space-saving، ئەمما reasonable upgrade potential\n\n**ئەستە تۇتۇڭ: Micro ATX = Balance of size + expandability**\n\n### ITX\n\nمەنبە ITX نى:\n- compact system\n- space minimization\n\nبىلەن باغلايدۇ.\n\nSource-stated typical layout:\n- **1 PCIe expansion slot**\n- كۆپىنچە **2 DIMM slot**\n\nئەمما يەنىلا:\n- modern CPU\n- SSD\n- high-speed memory\n\nنى قوللىيالايدۇ.\n\nئىشلىتىش:\n- small-form-factor build\n\n**Source wording note:** transcript `ITX is short for information technology extended` دەپ چۈشەندۈرىدۇ. Reviewed lesson بۇ expansion نى source wording سۈپىتىدەلا ساقلايدۇ؛ سىرتقى مەنبە بىلەن canonical etymology verify قىلىنمايدۇ.\n\n### Form Factor Comparison\n\n| Form factor | Source emphasis |\n|---|---|\n| **ATX** | چوڭ، expansion كۆپ |\n| **Micro ATX** | كىچىكرەك، feature/expandability نىڭ ئوتتۇرا تەڭپۇڭلۇقى |\n| **ITX** | compact، expansion چەكلىك |\n\n---\n\nExam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، CPU ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## ئانا تاختا ماسلىشىشچانلىقى (Motherboard Compatibility)\n\n### CPU Socket Compatibility\n\nMotherboard تاللىغاندا CPU socket compatibility مۇھىم.\n\nمەنبە desktop CPU market نى:\n- Intel\n- AMD\n\nدەپ ئىككى ئاساسلىق vendor ئارقىلىق چۈشەندۈرىدۇ ۋە motherboard CPU socket نىڭ processor بىلەن ماس بولۇشى كېرەكلىكىنى تەكىتلەيدۇ.\n\nSource teaching point:\n> **Intel CPU نى AMD CPU ئۈچۈن لايىھەلەنگەن socket قا ياكى ئەكسىچە ئورنىتىشقا بولمايدۇ.**\n\nبۇنىڭ ئاساسلىق سەۋەبى:\n- socket design پەرقى\n\n### LGA — Land Grid Array\n\nمەنبە Intel processor لارنى كۆپىنچە:\n\n**LGA — Land Grid Array**\n\nsocket بىلەن باغلايدۇ.\n\nSource model:\n- CPU underside دا contact pad لار بار\n- motherboard socket دىكى contact لار CPU pad لار بىلەن align بولىدۇ\n\nبۇ:\n- secure electrical connection\n- installation/removal\n\nنى قوللايدۇ.\n\n### PGA — Pin Grid Array\n\nمەنبە AMD processor لارنى كۆپىنچە:\n\n**PGA — Pin Grid Array**\n\nبىلەن باغلايدۇ.\n\nSource model:\n- CPU ئۆزىدە pin grid بار\n- pin لار motherboard socket دىكى hole لارغا align بولىدۇ\n\n### Source-time caution\n\nبۇ Intel=LGA / AMD=PGA سېلىشتۇرمىسى **transcript نىڭ ئۆز teaching model ى**. Reviewed Uyghur بۇنى current CPU socket market نىڭ ھەممە ئەھۋالىغا ماس كېلىدىغان مەڭگۈلۈك rule دەپ كېڭەيتمەيدۇ.\n\n**Exam memory:**\n- **LGA** = CPU contact pads / socket contacts\n- **PGA** = CPU pins / socket holes\n\n---\n\n## Multi-Socket Motherboards\n\nServer environment دا:\n- higher processing power\n- scalability\n- intensive workload\n- multitasking\n\nكېرەك بولغاندا **multi-socket motherboard** ئىشلىتىلىشى مۇمكىن.\n\nمەنبە:\n- 2 ياكى تېخىمۇ كۆپ CPU نى بىرلا motherboard دا ئىشلىتىش\n\nدەپ چۈشەندۈرىدۇ.\n\nئىشلىتىش:\n- enterprise\n- data center\n- server\n\n---\n\n## Mobile / ARM-Based CPU\n\nمەنبە mobile device لارنى:\n- ARM-based CPU\n\nبىلەن باغلايدۇ.\n\nSource-stated strengths:\n- performance + energy efficiency balance\n- low power consumption\n- compact footprint\n- battery life\n\nمىسال:\n- smartphone\n- tablet\n\n**ئەستە تۇتۇڭ: ARM source focus = Mobile + Power efficiency**\n\n---\n\nExam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، CPU ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## CPU Architecture\n\n**CPU architecture** — processor نىڭ fundamental design ى ۋە instruction لارنى قانداق execute قىلىدىغانلىقى.\n\nArchitecture:\n- performance\n- compatibility\n- power efficiency\n- system capability\n\nغا تەسىر قىلىدۇ.\n\n---\n\n## Instruction Set\n\n**Instruction set**\n- CPU ئورۇندىيالايدىغان operation لارنى بەلگىلەيدۇ\n- ئاددىي قىلىپ، CPU چۈشىنىدىغان «language»\n\nمەنبە ئۈچ مۇھىم architecture/instruction-set family نى چۈشەندۈرىدۇ:\n- x86\n- x64\n- ARM\n\n---\n\n## x86 vs x64\n\n### x86\n\nمەنبە exam teaching rule سۈپىتىدە:\n\n> **x86 = 32-bit**\n\nدەپ چۈشەندۈرىدۇ.\n\n### x64\n\n**x64**\n- x86 architecture نىڭ 64-bit extension ى\n- 64-bit processing ۋە expanded memory support بىلەن باغلىنىدۇ\n\n### 32-bit vs 64-bit\n\nSource model:\n- 32-bit CPU → 32-bit chunks\n- 64-bit CPU → 64-bit chunks\n\nبۇ:\n- memory addressing\n- performance potential\n- OS compatibility\n\nغا تەسىر قىلىدۇ.\n\n### OS / Application Compatibility — Source Model\n\nمەنبە بويىچە:\n- 32-bit CPU → 32-bit OS\n- 64-bit CPU → 64-bit ۋە 32-bit OS\n- 32-bit OS → 32-bit application\n- 64-bit OS → 64-bit ۋە كۆپىنچە 32-bit application\n\n### RAM Addressing\n\nمەنبەنىڭ exam takeaway ى:\n- **32-bit → up to 4 GB RAM directly addressable**\n- usable memory hardware reservation سەۋەبىدىن ئازراق تۆۋەن بولۇشى مۇمكىن\n- **64-bit → ناھايىتى كۆپ memory address space**\n\n**Exam memory:**\n> **x86 = 32-bit / 4 GB source teaching limit**\n>\n> **x64 = 64-bit / expanded memory support**\n\n### x86 Historical Wording — Source Caution\n\nTranscript x86 نامىنىڭ تارىخىنى 8086/80286/80386/80486 family بىلەن باغلايدۇ، ئەمما شۇ paragraph دا ئۇلارنى بىرلىكتە `early 32-bit processors` دەپ سۈپەتلەيدۇ.\n\nReviewed Uyghur بۇ تارىخىي characterization نى **external fact دەپ ئۆستۈرمەيدۇ**. Study text تا پەقەت source نىڭ exam takeaway ى:\n- x86 → 32-bit\n- x64 → 64-bit\n\nساقلىنىدۇ.\n\n---\n\n## ARM — Advanced RISC Machine\n\n**ARM — Advanced RISC Machine**\n\n**RISC — Reduced Instruction Set Computer**\n\n**Transcript correction:** source `ARM stands for Advanced Risk Machine` ۋە `RISC in Advanced Risk Machine` دەپ خاتا transcript قىلىنغان. Reviewed Uyghur دا context بىلەن ماس canonical term:\n- **Advanced RISC Machine**\n- **Reduced Instruction Set Computer**\n\nئىشلىتىلدى.\n\nSource model:\n- x86/x64 → more complex instruction sets\n- ARM → simplified instruction set\n- fewer highly optimized instructions\n- lower power consumption\n- strong performance per watt\n\nئىشلىتىش:\n- smartphone\n- tablet\n- embedded device\n- power-sensitive environment\n\n**ئەستە تۇتۇڭ: ARM = RISC + Efficiency + Mobile/Power-sensitive**\n\n---\n\n## CPU Cores\n\n**Core** — CPU ئىچىدىكى independent processing unit.\n\nمەنبە بويىچە بىر core:\n- fetch\n- decode\n- execute\n\ninstruction لارنى ئۆزى ئورۇندىيالايدۇ.\n\n### Single-Core\n\nSource teaching model:\n- 1 processing unit\n- tasks ئارىسىدا تېز switch قىلالايدۇ\n- heavy multitasking دا bottleneck بولۇشى مۇمكىن\n\n### Multi-Core\n\n**Multi-core CPU**\n- 2 ياكى تېخىمۇ كۆپ independent core\n- workload نى parallel بۆلۈش\n- multitasking ۋە responsiveness نى ياخشىلاش\n\nمەنبە quad-core مىسالىدا:\n- 4 core → 4 separate instruction نى parallel بىر تەرەپ قىلىش\n\nدەپ چۈشەندۈرىدۇ.\n\n**Source-scope note:** بۇ بىر exam-oriented simplified model؛ reviewed lesson سىرتقى instruction-pipeline/threading nuance قوشمايدۇ.\n\n**ئەستە تۇتۇڭ: More cores = More parallel processing paths**\n\n---\n\n## CPU Virtualization Support\n\n**Virtualization**\n- بىر physical CPU/System ئۈستىدە multiple virtual machine (VM) ئىشلىتىش ئىمكانى\n\nمەنبە ئىككى hardware virtualization technology نى تىلغا ئالىدۇ:\n- **Intel VT**\n- **AMD-V**\n\nبۇلار:\n- hardware-level virtualization support\n- performance\n- security\n- resource allocation\n\nنى ياخشىلاشقا ياردەم بېرىدۇ.\n\nEnterprise use:\n- hardware resource نى ئۈنۈملۈك ئىشلىتىش\n- multiple VM باشقۇرۇش\n\n---\n\nExam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، CPU ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## قوشۇمچە كارتىلار (Expansion / Add-On Cards)\n\n**Expansion card / add-on card**\n- motherboard expansion slot قا ئورنىتىلىپ\n- computer غا قوشۇمچە functionality قوشىدىغان peripheral card\n\nمەنبە تۆت ئاساسىي card تۈرىنى قاپلايدۇ:\n1. Sound card\n2. Graphics/video card\n3. Capture card\n4. NIC\n\n---\n\n### Sound Card\n\n**Sound card**\n- audio signal processing\n- sound output\n\nئۈچۈن.\n\nمەنبە قوشۇمچە sound card نىڭ:\n- better audio quality\n- surround sound\n- digital audio processing\n\nنى قوللىيالايدىغانلىقىنى چۈشەندۈرىدۇ.\n\n---\n\n### Graphics Card vs GPU\n\n**Graphics card**\n- complete add-on card\n\nئۆز ئىچىگە ئالىدۇ:\n- circuit board\n- dedicated memory / VRAM\n- GPU\n- interface ports\n\n### GPU — Graphics Processing Unit\n\n**GPU — Graphics Processing Unit**\n- graphics card ئىچىدىكى processing component\n- graphics/rendering calculation نى بىر تەرەپ قىلىدۇ\n\n**Transcript correction:** source `graphical processing unit` دەپ ئاڭلانغان؛ reviewed Uyghur canonical **Graphics Processing Unit** نى ئىشلىتىدۇ.\n\n**ئەستە تۇتۇڭ:**\n> **GPU = Processing chip/component**\n>\n> **Graphics card = GPU + board + VRAM + ports + other components**\n\n### VRAM — Video Random Access Memory\n\n**VRAM**\n- graphics card نىڭ dedicated memory ى\n- graphical data نى GPU تېز زىيارەت قىلالايدىغان شەكىلدە ساقلايدۇ\n\nمەنبە:\n- VRAM capacity\n- VRAM speed\n\ngraphics performance غا تەسىر قىلىدىغانلىقىنى چۈشەندۈرىدۇ.\n\nHigher VRAM capacity:\n- more complex/detailed graphics\n- smoother visual experience\n\nبىلەن باغلىنىدۇ.\n\n---\n\n### Capture Card\n\n**Capture card**\n- external source دىن audio/video signal قوبۇل قىلىپ\n- real-time recording ئۈچۈن capture قىلىدۇ\n\nSource examples:\n- camera\n- microphone\n- gaming console\n\nئىشلىتىش:\n- content creator\n- gamer\n- professional audio/video content\n\n---\n\n### NIC — Network Interface Card\n\n**NIC**\n- computer نى network قا ئۇلايدۇ\n- data communication link رولىنى ئوينايدۇ\n\nمەنبەنىڭ ئاددىي model ى:\n- outgoing digital data → transmissible signal\n- incoming signal → digital data\n\nNIC form:\n- Ethernet card → wired\n- Wi-Fi card → wireless\n\n**Source-scope note:** بۇ بۆلەك signal conversion نى ئاددىي قىلىپ چۈشەندۈرىدۇ؛ reviewed lesson optical/wireless PHY detail قوشمايدۇ.\n\n---\n\nExam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، CPU ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## سوۋۇتۇش (Cooling)\n\nElectronic component ئىشلىگەندە heat ھاسىل بولىدۇ.\n\nCooling نىڭ مەقسىتى:\n- overheating نىڭ ئالدىنى ئېلىش\n- safe operating temperature ساقلاش\n- performance/reliability/longevity نى قوغداش\n\nمەنبە تۆۋەندىكى cooling method لارنى قاپلايدۇ:\n- heat sink\n- fan\n- liquid cooling\n- thermal paste\n\n---\n\n## Heat Sink\n\n**Heat sink**\n- metal structure\n- CPU/GPU دىن heat نى absorb ۋە disperse قىلىدۇ\n- surface area نى چوڭايتىپ air convection ئارقىلىق heat dissipation قىلىدۇ\n\nمەنبە heat sink نى:\n- **passive cooling**\n\nدەپ قارايدۇ.\n\nئۇنى fan بىلەن بىرلەشتۈرگەندە:\n- cooling efficiency ياخشىلىنىدۇ\n\n---\n\n## Fans\n\n**Fan**\n- active cooling\n- component ئەتراپىدىكى airflow نى ئاشۇرىدۇ\n- heat dissipation نى ياخشىلايدۇ\n\nمەنبە general logic سۈپىتىدە:\n- more fans → more cooling\n- ئەمما air cooling نىڭ practical limit ى بار\n\nدەپ چۈشەندۈرىدۇ.\n\n---\n\n## Liquid Cooling\n\n**Liquid cooling**\n- liquid، ئادەتتە water ياكى coolant\n- closed-loop system ئىچىدە circulate قىلىنىدۇ\n\nمەنبە ئۇنى:\n- air cooling دىن تېخىمۇ كۈچلۈك cooling\n- higher price\n\nبىلەن باغلايدۇ.\n\nمىسال:\n- high-end server\n- gaming PC\n\n**Source framing:** transcript `heat sinks are good, fans are better, liquid is best, unless cost is an issue` دەپ ئاددىي hierarchy بېرىدۇ. Reviewed lesson بۇنى source framing سۈپىتىدەلا ساقلايدۇ؛ universally-best cooling rule دەپ كېڭەيتمەيدۇ.\n\n---\n\n## Thermal Paste\n\n**Thermal paste**\n- CPU بىلەن heat sink ئارىسىدىكى heat transfer نى ياخشىلايدىغان material\n\nئۇ:\n- microscopic gap / imperfection نى تولدۇرىدۇ\n- air void نى ئازايتىدۇ\n- CPU بىلەن heat sink ئارىسىدىكى thermal contact نى ياخشىلايدۇ\n\n### Source Installation Sequence\n\n1. CPU نى socket قا ئورنىتىڭ\n2. Thermal paste سۈرۈڭ — **too much ئەمەس**\n3. CPU heat sink نى ئورنىتىڭ\n\n### Source Maintenance Sequence\n\nمەنبە thermal paste ۋاقىت ئۆتۈشى بىلەن قۇرۇپ قالىدۇ ۋە periodic replacement تەلەپ قىلىشى مۇمكىن دەپ چۈشەندۈرىدۇ:\n\n1. Heat sink نى ئېلىڭ\n2. Old thermal paste نى تازىلاڭ\n3. Fresh thermal paste سۈرۈڭ — **too much ئەمەس**\n4. Heat sink نى قايتا ئورنىتىڭ\n\n**Source-boundary note:** reviewed lesson بۇ maintenance interval نى سىرتقى schedule ياكى universal replacement rule بىلەن تولدۇرمايدۇ.\n\n---\n\n## Overheating Symptoms / Effects\n\nمەنبە overheating نىڭ تۆۋەندىكى نەتىجىلىرىنى تىلغا ئالىدۇ:\n- system instability\n- performance degradation\n- thermal throttling\n- slower operation\n- CPU/GPU/motherboard lifespan قىسقىرىش\n- premature failure\n- system crash\n- permanent hardware damage\n- automatic shutdown\n- workflow interruption\n- possible data loss\n\n### Thermal Throttling\n\nTemperature safe limit دىن ئېشىپ كەتسە:\n- system performance نى تۆۋەنلىتىپ\n- heat generation نى ئازايتىشى مۇمكىن\n\n### Safety Mechanisms\n\nمەنبە كۆپ system دا:\n- automatic shutdown\n\nغا ئوخشاش protection بارلىقىنى چۈشەندۈرىدۇ.\n\n**Exam memory: Cooling failure → Heat → Throttling / Shutdown / Damage**\n\n---\n\nExam Objective 3.5\nبىر ئەھۋال بېرىلگەندە، ئانا تاختا، CPU ۋە قوشۇمچە كارتىلارنى ئورنىتىڭ ۋە تەڭشەڭ.\n\n## شىفىرلاش، TPM ۋە HSM (Encryption, TPM, HSM)\n\n### Plaintext vs Ciphertext\n\n**Plaintext**\n- تېخى encryption قىلىنمىغان\n- ئادەم ياكى computer بىۋاسىتە ئوقۇيالايدىغان data\n\n**Ciphertext**\n- plaintext نى encryption ئارقىلىق coded/random-looking format قا ئايلاندۇرغاندىن كېيىنكى data\n\n### Encryption\n\nEncryption:\n- plaintext\n- encryption key\n- mathematical algorithm\n\nئارقىلىق data نى ciphertext قا ئايلاندۇرىدۇ.\n\nمەنبەنىڭ teaching point ى:\n- correct decryption key/method بولمىسا ciphertext نى ئەسلى plaintext قا قايتۇرۇش قىيىن\n\nSource-stated purpose:\n- confidentiality\n- integrity\n\n**ئەستە تۇتۇڭ: Plaintext → Encryption + Key → Ciphertext**\n\n---\n\n## TPM — Trusted Platform Module\n\n**TPM (Trusted Platform Module)**\n- hardw
