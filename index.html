Trackpad / Touchpad)\n\nDrawing pad ۋە trackpad / touchpad ئەنئەنىۋى مائۇسنىڭ ئورنىدا ئىشلىتىشكە بولىدىغان كىرگۈزۈش ئۈسكۈنىلىرىدۇر.\n\nTrackpad ئىشارەت ئارقىلىق كىرگۈزۈشنى (gesture-based input) قوللايدۇ. بۇ ئېكراندىكى مەزمۇنلار ئارىسىدا تېخىمۇ تېز ۋە تەبىئىي يۆتكىلىشكە ياردەم بېرىدۇ.\n\nDrawing pad بولسا ئېنىق قەلەم كىرگۈزۈشىگە ئېھتىياجلىق لايىھەلىگۈچى ۋە سەنئەتكارلار ئۈچۈن مۇھىم قورال.\n\nبۇ ئۈسكۈنىلەر نورمال ئىشلىشى ئۈچۈن:\n- ئۈسكۈنە قوزغىتىلغان (enabled) بولۇشى\n- دەللىكى توغرا تەڭشەلگەن (calibrated) بولۇشى\nكېرەك.\n\nCalibration توغرا بولمىسا:\n- كۆرسەتكۈچنىڭ ئۆزلۈكىدىن سۈرۈلۈشى (pointer drift)\n- cursor نىڭ بارماق ياكى stylus ھەرىكىتىگە توغرا ئەگىشەلمەسلىكى\n- كىرگۈزۈشنىڭ جاۋاب بەرمەسلىكى\nقاتارلىق ئالامەتلەر كۆرۈلۈشى مۇمكىن.\n\nقەرەللىك calibration ئۈسكۈنىنىڭ بارماق ياكى stylus ھەرىكىتىنى تېخىمۇ توغرا ئەكس ئەتتۈرۈشىگە ياردەم بېرىدۇ.\n\nسىرتقى قوشۇمچە ئۈسكۈنە ئۇلاش ياكى سىستېما تەڭشەكلىرىنى ئۆزگەرتىش بەزىدە trackpad نى ئاپتوماتىك توختىتىپ قويۇشى مۇمكىن. ئەگەر cursor كىرگۈزۈشى تۇيۇقسىز توختاپ قالسا، ئۈسكۈنە تەڭشەكلىرىدىن trackpad نىڭ قوزغىتىلغانلىقىنى تەكشۈرۈش مۇھىم troubleshooting قەدىمىدۇر.\n\nExam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە ئۈسكۈنىلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇپ، ئۇلارنىڭ ئوخشاشلىقى ۋە پەرقىنى چۈشەندۈرۈڭ.\n\n## كۆچمە ئۈسكۈنىنىڭ ئۇلىنىش تۈرلىرى (Mobile Device Connections)\n\nكۆچمە ئۈسكۈنە يالغۇز ھالەتتىمۇ نۇرغۇن ئىشنى قىلالايدۇ. ئەمما باشقا ئۈسكۈنە ۋە قوشۇمچە ئۈسكۈنىلەر بىلەن ئۇلانغاندا ئۇنىڭ ئىقتىدارى تېخىمۇ كېڭىيىدۇ.\n\nبۇ بۆلەكتە كۆچمە ئۈسكۈنىلەردە كۆپ ئىشلىتىلىدىغان سىملىق ۋە سىمسىز ئۇلىنىش تۈرلىرىنى كۆرۈپ چىقىمىز.\n\n### USB — Universal Serial Bus\n\nUSB سانلىق مەلۇمات يەتكۈزۈش ۋە ئۈسكۈنىنى زەرەتلەش ئۈچۈن ئىشلىتىلىدىغان سىملىق قوشۇمچە ئۈسكۈنە ئۇلىنىش ئۆلچىمىدۇر.\n\nكۆچمە ئۈسكۈنىلەردە كۆپ ئۇچرايدىغان USB شەكىللىرى:\n- Mini USB\n- Micro USB\n- USB-C\n\nUSB-C نىڭ ئۇلىغۇچىسىنى ئىككى يۆنىلىشتە چېتىشقا بولىدۇ (reversible). مەنبەدە ئۇ يېڭىراق ۋە كۆپ ئىقتىدارلىق USB شەكلى سۈپىتىدە چۈشەندۈرۈلۈپ، تېخىمۇ تېز سانلىق مەلۇمات يەتكۈزۈش ۋە زەرەتلەشنى قوللايدىغانلىقى تەكىتلەنگەن.\n\nMini USB ۋە Micro USB كونا تۈرلەر بولسىمۇ، بەزى ئۈسكۈنىلەردە يەنىلا ئۇچرايدۇ.\n\n### Lightning ئۇلىغۇچىسى (Lightning Connector)\n\nLightning مەنبەدە Apple ئۈسكۈنىلىرىگە خاس سىملىق قوشۇمچە ئۈسكۈنە ئۇلىنىش ئۆلچىمى دەپ چۈشەندۈرۈلگەن. ئۇ سانلىق مەلۇمات يەتكۈزۈش ۋە ئۈسكۈنىنى زەرەتلەش ئۈچۈن ئىشلىتىلىدۇ.\n\nمەسىلەن، iPhone دىن workstation غا ھۆججەت يۆتكەش ئۈچۈن، سىمنىڭ بىر ئۇچىنى iPhone غا، يەنە بىر ئۇچىنى كومپيۇتېرنىڭ USB پورتىغا ئۇلاپ سانلىق مەلۇمات يەتكۈزۈشكە بولىدۇ.\n\n### NFC — Near-Field Communication\n\nNFC — ناھايىتى قىسقا ئارىلىقتا رادىيو چاستوتىسى ئارقىلىق سانلىق مەلۇمات ئالماشتۇرىدىغان سىمسىز ئالاقە تېخنىكىسى.\n\nئۇنىڭ ئىش ئارىلىقى ئادەتتە بىر نەچچە سانتىمېتىر ئەتراپىدا بولىدۇ. بۇ قىسقا ئارىلىق تۆۋەندىكى ئىشلارغا ماس كېلىدۇ:\n- كىملىك دەلىللەش (authentication)\n- كۆچمە پۇل تۆلەش\n- قىسقا ئارىلىقتىكى سانلىق مەلۇمات ئالماشتۇرۇش\n\nمەسىلەن، ئۈسكۈنىنى ئوقۇغۇچقا (reader) يېقىنلاشتۇرۇش ئارقىلىق كىرىش ھوقۇقىنى دەلىللەش ياكى سېتىۋېلىش مەشغۇلاتىنى تېز ۋە بىخەتەر تاماملاشقا بولىدۇ.\n\n### Bluetooth\n\nBluetooth — قىسقا ئارىلىقتا رادىيو چاستوتىسى ئارقىلىق سانلىق مەلۇمات ئالماشتۇرىدىغان سىمسىز تور ۋە قوشۇمچە ئۈسكۈنە ئۇلىنىش تېخنىكىسى.\n\nئۇ كۆچمە ئۈسكۈنىنى تۆۋەندىكى ئۈسكۈنىلەر بىلەن سىمسىز ئۇلاشقا ئىشلىتىلىدۇ:\n- سىمسىز تىڭشىغۇچ\n- ئېلىپ يۈرۈشكە ئەپلىك ياڭراتقۇ\n- كۇنۇپكا تاختىسى\n\nBluetooth سىمغا بولغان ئېھتىياجنى ئازايتىدۇ ۋە قولنى بوش تۇتۇپ ئىشلىتىش تەجرىبىسىنى قوللايدۇ.\n\nئۇ يەنە:\n- ھۆججەت ھەمبەھىرلەش\n- ئاۋاز تارقىتىش (audio streaming)\n- ئاۋازلىق بۇيرۇق\nقاتارلىق ئىقتىدارلارنى قوللايدۇ.\n\n### Tethering ۋە Mobile Hotspot\n\nTethering بىلەن mobile hotspot بىر-بىرىگە يېقىن ئۇقۇم، ئەمما ئىككىسى پۈتۈنلەي بىر نەرسە ئەمەس.\n\n**Tethering** — كۆچمە ئۈسكۈنىنىڭ ئۆزىدىكى سانلىق مەلۇمات/ئىنتېرنېت ئۇلىنىشىنى باشقا ئۈسكۈنىلەر بىلەن ھەمبەھىرلىشىدۇر. بۇ ھەمبەھىرلەش:\n- سىملىق ئۇلىنىش\n- سىمسىز ئۇلىنىش\nئارقىلىق ئەمەلگە ئاشۇرۇلۇشى مۇمكىن.\n\nTethering ئادەتتە باشقا ئۈسكۈنىگە ئىنتېرنېت كېرەك بولغان، ئەمما ئادەتتىكى سىملىق ياكى سىمسىز تور يوق ۋاقىتتا ئىشلىتىلىدۇ.\n\n**Mobile hotspot** بولسا Wi-Fi ئىشلىتىدىغان tethering نىڭ بىر خىل شەكلىدۇر.\n\nHotspot ھالىتى قوزغىتىلغاندا، كۆچمە ئۈسكۈنە سىمسىز زىيارەت نۇقتىسى (wireless access point) سۈپىتىدە ئىشلەپ، بىر نەچچە ئۈسكۈنىنىڭ بىر ۋاقىتتا ئۇلىنىپ ئىنتېرنېتكە چىقىشىغا يول قويىدۇ.\n\nHotspot بولۇپمۇ ساياھەت قىلغاندا ياكى يىراقتىن ئىشلىگەندە، ئەتراپتا ئىشلىتىشكە بولىدىغان Wi-Fi تورى بولمىغان ۋاقىتتا پايدىلىق.\n\n**ئىمتىھاندا ئەستە تۇتۇڭ:** ھەر بىر mobile hotspot — tethering نىڭ بىر شەكلى؛ ئەمما ھەر بىر tethering چوقۇم hotspot بولمايدۇ.\n\nExam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە ئۈسكۈنىلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇپ، ئۇلارنىڭ ئوخشاشلىقى ۋە پەرقىنى چۈشەندۈرۈڭ.\n\n## پورت كۆپەيتكۈچ (Port Replicator)\n\nPort replicator — خاتىرە كومپيۇتېر ياكى باشقا كۆچمە ئۈسكۈنىگە ئۇلىنىپ، قوشۇمچە قوشۇمچە ئۈسكۈنىلەر ئۈچۈن پورت سانىنى كۆپەيتىدىغان ئۈسكۈنە.\n\nمەنبەنىڭ ئاساسلىق پەرقلىشى بويىچە، port replicator نىڭ مەقسىتى ئاساسلىقى **قوشۇمچە پورت تەمىنلەش** بولۇپ، docking station غا ئوخشاش ئايرىم قوشۇمچە ئىقتىدارلارنى قوشۇش ئەمەس.\n\nئۇ ئادەتتە USB، USB-C ياكى Thunderbolt ئارقىلىق خاتىرە كومپيۇتېرغا ئۇلىنىپ، بار بولغان ئۇلىنىش سانىنى كۆپەيتىدۇ.\n\nمودېلغا قاراپ port replicator دا تۆۋەندىكى پورتلار بولۇشى مۇمكىن:\n- USB\n- HDMI\n- Ethernet\n- Serial\n- Parallel\n\nبۇ ئارقىلىق خاتىرە كومپيۇتېرنى ئادەتتە ئۈستەل كومپيۇتېرىغا ئۇلىنىدىغان كۆپ خىل قوشۇمچە ئۈسكۈنىلەر بىلەن بىرلا جايدا ئىشلىتىشكە بولىدۇ.\n\nPort replicator نىڭ مۇھىم ئەۋزەللىكى — كۆپ ئۇلىنىشنى بىر نۇقتىغا توپلاش.\n\nبىر نەچچە خىزمەت ئورنى ئارىسىدا يۆتكىلىدىغان ياكى دائىم سەپەردە بولىدىغان ئىشلەتكۈچى ئۈچۈن port replicator مۇقىم ئۇلاش مەركىزى (hub) سۈپىتىدە ئىشلىيەلەيدۇ. بارلىق قوشۇمچە ئۈسكۈنىلەر شۇ port replicator غا ئۇلىنىپ تۇرىدۇ.\n\nئىشلەتكۈچى خىزمەت ئورنىغا كەلگەندە، خاتىرە كومپيۇتېرنى بىرلا سىم بىلەن port replicator غا ئۇلاپ، ئۇلانغان ئۈسكۈنىلەرنىڭ ھەممىسىنى دەرھال ئىشلىتەلەيدۇ.\n\nبۇ:\n- ۋاقىت تېجەيدۇ\n- قوشۇمچە ئۈسكۈنىلەرنى قايتا-قايتا چېتىپ-ئۈزۈشنى ئازايتىدۇ\n- خاتىرە كومپيۇتېر پورتلىرىنىڭ جىسمانىي ئۇپرىشىنى ئازايتىشقا ياردەم بېرىدۇ\n\nخاتىرە كومپيۇتېرلار بارغانسېرى نېپىز ۋە يېنىك لايىھەلەنگەچكە، بەزى مودېللاردا پورت سانى ئازىيىدۇ. Port replicator ئىچكى قاتتىق دېتالنى يېڭىلىمايلا قوشۇمچە پورتلارنى تەمىنلەش ئارقىلىق بۇ چەكلىمىنى يېنىكلىتىدۇ.\n\nمەنبەدە يېڭىراق port replicator لارنىڭ USB 3.0، USB-C ۋە Thunderbolt قاتارلىق تېز ئۇلىنىشلارنى قوللاپ:\n- تېز سانلىق مەلۇمات يەتكۈزۈش\n- يۇقىرى ئېنىقلىقتىكى ئېكرانغا چىقىرىش\n- ئۇلانغان خاتىرە كومپيۇتېرغا توك يەتكۈزۈش (power delivery)\nقاتارلىق ئىمكانلارنى تەمىنلىشى مۇمكىنلىكىمۇ بايان قىلىنغان.\n\nكۆپ ئۈسكۈنە ئۇلاشقا ئېھتىياجلىق كەسپىي خادىم، ئوقۇغۇچى ياكى باشقا ئىشلەتكۈچى ئۈچۈن port replicator خاتىرە كومپيۇتېرغا ئۈستەل كومپيۇتېرىغا ئوخشاش كۆپ ئۇلىنىش ئىمكانى بېرىپ، ئۇنى تېخىمۇ قولايلىق خىزمەت پونكىتىغا ئايلاندۇرالايدۇ.\n\nExam Objective 1.2\nكۆچمە ئۈسكۈنىلەرنىڭ قوشۇمچە ئۈسكۈنىلىرى ۋە ئۇلىنىش تاللانمىلىرىنى سېلىشتۇرۇپ، ئۇلارنىڭ ئوخشاشلىقى ۋە پەرقىنى چۈشەندۈرۈڭ.\n\n## ئۇلاش پونكىتى (Docking Station)\n\nDocking station — خاتىرە كومپيۇتېر ياكى باشقا كۆچمە ئۈسكۈنىگە ئۇلىنىپ، قوشۇمچە پورتلار بىلەن بىرگە قوشۇمچە ئىقتىدارلارنىمۇ تەمىنلەيدىغان ئۈسكۈنە.\n\nئۇ port replicator غا ئوخشايدۇ، ئەمما مەنبەدە تەكىتلەنگەن مۇھىم پەرق شۇكى:\n\n- **Port replicator:** ئاساسلىقى پورت سانىنى كۆپەيتىدۇ.\n- **Docking station:** پورت سانىنى كۆپەيتىشتىن باشقا، قوشۇمچە ئىقتىدارلارنىمۇ تەمىنلىيەلەيدۇ.\n\nبۇ قوشۇمچە ئىقتىدارلار:\n- قوشۇمچە ساقلاش بوشلۇقى\n- تېخىمۇ ياخشى ئاۋاز ئىقتىدارى\n- ئىلغار سىن ياكى گرافىك ئىقتىدارى\nقاتارلىقلارنى ئۆز ئىچىگە ئېلىشى مۇمكىن.\n\nDocking station نىڭ بۇ ئىقتىدارلارنى تەمىنلىشى ئۇنىڭ كۆچمە ئۈسكۈنە بىلەن ئىشلىتىدىغان يۇقىرى سۈرئەتلىك ئۇلىنىشىغا باغلىق.\n\nThunderbolt ياكى ئىشلەپچىقارغۇچىغا خاس ئۇلىغۇچ (proprietary connector) ئارقىلىق docking station بىرلا سىمدا:\n- سانلىق مەلۇمات\n- توك\n- سىن سىگنالى\nنى بىر ۋاقىتتا يەتكۈزەلەيدۇ.\n\nشۇڭا docking station پەقەت پورت سانىنى كۆپەيتىپلا قالماي، خاتىرە كومپيۇتېرنىڭ ئومۇمىي ئىقتىدارىنىمۇ كېڭەيتەلەيدۇ.\n\nDocking station نىڭ مۇھىم قوشۇمچە ئىقتىدارلىرىنىڭ بىرى — ئۆزىنىڭ توك مەنبەسى (power supply) بولۇشى مۇمكىن. بۇ ئارقىلىق ئۇ ئۇلانغان خاتىرە كومپيۇتېرنى بىۋاسىتە زەرەتلىيەلەيدۇ.\n\nبۇ توك مەنبەسى يەنە خاتىرە كومپيۇتېرنىڭ ئۆزىدىن كېلىدىغان توكقا تايىنىدىغان ئاددىي port replicator قوللىيالمايدىغان، كۆپ توك تەلەپ قىلىدىغان قوشۇمچە ئۈسكۈنىلەرنى ئىشلىتىشكە ياردەم بېرىشى مۇمكىن.\n\nبەزى docking station لاردا ئايرىم گرافىك كارتىسى (dedicated graphics card) غا ئوخشاش قوشۇمچە قاتتىق دېتال بولۇشى مۇمكىن. بۇ خاتىرە كومپيۇتېرغا:\n- سىن رەندېرلاش\n- ئويۇن\nقاتارلىق گرافىكقا كۆپ يۈك چۈشىدىغان خىزمەتلەرنى ئۆزىنىڭ ئىچكى ئىقتىدارىدىن تېخىمۇ كۈچلۈك شەكىلدە بىر تەرەپ قىلىش ئىمكانى بېرىشى مۇمكىن.\n\nبەزى docking station لاردا ئىچىگە ئورنىتىلغان HDD ياكى SSD بولۇشى مۇمكىن. بۇ قوشۇمچە ساقلاش بوشلۇقى تەمىنلەپلا قالماي، مەنبەدە بايان قىلىنغاندەك بەزى ئەھۋالدا سانلىق مەلۇمات بىر تەرەپ قىلىش سۈرئىتىنىمۇ ياخشىلاشقا ياردەم بېرىشى مۇمكىن.\n\nباشقا مودېللاردا:\n- تېز تور ئۇلىنىشى ئۈچۈن Ethernet / network پورتى\n- يۇقىرى ئېنىقلىقتىكى سىرتقى ئېكرانلار ئۈچۈن بىر نەچچە video پورتى\n- يۇقىرى سۈپەتلىك ئاۋاز سىستېمىسى ئۈچۈن ئىلغار audio پورتى\nبولۇشى مۇمكىن.\n\nبۇ قوشۇمچە ئىقتىدارلار docking station نى پەقەت قوشۇمچە USB پورتى ياكى ئاددىي سىن چىقىرىشقا ئېھتىياجلىق ئىشلەتكۈچىدىنمۇ كۆپرەك ئىقتىدار تەلەپ قىلىدىغان power user لارغا ماس قىلىدۇ.\n\nئىشلەتكۈچى ئىشخانا ياكى ئۆيدە خاتىرە كومپيۇتېرنى تولۇق ئۈستەل كومپيۇتېر مۇھىتىغا ئوخشاش ئىشلىتەلەيدۇ؛ يۆتكىلىش كېرەك بولغاندا بولسا ئۇنى docking station دىن ئايرىپ، يەنە كۆچمە ھالەتتە ئىشلىتەلەيدۇ.\n\n**ئىمتىھاندا ئەستە تۇتۇشقا ئەڭ ئاسان پەرق:**\n- **Port replicator = كۆپرەك پورت**\n- **Docking station = كۆپرەك پورت + قوشۇمچە ئىقتىدار**\n"}, {"id": "1.3", "number": "1.3", "domain": "1", "domain_en": "Mobile Devices", "domain_ug": "كۆچمە ئۈسكۈنىلەر", "english": "Exam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Cellular connectivity. Cellular connectivity refers to the technology that allows mobile devices to communicate over long distances without using physical cables.\n\nInstead, these devices rely on radio signals exchanged with nearby cell towers that are strategically placed to provide wide geographic coverage. Whenever you make a phone call, send a text message, or access the internet using mobile data, your device is communicating with one of these towers. To support millions of users at the same time, cellular networks operate across carefully managed frequencies and channels.\n\nAs a user moves from place to place, the connection is automatically handed off from one cell tower to another without interruption. This seamless transition is what allows you to start a phone call in one location and continue it while traveling or stream media while on the move without losing connectivity. Cellular technology has evolved through several standards, commonly referred to as 2G, 3G, 4G, and 5G with each version improving speed, reliability, and overall capacity.\n\n2G or second generation was designed primarily for voice calls and basic text messaging. While it was groundbreaking at the time, its data capabilities are extremely limited by modern standards. 3G or third generation introduced faster data speeds that made mobile web browsing and basic video streaming possible.\n\nThe arrival of 4G or fourth generation marked a major shift in mobile connectivity. With significantly higher speeds and improved performance, 4G enabled high definition video streaming, online gaming, and many of the mobile applications we rely on today. 5G or fifth generation builds on this foundation by offering even faster speeds, increased capacity, and much lower latency.\n\nThese improvements not only enhance everyday mobile use, but also support emerging technologies such as augmented reality and advanced connected systems. As cellular standards have progressed from 2G through 5G, each version has delivered a better user experience by supporting more devices, faster data rates, and more reliable connections. Understanding which cellular standard a device is using helps explain differences in performance, coverage, and connectivity, especially when troubleshooting mobile network issues.\n\nBeyond understanding how cellular networks work, it is also important to know how a device manages its cellular connection. When cellular connectivity is enabled, a mobile device can place calls, send text messages, and access the internet through its mobile service provider, often referred to as a carrier. This connection becomes especially important when Wi-Fi networks are unavailable, such as while commuting or traveling.\n\nThere are also situations where cellular data settings directly impact device behavior. For example, a device may still be able to make phone calls, but lack internet access if cellular data features are restricted. In other cases, cellular connectivity may be limited by network settings that control which cellular technologies are allowed.\n\nEnsuring that the appropriate cellular standards are enabled allows the device to connect properly when signal conditions change. Additionally, when traveling internationally, cellular data may be restricted to prevent unexpected charges. In these situations, enabling data roaming allows the device to access mobile data services outside the home carrier's coverage area.\n\nWhile this restores internet access, it should be used carefully, as roaming can result in additional costs. Most mobile devices allow users to manage cellular connectivity directly through the settings menu. From there, users can enable or disable cellular data, control roaming options, and verify which cellular technologies are active.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Subscriber identity module. To understand how mobile devices connect to cellular networks, we need to start with a subscriber identity module, often abbreviated as SIM.\n\nA SIM is a small card that stores information used to identify a device and authenticate it on a cellular network. This information links the device to a specific mobile service provider and allows the device to make calls, send text messages, and access mobile data. A SIM plays a critical role in activation.\n\nActivation is the process of enabling a device to connect to a carrier's cellular network using the information stored on the SIM. Until a SIM is activated, the device may power on, but it will not have full cellular functionality. Closely related to activation is provisioning, which is the process of configuring the carrier's network services for that device.\n\nProvisioning determines what services are available, such as voice, text, data limits, and roaming capabilities. Another important concept tied to SIM cards is portability. Because the SIM stores subscriber information rather than device-specific hardware details, it can often be moved from one compatible device to another.\n\nThis allows users to switch phones without changing carriers, as long as the devices are unlocked and supported by the network. This portability is why swapping a SIM card can quickly restore service on a replacement device. SIM cards also define the relationship between the device and the carrier.\n\nSome devices are locked to a specific carrier, meaning they will only accept SIM cards from that provider. Other devices are unlocked and can work with SIM cards from multiple carriers. Understanding this relationship is important when troubleshooting connectivity issues or when users attempt to change service providers.\n\nNow let's shift to a newer technology known as embedded SIM, often abbreviated as eSIM. An eSIM performs the same basic function as a physical SIM card, but instead of being removable, it is built directly into the device's hardware. Because it is embedded, there is no physical card to insert or replace.\n\nWith eSIM technology, activation and provisioning are handled digitally. Users can download a carrier profile directly to the device, allowing service to be enabled without visiting a store or inserting a SIM card. This makes eSIM especially useful for devices that need quick setup, frequent carrier switching, or support for multiple cellular plans at once. eSIM also changes how portability works.\n\nInstead of physically moving a SIM card between devices, portability is managed through software by adding or removing carrier profiles. While this offers greater flexibility and convenience, it also means the device must support eSIM and be compatible with the carrier's eSIM implementation. Exam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support.\n\nHotspot connectivity. A mobile device hotspot is your gateway to the internet when traditional network connections are just out of reach. For instance, imagine you are in a cafe that doesn't offer wifi, but you urgently need to send an email from your laptop.\n\nThis is where your smartphone could come to the rescue. By enabling the hotspot feature, your smartphone uses its cellular data connection to create a personal wifi network. You can then connect your laptop to this network, allowing your laptop to access the internet just as if it were connected to a regular wifi or wired network with little time and effort required.\n\nTo begin setting up a mobile device hotspot, you can start with your smartphone. First, enable the hotspot feature by going to the settings menu and enable the hotspot option. Once you do this, your smartphone will begin broadcasting a wifi signal.\n\nOnce your smartphone's hotspot is active, take your laptop and open the wifi network list. Your smartphone's network name should appear here, selected. Now your laptop will be connected to the internet via your smartphone's data connection.\n\nThis seamless connectivity allows you to use your laptop to browse the internet, stream content, or attend virtual meetings, leveraging the mobile data from your phone. Just remember, while connected, your laptop is using your phone's data plan, so be mindful of your data usage to avoid incurring any fees. Now this is just one way in which to set up a hotspot.\n\nThere are many other hotspot arrangements that can be utilized depending on the specific use case. I just walked you through this scenario as it tends to be the most commonly used method. Now for a little housekeeping.\n\nWhen maintaining a hotspot, keep in mind that it can drain your mobile device's battery more quickly, so it may be wise to keep it plugged into a charger during extended use. When you're finished and no longer need the hotspot, don't forget to turn it off on your smartphone to save data and battery life and to keep your connection secure. This is done by simply returning to the settings menu and toggling the hotspot feature off.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Wi-Fi connectivity. While hotspot connectivity allows a mobile device to create a network using cellular data, Wi-Fi connectivity focuses on joining an existing wireless network.\n\nWi-Fi allows mobile devices such as smartphones, tablets, and laptops to connect to local networks provided by home routers, businesses, schools, or public access points. Once connected, the device can access the internet and local network resources without relying on cellular data. A common Wi-Fi scenario might involve arriving at home, opening your laptop, and automatically connecting to your home wireless network.\n\nUnlike a hotspot, this connection is provided by a wireless router that is already connected to the internet through a wired service such as cable or fiber. Because Wi-Fi does not rely on a cellular data plan, it is often faster, more stable, and does not consume mobile data allowances. To connect to a Wi-Fi network, a user opens the device's Wi-Fi settings and views a list of available wireless networks.\n\nAfter selecting the correct network, the device may prompt for a security key or password if the network is protected. Once authenticated, the device establishes a connection and can begin transmitting data. Many mobile devices are configured to remember trusted networks and automatically reconnect when they are in range.\n\nFinally, Wi-Fi settings, just like hotspot settings, allow users to control how and when devices connect. Wi-Fi can be turned on or off to conserve battery life, avoid untrusted networks, or force a device to fall back to cellular data when needed. In many troubleshooting scenarios, simply understanding how Wi-Fi behaves and how it interacts with other connection options can quickly lead you to the right solution.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Bluetooth pairing. Bluetooth is a wireless technology that allows the exchange of data between different devices.\n\nWith Bluetooth, you can connect devices like smartphones, computers, headphones, speakers, and even car audio systems without the hassle of wires. It's a technology that's all about convenience, enabling things like listening to music on wireless headphones or sharing files quickly between devices. But to do this, you first need to know a bit more about Bluetooth pairing.\n\nPairing is the process of establishing a secure wireless connection between two Bluetooth-enabled devices so they can communicate with each other. And the process starts by enabling Bluetooth connections in the settings menu of your mobile device. Once your Bluetooth antenna is enabled and connections are allowed, the next step in the pairing process begins with placing the Bluetooth device you want to connect with into pairing mode.\n\nThis is usually done by holding a button on the device, such as a long press on the power button of Bluetooth headphones. This puts the device into a state where it actively looks to connect with other Bluetooth-enabled devices. Next, you'll go back to the first device and search for available devices.\n\nThis is generally done within the Bluetooth settings page where you can scan for new devices. Once the second device appears on the list, you can select it to initiate the pairing process. Sometimes you may need to enter a pen code to complete the pairing.\n\nIn the Bluetooth pairing process, entering a pen code is an additional security measure to ensure that only users with the correct permissions can establish a connection between devices. The necessity of entering this code prevents unauthorized users from connecting to your device because without the correct pen, the connection cannot be completed. This step is particularly important when pairing devices in public spaces where multiple Bluetooth devices might be present and the risk of an unintended or malicious connection is higher.\n\nAfter the devices are paired, they'll remember each other unless you choose to disconnect them or remove the pairing, meaning you won't have to go through the setup process every time. Lastly, disabling Bluetooth on your device is a straightforward way to conserve battery life and increase security. When you disable Bluetooth, you effectively cut off the wireless communication channel, ensuring that no Bluetooth connections can be made to your device without your consent.\n\nAnd to disable Bluetooth, just toggle the setting to the off position and you're done. Exam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Location services.\n\nIn today's interconnected world, mobile device location services act as the bridge between the digital and physical worlds. These services allow devices to determine where they are and adjust applications and features accordingly. In this video segment, we'll focus on how location services work and how mobile devices use different technologies to pinpoint a user's location.\n\nLet's start with GPS, which stands for global positioning system. GPS is a network of satellites orbiting the earth that transmit location and timing information. A GPS receiver, such as the one inside your smartphone, listens for signals from multiple satellites and uses that information to calculate its position.\n\nThe more satellite signals the device receives, the more accurate the location becomes. This is why GPS works best outdoors with a clear view of the sky. Apart from GPS, cellular signals are also used for something known as device triangulation.\n\nThis method utilizes the signal from cell towers. Your mobile device constantly communicates with nearby towers, and by measuring the strength of your signal to multiple towers, a location can be inferred. The more towers your device can see, the more precise the location.\n\nIt's akin to finding the center point of a triangle when you know it's three corners. Now that we understand how location data is gathered, it's important to address the security and privacy aspect of location services. Many applications rely on location data to function properly.\n\nFor example, navigation apps, weather apps, and ride-sharing services all need to know where you are. Mobile operating systems allow users to control which applications have access to location data. By granting or denying permissions on an app-by-app basis, users can reduce the risk of unnecessary tracking and protect their privacy.\n\nFinally, mobile devices offer location accuracy settings that balance precision with battery usage. High accuracy mode uses multiple signal sources to determine location, including GPS, Wi-Fi, Bluetooth, and cellular networks. This mode provides the most precise location information, but consumes more battery power.\n\nOther modes may limit which technologies are used to conserve power, but high accuracy combines all available signals to deliver the most reliable location data.\n\nExam objective 1.3. Given a scenario, configure basic mobile device network connectivity and provide application support. Mobile device management.\n\nEnterprise mobility management is a comprehensive approach to securing and enabling the use of mobile devices within a business environment. This framework relies on a collection of services and technologies designed to protect mobile devices while maintaining a clear separation between personal and corporate data. As organizations increasingly rely on smartphones, tablets, and laptops for everyday operations, enterprise mobility management provides a structured way to manage how those devices are configured, secured, and used to access company resources.\n\nIn today's workplace, employees often accessed sensitive corporate data from multiple locations and on different types of mobile devices. Without a centralized approach, maintaining security and consistency becomes difficult. Enterprise mobility management helps organizations reduce risk, meet compliance requirements, and support flexible work environments, all while keeping devices functional and productive for end users.\n\nAt the center of enterprise mobility management is mobile device management, often abbreviated as MDM. Mobile device management is a technology that allows IT administrators to control, secure, and enforce policies on mobile devices. Through MDM, organizations can remotely configure device settings, apply security requirements, and manage how devices interact with corporate systems regardless of where the device is physically located.\n\nOne of the primary functions of MDM is device configuration. Device configuration involves setting up mobile devices so they comply with company standards as soon as they are enrolled. This can include configuring email accounts, Wi-Fi access, VPN connections, password requirements, screen lock settings, and encryption.\n\nAutomating these configurations helps ensure consistency across devices while reducing manual setup and configuration errors. How MDM is applied often depends on the device ownership model. In corporate-owned environments, the organization owns the device and applies full management controls through MDM.\n\nThis allows IT administrators to enforce policies across the entire device and maintain a high level of security. One common corporate-owned model is corporate-owned personally enabled, often abbreviated as COPE. COPE is a device ownership model in which the organization owns the device but allows limited personal use by the employee.\n\nBecause the company owns the device, IT maintains strong control over configurations, security policies, and corporate data while still offering some flexibility for personal activities. A variation of this approach is choose your own device, often abbreviated as CYOD. CYOD is a device ownership model in which employees select a device from an organization-approved list while the organization retains ownership and management control.\n\nThis model gives users some choice while allowing IT to limit support complexity and maintain consistent security standards. In contrast, bring your own device, often abbreviated as BYOD, allows employees to use their personal devices for work purposes. BYOD is a device ownership model in which the employee owns the device and the organization applies limited management controls primarily to protect corporate data.\n\nBecause the device belongs to the user, MDM policies in BYOD environments typically focus on securing work-related data rather than managing the entire device. Another critical function of MDM is policy enforcement. Policies define what users can and cannot do on managed devices.\n\nThese policies may require strong passwords, restrict certain device features, lock unapproved applications, or allow IT administrators to remotely lock or wipe a device if it is lost or stolen. Policy enforcement ensures security standards remain in place even when devices are used outside controlled environments. MDM also supports the deployment and management of corporate applications.\n\nOrganizations can use MDM to install approved applications, keep them updated, and remove them when access is no longer required. This helps ensure employees are using secure, supported software while reducing the risk of unauthorized or malicious applications. Overall, enterprise mobility management, powered by mobile device management, allows organizations to securely support modern mobile workflows.\n\nExam objective 1.3, given a scenario, configure basic mobile device network connectivity and provide application support. Mobile device synchronization. So what exactly does mobile device synchronization mean?\n\nMobile device synchronization is the process of keeping the same data consistent and up to date across multiple devices, such as smartphones, tablets, and laptops. When synchronization is working correctly, changes made on one device are automatically reflected on others, allowing users to move between devices without losing access to important information. In today's mobile environments, synchronization is typically tied to user accounts and cloud services.\n\nWhen a user signs into a device with an account, that account becomes the central hub for syncing data, like calendars, contacts, emails, and files. As long as synchronization is enabled and the device has connectivity, data is continuously updated in the background. One important factor to consider when syncing mobile devices is recognizing data caps.\n\nMany mobile devices rely on cellular data connections when Wi-Fi is not available and cellular data plans often include usage limits. Synchronizing large amounts of data, such as files or media, can quickly consume available data. For this reason, devices often allow users to restrict synchronization to Wi-Fi connections only, helping prevent excessive data usage and unexpected charges.\n\nSome of the most commonly synchronized data types are calendars and contacts. Calendar synchronization ensures that appointments, meetings, and reminders remain consistent across devices. If a meeting is added or changed on one device, it automatically appears on others.\n\nContact synchronization works in a similar way, keeping phone numbers, email addresses, and contact details updated everywhere the user signs in. Synchronization also plays a major role in business applications, especially email and cloud storage services. Email synchronization allows messages to appear consistently across devices, meaning emails read or deleted on one device reflect the same status elsewhere.\n\nCloud storage synchronization allows files to be stored centrally and accessed from multiple devices. Files uploaded from one device can be downloaded or edited on another, making cloud storage a critical component of modern mobile workflows. However, syncing large files can impact both storage space and data usage, reinforcing the importance of understanding data caps and sync settings.", "uyghur": "Exam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## ھۈجەيرىلىك تور ئۇلىنىشى (Cellular Connectivity)\n\nھۈجەيرىلىك تور ئۇلىنىشى — كۆچمە ئۈسكۈنىلەرنىڭ جىسمانىي سىم ئىشلەتمەي، ئۇزۇن ئارىلىقتا ئالاقە قىلىشىغا يول قويىدىغان تېخنىكىدۇر.\n\nكۆچمە ئۈسكۈنە يېقىن ئەتراپتىكى cell tower، يەنى ھۈجەيرىلىك تور مۇنارى بىلەن رادىيو سىگنالى ئالماشتۇرىدۇ. بۇ مۇنارلار كەڭ جۇغراپىيەلىك رايوننى قاپلاش ئۈچۈن ئورۇنلاشتۇرۇلغان.\n\nتېلېفون قىلغاندا، قىسقا ئۇچۇر ئەۋەتكەندە ياكى mobile data ئارقىلىق ئىنتېرنېتكە چىققاندا، ئۈسكۈنىڭىز مۇشۇ تور مۇنارلىرىنىڭ بىرى بىلەن ئالاقە قىلىدۇ.\n\nمىليونلىغان ئىشلەتكۈچىنى بىرلا ۋاقىتتا قوللاش ئۈچۈن، ھۈجەيرىلىك تورلار چاستوتا ۋە قاناللارنى تەرتىپلىك باشقۇرىدۇ.\n\nئىشلەتكۈچى بىر جايدىن يەنە بىر جايغا يۆتكەلگەندە، ئۇلىنىش بىر cell tower دىن يەنە بىرىگە ئاپتوماتىك يۆتكەلدى. بۇ ئۈزۈكسىز ئۆتكۈزۈپ بېرىش ئارقىلىق، ئادەم سەپەر قىلىۋاتقاندا تېلېفون سۆھبىتىنى ياكى سىن/ئاۋاز تارقىتىشنى ئۇلىنىش ئۈزۈلمەي داۋاملاشتۇرالايدۇ.\n\n### 2G، 3G، 4G ۋە 5G\n\nھۈجەيرىلىك تور تېخنىكىسى 2G، 3G، 4G ۋە 5G دەپ ئاتىلىدىغان بىر نەچچە ئەۋلاد ئارقىلىق تەرەققىي قىلغان. مەنبەدە ھەر بىر يېڭى ئەۋلادنىڭ سۈرئەت، ئىشەنچلىكلىك ۋە ئومۇمىي سىغىمنى ياخشىلىغانلىقى تەكىتلەنگەن.\n\n**2G — ئىككىنچى ئەۋلاد**\n- ئاساسلىقى ئاۋازلىق تېلېفون ۋە ئاددىي قىسقا ئۇچۇر ئۈچۈن لايىھەلەنگەن.\n- بۈگۈنكى ئۆلچەم بويىچە سانلىق مەلۇمات يەتكۈزۈش ئىقتىدارى ناھايىتى چەكلىك.\n\n**3G — ئۈچىنچى ئەۋلاد**\n- تېخىمۇ تېز سانلىق مەلۇمات سۈرئىتىنى ئېلىپ كەلگەن.\n- كۆچمە تور كۆرۈش ۋە ئاددىي سىن تارقىتىشنى مۇمكىن قىلغان.\n\n**4G — تۆتىنچى ئەۋلاد**\n- كۆچمە تور ئۇلىنىشىدا چوڭ ئىلگىرىلەش بولغان.\n- يۇقىرىراق سۈرئەت ۋە ياخشىراق ئىقتىدار ئارقىلىق HD سىن تارقىتىش، تور ئويۇنى ۋە نۇرغۇن زامانىۋى كۆچمە ئەپلەرنى قوللىغان.\n\n**5G — بەشىنچى ئەۋلاد**\n- تېخىمۇ تېز سۈرئەت\n- تېخىمۇ چوڭ سىغىم\n- تېخىمۇ تۆۋەن كېچىكىش (latency)\nتەمىنلەشنى نىشان قىلىدۇ.\n\nمەنبەدە بۇ ياخشىلىنىشلارنىڭ كۈندىلىك كۆچمە ئىشلىتىشتىن باشقا، augmented reality ۋە ئىلغار ئۇلانغان سىستېمىلارغا ئوخشاش يېڭى تېخنىكىلارنىمۇ قوللايدىغانلىقى بايان قىلىنغان.\n\nTroubleshooting جەريانىدا ئۈسكۈنىنىڭ قايسى cellular standard نى ئىشلىتىۋاتقانلىقىنى بىلىش ئىقتىدار، قاپلاش دائىرىسى ۋە ئۇلىنىش پەرقىنى چۈشىنىشكە ياردەم بېرىدۇ.\n\n### ھۈجەيرىلىك تور تەڭشەكلىرىنى باشقۇرۇش\n\nCellular connectivity قوزغىتىلغاندا، كۆچمە ئۈسكۈنە mobile service provider، يەنى **carrier** ئارقىلىق:\n- تېلېفون قىلىش\n- قىسقا ئۇچۇر ئەۋەتىش\n- mobile data ئارقىلىق ئىنتېرنېتكە چىقىش\nئىقتىدارلىرىنى ئىشلىتەلەيدۇ.\n\nWi‑Fi يوق ۋاقىتتا، مەسىلەن يولدا ياكى ساياھەتتە، بۇ ئۇلىنىش ئالاھىدە مۇھىم بولىدۇ.\n\nبەزى ئەھۋالدا تېلېفون قىلىش ئىقتىدارى بار تۇرۇپمۇ، mobile data چەكلەنگەن بولسا ئىنتېرنېت ئىشلىمەسلىكى مۇمكىن.\n\nبەزى ئۈسكۈنىلەردە قايسى ھۈجەيرىلىك تېخنىكىلارنىڭ ئىشلىتىلىشىگە رۇخسەت قىلىدىغان تور تەڭشەكلىرى بار. مۇۋاپىق cellular standard لار قوزغىتىلغان بولسا، سىگنال شارائىتى ئۆزگەرگەندە ئۈسكۈنە مۇۋاپىق تورغا ئۇلىنالايدۇ.\n\nخەلقئارا ساياھەتتە ئارتۇقچە ھەق چىقىپ كېتىشتىن ساقلىنىش ئۈچۈن cellular data ياكى roaming چەكلەنگەن بولۇشى مۇمكىن.\n\n**Data roaming** قوزغىتىلسا، ئۈسكۈنە ئۆزىنىڭ ئادەتتىكى carrier قاپلاش دائىرىسىدىن سىرتتا mobile data مۇلازىمىتىنى ئىشلىتەلەيدۇ. ئەمما مەنبەدە roaming نىڭ قوشۇمچە ھەق پەيدا قىلىشى مۇمكىنلىكى ئۈچۈن ئېھتىياتچان ئىشلىتىش كېرەكلىكى تەكىتلەنگەن.\n\nكۆپىنچە كۆچمە ئۈسكۈنىلەردە Settings ئارقىلىق:\n- cellular data نى قوزغىتىش ياكى توختىتىش\n- roaming تاللانمىلىرىنى باشقۇرۇش\n- قايسى cellular technology نىڭ قوزغىتىلغانلىقىنى تەكشۈرۈش\nمۇمكىن.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## SIM — Subscriber Identity Module\n\nكۆچمە ئۈسكۈنىنىڭ ھۈجەيرىلىك تورغا قانداق ئۇلىنىدىغانلىقىنى چۈشىنىش ئۈچۈن، ئالدى بىلەن SIM (Subscriber Identity Module) نى چۈشىنىش كېرەك.\n\nSIM — ئۈسكۈنىنى ھۈجەيرىلىك توردا تونۇش ۋە كىملىكىنى دەلىللەشكە ئىشلىتىلىدىغان ئۇچۇرلارنى ساقلايدىغان كىچىك كارتا.\n\nبۇ ئۇچۇر ئۈسكۈنىنى مەلۇم بىر carrier بىلەن باغلايدۇ ۋە ئۈسكۈنىنىڭ:\n- تېلېفون قىلىش\n- قىسقا ئۇچۇر ئەۋەتىش\n- mobile data ئىشلىتىش\nئىقتىدارلىرىنى قوللايدۇ.\n\n### Activation — مۇلازىمەتنى قوزغىتىش\n\n**Activation** — SIM دا ساقلانغان ئۇچۇرلارنى ئىشلىتىپ، ئۈسكۈنىنى carrier نىڭ ھۈجەيرىلىك تورىغا ئۇلىنىشقا تەييارلاش جەريانىدۇر.\n\nSIM قوزغىتىلمىغۇچە ئۈسكۈنە ئېچىلىشى مۇمكىن، ئەمما تولۇق cellular ئىقتىدارلىرى ئىشلىمەسلىكى مۇمكىن.\n\n### Provisioning — تور مۇلازىمىتىنى تەڭشەش\n\n**Provisioning** — carrier نىڭ شۇ ئۈسكۈنىگە تەمىنلەيدىغان تور مۇلازىمەتلىرىنى تەڭشەش جەريانىدۇر.\n\nProvisioning ئارقىلىق تۆۋەندىكى مۇلازىمەتلەرنىڭ قايسىلىرى بارلىقى ياكى قانداق چەكلىنىدىغانلىقى بېكىتىلىشى مۇمكىن:\n- ئاۋازلىق تېلېفون\n- قىسقا ئۇچۇر\n- سانلىق مەلۇمات چەكلىمىسى\n- roaming ئىقتىدارى\n\n### Portability — SIM نى ئۈسكۈنىلەر ئارىسىدا يۆتكەش\n\nSIM subscriber ئۇچۇرىنى ساقلىغانلىقى ئۈچۈن، كۆپ ئەھۋالدا ئۇنى بىر ماس كېلىدىغان ئۈسكۈنىدىن يەنە بىر ماس كېلىدىغان ئۈسكۈنىگە يۆتكەشكە بولىدۇ.\n\nمەنبە بويىچە، ئىككى ئۈسكۈنە:\n- carrier lock دىن خالىي، يەنى unlocked بولسا\n- تور تەرىپىدىن قوللانسا\nئىشلەتكۈچى carrier نى ئۆزگەرتمەي تۇرۇپ تېلېفون ئالماشتۇرالايدۇ.\n\nشۇڭا replacement device قا SIM نى يۆتكەش بەزى ئەھۋالدا cellular مۇلازىمىتىنى تېز ئەسلىگە كەلتۈرەلەيدۇ.\n\nبەزى ئۈسكۈنىلەر مەلۇم بىر carrier غا **locked** بولىدۇ؛ بۇنداق ئۈسكۈنە پەقەت شۇ carrier نىڭ SIM كارتىسىنى قوبۇل قىلىدۇ.\n\n**Unlocked** ئۈسكۈنە بولسا، تور ماس كەلسە بىر نەچچە carrier نىڭ SIM كارتىسى بىلەن ئىشلىيەلەيدۇ.\n\nبۇ پەرق cellular connectivity مەسىلىسىنى تەكشۈرگەندە ياكى ئىشلەتكۈچى service provider نى ئالماشتۇرغاندا مۇھىم.\n\n### eSIM — Embedded SIM\n\neSIM فىزىكىلىق SIM كارتىسىغا ئوخشاش ئاساسىي ۋەزىپىنى ئورۇندايدۇ، ئەمما ئۇ چىقىرىۋالغىلى بولىدىغان كارتا ئەمەس؛ ئۈسكۈنىنىڭ قاتتىق دېتالىغا ئىچىدىن بىرلەشتۈرۈلگەن.\n\nشۇڭا eSIM ئىشلەتكەندە سېلىپ-چىقىرىدىغان فىزىكىلىق كارتا بولمايدۇ.\n\neSIM دا activation ۋە provisioning رەقەملىك ئۇسۇلدا ئەمەلگە ئاشۇرۇلىدۇ.\n\nئىشلەتكۈچى carrier profile نى بىۋاسىتە ئۈسكۈنىگە چۈشۈرۈپ، دۇكانغا بارماي ياكى SIM كارتا سالمايلا مۇلازىمەتنى قوزغىتالايدۇ.\n\nمەنبەدە eSIM نىڭ تۆۋەندىكى ئەھۋاللارغا ئالاھىدە قولايلىق ئىكەنلىكى بايان قىلىنغان:\n- ئۈسكۈنىنى تېز تەڭشەش\n- carrier نى دائىم ئالماشتۇرۇش\n- بىر ۋاقىتتا بىر نەچچە cellular plan نى قوللاش\n\neSIM بىلەن portability فىزىكىلىق كارتا يۆتكەش ئارقىلىق ئەمەس، بەلكى carrier profile نى قوشۇش ياكى ئۆچۈرۈش ئارقىلىق software سەۋىيەسىدە باشقۇرۇلىدۇ.\n\nبۇ تېخىمۇ ئەۋرىشىم ۋە قولايلىق، ئەمما ئۈسكۈنە eSIM نى قوللىشى ۋە carrier نىڭ eSIM سىستېمىسى بىلەن ماس كېلىشى كېرەك.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## Mobile Hotspot ئۇلىنىشى (Hotspot Connectivity)\n\nMobile hotspot — ئادەتتىكى تور ئۇلىنىشى يوق ۋاقىتتا، كۆچمە ئۈسكۈنىنىڭ cellular data ئۇلىنىشىنى ئىشلىتىپ باشقا ئۈسكۈنىلەرگە Wi‑Fi تورى تەمىنلەيدىغان ئىقتىدار.\n\nمەنبەدىكى مىسالدا، Wi‑Fi يوق بىر قەھۋەخانىدا خاتىرە كومپيۇتېردىن ئېلېكترونلۇق خەت ئەۋەتىش كېرەك بولسا، ئەقلىي تېلېفوننىڭ hotspot ئىقتىدارىنى ئىشلىتىشكە بولىدۇ.\n\nHotspot قوزغىتىلغاندا:\n1. ئەقلىي تېلېفون ئۆزىنىڭ cellular data ئۇلىنىشىنى ئىشلىتىدۇ.\n2. شەخسىي Wi‑Fi تورى تارقىتىدۇ.\n3. خاتىرە كومپيۇتېر شۇ Wi‑Fi تورىغا ئۇلىنىدۇ.\n4. خاتىرە كومپيۇتېر تېلېفوننىڭ data plan ى ئارقىلىق ئىنتېرنېتكە چىقىدۇ.\n\n### Hotspot نى تەڭشەش\n\nئادەتتىكى جەريان:\n1. ئەقلىي تېلېفوننىڭ Settings قىسمىغا كىرىڭ.\n2. Hotspot ئىقتىدارىنى قوزغىتىڭ.\n3. تېلېفون Wi‑Fi سىگنالى تارقىتىشنى باشلايدۇ.\n4. خاتىرە كومپيۇتېردا Wi‑Fi تور تىزىملىكىنى ئېچىڭ.\n5. تېلېفوننىڭ hotspot تور نامىنى تاللاپ ئۇلىنىڭ.\n\nئۇلانغاندىن كېيىن خاتىرە كومپيۇتېر:\n- تور كۆرەلەيدۇ\n- سىن/ئاۋاز مەزمۇنىنى تارقىتىپ كۆرەلەيدۇ\n- تور يىغىنىغا قاتنىشالايدۇ\n\nئەمما بۇ سانلىق مەلۇماتنىڭ ھەممىسى تېلېفوننىڭ data plan ىدىن ئىشلىتىلىدۇ. شۇڭا data usage قا دىققەت قىلىش كېرەك.\n\nمەنبەدە hotspot نى تەڭشەشنىڭ باشقا شەكىللىرىمۇ بولۇشى مۇمكىنلىكى، بۇ مىسالنىڭ پەقەت ئەڭ كۆپ ئۇچرايدىغان ئۇسۇلنى كۆرسىتىدىغانلىقى ئېيتىلغان.\n\n### Hotspot نى ئىشلىتىپ بولغاندىن كېيىن\n\nHotspot ئىقتىدارى باتارېيەنى تېزرەك خورىتىشى مۇمكىن. ئۇزاق ۋاقىت ئىشلىتىلسە، ئۈسكۈنىنى زەرەتلىگۈچكە ئۇلاپ قويۇش پايدىلىق بولۇشى مۇمكىن.\n\nئىش تۈگىگەندە hotspot نى توختىتىش:\n- mobile data سەرپىياتىنى ئازايتىدۇ\n- باتارېيەنى تېجەيدۇ\n- ئۇلىنىشنىڭ بىخەتەرلىكىنى ياخشىلاشقا ياردەم بېرىدۇ\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## Wi‑Fi ئۇلىنىشى (Wi‑Fi Connectivity)\n\nHotspot cellular data ئارقىلىق يېڭى Wi‑Fi تورى قۇرسا، Wi‑Fi connectivity نىڭ مەقسىتى ئاللىبۇرۇن بار بولغان سىمسىز تورغا ئۇلىنىشتۇر.\n\nئەقلىي تېلېفون، تاختا كومپيۇتېر ۋە خاتىرە كومپيۇتېر Wi‑Fi ئارقىلىق:\n- ئۆي router ى\n- كارخانا\n- مەكتەپ\n- ئاممىۋى access point\nتەمىنلىگەن يەرلىك سىمسىز تورغا ئۇلىنالايدۇ.\n\nWi‑Fi غا ئۇلانغاندىن كېيىن ئۈسكۈنە cellular data غا تايانماي:\n- ئىنتېرنېتكە\n- يەرلىك تور مەنبەلىرىگە\nزىيارەت قىلالايدۇ.\n\nمەنبەدىكى ئاددىي مىسال: ئۆيگە كەلگەندە خاتىرە كومپيۇتېرنىڭ ئۆيدىكى Wi‑Fi تورىغا ئاپتوماتىك ئۇلىنىشى.\n\nHotspot تىن پەرقلىق ھالدا، بۇ تورنى ئالدىن بار بولغان wireless router تەمىنلەيدۇ؛ router بولسا cable ياكى fiber غا ئوخشاش سىملىق مۇلازىمەت ئارقىلىق ئىنتېرنېتكە ئۇلانغان بولۇشى مۇمكىن.\n\nمەنبە Wi‑Fi نىڭ cellular data plan غا تايانمايدىغانلىقى ئۈچۈن كۆپ ئەھۋالدا:\n- تېزرەك\n- مۇقىمراق\n- mobile data allowance نى خورىتمايدىغان\nئۇلىنىش بولالايدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### Wi‑Fi تورىغا ئۇلىنىش\n\nئادەتتىكى جەريان:\n1. ئۈسكۈنىنىڭ Wi‑Fi تەڭشەكلىرىنى ئېچىڭ.\n2. بار بولغان سىمسىز تورلار تىزىملىكىنى كۆرۈڭ.\n3. توغرا تور نامىنى تاللاڭ.\n4. تور قوغدالغان بولسا security key ياكى password نى كىرگۈزۈڭ.\n5. كىملىك دەلىللەنگەندىن كېيىن ئۈسكۈنە ئۇلىنىش قۇرۇپ، سانلىق مەلۇمات يەتكۈزۈشنى باشلايدۇ.\n\nكۆپىنچە كۆچمە ئۈسكۈنە ئىشەنچلىك، بۇرۇن ئۇلانغان تورلارنى ئەستە ساقلاپ، شۇ تور دائىرىسىگە قايتا كىرگەندە ئاپتوماتىك ئۇلىنالايدۇ.\n\nWi‑Fi نى قوزغىتىش ياكى توختىتىش ئارقىلىق:\n- باتارېيە سەرپىياتىنى ئازايتىش\n- ئىشەنچسىز تورلاردىن ساقلىنىش\n- زۆرۈر بولسا ئۈسكۈنىنى cellular data غا قايتۇرۇش\nمۇمكىن.\n\nTroubleshooting جەريانىدا Wi‑Fi نىڭ قانداق ئىشلەيدىغانلىقى ۋە ئۇنىڭ hotspot ياكى cellular data بىلەن قانداق مۇناسىۋەتتە ئىكەنلىكىنى چۈشىنىش توغرا چارىگە تېزرەك يېتىشكە ياردەم بېرىدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## Bluetooth جۈپلەش (Bluetooth Pairing)\n\nBluetooth — ئۈسكۈنىلەر ئارىسىدا سىمسىز سانلىق مەلۇمات ئالماشتۇرۇشقا يول قويىدىغان تېخنىكا.\n\nBluetooth ئارقىلىق ئەقلىي تېلېفون، كومپيۇتېر، تىڭشىغۇچ، ياڭراتقۇ ۋە ماشىنا ئاۋاز سىستېمىسىغا ئوخشاش ئۈسكۈنىلەرنى سىمسىز ئۇلاشقا بولىدۇ.\n\n**Pairing، يەنى جۈپلەش** — Bluetooth ئىقتىدارى بار ئىككى ئۈسكۈنە ئارىسىدا بىخەتەر سىمسىز ئۇلىنىش قۇرۇپ، ئۇلارنىڭ بىر-بىرى بىلەن ئالاقە قىلىشىغا يول قويۇش جەريانىدۇر.\n\n### Bluetooth جۈپلەش قەدەملىرى\n\n1. بىرىنچى ئۈسكۈنىنىڭ Settings قىسمىدىن Bluetooth نى قوزغىتىڭ.\n2. ئۇلىماقچى بولغان ئىككىنچى Bluetooth ئۈسكۈنىسىنى **pairing mode** قا كىرگۈزۈڭ.\n3. بىرىنچى ئۈسكۈنىنىڭ Bluetooth تەڭشەكلىرىگە قايتىپ، يېڭى ئۈسكۈنىلەرنى ئىزدەڭ.\n4. ئىككىنچى ئۈسكۈنە تىزىملىكتە كۆرۈنگەندە، ئۇنى تاللاپ pairing نى باشلاڭ.\n5. تەلەپ قىلىنسا، **PIN code** نى كىرگۈزۈپ جۈپلەشنى تاماملاڭ.\n\nمەنبەدىكى مىسال بويىچە، Bluetooth تىڭشىغۇچنى pairing mode قا كىرگۈزۈش ئۈچۈن power button نى ئۇزۇن بېسىشقا توغرا كېلىشى مۇمكىن.\n\nPIN code كىرگۈزۈش جۈپلەش جەريانىدىكى قوشۇمچە بىخەتەرلىك قەدىمى بولۇپ، توغرا رۇخسىتى بار ئىشلەتكۈچىنىڭلا ئۈسكۈنىلەر ئارىسىدا ئۇلىنىش قۇرۇشىغا ياردەم بېرىدۇ.\n\nبۇ بولۇپمۇ ئاممىۋى جايدا نۇرغۇن Bluetooth ئۈسكۈنىلىرى بار ۋاقىتتا خاتا ياكى رۇخسەتسىز ئۇلىنىش خەۋپىنى ئازايتىشقا ياردەم بېرىدۇ.\n\nبىر قېتىم مۇۋەپپەقىيەتلىك جۈپلەنگەندىن كېيىن، ئۈسكۈنىلەر pairing نى ئۆچۈرمىگۈچە ياكى بىر-بىرىنى تىزىملىكتىن چىقىرىۋەتمىگۈچە ئادەتتە بىر-بىرىنى ئەستە ساقلايدۇ. شۇڭا ھەر قېتىم قايتا تەڭشەشنىڭ ھاجىتى بولمايدۇ.\n\nBluetooth نى ئىشلىتىۋاتمىغاندا توختىتىش:\n- باتارېيەنى تېجەيدۇ\n- بىخەتەرلىكنى كۈچەيتىشكە ياردەم بېرىدۇ\n- رۇخسەتسىز Bluetooth ئۇلىنىشلىرىنىڭ قۇرۇلۇشىنى چەكلەيدۇ\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## ئورۇن مۇلازىمىتى (Location Services)\n\nLocation services كۆچمە ئۈسكۈنىنىڭ ئۆزىنىڭ قەيەردە ئىكەنلىكىنى بەلگىلىشىگە ۋە ئەپ/ئىقتىدارلارنى شۇ ئورۇنغا ماسلاشتۇرۇشىغا ياردەم بېرىدۇ.\n\nمەنبەدە ئورۇننى بېكىتىشتە GPS، cellular signal ۋە باشقا سىگنال مەنبەلىرىنىڭ ئىشلىتىلىدىغانلىقى چۈشەندۈرۈلگەن.\n\n### GPS — Global Positioning System\n\nGPS — يەر شارى ئەتراپىدا ئايلىنىدىغان سۈنئىي ھەمراھلار تورى بولۇپ، ئورۇن ۋە ۋاقىت ئۇچۇرىنى تارقىتىدۇ.\n\nئەقلىي تېلېفون ئىچىدىكى GPS receiver بىر نەچچە سۈنئىي ھەمراھنىڭ سىگنالىنى قوبۇل قىلىپ، شۇ ئۇچۇرلار ئارقىلىق ئۈسكۈنىنىڭ ئورنىنى ھېسابلايدۇ.\n\nمەنبە بويىچە، ئۈسكۈنە قانچە كۆپ سۈنئىي ھەمراھ سىگنالىنى قوبۇل قىلسا، ئورۇننى بېكىتىش دەللىكى شۇنچە ياخشىلىنىدۇ.\n\nشۇڭا GPS ئادەتتە ئوچۇق ئاسمان كۆرۈنىدىغان سىرتقى مۇھىتتا تېخىمۇ ياخشى ئىشلەيدۇ.\n\n### Cellular Triangulation\n\nGPS تىن باشقا، مەنبەدە cellular signal ئارقىلىق **device triangulation** قىلىش چۈشەندۈرۈلگەن.\n\nكۆچمە ئۈسكۈنە يېقىن ئەتراپتىكى cell tower لار بىلەن ئالاقە قىلىدۇ. بىر نەچچە مۇنارغا بولغان سىگنال كۈچىنى ئۆلچەش ئارقىلىق ئۈسكۈنىنىڭ تەخمىنىي ئورنىنى باھالاشقا بولىدۇ.\n\nمەنبەدە ئۈسكۈنە قانچە كۆپ tower نى كۆرەلسە، ئورۇننى تېخىمۇ ئېنىق باھالاشقا بولىدىغانلىقى بايان قىلىنغان.\n\n### مەخپىيەتلىك ۋە ئەپ رۇخسەتلىرى\n\nNavigation، weather ۋە ride-sharing ئەپلىرىگە ئوخشاش نۇرغۇن ئەپ نورمال ئىشلىشى ئۈچۈن ئورۇن ئۇچۇرىغا ئېھتىياجلىق.\n\nكۆچمە مەشغۇلات سىستېمىسى ئىشلەتكۈچىگە قايسى ئەپنىڭ location data غا زىيارەت قىلالايدىغانلىقىنى كونترول قىلىش ئىمكانى بېرىدۇ.\n\nھەر بىر ئەپكە ئايرىم رۇخسەت بېرىش ياكى رەت قىلىش ئارقىلىق:\n- زۆرۈرسىز ئىز قوغلاش خەۋپىنى ئازايتىش\n- شەخسىي مەخپىيەتلىكنى قوغداش\nمۇمكىن.\n\n### Location Accuracy — ئورۇن دەللىكى\n\nكۆچمە ئۈسكۈنىلەردە ئورۇن دەللىكى بىلەن باتارېيە سەرپىياتى ئارىسىدا تەڭپۇڭلۇق ساقلايدىغان تاللانمىلار بولۇشى مۇمكىن.\n\n**High accuracy mode** ئورۇننى بېكىتىش ئۈچۈن بىر نەچچە سىگنال مەنبەسىنى بىرلەشتۈرىدۇ:\n- GPS\n- Wi‑Fi\n- Bluetooth\n- cellular network\n\nبۇ ھالەت ئەڭ ئېنىق ئورۇن ئۇچۇرىنى تەمىنلەيدۇ، ئەمما تېخىمۇ كۆپ باتارېيە سەرپ قىلىدۇ.\n\nباشقا ھالەتلەر باتارېيەنى تېجەش ئۈچۈن ئىشلىتىدىغان تېخنىكىلارنى چەكلىشى مۇمكىن.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## كۆچمە ئۈسكۈنىلەرنى باشقۇرۇش (Mobile Device Management)\n\n**Enterprise Mobility Management (EMM)** — كارخانا مۇھىتىدا كۆچمە ئۈسكۈنىلەرنى بىخەتەر ئىشلىتىش ۋە باشقۇرۇش ئۈچۈن قوللىنىلىدىغان ئومۇميۈزلۈك ئۇسۇل.\n\nبۇ ئۇسۇل كۆچمە ئۈسكۈنىنى قوغداش بىلەن بىر ۋاقىتتا، شەخسىي سانلىق مەلۇمات بىلەن كارخانا سانلىق مەلۇماتىنى ئايرىم تۇتۇشقا ياردەم بېرىدىغان بىر قاتار مۇلازىمەت ۋە تېخنىكىلارغا تايىنىدۇ.\n\nكارخانا ئەقلىي تېلېفون، تاختا كومپيۇتېر ۋە خاتىرە كومپيۇتېرغا تېخىمۇ كۆپ تايانغانسېرى، EMM ئارقىلىق بۇ ئۈسكۈنىلەرنىڭ:\n- قانداق تەڭشىلىدىغانلىقى\n- قانداق قوغدىلىدىغانلىقى\n- كارخانا مەنبەلىرىگە قانداق زىيارەت قىلىدىغانلىقى\nنى تەرتىپلىك باشقۇرغىلى بولىدۇ.\n\nخىزمەتچىلەر ھەر خىل جايدىن ۋە ھەر خىل ئۈسكۈنىدىن سەزگۈر كارخانا ئۇچۇرلىرىغا زىيارەت قىلغاندا، مەركەزلەشكەن باشقۇرۇش بولمىسا بىخەتەرلىك ۋە بىر خىللىقنى ساقلاش قىيىنلىشىدۇ.\n\nمەنبەدە EMM نىڭ تەشكىلاتقا:\n- خەۋپنى ئازايتىش\n- compliance تەلەپلىرىگە ئەمەل قىلىش\n- ئەۋرىشىم خىزمەت مۇھىتىنى قوللاش\n- ئاخىرقى ئىشلەتكۈچى ئۈچۈن ئۈسكۈنىنى ئىشلىتىشكە قولايلىق ۋە ئۈنۈملۈك ساقلاش\nجەھەتلەردە ياردەم بېرىدىغانلىقى بايان قىلىنغان.\n\n### MDM — Mobile Device Management\n\nEMM نىڭ مەركىزىدىكى مۇھىم تېخنىكىلارنىڭ بىرى **MDM (Mobile Device Management)**.\n\nMDM ئارقىلىق IT باشقۇرغۇچىلار كۆچمە ئۈسكۈنىلەرنى:\n- كونترول قىلىدۇ\n- بىخەتەرلەشتۈرىدۇ\n- قائىدە-سىياسەتلەرنى مەجبۇرىي يولغا قويىدۇ\n\nئۈسكۈنە قەيەردە تۇرۇشىدىن قەتئىينەزەر، MDM ئارقىلىق يىراقتىن:\n- ئۈسكۈنە تەڭشەكلىرىنى بېكىتىش\n- بىخەتەرلىك تەلەپلىرىنى قوللىنىش\n- ئۈسكۈنىنىڭ كارخانا سىستېمىسى بىلەن قانداق ئىشلىشىنى باشقۇرۇش\nمۇمكىن.\n\n### ئۈسكۈنە تەڭشەش (Device Configuration)\n\nMDM نىڭ مۇھىم ۋەزىپىلىرىنىڭ بىرى ئۈسكۈنىنى كارخانا ئۆلچىمىگە ماس قىلىپ تەڭشەش.\n\nئۈسكۈنە MDM غا قوشۇلغاندا، تۆۋەندىكى تەڭشەكلەرنى ئاپتوماتىك قوللىنىشقا بولىدۇ:\n- email ھېساباتى\n- Wi‑Fi زىيارىتى\n- VPN ئۇلىنىشى\n- password تەلىپى\n- screen lock تەڭشىكى\n- encryption\n\nبۇ تەڭشەكلەرنى ئاپتوماتلاشتۇرۇش:\n- ئۈسكۈنىلەر ئارىسىدىكى بىر خىللىقنى ياخشىلايدۇ\n- قولدا تەڭشەش خىزمىتىنى ئازايتىدۇ\n- configuration خاتالىقىنى تۆۋەنلىتىدۇ\n\n### ئۈسكۈنە ئىگىدارلىق مودېللىرى (Device Ownership Models)\n\nMDM نىڭ قانچىلىك دەرىجىدە كونترول قىلىشى ئۈسكۈنىنىڭ كىمگە تەۋە ئىكەنلىكىگە باغلىق.\n\n**Corporate-owned — كارخانا ئىگىدارلىقىدىكى ئۈسكۈنە**\nكارخانا ئۈسكۈنىگە ئىگە بولىدۇ ۋە MDM ئارقىلىق پۈتۈن ئۈسكۈنىگە كەڭ باشقۇرۇش كونتروللىرىنى قوللىنالايدۇ.\n\n#### COPE — Corporate-Owned, Personally Enabled\n\nCOPE مودېلىدا:\n- ئۈسكۈنىگە كارخانا ئىگە\n- خىزمەتچىگە چەكلىك شەخسىي ئىشلىتىش رۇخسىتى بېرىلىدۇ\n- IT تەڭشەك، بىخەتەرلىك سىياسىتى ۋە كارخانا سانلىق مەلۇماتى ئۈستىدە كۈچلۈك كونترولنى ساقلايدۇ\n\n#### CYOD — Choose Your Own Device\n\nCYOD مودېلىدا:\n- خىزمەتچى كارخانا تەستىقلىغان ئۈسكۈنە تىزىملىكىدىن بىرنى تاللايدۇ\n- ئۈسكۈنىنىڭ ئىگىدارلىقى ۋە باشقۇرۇش كونتروللۇقى كارخانىدا قالىدۇ\n\nبۇ ئۇسۇل ئىشلەتكۈچىگە مەلۇم دەرىجىدە تاللاش ئەركىنلىكى بېرىدۇ، شۇنىڭ بىلەن بىر ۋاقىتتا IT قوللاش مۇرەككەپلىكىنى چەكلەپ، بىخەتەرلىك ئۆلچىمىنى بىر خىل ساقلاشقا ياردەم بېرىدۇ.\n\n#### BYOD — Bring Your Own Device\n\nBYOD مودېلىدا:\n- ئۈسكۈنىگە خىزمەتچىنىڭ ئۆزى ئىگە\n- ئۈسكۈنە خىزمەت ئىشلىرى ئۈچۈن ئىشلىتىلىدۇ\n- تەشكىلات ئاساسلىقى كارخانا سانلىق مەلۇماتىنى قوغداش ئۈچۈن چەكلىك باشقۇرۇش كونتروللىرىنى قوللىنىدۇ\n\nئۈسكۈنە ئىشلەتكۈچىنىڭ شەخسىي مۈلكى بولغاچقا، BYOD مۇھىتىدىكى MDM سىياسەتلىرى ئادەتتە پۈتۈن ئۈسكۈنىنى باشقۇرۇشتىن كۆرە، خىزمەتكە مۇناسىۋەتلىك سانلىق مەلۇماتنى قوغداشقا مەركەزلىشىدۇ.\n\n### سىياسەتنى مەجبۇرىي يولغا قويۇش (Policy Enforcement)\n\nMDM سىياسەتلىرى باشقۇرۇلۇۋاتقان ئۈسكۈنىدە ئىشلەتكۈچىنىڭ نېمە قىلالايدىغانلىقى ۋە نېمە قىلالمايدىغانلىقىنى بەلگىلەيدۇ.\n\nسىياسەتلەر:\n- كۈچلۈك password تەلەپ قىلىش\n- بەزى ئۈسكۈنە ئىقتىدارلىرىنى چەكلەش\n- تەستىقلانمىغان ئەپلەرنى توسۇش\n- يوقاپ كەتكەن ياكى ئوغرىلانغان ئۈسكۈنىنى يىراقتىن قۇلۇپلاش\n- ئۈسكۈنىدىكى سانلىق مەلۇماتنى يىراقتىن ئۆچۈرۈش (remote wipe)\nقاتارلىق تەدبىرلەرنى ئۆز ئىچىگە ئېلىشى مۇمكىن.\n\nبۇ سىياسەتلەر ئۈسكۈنە كونترول قىلىنغان ئىشخانا مۇھىتىنىڭ سىرتىدا ئىشلىتىلسىمۇ بىخەتەرلىك ئۆلچىمىنىڭ ساقلىنىشىغا ياردەم بېرىدۇ.\n\n### كارخانا ئەپلىرىنى تارقىتىش ۋە باشقۇرۇش\n\nMDM ئارقىلىق تەشكىلات:\n- تەستىقلانغان ئەپلەرنى ئورنىتىش\n- ئەپلەرنى يېڭىلاپ تۇرۇش\n- زىيارەت ھوقۇقى قالمايدىغان ۋاقىتتا ئەپنى ئۆچۈرۈش\nئىشلىرىنى مەركەزلەشتۈرۈپ باشقۇرالايدۇ.\n\nبۇ خىزمەتچىلەرنىڭ قوللانغان software ىنىڭ تەستىقلانغان ۋە قوللىنىدىغان نەشر بولۇشىغا ياردەم بېرىپ، رۇخسەتسىز ياكى زىيانلىق ئەپلەرنىڭ خەۋپىنى ئازايتىدۇ.\n\nئومۇمەن، MDM ئارقىلىق قوللانغان EMM زامانىۋى كۆچمە خىزمەت جەريانىنى تېخىمۇ بىخەتەر قوللاشقا ياردەم بېرىدۇ.\n\nExam Objective 1.3\nبىر ئەھۋال بېرىلگەندە، كۆچمە ئۈسكۈنىنىڭ ئاساسىي تور ئۇلىنىشىنى تەڭشەڭ ۋە ئەپلەرنى ئىشلىتىشكە مۇناسىۋەتلىك ياردەم بىلەن تەمىنلەڭ.\n\n## كۆچمە ئۈسكۈنىدە ماسقەدەملەش (Mobile Device Synchronization)\n\n**Synchronization، يەنى ماسقەدەملەش** — ئەقلىي تېلېفون، تاختا كومپيۇتېر ۋە خاتىرە كومپيۇتېرغا ئوخشاش بىر نەچچە ئۈسكۈنىدە ئوخشاش سانلىق مەلۇماتنى بىردەك ۋە ئەڭ يېڭى ھالەتتە ساقلاش جەريانى.\n\nماسقەدەملەش نورمال ئىشلىسە، بىر ئۈسكۈنىدە قىلىنغان ئۆزگىرىش باشقا ئۈسكۈنىلەردىمۇ ئاپتوماتىك ئەكس ئېتىدۇ. بۇ ئىشلەتكۈچىنىڭ مۇھىم ئۇچۇرلىرىنى يوقاتماي بىر ئۈسكۈنىدىن يەنە بىرىگە يۆتكىلىپ ئىشلىشىگە ياردەم بېرىدۇ.\n\nزامانىۋى كۆچمە مۇھىتتا synchronization ئادەتتە user account ۋە cloud service بىلەن باغلانغان.\n\nئىشلەتكۈچى بىر ھېسابات بىلەن ئۈسكۈنىگە كىرگەندە، شۇ ھېسابات تۆۋەندىكى سانلىق مەلۇماتلارنى ماسقەدەملەيدىغان مەركىزى نۇقتا بولىدۇ:\n- calendar\n- contact\n- email\n- file\n\nSynchronization قوزغىتىلغان ۋە ئۈسكۈنىنىڭ تور ئۇلىنىشى بار بولسا، سانلىق مەلۇمات ئارقا كۆرۈنۈشتە داۋاملىق يېڭىلىنىپ تۇرىدۇ.\n\n### Data Cap — سانلىق مەلۇمات چەكلىمىسى\n\nWi‑Fi يوق ۋاقىتتا كۆچمە ئۈسكۈنە cellular data ئىشلىتىشى مۇمكىن. Cellular data plan دا ئىشلىتىش چەكلىمىسى بولۇشى مۇمكىن.\n\nچوڭ ھۆججەت ياكى media غا ئوخشاش كۆپ سانلىق مەلۇماتنى ماسقەدەملەش data allowance نى تېز خورىتىشى مۇمكىن.\n\nشۇڭا بەزى ئۈسكۈنىلەر synchronization نى پەقەت Wi‑Fi بار ۋاقىتتا ئىشلەيدىغان قىلىپ چەكلەشكە يول قويىدۇ. بۇ ئارتۇقچە mobile data ئىشلىتىش ۋە كۈتۈلمىگەن ھەقنىڭ ئالدىنى ئېلىشقا ياردەم بېرىدۇ.\n\n### Calendar ۋە Contact ماسقەدەملەش\n\n**Calendar synchronization**:\n- appointment\n- meeting\n- reminder\nئۇچۇرلىرىنى بىر نەچچە ئۈسكۈنىدە بىردەك ساقلايدۇ.\n\nبىر ئۈسكۈنىدە meeting قوشۇلسا ياكى ئۆزگەرتىلسە، باشقا ئۈسكۈنىلەردىمۇ ئاپتوماتىك يېڭىلىنىدۇ.\n\n**Contact synchronization** بولسا:\n- تېلېفون نومۇرى\n- email ئادرېسى\n- باشقا ئالاقە ئۇچۇرلىرى\nنى ئىشلەتكۈچى شۇ ھېسابات بىلەن كىرگەن ئۈسكۈنىلەرنىڭ ھەممىسىدە يېڭى ھالەتتە ساقلايدۇ.\n\n### Email ۋە Cloud Storage ماسقەدەملەش\n\nEmail synchronization ئارقىلىق بىر ئۈسكۈنىدە:\n- ئوقۇلغان\n- ئۆچۈرۈلگەن\nخەتنىڭ ھالىتى باشقا ئۈسكۈنىلەردىمۇ ئوخشاش ئەكس ئېتىدۇ.\n\nCloud storage synchronization بولسا ھۆججەتلەرنى مەركەزلىك ساقلاپ، بىر نەچچە ئۈسكۈنىدىن زىيارەت قىلىشقا يول قويىدۇ.\n\nبىر ئۈسكۈنىدىن upload قىلىنغان ھۆججەتنى يەنە بىر ئۈسكۈنىدە:\n- چۈشۈرۈش\n- ئېچىش\n- تەھرىرلەش\nمۇمكىن.\n\nمەنبەدە cloud storage نىڭ زامانىۋى كۆچمە خىزمەت جەريانىدىكى مۇھىم تەركىب ئىكەنلىكى تەكىتلەنگەن.\n\nئەمما چوڭ ھۆججەتلەرنى ماسقەدەملەش:\n- ساقلاش بوشلۇقىغا\n- data usage قا\nتەسىر قىلىدۇ. شۇڭا data cap ۋە sync تەڭشەكلىرىنى چۈشىنىش مۇھىم.\n"}, {"id": "2.1", "number": "2.1", "domain": "2", "domain_en": "Networking", "domain_ug": "تور", "english": "Exam objective 2.1, compare and contrast TCP and UDP ports, protocols, and their purposes. Networking protocols. With this video segment, we will be kicking off our study of the second domain of the Comp-TA plus core one certification exam.\n\nThis domain will be all about computer networking. If you completed our Tech+ course, you have already been introduced to many foundational networking concepts, and that baseline knowledge is expected as we move deeper into networking topics in this domain. With that said, let's jump into domain two, feed first.\n\nNetworking in the context of IT refers to the practice of connecting two or more computing devices together by some form of transmission medium in order to share resources and information. This connection can be established over wired or wireless mediums and enables devices to communicate and transfer data efficiently. Networking forms the backbone of modern IT infrastructure, allowing for functionalities like internet access, file sharing, and collaborative work environments.\n\nNow, onto networking protocols. A network protocol is a set of rules and standards that govern the exchange of information between devices or systems. It defines how data is transmitted, received, interpreted, and acted upon during communication.\n\nJust as we follow social norms to interact with others effectively, devices on a network adhere to specific protocols to ensure seamless communication. Think of protocols as a common language that devices use to understand and interpret each other's messages. Protocols also define how devices identify one another and how errors are handled.\n\nThey provide a structured framework that allows devices to communicate in a reliable and standardized manner. Without protocols, communication across networks would be chaotic and prone to errors. Can you imagine trying to have a conversation where everyone is speaking a different language?\n\nIt would be confusing, inefficient, and communication would quickly break down, which is exactly what happens on a network without protocols. Lastly, we'll discuss networking ports. A network port is a virtual point where network connections start and end.\n\nPorts are identified by port numbers, with each port number indicating a specific service or protocol. For instance, HTTP, the protocol for unencrypted web traffic typically uses port 80, while emails sent by the SMTP protocol will use port 25 by default. Understanding ports is paramount in network configuration and security, as managing these ports can control the flow of data and protect against unauthorized access.\n\nBy grasping these fundamental concepts of networking, protocols, and ports, you're well on your way to building a strong foundation in IT networking. This knowledge is not only important for your CompTIA A plus Core 1 exam, but also essential for a successful career in information technology. Exam objective 2.1, compare and contrast TCP and UDP ports, protocols, and their purposes.\n\nPorts and protocols. In this video segment, we're going to explore some of the most common networking protocols and their default port numbers. Whether you're new to this topic or looking to refresh your knowledge, you're in the right place.\n\nMy goal isn't to make you an expert by the end of this video segment, but to provide you with a basic understanding of each protocol's main purpose and their associated default port number, as that will be sufficient enough knowledge for this stage in your certification journey. To kick things off, let's start with the file transfer protocol, commonly known as FTP. This is a standard network protocol designed for transferring files between devices over a network connection.\n\nEssentially, FTP enables users to upload files from their local computer to a remote server or download files from a server to their computer. While FTP is a popular choice for its efficiency in file transfer, it's important to note that it has significant security limitations, particularly because it does not encrypt data. FTP typically uses two ports, port 20 and port 21.\n\nPort 21 is used for establishing a connection between the client and the server, often referred to as the control port. Through this port, commands and responses are exchanged. Port 20, on the other hand, is known as the data port, and it's used for the actual transfer of files.\n\nThe lack of encryption in FTP means that data, including potentially sensitive information like usernames and passwords, is transmitted in plain text. This makes it vulnerable to interception and unauthorized access. Moving on to the next protocol in the CompTIA AE plus core one exam objectives, we have secure shell, or SSH.\n\nThis protocol provides a secure method for accessing a remote computer or server. It's widely used for executing remote commands through the command line interface, or CLI. SSH stands out for its robust security, encrypting all data to prevent unauthorized access.\n\nIt primarily operates on port 22, which handles both the secure connection establishment and encrypted data transfers. This encryption ensures the confidentiality of all communications, including login details. Next up is Telnet, a protocol that shares many similarities with SSH, but with a key difference, it lacks security features.\n\nTelnet is another method used for accessing remote computers or servers, allowing users to remotely log into another computer over a network and execute CLI commands. However, Telnet transmits all data, including login credentials in plain text, making it susceptible to eavesdropping and unauthorized access. This lack of encryption starkly contrasts with SSH, which secures data transmission.\n\nTypically, Telnet operates on port 23. Its unsecured nature makes it less ideal for sensitive operations, especially in environments where data security is a priority. Continuing on, we have simple mail transfer protocol, or SMTP.\n\nThis protocol is used for sending emails from a client to a server or between servers. When you compose an email and click send, your email client uses SMTP to transfer that email to the desired email server for delivery. There it is stored until the recipient checks their inbox.\n\nWhile SMTP effectively handles the sending of emails, it does not encrypt them, which can be a concern for confidentiality. As for the protocol's default port, it operates primarily on port 25. Next, we have domain name system, or DNS, which is a fundamental protocol of the internet, often likened to a phone book for the world wide web.\n\nIts primary function is to translate domain names, which are easy for humans to remember, into IP addresses, which computers use to identify each other on the network. DNS operates mainly on port 53. This port is used for both querying DNS servers and receiving responses.\n\nFor instance, when you type a website URL into your browser, DNS servers use port 53 to find the corresponding IP address and direct your request to the correct server. Let's now explore DHCP, or dynamic host configuration protocol. This network management protocol is used to automate the process of configuring devices on IP networks.\n\nEssentially, DHCP allows network devices, like computers and printers, to automatically obtain IP addresses and other necessary network configurations. This makes it much easier to manage large networks, where assigning IP addresses manually would be impractical. DHCP operates primarily on two ports, port 67 and 68, and utilizes a four-step process known as DORA, discover, offer, request, and acknowledge, to automate network configuration.\n\nInitially, a client device seeking network access sends a discover message on port 68, signaling its need for an IP address. A DHCP server listening on port 67 responds with an offer message, proposing an available IP address and other configuration details. The client device then sends back a request message, essentially accepting the offered settings.\n\nFinally, the DHCP server completes the process by sending an acknowledge message, confirming the IP address and network settings assignment. Shifting our focus once again, we now have the hypertext transfer protocol, or HTTP. This protocol is the foundation of data communications across the world wide web.\n\nIt's used for transmitting web content from web servers to web browsers. Whenever you enter a website URL or click on a web link, HTTP is the protocol facilitating that webpage's retrieval and display. HTTP typically operates on port 80 and is another protocol that does not offer encryption for its data, which means that information sent and received through HTTP can potentially be intercepted and viewed by others.\n\nNext in our exploration of network protocols, we have another email protocol. This one is POP3, short for Post Office Protocol version 3 and is used for email retrieval. It's one of the oldest methods used by email clients to retrieve messages from an email server.\n\nWhen you set up your email account on a client, POP3 can be one of the protocols you choose for downloading your emails. Operating on port 110, POP3 is designed for simplicity and supports basic email functionalities. It allows the email client to download all messages from the server to the local device.\n\nAnd once downloaded, these emails are deleted from the server. This makes it a good option for users who prefer to access their emails from a single device. It's important to note that in its standard form, POP3 does not encrypt the email data it retrieves.\n\nThis can pose a security risk, especially when accessing emails over unsecured or public networks. As we continue our exploration of network protocols, we turn our focus to NetBIOS, or Network Basic Input Output system. This protocol is a key player in local area networks, primarily facilitating tasks like file sharing and printer access within smaller networks.\n\nNetBIOS operates using multiple ports, with each serving a specific function. Port 137 is designated for name services, essential for the identification of networked computers. Meanwhile, port 139 is involved in session services, enabling the establishment and maintenance of network connections between devices.\n\nWhile NetBIOS is highly useful in small scale network environments, it is not designed to handle the complexities of modern large scale internet networking. Now we have one more email protocol to cover. IMAP, or Internet Message Access Protocol, is a modern, synchronized way of handling emails.\n\nWhen you use IMAP, your email client remains connected to the email server. Instead of downloading and removing the emails, IMAP keeps your emails stored on the server while syncing them with your email client or multiple clients. If you haven't deduced this already, the main advantage of IMAP is that you can access your emails from multiple devices, like your workstation, laptop, or smartphone, and they'll always be in sync.\n\nAny changes you make on one device, like reading, replying, or deleting emails, are reflected on all your devices. Next, we have SNMP, or Simple Network Management Protocol. While SNMP is not directly tested within this exam objective it is an important protocol to become familiar with as you continue advancing in networking.\n\nThis protocol is used for monitoring and managing network devices, and is instrumental in gathering information from, and configuring, various network devices like routers, switches, servers, printers, and more. SNMP is particularly valuable in large scale network environments where a constant monitoring and adjustments are necessary for maintaining network health and performance. SNMP primarily operates on ports 161 and 162 for sending requests from the manager to the managed devices or agents, and receiving responses from these agent devices.\n\nAnother protocol available for use is LDAP, or Lightweight Directory Access Protocol. This is a protocol used for managing and accessing information in a network. It's like a phone book for a network helping to organize and find information about network resources such as users and services.\n\nLDAP uses port 389 to communicate. It allows network administrators to quickly find and manage information about users and resources on their network. This is especially useful in large organizations with lots of users and network services.\n\nNow it is time to take another look at HTTP, which is the protocol that facilitates communications across the World Wide Web or internet. But this time we will add some security. HTTPS stands for Hypertext Transfer Protocol Secure.\n\nIt's essentially HTTP with an added layer of security. This protocol is used for secure communication across the World Wide Web. HTTPS encrypts the data being sent and received, which is crucial for protecting sensitive information like login credentials, personal information, and payment details.\n\nThe primary port for HTTPS is port 443. When you visit a website with HTTPS, the connection between your browser and the web server is encrypted. This encryption helps to prevent eavesdroppers from being able to intercept the data being transferred, ensuring that your browsing and personal data remain private and secure.\n\nGreat job for making it this far. Just two more protocols to go for this video segment. Next is SMB.\n\nSMB, which stands for Server Message Block, is a network communication protocol used primarily for providing shared access to files, printers, and serial ports among devices on a network. It's most commonly seen in Windows environments, where it facilitates the easy sharing of files and printers within a local area network. SMB commonly operates on port 445 with modern network configurations.\n\nOne of the key features of SMB is its ability to allow computers within the same network to read and write to files and to request services from servers in a computer network. The protocol can also authenticate and authorize access to network resources, making it a versatile protocol for network administrators. And for our last protocol, we have RDP, or Remote Desktop Protocol.\n\nThis is another method used for accessing remote computers or servers, much like SSH and Telnet. It allows users to remotely log into another computer over a network connection. However, RDP stands out by providing a graphical user interface or GUI for the remote connection instead of a CLI-only option.\n\nThis means that users can see and interact with the desktop environment of the remote computer as if they were sitting right in front of it. RDP is extensively used in corporate environments for remote administration, remote work, and providing IT support. RDP primarily operates on port 3389 and provides a full desktop experience for remote access over a network connection.\n\nExam objective 2.1, compare and contrast TCP and UDP ports, protocols, and their purposes. TCP versus UDP. In the last video segment, we touched upon various network protocols which fall under the category of application protocols.\n\nApplication protocols in networking dictate how data is exchanged between applications across a network. These protocols enable different software applications, often running on different machines, to communicate and share data seamlessly. To facilitate these application protocols, transport protocols like TCP and UDP come into play.\n\nThese are more fundamental protocols that handle the actual process of data transmission over the network. They work by breaking down the data from application protocols into smaller data packets, transmitting these packets across the network, and then reassembling them at the destination. In essence, they provide the necessary infrastructure that enables application protocols to function effectively across diverse network environments.\n\nAlthough TCP and UDP share the common role of being transport protocols for network data transmission, their approaches to performing this task differ significantly. I will start by explaining a bit about TCP, also known as Transmission Control Protocol. When a device sends information using TCP, it establishes a connection with the recipient using a process referred to as a three-way handshake.\n\nThis connection process is just like a phone call. You wanna make sure the other person is on the line before you start talking. Once the connection is established, TCP checks whether all data packets are received and in the right order.\n\nIf something is missing, the protocol is designed to request a resend. This check process ensures complete data integrity and guarantees data delivery. UDP, or User Datagram Protocol, on the other hand, is more like sending a postcard.\n\nIt's fast and efficient, but doesn't guarantee that the postcard will reach its destination. UDP sends packets without establishing a connection, making it faster but less reliable than TCP. It's used when speed is more critical than accuracy, like live video streaming or online gaming, where receiving data quickly is more important than getting every single packet.\n\nIn conclusion, our exploration of TCP and UDP as transport protocols in networking reveals distinct differences in their functionalities. TCP is connection-oriented, establishing a reliable connection before data transmission, ensuring guaranteed delivery. This makes it ideal for application protocols that require data integrity and security.\n\nOn the other hand, UDP operates in a connectionless manner, where data is sent without establishing a connection, leading to non-guaranteed delivery. This is suitable for applications where speed is more critical than reliability. Understanding these differences is crucial in choosing the right protocol for specific networking tasks balancing the trade-offs between reliability and efficiency.", "uyghur": "Exam Objective 2.1\nTCP ۋە UDP بىلەن مۇناسىۋەتلىك پورتلار، پروتوكوللار ۋە ئۇلارنىڭ ئىشلىتىلىش مەقسىتىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## تور ئالاقىسى ۋە تور پروتوكوللىرى (Networking Protocols)\n\nبۇ بۆلەك CompTIA A+ Core 1 ئىمتىھانىنىڭ ئىككىنچى ساھەسى — كومپيۇتېر تورى (computer networking) نى باشلايدۇ.\n\nIT ساھەسىدە **networking** — ئىككى ياكى ئۇنىڭدىن كۆپ ھېسابلاش ئۈسكۈنىسىنى مەلۇم بىر يەتكۈزۈش ۋاستىسى ئارقىلىق ئۆزئارا ئۇلاپ، مەنبە ۋە ئۇچۇرلارنى ھەمبەھىرلەش جەريانىدۇر.\n\nبۇ ئۇلىنىش:\n- سىملىق (wired)\n- سىمسىز (wireless)\nبولۇشى مۇمكىن.\n\nتور ئارقىلىق ئۈسكۈنىلەر:\n- بىر-بىرى بىلەن ئالاقە قىلىدۇ\n- سانلىق مەلۇمات يەتكۈزىدۇ\n- ئىنتېرنېتكە چىقىدۇ\n- ھۆججەت ھەمبەھىرلەيدۇ\n- بىرلىكتە ئىشلەش مۇھىتىنى قوللايدۇ\n\nشۇڭا تور ئالاقىسى زامانىۋى IT ئۇل ئەسلىھەسىنىڭ مۇھىم ئاساسىدۇر.\n\n### تور پروتوكولى (Network Protocol) دېگەن نېمە؟\n\n**Network protocol** — ئۈسكۈنە ياكى سىستېمىلار ئارىسىدا ئۇچۇر قانداق ئالماشتۇرۇلىدىغانلىقىنى بەلگىلەيدىغان قائىدە ۋە ئۆلچەملەر توپلىمى.\n\nپروتوكول تۆۋەندىكىلەرنى بەلگىلەيدۇ:\n- سانلىق مەلۇمات قانداق يوللىنىدۇ\n- قانداق قوبۇل قىلىنىدۇ\n- قانداق چۈشەندۈرۈلىدۇ\n- ئالاقە جەريانىدا ئۇچۇرغا قانداق مۇئامىلە قىلىنىدۇ\n- ئۈسكۈنىلەر بىر-بىرىنى قانداق تونۇيدۇ\n- خاتالىقلار قانداق بىر تەرەپ قىلىنىدۇ\n\nبۇنى كىشىلەر ئارىسىدىكى «ئورتاق تىل» غا ئوخشىتىشقا بولىدۇ. ئورتاق قائىدە بولمىسا، تور ئۈسكۈنىلىرىنىڭ بىر-بىرىنى توغرا چۈشىنىشى قىيىن بولىدۇ.\n\nپروتوكوللار ئۈسكۈنىلەرنىڭ ئىشەنچلىك ۋە ئۆلچەملەشكەن ئۇسۇلدا ئالاقە قىلىشىغا بىر قۇرۇلما تەمىنلەيدۇ.\n\n### تور پورتى (Network Port) دېگەن نېمە؟\n\n**Network port** — تور ئالاقىسىدىكى مەۋھۇم نۇقتا بولۇپ، پورت نومۇرى ئارقىلىق مەلۇم مۇلازىمەت ياكى پروتوكولنى پەرقلەندۈرۈشكە ياردەم بېرىدۇ.\n\nمەنبەدىكى مىساللار:\n- HTTP ئادەتتە **port 80**\n- SMTP ئادەتتە **port 25**\n\nپورتلارنى چۈشىنىش تور تەڭشەش ۋە بىخەتەرلىك ئۈچۈن مۇھىم. چۈنكى قايسى پورتنىڭ ئېچىلىشى ياكى ئىشلىتىلىشىنى باشقۇرۇش سانلىق مەلۇمات ئېقىمىنى كونترول قىلىش ۋە رۇخسەتسىز زىيارەت خەۋپىنى ئازايتىشقا ياردەم بېرىدۇ.\n\nExam Objective 2.1\nTCP ۋە UDP بىلەن مۇناسىۋەتلىك پورتلار، پروتوكوللار ۋە ئۇلارنىڭ ئىشلىتىلىش مەقسىتىنى سېلىشتۇرۇپ پەرقلەندۈرۈڭ.\n\n## پورتلار ۋە پروتوكوللار (Ports and Protocols)\n\nبۇ بۆلەكتە مەنبە ئەڭ كۆپ ئۇچرايدىغان تور پروتوكوللىرىنىڭ ئاساسىي مەقسىتى ۋە ئۇلار بىلەن باغلانغان سۈكۈتتىكى (default) پورت نومۇرلىرىنى چۈشەندۈرىدۇ.\n\n### FTP — File Transfer Protocol\n\nFTP — تور ئارقىلىق ئۈسكۈنىلەر ئارىسىدا ھۆججەت يۆتكەشكە ئىشلىتىلىدىغان ئۆلچەملىك تور پروتوكولى.\n\nئۇ ئارقىلىق:\n- يەرلىك كومپيۇتېردىن يىراقتىكى مۇلازىمېتىرغا ھۆججەت يۈكلەش (upload)\n- مۇلازىمېتىردىن يەرلىك كومپيۇتېرغا ھۆججەت چۈشۈرۈش (download)\nمۇمكىن.\n\nFTP نىڭ مۇھىم بىخەتەرلىك چەكلىمىسى — مەنبەدە بايان قىلىنغاندەك، ئۇ سانلىق مەلۇماتنى شىفىرلىمايدۇ.\n\nFTP ئادەتتە ئىككى پورت ئىشلىتىدۇ:\n- **Port 21 — Control port:** client بىلەن server ئارىسىدا ئۇلىنىش قۇرۇش، بۇيرۇق ۋە جاۋابلارنى ئالماشتۇرۇش.\n- **Port 20 — Data port:** ھۆججەتنىڭ ئەمەلىي يەتكۈزۈلۈشى.\n\nشىفىرلاش بولمىغاچقا، ئىشلەتكۈچى نامى ۋە مەخپىي نومۇرغا ئوخشاش سەزگۈر ئۇچۇرلارمۇ ئاددىي، شىفىرلانمىغان تېكىست (plain text) شەكلىدە يەتكۈزۈلۈشى مۇمكىن. بۇ ئۇچۇرنىڭ يولدا تۇتۇۋېلىنىش ياكى رۇخسەتسىز زىيارەت قىلىنىش خەۋپىنى ئاشۇرىدۇ.\n\n### SSH — Secure Shell\n\nSSH — يىراقتىكى كومپيۇتېر ياكى مۇلازىمېتىرغا بىخەتەر كىرىش ئۈچۈن ئىشلىتىلىدىغان پروتوكول.\n\nئۇ CLI (Command-Line Interface) ئارقىلىق يىراقتىن بۇيرۇق ئىجرا قىلىشتا كۆپ ئىشلىتىلىدۇ.\n\nSSH ئالاقە جەريانىدىكى سانلىق مەلۇماتنى شىفىرلاپ، login ئۇچۇرلىرىنىمۇ قوغدايدۇ.\n\n- **Default port: 22**\n\nمەنبەدە port 22 بىخەتەر ئۇلىنىش قۇرۇش ۋە شىفىرلانغان سانلىق مەلۇمات يەتكۈزۈش ئۈچۈن ئىشلىتىلىدىغانلىقى بايان قىلىنغان.\n\n### Telnet\n\nTelnet نىڭ ئاساسىي ئىشلىتىلىشى SSH غا ئوخشايدۇ: تور ئارقىلىق يىراقتىكى كومپيۇتېر ياكى مۇلازىمېتىرغا كىرىپ، CLI بۇيرۇقلىرىنى ئىجرا قىلىش.\n\nئەمما مۇھىم پەرق:\n- **SSH شىفىرلايدۇ**\n- **Telnet شىفىرلىمايدۇ**\n\nTelnet login credential نىمۇ ئۆز ئىچىگە ئالغان سانلىق مەلۇماتنى plain text شەكلىدە يوللايدۇ. شۇڭا تىڭشاپ تۇتۇۋېلىش (eavesdropping) ۋە رۇخسەتسىز زىيارەت خەۋپى يۇقىرى.\n\n- **Default port: 23**\n\nمەنبە شۇڭا بىخەتەرلىك مۇھىم بولغان مۇھىتتا Telnet نىڭ مۇۋاپىق تاللاش ئەمەسلىكىنى تەكىتلەيدۇ.\n\n### SMTP — Simple Mail Transfer Protocol\n\nSMTP — ئېلېكترونلۇق خەت **يوللاش** ئۈچۈن ئىشلىتىلىدىغان پروتوكول.\n\nئۇ:\n- email client دىن mail server غا\n- بىر mail server دىن يەنە بىر mail server غا\nخەت يوللاشقا ئىشلىتىلىدۇ.\n\nئىشلەتكۈچى خەت يېزىپ Send نى باسقاندا، email client SMTP ئارقىلىق خەتنى لازىملىق mail server غا يەتكۈزىدۇ.\n\n- **Default port: 25**\n\nمەنبەدە SMTP نىڭ ئۆزى خەت مەزمۇنىنى شىفىرلىمايدىغانلىقى بايان قىلىنغان.\n\n### DNS — Domain Name System\n\nDNS — ئىنتېرنېتنىڭ ئاساسىي پروتوكول/مۇلازىمەتلىرىدىن بىرى بولۇپ، مەنبە ئۇنى «World Wide Web نىڭ تېلېفون دەپتىرى» گە ئوخشىتىدۇ.\n\nئاساسىي خىزمىتى:\n- ئادەم ئاسان ئەستە ساقلايدىغان domain name نى\n- كومپيۇتېرلار توردا ئىشلىتىدىغان IP address قا\nئايلاندۇرۇش.\n\n- **Port: 53**\n\nمەنبەدە port 53 DNS server غا query يوللاش ۋە جاۋاب قوبۇل قىلىشقا ئىشلىتىلىدىغانلىقى بايان قىلىنغان.\n\nمەسىلەن، browser غا بىر website URL كىرگۈزۈلسە، DNS مۇناسىپ IP address نى تېپىشقا ياردەم بېرىدۇ.\n\n### DHCP — Dynamic Host Configuration Protocol\n\nDHCP — IP تورىدىكى ئۈسكۈنىلەرنىڭ تور تەڭشەكلىرىنى ئاپتوماتىك تەقسىملەشكە ئىشلىتىلىدىغان تور باشقۇرۇش پروتوكولى.\n\nDHCP ئارقىلىق كومپيۇتېر ۋە printer غا ئوخشاش ئۈسكۈنىلەر:\n- IP address\n- باشقا زۆرۈر تور تەڭشەكلىرى\nنى ئاپتوماتىك ئالالايدۇ.\n\nبۇ، بولۇپمۇ چوڭ توردا، IP address نى قولدا بىرمۇ-بىر تەقسىملەش ئېھتىياجىنى ئازايتىدۇ.\n\nDHCP ئاساسلىقى:\n- **Port 67**\n- **Port 68**\nنى ئىشلىتىدۇ.\n\n#### DORA جەريانى\n\nمەنبە DHCP نىڭ تۆت باسقۇچلۇق جەريانىنى **DORA** دەپ چۈشەندۈرىدۇ:\n\n1. **Discover** — client ئۈسكۈنىسى تورغا قوشۇلۇش ئۈچۈن IP address كېرەكلىكىنى بىلدۈرىدىغان Discover ئۇچۇرىنى يوللايدۇ.\n2. **Offer** — port 67 دا ئاڭلاۋاتقان DHCP server بار IP address ۋە باشقا تەڭشەك ئۇچۇرلىرىنى تەكلىپ قىلىدۇ.\n3. **Request** — client تەكلىپ قىلىنغان تەڭشەكنى قوبۇل قىلىش ئۈچۈن Request ئۇچۇرىنى قايتۇرىدۇ.\n4. **Acknowledge** — DHCP server Acknowledge ئۇچۇرى ئارقىلىق IP address ۋە تور تەڭشەكلىرىنىڭ تەقسىملەنگەنلىكىنى جەزملەشتۈرىدۇ.\n\nمەنبە Discover جەريانىدا client نىڭ port 68 دىن، server نىڭ port 67 دىن پايدىلىنىدىغانلىقىنى چۈشەندۈرىدۇ.\n\n### HTTP — Hypertext Transfer Protocol\n\nHTTP — World Wide Web ئارقىلىق سانلىق مەلۇمات ئالاقىسىنىڭ ئاساسىي پروتوكوللىرىدىن بىرى.\n\nئۇ web server دىن web browser غا تور بەت مەزمۇنىنى يەتكۈزۈشكە ئىشلىتىلىدۇ.\n\nWebsite URL كىرگۈزگەندە ياكى web link نى چەككەندە، HTTP تور بەتنى ئېلىپ كېلىش ۋە كۆرسىتىش جەريانىغا ياردەم بېرىدۇ.\n\n- **Default port: 80**\n\nمەنبەدە HTTP سانلىق مەلۇماتنى شىفىرلىمايدىغانلىقى، شۇڭا يوللانغان ياكى قوبۇل قىلىنغان ئۇچۇرنىڭ يولدا تۇتۇۋېلىنىش ئېھتىمالى بارلىقى بايان قىلىنغان.\n\n### POP3 — Post Office Protocol version 3\n\nPOP3 — email نى **قوبۇل قىلىش/چۈشۈرۈش** ئۈچۈن ئىشلىتىلىدىغان كونا پروتوكوللارنىڭ بىرى.\n\nEmail client POP3 ئارقىلىق mail server دىن خەتلەرنى يەرلىك ئۈسكۈنىگە چۈشۈرىدۇ.\n\nمەنبە بۇ بۆلەكتە POP3 نى خەتلەرنى server دىن ئۈسكۈنىگە چۈشۈرۈپ، چۈشۈرۈلگەندىن كېيىن server دىن ئۆچۈرۈلىدىغان ئۇسۇل سۈپىتىدە چۈشەندۈرىدۇ. شۇڭا مەنبە ئۇنى ئاساسلىقى بىر ئۈسكۈنىدىن email ئىشلىتىشنى خالايدىغان ئىشلەتكۈچىگە ماس دەپ كۆرسىتىدۇ.\n\n- **Default port: 110**\n\nمەنبەدە standard POP3 خەت سانلىق مەلۇماتىنى شىفىرلىمايدىغانلىقى، شۇڭا ئاممىۋى ياكى بىخەتەر بولمىغان توردا خەۋپ پەيدا قىلىشى مۇمكىنلىكىمۇ بايان قىلىنغان.\n\n### NetBIOS — Network Basic Input/Output System\n\nNetBIOS — كىچىك Local Area Network مۇھىتىدا ھۆججەت ھەمبەھىرلەش ۋە printer زىيارىتىگە ئوخشاش ئىشلارغا ياردەم بېرىدىغان پروتوكول.\n\nمەنبە NetBIOS نىڭ بىر نەچچە پورت ئىشلىتىدىغانلىقىنى ئېيتىدۇ، ئەمما بۇ بۆلەكتە تۆۋەندىكى ئىككى پورتنىلا تەپسىلىي كۆرسىتىدۇ:\n\n- **Port 137 — Name service:** توردىكى كومپيۇتېرلارنى نام ئارقىلىق تونۇشقا ياردەم بېرىدۇ.\n- **Port 139 — Session service:** ئۈسك
