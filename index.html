derlying infrastructure by including the operating system. Users are primarily responsible for developing, deploying and managing their applications and data. With software as a service, the cloud provider assumes the majority of responsibility, including managing the entire stack from infrastructure to applications.\n\nUsers are typically responsible for configuring the application settings and managing user access. This division of responsibility allows users to focus on their core business functions while leveraging the expertise and resources of the cloud service provider. By understanding the shared responsibilities across different service types, organizations can effectively manage their cloud environments and maximize the benefits of cloud computing.", "uyghur": "Exam Objective 4.2 — Cloud Computing Concepts\n\n## Cloud Models\n\nCloud computing — network ئارقىلىق shared pool دىن servers، storage، networking، applications ۋە services نى **on-demand** ئېلىش؛ resource نى تېز provision/release قىلىش.\n\n### Public Cloud\nThird-party provider (مەسىلەن AWS، Azure، Google Cloud) باشقۇرىدىغان shared cloud. Resource نى Internet ئارقىلىق scale up/down قىلىش ئاسان؛ organization ئۆزى physical infrastructure سېتىۋېلىپ باشقۇرمايدۇ.\n\n### Private Cloud\nبىر organization ئۈچۈن dedicated cloud infrastructure. Control، isolation، security/compliance يۇقىرى؛ sensitive workload ئۈچۈن ماس. Infrastructure on-premises ياكى dedicated hosted بولۇشى مۇمكىن.\n\n### Hybrid Cloud\nPrivate/on-premises + public cloud نى بىرلەشتۈرىدۇ. Sensitive data private تەرەپتە، scalable workload public cloud تا بولالايدۇ. Cost، security، performance ۋە scalability ئارىسىدا تەڭپۇڭلۇق.\n\n### Community Cloud\nئورتاق regulation، mission ياكى requirements بار بىر قانچە organization نىڭ ئورتاق cloud environment ى.\n\n## Cloud Characteristics\n\n### Shared resources / Resource pooling\nPhysical servers، storage، networking نى multiple customers/tenants share قىلىدۇ؛ provider demand غا قاراپ resource نى dynamically allocate/reassign قىلىدۇ.\n\n**Dedicated resources** بولسا specific customer ئۈچۈن exclusive hardware/resource.\n\n### Metered utilization\nActual usage بويىچە measure/bill قىلىش؛ pay-as-you-go.\n\nMetered items:\n- CPU usage.\n- Storage usage.\n- Network ingress/egress.\n\nOrganization fixed capacity سېتىۋېلىشنىڭ ئورنىغا ئىشلىتىلگەن resource بويىچە تۆلەيدۇ.\n\n### Rapid elasticity\nDemand ئۆزگەرگەندە resource نى تېز/automatic **scale up / scale down** قىلىش. مەسىلەن e-commerce peak traffic دا web servers كۆپىيىپ، traffic تۆۋەنلىگەندە ئازىيىدۇ.\n\n### High availability\nRedundancy، fault tolerance ۋە failover ئارقىلىق service نىڭ available بولۇشىنى ساقلاش. بىر server/data center/region كاشىلا بولسا باشقىسى takeover قىلىشى مۇمكىن، single point of failure نى ئازايتىدۇ.\n\n### File synchronization\nFiles/data نى multiple devices/locations دا up-to-date ساقلاش. User Internet بار يەردىن latest version غا كىرەلەيدۇ، collaboration ۋە remote access نى ئاسانلاشتۇرىدۇ.\n\n### Multi-tenancy\nبىر cloud platform/infrastructure multiple **tenants** غا service بېرىدۇ. Physical resources share قىلىنغان بولۇشى مۇمكىن، ئەمما ھەر tenant نىڭ data/apps/workloads ى **logically isolated** ۋە secure بولۇشى كېرەك.\n\n## Cloud Service Types\n\n### IaaS — Infrastructure as a Service\nProvider data center، physical servers، storage، networking ۋە virtualization infrastructure نى باشقۇرىدۇ. Customer VM، OS، applications ۋە data نىڭ كۆپ قىسمىنى باشقۇرىدۇ.\n\n**User control يۇقىرى، responsibility مۇ يۇقىرى.**\n\n### PaaS — Platform as a Service\nProvider infrastructure + OS/runtime/platform نى باشقۇرىدۇ. Developer ئاساسلىقى application code/deployment ۋە data غا ئەھمىيەت بېرىدۇ؛ server/network configuration بىلەن ئاز شۇغۇللىنىدۇ.\n\n### SaaS — Software as a Service\nReady-made application Internet/web/client ئارقىلىق ئىشلىتىلىدۇ. Provider infrastructure دىن application stack غىچە كۆپ قىسمىنى باشقۇرىدۇ. User ئادەتتە application settings، data usage ۋە user access نى باشقۇرىدۇ.\n\n### Shared Responsibility — ئاددىي سېلىشتۇرۇش\n- **IaaS:** provider → infrastructure؛ customer → OS/apps/data.\n- **PaaS:** provider → infrastructure + OS/platform؛ customer → apps/data.\n- **SaaS:** provider → كۆپىنچە full stack؛ customer → user/access/configuration/data responsibilities.\n\n# Domain 5 — Hardware and Network Troubleshooting\n\n> **ئىمتىھان قائىدىسى:** رېمونت ياكى component replacement قىلىشتىن بۇرۇن ئالدى بىلەن **verify / inspect / check** قىلىپ root cause نى ئىسپاتلاش كېرەك.\n\n#"}, {"id": "5.1", "number": "5.1", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam objective 5.1. Given a scenario, troubleshoot motherboards, RAM, CPUs and power. This video segment will cover troubleshooting issues related to motherboards, RAM, CPUs and power.\n\nFor each of the common symptoms listed in exam objective 5.1, I will provide some basic information and possible root causes. Additionally, as a protest taking tip, you should always perform verifications, inspections or checks before performing any repairs or component replacements. Just something to keep in mind come exam day.\n\nWith that in mind, let's begin with one of the most common and concerning troubleshooting scenarios, a computer system that fails to power on. When a computer system fails to power on, it signals a potential array of underlying issues that require attention. One primary culprit for this scenario could be a malfunctioning power supply unit or PSU, which is responsible for supplying electrical power to the computing device.\n\nA faulty PSU may fail to deliver adequate power or fail entirely, preventing the system from starting up. Additionally, loose connections between the power supply cables and the motherboard, CPU or other components can disrupt the flow of electricity resulting in a failure to power on. Furthermore, the PSU may not be receiving power from the wall outlet.\n\nIf the computing device has sufficient power, it will proceed to the power on self test or post. If everything checks out okay during the post, a single audible beep will be heard. Otherwise, a series of beeps will be triggered indicating a potential hardware malfunction.\n\nThese audible alerts or beeps play a crucial role in diagnosing underlying issues. Each beep pattern will correspond to a specific hardware problem with the most common culprits being motherboard malfunctions, memory failures or CPU issues. By recognizing and deciphering these post beep codes, users can promptly address the root cause, whether it involves examining the motherboard for defects such as chipset failures, damaged capacitors, corrosion or loose components.\n\nTroubleshooting memory modules to see if they have failed or become unseated. Or inspecting the CPU for failure or a disconnected CPU fan. Encountering a black screen upon startup can be indicative of several potential hardware issues within a computer system.\n\nOne possible cause for this occurrence is a problem with the motherboard. This could prevent the power on self test from ever taking place or cause a beep code. Similarly, problems with the graphics card or the display can also result in a black screen scenario.\n\nAdditionally, issues with the power supply unit can contribute to a black screen situation. If your device has power, gets past the post test and does not encounter a black screen, then it will continue on with the boot process. The next stage is to load the operating system.\n\nThis is where you may encounter a proprietary crash screen. Encountering proprietary crash screens such as the infamous blue screen of death on Windows systems or the spinning pinwheel on Mac OS is often a distressing experience for computer users. These screens serve as indicators of critical system errors that require immediate attention.\n\nOne common culprit behind these crash screens is driver conflicts where incompatible or outdated device drivers clash with the operating system leading to system instability and crashes. Furthermore, faulty hardware components can also trigger these crash screens. Issues such as damaged motherboards, failing RAM modules, malfunctioning graphics cards or overheating CPU's can all contribute to system crashes and the appearance of proprietary crash screens.\n\nOverheating is another threat to the stability and performance of computer systems. One of the primary consequences of overheating is system instability wherein the computer may exhibit erratic behavior, unexpected shutdowns or even hardware damage. Several factors contribute to overheating with inadequate cooling mechanisms being a primary concern.\n\nInsufficient airflow within the computer case, inadequate ventilation or poorly designed cooling systems can all exacerbate heat buildup leading to elevated temperatures. Additionally, the accumulation of dust and debris on internal components can impede heat dissipation compounding the problem. Another common cause of overheating is a malfunctioning fan.\n\nIf a fan fails to operate at optimal speeds or stops working altogether, the computing device can quickly reach dangerously high temperatures. The detection of a burning smell within a computer system serves as a potent warning sign hinting at potentially severe hardware issues that demand immediate attention. This cue typically indicates overheating or damage to internal components, signifying a critical situation that requires swift resolution.\n\nThe source of the burning smell may vary with just about every hardware component being a possible cause. For instance, a malfunctioning PSU may emit a distinct burning odor when its internal components become overheated or compromised. Similarly, a damaged motherboard or overheating CPU can also produce a burning smell signaling imminent hardware failure or damage.\n\nPrompt action is imperative when detecting such a scent as ignoring it could lead to irreversible damage, data loss, or even a fire hazard. When a burning smell is encountered, users should immediately power off the system, unplug it from the power source, and seek professional assistance to diagnose and address the underlying cause. Sluggish performance is a frustrating issue that can significantly impair the functionality and efficiency of a computer system hindering productivity and user experience.\n\nOne common underlying cause of sluggishness is insufficient compute resources such as CPU processing power, available RAM, or available storage. Another factor contributing to sluggishness is CPU overheating. When the CPU reaches excessively high temperatures due to inadequate cooling or airflow within the system, it may throttle or reduce its processing speed to prevent damage.\n\nRandom shutdowns are another concern facing computing devices. These abrupt shutdowns may stem from various underlying causes necessitating thorough investigation to pinpoint the root problem. One potential reason for these shutdowns is a faulty power supply.\n\nFluctuations in power delivery or outright failures can trigger sudden system shutdowns. Power supplies with insufficient wattage ratings can also lead to the same issue. Additionally, overheating poses another significant concern.\n\nWhen critical components, such as the CPU or graphics card, reach excessive temperatures due to poor ventilation or malfunctioning cooling systems, the system may automatically shut down to prevent damage, manifesting as random shutdowns during operation. Frequent application crashes can significantly disrupt productivity and frustrate users, often indicating underlying issues within the computer system. The cause behind these crashes may be faulty RAM.\n\nWhen RAM modules develop defects or fail to function properly, they can corrupt data or cause applications to crash unexpectedly. Additionally, software conflicts can also trigger frequent application crashes. Incompatible software versions, conflicting drivers or corrupted system files can create conflicts within the operating system, causing applications to malfunction and crash.\n\nMoreover, insufficient storage can exacerbate application crashes as a lack of available disk space can impede the proper functioning of applications and the operating system. Unusual noise coming from a computer system can also indicate a developing hardware issue. One common source of unusual noise is a broken, failing or obstructed fan.\n\nFans are responsible for cooling critical components, such as the CPU and power supply. And if a fan becomes damaged, clogged with dust or wears out, it may produce grinding, rattling or buzzing sounds. Capacitors are essential electronic components found on computer motherboards and other circuit boards, tasked with storing and releasing electrical energy as needed.\n\nThey serve various functions within the system, including stabilizing voltage levels and regulating current flow. When a capacitor becomes swollen or bulging, it signifies a significant issue known as capacitor swelling, which often indicates impending component failure. This swelling occurs due to internal pressure buildup caused by factors such as excessive heat, prolonged usage or manufacturing defects.\n\nAs the capacitor expands beyond its normal dimensions, it can disrupt the electrical circuitry and functionality of the motherboard. This disruption can lead to system instability, erratic behavior or even complete system failure. Additionally, in severe cases, the swelling of capacitors can result in the leakage of electrolytic fluid, which may emit smoke and a distinct burning smell as it comes into contact with other components or circuitry.\n\nLastly, the CMOS, short for Complementary Metal Oxide Semiconductor, is a component within a computer system that aids in preserving BIOS settings, including system date, time and hardware configuration details. The CMOS is essentially a small onboard battery used to retain these settings even when the computer is powered off. Inaccurate system date and time settings can often be attributed to issues related to the CMOS battery.\n\nThe CMOS battery provides backup power to maintain the integrity of these settings when the main power source is disconnected. However, over time, this battery may degrade or lose its charge, leading to inaccuracies in system date and time settings. Detecting inaccuracies in system date and time settings is crucial as they can affect various system functions, including file timestamping, software licensing and scheduled tasks.", "uyghur": "Exam Objective 5.1 — Motherboard, RAM, CPU and Power Troubleshooting\n\n## Computer power on بولمايدۇ\nمۇمكىن سەۋەبلەر:\n- PSU خراب ياكى يېتەرلىك power بەرمەيدۇ.\n- PSU → motherboard/CPU/component power cable بوش.\n- Wall outlet ياكى PSU غا input power كەلمەيدۇ.\n\nPower بار بولسا system **POST (Power-On Self-Test)** قا ئۆتىدۇ. Course بويىچە normal POST دا بىر beep ئاڭلىنىشى مۇمكىن؛ repeated/patterned beep code hardware problem نى كۆرسىتىشى مۇمكىن. Beep code manufacturer/BIOS غا باغلىق بولغاچقا، documentation ئارقىلىق decode قىلىش كېرەك.\n\nBeep code بىلەن باغلىق كۆپ root causes:\n- motherboard/chipset/capacitor/corrosion/loose component;\n- RAM failure ياكى RAM unseated;\n- CPU issue ياكى CPU fan disconnected.\n\n## Black screen at startup\nPossible causes:\n- motherboard/POST failure;\n- graphics card ياكى display problem;\n- PSU/power issue;\n- cable/display input issue نىمۇ verify قىلىش كېرەك.\n\n## Proprietary crash screen / OS crash\nWindows BSOD ياكى macOS crash/freeze كۆرۈنسە:\n- incompatible/outdated driver;\n- faulty motherboard/RAM/GPU;\n- CPU overheating;\n- corrupted software/system files\nقاتارلىقلار root cause بولۇشى مۇمكىن.\n\n## Overheating\nSymptoms:\n- instability;\n- performance throttling;\n- unexpected shutdown;\n- hardware damage risk.\n\nCauses:\n- airflow ناچار؛\n- ventilation/cooling يېتەرسىز؛\n- dust/debris;\n- fan خراب ياكى توسۇلغان.\n\n## Burning smell\nBurning smell ئېغىر warning. PSU، motherboard، CPU ياكى باشقا hardware overheating/electrical damage بولۇشى مۇمكىن.\n\n**بىخەتەر قەدەم:** system نى دەرھال power off قىلىپ، power source دىن unplug قىلىڭ؛ سەۋەبنى تەكشۈرمەي قايتا قوزغاتماسلىق كېرەك.\n\n## Sluggish performance\nPossible causes:\n- CPU resource يېتەرسىز;\n- RAM يېتەرسىز;\n- free storage بەك ئاز;\n- CPU overheating → thermal throttling.\n\n## Random shutdowns\nPossible causes:\n- faulty PSU;\n- PSU wattage يېتەرسىز;\n- CPU/GPU overheating;\n- cooling failure.\n\n## Frequent application crashes\nPossible causes:\n- faulty RAM → data corruption;\n- incompatible software/driver;\n- corrupted system files;\n- insufficient disk space.\n\n## Unusual noise\nGrinding/rattling/buzzing fan damaged، dusty، obstructed ياكى worn out بولۇشى مۇمكىن. Fan CPU/PSU cooling نى توغرا قىلالمىسا overheating risk ئاشىدۇ.\n\n## Swollen/bulging capacitors\nMotherboard capacitor voltage/current stabilization دا رول ئوينايدۇ. Swelling excessive heat، age ياكى manufacturing defect دىن بولۇشى مۇمكىن. نەتىجە:\n- instability;\n- erratic behavior;\n- system failure;\n- severe case دا electrolyte leakage/smoke/burning smell.\n\n## CMOS battery / wrong date and time\nCMOS/RTC battery BIOS/UEFI settings، date/time نى power off مەزگىلىدە ساقلاشقا ياردەم بېرىدۇ. Battery كونا/ئاجىز بولسا date/time reset ياكى توغرا بولماسلىقى مۇمكىن. بۇ file timestamps، licensing، scheduled tasks قا تەسىر قىلىدۇ.\n\n#"}, {"id": "5.2", "number": "5.2", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam objective 5.2, given a scenario, troubleshoot drive and RAID issues. This video segment will cover troubleshooting issues related to storage and RAID arrays. For each of the common symptoms listed in exam objective 5.2, I will provide some basic information and possible root causes.\n\nAdditionally, as a pro test taking tip, you should always perform verifications, inspections or checks before performing any repairs or component replacements. Storage drives and RAID arrays are integral components of modern computing systems responsible for storing and managing vast amounts of data. However, they are not immune to issues that can arise over time, leading to data loss, system instability and performance degradation.\n\nTroubleshooting and diagnosing problems with storage drives and RAID arrays require a comprehensive understanding of common symptoms and their underlying causes. Kicking things off, we have LED status indicators that serve as a vital diagnostic tool for both storage drives and RAID arrays, offering insights into their operational health. These indicators, often located on the exterior casing of the drives or the RAID controller, utilize different colors or blinking patterns to convey critical information to users and system administrators.\n\nA steady green light typically signifies normal operation, indicating that the drive or array is functioning as expected. However, deviations from this standard can alert users to potential issues. For instance, a flashing red LED might indicate a drive failure, prompting immediate action to replace the faulty disk and initiate data recovery procedures.\n\nSimilarly, an amber or orange light might suggest a cautionary state. Furthermore, specific blinking patterns may denote ongoing data transfer activity, providing reassurance that the storage system is actively processing information. By interpreting these LED status indicators correctly, users can promptly identify and address potential problems, minimizing downtime and safeguarding data integrity within their storage infrastructure.\n\nAnother alert mechanism used in storage systems and RAID arrays is the audible alarm. Audible alarms are warning sounds generated by the RAID controller or storage system when a critical issue occurs. These alarms are designed to immediately draw the attention of administrators, particularly in environments such as server rooms or data centers where systems may not always be actively monitored visually.\n\nOne common reason for an audible alarm is a failed drive within a RAID array. When a disk fails, the system may trigger a repeating alarm to notify administrators that the array is operating in a degraded state and that the failed drive should be replaced. Audible alarms may also be triggered by overheating components, power supply problems, or controller issues within the storage system.\n\nJust like LED status indicators, audible alarms provide an early warning that something is wrong within the storage environment. By responding quickly to these alerts, administrators can replace failing components, rebuild RAID arrays, and help prevent further system disruption or potential data loss. Grinding and clicking sounds coming from a storage drive are often serious warning signs of mechanical failure within a traditional hard disk drive.\n\nThese noises are commonly caused by malfunctioning read and write heads or damaged platters inside the drive. Because hard disk drives contain spinning platters and moving mechanical components, any physical damage or wear can produce unusual sounds such as grinding, repetitive clicking, or ticking. These sounds typically indicate that the drive is struggling to read or write data correctly and may be approaching complete failure.\n\nWhen grinding or clicking noises are detected, it is important to act quickly to reduce the risk of permanent data loss. Immediate steps should include backing up any critical data and preparing to replace the failing drive. By responding quickly to these warning signs, users and administrators can protect important information and maintain the stability of the storage system before a total drive failure occurs.\n\nData loss or corruption represents a significant threat to the integrity and accessibility of stored data within computing systems. This perilous occurrence can manifest due to an array of factors, such as a failed storage drive or corrupted file system. When confronted with such an issue, users often resort to employing data recovery tools or seeking professional services to attempt the salvage of lost or corrupted data.\n\nThese interventions aim to restore critical information and minimize the potential impact of data loss. However, prevention remains the cornerstone of effective data management. Regular backups serve as a formidable defense against data loss or corruption.\n\nFurthermore, proactive measures such as running disk diagnostic utilities, like the check disk command on Windows systems or the file system consistency check on Mac OS can help identify and rectify underlying disk errors before they escalate into catastrophic data loss events. RAID or redundant array of independent disks are praised for their ability to provide both redundancy and improve performance in data storage systems. However, despite their advantages, RAID arrays are not immune to failures, which can manifest in various forms.\n\nDisk failures are perhaps the most common issue where individual drives within the array malfunction, leading to the aforementioned data loss or corruption. When faced with a RAID failure, immediate action is necessary to mitigate potential data loss and restore system functionality. This often involves rebuilding the RAID array, which entails replacing failed drives with new ones and initiating a data reconstruction process to restore redundancy.\n\nMoreover, RAID failure can also result in degraded array states where performance is compromised and data access speeds are significantly reduced. Addressing these issues promptly through proper diagnosis, component replacement and maintenance procedures is essential to restoring the reliability and performance of the RAID array and ensuring uninterrupted access to critical data. Self-monitoring, analysis and reporting technology, otherwise referred to as SMART, stands as a pivotal system embedded within modern storage drives, designed to continuously monitor their health status and anticipate potential failures before they occur.\n\nUnlike traditional disk checking utilities, such as the check disk command on Windows systems or the file system consistency check on Mac OS, which primarily focus on file system integrity, SMART offers a proactive approach by monitoring various performance metrics related to drive health and performance. By analyzing these metrics, SMART can detect subtle signs of impending drive failure that may not be apparent during routine disk checks. When SMART detects anomalies or deviations from expected behavior that indicate a heightened risk of drive failure, it triggers a SMART failure warning.\n\nThis warning serves as an urgent alert to users and system administrators, prompting them to take immediate action to safeguard data integrity and system stability. Typically, the recommended course of action in response to a SMART failure warning is to perform an immediate backup of critical data and replace the affected drive with a new one to prevent potential data loss or system downtime. Extended read and write times on storage drives can indicate several underlying issues that impact system performance and functionality.\n\nThese delays may stem from data fragmentation on hard disk drives, where data is scattered across the disk in small pieces, resulting in longer read times and reduced efficiency during read and write operations. Additionally, by ensuring there is enough storage space, fragmentation can also be reduced as there is space on the drive with which to place continuous blocks of data, avoiding the need to break data into small pieces. To address these issues, proactive measures like disk defragmentation can be used.\n\nDefragmenting a drive involves reorganizing the data into continuous blocks. This reduces read times and improves overall performance. Similarly, we can measure a storage drives read and write performance based on its IOPS metric.\n\nIOPS stands for input output operations per second and is a performance metric that measures the number of read and write operations a storage device can handle in one second. Calculating IOPS involves two parts, the average size of each operation and the storage drives transfer rate. The average operation size refers to the amount of data read from or written to the storage device in a single operation and is typically measured in bytes.\n\nThe transfer rate represents the amount of data that can be read from or written to the storage device per second. Now to calculate IOPS, take the transfer rate and divide it by the average operation size. When drives are unexpectedly absent from the operating system, several factors may contribute to this inconvenience.\n\nOne prevalent cause is disconnected cables where physical connections between the storage device and the system become disrupted, impeding proper communication. Additionally, drive failure itself could be a factor with a malfunctioning or failed drive no longer detected by the operating system due to hardware issues. Alongside these factors, the drives initialization status is significant.\n\nDrive initialization is a process by which the drive is prepared for use by the operating system. It involves creating a partition table and formatting the drive with a file system. This step is crucial, especially for new drives or those previously used with different systems.\n\nWithout proper initialization, the drive may not appear in the operating systems list of available drives. Now, if the drive that happens to be missing is the drive that contains the operating system files, you will likely encounter an error message that reads, bootable device not found. Again, this could likely be a storage drive connection where physical cables connecting the drive containing the OS has become loose or disconnected.\n\nAnother possibility is drive failure where the storage drive itself experiences malfunctions or damage rendering it inaccessible for booting. Additionally, examining the BIOS settings, specifically the boot order to verify that the correct boot device is selected can help rectify configuration related issues. Lastly, we have a missing rate array.\n\nA missing rate array occurs when the system or rate controller is unable to detect one or more of the drives that make up the array. When this happens, the storage system may report that the array is missing, offline or degraded which can prevent access to the data stored within it. Several issues can cause a rate array to appear missing.\n\nOne possibility is a failed or disconnected drive within the array. Loose or damaged data cables, power connections or controller issues can also prevent the system from properly recognizing the drives. In some cases, the raid configuration itself may become corrupted causing the controller to lose track of the array.\n\nWhen a rate array appears to be missing, the first step is to verify that all drives are properly connected and receiving power. Administrators should also check the rate controller interface or management software to determine the status of each drive in the array. Addressing the underlying issue quickly can help restore the array and reduce the risk of potential data loss.", "uyghur": "Exam Objective 5.2 — Drive and RAID Troubleshooting\n\n## LED status indicators\nStorage drive/RAID controller LED color/blink pattern operational status نى كۆرسىتىدۇ. Exact meaning manufacturer غا باغلىق.\n\nCourse مىساللىرى:\n- steady green → normal;\n- flashing red → possible failed drive;\n- amber/orange → warning/caution;\n- activity blinking → data transfer.\n\n## Audible alarm\nRAID/storage system alarm critical issue نى administrator غا بىلدۈرىدۇ. Root causes:\n- failed RAID drive / degraded array;\n- overheating;\n- power supply problem;\n- controller issue.\n\n## HDD grinding/clicking\nMechanical HDD دىن grinding/clicking/ticking ئاۋازى چىقسا read/write head ياكى platter/mechanical failure نىڭ ئېغىر بەلگىسى بولۇشى مۇمكىن.\n\n**Action:** critical data نى دەرھال backup قىلىپ، failing drive نى replace قىلىشقا تەييارلىنىڭ.\n\n## Data loss / corruption\nCauses:\n- failed storage drive;\n- corrupted file system.\n\nPossible response:\n- backup/recovery tools/professional recovery;\n- preventive regular backup;\n- disk diagnostic utilities (Windows `chkdsk`، Unix/macOS file-system checks قاتارلىقلار) بىلەن file-system/disk error نى تەكشۈرۈش.\n\n## RAID failure / degraded array\nIndividual drive failure RAID نى degraded state قا كەلتۈرۈشى مۇمكىن. Redundant RAID level دا failed drive نى replace قىلىپ array rebuild/reconstruction قىلىشقا توغرا كېلىدۇ. Data protection ئۈچۈن تېز diagnosis مۇھىم.\n\n## SMART warning\n**SMART (Self-Monitoring, Analysis and Reporting Technology)** storage drive health metrics نى نازارەت قىلىپ impending failure نى ئالدىن بايقاشقا تىرىشىدۇ.\n\nSMART failure warning كۆرۈنسە:\n1. critical data نى دەرھال backup قىلىڭ.\n2. Drive نى replace قىلىشنى پىلانلاڭ.\n\nSMART file-system checker بىلەن ئوخشاش ئەمەس؛ ئۇ drive health/failure indicators غا ئەھمىيەت بېرىدۇ.\n\n## Extended read/write times\nHDD دا fragmentation data block لارنى تارقاق قىلىپ read/write نى ئاستىلىتىشى مۇمكىن. HDD ئۈچۈن defragmentation data نى contiguous blocks قا قايتا تەرتىپكە سېلىشقا ياردەم بېرىدۇ.\n\n> SSD نى ئادەتتىكى HDD دەك defragment قىلىش لازىم ئەمەس؛ بۇ transcript بۇ بۆلەكتە fragmentation نى HDD بىلەن باغلايدۇ.\n\n### IOPS\n**IOPS (Input/Output Operations Per Second)** storage device بىر سېكۇنتتا قانچە read/write operation بىر تەرەپ قىلالايدىغانلىقىنى كۆرسىتىدىغان performance metric.\n\nCourse نىڭ ئاددىي فورمۇلاسى:\n**IOPS = transfer rate ÷ average operation size**\n\nReal systems دا queue depth، latency، random/sequential workload قاتارلىق ئامىللارمۇ تەسىر قىلىدۇ.\n\n## Drive OS دا كۆرۈنمەيدۇ\nPossible causes:\n- loose/disconnected data or power cable;\n- drive failure;\n- new drive initialize/partition/format قىلىنمىغان.\n\nDrive initialization partition table ۋە file system قۇرۇشنى ئۆز ئىچىگە ئالىدۇ.\n\n## “Bootable device not found”\nPossible causes:\n- OS drive loose/disconnected;\n- drive failed;\n- BIOS/UEFI boot order خاتا;\n- boot files/partition issue بولۇشىمۇ مۇمكىن.\n\n## Missing RAID array\nTranscript تا «rate array» دەپ ئاڭلانغان؛ تېرمىن **RAID array**.\n\nPossible causes:\n- failed/disconnected member drive;\n- loose/damaged data or power cable;\n- RAID controller issue;\n- RAID configuration corruption.\n\nFirst checks:\n- بارلىق drives power/data connection نى verify قىلىڭ.\n- RAID controller/management software دا ھەر drive status نى تەكشۈرۈڭ.\n\n#"}, {"id": "5.3", "number": "5.3", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam objective 5.3, given a scenario, troubleshoot video, projector and display issues. This video segment will cover troubleshooting issues related to displays. For each of the common symptoms listed in exam objective 5.3, I will provide some basic information and possible root causes.\n\nAdditionally, as a pro test taking tip, you should always perform verifications, inspections or checks before performing any repairs or component replacements. Understanding the intricacies of display devices, including monitors and projectors, is crucial for effective troubleshooting, given their pivotal role in various settings like classrooms, conference rooms and various media systems. For our first display issue, we have incorrect input source.\n\nWhile troubleshooting a projector or monitor, this can manifest as a lack of image or an error message like no input signal detected. This common issue often occurs when users inadvertently choose the wrong input source on the display device. However, resolving this issue is relatively straightforward.\n\nBy verifying and adjusting the input source settings to ensure the correct one is selected, you can effectively remedy the situation. Damaged physical cabling can also disrupt various display setups, leading to image and audio signal distortion, or even a complete lack of signal input. These disruptions often stem from loose or damaged cables, connectors or adapters within the system.\n\nTo effectively address these issues, users need to carefully inspect all cables and connections for any signs of damage such as frayed wires, bed pins or worn out connectors. A dim image is yet another display issue where the display image appears significantly darker than desired. This symptom can arise due to various underlying causes.\n\nFirstly, an incorrect brightness setting on the source or display device may be at fault, leading to decreased illumination levels. Additionally, in the case of a monitor, a failed backlight may be responsible for a dim screen. With many modern monitors, a backlight is used to illuminate the display panel, allowing the images to be visible.\n\nIf the backlight fails or malfunctions, it can result in a dim or completely dark display. Furthermore, a malfunctioning inverter within the display may also contribute to the dimness of the screen. The inverter is a component responsible for supplying power to the backlight in older LCD displays.\n\nIf the inverter fails or encounters an issue, it can result in an inadequate power supply to the backlight leading to dimness or flickering in the displayed image on the screen. One method to determine if the inverter or backlight is malfunctioning is to shine a light directly onto the screen and observe for any faint images. If you see an image when shining a light onto the screen, it suggests that the backlight may be malfunctioning or not receiving power as the image is being displayed, but not adequately illuminated.\n\nNext, we have display burn-in. Display burn-in refers to the phenomenon where persistent images or patterns become burned into the display screen over time, resulting in ghost images. This occurs when certain pixels on the display are subjected to prolonged exposure to static images, causing them to degrade at a faster rate compared to surrounding pixels.\n\nTo avoid display burn-in, users can take several measures. One approach is to minimize the display of static images for extended periods. This can be achieved by using screensavers or power-saving features that automatically dim or turn off the display after a period of inactivity.\n\nAdditionally, rotating content or using dynamic wallpapers can help prevent the prolonged exposure of specific pixels to static images. Moving forward, we have dead pixels. These are individual pixels on the display screen that fail to illuminate, resulting in small black spots that remain dark, regardless of the displayed content.\n\nDead pixels can occur due to physical damage to the display panel or prolonged use. To reduce the occurrence of dead pixels, users should handle their displays with care to prevent physical damage. This includes avoiding applying excessive pressure to the screen and keeping the display away from liquids.\n\nIf you come across a display that rapidly switches between being visible and black, you're dealing with a flashing screen. The primary causes of this issue typically involve either cable connections from the source device or electrical malfunctions, such as problems with the backlight or inverter. A poor or loose cable connections between the display and the source device can result in signal interruptions, causing the screen to flicker or flash intermittently.\n\nThis can occur due to loose video cables, as well as damaged connectors or adapters. Ensuring that all cables are securely connected and undamaged is essential to prevent signal disruptions and minimize the occurrence of a flashing screen. Electrical malfunctions within the display, such as issues with the backlight or inverter, can also contribute to a flashing screen.\n\nIf either of these components happens to fail or malfunction, it can result in an irregular power supply to the display, leading to screen flickering or flashing. Do you have a display with distorted, washed out, or inaccurate colors? If so, you might want to check for a faulty cable.\n\nIf cables such as HDMI or VGA suffer damage, it can result in signal degradation or interference, leading to color distortion or imbalance on the screen. Users should regularly inspect cables for signs of wear, fraying, or damaged connector pins, as addressing cable issues can effectively resolve color display problems. In addition to cable damage, misconfigured color settings on the display or source device can also lead to incorrect color display.\n\nUsers should check color settings, such as brightness, contrast, hue, and saturation, to ensure they are correctly configured. Furthermore, display hardware issues, such as malfunctioning components, can also cause incorrect color display. This is especially common in LCD displays where specific areas on the display screen may become noticeably affected.\n\nSizing issues on a display can also interfere with the user's ability to properly view content on the screen. When sizing problems occur, the image may appear stretched, compressed, or may not properly fit within the boundaries of the display. In some cases, portions of the image may extend beyond the edges of the screen, while in other situations the image may appear too small and surrounded by unused space.\n\nOne common cause of sizing issues is an incorrect display resolution setting. If the operating system is configured to use a resolution that does not match the native resolution of the display device, the image may not scale correctly. Adjusting the display resolution to the recommended or native setting often resolves these problems.\n\nAnother possible cause is incorrect scaling or aspect ratio settings within the operating system or the display itself. For example, certain projectors or monitors may have scaling modes that stretch or zoom the image to fill the screen. Reviewing and correcting these display settings can help ensure that the image is displayed at the proper size and proportions.\n\nWhen it comes to projectors, they tend to have some specific issues that users may encounter. One such issue would be intermittent shutdowns during operation. This unexpected powering off is often attributed to overheating.\n\nOverheating can be caused by the accumulation of dust and debris within the projector or a dirty air filter, enduring proper airflow and the effectiveness of cooling mechanisms. Regular maintenance, including cleaning the projector's air filter and ensuring adequate ventilation, is crucial to prevent shutdowns related to overheating. Additionally, users should inspect power connections and inspect internal components if shutdown issues persist after ruling out overheating.\n\nAnother issue you might encounter with a projector is a burnt out bulb. This issue is characterized by no image being projected. The projector bulb, like any other light source, deteriorates over time, leading to diminished brightness and eventually failure.\n\nTo resolve this issue, users should replace the projector bulb following the manufacturer's guidelines. The image a projector produces may also appear fuzzy at times. This issue is characterized by the appearance of a blurry or less than sharp image.\n\nThe fuzzy image may result from various factors, including an out of focus lens or improper resolution setting. Firstly, users should check the focus of the projector lens to ensure it is properly adjusted for sharpness. Additionally, verifying and adjusting the resolution settings on both the projector and the source device can help optimize image clarity.\n\nA distorted image can also occur when the projected image appears stretched, warped or uneven in shape. This type of issue is commonly seen with projectors when the image does not maintain its proper proportions on the display surface. One frequent cause of image distortion is improper projector placement.\n\nIf the projector is positioned at an angle relative to the projection surface, the image may appear wider at one end and narrower at the other. This effect is commonly referred to as keystone distortion. Keystone distortion occurs because the projector is not aligned perpendicular to the screen, causing the projected image to take on a trapezoid shape instead of a proper rectangle.\n\nTo correct this issue, users should first attempt to physically reposition the projector so it is centered and level with the projection surface. Ideally, the projector lens should be aimed directly at the center of the screen to maintain proper image geometry. Many modern projectors also include keystone correction settings that digitally adjust the shape of the image to compensate for the angle of projection.\n\nThese controls allow users to widen or narrow the top or bottom of the image until the picture returns to a rectangular shape. While keystone correction can help fix distorted images, it is generally best to correct the projector's physical placement whenever possible. Proper alignment produces the most accurate image and avoids potential quality loss that can occur when digital keystone correction is heavily applied.\n\nLastly, we have audio issues. Since audio often accompanies video, now is a great time to cover this topic. Audio issues may include distorted audio or no sound at all.\n\nThese issues can stem from various causes, such as incorrect audio settings, faulty cables, or speaker-related problems. To address these issues effectively, users should start by checking the audio settings. Ensuring that the audio output is correctly configured and the correct output devices selected can often resolve issues related to sound playback.\n\nAdditionally, inspecting cables for signs of damage or wear is crucial, as faulty cables can cause signal loss, resulting in audio distortion or no sound output. If cables are found to be faulty, replacing them with new ones can restore proper audio transmission. Furthermore, users should troubleshoot speakers or audio output devices to identify any potential issues with the hardware itself.\n\nThis may involve testing the speakers with other audio sources or connecting alternative output devices to determine if the problem lies with the speakers or at the audio source.", "uyghur": "Exam Objective 5.3 — Video, Projector and Display Troubleshooting\n\n## Incorrect input source\nMonitor/projector دا “No signal” بولسا، ئالدى بىلەن **correct input source** (HDMI/DP/VGA قاتارلىق) تاللانغانلىقىنى تەكشۈرۈڭ.\n\n## Damaged cabling\nLoose/damaged cable، connector ياكى adapter:\n- no image;\n- distorted image/audio;\n- intermittent signal\nكەلتۈرۈپ چىقىرىشى مۇمكىن.\n\nInspect:\n- frayed cable;\n- bent pins;\n- worn/damaged connector.\n\n## Dim image\nPossible causes:\n- brightness setting تۆۋەن;\n- failed backlight;\n- older LCD دا inverter problem.\n\nOlder backlit display دا flashlight نى screen غا تۇتقاندا faint image كۆرۈنسە، image signal بار، ئەمما backlight/inverter ئىشلەمەيۋاتقان بولۇشى مۇمكىن.\n\n## Burn-in / ghost image\nStatic image ئۇزۇن ۋاقىت بىر جايدا تۇرسا display pixel لار uneven aging بولۇپ ghost image قېلىشى مۇمكىن.\n\nPrevention:\n- static image نى ئۇزۇن تۇرغۇزماسلىق;\n- screen timeout/power saving;\n- dynamic content/screensaver.\n\n## Dead pixels\nIndividual pixel يانماي قارا نۇقتا بولۇپ تۇرىدۇ. Physical panel damage ياكى age بىلەن باغلىق بولۇشى مۇمكىن. Screen غا زور بېسىم/سۇيۇقلۇق زىيىنىدىن ساقلاش كېرەك.\n\n## Flickering/flashing screen\nPossible causes:\n- loose/damaged video cable;\n- connector/adapter problem;\n- display power/backlight/inverter fault.\n\n## Incorrect/distorted colors\nPossible causes:\n- damaged HDMI/VGA/display cable;\n- damaged connector pins;\n- brightness/contrast/hue/saturation misconfiguration;\n- display hardware/panel problem.\n\n## Sizing / scaling problem\nImage stretched، compressed، too small ياكى screen edge دىن چىقىپ كەتسە:\n- resolution native resolution بىلەن ماس ئەمەس;\n- scaling/zoom setting خاتا;\n- aspect ratio setting خاتا.\n\nCorrect native/recommended resolution ۋە aspect ratio نى تاللاڭ.\n\n## Projector intermittent shutdown\nكۆپىنچە overheating بىلەن باغلىق:\n- dirty air filter;\n- dust/debris;\n- poor ventilation.\n\nAir filter نى تازىلاپ، ventilation نى ياخشىلاڭ؛ داۋام قىلسا power/internal hardware نى تەكشۈرۈڭ.\n\n## Burnt-out projector bulb\nNo projected image ياكى brightness بەك تۆۋەن بولسا projector lamp/bulb life تۈگىگەن بولۇشى مۇمكىن. Manufacturer instruction بويىچە replace قىلىڭ.\n\n## Fuzzy projector image\nPossible causes:\n- lens focus خاتا;\n- projector/source resolution mismatch.\n\nFocus + resolution نى تەكشۈرۈڭ.\n\n## Keystone / distorted projector image\nProjector screen غا perpendicular/centered ئەمەس، angle دا بولسا trapezoid-shaped **keystone distortion** پەيدا بولىدۇ.\n\nBest fix: projector نى physically center/level قىلىپ screen غا توغرا قارىتىش. Keystone correction setting digital compensate قىلالايدۇ، ئەمما heavy correction image quality نى تۆۋەنلىتىشى مۇمكىن.\n\n## Audio issue with display/projector\nNo sound ياكى distorted sound بولسا:\n- correct audio output device تاللانغانمۇ؟\n- volume/mute/settings؟\n- cable/adapter خرابمۇ؟\n- speaker/output hardware خرابمۇ؟\n\nAlternate speaker/source بىلەن test قىلىپ fault domain نى isolate قىلىڭ.\n\n#"}, {"id": "5.4", "number": "5.4", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam Objective 5.4, Given a Scenario, Troubleshoot Common Mobile Device Issues. This video segment will cover troubleshooting issues related to mobile devices. For each of the common symptoms listed in Exam Objective 5.4, I will provide some basic information and possible root causes.\n\nAdditionally, as a pro test-taking tip, you should always perform verifications, inspections, or checks before performing any repairs or component replacements. In the modern era, mobile devices have evolved from mere communication tools to essential companions in our daily lives, aiding us in everything from work to entertainment. However, despite their sophistication, these devices are not immune to issues that can disrupt their functionality.\n\nUnderstanding common problems and knowing how to troubleshoot them is crucial for users to maximize the utility of their devices. Let's explore some prevalent issues that users may encounter with their mobile devices, starting with improper charging. Improper charging, a common issue encountered by mobile device users, can stem from various causes that require troubleshooting for resolution.\n\nFirstly, a bad cable presents a significant concern, as damaged or faulty charging cables hinder the flow of electricity from the charger to the device. Secondly, a poor connection between the charging cable and the device's port can add to charging issues. This could be due to a loose connection or simply an accumulation of debris within the charging port.\n\nLastly, mismatched power ratings between the charger and the device can pose a significant risk. Using a charger that provides insufficient power may result in slow charging or failure to charge, while using a charger with a higher power rating than required can potentially damage the device's battery over time. Next, poor battery health poses a significant concern for mobile device users.\n\nOne common cause of poor battery health is prolonged usage, where the battery undergoes extensive cycles of charging and discharging, leading to degradation over time. Additionally, as batteries age, they naturally lose their capacity to hold a charge effectively, resulting in decreased overall battery life and performance. Moreover, improper charging can accelerate a battery's decline.\n\nWhen a device feels hot to the touch or fails to retain a charge, it indicates a serious decline in battery health. A swollen battery is a critical issue that demands immediate attention, as it poses serious safety risks to the user and the device itself. Typically recognized by a small bulge in the device casing and potential overheating, a swollen battery indicates internal chemical reactions that leads to gas buildup and expansion within the battery itself.\n\nThis battery expansion causes various physical deformations to the device, often resulting in the inability to click buttons on the trackpad or press keys on the keyboard properly. Additionally, the device may no longer sit level on a flat surface due to the uneven bulge caused by the swollen battery. Furthermore, if the device overheats occasionally, especially while plugged into a wall outlet, it further confirms the poor health status of the battery.\n\nIn such cases, immediate action is crucial to mitigate potential hazards. Users should refrain from using the device and seek professional assistance promptly to replace the swollen battery. Ignoring a swollen battery can lead to catastrophic consequences, including battery leakage, fire, or explosion.\n\nTherefore, addressing this issue promptly is paramount to ensure the safety and functionality of the device and the user. Physically damaged ports present a significant hindrance to the functionality of mobile devices, often manifesting in the inability to charge. This issue arises when the charging port sustains physical damage due to mishandling accidental impacts or exposure to moisture.\n\nUsers may find themselves unable to establish a charging connection despite repeated attempts, indicating a problem with the port's integrity. Additionally, the device may also lose the ability to connect with accessories or peripherals that rely on the port. A great first step in troubleshooting a physically damaged port would involve using a replacement cable to determine whether the port itself is the problem or if the cable is faulty.\n\nOverheating is a concerning issue that can often be linked to the battery's health, especially if it's deteriorating or swollen. But you already know that. So what else can cause overheating?\n\nHow about the prolonged usage and/or the presence of background applications consuming excessive system resources? Yes, that too can lead to overheating as applications put a strain on the device's processor. Additionally, avoiding prolonged use of the device as a Wi-Fi hotspot can help minimize heat generation, as this feature can significantly increase the device's workload and contribute to overheating.\n\nSimilarly, other connection types, such as GPS, should be used judiciously to prevent unnecessary strain on the device's hardware, reducing the likelihood of overheating incidents. When a mobile device encounters liquid damage, it often exhibits telltale signs, such as water being visible under the screen or distortion in the graphic display. Even in the absence of visible indicators, it's crucial to promptly power off the device if liquid damage is suspected.\n\nAfter powering off the device, it is essential to remove any liquid or moisture that is present. If there's suspicion that internal components were exposed, disassembling the device for thorough drying becomes necessary. Once dry, cleaning the circuit boards and contacts would be recommended.\n\nA broken screen is a common issue that compromises both the functionality and aesthetics of a mobile device. When the screen is cracked or shattered, it not only obstructs visibility, but also poses potential safety risks. In such cases, users should consider replacing the screen to restore the device's usability and appearance.\n\nHowever, replacing the screen goes beyond mere visual restoration. It also entails ensuring that essential components, such as the webcam, microphone, and wireless antennas, which are often built into or surround the screen, remain operational. While a broken screen affects the display of visual elements, a misconfigured or damaged digitizer presents a very different set of issues.\n\nA digitizer is responsible for detecting and interpreting touch inputs. When users experience digitizer issues, the screen may appear normal, but touch interactions fail to register accurately or at all. Users may find that despite the screen displaying content as usual, attempts to interact with the device yield no response.\n\nThis can be particularly frustrating when essential functions, such as tapping icons or typing on a virtual keyboard, become impossible. In such cases, troubleshooting may involve adjusting tablet or PC settings to ensure that touchscreen functionality is enabled and properly configured. However, if the device continues to be unresponsive to touch inputs, despite these adjustments, it may indicate a more serious underlying issue requiring component repair or replacement.\n\nAnother related issue that users may encounter involves a stylus that does not work properly with the device. Many tablets and touchscreen laptops support stylus input for tasks such as drawing, handwriting, or precise navigation. When a stylus stops responding, the problem may initially appear similar to a digitizer issue because the device may fail to recognize stylus input altogether.\n\nBut a closer look will usually reveal that the issue is related to the stylus itself rather than the device's touch interface. One possible cause is that the stylus itself has lost power. Some styluses rely on internal batteries or rechargeable power sources.\n\nAnd if the battery becomes depleted, the stylus will no longer communicate properly with the device. Replacing or recharging the stylus battery may resolve the issue. Another potential cause involves connectivity or configuration problems.\n\nCertain styluses connect to the device using Bluetooth or require specific drivers or settings to be enabled. If the stylus is not properly paired or configured, the device may fail to detect it. Finally, physical damage to the stylus tip or internal components may also prevent it from functioning correctly.\n\nIn these cases, inspecting the stylus for visible damage and testing it with a compatible device can help determine whether the stylus itself needs to be repaired or replaced. Cursor drift and touch calibration issues commonly occur when the digitizer of a device becomes misaligned or inaccurate. With cursor drift, users may notice that the cursor on the screen continuously drifts or moves erratically, making precise selection or navigation challenging.\n\nSimilarly, users may encounter difficulties in selecting the intended target with touch inputs failing to register accurately or consistently. To address these issues, recalibrating the touchscreen digitizer is recommended. By initiating the calibration process, a user like you can rectify misalignment issues and restore the responsiveness and accuracy of the touchscreen, allowing you to finally hit that subscribe button.\n\nWhen it comes to Wi-Fi and Bluetooth, poor connectivity or complete lack of connectivity issues can be frustrating and disruptive. When facing a scenario of no connectivity, several factors need to be considered. Firstly, users should check if the adapter is enabled, ensuring that the device is configured to connect to the desired network or peripheral.\n\nAdditionally, verifying that the antenna is properly connected is essential for establishing a stable connection, particularly in wireless communication scenarios. Furthermore, ensuring that peripheral devices like a wireless mouse, keyboard or headset are adequately charged is crucial, as low battery levels can impede connectivity functions. Now, in cases of poor or intermittent connectivity, troubleshooting involves additional considerations.\n\nUsers should ascertain if the device is within range, as proximity plays a significant role in maintaining a stable connection. Additionally, confirming that the devices are properly paired or configured for communication is essential, as incorrect settings can lead to connectivity issues. Finally, users should be mindful of potential signal interference from external sources, such as electronic devices or physical obstacles, which can disrupt wireless signals and cause connectivity disruptions.\n\nNext on the list, we have malware. Malware can pose a significant threat to the functionality and security of mobile devices, often manifesting in various symptoms that disrupt normal operation. When a device exhibits unexpected behavior, such as sluggishness or unresponsiveness, malware or rogue applications should be considered as potential causes.\n\nMalicious software can consume system resources excessively, leading to degraded performance and unresponsiveness to user inputs. Moreover, malware may initiate unauthorized data usage, resulting in unexpected charges or depletion of data allowances. Additionally, certain types of malware have the capability to access sensitive functionalities of the device, such as the camera, microphone, and location services without user consent.\n\nThis invasion of privacy poses serious risks to user data and personal information. Therefore, when encountering unusual behavior on a mobile device, users should remain vigilant and consider the possibility of malware infection. In addition to malware causing degraded performance, users may experience sluggish operation on a mobile device for several other reasons.\n\nDegraded performance is typically characterized by slow application launches, delayed responses to user inputs, or overall unresponsiveness during normal device use. One common cause is having too many background applications running at the same time, which consumes system memory and processing resources. Additionally, insufficient available storage can also lead to performance issues, as mobile operating systems require free space to manage temporary files and application data.\n\nClosing unnecessary applications and freeing up storage space can often help restore normal device performance. Lastly, users may encounter situations where they are unable to install new applications on their mobile device. One common cause of this issue is insufficient available storage.\n\nWhen a device does not have enough free space, the operating system may prevent new applications from being downloaded or installed. This can occur when the device storage is filled with existing applications, photos, videos, or cached data. In some cases, installation restrictions may also be enforced by device settings, parental controls, or mobile device management policies in corporate environments.\n\nThese restrictions are designed to control which applications can be installed and to protect the device or organizational data. To resolve this issue, users should review their device storage and remove unnecessary files or uninstall unused applications to free up space. Additionally, users may need to verify that installation permissions are allowed within the device settings or administrative policies.\n\nOnce sufficient storage becomes available and any restrictions are addressed, the device should be able to successfully download and install new applications.", "uyghur": "Exam Objective 5.4 — Common Mobile Device Issues\n\n## Improper charging\nPossible causes:\n- bad/damaged cable;\n- loose connector;\n- charging port دا debris;\n- charger/device power compatibility problem.\n\nTranscript power rating mismatch نى possible cause دەپ كۆرسىتىدۇ. Troubleshooting دا manufacturer-approved/compatible charger/cable بىلەن test قىلىش بىخەتەر ئۇسۇل.\n\n## Poor battery health\nBattery age ۋە repeated charge/discharge cycles capacity نى تۆۋەنلىتىدۇ. Symptoms:\n- charge تېز تۈگەيدۇ;\n- charge ساقلىمايدۇ;\n- device unusually hot;\n- shutdowns.\n\n## Swollen battery\nCritical safety issue. Signs:\n- case bulge;\n- trackpad/keyboard/button بېسىلمايدۇ;\n- device flat surface ئۈستىدە تەكشى تۇرمايدۇ;\n- overheating.\n\n**Action:** device نى ئىشلىتىش/charging نى توختىتىپ، professional battery replacement قىلىڭ. Swollen lithium battery نى تېشىش، بېسىش ياكى ئائىلە ئەخلەتلىرىگە تاشلاشقا بولمايدۇ؛ fire/explosion risk بار.\n\n## Physically damaged port\nCharging/data/accessory connection ئىشلىمەسلىكى مۇمكىن. ئالدى بىلەن known-good replacement cable بىلەن test قىلىپ cable بىلەن port نى isolate قىلىڭ. Port damage، moisture ياكى impact بەلگىلىرىنى visually inspect قىلىڭ.\n\n## Mobile overheating\nPossible causes:\n- poor/swollen battery;\n- prolonged heavy use;\n- background apps consuming CPU;\n- extended hotspot usage;\n- GPS/other radios نى ئۇزۇن ئىشلىتىش;\n- ambient heat/poor ventilation.\n\n## Liquid damage\nSigns:\n- screen ئاستىدا moisture;\n- display distortion;\n- random malfunction.\n\nSuspected liquid exposure بولسا device نى power off قىلىڭ. Internal cleaning/drying تەلەپ قىلىنسا qualified repair procedure غا ئەمەل قىلىش كېرەك. Powered-on wet electronics further short circuit risk كەلتۈرۈپ چىقىرىدۇ.\n\n## Broken screen\nCracked/shattered display visibility، touch ۋە safety غا تەسىر قىلىدۇ. Display assembly replacement جەريانىدا webcam، microphone، antenna cables قاتارلىق screen ئەتراپىدىكى components نى زىيانغا ئۇچراتماسلىق كېرەك.\n\n## Digitizer / touchscreen problem\nDisplay image normal بولسىمۇ touch register قىلمايدۇ ياكى خاتا register قىلىدۇ.\n\nChecks:\n- touchscreen enabledمۇ؟\n- OS/tablet settings توغرىمۇ؟\n- calibration؟\n- داۋام قىلسا digitizer hardware repair/replacement.\n\n## Stylus not working\nPossible causes:\n- stylus battery dead → charge/replace;\n- Bluetooth pairing/configuration;\n- required driver/settings disabled;\n- stylus tip/internal physical damage.\n\nCompatible device بىلەن test قىلىپ stylus بىلەن digitizer fault نى ئايرىڭ.\n\n## Cursor drift / touch calibration\nCursor ئۆزى سىيرىلىپ، touch target توغرا بولمىسا digitizer calibration نى قايتا قىلىڭ.\n\n## Wi-Fi / Bluetooth connectivity\n**No connectivity:**\n- adapter enabledمۇ؟\n- antenna connectedمۇ؟\n- peripheral battery chargedمۇ؟\n- correct network/device تاللانغانمۇ؟\n\n**Poor/intermittent:**\n- range/distance;\n- pairing/configuration;\n- physical obstacles;\n- RF/EMI interference.\n\n## Malware / rogue apps\nSymptoms:\n- slow/unresponsive;\n- high resource usage;\n- unexpected mobile data use;\n- unauthorized camera/mic/location access;\n- privacy/security risk.\n\nUnexpected behavior كۆرۈنسە malicious/rogue app possibility نى consider قىلىڭ.\n\n## Degraded mobile performance\nOther common causes:\n- too many background apps;\n- RAM/CPU pressure;\n- free storage بەك ئاز.\n\nUnneeded apps نى close قىلىپ، storage space نى بوشىتىش performance نى ياخشىلايدۇ.\n\n## Cannot install application\nPossible causes:\n- insufficient storage;\n- device installation restrictions;\n- parental controls;\n- enterprise MDM policy.\n\nStorage نى بوشىتىپ، app-install permission/policy نى verify قىلىڭ.\n\n#"}, {"id": "5.5", "number": "5.5", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam Objective 5.5, Given a Scenario, Troubleshoot Network Issues. This video segment will cover troubleshooting issues related to networking. For each of the common symptoms listed in Exam Objective 5.5, I will provide some basic information and possible root causes.\n\nAdditionally, as a pro test taking tip, you should always perform verifications, inspections or checks before performing any repairs or component replacements. Troubleshooting networking issues is crucial to maintain a reliable internet connection and ensure seamless communication between devices. One common symptom users may encounter is limited connectivity, which can manifest as the internet connection being down or displaying a message stating no internet access.\n\nWhen faced with limited connectivity, several potential issues could be causing the problem. One common troubleshooting step that can be used to isolate the root cause is to check whether the device has obtained an APIPA address. APIPA addresses are self-assigned IP addresses that devices generate when they fail to obtain an IP address from a DHCP server.\n\nIf the device has an APIPA address, it indicates a problem with the DHCP server or the device's network configuration. Another troubleshooting step involves testing connectivity by trying to communicate with a remote device or IP address. After ruling out software-based causes, you can move on to physical causes.\n\nThese include items like faulty network cables and connections. Slow network speeds is another potential networking issue. When addressing slow network speeds, several factors must be considered to pinpoint the root cause and implement effective solutions.\n\nFirst off, interface configurations, particularly speed and duplex settings, can significantly affect network performance. Incorrectly configured speed and duplex settings may lead to data packet loss or transmission errors, resulting in slow network speeds. Users should ensure that network interface cards and switches are configured to match the network's requirements for optimal performance.\n\nDamaged cables or poor connections can also contribute to slow network speeds. Inspecting cables for signs of wear and tear and securely connecting them to network devices can help mitigate this issue. Network congestion occurs when the volume of data traffic exceeds the network's capacity, leading to packet loss and slower transmission speeds.\n\nIdentifying and addressing congestion points, such as overloaded switches or routers, can help alleviate slow network speeds. Malware infections on network devices can degrade network performance by consuming bandwidth or launching denial of service attacks. Regularly updating antivirus software and conducting network security audits can help detect and remove malware, ensuring optimal network performance.\n\nRegardless of the underlying issue, it will often speed up the troubleshooting process if you determine the scope of the slow network issue. This involves assessing whether the issue exists on a single device, a specific grouping of devices, or the entire network. Next, we have port flapping.\n\nPort flapping refers to a network issue where a port on a network device, such as a switch or router, rapidly alternates between the up and down states. This continuous fluctuation between up and down states, which is essentially the interface turning on and off, disrupts network connectivity. Port flapping typically occurs due to problems with the physical connection, such as a faulty cable or connector, or issues with the network interface card.\n\nExternal interference, such as electromagnetic interference, or EMI, poses a significant threat to the stability and reliability of wired networks. EMI can originate from various sources, including fluorescent lights, power cables, generators, and nearby signals emitted by other electronic devices. When cables are exposed to EMI, it can disrupt the transmission of data signals, leading to packet loss and overall network performance degradation.\n\nTo mitigate the impact of EMI on wired networks, it is essential to implement proper shielding and grounding techniques for network cables. Shielded cables help deflect electromagnetic fields, preventing them from interfering with the data signals. Additionally, ensuring that network cables are routed away from power cables and other potential sources of interference can further minimize the risk of EMI-induced disruptions.\n\nIn wireless network environments, EMI can present unique challenges, particularly in settings where multiple access points are deployed to facilitate wireless connectivity for users. Interference from external sources, such as microwave ovens, cordless telephones, and neighboring Wi-Fi signals can significantly disrupt wireless communication. This interference can lead to intermittent connectivity issues, slow data transfer rates, and overall poor network performance.\n\nTo address EMI-related problems in wireless networks, several strategies can be employed. One approach is to carefully select Wi-Fi channels that are less susceptible to interference from neighboring networks and other electronic devices. Additionally, investing in Wi-Fi equipment that incorporates advanced interference mitigation technologies can help minimize the impact of EMI on network performance.\n\nThese technologies may include signal filtering mechanisms or adaptive channel selection algorithms, which work together to optimize signal quality and reliability in the presence of external interference. Intermittent wireless connectivity, a prevalent issue in wireless networks, can stem from various factors. Alongside the electromagnetic interference we previously discussed, physical obstructions like walls, furniture, or other obstacles can weaken wireless signals, leading to signal loss or degradation.\n\nAdditionally, the distance between a client device and an access point can exacerbate signal attenuation. Moreover, faulty hardware, such as network interface cards or access points, can compound intermittent wireless connectivity problems. If hardware components are malfunctioning or outdated, they may struggle to establish a stable connection or maintain consistent signal strength.\n\nLatency, in simple terms, refers to the time it takes for data to travel from one point to another in a network and is often measured in milliseconds. This can also be thought of as the delay between sending a message and receiving a response. Several factors can contribute to latency issues.\n\nFirstly, the physical distance between devices has a direct impact on latency. Understandably, the farther apart two devices are, the longer it takes for data to travel between them. Additionally, network congestion, resulting from excessive traffic, can lead to delays or even loss of data packets, thereby increasing latency.\n\nThen there is external influences like EMI. Just about anything you can think of that would slow down network speeds would increase latency, as these two properties are inverses of each other. Therefore, addressing latency issues often involves optimizing network configurations or upgrading hardware, as these actions increase overall network speeds.\n\nJitter, in simple terms, refers to the variation in delay or the latency of data in a network. Both latency and jitter are metrics that can be used to measure network performance. But unlike latency, which measures the overall time it takes for data to travel from one point to another, jitter focuses on the inconsistency or fluctuations in the arrival time of data packets.\n\nStated another way, latency represents the average delay between sending a packet and receiving a response, while jitter indicates how much this delay varies over time. Next, we have poor voice over IP quality. This issue is rather self-explanatory and can significantly impact communication clarity and effectiveness.\n\nVoice over IP operates by transmitting voice data over the internet in real time, making it more sensitive to latency and jitter compared to other types of network traffic. Both latency and jitter can cause audio disruptions, such as audio breaking up or voice distortion, making it difficult to understand the other party during a voice over IP call. Since voice over IP relies on real-time transmission, even slight delays or fluctuations in packet arrival times can result in noticeable audio quality degradation.\n\nHigh latency can lead to delays in audio transmission, causing conversations to feel disjointed or out of sync. Similarly, excessive jitter can cause packets to arrive out of order or with inconsistent timing, resulting in audio distortion or dropouts. Addressing poor voice over IP quality involves optimizing network configurations to minimize latency and jitter.\n\nThis may include prioritizing voice over IP traffic over other data types. Additionally, upgrading network hardware and software such as routers and switches can help improve the reliability and stability of voice over IP connections. Authentication failures can also prevent users from successfully connecting to a network.\n\nThis issue occurs when a device attempts to connect to a wireless or secured network but is unable to verify the required credentials. In many cases, authentication failures are caused by entering an incorrect network password or security key. However, they may also occur when there is a mismatch between the security settings configured on the device and those used by the network, such as WPA2 or WPA3 authentication methods.\n\nVerifying the correct password, confirming that the proper wireless security protocol is selected, and reconnecting to the network can often resolve authentication issues. Lastly, users may experience intermittent internet connectivity. This issue occurs when a device remains connected to the network, but internet access repeatedly stops and resumes.\n\nUsers may notice that websites fail to load, applications lose connectivity, or online services temporarily stop responding even though the device still shows a network connection. Intermittent internet connectivity can be caused by an unstable connection from the internet service provider, network congestion, or router performance issues. Restarting networking equipment, checking router configuration, or contacting the internet service provider may help restore a stable connection.", "uyghur": "Exam Objective 5.5 — Network Troubleshooting\n\n## Limited connectivity / No Internet\nDevice network قا ئۇلانغاندەك كۆرۈنسىمۇ Internet يوق بولسا:\n- IP configuration نى تەكشۈرۈڭ.\n- **APIPA (169.254.x.x)** address ئالغانمۇ؟ APIPA ئادەتتە DHCP دىن valid IP ئالالمىغانلىقىنى كۆرسىتىدۇ.\n- DHCP server/path/configuration نى تەكشۈرۈڭ.\n- Remote IP/device غا connectivity test قىلىڭ.\n- Software causes دىن كېيىن physical cable/link نى تەكشۈرۈڭ.\n\n## Slow network speeds\nPossible causes:\n- NIC/switch **speed & duplex mismatch**;\n- damaged/loose cable;\n- network congestion;\n- overloaded switch/router;\n- malware consuming bandwidth/DoS behavior.\n\nScope نى ئېنىقلاڭ:\n- بىر device لامۇ؟\n- بىر group/VLAN/area مۇ؟\n- پۈتۈن network مۇ؟\n\n## Port flapping\nSwitch/router port تېز-تېز **up ↔ down** بولسا port flapping. Root causes:\n- faulty cable/connector;\n- NIC/interface fault;\n- physical instability.\n\n## EMI — Wired\nElectromagnetic interference sources:\n- fluorescent lights;\n- power cables;\n- generators;\n- nearby electronic devices.\n\nEffects:\n- packet loss;\n- errors;\n- degraded speed.\n\nMitigation:\n- shielded cable;\n- proper grounding;\n- network cable نى power cable/EMI source دىن يىراق route قىلىش.\n\n## EMI / interference — Wireless\nSources:\n- microwave oven;\n- cordless phone;\n- neighboring Wi-Fi;\n- other RF devices.\n\nEffects:\n- intermittent Wi-Fi;\n- slow transfer;\n- poor reliability.\n\nMitigation:\n- less-congested channel تاللاش;\n- interference mitigation/adaptive channel equipment;\n- AP/client placement نى ياخشىلاش.\n\n## Intermittent wireless connectivity\nPossible causes:\n- EMI/RF interference;\n- walls/furniture/obstructions;\n- client AP دىن بەك يىراق;\n- faulty/outdated NIC/AP.\n\n## Latency\n**Latency** packet نىڭ source دىن destination غا بېرىپ response قوبۇل قىلىشتىكى delay؛ ئادەتتە milliseconds بىلەن ئۆلچىنىدۇ.\n\nCauses:\n- physical distance;\n- congestion;\n- slow links;\n- packet loss/retransmission;\n- interference;\n- overloaded network devices.\n\n## Jitter\n**Jitter** packet delay نىڭ ۋاقىت بويىچە قانچىلىك ئۆزگىرىدىغانلىقى.\n\n- Latency = delay نىڭ ئۆزى/average delay.\n- Jitter = delay variation/inconsistency.\n\nReal-time voice/video jitter غا سەزگۈر.\n\n## Poor VoIP quality\nVoIP real-time traffic بولغاچقا high latency/jitter:\n- delayed conversation;\n- audio breakup;\n- distortion;\n- dropouts/out-of-order audio\nكەلتۈرۈپ چىقىرىدۇ.\n\nMitigation:\n- QoS بىلەن voice traffic نى priority قىلىش;\n- congestion نى ئازايتىش;\n- router/switch/network path نى optimize/upgrade قىلىش.\n\n## Authentication failure\nWireless/secured network قا join بولمايدۇ:\n- wrong password/security key;\n- client/network security mode mismatch (WPA2/WPA3);\n- saved credential/configuration wrong.\n\nCorrect password ۋە security protocol نى verify قىلىپ reconnect قىلىڭ.\n\n## Intermittent Internet connectivity\nDevice LAN/Wi-Fi connection نى ساقلاپ تۇرسىمۇ Internet قايتا-قايتا ئۈزۈلسە:\n- ISP instability;\n- network congestion;\n- router performance/config issue.\n\nRouter/modem/network equipment نى restart/check قىلىش ۋە لازىم بولسا ISP بىلەن ئالاقىلىشىش.\n\n#"}, {"id": "5.6", "number": "5.6", "domain": "5", "domain_en": "Troubleshooting", "domain_ug": "مەسىلە ھەل قىلىش", "english": "Exam Objective 5.6 Given a Scenario – Troubleshoot Printer Issues This video segment will cover troubleshooting issues related to printers. For each of the issues listed in Exam Objective 5.6, I will provide some basic information and possible root causes. Additionally, as a pro test-taking tip, you should always perform verifications, inspections, or checks before performing any repairs or component replacements.\n\nTroubleshooting and resolving printer issues can often be a frustrating yet essential task to maintain smooth operations and high-quality print outputs. When encountering specific symptoms, it's crucial to identify potential causes and apply appropriate solutions. For instance, imagine you have encountered some unintended vertical lines that are ruining your printed pages.\n\nWhat do you do? For this printer issue, and with most printer issues, there are many potential causes. As for a general first step, you should consider which type of printer you are working with.\n\nWhether you are working with an inkjet printer, laser printer, thermal, or impact printer can make a world of difference. Now back to this issue of lines down the printed page. In a laser printer, this could be caused by an accumulation of debris on the photosensitive drum.\n\nSimilarly, scratches on the imaging drum can produce similar results as the drum rotates during printing. Issues with the fuser roller in a laser printer, whet
